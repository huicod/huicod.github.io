<text x="580.0" y="1815.5" class="nodehead" text-anchor="middle">预测干净动作</text>
<text x="580.0" y="1845.5" class="t" text-anchor="middle">扩散调度器更新 xₜ₋₁</text>
<path d="M580 1725 V1780" class="line"/>
