<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="2520" viewBox="0 0 1180 2520" role="img" aria-labelledby="title desc">
<title id="title">用文本对齐动作内容与参考风格：训练、SASI 与推理</title>
<desc id="desc">两阶段训练冻结基础文本生成器，通过自参考重建及髋部速度损失训练风格适配器。推理将文本、参考动作与噪声送入多尺度去噪器，SASI 用两张文本注意力的矩阵乘积选择风格。下方区分论文的风格迁移与关键帧补间演示。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#52667a"/></marker><marker id="dasharrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#8893a1"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#20344b}.t{font-size:23px}.small{font-size:20px}.head{font-size:27px;font-weight:700}.nodehead{font-size:24px;font-weight:700}.line{fill:none;stroke:#52667a;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#8893a1;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#dasharrow)}</style>
<rect width="1180" height="2520" fill="#ffffff"/>
<text x="590" y="48" class="head" text-anchor="middle">用文本对齐动作内容与参考风格</text>
<text x="590" y="84" class="small" text-anchor="middle">SIGGRAPH 2025 · SASI 是风格注入模块 · 根据原文重绘的教学示意</text>
<rect x="25" y="120" width="1130" height="585" rx="20" fill="#fafcfe" stroke="#c9d6e2" stroke-width="2"/>
<text x="52" y="160" class="head" text-anchor="start">A  两阶段训练：风格标签不参与基础适配器训练</text>
<text x="52" y="193" class="small" text-anchor="start">单张 RTX 4090 · batch 64　蓝：基础模型　橙：风格分支　虚线：复用/监督</text>
<rect x="60" y="220" width="270" height="100" rx="13" fill="#eef6ff" stroke="#94b8df" stroke-width="1.8"/>
<text x="195.0" y="248.0" class="nodehead" text-anchor="middle">HumanML3D 配对数据</text>
<text x="195.0" y="278.0" class="t" text-anchor="middle">动作 x₀ 加噪得 xₜ</text>
<text x="195.0" y="308.0" class="t" text-anchor="middle">文本编码 + 时间 t</text>
<rect x="420" y="220" width="325" height="100" rx="13" fill="#eef6ff" stroke="#94b8df" stroke-width="1.8"/>
<text x="582.5" y="248.0" class="nodehead" text-anchor="middle">阶段一：文本扩散模型</text>
<text x="582.5" y="278.0" class="t" text-anchor="middle">9 层 Conv1D U-Net</text>
<text x="582.5" y="308.0" class="t" text-anchor="middle">20 万步 · 学习文本对齐</text>
<rect x="835" y="220" width="265" height="100" rx="13" fill="#eaf7f1" stroke="#80bba3" stroke-width="1.8"/>
<text x="967.5" y="248.0" class="nodehead" text-anchor="middle">预测干净动作 x̂₀</text>
<text x="967.5" y="278.0" class="t" text-anchor="middle">与真实 x₀ 比较</text>
<text x="967.5" y="308.0" class="t" text-anchor="middle">重建 MSE</text>
<path d="M330 270 H420" class="line"/>
<path d="M745 270 H835" class="line"/>
<text x="63" y="367" class="nodehead" text-anchor="start">阶段二：冻结基础模型，训练 CNN 风格编码器与 SASI 新分支</text>
<rect x="60" y="398" width="310" height="105" rx="13" fill="#fff4e6" stroke="#d4ab75" stroke-width="1.8"/>
<text x="215.0" y="428.5" class="nodehead" text-anchor="middle">目标动作的部分片段</text>
<text x="215.0" y="458.5" class="t" text-anchor="middle">论文：随机保留 50%–75%</text>
<text x="215.0" y="488.5" class="t" text-anchor="middle">作为同风格自参考</text>
<rect x="440" y="398" width="310" height="105" rx="13" fill="#fff4e6" stroke="#d4ab75" stroke-width="1.8"/>
<text x="595.0" y="428.5" class="nodehead" text-anchor="middle">风格金字塔 + SASI</text>
<text x="595.0" y="458.5" class="t" text-anchor="middle">结合 xₜ、t、内容文本</text>
<text x="595.0" y="488.5" class="t" text-anchor="middle">8 万步 · 重建目标动作</text>
<rect x="60" y="540" width="310" height="105" rx="13" fill="#fff4e6" stroke="#d4ab75" stroke-width="1.8"/>
<text x="215.0" y="570.5" class="nodehead" text-anchor="middle">随机另一条训练动作</text>
<text x="215.0" y="600.5" class="t" text-anchor="middle">作为不同内容的参考</text>
<text x="215.0" y="630.5" class="t" text-anchor="middle">同一 xₜ、t、内容文本</text>
<rect x="440" y="540" width="310" height="105" rx="13" fill="#f4f6f9" stroke="#b5bfca" stroke-width="1.8"/>
<text x="595.0" y="570.5" class="nodehead" text-anchor="middle">基础路径 vs 风格路径</text>
<text x="595.0" y="600.5" class="t" text-anchor="middle">比较预测的 hip velocity</text>
<text x="595.0" y="630.5" class="t" text-anchor="middle">约束内容与节奏</text>
<rect x="835" y="420" width="265" height="200" rx="13" fill="#eaf7f1" stroke="#80bba3" stroke-width="1.8"/>
<text x="967.5" y="483.0" class="nodehead" text-anchor="middle">联合训练目标</text>
<text x="967.5" y="513.0" class="t" text-anchor="middle">重建 MSE</text>
<text x="967.5" y="543.0" class="t" text-anchor="middle">+ 0.5 × 内容损失</text>
<text x="967.5" y="573.0" class="t" text-anchor="middle">软约束，不锁定全部姿态</text>
<path d="M370 450 H440" class="line"/>
<path d="M370 592 H440" class="line"/>
