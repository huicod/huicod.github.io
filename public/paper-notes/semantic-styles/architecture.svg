<text x="590" y="681" class="small" text-anchor="middle">SASI 复用冻结 Q/K；公开实现还训练风格归一化与零初始化输出卷积。</text>
<rect x="25" y="740" width="1130" height="1255" rx="20" fill="#fafcfe" stroke="#c9d6e2" stroke-width="2"/>
<text x="52" y="780" class="head" text-anchor="start">B  默认推理：文本决定内容，参考动作提供风格</text>
<text x="52" y="813" class="small" text-anchor="start">训练完成后复用模型；不输入真实目标动作，也不需要风格类别标签。</text>
<rect x="60" y="850" width="300" height="85" rx="13" fill="#eef6ff" stroke="#94b8df" stroke-width="1.8"/>
<text x="210.0" y="885.5" class="nodehead" text-anchor="middle">内容文本</text>
<text x="210.0" y="915.5" class="t" text-anchor="middle">例如：出拳 → 闪避 → 后退</text>
<rect x="430" y="850" width="300" height="85" rx="13" fill="#fff4e6" stroke="#d4ab75" stroke-width="1.8"/>
<text x="580.0" y="885.5" class="nodehead" text-anchor="middle">参考动作序列</text>
<text x="580.0" y="915.5" class="t" text-anchor="middle">例如：职业拳击手动作</text>
<rect x="800" y="850" width="300" height="85" rx="13" fill="#f4f6f9" stroke="#b5bfca" stroke-width="1.8"/>
<text x="950.0" y="885.5" class="nodehead" text-anchor="middle">随机高斯噪声 xT</text>
<text x="950.0" y="915.5" class="t" text-anchor="middle">指定目标动作长度</text>
<rect x="60" y="980" width="300" height="90" rx="13" fill="#eef6ff" stroke="#94b8df" stroke-width="1.8"/>
<text x="210.0" y="1018.0" class="nodehead" text-anchor="middle">文本编码 cₜ</text>
<text x="210.0" y="1048.0" class="t" text-anchor="middle">保留 token 级语义</text>
<rect x="430" y="980" width="300" height="90" rx="13" fill="#fff4e6" stroke="#d4ab75" stroke-width="1.8"/>
<text x="580.0" y="1018.0" class="nodehead" text-anchor="middle">5 层 CNN 风格金字塔</text>
<text x="580.0" y="1048.0" class="t" text-anchor="middle">多时间尺度特征 cₛⁱ</text>
<rect x="800" y="980" width="300" height="90" rx="13" fill="#f4f6f9" stroke="#b5bfca" stroke-width="1.8"/>
<text x="950.0" y="1018.0" class="nodehead" text-anchor="middle">当前带噪动作 xₜ + t</text>
<text x="950.0" y="1048.0" class="t" text-anchor="middle">U-Net 中间特征 xⁱ</text>
<path d="M210 935 V980" class="line"/>
<path d="M580 935 V980" class="line"/>
<path d="M950 935 V980" class="line"/>
<rect x="60" y="1140" width="1040" height="130" rx="13" fill="#eef6ff" stroke="#94b8df" stroke-width="1.8"/>
<text x="580.0" y="1183.0" class="nodehead" text-anchor="middle">SASI 内部：在相同文本空间中比较两段动作</text>
<text x="580.0" y="1213.0" class="t" text-anchor="middle">Aₓ = softmax(Qₓ Kₜᵀ / √d)      Aₛ = softmax(Qₛ Kₜᵀ / √d)</text>
<text x="580.0" y="1243.0" class="t" text-anchor="middle">两路共用基础模型的冻结 WQ、WK；不是直接对参考帧做硬匹配</text>
<path d="M210 1070 V1140" class="line"/>
<path d="M580 1070 V1140" class="line"/>
<path d="M950 1070 V1140" class="line"/>
<rect x="80" y="1330" width="430" height="90" rx="13" fill="#eef6ff" stroke="#94b8df" stroke-width="1.8"/>
<text x="295.0" y="1368.0" class="nodehead" text-anchor="middle">动作—风格对应 B</text>
<text x="295.0" y="1398.0" class="t" text-anchor="middle">B = row-normalize(Aₓ Aₛᵀ)</text>
<rect x="650" y="1330" width="430" height="90" rx="13" fill="#fff4e6" stroke="#d4ab75" stroke-width="1.8"/>
<text x="865.0" y="1368.0" class="nodehead" text-anchor="middle">风格 value 特征 Vₛ</text>
<text x="865.0" y="1398.0" class="t" text-anchor="middle">参考 cₛⁱ → 可学习投影</text>
<path d="M295 1270 V1330" class="line"/>
<path d="M865 1270 V1330" class="line"/>
<text x="690" y="1310" class="small" text-anchor="middle">参考 cₛⁱ 送入 value 分支</text>
<rect x="350" y="1480" width="460" height="95" rx="13" fill="#fff4e6" stroke="#d4ab75" stroke-width="1.8"/>
<text x="580.0" y="1520.5" class="nodehead" text-anchor="middle">风格特征加权读取</text>
<text x="580.0" y="1550.5" class="t" text-anchor="middle">x_style = B Vₛ</text>
<path d="M295 1420 V1450 H480 V1480" class="line"/>
<path d="M865 1420 V1450 H680 V1480" class="line"/>
<rect x="350" y="1630" width="460" height="95" rx="13" fill="#eef6ff" stroke="#94b8df" stroke-width="1.8"/>
<text x="580.0" y="1670.5" class="nodehead" text-anchor="middle">注入对应尺度的 U-Net 层</text>
<text x="580.0" y="1700.5" class="t" text-anchor="middle">x_out = x + x_text + x_style</text>
<path d="M580 1575 V1630" class="line"/>
