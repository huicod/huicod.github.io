<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1060" width="960" height="1060" role="img" aria-labelledby="title desc"><title id="title">MUNITE：在多个输出之间共享一个潜样本</title><desc id="desc">条件流根据任意观测子集抽一次共享潜变量，并行解码目标；训练端包含跨模态重建、强弱证据自蒸馏和对比学习。</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#47736e"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1c363a}.large{font-size:34px;font-weight:700}.section{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#48616b}</style>
<rect width="960" height="1060" rx="18" fill="#f9faf6"/>
<text x="36" y="50" class="large">MUNITE · 多个输出共用一次抽样</text>
<text x="36" y="83" class="body">给定任意观测子集，推断与证据相容的完整观测潜表示 W。</text>
<path d="M36 106 H924" stroke="#d3dfd6" stroke-width="1"/>
<rect x="36" y="133" width="269" height="107" rx="12" fill="#e5f2ed" stroke="#a7c8b8" stroke-width="1.6"/>
<text x="54" y="165" class="label">观察到的模态</text>
<text x="54" y="194" class="body">各模态保留独立 token 流。</text>
<text x="54" y="219" class="body">也可以没有任何观测。</text>
<rect x="341" y="133" width="279" height="107" rx="12" fill="#f8f0d9" stroke="#d5c28f" stroke-width="1.6"/>
<text x="359" y="165" class="label">潜寄存器</text>
<text x="359" y="194" class="body">起点是高斯查询；采样途中</text>
<text x="359" y="219" class="body">输入当前带噪状态和时间。</text>
<rect x="656" y="133" width="268" height="107" rx="12" fill="#fff" stroke="#ced9d5" stroke-width="1.6"/>
<text x="674" y="165" class="label">各自保留的信息</text>
<text x="674" y="194" class="body">模态之间不直接注意；</text>
<text x="674" y="219" class="body">寄存器跨模态汇总证据。</text>
<path d="M170 240 V266 H362 V286" stroke="#47736e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/>
<path d="M480 240 V286" stroke="#47736e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/>
<path d="M790 240 V266 H598 V286" stroke="#47736e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="160" y="289" width="640" height="105" rx="12" fill="#eaf1f7" stroke="#a9c2d5" stroke-width="1.6"/>
<text x="178" y="321" class="label">共享条件流 · Transformer</text>
<text x="178" y="350" class="body">每层寄存器从已观测的流读取信息，预测干净潜表示。</text>
<text x="178" y="375" class="body">从噪声积分，得到这一次的共享选择 W。</text>
<path d="M800 335 H865 V276 H715 V286" stroke="#47736e" stroke-width="2" stroke-dasharray="5 5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/>
<text x="872" y="310" class="small">迭代</text>
<path d="M480 394 V426" stroke="#47736e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="241" y="429" width="478" height="79" rx="12" fill="#f8f0d9" stroke="#d5c28f" stroke-width="1.6"/>
<text x="259" y="461" class="label">一个 W 分给所有目标</text>
<text x="259" y="490" class="body">只抽一次；多次生成可以抽到不同的 W。</text>
<path d="M480 508 V533 H175 V557" stroke="#47736e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/>
<path d="M480 508 V557" stroke="#47736e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/>
<path d="M480 533 H785 V557" stroke="#47736e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="36" y="560" width="280" height="114" rx="12" fill="#e5f2ed" stroke="#a7c8b8" stroke-width="1.6"/>
<text x="54" y="592" class="label">生成图像</text>
<text x="54" y="621" class="body">图像特征流 → Stable unCLIP</text>
<text x="54" y="646" class="body">图文声配置的渲染路径</text>
<rect x="340" y="560" width="280" height="114" rx="12" fill="#e5f2ed" stroke="#a7c8b8" stroke-width="1.6"/>
<text x="358" y="592" class="label">生成文字</text>
<text x="358" y="621" class="body">W → 前缀 → Gemma</text>
<text x="358" y="646" class="body">按目标需要启用</text>
<rect x="644" y="560" width="280" height="114" rx="12" fill="#e5f2ed" stroke="#a7c8b8" stroke-width="1.6"/>
<text x="662" y="592" class="label">生成声音</text>
<text x="662" y="621" class="body">音频特征网络 → AudioLDM</text>
<text x="662" y="646" class="body">各解码器可有私有随机性</text>
<path d="M36 709 H924" stroke="#d3dfd6" stroke-width="1"/>
<text x="36" y="748" class="section">训练时怎样学到 W</text>
<rect x="36" y="772" width="278" height="167" rx="12" fill="#fff" stroke="#ced9d5" stroke-width="1.6"/>
<text x="54" y="804" class="label">跨模态重建</text>
<text x="54" y="833" class="body">学习生成可用目标。</text>
<text x="54" y="858" class="body">若目标也在输入内，在通往</text>
<text x="54" y="883" class="body">寄存器的目标 K/V 路径</text>
<text x="54" y="908" class="body">阻断该重建损失的梯度。</text>
<rect x="340" y="772" width="278" height="167" rx="12" fill="#f8f0d9" stroke="#d5c28f" stroke-width="1.6"/>
<text x="358" y="804" class="label">富证据 → 少证据</text>
<text x="358" y="833" class="body">同一网络、同一中间状态。</text>
<text x="358" y="858" class="body">富证据预测停止梯度，</text>
<text x="358" y="883" class="body">监督只看到较少模态的</text>
<text x="358" y="908" class="body">分支。</text>
<rect x="644" y="772" width="280" height="167" rx="12" fill="#fff" stroke="#ced9d5" stroke-width="1.6"/>
<text x="662" y="804" class="label">互补观测对比</text>
<text x="662" y="833" class="body">同一样本的两个互补</text>
<text x="662" y="858" class="body">观测子集作为正对，</text>
<text x="662" y="883" class="body">其他样本用作负例。</text>
<text x="36" y="981" class="body">实测共享形状：数字视图 4 × 8，人脸 64 × 8，图文声 1 × 768。</text>
<text x="36" y="1020" class="small">教学示意　根据原文图 1–3、式 1–2 和附录 C–D 绘制。</text>
</svg>
