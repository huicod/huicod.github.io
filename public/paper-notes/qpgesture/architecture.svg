<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1450" viewBox="0 0 1040 1450" role="img" aria-labelledby="title desc"><title id="title">QPGesture 的训练、建库与生成</title><desc id="desc">动作码和运动相位分别学习。推理时先按音频及文本分别检索候选，再比较动作接缝的相位，迭代选码并解码。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#416e76"/></marker></defs><rect width="1040" height="1450" fill="#f8f7f1"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#19343b"><text x="35" y="42" font-size="20" fill="#147972" font-weight="700">CVPR 2023   /   共语手势</text><text x="35" y="93" font-size="43" fill="#15363d" font-weight="700">QPGesture</text><text x="35" y="135" font-size="25" fill="#263e43" font-weight="400">语音与文字各提出一个候选，动作相位决定接入哪一段。</text><rect x="20" y="170" width="1000" height="402" rx="18" fill="#fff" stroke="#d4ded9" stroke-width="1.7"/><text x="46" y="211" font-size="21" fill="#147972" font-weight="700">01</text><text x="99" y="211" font-size="26" fill="#173c43" font-weight="700">离线学习与建库</text><text x="47" y="245" font-size="20" fill="#42616a" font-weight="400">每条训练样本有同步语音、带词时间戳的转写和上身动捕。</text><rect x="45" y="271" width="300" height="139" rx="14" fill="#eaf3ea" stroke="none" stroke-width="1.7"/><text x="62" y="305" font-size="23" fill="#153f45" font-weight="700">手势 VQ-VAE</text><text x="62" y="340" font-size="21" fill="#263e43" font-weight="400">时序编码 → 最近码向量</text><text x="62" y="369" font-size="21" fill="#263e43" font-weight="400">每 8 帧对应一个码</text><text x="62" y="398" font-size="21" fill="#263e43" font-weight="400">训练时解码重建运动</text><rect x="370" y="271" width="300" height="139" rx="14" fill="#eedff1" stroke="none" stroke-width="1.7"/><text x="387" y="305" font-size="23" fill="#153f45" font-weight="700">周期自编码器</text><text x="387" y="340" font-size="21" fill="#263e43" font-weight="400">从动作提取周期参数</text><text x="387" y="369" font-size="21" fill="#263e43" font-weight="400">振幅与相位构成相位向量</text><text x="387" y="398" font-size="21" fill="#263e43" font-weight="400">以动作重建训练</text><rect x="695" y="271" width="300" height="139" rx="14" fill="#f8eed7" stroke="none" stroke-width="1.7"/><text x="712" y="305" font-size="23" fill="#153f45" font-weight="700">语音与转写</text><text x="712" y="340" font-size="21" fill="#263e43" font-weight="400">vq-wav2vec → 音码</text><text x="712" y="369" font-size="21" fill="#263e43" font-weight="400">Sentence-BERT → 句向量</text><text x="712" y="398" font-size="21" fill="#263e43" font-weight="400">按动作码位置取上下文</text><path d="M195 410 V432 H845 V410" fill="none" stroke="#416e76" stroke-width="2.6" stroke-linejoin="round" /><path d="M520 410 V453" fill="none" stroke="#416e76" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="82" y="453" width="876" height="96" rx="14" fill="#e4f1f2" stroke="none" stroke-width="1.7"/><text x="99" y="487" font-size="23" fill="#153f45" font-weight="700">说话人动作库</text><text x="99" y="522" font-size="21" fill="#263e43" font-weight="400">按码记录每次出现的位置、可续接的片段、语音与文本特征及动作相位。</text><rect x="20" y="595" width="1000" height="404" rx="18" fill="#fff" stroke="#d4ded9" stroke-width="1.7"/><text x="46" y="636" font-size="21" fill="#147972" font-weight="700">02</text><text x="99" y="636" font-size="26" fill="#173c43" font-weight="700">按查询上下文找候选</text><text x="47" y="670" font-size="20" fill="#42616a" font-weight="400">输入为新语音、转写与上次选中片段的末码。初始码可随机选择或取高频码。</text><rect x="45" y="696" width="300" height="115" rx="14" fill="#f8eed7" stroke="none" stroke-width="1.7"/><text x="62" y="730" font-size="23" fill="#153f45" font-weight="700">音频榜</text><text x="62" y="765" font-size="21" fill="#263e43" font-weight="400">取当前窗口的离散音码</text><text x="62" y="794" font-size="21" fill="#263e43" font-weight="400">用编辑距离匹配库中语音</text><rect x="370" y="696" width="300" height="115" rx="14" fill="#eaf3ea" stroke="none" stroke-width="1.7"/><text x="387" y="730" font-size="23" fill="#153f45" font-weight="700">姿态榜</text><text x="387" y="765" font-size="21" fill="#263e43" font-weight="400">比较种子码与候选码</text><text x="387" y="794" font-size="21" fill="#263e43" font-weight="400">对应关节姿态的欧氏距离</text><rect x="695" y="696" width="300" height="115" rx="14" fill="#f8eed7" stroke="none" stroke-width="1.7"/><text x="712" y="730" font-size="23" fill="#153f45" font-weight="700">文本榜</text><text x="712" y="765" font-size="21" fill="#263e43" font-weight="400">取当前转写上下文的句向量</text><text x="712" y="794" font-size="21" fill="#263e43" font-weight="400">按余弦距离匹配库中描述</text><path d="M195 811 V846 H263 V872" fill="none" stroke="#416e76" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M520 811 V840 H308 V872" fill="none" stroke="#416e76" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M520 840 H732 V872" fill="none" stroke="#416e76" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M845 811 V846 H777 V872" fill="none" stroke="#416e76" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="82" y="873" width="425" height="95" rx="14" fill="#e4f1f2" stroke="none" stroke-width="1.7"/><text x="99" y="907" font-size="23" fill="#153f45" font-weight="700">声学候选</text><text x="99" y="942" font-size="21" fill="#263e43" font-weight="400">音频名次＋姿态名次，取排名最优。</text><rect x="533" y="873" width="425" height="95" rx="14" fill="#e4f1f2" stroke="none" stroke-width="1.7"/><text x="550" y="907" font-size="23" fill="#153f45" font-weight="700">语义候选</text><text x="550" y="942" font-size="21" fill="#263e43" font-weight="400">文本名次＋姿态名次，取排名最优。</text><rect x="20" y="1022" width="1000" height="352" rx="18" fill="#fff" stroke="#d4ded9" stroke-width="1.7"/><text x="46" y="1063" font-size="21" fill="#147972" font-weight="700">03</text><text x="99" y="1063" font-size="26" fill="#173c43" font-weight="700">选段、更新与解码</text><text x="47" y="1097" font-size="20" fill="#42616a" font-weight="400">同一个前段末尾分别与两个候选开头拼接，比较接缝短窗的相位。</text><rect x="45" y="1124" width="292" height="143" rx="14" fill="#eedff1" stroke="none" stroke-width="1.7"/><text x="62" y="1158" font-size="23" fill="#153f45" font-weight="700">相位比较</text><text x="62" y="1193" font-size="21" fill="#263e43" font-weight="400">衡量接缝窗口的</text><text x="62" y="1222" font-size="21" fill="#263e43" font-weight="400">相位向量余弦相似度</text><text x="62" y="1251" font-size="21" fill="#263e43" font-weight="400">选择较连续的片段</text><rect x="374" y="1124" width="292" height="143" rx="14" fill="#e4f1f2" stroke="none" stroke-width="1.7"/><text x="391" y="1158" font-size="23" fill="#153f45" font-weight="700">追加动作码</text><text x="391" y="1193" font-size="21" fill="#263e43" font-weight="400">将选中片段加入序列</text><text x="391" y="1222" font-size="21" fill="#263e43" font-weight="400">更新末码与末端相位</text><text x="391" y="1251" font-size="21" fill="#263e43" font-weight="400">推进到下一处查询</text><rect x="703" y="1124" width="292" height="143" rx="14" fill="#eaf3ea" stroke="none" stroke-width="1.7"/><text x="720" y="1158" font-size="23" fill="#153f45" font-weight="700">VQ 动作解码器</text><text x="720" y="1193" font-size="21" fill="#263e43" font-weight="400">将选定的码序列</text><text x="720" y="1222" font-size="21" fill="#263e43" font-weight="400">还原为连续关节旋转</text><text x="720" y="1251" font-size="21" fill="#263e43" font-weight="400">输出上身手势动画</text><path d="M337 1193 H370" fill="none" stroke="#416e76" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M666 1193 H699" fill="none" stroke="#416e76" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="47" y="1323" font-size="21" fill="#263e43" font-weight="400">接续时重复第 02、03 步。相位来自候选动作，由它评价两段能否连贯衔接。</text><text x="35" y="1416" font-size="20" fill="#46676d" font-weight="400">依据 Yang 等，CVPR 2023，正文图 2–4、§3 与补充算法 1 原创整理。</text></g></svg>
