<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1140" viewBox="0 0 800 1140" role="img" aria-labelledby="title desc">
  <title id="title">SFControl 如何从稀疏关节约束生成逐帧全身动作</title>
  <desc id="desc">生成时，可以指定关节坐标和帧号，也可以给关节定义可微目标。前者在带噪轨迹中写入已知位置，后者反向优化第一阶段的扩散噪声。第一阶段生成六个关键关节的完整轨迹与根朝向。将轨迹转换坐标后，第二个扩散模型补全全身动作。训练时两个模型分别使用真实轨迹学习去噪。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#48676e"/>
    </marker>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#183b46}
      .title{font-size:27px;font-weight:700}.section{font-size:22px;font-weight:700}
      .head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#47616a}
      .p1{fill:#f0f6f4;stroke:#b8cec8}.p2{fill:#edf3f8;stroke:#bed0dc}
      .explicit{fill:#fff;stroke:#9fbeb6}.implicit{fill:#fff;stroke:#bcb0c6}
      .flowbox{fill:#deeee7;stroke:#9cbfb2}.posebox{fill:#fff;stroke:#acbfce}
      .trainbox{fill:#fbf7ef;stroke:#cdbd9e;stroke-dasharray:5 4}
      .p1,.p2,.explicit,.implicit,.flowbox,.posebox,.trainbox{stroke-width:1.4}
      .arrow,.stem{fill:none;stroke:#48676e;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
      .arrow{marker-end:url(#arrow)}.guide{stroke:#aabbb9;stroke-width:1.2;fill:none}
    </style>
  </defs>
  <rect width="800" height="1140" rx="16" fill="#fdfdfa"/>
  <text x="24" y="42" class="title">SFControl 如何从几个关节落点生成全身动作？</text>
  <text x="25" y="70" class="body">两阶段共用语义条件。文字或动作标签说明要做什么，关节约束规定空间要求。</text>

  <rect class="p1" x="16" y="93" width="768" height="540" rx="14"/>
  <text x="33" y="129" class="section">第一阶段　生成完整的关键关节轨迹</text>
  <g class="node">
    <rect class="explicit" x="34" y="152" width="352" height="174" rx="10"/>
    <text class="head" x="50" y="180">显式输入　关节、帧号和坐标</text>
    <text class="body" x="50" y="209">例如，只在选中的帧给出右腕位置。</text>
    <text class="body" x="50" y="234">二值掩码标记哪些坐标已知。</text>
    <path d="M59 275 H351 M65 269 V281 M115 269 V281 M165 269 V281 M215 269 V281 M265 269 V281 M315 269 V281" class="guide"/>
    <g fill="#217968"><circle cx="65" cy="275" r="5"/><circle cx="165" cy="275" r="5"/><circle cx="315" cy="275" r="5"/></g>
    <text class="small" x="50" y="310">时间轴上的绿点代表给定坐标的帧。</text>
  </g>
  <g class="node">
    <rect class="implicit" x="414" y="152" width="352" height="174" rx="10"/>
    <text class="head" x="430" y="180">隐式输入　轨迹上的可微目标</text>
    <text class="body" x="430" y="209">例如，给出三维曲线和起止时间，</text>
    <text class="body" x="430" y="234">让角色自行决定每帧沿曲线走多远。</text>
    <path d="M447 278 C488 279 492 248 532 258 S580 288 625 269 S688 251 725 265" fill="none" stroke="#876a96" stroke-width="3"/>
    <g fill="#876a96"><circle cx="447" cy="278" r="4.5"/><circle cx="725" cy="265" r="4.5"/></g>
    <text class="small" x="430" y="310">曲线的两端界定时间窗内要走的路。</text>
  </g>
  <path class="arrow" d="M210 326 V349"/>
  <path class="arrow" d="M590 326 V349"/>
  <g class="node">
    <rect class="explicit" x="34" y="352" width="352" height="127" rx="10"/>
    <text class="head" x="50" y="380">在已知位置写回干净坐标</text>
    <text class="body" x="50" y="409">每个去噪步，用给定值覆盖掩码位置，</text>
    <text class="body" x="50" y="433">再拼上掩码交给轨迹模型 D<tspan baseline-shift="sub" font-size="12">c</tspan>，</text>
    <text class="body" x="50" y="457">由它预测整段关键关节运动。</text>
  </g>
  <g class="node">
    <rect class="implicit" x="414" y="352" width="352" height="127" rx="10"/>
    <text class="head" x="430" y="380">通过同一轨迹模型迭代优化噪声</text>
    <text class="body" x="430" y="409">对两条曲线按弧长重采样，比较对应</text>
    <text class="body" x="430" y="433">点的位置及总长。把损失梯度传回噪声，</text>
    <text class="body" x="430" y="457">再用更新后的噪声生成轨迹。</text>
  </g>
  <path class="stem" d="M210 479 V494 H590 V479"/>
  <path class="arrow" d="M400 494 V510"/>
  <g class="node">
    <rect class="flowbox" x="81" y="513" width="638" height="96" rx="10"/>
    <text class="head" x="99" y="545">中间结果　N 帧 × 19 维轨迹</text>
    <text class="body" x="99" y="572">每帧有骨盆、头、双腕、双脚的全局三维坐标（6 × 3），</text>
    <text class="body" x="99" y="595">以及根部绕竖直轴的一个朝向角。两种入口都生成同一种表示。</text>
  </g>

  <rect class="p2" x="16" y="654" width="768" height="238" rx="14"/>
  <path class="arrow" d="M674 609 V706"/>
  <text class="section" x="33" y="691">第二阶段　根据轨迹补全全身动作</text>
  <g class="node">
    <rect class="posebox" x="34" y="710" width="732" height="70" rx="10"/>
    <text class="head" x="50" y="739">对齐坐标，写入带噪的全身动作</text>
    <text class="body" x="50" y="763">将预测轨迹转换到全身表示所用的根相对坐标，在每个去噪步填入对应通道。</text>
  </g>
  <path class="arrow" d="M400 780 V800"/>
  <g class="node">
    <rect class="posebox" x="34" y="803" width="732" height="68" rx="10"/>
    <text class="head" x="50" y="832">全身去噪模型 D<tspan baseline-shift="sub" font-size="13">x</tspan>　→　N 帧 × 263 维动作</text>
    <text class="body" x="50" y="857">其余关节随轨迹和语义条件补全。最终落点误差可从输出动作中重新测量。</text>
  </g>

  <rect class="trainbox" x="16" y="919" width="768" height="174" rx="14"/>
  <text class="section" x="33" y="956">训练时，两种去噪模型各从真实动作获得监督</text>
  <path d="M398 977 V1073" stroke="#d4c8b1" stroke-width="1.3"/>
  <text x="34" y="990" class="head">轨迹模型 D<tspan baseline-shift="sub" font-size="12">c</tspan></text>
  <text x="34" y="1018" class="body">随机选帧、选关节，把干净值写入</text>
  <text x="34" y="1043" class="body">带噪轨迹。模型重建全部真实轨迹。</text>
  <text x="419" y="990" class="head">全身模型 D<tspan baseline-shift="sub" font-size="12">x</tspan></text>
  <text x="419" y="1018" class="body">把完整的真实关键关节轨迹写入</text>
  <text x="419" y="1043" class="body">带噪全身动作。模型重建真实全身动作。</text>
  <text x="26" y="1123" class="small">本站教学示意，依据论文图 2、第 3 节及式 (1)。时间轴与曲线用于说明输入格式。</text>
</svg>
