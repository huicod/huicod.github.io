<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1650" viewBox="0 0 1440 1650" role="img" aria-labelledby="title desc">
<title id="title">Motion Anything：条件引导的时间与空间掩码恢复</title>
<desc id="desc">依据2025年v2长稿图3与算法1至3绘制。文本和音乐编码为条件，动作通过VQ-VAE编码，条件注意力选择时间与空间掩码，TAT和SAT恢复表示并通过解码器产生连续动作。另标明TMD数据来源、未充分披露的生成调度，以及外部4D角色应用。</desc>
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#52657a"/></marker>
 <marker id="cond" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#b66a23"/></marker>
 <marker id="cond-port" markerWidth="4" markerHeight="4" refX="4" refY="2" orient="auto"><path d="M0 0 L4 2 L0 4Z" fill="#b66a23"/></marker>
 <style>
 text{font-family:'Noto Sans SC','Microsoft YaHei',Arial,sans-serif;fill:#182c3d} .title{font-size:31px;font-weight:700}.sub{font-size:20px;fill:#586c7d}.h{font-size:23px;font-weight:700}.t{font-size:21px}.n{font-size:18px;fill:#536679}.b{font-size:21px;font-weight:700}.label{font-size:18px;font-weight:700;fill:#9a581d}.line{fill:none;stroke:#52657a;stroke-width:2.5;marker-end:url(#arrow)}.condition{fill:none;stroke:#b66a23;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#cond)}.panel{fill:#f8fafc;stroke:#cfdbe4;stroke-width:1.5}.purple{fill:#f0ebfb;stroke:#a38ac4;stroke-width:1.5}.orange{fill:#fff3df;stroke:#d9a354;stroke-width:1.5}.blue{fill:#eaf3fc;stroke:#89accb;stroke-width:1.5}.green{fill:#eaf5ed;stroke:#8fb79e;stroke-width:1.5}.white{fill:white;stroke:#b7c6d2;stroke-width:1.5}.warn{fill:#fff8e9;stroke:#d9b86e;stroke-width:1.5}
 </style>
</defs>
<rect width="1440" height="1650" fill="#fff"/>
<text x="42" y="50" class="title">Motion Anything｜让模型优先学习条件相关的动作位置</text>
<text x="42" y="84" class="sub">阅读版本：arXiv 2503.06955v2（2025-03-12） · 训练关注位置 ≠ 用户指定的硬时空约束</text>

<rect x="30" y="110" width="1380" height="225" rx="15" class="panel"/>
<text x="52" y="145" class="h">① 输入与表示：三类已评估接口，文本 / 音乐 / 文本＋音乐</text>
<rect x="55" y="166" width="225" height="63" rx="9" class="orange"/>
<text x="167" y="204" class="b" text-anchor="middle">文字动作描述</text>
<path d="M280 198 H325" class="line"/>
<rect x="330" y="166" width="230" height="63" rx="9" class="orange"/>
<text x="445" y="204" class="b" text-anchor="middle">CLIP → 文本特征</text>
<rect x="55" y="249" width="225" height="63" rx="9" class="orange"/>
<text x="167" y="287" class="b" text-anchor="middle">音乐波形</text>
<path d="M280 281 H325" class="line"/>
<rect x="330" y="249" width="230" height="63" rx="9" class="orange"/>
<text x="445" y="287" class="b" text-anchor="middle">Audio Encoder</text>
<path d="M560 198 H620 V237 M560 281 H620 V237" fill="none" stroke="#b66a23" stroke-width="2.5" stroke-dasharray="7 5"/>
<path d="M620 237 H658" class="condition"/>
<rect x="665" y="182" width="310" height="112" rx="10" class="orange"/>
<text x="820" y="218" class="b" text-anchor="middle">可用条件 C</text>
<text x="820" y="249" class="t" text-anchor="middle">纯文本：一个时间token</text>
<text x="820" y="277" class="t" text-anchor="middle">含音乐：时变条件序列</text>
<rect x="1010" y="180" width="370" height="115" rx="10" class="white"/>
<text x="1030" y="211" class="b">条件的两种用途</text>
<text x="1030" y="243" class="t">A. 决定哪些动作位置被遮住</text>
<text x="1030" y="275" class="t">B. 引导恢复缺失的动作表示</text>

<rect x="30" y="355" width="1380" height="670" rx="15" class="panel"/>
<text x="52" y="390" class="h">② 掩码学习 / 恢复路径：先选位置，再恢复；默认共2个TAT＋2个SAT</text>
<rect x="55" y="414" width="245" height="80" rx="10" class="purple"/>
<text x="177" y="447" class="b" text-anchor="middle">训练动作序列</text>
<text x="177" y="478" class="n" text-anchor="middle">连续骨架运动</text>
<path d="M300 454 H345" class="line"/>
<rect x="350" y="414" width="270" height="80" rx="10" class="purple"/>
<text x="485" y="447" class="b" text-anchor="middle">VQ-VAE Encoder</text>
<text x="485" y="478" class="n" text-anchor="middle">动作token / 表示 M</text>
<path d="M620 454 H660" class="line"/>
<rect x="665" y="414" width="360" height="80" rx="10" class="white"/>
<text x="845" y="447" class="b" text-anchor="middle">按条件计算时间注意力</text>
<text x="845" y="478" class="n" text-anchor="middle">相关性得分 → 排序</text>
<path d="M820 294 V347 H990 V407" class="condition"/>
<path d="M1025 454 H1065" class="line"/>
<rect x="1070" y="414" width="305" height="80" rx="10" class="green"/>
<text x="1222" y="447" class="b" text-anchor="middle">遮住最高α%的位置</text>
<text x="1222" y="478" class="n" text-anchor="middle">默认时间比例αₜ＝30%</text>

<path d="M1222 494 V524 H845 V548" class="line"/>
<circle cx="705" cy="526" r="13" fill="#fff3df" stroke="#d9a354"/>
<text x="705" y="532" class="label" text-anchor="middle">C</text>
<path d="M705 539 V553" class="condition" marker-end="url(#cond-port)" style="marker-end:url(#cond-port)"/>
<rect x="665" y="555" width="710" height="128" rx="10" class="green"/>
<text x="690" y="589" class="b">Temporal Adaptive Transformer（TAT）</text>
<text x="690" y="623" class="t">纯文本：文本＋被mask动作共同做self-attention</text>
<text x="690" y="657" class="t">含音乐：动作作Q，条件作K/V，恢复时间结构</text>
<rect x="55" y="529" width="565" height="153" rx="10" class="white"/>
<text x="77" y="562" class="b">选mask与补mask：查询方向不同</text>
<text x="77" y="596" class="t">选位置：通常 条件Q → 动作K/V</text>
<text x="77" y="628" class="t">补位置：通常 动作Q → 条件K/V</text>
<text x="77" y="659" class="n">纯文本时间选址与恢复均采用联合自注意力</text>
<path d="M1252 683 V711" class="line"/>
<rect x="1070" y="718" width="305" height="78" rx="10" class="purple"/>
<text x="1222" y="750" class="b" text-anchor="middle">Rearrange</text>
<text x="1222" y="780" class="n" text-anchor="middle">显式展开空间维</text>
<path d="M1070 757 H1028" class="line"/>
<circle cx="900" cy="696" r="10" fill="#fff3df" stroke="#d9a354"/>
<text x="900" y="702" class="label" text-anchor="middle">C</text>
<path d="M900 706 V716" class="condition" marker-end="url(#cond-port)" style="marker-end:url(#cond-port)"/>
<rect x="665" y="718" width="355" height="78" rx="10" class="blue"/>
<text x="842" y="750" class="b" text-anchor="middle">空间注意力 → top-αₛ mask</text>
<text x="842" y="780" class="n" text-anchor="middle">默认空间比例αₛ＝30%</text>
<path d="M665 757 H623" class="line"/>
<circle cx="337" cy="696" r="10" fill="#fff3df" stroke="#d9a354"/>
<text x="337" y="702" class="label" text-anchor="middle">C</text>
<path d="M337 706 V716" class="condition" marker-end="url(#cond-port)" style="marker-end:url(#cond-port)"/>
<rect x="55" y="718" width="565" height="78" rx="10" class="blue"/>
<text x="337" y="750" class="b" text-anchor="middle">Spatial Aligning Transformer（SAT）</text>
<text x="337" y="780" class="n" text-anchor="middle">动作Q → 条件K/V，恢复空间动作特征</text>
<path d="M180 796 V838" class="line"/>
<rect x="55" y="845" width="565" height="77" rx="10" class="purple"/>
<text x="337" y="877" class="b" text-anchor="middle">同类TAT/SAT块 → 完整动作表示</text>
<text x="337" y="907" class="n" text-anchor="middle">原图含Linear残差支路；不是硬约束求解器</text>
<path d="M620 883 H660" class="line"/>
<rect x="665" y="845" width="355" height="77" rx="10" class="purple"/>
<text x="842" y="877" class="b" text-anchor="middle">VQ-VAE Decoder</text>
<text x="842" y="907" class="n" text-anchor="middle">动作表示 → 连续运动</text>
<path d="M1020 883 H1063" class="line"/>
<rect x="1070" y="845" width="305" height="77" rx="10" class="green"/>
<text x="1222" y="877" class="b" text-anchor="middle">连续骨架动作</text>
<text x="1222" y="907" class="n" text-anchor="middle">文本语义 / 音乐节拍匹配</text>
<text x="55" y="961" class="t">橙色同名端口C共享顶部条件；虚线是条件支路，实线是动作处理。每个选址 / 恢复器均接收C。</text>
<text x="55" y="995" class="n">注意：作者未完整说明注意力聚合、token与关节映射、融合算子及训练损失；本图不补造这些细节。</text>

<rect x="30" y="1045" width="1380" height="173" rx="15" class="warn"/>
<text x="52" y="1081" class="h">③ 推理接口与披露边界</text>
<rect x="55" y="1100" width="290" height="59" rx="9" class="orange"/><text x="200" y="1137" class="b" text-anchor="middle">文本 / 音乐 / 两者</text>
<path d="M345 1130 H393" class="line"/>
<rect x="400" y="1100" width="330" height="59" rx="9" class="purple"/><text x="565" y="1137" class="b" text-anchor="middle">掩码动作生成器</text>
<path d="M730 1130 H778" class="line"/>
<rect x="785" y="1100" width="290" height="59" rx="9" class="purple"/><text x="930" y="1137" class="b" text-anchor="middle">VQ-VAE解码器</text>
<path d="M1075 1130 H1123" class="line"/>
<rect x="1130" y="1100" width="245" height="59" rx="9" class="green"/><text x="1252" y="1137" class="b" text-anchor="middle">输出动作</text>
<text x="55" y="1194" class="t">原文未充分给出：初始token、生成迭代 / 重掩码调度、停止条件。不能擅自套用MoMask采样循环。</text>

<rect x="30" y="1238" width="670" height="300" rx="15" class="panel"/>
<text x="52" y="1275" class="h">④ TMD：2,153个三元配对样本</text>
<rect x="55" y="1295" width="620" height="63" rx="9" class="white"/>
<text x="365" y="1334" class="t" text-anchor="middle">Motion-X等来源的舞蹈＋文字（含AIST++）</text>
<path d="M365 1358 V1382" class="line"/>
<rect x="55" y="1389" width="620" height="68" rx="9" class="orange"/>
<text x="365" y="1418" class="t" text-anchor="middle">有音乐：沿用；缺音乐：Stable Audio Open</text>
<text x="365" y="1446" class="n" text-anchor="middle">生成音乐＋节拍调整＋专家评价</text>
<text x="55" y="1490" class="t">文本＋音乐＋舞蹈 → 联合条件训练与评估</text>
<text x="55" y="1519" class="n">含合成音乐；不等于全部为自然录制的音乐舞蹈配对</text>

<rect x="720" y="1238" width="690" height="300" rx="15" class="panel"/>
<text x="742" y="1275" class="h">⑤ 补充应用：动作驱动4D角色</text>
<rect x="745" y="1295" width="640" height="63" rx="9" class="white"/>
<text x="1065" y="1334" class="t" text-anchor="middle">文字 → Tripo AI 2.0候选角色 → 自动绑定</text>
<path d="M1065 1358 V1382" class="line"/>
<rect x="745" y="1389" width="640" height="68" rx="9" class="blue"/>
<text x="1065" y="1418" class="t" text-anchor="middle">SRM：质心筛选＋平均蒙皮权重和筛选</text>
<text x="1065" y="1446" class="n" text-anchor="middle">选择候选；代理指标不保证动态变形正确</text>
<text x="745" y="1490" class="t">连续动作＋已绑定角色 → Retarget → Render</text>
<text x="745" y="1519" class="n">外部资产工具与Motion Anything分工，不是端到端视频模型</text>

<text x="42" y="1581" class="sub">教学重绘｜来源：v2正文图3、算法1–3、§4.1–4.2；补充图3与§4。图中不是本次模型运行结果。</text>
<text x="42" y="1617" class="sub">2026会议记录：SIGGRAPH Asia Technical Communications，新题名Condition Guided Masking for Motion Generation。</text>
</svg>
