<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1490" viewBox="0 0 1080 1490" role="img" aria-labelledby="title desc">
<title id="title">momug · 总体架构</title>
<desc id="desc">教学重绘依据 · 原文图 2、式 5–9 及算法 1–2。两条读出路径属于同一模型，推理只执行所选方向。</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
<path d="M0 0 8 4 0 8Z" fill="#446a68"/>
</marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
<path d="M0 0 8 4 0 8Z" fill="#99765e"/>
</marker>
</defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.e{fill:none;stroke:#446a68;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#a)}.d{stroke:#99765e;stroke-dasharray:7 5;marker-end:url(#b)}.edge-label{font-size:17px;font-weight:600;paint-order:stroke;stroke:white;stroke-width:5;stroke-linejoin:round}</style>
<rect width="1080" height="1490" fill="#f7f7f0"/>
<rect x="20" y="180" width="1040" height="360" rx="17" fill="#fff" stroke="#d0ded8" stroke-width="1.6"/>
<rect x="20" y="565" width="1040" height="302" rx="17" fill="#fff" stroke="#d0ded8" stroke-width="1.6"/>
<rect x="20" y="890" width="1040" height="290" rx="17" fill="#fff" stroke="#d0ded8" stroke-width="1.6"/>
<rect x="20" y="1201" width="1040" height="223" rx="17" fill="#fff" stroke="#d0ded8" stroke-width="1.6"/>
<path d="M42 147H96" class="e"/>
<path d="M365 147H419" class="e d"/>
<path d="M180 387 L180 481.5 L288 481.5" class="e"/>
<path d="M540 387 L540 432" class="e"/>
<path d="M900 387 L900 481.5 L792 481.5" class="e"/>
<path d="M316 729.5 L404 729.5" class="e"/>
<path d="M676 729.5 L764 729.5" class="e"/>
<path d="M900 779 L900 830 L180 830 L180 779" class="e"/>
<path d="M316 1046.5 L404 1046.5" class="e"/>
<path d="M676 1046.5 L764 1046.5" class="e"/>
<path d="M900 1096 L900 1149 L180 1149 L180 1096" class="e"/>
