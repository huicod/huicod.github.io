<path d="M764 1349.5 L676 1349.5" class="e d"/>
<text x="40" y="72" fill="#173b40" font-size="36" font-weight="700" text-anchor="start">MoMug · 同一主干如何写动作、写文字？</text>
<text x="40" y="112" fill="#173b40" font-size="23" font-weight="400" text-anchor="start">文字走离散词元接口，骨骼走连续帧接口。任务决定序列顺序和预测目标。</text>
<text x="40" y="32" fill="#19766f" font-size="18" font-weight="700" text-anchor="start">arXiv 2025   /   双向动作与文字生成</text>
<text x="108" y="154" fill="#173b40" font-size="19" font-weight="400" text-anchor="start">动作、特征或条件</text>
<text x="430" y="154" fill="#87644b" font-size="19" font-weight="400" text-anchor="start">训练目标或真值</text>
<text x="42" y="220" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">01</text>
<text x="94" y="220" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">三类输入进入一个可共享的主干</text>
<text x="44" y="254" fill="#476064" font-size="19" font-weight="400" text-anchor="start">文字用已有词嵌入；时间步和动作各自投影到 Llama 的隐藏宽度。</text>
<rect data-node="words" x="44" y="288" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="319" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">文字词元</text>
<text x="59" y="348" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">词表嵌入，保留文本顺序</text>
<rect data-node="tm" x="404" y="288" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="319" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">扩散步 t</text>
<text x="419" y="348" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">时刻嵌入与 MLP</text>
<text x="419" y="373" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">表示整段动作的噪声等级</text>
<rect data-node="frame" x="764" y="288" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="319" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">连续骨骼帧</text>
<text x="779" y="348" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">逐帧线性投影</text>
<text x="779" y="373" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">不查询离散动作码本</text>
<rect data-node="shared" x="288" y="432" width="504" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="303" y="463" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">同一套预训练 Llama ＋ LoRA</text>
<text x="303" y="492" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">动作段用起止符标界；主干按序列计算隐藏状态</text>
<text x="42" y="605" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">02</text>
<text x="94" y="605" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">文字生成动作：一次预测整段，再走下一去噪步</text>
<text x="44" y="639" fill="#476064" font-size="19" font-weight="400" text-anchor="start">输入顺序为文本在前、动作段在后。训练时从真实动作加噪得到 xₜ。</text>
<rect data-node="cond" x="44" y="680" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="711" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">提示词＋当前 xₜ</text>
<text x="59" y="740" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">推理从 N 帧纯噪声开始</text>
<text x="59" y="765" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">与时刻 t 一起送进 Llama</text>
<rect data-node="mhat" x="404" y="680" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="711" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">动作位置输出头</text>
<text x="419" y="740" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">线性映回每一帧姿态维度</text>
<text x="419" y="765" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">给出干净动作估计 x̂₀</text>
<rect data-node="sampler" x="764" y="680" width="272" height="99" rx="12" fill="#deece7" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="711" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">DDPM 反向一步</text>
<text x="779" y="740" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">依据 x̂₀ 更新全段至 xₜ₋₁</text>
<text x="779" y="765" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">到末步得到动作序列</text>
<text x="360" y="715" text-anchor="middle" class="edge-label" fill="#19766f">隐藏状态</text>
<text x="720" y="715" text-anchor="middle" class="edge-label" fill="#19766f">x̂₀</text>
<text x="538" y="823" text-anchor="middle" class="edge-label" fill="#19766f">继续下一扩散步，共 50 步</text>
<text x="42" y="930" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">03</text>
<text x="94" y="930" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">动作生成文字：给定干净动作，再逐个词元写描述</text>
<text x="44" y="964" fill="#476064" font-size="19" font-weight="400" text-anchor="start">顺序对换；已知的是全部动作帧，不必先为动作做反向扩散。</text>
<rect data-node="given" x="44" y="997" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="1028" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">干净动作与 t = 0</text>
<text x="59" y="1057" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">动作帧和已有文字前缀</text>
<text x="59" y="1082" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">一起送进共享 Llama</text>
<rect data-node="lang" x="404" y="997" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="1028" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">文字位置输出头</text>
<text x="419" y="1057" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">共享主干的文字隐藏状态</text>
<text x="419" y="1082" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">映射到语言词表分布</text>
<rect data-node="result" x="764" y="997" width="272" height="99" rx="12" fill="#deece7" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="1028" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">下一个词元</text>
<text x="779" y="1057" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">追加词元，更新前缀</text>
<text x="779" y="1082" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">重复直至结束标记</text>
<text x="360" y="1031" text-anchor="middle" class="edge-label" fill="#19766f">隐藏状态</text>
<text x="720" y="1031" text-anchor="middle" class="edge-label" fill="#19766f">词表分布</text>
<text x="540" y="1143" text-anchor="middle" class="edge-label" fill="#19766f">逐词延长描述</text>
<text x="42" y="1241" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">04</text>
<text x="94" y="1241" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">训练时哪些位置需要监督？</text>
<text x="44" y="1275" fill="#476064" font-size="19" font-weight="400" text-anchor="start">文字位置预测下一个词元。只有训练文本生成动作时，才启用连续动作重建项。</text>
<rect data-node="gold" x="44" y="1300" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="1331" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">真实文字词元</text>
<text x="59" y="1360" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">下一词元的标签</text>
<rect data-node="loss" x="404" y="1300" width="272" height="99" rx="12" fill="#f4e6dc" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="1331" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">训练目标</text>
<text x="419" y="1360" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">λ × 文字交叉熵＋动作 MSE</text>
<text x="419" y="1385" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">动作描述时动作项置零</text>
<rect data-node="clean" x="764" y="1300" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="1331" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">干净骨骼帧</text>
<text x="779" y="1360" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">作为去噪的真值目标</text>
<text x="40" y="1465" fill="#4a6263" font-size="18" font-weight="400" text-anchor="start">教学重绘依据 · 原文图 2、式 5–9 及算法 1–2。两条读出路径属于同一模型，推理只执行所选方向。</text>
</svg>
