<path d="M 600 845 L 600 885 L 762 885 L 762 945" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="640" y="875" class="label" text-anchor="start">语义特征</text>
<path d="M 1010 845 L 1010 945" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1020" y="900" class="label" text-anchor="start">风格参数</text>
<rect x="935" y="1100" width="225" height="90" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="1047.5" y="1130" class="node" text-anchor="middle">噪声预测 εθ</text>
<text x="1047.5" y="1155" class="body" text-anchor="middle">风格CFG调节强度</text>
<rect x="640" y="1100" width="245" height="90" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="762.5" y="1130" class="node" text-anchor="middle">DDPM 反向采样</text>
<text x="762.5" y="1155" class="body" text-anchor="middle">当前潜码逐步去噪</text>
<text x="762.5" y="1177" class="body" text-anchor="middle">默认1,000步</text>
<rect x="335" y="1100" width="255" height="90" rx="10" fill="#fff" stroke="#a9b8ca" stroke-width="1.5"/>
<text x="462.5" y="1130" class="node" text-anchor="middle">当前干净潜码 z₀</text>
<text x="462.5" y="1155" class="body" text-anchor="middle">完成后加入历史</text>
<text x="462.5" y="1177" class="body" text-anchor="middle">再生成下一潜在位置</text>
<path d="M 1047 1050 L 1047 1100" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 935 1145 L 885 1145" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 640 1145 L 590 1145" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 762 1190 L 762 1225 L 55 1225 L 55 1050" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="120" y="1210" class="label" text-anchor="start">尚未去净：更新 zₙ 并继续当前去噪循环</text>
<path d="M 335 1145 L 305 1145 L 305 925 L 163 925 L 163 945" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="70" y="911" class="label" text-anchor="start">完成：历史反馈</text>
<rect x="335" y="1290" width="300" height="90" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="485.0" y="1320" class="node" text-anchor="middle">最近码本量化＋VQ解码</text>
<text x="485.0" y="1345" class="body" text-anchor="middle">连续潜码 → 量化码 → 运动</text>
<text x="485.0" y="1367" class="body" text-anchor="middle">复用已训练动作解码器</text>
<rect x="805" y="1290" width="330" height="90" rx="10" fill="#fff" stroke="#a9b8ca" stroke-width="1.5"/>
<text x="970.0" y="1320" class="node" text-anchor="middle">输出说话手势</text>
<text x="970.0" y="1345" class="body" text-anchor="middle">身体位移＋关节6D旋转</text>
<text x="970.0" y="1367" class="body" text-anchor="middle">风格、节奏与语义共同影响</text>
<path d="M 462 1190 L 462 1290" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="475" y="1260" class="label" text-anchor="start">生成的潜码序列</text>
<path d="M 635 1335 L 805 1335" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="1415" class="label" text-anchor="start">T是讲话内容；P是表演要求。风格丢弃分支仍保留A/T。因果结构不等于实时：原文单V100约1.5秒生成1秒动作。</text>
<rect x="20" y="1460" width="1160" height="175" rx="16" fill="#fffaf2" stroke="#d5deea"/>
<text x="40" y="1495" class="section" text-anchor="start">D  可选部位扩展：单独训练表示与新生成器，不是直接改默认全身潜码</text>
<rect x="40" y="1518" width="345" height="85" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="212.5" y="1548" class="node" text-anchor="middle">分部位 VQ-VAE</text>
<text x="212.5" y="1573" class="body" text-anchor="middle">堆叠各部位潜码；重训扩散器</text>
<rect x="430" y="1518" width="345" height="85" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="602.5" y="1548" class="node" text-anchor="middle">每个部位提供风格提示</text>
<text x="602.5" y="1573" class="body" text-anchor="middle">各提示分别预测一次全身噪声</text>
<rect x="820" y="1518" width="340" height="85" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="990.0" y="1548" class="node" text-anchor="middle">按部位mask组合噪声</text>
<text x="990.0" y="1573" class="body" text-anchor="middle">加跨预测平滑梯度，再采样</text>
<path d="M 385 1560 L 430 1560" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 775 1560 L 820 1560" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="1670" class="label" text-anchor="start">身体部位组合与CLIP风格引导均为生成机制；未提供任意关节目标、物体接触或同部位冲突自动消解保证。</text>
</svg>