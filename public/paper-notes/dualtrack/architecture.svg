<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1990" role="img" aria-label="DualTrack｜上一包交换历史，当前状态融合，两条流并行补包"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#56657a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b}.title{font-size:28px;font-weight:700}.section{font-size:23px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.arrow{fill:none;stroke:#56657a;stroke-width:2.3;marker-end:url(#a)}.dash{stroke-dasharray:7 5}</style><rect width="1280" height="1990" fill="#fff"/><text x="40" y="44" class="title">DualTrack｜上一包交换历史，当前状态融合，两条流并行补包</text><rect x="30" y="75" width="1220" height="385" rx="16" fill="#f6f8fb" stroke="#c9d2df"/><text x="50" y="109" class="section">A · 先学运动表示与单模态先验（训练准备）</text><rect x="55" y="130" width="350" height="125" rx="10" fill="#fff0d4" stroke="#aab8ca"/><text x="70" y="160" class="head">动作数据统一</text><text x="70" y="189" class="body">release910k / BONES / BEAT2</text><text x="70" y="215" class="body">77关节SOMA，UMR499</text><text x="70" y="241" class="body">25fps，含身体与手指</text><rect x="455" y="130" width="350" height="125" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="470" y="160" class="head">SeMoCo式codec适配</text><text x="470" y="189" class="body">共享卷积encoder，stride 2</text><text x="470" y="215" class="body">512维latent → 两条量化支路</text><text x="470" y="241" class="body">1语义VQ ＋ 15级运动学RVQ</text><rect x="855" y="130" width="370" height="125" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="870" y="160" class="head">相加嵌入 → decoder重建</text><text x="870" y="189" class="body">只在运动学支路内做残差相减</text><text x="870" y="215" class="body">每码本1024项；12.5Hz</text><text x="870" y="241" class="body">按验证MSE选择，再冻结</text><path d="M405 190H455" class="arrow"/><path d="M805 190H855" class="arrow"/><rect x="55" y="300" width="350" height="115" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="70" y="330" class="head">冻结动作codec</text><text x="70" y="359" class="body">运动 → 16码包 mₜ</text><text x="70" y="385" class="body">归一化统计一同冻结</text><text x="70" y="411" class="body">单模态训练不需配对声音</text><rect x="455" y="300" width="350" height="115" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="470" y="330" class="head">MotionPrior预训练</text><text x="470" y="359" class="body">语义历史2层 / 完整历史4层</text><text x="470" y="385" class="body">semantic predictor＋3层Depth GPT</text><text x="470" y="411" class="body">761,853步 ＋ 100,000步适配</text><rect x="855" y="300" width="370" height="115" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="870" y="330" class="head">两种预训练先验就绪</text><text x="870" y="359" class="body">Qwen3-TTS 0.6B语音先验</text><text x="870" y="385" class="body">MotionPrior动作先验</text><text x="870" y="411" class="body">不是从零训练一个统一大模型</text><path d="M405 355H455" class="arrow"/><path d="M805 355H855" class="arrow"/><path d="M1040 255V278H230V300" class="arrow dash"/><rect x="30" y="500" width="1220" height="770" rx="16" fill="#f6f8fb" stroke="#c9d2df"/><text x="50" y="534" class="section">B · 一次tick：历史输入 → 当前状态 → 各自码包（80ms表示范围）</text><rect x="55" y="560" width="350" height="125" rx="10" fill="#fff0d4" stroke="#aab8ca"/><text x="70" y="590" class="head">文字 ＋ 可选说话者embedding</text><text x="70" y="619" class="body">文字先进入语音流</text><text x="70" y="645" class="body">可选5秒参考声音取得身份</text><text x="70" y="671" class="body">未规定逐字到达或文本前瞻</text><rect x="455" y="560" width="350" height="125" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="470" y="590" class="head">上一包语音 sₜ₋₁</text><text x="470" y="619" class="body">完整16个声音码</text><text x="470" y="645" class="body">speech→motion残差adapter</text><text x="470" y="671" class="body">注入动作两条时间分支</text><rect x="855" y="560" width="370" height="125" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="870" y="590" class="head">上一包动作 mₜ₋₁</text><text x="870" y="619" class="body">完整16个运动码</text><text x="870" y="645" class="body">motion→speech残差adapter</text><text x="870" y="671" class="body">BOS时跨流输入为零</text><rect x="55" y="745" width="350" height="125" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="70" y="775" class="head">Qwen3-TTS时间骨干</text><text x="70" y="804" class="body">文字 / 自身历史 / 动作历史</text><text x="70" y="830" class="body">预训练参数冻结</text><text x="70" y="856" class="body">产生当前语音状态 hˢₜ</text><rect x="455" y="745" width="350" height="125" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="470" y="775" class="head">MotionPrior语义时间分支</text><text x="470" y="804" class="body">过去语义码＋上一语音包</text><text x="470" y="830" class="body">产生当前语义状态 hᵐₜ</text><text x="470" y="856" class="body">联合阶段只适配部分顶层</text><rect x="855" y="745" width="370" height="125" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="870" y="775" class="head">MotionPrior完整历史分支</text><text x="870" y="804" class="body">过去完整包＋上一语音包</text><text x="870" y="830" class="body">产生 hᶠₜ；不直接进入fusion</text><text x="870" y="856" class="body">最多150包历史</text><path d="M230 685V745" class="arrow"/><path d="M1040 685V715H435V815H405" class="arrow"/><path d="M640 685V745" class="arrow"/><path d="M640 710H1040V745" class="arrow"/><rect x="55" y="930" width="350" height="125" rx="10" fill="#fff" stroke="#aab8ca"/><text x="70" y="960" class="head">语音融合状态 h̃ˢₜ</text><text x="70" y="989" class="body">原状态＋语音侧残差投影</text><text x="70" y="1015" class="body">为当前语音预测头提供条件</text><text x="70" y="1041" class="body">不等当前动作码完成</text><rect x="455" y="930" width="350" height="125" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="470" y="960" class="head">Tick Fusion：当前状态融合</text><text x="470" y="989" class="body">LN(hˢₜ)、LN(hᵐₜ)拼接</text><text x="470" y="1015" class="body">Linear＋SiLU → 共享rₜ</text><text x="470" y="1041" class="body">分别残差回写语音 / 动作</text><rect x="855" y="930" width="370" height="125" rx="10" fill="#fff" stroke="#aab8ca"/><text x="870" y="960" class="head">动作融合状态 h̃ᵐₜ</text><text x="870" y="989" class="body">原语义状态＋动作侧投影</text><text x="870" y="1015" class="body">与绕过fusion的 hᶠₜ组合</text><text x="870" y="1041" class="body">为当前运动学预测提供条件</text><path d="M230 870V900H590V930" class="arrow"/><path d="M640 870V930" class="arrow"/><path d="M455 990H405" class="arrow"/><path d="M805 990H855" class="arrow"/><path d="M1040 870V930" class="arrow"/><text x="1060" y="902" class="small">完整历史旁路</text><rect x="55" y="1110" width="350" height="110" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="70" y="1140" class="head">语音码包预测（冻结头）</text><text x="70" y="1169" class="body">先时间码，再补齐深层码</text><text x="70" y="1195" class="body">输出 sₜ = 16个声音码</text><rect x="455" y="1110" width="350" height="120" rx="10" fill="#fff" stroke="#aab8ca"/><text x="470" y="1140" class="head">跨模态并行 / 包内自回归</text><text x="470" y="1169" class="body">不读对方当前输出码</text><text x="470" y="1195" class="body">完成两个包后推进t＋1</text><text x="470" y="1221" class="body">当前包不是完全并行16码</text><rect x="855" y="1110" width="370" height="110" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="870" y="1140" class="head">动作码包预测（冻结头）</text><text x="870" y="1169" class="body">保持/切换q⁰ → 新语义码</text><text x="870" y="1195" class="body">Depth GPT顺序补齐q¹…q¹⁵</text><path d="M230 1055V1110" class="arrow"/><path d="M1040 1055V1110" class="arrow"/><path d="M405 1165H455" class="arrow"/><path d="M855 1165H805" class="arrow"/><path d="M1040 1220V1245H1240V620H1225" class="arrow"/><text x="1050" y="1258" class="small">下步历史</text><path d="M230 1220V1245H430V620H455" class="arrow"/><rect x="30" y="1310" width="1220" height="270" rx="16" fill="#f6f8fb" stroke="#c9d2df"/><text x="50" y="1344" class="section">C · 解码与评测转换：码包因果不意味着整个输出流程已实时</text><rect x="55" y="1370" width="350" height="145" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="70" y="1400" class="head">语音codec decoder（冻结）</text><text x="70" y="1429" class="body">sₜ序列 → 连续音频</text><text x="70" y="1455" class="body">官方输出speech.wav</text><text x="70" y="1481" class="body">需测增量解码与首音频延迟</text><text x="70" y="1507" class="body">原文没有运行时间表</text><rect x="455" y="1370" width="350" height="145" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="470" y="1400" class="head">动作codec decoder（冻结）</text><text x="470" y="1429" class="body">mₜ序列 → UMR499 / 25fps</text><text x="470" y="1455" class="body">官方输出motion.npz与codes</text><text x="470" y="1481" class="body">恢复连续身体 / 手指运动</text><text x="470" y="1507" class="body">原文没有硬空间目标求解器</text><rect x="855" y="1370" width="370" height="145" rx="10" fill="#fff" stroke="#aab8ca"/><text x="870" y="1400" class="head">可视化 / 评测的额外转换</text><text x="870" y="1429" class="body">UMR499 → SOMA → SMPL-X</text><text x="870" y="1455" class="body">逆拟合 / 重采样引入误差</text><text x="870" y="1481" class="body">训练与测试参考需统一转换</text><text x="870" y="1507" class="body">增量转换仍列为未来工作</text><path d="M230 1220V1290H1240V1355H230V1370" class="arrow"/><path d="M1040 1220V1280H1225V1360H640V1370" class="arrow"/><path d="M805 1440H855" class="arrow"/><rect x="30" y="1620" width="1220" height="280" rx="16" fill="#f6f8fb" stroke="#c9d2df"/><text x="50" y="1654" class="section">D · 联合训练阶段的更新范围：信息双向，优化策略并不始终对称</text><rect x="55" y="1680" width="350" height="145" rx="10" fill="#fff0d4" stroke="#aab8ca"/><text x="70" y="1710" class="head">前400次更新</text><text x="70" y="1739" class="body">只训练耦合模块</text><text x="70" y="1765" class="body">adapter / fusion输出零初始化</text><text x="70" y="1791" class="body">加权语音 / 动作交叉熵</text><text x="70" y="1817" class="body">speech replay＋distillation</text><rect x="455" y="1680" width="350" height="145" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="470" y="1710" class="head">之后重点适配动作侧</text><text x="470" y="1739" class="body">训speech→motion adapter</text><text x="470" y="1765" class="body">训fusion动作输出投影</text><text x="470" y="1791" class="body">训动作时间模型顶端各2层</text><text x="470" y="1817" class="body">以及其输出归一化</text><rect x="855" y="1680" width="370" height="145" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="870" y="1710" class="head">继续冻结与训练历史</text><text x="870" y="1739" class="body">冻结语音骨干、预测头、codec</text><text x="870" y="1765" class="body">冻结motion→speech / fusion其余</text><text x="870" y="1791" class="body">半数样本用生成的动作历史</text><text x="870" y="1817" class="body">8 → 16 ticks，声音历史仍是真值</text><path d="M405 1750H455" class="arrow dash"/><path d="M805 1750H855" class="arrow dash"/><text x="55" y="1868" class="small">虚线为训练关系，实线为推理数据流。蓝色为复用/冻结部件，绿色为对应阶段训练部件。</text><text x="40" y="1945" class="body">依据图1与式1–3。12.5Hz是表示时钟，不是测得吞吐；正式状态为arXiv预印本 / ICASSP投稿。</text></svg>