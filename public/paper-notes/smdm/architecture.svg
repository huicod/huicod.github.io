<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1740" viewBox="0 0 1200 1740" role="img" aria-labelledby="title desc">
<title id="title">sMDM：稀疏关键帧注意力与稠密动作重建</title><desc id="desc">四区教学图：训练与动态推理的关键帧选择，完整去噪器及潜在特征插值，稠密监督与 Lipschitz 正则披露边界，最后单列正式补充所述仅最后一步插值的固定均匀快速路径。不是原始动作空间线性插值，也不是硬关键帧控制。</desc>
<defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4475a3"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#bd7a2a"/></marker></defs>
<rect width="1200" height="1740" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="20" y="100" width="1160" height="270" rx="16" fill="#f0f6fd" stroke="#cbd6e2" stroke-width="1.4"/>
<text x="46" y="136" font-size="27" font-weight="750" fill="#283a52" text-anchor="start">A  关键帧掩码：训练与推理从不同信号选帧</text>
<rect x="20" y="390" width="1160" height="660" rx="16" fill="#f2f7fa" stroke="#cbd6e2" stroke-width="1.4"/>
<text x="46" y="426" font-size="27" font-weight="750" fill="#283a52" text-anchor="start">B  完整去噪器：训练与动态推理</text>
<rect x="20" y="1070" width="1160" height="240" rx="16" fill="#fff7ec" stroke="#cbd6e2" stroke-width="1.4"/>
<text x="46" y="1106" font-size="27" font-weight="750" fill="#283a52" text-anchor="start">C  训练监督：全帧重建；额外正则需区分披露设置</text>
<rect x="20" y="1330" width="1160" height="340" rx="16" fill="#f0f7f0" stroke="#cbd6e2" stroke-width="1.4"/>
<text x="46" y="1366" font-size="27" font-weight="750" fill="#283a52" text-anchor="start">D  固定均匀的快速推理（正式补充 C.4）</text>
<text x="46" y="1399" font-size="20" font-weight="400" fill="#586b81" text-anchor="start">单独的执行路径：中间步骤只处理关键帧，最后一次才恢复完整长度。</text>
<text x="32" y="40" font-size="31" font-weight="750" fill="#283a52" text-anchor="start">sMDM｜少量关键帧参与注意力，仍生成完整动作</text>
<text x="32" y="76" font-size="20" font-weight="400" fill="#60738a" text-anchor="start">蓝色实线：数据／采样流　　橙色虚线：训练监督／参数更新</text>
<rect x="50" y="170" width="510" height="120" rx="12" fill="#e6effa" stroke="#aabdd0" stroke-width="1.5"/>
<text x="66" y="201" font-size="23" font-weight="650" fill="#283a52" text-anchor="start">训练：从干净动作 x₀ 选择</text>
<text x="66" y="230" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">局部关节位置 + 时间索引 → VW 排序</text>
<text x="66" y="256" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">按删减率得到 M；每轮作少量 mask 扰动</text>
<rect x="640" y="170" width="510" height="120" rx="12" fill="#e6effa" stroke="#aabdd0" stroke-width="1.5"/>
<text x="656" y="201" font-size="23" font-weight="650" fill="#283a52" text-anchor="start">动态推理：先均匀，后自适应</text>
<text x="656" y="230" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">前期大 t：均匀；后期：对当前 xₜ 做 VW</text>
<text x="656" y="256" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">阈值 T′ = 0.1T，约最后 10% 的步骤</text>
<text x="50" y="354" font-size="21" font-weight="650" fill="#283a52" text-anchor="start">80% reduction = 移除约 80%，保留约 20%（K ≈ 0.2N）</text>
<rect x="820" y="332" width="330" height="38" rx="12" fill="#dce9f8" stroke="#aabdd0" stroke-width="1.5"/>
<text x="836" y="363" font-size="21" font-weight="650" fill="#283a52" text-anchor="start">二值关键帧掩码 M</text>
<path d="M305 290 V309 H985 V332" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M895 290 V309 H985" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M985 370 V452 H555 V475" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<rect x="50" y="475" width="280" height="125" rx="12" fill="#fff" stroke="#aabdd0" stroke-width="1.5"/>
<text x="66" y="506" font-size="22" font-weight="650" fill="#283a52" text-anchor="start">全长噪声动作 xₜ</text>
<text x="66" y="535" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">N 帧连续动作表示</text>
<text x="66" y="561" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">训练：x₀ 的全帧加噪</text>
<text x="66" y="587" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">动态推理：全长噪声起步</text>
<rect x="400" y="475" width="310" height="125" rx="12" fill="#fff" stroke="#aabdd0" stroke-width="1.5"/>
<text x="416" y="506" font-size="22" font-weight="650" fill="#283a52" text-anchor="start">按 M 选取／屏蔽帧</text>
<text x="416" y="535" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">关注 K 个关键帧</text>
<text x="416" y="561" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">不是给定干净姿态的覆盖</text>
<text x="416" y="587" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">保留帧位置供后续插值</text>
<rect x="800" y="475" width="350" height="125" rx="12" fill="#e5edf6" stroke="#aabdd0" stroke-width="1.5"/>
<text x="816" y="506" font-size="23" font-weight="650" fill="#283a52" text-anchor="start">输入 Lipschitz MLP</text>
<text x="816" y="535" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">逐帧映射到特征空间</text>
<text x="816" y="561" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">采用 sine 激活</text>
<path d="M330 537 H400" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M710 537 H800" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<rect x="400" y="610" width="310" height="42" rx="12" fill="#fff" stroke="#aabdd0" stroke-width="1.5"/>
<text x="416" y="641" font-size="20" font-weight="650" fill="#283a52" text-anchor="start">位置 / 扩散时间 t / 文本 c</text>
<rect x="800" y="660" width="350" height="125" rx="12" fill="#e5edf6" stroke="#aabdd0" stroke-width="1.5"/>
<text x="816" y="691" font-size="25" font-weight="650" fill="#283a52" text-anchor="start">Transformer</text>
<text x="816" y="720" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">关注选中帧的特征</text>
<text x="816" y="746" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">条件由位置、时间、文本提供</text>
<text x="816" y="772" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">补充：key 特征采用 FSQ</text>
<rect x="400" y="660" width="310" height="125" rx="12" fill="#e6effa" stroke="#aabdd0" stroke-width="1.5"/>
<text x="416" y="691" font-size="23" font-weight="650" fill="#283a52" text-anchor="start">潜在特征线性插值</text>
<text x="416" y="720" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">K 帧特征 → N 帧特征</text>
<text x="416" y="746" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">恢复非关键帧的特征</text>
<text x="416" y="772" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">不是关节位置／角度直插</text>
<rect x="50" y="660" width="280" height="125" rx="12" fill="#e5edf6" stroke="#aabdd0" stroke-width="1.5"/>
<text x="66" y="691" font-size="21" font-weight="650" fill="#283a52" text-anchor="start">输出 Lipschitz MLP</text>
<text x="66" y="720" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">特征 → 连续动作空间</text>
<text x="66" y="746" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">sine 激活的非线性映射</text>
<path d="M975 600 V660" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M710 631 H760 V685 H800" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M800 722 H710" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M400 722 H330" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M190 785 V840" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<rect x="50" y="840" width="280" height="100" rx="12" fill="#e1edf5" stroke="#aabdd0" stroke-width="1.5"/>
<text x="66" y="871" font-size="22" font-weight="650" fill="#283a52" text-anchor="start">稠密干净动作估计 x̂₀</text>
<text x="66" y="900" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">输出完整 N 帧</text>
<text x="66" y="926" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">不是只输出 K 个姿态</text>
<rect x="400" y="840" width="310" height="100" rx="12" fill="#fff" stroke="#aabdd0" stroke-width="1.5"/>
<text x="416" y="871" font-size="22" font-weight="650" fill="#283a52" text-anchor="start">推理时：扩散更新</text>
<text x="416" y="900" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">结合 xₜ 与 x̂₀ → xₜ₋₁</text>
<text x="416" y="926" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">降低噪声，再次调用去噪器</text>
<path d="M330 890 H400" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M555 940 V975 H32 V537 H50" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<text x="800" y="876" font-size="21" font-weight="650" fill="#283a52" text-anchor="start">仅推理沿蓝色回路迭代。</text>
<text x="800" y="909" font-size="20" font-weight="400" fill="#586b81" text-anchor="start">训练采样一个 t 计算损失。</text>
<text x="50" y="1027" font-size="21" font-weight="650" fill="#283a52" text-anchor="start">动态 mask 使用当前 xₜ；此稠密重建流程不同于下方固定均匀的快速路径。</text>
<rect x="50" y="1150" width="510" height="100" rx="12" fill="#fff1d9" stroke="#aabdd0" stroke-width="1.5"/>
<text x="66" y="1181" font-size="24" font-weight="650" fill="#283a52" text-anchor="start">稠密重建损失：‖x₀ − x̂₀‖²</text>
<text x="66" y="1210" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">比较全部有效帧，包括插值恢复的帧</text>
<text x="66" y="1236" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">从完整预测误差反向更新去噪器</text>
<rect x="640" y="1150" width="510" height="100" rx="12" fill="#fffaf2" stroke="#be9a63" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="656" y="1181" font-size="24" font-weight="650" fill="#283a52" text-anchor="start">主文提出：+ λL_lip</text>
<text x="656" y="1210" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">补充 B.1 明说实际移除这项正则</text>
<text x="656" y="1236" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">不能将其画成已确认开启的默认设置</text>
<path d="M50 890 H16 V1200 H50" fill="none" stroke="#bd7a2a" stroke-width="2.7" stroke-dasharray="8 5" marker-end="url(#amber)"/>
<path d="M560 1200 H600 V1130 H1186 V537 H1150" fill="none" stroke="#bd7a2a" stroke-width="2.7" stroke-dasharray="8 5" marker-end="url(#amber)"/>
<text x="50" y="1285" font-size="20" font-weight="400" fill="#735b3b" text-anchor="start">额外 L_lip 正则与 Lipschitz MLP 层结构不是同一件事；这里没有强化学习。</text>
<rect x="50" y="1410" width="310" height="105" rx="12" fill="#e3f0e4" stroke="#aabdd0" stroke-width="1.5"/>
<text x="66" y="1441" font-size="23" font-weight="650" fill="#283a52" text-anchor="start">固定均匀关键帧布局</text>
<text x="66" y="1470" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">中间步骤仅处理 K 帧</text>
<text x="66" y="1496" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">不运行动态 VW 选帧</text>
<rect x="420" y="1410" width="370" height="105" rx="12" fill="#e3f0e4" stroke="#aabdd0" stroke-width="1.5"/>
<text x="436" y="1441" font-size="23" font-weight="650" fill="#283a52" text-anchor="start">关键帧去噪 + 扩散更新</text>
<text x="436" y="1470" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">复用 MLP 与 Transformer</text>
<text x="436" y="1496" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">中间步不做全帧插值</text>
<rect x="850" y="1410" width="300" height="105" rx="12" fill="#e3f0e4" stroke="#aabdd0" stroke-width="1.5"/>
<text x="866" y="1441" font-size="23" font-weight="650" fill="#283a52" text-anchor="start">最后一步恢复 N 帧</text>
<text x="866" y="1470" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">特征插值 → 输出 MLP</text>
<text x="866" y="1496" font-size="20" font-weight="400" fill="#283a52" text-anchor="start">得到完整动作 x̂₀</text>
<path d="M360 1462 H420" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M790 1462 H850" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M605 1515 V1560 H400 V1462 H420" fill="none" stroke="#4475a3" stroke-width="2.7" marker-end="url(#blue)"/>
<text x="420" y="1593" font-size="20" font-weight="650" fill="#283a52" text-anchor="start">重复关键帧去噪，直到最后一步</text>
<text x="50" y="1630" font-size="20" font-weight="400" fill="#526a55" text-anchor="start">C.4 计时使用此均匀路径；动态选帧另有开销，不能直接套用该速度。</text>
<text x="50" y="1658" font-size="20" font-weight="400" fill="#526a55" text-anchor="start">O(K²) 是注意力规模，不等于训练或端到端按同一倍率加速。</text>
<text x="32" y="1717" font-size="20" font-weight="400" fill="#60738a" text-anchor="start">原创教学重绘｜正式论文图 2、§3–4；补充 A–B、C.4。仅源文核验，未运行模型。</text>
</g></svg>