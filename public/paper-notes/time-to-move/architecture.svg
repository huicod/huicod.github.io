<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2030" viewBox="0 0 1320 2030" role="img" aria-labelledby="title desc"><title id="title">Time-to-Move 完整架构</title><desc id="desc">粗动画与掩码输入，预训练视频模型进行前段区域覆盖和后段共同细化。两种时钟指去噪约束释放时间，不是视频播放时间。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52647b" stroke-width="1.6"/></marker></defs><rect width="1320" height="2030" fill="#f5f7fb"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#17304c} .title{font-size:34px;font-weight:700}.section{font-size:26px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#52647b}.line{fill:none;stroke:#52647b;stroke-width:3;marker-end:url(#arrow)}.label{font-size:21px;font-weight:700;fill:#275d80}</style><text x="48" y="60" class="title">Time-to-Move｜先做粗动画，再按区域释放生成自由度</text><text x="48" y="98" class="small">ICLR 2026 · 根据正式稿 §3、§5、附录 D 与官方采样实现教学重绘</text><rect x="32" y="128" width="1256" height="475" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="60" y="173" class="section">A  控制信号：像素参考携带路径与外观</text><rect x="60" y="215" width="240" height="145" rx="16" fill="#eef4ff" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="253" class="head">首帧图像 I</text><text x="82" y="295" class="body">选定对象 / 场景</text><text x="82" y="328" class="body">保留清晰外观锚点</text><rect x="360" y="215" width="390" height="145" rx="16" fill="#e9f7f1" stroke="#cbd5e1" stroke-width="2"/><text x="383" y="254" class="head">对象控制</text><text x="383" y="292" class="body">拖动 · 旋转 · 缩放 · 改色</text><text x="383" y="325" class="body">关键位置插值 → 逆变换渲染</text><rect x="360" y="391" width="390" height="145" rx="16" fill="#fff3df" stroke="#cbd5e1" stroke-width="2"/><text x="383" y="432" class="head">相机控制</text><text x="383" y="470" class="body">深度估计 → 点云 → 重投影</text><text x="383" y="503" class="body">可靠投影区与空洞区分别处理</text><rect x="817" y="290" width="423" height="194" rx="16" fill="#edf5fc" stroke="#cbd5e1" stroke-width="2"/><text x="841" y="329" class="head">粗参考视频 Vʷ + 逐帧掩码 M</text><text x="841" y="372" class="body">M = 1：强跟随参考的区域</text><text x="841" y="405" class="body">M = 0：允许较早自由生成</text><text x="841" y="438" class="body">相机空洞不当作可靠参考</text><path d="M300 286 H350" class="line"/><path d="M320 286 V460 H350" class="line"/><path d="M750 285 H787 V342 H807" class="line"/><path d="M750 460 H787 V426 H807" class="line"/><text x="60" y="575" class="small">输入还很粗糙：可有贴纸边缘与静态背景；自然形变、遮挡和环境响应交给视频先验。</text><rect x="32" y="630" width="1256" height="793" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="60" y="675" class="section">B  推理主流程：前段覆盖参考，后段共同细化</text><rect x="60" y="722" width="250" height="132" rx="16" fill="#edf5fc" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="760" class="head">编码参考视频</text><text x="82" y="801" class="body">预训练 VAE → zʷ</text><text x="82" y="834" class="body">M 下采样至潜空间</text><rect x="366" y="722" width="280" height="132" rx="16" fill="#fff3df" stroke="#cbd5e1" stroke-width="2"/><text x="389" y="760" class="head">从中间噪声起步</text><text x="389" y="802" class="body">给 zʷ 加噪到 t_weak</text><text x="389" y="835" class="body">得到初始视频潜变量</text><rect x="818" y="722" width="422" height="132" rx="16" fill="#eef4ff" stroke="#cbd5e1" stroke-width="2"/><text x="840" y="760" class="head">清晰首帧：原 I2V 条件路径</text><text x="840" y="802" class="body">沿用骨干的图像条件编码</text><text x="840" y="835" class="body">Cog / Wan 还可使用文本提示</text><path d="M310 790 H356" class="line"/><path d="M507 854 V918" class="line"/><rect x="60" y="928" width="800" height="175" rx="16" fill="#e9f7f1" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="968" class="head">① 受控区域仍跟随参考</text><text x="82" y="1010" class="body">每一步：普通去噪 → M 内替换为同噪声水平的参考</text><text x="82" y="1043" class="body">M 外保留模型更新；参考噪声沿用固定采样</text><text x="82" y="1076" class="body">重复到 t_strong，随后停止覆盖</text><rect x="60" y="1160" width="800" height="154" rx="16" fill="#fff3df" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="1202" class="head">② 整段视频自由细化</text><text x="82" y="1244" class="body">继续常规去噪，主体与环境共同调整</text><text x="82" y="1277" class="body">保持运动意图，同时减轻贴纸边缘与僵硬感</text><path d="M460 1103 V1150" class="line"/><path d="M1030 854 V890 H900 V1013 H870" class="line"/><path d="M900 1013 V1130 H710 V1150" class="line"/><rect x="940" y="1160" width="300" height="154" rx="16" fill="#edf5fc" stroke="#cbd5e1" stroke-width="2"/><text x="962" y="1202" class="head">VAE 解码</text><text x="962" y="1244" class="body">生成 RGB 视频</text><text x="962" y="1277" class="body">轨迹仍可能有误差</text><path d="M860 1235 H930" class="line"/><text x="60" y="1370" class="small">预训练模型与参数保持不变；采样仍使用全局时间步，区域差异通过潜变量覆盖实现。</text><rect x="32" y="1450" width="1256" height="535" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="60" y="1495" class="section">C  双时钟的含义：不同区域在何时解除参考约束</text><text x="60" y="1538" class="small">去噪方向：高噪声 → 低噪声。这里的 t 不代表视频播放时刻。</text><text x="295" y="1590" class="label">t_weak</text><text x="818" y="1590" class="label">t_strong</text><text x="1200" y="1590" class="label">0</text><path d="M300 1610 H1230" class="line"/><text x="60" y="1665" class="body">非受控区 M = 0</text><rect x="300" y="1630" width="927" height="51" rx="6" fill="#e9f7f1" stroke="#b1d9cb" stroke-width="2"/><text x="330" y="1664" class="body">从起点起保留网络更新：较早自由生成</text><text x="60" y="1735" class="body">受控区 M = 1</text><rect x="300" y="1700" width="550" height="51" rx="6" fill="#dae9ff" stroke="#a9c6eb" stroke-width="2"/><text x="323" y="1734" class="body">逐步覆盖同噪声水平的参考</text><rect x="850" y="1700" width="377" height="51" rx="6" fill="#fff0d6" stroke="#dec69c" stroke-width="2"/><text x="876" y="1734" class="body">解除覆盖 → 共同细化</text><text x="60" y="1811" class="head">覆盖规则：x_next = (1 − M) ⊙ 去噪结果 + M ⊙ 加噪参考</text><text x="60" y="1855" class="body">论文噪声值：t_weak &gt; t_strong；代码采样索引方向相反，开始索引 &lt; 释放索引。</text><text x="60" y="1891" class="body">强约束到最后可降低轨迹误差，却容易损失自然度；释放不是逐像素锁定保证。</text><text x="60" y="1950" class="small">输出边界：RGB 视频；没有骨骼关节、接触力或可执行动作指令。</text></svg>