<text x="577" y="935" class="t">骨架度量下的解析投影</text>
<text x="577" y="968" class="b">Δx = R⁻¹Aᵀ(AR⁻¹Aᵀ+Σ)⁻¹(y−Ax̂₁)</text>
<text x="577" y="997" class="b">修正终点 x̂₁* = x̂₁ + Δx</text>
<text x="577" y="1026" class="b">一致的线性硬约束 → A x̂₁* = y（数值精度）</text>
