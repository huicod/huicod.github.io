<text x="55" y="1531" class="t">C  保证范围与独立验收</text>
<text x="65" y="1565" class="b">精确：所编码且一致的线性等式。另验：骨长、接触、避碰、文本语义与物理可执行性。</text>
<text x="65" y="1608" class="b">二维零残差不唯一确定三维深度；首尾位置相等不自动保证速度与接触连续。</text>
