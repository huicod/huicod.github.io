<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="title desc">
<title id="title">Kinematic Frequency Motion：项目与代码数据流教学图</title>
<desc id="desc">区分离线MEMD频段监督、内容与粗细风格条件的推理、冻结前端后的扩散训练。全文未取得，不能作为论文架构逐项复核版本。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#445b72"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c17827"/></marker>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#233648} .title{font-size:30px;font-weight:700} .section{font-size:24px;font-weight:700}.node{font-size:20px;font-weight:700}.small{font-size:18px}.note{font-size:17px;fill:#52657a}.flow{fill:none;stroke:#445b72;stroke-width:2.5;marker-end:url(#arrow)}.super{fill:none;stroke:#c17827;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#orange)}.box{fill:#fff;stroke:#9baec0;stroke-width:1.6;rx:12}.blue{fill:#edf5ff;stroke:#80a7d2;stroke-width:1.7;rx:12}.purple{fill:#f3edfb;stroke:#b498d0;stroke-width:1.7;rx:12}.green{fill:#edf7f0;stroke:#89b59a;stroke-width:1.7;rx:12}.orangebox{fill:#fff5e9;stroke:#d6aa70;stroke-width:1.7;rx:12}</style></defs>
<rect width="1440" height="1800" fill="#fff"/>
<text x="42" y="47" class="title">Kinematic Frequency Motion｜连续频率条件如何进入动作生成</text>
<text x="42" y="80" class="note">项目与代码解读 · 依据公开架构图与代码 827f3dba · 未取得论文全文，未运行模型</text>

<rect x="28" y="103" width="1384" height="275" rx="17" fill="#fbf6ee" stroke="#dfc6a2"/>
<text x="48" y="139" class="section">A　离线频率监督：先为当前数据集定义三个可对齐的模态</text>
<rect x="50" y="162" width="280" height="91" class="orangebox"/><text x="67" y="191" class="node">SMPL 69维时间信号</text><text x="67" y="219" class="small">根旋转3 + 身体63 + 平移3</text><text x="67" y="243" class="note">20Hz；与HumanML263配对</text>
<rect x="370" y="162" width="270" height="91" class="orangebox"/><text x="387" y="191" class="node">多变量EMD（MEMD）</text><text x="387" y="219" class="small">产生对齐的可变数量IMF</text><text x="387" y="243" class="note">去残差；保留 ≥0.5Hz模态</text>
<rect x="680" y="162" width="330" height="91" class="orangebox"/><text x="697" y="191" class="node">数据集自适应频段对齐</text><text x="697" y="219" class="small">幅值Top3 → 频率排序 → 均值</text><text x="697" y="243" class="note">每段不重复匹配高 / 中 / 低</text>
<rect x="1050" y="162" width="310" height="91" class="orangebox"/><text x="1067" y="191" class="node">学习IMF提取器</text><text x="1067" y="219" class="small">263维输入 → 3 × 69维输出</text><text x="1067" y="243" class="note">根 / 身体 / 平移分组解码</text>
<path d="M330 207H366" class="flow"/><path d="M640 207H676" class="flow"/><path d="M1010 207H1046" class="flow"/>
<text x="52" y="295" class="small">频段是数据集相关的连续信号；0.5Hz是候选过滤门槛，不是固定的粗 / 细风格分界。</text>
<text x="52" y="330" class="note">IMF伪目标用于训练提取器。缺少三个有效模态的片段不进入该监督集；不是语义标签或可读动作程序。</text>

<rect x="28" y="405" width="1384" height="1000" rx="17" fill="#f5f8fb" stroke="#b6c7d5"/>
<text x="48" y="443" class="section">B　推理：内容与风格分别提供软条件，扩散生成连续动作</text>
<rect x="52" y="474" width="245" height="103" class="blue"/><text x="68" y="506" class="node">内容动作</text><text x="68" y="537" class="small">HumanML263，20Hz</text><text x="68" y="562" class="note">例：转弯行走</text>
<rect x="352" y="472" width="255" height="78" class="blue"/><text x="370" y="501" class="node">冻结VAE编码器</text><text x="370" y="529" class="small">前三通道置零 → latent</text>
<rect x="352" y="581" width="255" height="78" class="blue"/><text x="370" y="610" class="node">根运动编码器</text><text x="370" y="638" class="small">从内容提取轨迹条件</text>
<rect x="352" y="691" width="255" height="78" class="blue"/><text x="370" y="720" class="node">接触时序预测器</text><text x="370" y="748" class="small">内容侧软接触条件</text>
<path d="M297 512H348" class="flow"/><path d="M319 512V620H348" class="flow"/><path d="M319 620V730H348" class="flow"/>
<rect x="682" y="580" width="300" height="112" class="green"/><text x="699" y="612" class="node">轨迹条件融合</text><text x="699" y="640" class="small">内容根运动 + 参考平移IMF</text><text x="699" y="669" class="small">+ 内容侧接触时序编码</text>
<path d="M607 620H678" class="flow"/><path d="M607 730H643V673H678" class="flow"/>

<rect x="52" y="843" width="245" height="113" class="purple"/><text x="68" y="876" class="node">风格动作参考</text><text x="68" y="906" class="small">可分别提供粗 / 细参考</text><text x="68" y="934" class="note">例：舞蹈踢腿动作</text>
<rect x="352" y="803" width="255" height="78" class="purple"/><text x="370" y="832" class="node">冻结MotionCLIP</text><text x="370" y="860" class="small">参考动作 → 风格嵌入</text>
<rect x="352" y="911" width="255" height="104" class="purple"/><text x="370" y="941" class="node">冻结IMF提取器</text><text x="370" y="972" class="small">高 / 中 / 低三频段</text><text x="370" y="999" class="note">每频段分根、身体、平移</text>
<path d="M297 880H323V842H348" class="flow"/><path d="M323 880V961H348" class="flow"/>
<rect x="682" y="782" width="300" height="100" class="purple"/><text x="699" y="813" class="node">粗风格条件</text><text x="699" y="842" class="small">MotionCLIP嵌入</text><text x="699" y="869" class="small">+ 投影后的低频IMF摘要</text>
<rect x="682" y="918" width="300" height="80" class="purple"/><text x="699" y="947" class="node">细风格条件</text><text x="699" y="977" class="small">卷积 / 时间池化 → 嵌入 × α</text>
<path d="M607 841H678" class="flow"/><path d="M607 943H645V870H678" class="flow"/><path d="M607 965H678" class="flow"/>
<path d="M607 994H627V1084H998V650H982" class="flow"/>
<text x="658" y="1072" class="note">高中频中的根平移部分 → 轨迹细节</text>

<rect x="1050" y="535" width="310" height="463" class="green"/>
<text x="1070" y="570" class="node">Dual-Style DiT 去噪器</text><text x="1070" y="608" class="small">内容token与带噪latent</text>
<text x="1070" y="674" class="small">轨迹条件 → MLP调制</text>
<text x="1070" y="814" class="small">粗风格 → 注意力调制</text>
<text x="1070" y="952" class="small">细风格 → 后段层调制</text>
<path d="M607 511H1025V592H1046" class="flow"/><path d="M982 636H1046" class="flow"/><path d="M982 832H1046" class="flow"/><path d="M982 958H1046" class="flow"/>
<rect x="1100" y="462" width="260" height="54" class="box"/><text x="1116" y="496" class="small">初始噪声 zT + 时间步</text><path d="M1230 516V531" class="flow"/>
<rect x="1050" y="1042" width="310" height="82" class="green"/><text x="1067" y="1071" class="node">DDIM50步 → VAE解码</text><text x="1067" y="1100" class="small">预测噪声迭代 → 连续动作特征</text>
<path d="M1205 998V1038" class="flow"/>
<rect x="1050" y="1180" width="310" height="85" class="green"/>
<text x="1067" y="1211" class="node">原始22关节输出</text><text x="1067" y="1241" class="small">先保存 joints_raw</text>
<path d="M1205 1124V1176" class="flow"/>
<rect x="650" y="1180" width="330" height="85" class="orangebox"/>
<text x="667" y="1211" class="node">可选：接触与姿态软优化</text><text x="667" y="1241" class="small">后处理展示版本 joints</text>
<path d="M1050 1223H984" class="flow"/>
<text x="52" y="1307" class="small">全局尺度 s 作用于整体CFG；细节尺度 α 乘条件嵌入。两者不是对称、完全独立的控制器。</text>
<text x="52" y="1343" class="note">作者称定量指标使用raw输出；展示另有软优化。内容、轨迹、接触都不是由结构直接保证的硬约束。</text>
<text x="52" y="1376" class="note">粗风格参考 → MotionCLIP，与低频摘要分别编码后相加；不是把低频曲线直接送入MotionCLIP。</text>

<rect x="28" y="1430" width="1384" height="340" rx="17" fill="#fbf6ee" stroke="#dfc6a2"/>
<text x="48" y="1470" class="section">C　训练：固定前端，同片段条件去噪 + 频率一致性</text>
<rect x="53" y="1505" width="370" height="135" class="orangebox"/>
<text x="72" y="1537" class="node">同一真实动作片段</text><text x="72" y="1568" class="small">构造目标latent及内容 / 风格条件</text><text x="72" y="1598" class="small">VAE、IMF、接触、MotionCLIP冻结</text><text x="72" y="1625" class="note">默认未开启跨样本风格混合</text>
<rect x="480" y="1505" width="370" height="135" class="orangebox"/>
<text x="500" y="1537" class="node">可训练条件编码与DiT</text><text x="500" y="1568" class="small">目标latent加噪 → 预测噪声</text><text x="500" y="1598" class="small">估计干净latent → VAE解码</text><text x="500" y="1625" class="note">去噪损失 + 频率相关辅助损失</text>
<rect x="907" y="1505" width="450" height="135" class="orangebox"/>
<text x="927" y="1537" class="node">冻结IMF提取器提供比较空间</text><text x="927" y="1568" class="small">生成动作与真实动作 → 各自IMF</text><text x="927" y="1598" class="small">比较信号 / 振幅 / 频率 / 嵌入</text><text x="927" y="1625" class="note">当前online目标不在每个batch运行MEMD</text>
<path d="M423 1572H476" class="super"/><path d="M907 1572H854" class="super"/>
<text x="52" y="1682" class="small">公开默认训练可核为同片段条件重建；不能写成已经存在内容A＋风格B→目标A×B的配对监督。</text>
<text x="52" y="1720" class="note">前端先训练 / 复用，再冻结用于去噪器训练。频率损失不是输出频率、接触或事件时刻的精确约束。</text>
<text x="52" y="1750" class="note">依据公开实现教学重绘；作者原图可在正文链接查看。论文原表与消融未取得，配置选项不代表实验结论。</text>
</svg>
