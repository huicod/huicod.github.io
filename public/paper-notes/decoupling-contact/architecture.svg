<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1970" viewBox="0 0 1120 1970" role="img" aria-labelledby="title desc"><title id="title">Decoupling Contact：轨迹、接触与风格的分离和控制</title><desc id="desc">先训练髋部速度条件CVAE与接触预测器，再冻结解码器训练迁移前端。推理提取三路特征，生成髋部速度H和潜变量z，由条件解码器生成动作；可选髋部编辑仍是软控制。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52657a"/></marker><marker id="darr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#805875"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#203348}.title{font-size:29px;font-weight:700}.section{font-size:24px;font-weight:700}.node{font-size:23px;font-weight:600}.small{font-size:20px}.note{font-size:19px;fill:#53667a}.edge{fill:none;stroke:#52657a;stroke-width:2.6;marker-end:url(#arr)}.dash{fill:none;stroke:#805875;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#darr)}</style><rect width="1120" height="1970" fill="white"/><text x="40" y="48" class="title">Decoupling Contact：先协调脚步，再分开编辑因素</text><text x="40" y="80" class="note">正文图 3–4 / 补充 §1.2 的教学重绘 · h 是局部 XZ 平移速度 + Y 轴角速度</text>
<rect x="25" y="110" width="1070" height="335" rx="18" fill="#f8fafc" stroke="#d8e2ec"/>
<text x="48" y="146" class="section">A  预训练：学习以髋部速度为条件的动作先验</text>
<rect x="60" y="180" width="300" height="74" rx="12" fill="#edf3f8" stroke="#b6c9dc" stroke-width="1.6"/>
<text x="210.0" y="209.0" text-anchor="middle" class="node">训练动作序列 x</text>
<text x="210.0" y="241.0" text-anchor="middle" class="small">关节位置 / 速度 / 旋转</text>
<rect x="410" y="180" width="310" height="74" rx="12" fill="#edf3f8" stroke="#b6c9dc" stroke-width="1.6"/>
<text x="565.0" y="209.0" text-anchor="middle" class="node">CVAE 编码器</text>
<text x="565.0" y="241.0" text-anchor="middle" class="small">μ、Σ → 重参数采样</text>
<rect x="770" y="180" width="280" height="74" rx="12" fill="#edf3f8" stroke="#b6c9dc" stroke-width="1.6"/>
<text x="910.0" y="209.0" text-anchor="middle" class="node">整段动作潜变量 z</text>
<text x="910.0" y="241.0" text-anchor="middle" class="small">8 × 256</text>
<path d="M360 217 H410" class="edge"/>
<path d="M720 217 H770" class="edge"/>
<rect x="60" y="298" width="300" height="74" rx="12" fill="#e9f0fc" stroke="#94aed6" stroke-width="1.6"/>
<text x="210.0" y="327.0" text-anchor="middle" class="node">该动作的髋部速度 h</text>
<text x="210.0" y="359.0" text-anchor="middle" class="small">逐帧连续控制信号</text>
<rect x="410" y="298" width="640" height="74" rx="12" fill="#e9f4ee" stroke="#9fc2aa" stroke-width="1.6"/>
<text x="730.0" y="327.0" text-anchor="middle" class="node">CVAE 解码器 → 重建动作</text>
<text x="730.0" y="359.0" text-anchor="middle" class="small">h + 位置编码提供 Q；z 提供 K / V</text>
<path d="M360 335 H410" class="edge"/>
<path d="M910 254 V298" class="edge"/>
<text x="60" y="414" class="note">训练目标：动作重建 + KL；编码器 / 解码器各 9 层、隐藏维 256。</text>
<rect x="25" y="480" width="1070" height="280" rx="18" fill="#f8fafc" stroke="#d8e2ec"/>
<text x="48" y="516" class="section">B  训练迁移前端：接触代理监督 + 冻结动作解码器</text>
<rect x="60" y="548" width="300" height="72" rx="12" fill="#fff1df" stroke="#d9b37e" stroke-width="1.6"/>
<text x="210.0" y="576.0" text-anchor="middle" class="node">髋部速度 → fδ</text>
<text x="210.0" y="608.0" text-anchor="middle" class="small">另用阈值接触状态训练</text>
<rect x="410" y="548" width="640" height="72" rx="12" fill="#edf3f8" stroke="#b6c9dc" stroke-width="1.6"/>
<text x="730.0" y="576.0" text-anchor="middle" class="node">迁移前端 G（结构见 C）→ 冻结解码器</text>
<text x="730.0" y="608.0" text-anchor="middle" class="small">每次采样源动作与参考动作；接触来源交替</text>
<rect x="60" y="665" width="990" height="58" rx="12" fill="#f2eaf2" stroke="#c6abc3" stroke-width="1.6"/>
<text x="555.0" y="702.0" text-anchor="middle" class="node">监督：重建 / 循环 / 风格 Gram / 轨迹 / fδ 接触预测</text>
<path d="M210 620 V665" class="dash"/>
<path d="M730 620 V665" class="dash"/>
<path d="M1050 335 H1080 V640 H1058 V584 H1050" class="dash"/>
<text x="755" y="654" class="note">复用 A 中解码器并冻结</text>
<rect x="25" y="795" width="1070" height="745" rx="18" fill="#f8fafc" stroke="#d8e2ec"/>
<text x="48" y="831" class="section">C  推理主线：三路因素可取同一源动作，也可分别替换</text>
<rect x="60" y="865" width="300" height="70" rx="12" fill="#fff1df" stroke="#d9b37e" stroke-width="1.6"/>
<text x="210.0" y="892.0" text-anchor="middle" class="node">风格参考 Mₛ</text>
<text x="210.0" y="924.0" text-anchor="middle" class="small">提供身体动作风格</text>
<rect x="410" y="865" width="300" height="70" rx="12" fill="#e9f4ee" stroke="#9fc2aa" stroke-width="1.6"/>
<text x="560.0" y="892.0" text-anchor="middle" class="node">接触参考 M꜀ₜ</text>
<text x="560.0" y="924.0" text-anchor="middle" class="small">通常先取源动作</text>
<rect x="760" y="865" width="300" height="70" rx="12" fill="#e9f0fc" stroke="#94aed6" stroke-width="1.6"/>
<text x="910.0" y="892.0" text-anchor="middle" class="node">轨迹参考 Mₕ</text>
<text x="910.0" y="924.0" text-anchor="middle" class="small">通常先取源动作</text>
<rect x="60" y="980" width="300" height="82" rx="12" fill="#fff1df" stroke="#d9b37e" stroke-width="1.6"/>
<text x="210.0" y="1013.0" text-anchor="middle" class="node">Style GCN → zₛ</text>
<text x="210.0" y="1045.0" text-anchor="middle" class="small">输入髋部维度置零</text>
<rect x="410" y="980" width="300" height="82" rx="12" fill="#e9f4ee" stroke="#9fc2aa" stroke-width="1.6"/>
<text x="560.0" y="1013.0" text-anchor="middle" class="node">Contact GCN → z꜀ₜ</text>
<text x="560.0" y="1045.0" text-anchor="middle" class="small">输入髋部维度置零</text>
<rect x="760" y="980" width="300" height="82" rx="12" fill="#e9f0fc" stroke="#94aed6" stroke-width="1.6"/>
<text x="910.0" y="1013.0" text-anchor="middle" class="node">Trajectory CNN → zₜⱼ</text>
<text x="910.0" y="1045.0" text-anchor="middle" class="small">只读取髋部速度</text>
<path d="M210 935 V980" class="edge"/>
<path d="M560 935 V980" class="edge"/>
<path d="M910 935 V980" class="edge"/>
<rect x="465" y="1110" width="540" height="64" rx="12" fill="#edf3f8" stroke="#b6c9dc" stroke-width="1.6"/>
<text x="735.0" y="1150.0" text-anchor="middle" class="node">z꜀ₜ + zₜⱼ：组合内容条件</text>
<path d="M560 1062 V1110" class="edge"/>
<path d="M910 1062 V1110" class="edge"/>
<rect x="60" y="1224" width="650" height="82" rx="12" fill="#edf3f8" stroke="#b6c9dc" stroke-width="1.6"/>
<text x="385.0" y="1257.0" text-anchor="middle" class="node">AdaIN 风格调制 → 三层 Transformer</text>
<text x="385.0" y="1289.0" text-anchor="middle" class="small">风格 zₛ 调制内容；生成 H 和 z</text>
<path d="M210 1062 V1224" class="edge"/>
<path d="M735 1174 V1195 H545 V1224" class="edge"/>
<rect x="760" y="1210" width="300" height="105" rx="12" fill="#f3edf6" stroke="#c1acd0" stroke-width="1.6"/>
<text x="910.0" y="1238.5" text-anchor="middle" class="node">可调：三种特征插值</text>
<text x="910.0" y="1270.5" text-anchor="middle" class="small">风格 / 接触时序 / 轨迹</text>
<text x="910.0" y="1302.5" text-anchor="middle" class="small">各自取源与参考的混合</text>
<rect x="60" y="1360" width="650" height="74" rx="12" fill="#e9f4ee" stroke="#9fc2aa" stroke-width="1.6"/>
<text x="385.0" y="1389.0" text-anchor="middle" class="node">复用 CVAE 条件解码器</text>
<text x="385.0" y="1421.0" text-anchor="middle" class="small">H → Q，z → K / V；生成全身特征</text>
<path d="M250 1306 V1360" class="edge"/>
<path d="M520 1306 V1360" class="edge"/>
<text x="260" y="1341" class="note">H</text>
<text x="530" y="1341" class="note">z</text>
<rect x="60" y="1462" width="1000" height="50" rx="12" fill="#e9f4ee" stroke="#9fc2aa" stroke-width="1.6"/>
<text x="560.0" y="1495.0" text-anchor="middle" class="node">速度积分 → 校正骨长 / 求旋转 → 最终动画</text>
<path d="M385 1434 V1462" class="edge"/>
<text x="760" y="1372" class="note">复用训练后的前端与先验</text>
<text x="760" y="1404" class="note">不运行训练损失</text>
<text x="760" y="1436" class="note">原始帧不直接复制到输出</text>
<rect x="25" y="1575" width="1070" height="350" rx="18" fill="#f8fafc" stroke="#d8e2ec"/>
<text x="48" y="1611" class="section">D  可选推理编辑：改变髋部条件，再复用同一解码器</text>
<rect x="60" y="1648" width="300" height="110" rx="12" fill="#e9f0fc" stroke="#94aed6" stroke-width="1.6"/>
<text x="210.0" y="1679.0" text-anchor="middle" class="node">缩放髋部速度幅度</text>
<text x="210.0" y="1711.0" text-anchor="middle" class="small">改变前进速度</text>
<text x="210.0" y="1743.0" text-anchor="middle" class="small">脚步保持为经验效果</text>
<rect x="410" y="1648" width="300" height="110" rx="12" fill="#e9f0fc" stroke="#94aed6" stroke-width="1.6"/>
<text x="560.0" y="1679.0" text-anchor="middle" class="node">替换完整髋部速度</text>
<text x="560.0" y="1711.0" text-anchor="middle" class="small">同时改变轨迹</text>
<text x="560.0" y="1743.0" text-anchor="middle" class="small">和接触时序</text>
<rect x="760" y="1648" width="300" height="110" rx="12" fill="#fff1df" stroke="#d9b37e" stroke-width="1.6"/>
<text x="910.0" y="1679.0" text-anchor="middle" class="node">手工接触时间表 cₜ</text>
<text x="910.0" y="1711.0" text-anchor="middle" class="small">优化 ĥ：fδ 接触匹配</text>
<text x="910.0" y="1743.0" text-anchor="middle" class="small">轨迹保持 + 改动正则</text>
<rect x="180" y="1810" width="760" height="64" rx="12" fill="#e9f4ee" stroke="#9fc2aa" stroke-width="1.6"/>
<text x="560.0" y="1834.0" text-anchor="middle" class="node">编辑后的 ĥ + 潜变量 z → 条件解码器 → 动画</text>
<text x="560.0" y="1866.0" text-anchor="middle" class="small">保持目标是软约束；不保证任意接触、路径或端点精确满足</text>
<path d="M210 1758 V1810" class="edge"/>
<path d="M560 1758 V1810" class="edge"/>
<path d="M910 1758 V1810" class="edge"/>
<text x="40" y="1953" class="note">实线：数据流；虚线：训练监督 / 参数复用。图示不是物理仿真或模型运行结果。</text>
</svg>