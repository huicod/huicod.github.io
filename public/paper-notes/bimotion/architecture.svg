<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2500" viewBox="0 0 1440 2500" role="img" aria-labelledby="title desc">
<title id="title">BiMotion：从变长网格动画到连续样条生成的完整架构</title>
<desc id="desc">离线拟合B样条、VAE重建训练、Flow Matching训练与在线推理分开。推理只使用初始网格、法线、文本和噪声；初始形状查询直接进入解码器，初始顶点与固定三角面直接进入输出。多步流采样生成运动latent，解码控制点并按指定帧数重投影，不代表无限生成新事件。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#365c7d"/></marker>
<marker id="trainarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b8772f"/></marker>
<style>
text{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#19344e}
.title{font-size:31px;font-weight:700}.subtitle{font-size:20px;fill:#506b80}
.section{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}
.body{font-size:21px}.small{font-size:19px;fill:#506b80}
.panel{fill:#f6f9fc;stroke:#cad8e5;stroke-width:1.5}
.node{fill:#fff;stroke:#95afc4;stroke-width:1.8}
.training{fill:#fff5e8;stroke:#d8ad78;stroke-width:1.8}
.condition{fill:#edf5ff;stroke:#7ba7ce;stroke-width:1.8}
.output{fill:#eaf6ef;stroke:#83b397;stroke-width:1.8}
.flow{fill:none;stroke:#365c7d;stroke-width:2.6;marker-end:url(#arrow)}
.super{fill:none;stroke:#b8772f;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#trainarrow)}
</style></defs>
<rect width="1440" height="2500" fill="white"/>
<text x="40" y="48" class="title" text-anchor="start">BiMotion：用固定数量的控制点，表示整段网格运动</text>
<text x="40" y="81" class="subtitle" text-anchor="start">CVPR 2026 · 依据正文图2–3、补充图A1与公开实现重绘 · 非模型运行结果</text>
<rect x="25" y="105" width="1390" height="300" rx="12" class="panel"/>
<text x="48" y="147" class="section" text-anchor="start">A  离线数据准备：把变长位移轨迹变为固定16个控制点</text>
<rect x="50" y="175" width="300" height="120" rx="12" class="node"/>
<text x="68" y="209" class="label" text-anchor="start">变长网格序列</text>
<text x="68" y="241" class="body" text-anchor="start">同一片段内三角面不变</text>
<text x="68" y="270" class="body" text-anchor="start">初始网格 + 配对文本</text>
<rect x="400" y="175" width="300" height="120" rx="12" class="node"/>
<text x="418" y="209" class="label" text-anchor="start">顶点相对位移</text>
<text x="418" y="241" class="body" text-anchor="start">ΔVₜ = Vₜ − V₀</text>
<text x="418" y="270" class="body" text-anchor="start">每个顶点一条3D轨迹</text>
<rect x="750" y="175" width="300" height="120" rx="12" class="training"/>
<text x="768" y="209" class="label" text-anchor="start">拉普拉斯正则拟合</text>
<text x="768" y="241" class="body" text-anchor="start">三次B样条 / 闭式求解</text>
<text x="768" y="270" class="body" text-anchor="start">每顶点16个3D控制点</text>
<rect x="1100" y="175" width="290" height="120" rx="12" class="node"/>
<text x="1118" y="209" class="label" text-anchor="start">表面点与对应关系</text>
<text x="1118" y="241" class="body" text-anchor="start">预采样200K点及法线</text>
<text x="1118" y="270" class="body" text-anchor="start">重心插值得控制点 / 位移</text>
<path d="M350 235H396" class="flow"/>
<path d="M700 235H746" class="flow"/>
<path d="M1050 235H1096" class="flow"/>
<text x="50" y="342" class="small" text-anchor="start">训练时还保留16个时间采样上的真实位移用于监督；控制点不是16个语义动作，也不必落在轨迹上。</text>
<text x="50" y="376" class="small" text-anchor="start">这一闭式拟合只处理已有训练动画；推理时没有真实未来动作，不先拟合目标控制点。</text>
<rect x="25" y="435" width="1390" height="545" rx="12" class="panel"/>
<text x="48" y="477" class="section" text-anchor="start">B  B-spline VAE训练：同时学习形状条件与运动压缩 / 重建</text>
<rect x="50" y="510" width="300" height="130" rx="12" class="node"/>
<text x="68" y="544" class="label" text-anchor="start">每轮随机抽4096点</text>
<text x="68" y="576" class="body" text-anchor="start">位置 + 法线</text>
<text x="68" y="605" class="body" text-anchor="start">对应控制点 + 位移真值</text>
<rect x="400" y="510" width="330" height="130" rx="12" class="condition"/>
<text x="418" y="544" class="label" text-anchor="start">形状 / 运动双路嵌入</text>
<text x="418" y="576" class="body" text-anchor="start">位置PE + 法线融合 → F₀</text>
<text x="418" y="605" class="body" text-anchor="start">多级Control-PE → Fₖ</text>
<rect x="780" y="510" width="290" height="130" rx="12" class="node"/>
<text x="798" y="544" class="label" text-anchor="start">共享采样与空间压缩</text>
<text x="798" y="576" class="body" text-anchor="start">FPS取512个共享索引</text>
<text x="798" y="605" class="body" text-anchor="start">8层交叉注意力</text>
<rect x="1120" y="510" width="270" height="130" rx="12" class="output"/>
<text x="1138" y="544" class="label" text-anchor="start">形状 z₀ / 运动 zₖ</text>
<text x="1138" y="576" class="body" text-anchor="start">z₀：初始形状条件</text>
<text x="1138" y="605" class="body" text-anchor="start">zₖ：均值 / 方差采样</text>
<path d="M350 575H396" class="flow"/>
<path d="M730 575H776" class="flow"/>
<path d="M1070 575H1116" class="flow"/>
<path d="M1245 295V422H35V570H46" class="super"/>
<rect x="780" y="730" width="610" height="150" rx="12" class="node"/>
<text x="798" y="764" class="label" text-anchor="start">VAE解码器</text>
<text x="798" y="796" class="body" text-anchor="start">8层交替注意力恢复稀疏形状 / 运动特征</text>
<text x="798" y="825" class="body" text-anchor="start">完整F₀作query，稀疏形状作key、运动作value</text>
<text x="798" y="854" class="body" text-anchor="start">交叉注意力 + MLP → 各点控制点</text>
<rect x="400" y="730" width="330" height="150" rx="12" class="output"/>
<text x="418" y="764" class="label" text-anchor="start">重建控制点与轨迹</text>
<text x="418" y="796" class="body" text-anchor="start">预测16个控制点 P̂</text>
<text x="418" y="825" class="body" text-anchor="start">B样条重投影：B₁₆,₁₆ P̂</text>
<text x="418" y="854" class="body" text-anchor="start">回到连续轨迹的采样点</text>
<rect x="50" y="730" width="300" height="150" rx="12" class="training"/>
<text x="68" y="764" class="label" text-anchor="start">重建监督 + KL</text>
<text x="68" y="796" class="body" text-anchor="start">控制点拟合 LFit</text>
<text x="68" y="825" class="body" text-anchor="start">轨迹对应 LCorr</text>
<text x="68" y="854" class="body" text-anchor="start">局部刚性 LRigid + LKL</text>
<path d="M1255 640V726" class="flow"/>
<path d="M780 805H734" class="flow"/>
<path d="M400 805H354" class="flow"/>
<path d="M200 640V726" class="super"/>
<text x="215" y="693" class="small" text-anchor="start">真实控制点 / 位移</text>
<path d="M565 640V690H1000V726" class="flow"/>
<text x="742" y="684" class="small" text-anchor="middle">F₀：完整点特征旁路</text>
<text x="50" y="925" class="small" text-anchor="start">Control-PE层级：17 → 15 → 13 → 11 → 9 → 7 → 5 → 4；将末控制点复制一次，只用于嵌入。</text>
<text x="50" y="958" class="small" text-anchor="start">完成本阶段后，VAE提供形状编码、运动latent与控制点解码；法线融合帮助区分空间相近的不同表面。</text>
<rect x="25" y="1010" width="1390" height="335" rx="12" class="panel"/>
<text x="48" y="1052" class="section" text-anchor="start">C  Flow Matching训练：学习从噪声到运动latent的条件速度</text>
<rect x="50" y="1090" width="370" height="155" rx="12" class="node"/>
<text x="68" y="1124" class="label" text-anchor="start">已训练VAE + 真实动作</text>
<text x="68" y="1156" class="body" text-anchor="start">形状条件 z₀ / 运动目标 zₖ</text>
<text x="68" y="1185" class="body" text-anchor="start">按训练集统计标准化</text>
<text x="68" y="1214" class="body" text-anchor="start">配对文本 y；随机噪声 ε</text>
<rect x="475" y="1090" width="400" height="155" rx="12" class="training"/>
<text x="493" y="1124" class="label" text-anchor="start">构造训练位置与目标速度</text>
<text x="493" y="1156" class="body" text-anchor="start">zτ = τ zₖ + (1−τ) ε</text>
<text x="493" y="1185" class="body" text-anchor="start">速度目标 u = zₖ − ε</text>
<text x="493" y="1214" class="body" text-anchor="start">τ是流采样时间，不是动画时间</text>
<rect x="930" y="1090" width="460" height="155" rx="12" class="condition"/>
<text x="948" y="1124" class="label" text-anchor="start">12层DiT速度网络</text>
<text x="948" y="1156" class="body" text-anchor="start">条件：z₀、CLIP文本与τ</text>
<text x="948" y="1185" class="body" text-anchor="start">自注意力 + 分路交叉注意力</text>
<text x="948" y="1214" class="body" text-anchor="start">MSE：预测速度对齐 u</text>
<path d="M420 1150H471" class="flow"/>
<path d="M875 1135H926" class="flow"/>
<path d="M875 1210H926" class="super"/>
<text x="50" y="1290" class="small" text-anchor="start">初始形状latent与带噪运动latent沿通道拼接；形状和文本分别参与注意力，预测的是运动latent速度。</text>
<text x="50" y="1324" class="small" text-anchor="start">数据提供真实未来仅用于训练；推理主线在下方，不输入真实未来轨迹或控制点。</text>
<rect x="25" y="1375" width="1390" height="1045" rx="12" class="panel"/>
<text x="48" y="1417" class="section" text-anchor="start">D  在线推理：初始网格 + 文本 → 多步流采样 → 连续网格动画</text>
<rect x="50" y="1455" width="330" height="125" rx="12" class="condition"/>
<text x="68" y="1489" class="label" text-anchor="start">输入初始网格 M₀</text>
<text x="68" y="1521" class="body" text-anchor="start">顶点 V₀、表面法线</text>
<text x="68" y="1550" class="body" text-anchor="start">保留原三角面 Fmesh</text>
<rect x="430" y="1455" width="425" height="125" rx="12" class="node"/>
<text x="448" y="1489" class="label" text-anchor="start">VAE形状编码 / 法线融合</text>
<text x="448" y="1521" class="body" text-anchor="start">生成形状latent z₀</text>
<text x="448" y="1550" class="body" text-anchor="start">保留完整点查询特征 F₀</text>
<rect x="50" y="1640" width="330" height="100" rx="12" class="condition"/>
<text x="68" y="1674" class="label" text-anchor="start">用户文字 y</text>
<text x="68" y="1706" class="body" text-anchor="start">如：蹲下、后空翻、落地</text>
<rect x="430" y="1640" width="425" height="100" rx="12" class="node"/>
<text x="448" y="1674" class="label" text-anchor="start">预训练CLIP文本编码器</text>
<text x="448" y="1706" class="body" text-anchor="start">语义特征作为生成条件</text>
<rect x="50" y="1800" width="330" height="100" rx="12" class="condition"/>
<text x="68" y="1834" class="label" text-anchor="start">随机高斯噪声 ε</text>
<text x="68" y="1866" class="body" text-anchor="start">在运动latent空间初始化</text>
<rect x="930" y="1510" width="460" height="390" rx="12" class="output"/>
<text x="948" y="1544" class="label" text-anchor="start">Rectified Flow多步采样</text>
<text x="948" y="1576" class="body" text-anchor="start">12层DiT：预测latent速度</text>
<text x="948" y="1605" class="body" text-anchor="start">初始形状 + 文本分路注意力</text>
<text x="948" y="1634" class="body" text-anchor="start">逐步积分ODE，从噪声到 zₖ</text>
<text x="948" y="1663" class="body" text-anchor="start"></text>
<text x="948" y="1692" class="body" text-anchor="start">CFG调整文本 / 形状引导</text>
<text x="948" y="1721" class="body" text-anchor="start">恢复motion latent的原尺度</text>
<path d="M380 1517H426" class="flow"/>
<path d="M380 1690H426" class="flow"/>
<path d="M855 1517H900V1585H926" class="flow"/>
<path d="M855 1690H926" class="flow"/>
<path d="M380 1850H926" class="flow"/>
<text x="600" y="1839" class="small" text-anchor="middle">带噪运动latent</text>
<rect x="930" y="1970" width="460" height="150" rx="12" class="node"/>
<text x="948" y="2004" class="label" text-anchor="start">VAE连续运动解码</text>
<text x="948" y="2036" class="body" text-anchor="start">输入 z₀、zₖ与全顶点查询F₀</text>
<text x="948" y="2065" class="body" text-anchor="start">稀疏latent → 稠密点特征</text>
<text x="948" y="2094" class="body" text-anchor="start">预测每顶点16个3D控制点</text>
<rect x="500" y="1970" width="350" height="150" rx="12" class="output"/>
<text x="518" y="2004" class="label" text-anchor="start">控制点 P̂ → B样条求值</text>
<text x="518" y="2036" class="body" text-anchor="start">选择输出时间采样 / 帧数 T</text>
<text x="518" y="2065" class="body" text-anchor="start">构造基矩阵 Bₜ,₁₆</text>
<text x="518" y="2094" class="body" text-anchor="start">ΔV̂ = Bₜ,₁₆ P̂</text>
<rect x="50" y="1970" width="370" height="150" rx="12" class="output"/>
<text x="68" y="2004" class="label" text-anchor="start">恢复网格位置</text>
<text x="68" y="2036" class="body" text-anchor="start">V̂(t) = V₀ + ΔV̂(t)</text>
<text x="68" y="2065" class="body" text-anchor="start">沿用原始三角面连接</text>
<text x="68" y="2094" class="body" text-anchor="start">无需逐帧重新生成拓扑</text>
<path d="M1160 1900V1966" class="flow"/>
<path d="M930 2045H854" class="flow"/>
<path d="M500 2045H424" class="flow"/>
<path d="M650 1580V1610H880V2010H926" class="flow"/>
<text x="870" y="1936" class="small" text-anchor="end">z₀ / F₀旁路</text>
<path d="M50 1517H35V2032H46" class="flow"/>
<text x="45" y="1947" class="small" text-anchor="start">V₀、Fmesh</text>
<rect x="50" y="2200" width="800" height="105" rx="12" class="output"/>
<text x="68" y="2234" class="label" text-anchor="start">输出：固定拓扑的网格动画</text>
<text x="68" y="2266" class="body" text-anchor="start">代码另把输入网格放在开头；后续曲线不强制首位移为零</text>
<path d="M235 2120V2196" class="flow"/>
<rect x="930" y="2200" width="460" height="105" rx="12" class="condition"/>
<text x="948" y="2234" class="label" text-anchor="start">帧数T改变采样密度</text>
<text x="948" y="2266" class="body" text-anchor="start">同一曲线可重采样；不增添新事件</text>
<path d="M930 2252H895V2155H675V2124" class="flow"/>
<text x="50" y="2355" class="small" text-anchor="start">B样条的局部支撑不是事件、接触或骨长的硬保证；原始首帧被保留，不等于与生成后续帧无缝衔接。</text>
<text x="50" y="2391" class="small" text-anchor="start">来源：正式正文§3、图2–3、式3–14；补充§A、图A1。512 tokens为论文设置，当前GLB实现可自适应增加。</text>
<text x="50" y="2460" class="small" text-anchor="start">实线：表示 / 条件数据流　　橙色虚线：训练数据或监督　　教学示意，未运行模型</text>
</svg>