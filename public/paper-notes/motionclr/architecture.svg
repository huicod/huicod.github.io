<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1194" width="1200" height="1194" role="img" aria-labelledby="title desc"><title id="title">MotionCLR 架构与编辑</title><desc id="desc">从扩散训练到词帧注意力干预，再到生成动作的误差与次数核验。</desc><defs><marker orient="auto" markerWidth="7" markerHeight="7" refX="6" refY="3.5" id="ah"><path d="M0 0 L7 3.5 L0 7 Z" fill="#446073"/></marker></defs><rect width="1200" height="1194" rx="22" fill="#f8fafc"/><g fill="#19374b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="61" font-size="36" font-weight="700" fill="#19374b">MotionCLR｜拆开两种注意力，编辑生成中的动作</text><text x="42" y="104" font-size="22" font-weight="400" fill="#19374b">原创教学示意 · A、B 是训练体系；C 在采样时编辑；D 展示怎样核对实际动作。</text><rect x="25" y="136" width="1150" height="246" rx="16" fill="#e4eef9"/><text x="45" y="176" font-size="27" font-weight="700" fill="#235178">A  训练一次基础模型 · 文本与动捕配对样本</text><rect x="45" y="197" width="347" height="128" rx="10" fill="white" stroke="#235178" stroke-width="1.5"/><text x="60" y="232" font-size="23" font-weight="700" fill="#235178">连续动作序列</text><text x="60" y="272" font-size="20" font-weight="400" fill="#19374b">按随机扩散步 t 加入高斯噪声</text><text x="60" y="302" font-size="20" font-weight="400" fill="#19374b">xₜ 携带当前帧特征</text><path d="M393 262h25" stroke="#446073" stroke-width="2.4" fill="none" marker-end="url(#ah)"/><rect x="425" y="197" width="347" height="128" rx="10" fill="white" stroke="#235178" stroke-width="1.5"/><text x="440" y="232" font-size="23" font-weight="700" fill="#235178">训练去噪 U-Net</text><text x="440" y="272" font-size="20" font-weight="400" fill="#19374b">同时输入噪声步与词级条件</text><text x="440" y="302" font-size="20" font-weight="400" fill="#19374b">多尺度 CLR 堆叠，估计干净动作</text><path d="M773 262h25" stroke="#446073" stroke-width="2.4" fill="none" marker-end="url(#ah)"/><rect x="805" y="197" width="347" height="128" rx="10" fill="white" stroke="#235178" stroke-width="1.5"/><text x="820" y="232" font-size="23" font-weight="700" fill="#235178">与真实动作比较</text><text x="820" y="272" font-size="20" font-weight="400" fill="#19374b">对有效帧求重建误差</text><text x="820" y="302" font-size="20" font-weight="400" fill="#19374b">更新去噪器；冻结 CLIP 编码器</text><text x="46" y="358" font-size="20" font-weight="400" fill="#235178">文字走独立支路，冻结 CLIP 产生逐词特征。配对训练不要求每个动词都有人工标好的起止帧。</text><rect x="25" y="399" width="1150" height="246" rx="16" fill="#e1f2ec"/><text x="45" y="439" font-size="27" font-weight="700" fill="#266251">B  放大一个 CLR 块 · 两种“时间”分开读</text><rect x="45" y="460" width="347" height="128" rx="10" fill="white" stroke="#266251" stroke-width="1.5"/><text x="60" y="495" font-size="23" font-weight="700" fill="#266251">Conv1D 与扩散步 t</text><text x="60" y="535" font-size="20" font-weight="400" fill="#19374b">t 表示现在噪声有多强</text><text x="60" y="565" font-size="20" font-weight="400" fill="#19374b">与骨架第几帧是两种索引</text><path d="M393 525h25" stroke="#446073" stroke-width="2.4" fill="none" marker-end="url(#ah)"/><rect x="425" y="460" width="347" height="128" rx="10" fill="white" stroke="#266251" stroke-width="1.5"/><text x="440" y="495" font-size="23" font-weight="700" fill="#266251">自注意力＋交叉注意力</text><text x="440" y="535" font-size="20" font-weight="400" fill="#19374b">先算动作帧 × 动作帧</text><text x="440" y="565" font-size="20" font-weight="400" fill="#19374b">再算动作帧 × 文本词元</text><path d="M773 525h25" stroke="#446073" stroke-width="2.4" fill="none" marker-end="url(#ah)"/><rect x="805" y="460" width="347" height="128" rx="10" fill="white" stroke="#266251" stroke-width="1.5"/><text x="820" y="495" font-size="23" font-weight="700" fill="#266251">FFN 与多尺度传播</text><text x="820" y="535" font-size="20" font-weight="400" fill="#19374b">每个采样块含两个 CLR 块</text><text x="820" y="565" font-size="20" font-weight="400" fill="#19374b">在降采样、上采样中传递特征</text><text x="46" y="621" font-size="20" font-weight="400" fill="#266251">自注意力的 Q/K/V 均来自运动。交叉注意力取运动作 Q、词特征作 K/V；两支随后共同影响生成。</text><rect x="25" y="662" width="1150" height="246" rx="16" fill="#fff0d8"/><text x="45" y="702" font-size="27" font-weight="700" fill="#875320">C  推理编辑 · 同一个预训练去噪器</text><rect x="45" y="723" width="347" height="128" rx="10" fill="white" stroke="#875320" stroke-width="1.5"/><text x="60" y="758" font-size="23" font-weight="700" fill="#875320">参考与编辑分支</text><text x="60" y="798" font-size="20" font-weight="400" fill="#19374b">生成参考运动；实际动捕可按</text><text x="60" y="828" font-size="20" font-weight="400" fill="#19374b">论文先用 DDIM 反演作起点</text><path d="M393 788h25" stroke="#446073" stroke-width="2.4" fill="none" marker-end="url(#ah)"/><rect x="425" y="723" width="347" height="128" rx="10" fill="white" stroke="#875320" stroke-width="1.5"/><text x="440" y="758" font-size="23" font-weight="700" fill="#875320">在指定去噪步干预</text><text x="440" y="798" font-size="20" font-weight="400" fill="#19374b">交叉：换词布局／强弱／局部抑制</text><text x="440" y="828" font-size="20" font-weight="400" fill="#19374b">自注意：时移／示例重排／风格 Q</text><path d="M773 788h25" stroke="#446073" stroke-width="2.4" fill="none" marker-end="url(#ah)"/><rect x="805" y="723" width="347" height="128" rx="10" fill="white" stroke="#875320" stroke-width="1.5"/><text x="820" y="758" font-size="23" font-weight="700" fill="#875320">继续去噪并解码表示</text><text x="820" y="798" font-size="20" font-weight="400" fill="#19374b">恢复全身关节序列与根运动</text><text x="820" y="828" font-size="20" font-weight="400" fill="#19374b">检查目标动作和未编辑时间段</text><text x="46" y="884" font-size="20" font-weight="400" fill="#875320">来源图 2–5、附录 F。参考图提供时序结构，编辑词提供新内容；未编辑区需对输出关节测误差。</text><rect x="25" y="925" width="1150" height="246" rx="16" fill="#eee9f8"/><text x="45" y="965" font-size="27" font-weight="700" fill="#624d87">D  诊断 · 校验“跳四次”是否真得到四次</text><rect x="45" y="986" width="347" height="128" rx="10" fill="white" stroke="#624d87" stroke-width="1.5"/><text x="60" y="1021" font-size="23" font-weight="700" fill="#624d87">观察初次生成</text><text x="60" y="1061" font-size="20" font-weight="400" fill="#19374b">人工或运动指标核对次数</text><text x="60" y="1091" font-size="20" font-weight="400" fill="#19374b">论文例子要求四次却生成七次</text><path d="M393 1051h25" stroke="#446073" stroke-width="2.4" fill="none" marker-end="url(#ah)"/><rect x="425" y="986" width="347" height="128" rx="10" fill="white" stroke="#624d87" stroke-width="1.5"/><text x="440" y="1021" font-size="23" font-weight="700" fill="#624d87">给明确的时间窗口</text><text x="440" y="1061" font-size="20" font-weight="400" fill="#19374b">四段增强 jump，其余时间减弱</text><text x="440" y="1091" font-size="20" font-weight="400" fill="#19374b">用加权后的条件重新生成</text><path d="M773 1051h25" stroke="#446073" stroke-width="2.4" fill="none" marker-end="url(#ah)"/><rect x="805" y="986" width="347" height="128" rx="10" fill="white" stroke="#624d87" stroke-width="1.5"/><text x="820" y="1021" font-size="23" font-weight="700" fill="#624d87">按输出验收</text><text x="820" y="1061" font-size="20" font-weight="400" fill="#19374b">比较根高度及动作轨迹</text><text x="820" y="1091" font-size="20" font-weight="400" fill="#19374b">自注意图的逐行峰数另作估计</text><text x="46" y="1147" font-size="20" font-weight="400" fill="#624d87">时间窗是软引导。论文展示一次纠错成功；自动数峰与目标次数的实际执行是两项不同测量。</text></g></svg>