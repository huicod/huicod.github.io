<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="2780" viewBox="0 0 1360 2780" role="img" aria-labelledby="title"><title id="title">MG-MotionLLM完整架构：跨粒度语言动作模型、训练与脚本编辑</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#40566c"/></marker></defs><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#20394c}.flow{fill:none;stroke:#40566c;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#38867b;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#arrow)}</style>
<rect width="1360" height="2780" fill="white"/>
<text x="55" y="60" font-size="36" text-anchor="start" font-weight="700">MG-MotionLLM：摘要、身体脚本与动作码共同建模</text>
<text x="55" y="105" font-size="25" text-anchor="start" font-weight="400">教学重绘 · 文本脚本可读，动作码是学习到的索引；二者不是同一种表示</text>
<rect x="25" y="145" width="1310" height="1020" rx="22" fill="#eff6fc" stroke="#cbd8e2" stroke-width="2"/>
<text x="50" y="188" font-size="30" text-anchor="start" font-weight="700">A 统一任务输入输出：T5 编码器—解码器</text>
<text x="50" y="225" font-size="23" text-anchor="start" font-weight="400">按指令生成文本、时间或动作码；并非每次任务都需要图中所有输入。</text>
<rect x="60" y="280" width="350" height="155" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="235.0" y="316" font-size="26" text-anchor="middle" font-weight="700">连续动作输入</text>
<text x="235.0" y="352" font-size="24" text-anchor="middle" font-weight="400">HumanML3D 263 维</text>
<text x="235.0" y="383" font-size="24" text-anchor="middle" font-weight="400">整段 / 片段 / 头尾帧段</text>
<rect x="505" y="280" width="350" height="155" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="680.0" y="316" font-size="26" text-anchor="middle" font-weight="700">冻结动作量化器</text>
<text x="680.0" y="352" font-size="24" text-anchor="middle" font-weight="400">VQ-VAE 编码 + 最近邻</text>
<text x="680.0" y="383" font-size="24" text-anchor="middle" font-weight="400">连续特征 → 码本索引</text>
<path d="M410 355H505" class="flow"/>
<rect x="950" y="280" width="350" height="155" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="1125.0" y="316" font-size="26" text-anchor="middle" font-weight="700">任务条件</text>
<text x="1125.0" y="352" font-size="24" text-anchor="middle" font-weight="400">粗摘要 + 细脚本 + 时间</text>
<text x="1125.0" y="383" font-size="24" text-anchor="middle" font-weight="400">指令选择所需模态</text>
<rect x="505" y="515" width="795" height="155" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="902.5" y="551" font-size="26" text-anchor="middle" font-weight="700">扩展词表与输入序列</text>
<text x="902.5" y="587" font-size="24" text-anchor="middle" font-weight="400">文本词 + 动作码 + 特殊标记</text>
<text x="902.5" y="618" font-size="24" text-anchor="middle" font-weight="400">&lt;SEP&gt; 分段；&lt;Motionless&gt; 表示无显著运动</text>
<path d="M680 435V515" class="flow"/>
<path d="M1125 435V515" class="flow"/>
<rect x="60" y="515" width="350" height="155" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="235.0" y="551" font-size="26" text-anchor="middle" font-weight="700">脚本的监督来源</text>
<text x="235.0" y="587" font-size="24" text-anchor="middle" font-weight="400">FineMotion 时间片描述</text>
<text x="235.0" y="618" font-size="24" text-anchor="middle" font-weight="400">人工标注优先，否则自动</text>
<path d="M410 590H505" class="dash"/>
<rect x="505" y="745" width="350" height="155" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="680.0" y="781" font-size="26" text-anchor="middle" font-weight="700">T5 编码器—解码器</text>
<text x="680.0" y="817" font-size="24" text-anchor="middle" font-weight="400">理解输入条件</text>
<text x="680.0" y="848" font-size="24" text-anchor="middle" font-weight="400">自回归预测输出 token</text>
<path d="M900 670V710H680V745" class="flow"/>
<rect x="60" y="955" width="350" height="140" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="235.0" y="991" font-size="26" text-anchor="middle" font-weight="700">文本或时间输出</text>
<text x="235.0" y="1027" font-size="24" text-anchor="middle" font-weight="400">全局摘要 / 分段脚本</text>
<text x="235.0" y="1058" font-size="24" text-anchor="middle" font-weight="400">片段时间定位等</text>
<rect x="505" y="955" width="350" height="140" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="680.0" y="991" font-size="26" text-anchor="middle" font-weight="700">动作 token 输出</text>
<text x="680.0" y="1027" font-size="24" text-anchor="middle" font-weight="400">码本索引序列</text>
<text x="680.0" y="1058" font-size="24" text-anchor="middle" font-weight="400">不是可读关节指令</text>
<rect x="950" y="955" width="350" height="140" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="1125.0" y="991" font-size="26" text-anchor="middle" font-weight="700">冻结动作解码器</text>
<text x="1125.0" y="1027" font-size="24" text-anchor="middle" font-weight="400">码本查表 → VQ-VAE</text>
<text x="1125.0" y="1058" font-size="24" text-anchor="middle" font-weight="400">输出连续关节动作</text>
<path d="M600 900V925H235V955" class="flow"/>
<path d="M680 900V955" class="flow"/>
<path d="M855 1025H950" class="flow"/>
<rect x="25" y="1220" width="1310" height="610" rx="22" fill="#eff9f4" stroke="#cbd8e2" stroke-width="2"/>
<text x="50" y="1263" font-size="30" text-anchor="start" font-weight="700">B 分阶段训练：共享基础与各任务微调</text>
<text x="50" y="1300" font-size="23" text-anchor="start" font-weight="400">主结果的各任务最优分数，不是同一固定检查点同时达到的成绩。</text>
<rect x="60" y="1370" width="350" height="185" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="235.0" y="1406" font-size="26" text-anchor="middle" font-weight="700">阶段 0：动作 VQ-VAE</text>
<text x="235.0" y="1442" font-size="24" text-anchor="middle" font-weight="400">重建 + embedding</text>
<text x="235.0" y="1473" font-size="24" text-anchor="middle" font-weight="400">+ commitment 损失</text>
<text x="235.0" y="1504" font-size="24" text-anchor="middle" font-weight="400">训练完成后冻结</text>
<rect x="505" y="1370" width="350" height="185" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="680.0" y="1406" font-size="26" text-anchor="middle" font-weight="700">阶段 1：粒度协同</text>
<text x="680.0" y="1442" font-size="24" text-anchor="middle" font-weight="400">12 粗粒度 + 16 细粒度</text>
<text x="680.0" y="1473" font-size="24" text-anchor="middle" font-weight="400">28 任务混合交叉熵</text>
<text x="680.0" y="1504" font-size="24" text-anchor="middle" font-weight="400">T5 预训练 300K 步</text>
<rect x="950" y="1370" width="350" height="185" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="1125.0" y="1406" font-size="26" text-anchor="middle" font-weight="700">阶段 2：专项微调</text>
<text x="1125.0" y="1442" font-size="24" text-anchor="middle" font-weight="400">文本生成 / 动作摘要</text>
<text x="1125.0" y="1473" font-size="24" text-anchor="middle" font-weight="400">脚本生成 / 细节生成</text>
<text x="1125.0" y="1504" font-size="24" text-anchor="middle" font-weight="400">分别得到任务模型</text>
<path d="M410 1465H505" class="flow"/>
<path d="M855 1465H950" class="flow"/>
<rect x="60" y="1645" width="795" height="120" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="457.5" y="1681" font-size="26" text-anchor="middle" font-weight="700">训练桥梁：先学片段，再连接全局</text>
<text x="457.5" y="1717" font-size="24" text-anchor="middle" font-weight="400">动作 ↔ 脚本；局部描述 ↔ 时间；摘要 + 脚本 → 动作</text>
<path d="M680 1645V1555" class="dash"/>
<text x="950" y="1680" font-size="24" text-anchor="start" font-weight="400">仅详细脚本 → 动作</text>
<text x="950" y="1720" font-size="24" text-anchor="start" font-weight="400">未纳入训练任务；</text>
<text x="950" y="1760" font-size="24" text-anchor="start" font-weight="400">粗摘要用于消除语义歧义。</text>
<rect x="25" y="1885" width="1310" height="670" rx="22" fill="#f5effb" stroke="#cbd8e2" stroke-width="2"/>
<text x="50" y="1928" font-size="30" text-anchor="start" font-weight="700">C 单个通用预训练模型可执行的编辑循环</text>
<text x="50" y="1965" font-size="23" text-anchor="start" font-weight="400">修改脚本的是用户；自动把编辑指令转为脚本修改属于作者的未来方向。</text>
<rect x="60" y="2035" width="350" height="155" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="235.0" y="2071" font-size="26" text-anchor="middle" font-weight="700">① 摘要 → 初始动作</text>
<text x="235.0" y="2107" font-size="24" text-anchor="middle" font-weight="400">“抬左手腕看手表”</text>
<text x="235.0" y="2138" font-size="24" text-anchor="middle" font-weight="400">T5 预测码，解码成动作</text>
<rect x="505" y="2035" width="350" height="155" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="680.0" y="2071" font-size="26" text-anchor="middle" font-weight="700">② 动作 → 细脚本</text>
<text x="680.0" y="2107" font-size="24" text-anchor="middle" font-weight="400">生成按时间分段的描述</text>
<text x="680.0" y="2138" font-size="24" text-anchor="middle" font-weight="400">脚本也可能存在预测错误</text>
<rect x="950" y="2035" width="350" height="155" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="1125.0" y="2071" font-size="26" text-anchor="middle" font-weight="700">③ 用户改脚本</text>
<text x="1125.0" y="2107" font-size="24" text-anchor="middle" font-weight="400">1.0–1.5 秒：</text>
<text x="1125.0" y="2138" font-size="24" text-anchor="middle" font-weight="400">左前臂再抬高到头部</text>
<path d="M410 2110H505" class="flow"/>
<path d="M855 2110H950" class="flow"/>
<rect x="505" y="2300" width="795" height="155" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="902.5" y="2336" font-size="26" text-anchor="middle" font-weight="700">④ 原摘要 + 修改后脚本 → 新动作</text>
<text x="902.5" y="2372" font-size="24" text-anchor="middle" font-weight="400">同一通用 T5 重新预测动作码 → 冻结 VQ-VAE 解码</text>
<text x="902.5" y="2403" font-size="24" text-anchor="middle" font-weight="400">无逐关节硬约束；未编辑区域逐帧不变没有保证</text>
<path d="M1125 2190V2300" class="flow"/>
<text x="60" y="2330" font-size="25" text-anchor="start" font-weight="700">检查输出：</text>
<text x="60" y="2370" font-size="24" text-anchor="start" font-weight="400">时间是否对齐？</text>
<text x="60" y="2410" font-size="24" text-anchor="start" font-weight="400">左臂是否到位？</text>
<text x="60" y="2450" font-size="24" text-anchor="start" font-weight="400">其他部位是否改变？</text>
<text x="55" y="2630" font-size="23" text-anchor="start" font-weight="400">来源：正式版图 2、式 1–3、§3–4；补充材料 A、B、F、G。教学示意，未执行模型。</text>
<text x="55" y="2673" font-size="24" text-anchor="start" font-weight="400">可读脚本是条件接口，精确目标、接触与源动作保持需要额外输出验证。</text>
</svg>
