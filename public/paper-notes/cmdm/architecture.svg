<text x="900" y="1675" class="head" text-anchor="start">传统 AR：前一个位置完全去噪后</text>
<text x="900" y="1707" class="body" text-anchor="start">再从头生成下一个位置。</text>
<text x="900" y="1775" class="head" text-anchor="start">FSS：前一个位置只去掉部分噪声，</text>
<text x="900" y="1807" class="body" text-anchor="start">下一个位置就开始参与更新。</text>
<text x="900" y="1875" class="body" text-anchor="start">绿色 0：该位置已经完成；</text>
<text x="900" y="1907" class="body" text-anchor="start">红色越深：待去除的噪声越多。</text>
<text x="60" y="2010" class="small" text-anchor="start">表中的“位置”是 latent 时间位置，不是单个骨架帧；20 FPS 数据中 1 latent 对应 4 帧。</text>
<text x="60" y="2050" class="body" text-anchor="start">A100 上论文报告：首个 4 帧约 220 ms，之后每 4 帧约 30 ms；30 ms 不是首帧延迟。</text>
<text x="60" y="2090" class="small" text-anchor="start">加速来自去噪过程的重叠与调度；不等于每个位置只做两步去噪，也不保证无限长序列无漂移。</text>
<text x="40" y="2200" class="small" text-anchor="start">依据：CVPR 2026 原图 2、式 1–13、补充算法 1–2；数字调度表是为理解式 13 绘制的缩小示意。</text>
<text x="40" y="2240" class="small" text-anchor="start">实现边界：公开代码 5900a8a 默认每块 3 个 latent、块内可互看并共享噪声级；详见正文版本说明。</text>
<text x="40" y="2280" class="small" text-anchor="start">本图按论文逐位置形式讲解，不把当前整段导出脚本标为已实现的逐帧在线播放接口。</text>
<text x="40" y="2320" class="small" text-anchor="start">实线：表示流向；虚线：训练监督或推理迭代。教学重绘，非作者原图或本次模型运行结果。</text>
</svg>
