<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2500" viewBox="0 0 1200 2500" role="img"><title>Local Motion Phases 完整架构</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#668199"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="48" font-size="32" fill="#26354a" font-weight="700" text-anchor="start">Local Motion Phases：多个局部时钟，一个完整身体</text><text x="40" y="87" font-size="22" fill="#26354a" font-weight="400" text-anchor="start">接触相位负责组织运动；生成控制负责变化；物理切换与 IK 负责应用层修正。</text><rect x="25" y="120" width="1150" height="455" rx="22" fill="#f7f9fc" stroke="#dae3ed" stroke-width="2"/><text x="48" y="159" font-size="28" fill="#26354a" font-weight="700" text-anchor="start">A  离线特征：从接触拟合局部相位</text><text x="48" y="194" font-size="21" fill="#53667c" font-weight="400" text-anchor="start">动捕和环境几何提供标签；不使用 DeepPhase 的周期自编码器。</text><rect x="50" y="225" width="300" height="140" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="257" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">动捕＋碰撞体</text><text x="68" y="292" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">身体、球、场景几何</text><text x="68" y="322" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">距离与相对速度阈值</text><rect x="435" y="225" width="300" height="140" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="453" y="257" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">五组接触序列</text><text x="453" y="292" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">左右脚、左右手、球</text><text x="453" y="322" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">归一化＋低通滤波</text><rect x="820" y="225" width="330" height="140" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="838" y="257" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">逐窗正弦拟合</text><text x="838" y="292" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">幅度 a、频率 f、相移 s</text><text x="838" y="322" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">全局搜索＋局部 BFGS</text><path d="M350,295 L435,295" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M735,295 L820,295" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="435" y="415" width="715" height="115" rx="16" fill="#e8f3f1" stroke="#ccd7e3" stroke-width="2"/><text x="453" y="447" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">局部相位＋运动强度</text><text x="453" y="482" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">P = 最大速度 × a × [sin φ, cos φ]；静止时幅度趋零</text><path d="M985,365 L985,415" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="55" y="459" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">另提取姿态、控制、</text><text x="55" y="489" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">球与接触历史、对手特征</text><rect x="25" y="610" width="1150" height="550" rx="22" fill="#f7f9fc" stroke="#dae3ed" stroke-width="2"/><text x="48" y="649" font-size="28" fill="#26354a" font-weight="700" text-anchor="start">B  训练：控制变化与动作预测是两条学习任务</text><text x="48" y="684" font-size="21" fill="#53667c" font-weight="400" text-anchor="start">训练数据提供当前输入及下一帧/未来窗口目标；判别器不进入在线推理。</text><rect x="50" y="715" width="270" height="150" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="747" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">① 控制模型预训练</text><text x="68" y="782" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">真实控制 → 编码器 E</text><text x="68" y="812" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">latent → 解码器 G</text><rect x="400" y="715" width="340" height="150" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="418" y="747" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">重建与对抗学习</text><text x="418" y="782" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">重建控制与真实控制比较</text><text x="418" y="812" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">L = Ladv + 5 × L1</text><rect x="820" y="715" width="330" height="150" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="838" y="747" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">判别器 D</text><text x="838" y="782" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">区分真实 / 重建控制</text><text x="838" y="812" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">E、G、D 在此阶段训练</text><path d="M320,790 L400,790" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M740,790 L820,790" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="50" y="925" width="270" height="155" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="957" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">② 局部相位时序</text><text x="68" y="992" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">13 个采样点 × 5 组</text><text x="68" y="1022" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">输入 gating 网络</text><rect x="400" y="925" width="340" height="155" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="418" y="957" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">gating → 专家参数混合</text><text x="418" y="992" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">与状态、控制特征结合</text><text x="418" y="1022" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">统一预测全身与交互</text><rect x="820" y="925" width="330" height="155" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="838" y="957" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">预测目标与反馈训练</text><text x="838" y="992" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">下一姿态、球、接触</text><text x="838" y="1022" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">未来控制、相位及增量</text><path d="M320,1000 L400,1000" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M740,1000 L820,1000" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="55" y="1125" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">论文：8 帧训练片段，概率 0.5 反馈上一轮预测相位；不等于运行时使用真实未来。</text><rect x="25" y="1195" width="1150" height="740" rx="22" fill="#f7f9fc" stroke="#dae3ed" stroke-width="2"/><text x="48" y="1234" font-size="28" fill="#26354a" font-weight="700" text-anchor="start">C  在线：每帧生成控制，再预测完整动作</text><text x="48" y="1269" font-size="21" fill="#53667c" font-weight="400" text-anchor="start">过去状态留在缓存；未来相位和控制来自已有预测与用户意图。</text><rect x="50" y="1300" width="315" height="145" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="1332" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">用户操作＋上一轮控制</text><text x="68" y="1367" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">方向、速度、球交互意图</text><text x="68" y="1397" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">先混合两种控制</text><rect x="445" y="1300" width="315" height="145" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="463" y="1332" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">① 已训 E / G</text><text x="463" y="1367" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">编码 → latent 加噪 → 解码</text><text x="463" y="1397" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">种子与噪声量调节变化</text><rect x="840" y="1300" width="310" height="145" rx="16" fill="#e8f3f1" stroke="#ccd7e3" stroke-width="2"/><text x="858" y="1332" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">丰富控制序列</text><text x="858" y="1367" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">仍是控制特征</text><text x="858" y="1397" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">不是动作扩散结果</text><path d="M365,1370 L445,1370" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M760,1370 L840,1370" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M50,790 L35,790 L35,1280 L602,1280 L602,1300" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/><rect x="50" y="1505" width="315" height="145" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="1537" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">当前状态与历史</text><text x="68" y="1572" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">身体、球与接触</text><text x="68" y="1602" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">邻近对手信息</text><rect x="445" y="1505" width="315" height="145" rx="16" fill="#e8f3f1" stroke="#ccd7e3" stroke-width="2"/><text x="463" y="1537" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">② 已训动作专家网络</text><text x="463" y="1572" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">接收状态＋控制</text><text x="463" y="1602" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">参数由 gating 调配</text><rect x="840" y="1505" width="310" height="145" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="858" y="1537" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">相位缓存 → gating</text><text x="858" y="1572" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">五组相位时间窗口</text><text x="858" y="1602" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">预测状态与增量融合</text><path d="M365,1580 L445,1580" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M840,1580 L760,1580" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M995,1445 L995,1474 L602,1474 L602,1505" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="445" y="1730" width="705" height="140" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="463" y="1762" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">下一帧与未来窗口</text><text x="463" y="1797" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">完整身体、球、接触；控制、相位与相位增量</text><text x="463" y="1827" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">相位分支调配全身协调，不是逐部位独立合成。</text><path d="M602,1650 L602,1730" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="55" y="1767" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">复用 B 中已训练模块</text><text x="55" y="1800" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">实线：数据 / 反馈</text><text x="55" y="1833" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">虚线：训练产物复用</text><rect x="25" y="1970" width="1150" height="450" rx="22" fill="#f7f9fc" stroke="#dae3ed" stroke-width="2"/><text x="48" y="2009" font-size="28" fill="#26354a" font-weight="700" text-anchor="start">D  应用层：接触修正、物理切换与下一帧</text><text x="48" y="2044" font-size="21" fill="#53667c" font-weight="400" text-anchor="start">相位与网络改善协调；不能单独推出脚不滑、球不穿或动力学稳定。</text><rect x="50" y="2075" width="320" height="155" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="2107" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">网络预测</text><text x="68" y="2142" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">身体与球状态</text><text x="68" y="2172" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">接触概率 / 控制权重</text><rect x="435" y="2075" width="330" height="155" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="453" y="2107" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">场景逻辑与后处理</text><text x="453" y="2142" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">球：控制 ↔ 物理模拟</text><text x="453" y="2172" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">脚 / 手 IK、碰撞修正</text><rect x="830" y="2075" width="320" height="155" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="848" y="2107" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">显示与更新缓存</text><text x="848" y="2142" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">更新身体、球、历史</text><text x="848" y="2172" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">相位与控制送回 C</text><path d="M370,2150 L435,2150" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M765,2150 L830,2150" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="50" y="2280" width="1100" height="110" rx="16" fill="#fff4e7" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="2312" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">边界：人体仍是运动学预测</text><text x="68" y="2347" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">IK、球物理和交互规则共同影响输出，不能归为相位编码的硬保证。</text><text x="40" y="2460" font-size="20" fill="#53667c" font-weight="400" text-anchor="start">原创教学重绘｜依据 Starke 等，SIGGRAPH 2020：图 2 / 4 / 6，§4–9；代码边界见正文。</text></g></svg>