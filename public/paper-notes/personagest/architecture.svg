<text x="520.0" y="1135" font-size="20" font-weight="400" fill="#223147" text-anchor="middle">语音 + 身份 + 掩码码序列</text>
<text x="520.0" y="1163" font-size="20" font-weight="400" fill="#223147" text-anchor="middle">预测遮蔽位置；语义引导</text>
