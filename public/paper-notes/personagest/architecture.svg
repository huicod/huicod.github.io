<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="2700" viewBox="0 0 1040 2700" role="img" aria-labelledby="title desc">
<title id="title">PersonaGest 中文架构：语义内容和参考风格分层生成</title>
<desc id="desc">上部训练语义分区的四部位动作表示，再冻结表示训练内容和风格生成器。下部语音、文本和说话人条件产生内容，参考动作产生风格条件；三路身体经七层风格残差生成，面部不生成风格残差，四路内容经音频融合及跨部位注意力后解码。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#64758d"/></marker></defs>
<rect width="1040" height="2700" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="520" y="43" font-size="31" font-weight="750" fill="#223147" text-anchor="middle">PersonaGest：先生成内容，再补全参考风格</text>
<text x="520" y="76" font-size="19" font-weight="400" fill="#5c6d81" text-anchor="middle">中文教学示意 · 依据论文 §3、图 2/3 与附录 B · 非实际运行截图</text>
