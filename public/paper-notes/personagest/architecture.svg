<text x="830.0" y="1135" font-size="20" font-weight="400" fill="#223147" text-anchor="middle">随机选一层残差作为目标</text>
<text x="830.0" y="1163" font-size="20" font-weight="400" fill="#223147" text-anchor="middle">内容 + 先前层 + 参考风格</text>
