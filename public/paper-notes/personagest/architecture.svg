<text x="520.0" y="224" font-size="24" font-weight="650" fill="#223147" text-anchor="middle">配对训练数据</text>
<text x="520.0" y="255" font-size="20" font-weight="400" fill="#223147" text-anchor="middle">语音与转录 · 四部位动作 · 语义类型/强度 · 说话人身份 · 音素</text>
<rect x="80" y="325" width="300" height="100" rx="16" fill="#e6f1ff" stroke="#9cb0c6" stroke-width="2"/>
<text x="230.0" y="359" font-size="24" font-weight="650" fill="#223147" text-anchor="middle">语义预测器 ψ</text>
<text x="230.0" y="390" font-size="20" font-weight="400" fill="#223147" text-anchor="middle">音频 + 转录 → 语义分数</text>
<text x="230.0" y="418" font-size="20" font-weight="400" fill="#223147" text-anchor="middle">五类语义；强度调节采样</text>
<rect x="430" y="325" width="530" height="100" rx="16" fill="#e6f1ff" stroke="#9cb0c6" stroke-width="2"/>
<text x="695.0" y="359" font-size="24" font-weight="650" fill="#223147" text-anchor="middle">四路动作编码器</text>
<text x="695.0" y="390" font-size="20" font-weight="400" fill="#223147" text-anchor="middle">上身 / 双手 / 下身 / 面部</text>
<text x="695.0" y="418" font-size="20" font-weight="400" fill="#223147" text-anchor="middle">时间压缩 4 倍；得到连续潜变量</text>
<path d="M230 276 V325" fill="none" stroke="#64758d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="230" y="307" font-size="18" font-weight="500" fill="#52617a" text-anchor="middle">音频 + 文本</text>
