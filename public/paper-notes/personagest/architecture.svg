<text x="55" y="136" font-size="27" font-weight="700" fill="#223147" text-anchor="start">A · 第一阶段：学习语义与风格分层的动作表示</text>
<text x="55" y="165" font-size="19" font-weight="400" fill="#56667a" text-anchor="start">训练用配对数据；面部采用普通 VQ，身体采用八层 RVQ。</text>
