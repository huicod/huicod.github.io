<text x="520.0" y="849" font-size="24" font-weight="650" fill="#223147" text-anchor="middle">分部位解码与训练监督</text>
<text x="520.0" y="880" font-size="20" font-weight="400" fill="#223147" text-anchor="middle">重建 / 速度 / VQ · 语义分类 · 同说话人风格对比 · 内容音素预测</text>
