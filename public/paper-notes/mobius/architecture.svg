<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1660" role="img" aria-label="Möbius｜按理解 / 生成角色分工，在每层共享注意力"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526174"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#203047}.title{font-size:30px;font-weight:700}.section{font-size:24px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.line{fill:none;stroke:#526174;stroke-width:2.3;marker-end:url(#arr)}.dashed{stroke-dasharray:8 6}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="50" class="title" text-anchor="start">Möbius｜按理解 / 生成角色分工，在每层共享注意力</text><rect x="30" y="90" width="1300" height="280" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="125" class="section" text-anchor="start">A · 训练支线：先建立理解，再初始化生成</text><rect x="60" y="155" width="320" height="140" rx="11" fill="#ffffff" stroke="#9eafc3"/><text x="76" y="187" class="head" text-anchor="start">配对监督</text><text x="76" y="217" class="body" text-anchor="start">HumanML3D / 内部动作语料</text><text x="76" y="244" class="body" text-anchor="start">Phase I 另混入纯文本</text><text x="76" y="271" class="body" text-anchor="start">编辑训练另加入MotionFix</text><rect x="440" y="155" width="360" height="140" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="456" y="187" class="head" text-anchor="start">Phase I：动作 → 描述</text><text x="456" y="217" class="body" text-anchor="start">Qwen3 + clean projector</text><text x="456" y="244" class="body" text-anchor="start">自回归文字交叉熵</text><text x="456" y="271" class="body" text-anchor="start">更新理解参数</text><rect x="860" y="155" width="430" height="140" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="876" y="187" class="head" text-anchor="start">Phase II：带噪动作 → 干净动作</text><text x="876" y="217" class="body" text-anchor="start">复制理解参数初始化生成专家</text><text x="876" y="244" class="body" text-anchor="start">冻结理解参数；训练生成接口</text><text x="876" y="271" class="body" text-anchor="start">端点MSE + 几何损失</text><path d="M380 225H440" class="line"/><text x="385" y="205" class="small" text-anchor="start">数据</text><path d="M800 225H860" class="line"/><text x="805" y="205" class="small" text-anchor="start">复制</text><text x="60" y="337" class="small" text-anchor="start">虚线：训练监督 / 参数继承；正式模型HY201，每帧一个位置，无预训练动作VAE或VQ码本。</text><rect x="30" y="410" width="1300" height="1185" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="445" class="section" text-anchor="start">B · 推理主线：上下文与目标分开输入，整段目标反复采样</text><rect x="65" y="475" width="350" height="105" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="81" y="507" class="head" text-anchor="start">文字指令 C</text><text x="81" y="537" class="body" text-anchor="start">生成 / 描述 / 编辑要求</text><rect x="470" y="475" width="370" height="105" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="486" y="507" class="head" text-anchor="start">干净动作 S（可选）</text><text x="486" y="537" class="body" text-anchor="start">全源动作 / 前缀 / 后缀 / 关键帧</text><rect x="900" y="475" width="360" height="105" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="916" y="507" class="head" text-anchor="start">目标噪声 Xₜ + 时间 t</text><text x="916" y="537" class="body" text-anchor="start">先指定目标长度；高斯初始化</text><rect x="65" y="630" width="350" height="110" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="81" y="662" class="head" text-anchor="start">文本tokenizer</text><text x="81" y="692" class="body" text-anchor="start">文字 + BOM / EOM边界标记</text><rect x="470" y="630" width="370" height="110" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="486" y="662" class="head" text-anchor="start">Clean projector + mask</text><text x="486" y="692" class="body" text-anchor="start">归一化HY201；缺帧用[M]表示</text><rect x="900" y="630" width="360" height="110" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="916" y="662" class="head" text-anchor="start">Noisy projector</text><text x="916" y="692" class="body" text-anchor="start">连续帧投影 + 时间嵌入</text><path d="M240 580V630" class="line"/><path d="M655 580V630" class="line"/><path d="M1080 580V630" class="line"/><rect x="130" y="805" width="600" height="105" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="146" y="837" class="head" text-anchor="start">理解角色：RMSNorm + Q / K / V</text><text x="146" y="867" class="body" text-anchor="start">文字、边界、干净动作；Phase II参数冻结</text><rect x="860" y="805" width="400" height="105" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="876" y="837" class="head" text-anchor="start">生成角色：归一化 + Q / K / V</text><text x="876" y="867" class="body" text-anchor="start">仅带噪目标；独立可训练参数</text><path d="M240 740V775H320V805" class="line"/><path d="M655 740V805" class="line"/><path d="M1080 740V805" class="line"/><rect x="210" y="965" width="1000" height="115" rx="11" fill="#e9f5ed" stroke="#9eafc3"/><text x="226" y="997" class="head" text-anchor="start">共享多模态注意力 · 在28层中重复</text><text x="226" y="1027" class="body" text-anchor="start">段内动作双向；文字因果；目标读取前置上下文</text><text x="226" y="1054" class="body" text-anchor="start">上下文不读取带噪目标 → 每层上下文K/V可缓存</text><path d="M430 910V965" class="line"/><text x="445" y="944" class="small" text-anchor="start">理解Q/K/V</text><path d="M1060 910V965" class="line"/><text x="1070" y="944" class="small" text-anchor="start">生成Q/K/V</text><rect x="130" y="1135" width="600" height="105" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="146" y="1167" class="head" text-anchor="start">理解角色：O投影 + RMSNorm + FFN</text><text x="146" y="1197" class="body" text-anchor="start">保持文字 / 干净动作处理路线</text><rect x="860" y="1135" width="400" height="105" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="876" y="1167" class="head" text-anchor="start">生成角色：独立前馈更新</text><text x="876" y="1197" class="body" text-anchor="start">O投影 → RMSNorm → FFN</text><path d="M430 1080V1135" class="line"/><path d="M1060 1080V1135" class="line"/><rect x="130" y="1295" width="600" height="100" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="146" y="1327" class="head" text-anchor="start">文本头 → 自回归描述</text><text x="146" y="1357" class="body" text-anchor="start">理解任务：逐token输出；可重新输入生成结果</text><rect x="860" y="1295" width="400" height="100" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="876" y="1327" class="head" text-anchor="start">动作头 → 干净端点 X̂</text><text x="876" y="1357" class="body" text-anchor="start">投影回每帧201维连续特征</text><path d="M430 1240V1295" class="line"/><text x="445" y="1275" class="small" text-anchor="start">最后一层</text><path d="M1060 1240V1295" class="line"/><rect x="860" y="1440" width="400" height="105" rx="11" fill="#e9f5ed" stroke="#9eafc3"/><text x="876" y="1472" class="head" text-anchor="start">CFG + Euler → 最终动作</text><text x="876" y="1502" class="body" text-anchor="start">50步；反归一化后得到位置与旋转</text><path d="M1060 1395V1440" class="line"/><path d="M1260 1490H1305V605H1080V630" class="line"/><text x="885" y="1425" class="small" text-anchor="start">端点转速度，更新Xₜ</text><path d="M1120 295V390H1280V805H1260" class="line dashed"/><text x="65" y="1515" class="body" text-anchor="start">时间补全：已知帧作为条件，采样后不强制写回。</text><text x="65" y="1550" class="small" text-anchor="start">角色路由处理训练干扰，不裁决音频 / 文字冲突。</text><text x="40" y="1630" class="small" text-anchor="start">教学图：图3、式1–8、附录A与表S3；实线为计算路径，外侧回路为采样更新。</text></svg>