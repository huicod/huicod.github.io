<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1820" role="img" aria-label="MIBURI｜当前语音文字条件 → 时间预测 → 部位细节 → 连续动作"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#56657a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b}.title{font-size:28px;font-weight:700}.section{font-size:23px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.arrow{fill:none;stroke:#56657a;stroke-width:2.3;marker-end:url(#a)}.dash{stroke-dasharray:7 5}</style><rect width="1280" height="1820" fill="#fff"/><text x="40" y="44" class="title">MIBURI｜当前语音文字条件 → 时间预测 → 部位细节 → 连续动作</text><rect x="30" y="75" width="1220" height="285" rx="16" fill="#f6f8fb" stroke="#c9d2df"/><text x="50" y="109" class="section">A · 动作表示：三组因果RVQ codec先训练，生成器阶段冻结复用</text><rect x="55" y="130" width="350" height="155" rx="10" fill="#fff0d4" stroke="#aab8ca"/><text x="70" y="160" class="head">BEAT2真值运动（25fps）</text><text x="70" y="189" class="body">上身＋手：6D关节旋转</text><text x="70" y="215" class="body">下身：旋转＋平移＋脚接触</text><text x="70" y="241" class="body">面部：FLAME表情＋下颌</text><text x="70" y="267" class="body">2–250帧变长窗口</text><rect x="455" y="130" width="350" height="155" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="470" y="160" class="head">三组独立Encoder → RVQ</text><text x="470" y="189" class="body">因果卷积 / Transformer</text><text x="470" y="215" class="body">时间下采样2倍 → 12.5Hz</text><text x="470" y="241" class="body">上身8级 / 下身8级 / 面部4级</text><text x="470" y="267" class="body">训练后得到真值码 gₜ,ₖ</text><rect x="855" y="130" width="370" height="155" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="870" y="160" class="head">对应Decoder与codec损失</text><text x="870" y="189" class="body">因果Transformer＋上采样</text><text x="870" y="215" class="body">重建 / 旋转 / 速度 / 加速度</text><text x="870" y="241" class="body">脚接触＋commitment</text><text x="870" y="267" class="body">此处学表示，不学对话策略</text><path d="M405 205H455" class="arrow"/><path d="M805 205H855" class="arrow"/><text x="55" y="330" class="body">每80ms一组20层码，对应2帧运动；码本层是量化细节，不是可读的动作事件。</text><rect x="30" y="400" width="1220" height="680" rx="16" fill="#f6f8fb" stroke="#c9d2df"/><text x="50" y="434" class="section">B · 一个时间步t：只读当前 / 过去的条件，不读取未来语音</text><rect x="55" y="460" width="350" height="120" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="70" y="490" class="head">实时用户语音</text><text x="70" y="519" class="body">用户与代理全双工语音流</text><text x="70" y="545" class="body">Moshi 7B负责语言与声音</text><text x="70" y="571" class="body">预训练冻结复用</text><rect x="455" y="460" width="350" height="120" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="470" y="490" class="head">Moshi内部条件</text><text x="470" y="519" class="body">语音embedding fˢ≤t</text><text x="470" y="545" class="body">文字embedding fᵗ≤t</text><text x="470" y="571" class="body">12.5Hz时间轴</text><rect x="855" y="460" width="370" height="120" rx="10" fill="#fff" stroke="#aab8ca"/><text x="870" y="490" class="head">语音波形 / 文字输出</text><text x="870" y="519" class="body">Moshi自己的输出分支</text><text x="870" y="545" class="body">声音无需先完成整句</text><text x="870" y="571" class="body">当前动作不反向改写当前声音</text><path d="M405 520H455" class="arrow"/><path d="M805 520H855" class="arrow"/><rect x="55" y="645" width="350" height="145" rx="10" fill="#fff" stroke="#aab8ca"/><text x="70" y="675" class="head">过去动作 g&lt;t ＋ 身份</text><text x="70" y="704" class="body">每个过去包的20层嵌入求和</text><text x="70" y="730" class="body">self-attention：25个时间位置</text><text x="70" y="756" class="body">cross-attention：50个位置</text><text x="70" y="782" class="body">KV cache保留过去键值</text><rect x="455" y="645" width="350" height="145" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="470" y="675" class="head">时间Transformer（可训练）</text><text x="470" y="704" class="body">4层 / 2头，因果self-attention</text><text x="470" y="730" class="body">双路因果cross-attention</text><text x="470" y="756" class="body">输出时间状态 hₜ</text><text x="470" y="782" class="body">分类得到当前第一个动作码</text><rect x="855" y="645" width="370" height="145" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="870" y="675" class="head">运动学Transformer（可训练）</text><text x="870" y="704" class="body">固定t，按k逐层预测</text><text x="870" y="730" class="body">输入hₜ、当前语音文字、身份</text><text x="870" y="756" class="body">当前包内因果self-attention</text><text x="870" y="782" class="body">2层 / 1头，补齐其余19层</text><path d="M405 715H455" class="arrow"/><path d="M640 580V645" class="arrow"/><text x="655" y="615" class="small">条件≤t</text><path d="M815 715H855" class="arrow"/><text x="810" y="630" class="small">hₜ / 第1码</text><path d="M640 580V605H1040V645" class="arrow"/><text x="1060" y="605" class="small">只用当前t条件</text><rect x="55" y="885" width="350" height="125" rx="10" fill="#fff" stroke="#aab8ca"/><text x="70" y="915" class="head">包内预测顺序</text><text x="70" y="944" class="body">上身8级 → 下身8级 → 面部4级</text><text x="70" y="970" class="body">每个码依赖本包已有前缀</text><text x="70" y="996" class="body">下身屏蔽语音文字cross-attn</text><rect x="455" y="885" width="350" height="125" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="470" y="915" class="head">采样与当前完整码包</text><text x="470" y="944" class="body">top-p：时间0.8 / 运动学0.95</text><text x="470" y="970" class="body">温度0.9，CFG条件引导</text><text x="470" y="996" class="body">gₜ = [gᵘₜ, gˡₜ, gᶠₜ]</text><rect x="855" y="885" width="370" height="125" rx="10" fill="#fff" stroke="#aab8ca"/><text x="870" y="915" class="head">进入下一时间步</text><text x="870" y="944" class="body">完成的动作码写入历史</text><text x="870" y="970" class="body">接收下一个Moshi条件位置</text><text x="870" y="996" class="body">时间推进80ms</text><path d="M1040 790V835H230V885" class="arrow"/><path d="M405 945H455" class="arrow"/><path d="M805 945H855" class="arrow"/><path d="M1040 1010V1045H35V715H55" class="arrow"/><text x="60" y="1058" class="small">历史回流</text><rect x="30" y="1120" width="1220" height="275" rx="16" fill="#f6f8fb" stroke="#c9d2df"/><text x="50" y="1154" class="section">C · 连续解码与在线展示（推理）</text><rect x="55" y="1180" width="350" height="145" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="70" y="1210" class="head">按部位拆码并查码本</text><text x="70" y="1239" class="body">gᵘₜ → 上身RVQ嵌入</text><text x="70" y="1265" class="body">gˡₜ → 下身RVQ嵌入</text><text x="70" y="1291" class="body">gᶠₜ → 面部RVQ嵌入</text><text x="70" y="1317" class="body">调用冻结codec解码器</text><rect x="455" y="1180" width="350" height="145" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="470" y="1210" class="head">三个因果Decoder</text><text x="470" y="1239" class="body">分别恢复上身 / 下身 / 表情</text><text x="470" y="1265" class="body">每步输出2帧、25fps</text><text x="470" y="1291" class="body">连续SMPL-X与表情参数</text><text x="470" y="1317" class="body">没有显式目标位置求解器</text><rect x="855" y="1180" width="370" height="145" rx="10" fill="#fff" stroke="#aab8ca"/><text x="870" y="1210" class="head">独立渲染 / 语音显示进程</text><text x="870" y="1239" class="body">WebSocket传递时序数据</text><text x="870" y="1265" class="body">主进程运行Moshi＋MIBURI</text><text x="870" y="1291" class="body">并行显示声音、文字、身体</text><text x="870" y="1317" class="body">等待范围需端到端计时</text><path d="M640 1010V1100H1240V1160H230V1180" class="arrow"/><text x="245" y="1113" class="small">当前动作码</text><path d="M405 1250H455" class="arrow"/><path d="M805 1250H855" class="arrow"/><text x="55" y="1360" class="small">计时：A100每步34.9ms / 2帧（无渲染）；RTX3090演示36ms / 帧；Moshi另报约200ms。</text><rect x="30" y="1435" width="1220" height="280" rx="16" fill="#f6f8fb" stroke="#c9d2df"/><text x="50" y="1469" class="section">D · 仅训练：真值码监督与表现力辅助目标</text><rect x="55" y="1495" width="350" height="145" rx="10" fill="#fff0d4" stroke="#aab8ca"/><text x="70" y="1525" class="head">真值动作码 / 说话状态</text><text x="70" y="1554" class="body">teacher forcing → 交叉熵</text><text x="70" y="1580" class="body">hₜ二分类 → Lva</text><text x="70" y="1606" class="body">说话 / 倾听标签是监督</text><text x="70" y="1632" class="body">不是运行时硬锁定身体</text><rect x="455" y="1495" width="350" height="145" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="470" y="1525" class="head">可微采样重建latent</text><text x="470" y="1554" class="body">预测logits → Gumbel-Softmax</text><text x="470" y="1580" class="body">straight-through，温度0.4</text><text x="470" y="1606" class="body">分部位码本嵌入相加</text><text x="470" y="1632" class="body">分段匹配真值latent</text><rect x="855" y="1495" width="370" height="145" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="870" y="1525" class="head">联合训练生成器</text><text x="870" y="1554" class="body">LCE＋0.1 Lcon＋0.01 Lva</text><text x="870" y="1580" class="body">InfoNCE拉近匹配 / 推远错配</text><text x="870" y="1606" class="body">仅更新动作生成器与辅助头</text><text x="870" y="1632" class="body">推理不需要真值与损失支线</text><path d="M405 1565H455" class="arrow dash"/><path d="M805 1565H855" class="arrow dash"/><text x="55" y="1685" class="small">虚线：训练监督；蓝色：预训练 / 独立训练后冻结；绿色：对应阶段可训练。</text><path d="M1225 1565H1250V715H1225" class="arrow dash"/><text x="40" y="1768" class="body">依据主文图3、式1–5、补充图5。提前语义手势仍困难；共享时钟不等于精确动作指令保证。</text></svg>