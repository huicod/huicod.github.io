<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1610" viewBox="0 0 1120 1610" role="img" aria-labelledby="title desc"><title id="title">VQ-Style：训练解耦与推理时量化码交换</title><desc id="desc">训练动作经共享编码器和残差量化重建，风格标签约束残差对比及内容信息泄漏。推理将源动作的内容码与参考动作风格码相加解码，源姿态与接触不是硬保持。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52657a"/></marker><marker id="dasharr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c5979"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#203348} .title{font-size:30px;font-weight:700}.section{font-size:24px;font-weight:700}.node{font-size:23px;font-weight:600}.small{font-size:20px}.note{font-size:19px;fill:#53667a}.edge{fill:none;stroke:#52657a;stroke-width:2.7;marker-end:url(#arr)}.dash{fill:none;stroke:#8c5979;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#dasharr)}</style><rect width="1120" height="1610" fill="#fff"/><text x="40" y="49" class="title">VQ-Style：先学分层表示，再交换量化码</text><text x="40" y="83" class="note">依据正式论文图 2、图 3 与 §3 重绘 · 教学示意 · 并非模型运行结果</text>
<rect x="25" y="110" width="1070" height="500" rx="18" fill="#f8fafc" stroke="#dbe3ec"/>
<text x="48" y="147" class="section">A  训练：重建动作，同时分离内容与风格</text>
<rect x="70" y="180" width="590" height="74" rx="12" fill="#eef3f8" stroke="#c4d1de" stroke-width="1.6"/>
<text x="365.0" y="209.0" text-anchor="middle" class="node">带风格标签的动作 M → 共享卷积编码器 E</text>
<text x="365.0" y="241.0" text-anchor="middle" class="small">局部位置 / 旋转 / 速度等 → 降采样连续向量 r₀</text>
<rect x="70" y="290" width="590" height="82" rx="12" fill="#e8f1fb" stroke="#8cb4de" stroke-width="1.6"/>
<text x="365.0" y="323.0" text-anchor="middle" class="node">残差向量量化：逐层解释剩余信息</text>
<text x="365.0" y="355.0" text-anchor="middle" class="small">zᵢ = Qᵢ(rᵢ)；rᵢ₊₁ = rᵢ − zᵢ</text>
<rect x="70" y="410" width="590" height="82" rx="12" fill="#eef3f8" stroke="#c4d1de" stroke-width="1.6"/>
<text x="365.0" y="443.0" text-anchor="middle" class="node">随机保留前 n 层 → 求和 → 解码器 D</text>
<text x="365.0" y="475.0" text-anchor="middle" class="small">反卷积恢复时间长度，得到重建动作 M̂</text>
<rect x="70" y="526" width="590" height="56" rx="12" fill="#f0f0f8" stroke="#c4d1de" stroke-width="1.6"/>
<text x="365.0" y="562.0" text-anchor="middle" class="node">重建 / FK / 速度 / 加速度 / commitment</text>
<path d="M365 254 V290" class="edge"/>
<path d="M365 372 V410" class="edge"/>
<path d="M365 492 V526" class="edge"/>
<rect x="730" y="180" width="320" height="74" rx="12" fill="#fff0e1" stroke="#dfb683" stroke-width="1.6"/>
<text x="890.0" y="209.0" text-anchor="middle" class="node">训练风格标签 S</text>
<text x="890.0" y="241.0" text-anchor="middle" class="small">同风格为对比正样本</text>
<rect x="730" y="290" width="320" height="82" rx="12" fill="#fff0e1" stroke="#dfb683" stroke-width="1.6"/>
<text x="890.0" y="323.0" text-anchor="middle" class="node">Lcon：组织风格残差</text>
<text x="890.0" y="355.0" text-anchor="middle" class="small">Lmi：减少内容码风格泄漏</text>
<rect x="730" y="410" width="320" height="108" rx="12" fill="#f3eaf2" stroke="#c4a4bf" stroke-width="1.6"/>
<text x="890.0" y="440.0" text-anchor="middle" class="node">训练更新顺序</text>
<text x="890.0" y="472.0" text-anchor="middle" class="small">先反向传播</text>
<text x="890.0" y="504.0" text-anchor="middle" class="small">再做 EMA 码本更新</text>
<path d="M890 254 V290" class="dash"/>
<path d="M730 331 H660" class="dash"/>
<text x="730" y="558" class="note">仅训练使用标签与损失</text>
<text x="730" y="585" class="note">不需要推理时分类标签</text>
<rect x="25" y="650" width="1070" height="640" rx="18" fill="#f8fafc" stroke="#dbe3ec"/>
<text x="48" y="687" class="section">B  推理：同一模型编码两段动作，按码本层级交换</text>
<rect x="70" y="720" width="460" height="70" rx="12" fill="#e8f1fb" stroke="#8cb4de" stroke-width="1.6"/>
<text x="300.0" y="747.0" text-anchor="middle" class="node">源动作 Mᶜ</text>
<text x="300.0" y="779.0" text-anchor="middle" class="small">提供主要动作内容</text>
<rect x="590" y="720" width="460" height="70" rx="12" fill="#fff0e1" stroke="#dfb683" stroke-width="1.6"/>
<text x="820.0" y="747.0" text-anchor="middle" class="node">参考动作 Mˢ</text>
<text x="820.0" y="779.0" text-anchor="middle" class="small">提供目标风格</text>
<rect x="70" y="835" width="460" height="70" rx="12" fill="#e8f1fb" stroke="#8cb4de" stroke-width="1.6"/>
<text x="300.0" y="862.0" text-anchor="middle" class="node">共享 E + 残差量化器</text>
<text x="300.0" y="894.0" text-anchor="middle" class="small">得到源动作各层的量化码</text>
<rect x="590" y="835" width="460" height="70" rx="12" fill="#fff0e1" stroke="#dfb683" stroke-width="1.6"/>
<text x="820.0" y="862.0" text-anchor="middle" class="node">共享 E + 残差量化器</text>
<text x="820.0" y="894.0" text-anchor="middle" class="small">得到参考动作各层的量化码</text>
<rect x="70" y="950" width="460" height="74" rx="12" fill="#dcecfb" stroke="#71a5d9" stroke-width="1.6"/>
<text x="300.0" y="979.0" text-anchor="middle" class="node">保留内容前缀 Σᵢ&lt;q zᵢᶜ</text>
<text x="300.0" y="1011.0" text-anchor="middle" class="small">默认：第一个码本</text>
<rect x="590" y="950" width="460" height="74" rx="12" fill="#ffe5c8" stroke="#dca160" stroke-width="1.6"/>
<text x="820.0" y="979.0" text-anchor="middle" class="node">换入风格后缀 Σᵢ≥q zᵢˢ</text>
<text x="820.0" y="1011.0" text-anchor="middle" class="small">默认：后续残差码本</text>
<path d="M300 790 V835" class="edge"/>
<path d="M820 790 V835" class="edge"/>
<path d="M300 905 V950" class="edge"/>
<path d="M820 905 V950" class="edge"/>
<rect x="220" y="1080" width="680" height="76" rx="12" fill="#eaf4ed" stroke="#9fc4a8" stroke-width="1.6"/>
<text x="560.0" y="1110.0" text-anchor="middle" class="node">内容码 + 风格码 → 共享解码器 D</text>
<text x="560.0" y="1142.0" text-anchor="middle" class="small">q 表示保留的内容码本数量</text>
<path d="M300 1024 V1050 H430 V1080" class="edge"/>
<path d="M820 1024 V1050 H690 V1080" class="edge"/>
<rect x="220" y="1194" width="680" height="64" rx="12" fill="#eaf4ed" stroke="#9fc4a8" stroke-width="1.6"/>
<text x="560.0" y="1234.0" text-anchor="middle" class="node">输出：重新解码的风格化动作</text>
<path d="M560 1156 V1194" class="edge"/>
<path d="M1050 475 H1080 V815 H990 V835" class="dash"/>
<text x="740" y="635" class="note">复用训练后的 E / 码本 / D</text>
<rect x="25" y="1325" width="1070" height="245" rx="18" fill="#f8fafc" stroke="#dbe3ec"/>
<text x="48" y="1362" class="section">C  同一表示上的可选操作与边界</text>
<rect x="65" y="1390" width="310" height="100" rx="12" fill="#fff0e1" stroke="#dfb683" stroke-width="1.6"/>
<text x="220.0" y="1416.0" text-anchor="middle" class="node">缩放风格残差</text>
<text x="220.0" y="1448.0" text-anchor="middle" class="small">置零：减弱风格</text>
<text x="220.0" y="1480.0" text-anchor="middle" class="small">负向缩放：风格反转</text>
<rect x="405" y="1390" width="310" height="100" rx="12" fill="#fff0e1" stroke="#dfb683" stroke-width="1.6"/>
<text x="560.0" y="1416.0" text-anchor="middle" class="node">沿时间拼接风格码</text>
<text x="560.0" y="1448.0" text-anchor="middle" class="small">保持同一内容序列</text>
<text x="560.0" y="1480.0" text-anchor="middle" class="small">实现多风格切换</text>
<rect x="745" y="1390" width="310" height="100" rx="12" fill="#e8f1fb" stroke="#8cb4de" stroke-width="1.6"/>
<text x="900.0" y="1416.0" text-anchor="middle" class="node">拼接完整动作潜码</text>
<text x="900.0" y="1448.0" text-anchor="middle" class="small">再统一解码</text>
<text x="900.0" y="1480.0" text-anchor="middle" class="small">实现动作混合</text>
<text x="65" y="1531" class="note">这些操作作用于潜表示；没有逐帧复制源姿态，也没有显式接触 / 路径 / 端点投影。</text>
</svg>