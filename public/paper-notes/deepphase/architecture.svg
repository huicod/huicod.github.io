<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
<title id="title">DeepPhase：周期自编码器、相位流形与两种下游用途</title>
<desc id="desc">论文方法教学重绘。PAE 从双向关节速度窗口学习周期瓶颈，以 FFT 估计幅值频率偏移，以学习分支估计相位，重建速度。训练后的相位与幅值构成二维通道坐标，供另训的神经控制器和动作检索使用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3b78a1"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c97b28"/></marker></defs>
<rect width="1200" height="1800" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<text x="36" y="45" font-size="32" fill="#143650" font-weight="750" text-anchor="start">DeepPhase：把局部动作节律变成可推进的相位坐标</text>
<text x="36" y="79" font-size="20" fill="#536c7e" font-weight="400" text-anchor="start">SIGGRAPH / ACM TOG 2022  ·  教学重绘，非论文原图  ·  J：关节数，N：窗口帧数，M：潜在通道数</text>
<rect x="18" y="101" width="1164" height="851" rx="18" fill="#f1f7fc" stroke="#d4dfe9" stroke-width="1.4"/>
<text x="40" y="138" font-size="28" fill="#173956" font-weight="700" text-anchor="start">A  周期自编码器 PAE：论文中的重建训练路径</text>
<rect x="18" y="974" width="1164" height="280" rx="18" fill="#f3f8f2" stroke="#d4dfe9" stroke-width="1.4"/>
<text x="40" y="1011" font-size="28" fill="#173956" font-weight="700" text-anchor="start">B  学习之后：沿动画提取每个中心帧的 phase manifold</text>
<text x="40" y="1043" font-size="20" fill="#52677b" font-weight="400" text-anchor="start">复用编码器和参数分支；下游不把 PAE 解码器当作角色控制器。</text>
<rect x="18" y="1278" width="1164" height="421" rx="18" fill="#faf6ef" stroke="#d4dfe9" stroke-width="1.4"/>
<text x="40" y="1315" font-size="28" fill="#173956" font-weight="700" text-anchor="start">C  两种独立的下游用途</text>
<text x="40" y="1347" font-size="20" fill="#52677b" font-weight="400" text-anchor="start">共享相位表示，分别训练控制模型或建立检索数据库。</text>
<path d="M360 236 H420" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M760 236 H830" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M990 292 V320 H305 V350" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M990 320 H895 V350" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M305 490 V528 H590 V555" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M895 490 V528 H590" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M360 620 H420" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M760 620 H830" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M990 685 V755" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M830 805 H760" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M50 236 H31 V805 H420" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M590 855 V890 H1190 V157 H590 V180" fill="none" stroke="#c97b28" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#orange)"/>
<path d="M1190 890 V1055 H205 V1081" fill="none" stroke="#c97b28" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#orange)"/>
<path d="M360 1136 H420" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M760 1136 H830" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M990 1196 V1224 H600 V1355 H305 V1380" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M600 1355 H895 V1380" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M305 1505 V1530" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M895 1505 V1530" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M50 1591 H33 V1443 H50" fill="none" stroke="#3b78a1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="50" y="180" width="310" height="112" rx="13" fill="#ffffff" stroke="#a9c2d9" stroke-width="1.8"/>
<text x="68" y="212" font-size="23" fill="#163858" font-weight="650" text-anchor="start">输入 X：局部关节速度</text>
<text x="68" y="243" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">root-space，121 帧 / 60 Hz</text>
<text x="68" y="271" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">居中 ±1 秒；论文减窗口均值</text>
<rect x="420" y="180" width="340" height="112" rx="13" fill="#ffffff" stroke="#a9c2d9" stroke-width="1.8"/>
<text x="438" y="212" font-size="23" fill="#163858" font-weight="650" text-anchor="start">编码器：两层时间卷积</text>
<text x="438" y="243" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">3J×N → J×N → M×N</text>
<text x="438" y="271" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">论文每层：BatchNorm + tanh</text>
<rect x="830" y="180" width="320" height="112" rx="13" fill="#ffffff" stroke="#a9c2d9" stroke-width="1.8"/>
<text x="848" y="212" font-size="23" fill="#163858" font-weight="650" text-anchor="start">潜在曲线 L ∈ Rᴹˣᴺ</text>
<text x="848" y="243" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">M 条曲线保留 N 个时间点</text>
<text x="848" y="271" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">通道不是预先指定的身体部位</text>
<rect x="50" y="350" width="510" height="140" rx="13" fill="#eaf3fc" stroke="#a9c2d9" stroke-width="1.8"/>
<text x="68" y="382" font-size="23" fill="#163858" font-weight="650" text-anchor="start">频谱分支：可微 real FFT</text>
<text x="68" y="413" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">A：非 DC 功率给出幅值</text>
<text x="68" y="441" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">F：功率加权平均频率，并非峰值频率</text>
<text x="68" y="469" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">B：DC 分量 / N，给出信号偏移</text>
<rect x="640" y="350" width="510" height="140" rx="13" fill="#eaf3fc" stroke="#a9c2d9" stroke-width="1.8"/>
<text x="658" y="382" font-size="23" fill="#163858" font-weight="650" text-anchor="start">相位分支：逐通道学习</text>
<text x="658" y="413" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">FC → BatchNorm → 二维向量 → atan2</text>
<text x="658" y="441" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">得到相位 S；需统一弧度 / 周数约定</text>
<text x="658" y="469" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">不是直接取 FFT 的复数辐角</text>
<rect x="50" y="555" width="310" height="130" rx="13" fill="#ffffff" stroke="#a9c2d9" stroke-width="1.8"/>
<text x="68" y="587" font-size="23" fill="#163858" font-weight="650" text-anchor="start">已知时间坐标 τ</text>
<text x="68" y="618" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">121 个采样点，居中 ±1 秒</text>
<text x="68" y="646" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">供正弦曲线在窗口内重新展开</text>
<rect x="420" y="555" width="340" height="130" rx="13" fill="#e7f4ef" stroke="#8cb6a8" stroke-width="1.8"/>
<text x="438" y="587" font-size="23" fill="#163858" font-weight="650" text-anchor="start">强制周期瓶颈：正弦重合成</text>
<text x="438" y="618" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">L̂ = f(τ; A, F, B, S)</text>
<text x="438" y="646" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">每通道一条正弦曲线，共 M×N</text>
<text x="438" y="674" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">相位符号与单位须配套使用</text>
<rect x="830" y="555" width="320" height="130" rx="13" fill="#ffffff" stroke="#a9c2d9" stroke-width="1.8"/>
<text x="848" y="587" font-size="23" fill="#163858" font-weight="650" text-anchor="start">解码器：两层时间卷积</text>
<text x="848" y="618" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">M×N → J×N → 3J×N</text>
<text x="848" y="646" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">仅第一层：BatchNorm + tanh</text>
<text x="848" y="674" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">输出层不加激活</text>
<rect x="830" y="755" width="320" height="100" rx="13" fill="#ffffff" stroke="#a9c2d9" stroke-width="1.8"/>
<text x="848" y="787" font-size="23" fill="#163858" font-weight="650" text-anchor="start">重建速度窗口 Y</text>
<text x="848" y="818" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">与输入同维度：3J×N</text>
<rect x="420" y="755" width="340" height="100" rx="13" fill="#fff2df" stroke="#d0a36e" stroke-width="1.8"/>
<text x="438" y="787" font-size="23" fill="#163858" font-weight="650" text-anchor="start">唯一训练目标：MSE(X, Y)</text>
<text x="438" y="818" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">端到端反传；无需相位或接触标签</text>
<text x="60" y="793" font-size="20" fill="#4b6d86" font-weight="400" text-anchor="start">原输入 X 作为重建目标</text>
<text x="680" y="878" font-size="20" fill="#98631d" font-weight="400" text-anchor="start">重建误差更新整个 PAE</text>
<text x="48" y="927" font-size="21" fill="#3e5c73" font-weight="400" text-anchor="start">局部周期约束不等于整段动作固定周期：A、F、B、S 可随滑动窗口变化。</text>
<rect x="50" y="1081" width="310" height="115" rx="13" fill="#ffffff" stroke="#a1b89a" stroke-width="1.8"/>
<text x="68" y="1113" font-size="23" fill="#163858" font-weight="650" text-anchor="start">已训练的编码器 + 参数分支</text>
<text x="68" y="1144" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">逐窗提取 A、F、B、S</text>
<text x="68" y="1172" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">为每个窗口的中心帧赋值</text>
<rect x="420" y="1081" width="340" height="115" rx="13" fill="#edf7e9" stroke="#a1b89a" stroke-width="1.8"/>
<text x="438" y="1113" font-size="23" fill="#163858" font-weight="650" text-anchor="start">每通道：幅值缩放的相位圆</text>
<text x="438" y="1144" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">Pᵢ = Aᵢ [sin θᵢ, cos θᵢ]</text>
<text x="438" y="1172" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">θᵢ 为单位统一后的相位角</text>
<rect x="830" y="1081" width="320" height="115" rx="13" fill="#edf7e9" stroke="#a1b89a" stroke-width="1.8"/>
<text x="848" y="1113" font-size="23" fill="#163858" font-weight="650" text-anchor="start">合并为 P ∈ R²ᴹ</text>
<text x="848" y="1144" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">坐标来自 A 与 S，不是四参拼接</text>
<text x="848" y="1172" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">F 用于推进；B 不加入 P 坐标</text>
<text x="48" y="1232" font-size="20" fill="#526b4d" font-weight="400" text-anchor="start">注意：该滑窗特征提取包含未来上下文。</text>
<rect x="50" y="1380" width="510" height="125" rx="13" fill="#ffffff" stroke="#cbb697" stroke-width="1.8"/>
<text x="68" y="1412" font-size="23" fill="#163858" font-weight="650" text-anchor="start">另行训练：神经控制器（8 专家 MoE）</text>
<text x="68" y="1443" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">前帧姿态 + 当前控制信号 + 相位特征</text>
<text x="68" y="1471" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">相位进入 gating network，混合专家权重</text>
<text x="68" y="1499" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">预测新姿态及下一相位、幅值、频率</text>
<rect x="640" y="1380" width="510" height="125" rx="13" fill="#ffffff" stroke="#cbb697" stroke-width="1.8"/>
<text x="658" y="1412" font-size="23" fill="#163858" font-weight="650" text-anchor="start">离线建库：相位特征动作检索</text>
<text x="658" y="1443" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">查询：当前相位 + 用户轨迹等控制信号</text>
<text x="658" y="1471" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">在数据库相位特征中进行 KD-tree kNN</text>
<text x="658" y="1499" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">筛选候选，选择下一姿态或动作片段</text>
<rect x="50" y="1530" width="510" height="125" rx="13" fill="#fff0db" stroke="#cbb697" stroke-width="1.8"/>
<text x="68" y="1562" font-size="23" fill="#163858" font-weight="650" text-anchor="start">自回归更新，并反馈下一帧</text>
<text x="68" y="1593" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">用 F 与 Δt 推进相位，与预测相位混合</text>
<text x="68" y="1621" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">论文使用球面插值，混合权重为 0.5</text>
<text x="68" y="1649" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">结合幅值更新；新姿态继续驱动控制器</text>
<rect x="640" y="1530" width="510" height="125" rx="13" fill="#fff0db" stroke="#cbb697" stroke-width="1.8"/>
<text x="658" y="1562" font-size="23" fill="#163858" font-weight="650" text-anchor="start">输出来自运动数据库</text>
<text x="658" y="1593" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">可按 F 向短未来外推查询相位</text>
<text x="658" y="1621" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">该外推保持当前幅值不变</text>
<text x="658" y="1649" font-size="20" fill="#22384f" font-weight="400" text-anchor="start">不是让 PAE 解码器自由生成完整动作</text>
<text x="48" y="1683" font-size="20" fill="#72563a" font-weight="400" text-anchor="start">PAE 负责学习表示；实时控制器靠状态预测推进，不必逐帧重算包含未来的真实速度窗口。</text>
<text x="36" y="1733" font-size="20" fill="#536779" font-weight="400" text-anchor="start">依据：论文 §3–4、图 2、式 1–9。周期提取本身不是文本生成，也不保证硬接触或任意动作编辑。</text>
<text x="36" y="1765" font-size="20" fill="#536779" font-weight="400" text-anchor="start">本图按论文训练路径绘制；当前代码的预处理、归一化与相位符号 / 单位差异见正文说明。</text>
</g></svg>