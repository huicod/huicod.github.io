<text x="40" y="72" fill="#173b40" font-size="36" font-weight="700" text-anchor="start">PixelUMM · 像素与文字在何处汇合？</text>
<text x="40" y="112" fill="#173b40" font-size="23" font-weight="400" text-anchor="start">同一个模型读干净画面，也能从噪声联合生成整幅图或整个视频。</text>
<text x="40" y="32" fill="#19766f" font-size="18" font-weight="700" text-anchor="start">arXiv 2026   /   多模态理解与生成</text>
<text x="108" y="154" fill="#173b40" font-size="19" font-weight="400" text-anchor="start">动作、特征或条件</text>
<text x="430" y="154" fill="#87644b" font-size="19" font-weight="400" text-anchor="start">训练目标或真值</text>
<text x="42" y="220" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">01</text>
<text x="94" y="220" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">把三种输入放进同一宽度的序列</text>
<text x="44" y="254" fill="#476064" font-size="19" font-weight="400" text-anchor="start">RGB 直接切块；干净条件和带噪目标走不同的线性投影。视觉输入没有 VAE 码本。</text>
<rect data-node="text" x="44" y="291" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="322" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">文本词元</text>
<text x="59" y="351" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">文字嵌入；提示或回答前缀</text>
<rect data-node="vis" x="404" y="291" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="322" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">干净图片／视频</text>
<text x="419" y="351" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">图像 16×16，视频 4 帧一块</text>
<text x="419" y="376" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">使用对应的理解投影</text>
<rect data-node="noisy" x="764" y="291" width="272" height="99" rx="12" fill="#f6e8ca" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="322" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">带噪生成目标</text>
<text x="779" y="351" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">同尺寸的像素块或时空块</text>
<text x="779" y="376" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">使用对应的生成投影</text>
<text x="45" y="421" fill="#173b40" font-size="18" font-weight="400" text-anchor="start">文字与干净画面属于上下文；训练时带噪目标由真实像素混合高斯噪声得到。</text>
<text x="42" y="508" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">02</text>
<text x="94" y="508" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">按用途选参数，再通过一次注意力交换信息</text>
<text x="44" y="542" fill="#476064" font-size="19" font-weight="400" text-anchor="start">Mixture-of-Transformers 基于 Qwen3。每路的归一化、投影和前馈参数各自学习。</text>
<rect data-node="under" x="53" y="577" width="405" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="68" y="608" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">理解专家</text>
<text x="68" y="637" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">处理文本和干净参考图／视频</text>
<text x="68" y="662" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">产生本路的 Q、K、V</text>
<rect data-node="gen" x="622" y="577" width="405" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="637" y="608" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">生成专家</text>
<text x="637" y="637" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">处理所有带噪目标块</text>
<text x="637" y="662" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">产生本路的 Q、K、V</text>
<rect data-node="shared" x="262" y="737" width="556" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="277" y="768" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">共享序列上的多模态注意力</text>
<text x="277" y="797" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">目标可读先前上下文及同一目标块内的其他位置</text>
<text x="277" y="822" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">文字按因果顺序读取，条件不能反读未来目标</text>
<text x="316" y="694" text-anchor="middle" class="edge-label" fill="#19766f">条件 Q/K/V</text>
<text x="763" y="694" text-anchor="middle" class="edge-label" fill="#19766f">目标 Q/K/V</text>
<text x="42" y="924" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">03</text>
<text x="94" y="924" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">从对应位置分别输出文本和像素</text>
<text x="44" y="958" fill="#476064" font-size="19" font-weight="400" text-anchor="start">两条输出采用不同的训练目标和推理循环；生成头回到原 RGB 坐标空间。</text>
<rect data-node="tl" x="53" y="991" width="405" height="99" rx="12" fill="#deece7" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="68" y="1022" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">文字位置 → 词表分布</text>
<text x="68" y="1051" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">训练用助手文字的交叉熵</text>
<text x="68" y="1076" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">推理逐词元生成回答</text>
<rect data-node="px" x="622" y="991" width="405" height="99" rx="12" fill="#deece7" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="637" y="1022" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">目标位置 → 干净 RGB 块</text>
<text x="637" y="1051" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">图像头给 768 个值</text>
<text x="637" y="1076" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">视频头给 3,072 个值</text>
<rect data-node="answer" x="53" y="1178" width="405" height="99" rx="12" fill="#deece7" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="68" y="1209" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">回答文本</text>
<text x="68" y="1238" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">问题和参考画面保持为上下文</text>
<rect data-node="flow" x="622" y="1178" width="405" height="99" rx="12" fill="#deece7" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="637" y="1209" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">流采样更新整段目标</text>
<text x="637" y="1238" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">由预测像素换算速度，迭代更新</text>
<text x="637" y="1263" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">重排连续块得到 RGB 图像或视频</text>
<text x="319" y="1141" text-anchor="middle" class="edge-label" fill="#19766f">下一词元</text>
<text x="906" y="1141" text-anchor="middle" class="edge-label" fill="#19766f">干净块估计</text>
<text x="42" y="1370" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">04</text>
<text x="94" y="1370" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">训练监督按样本任务启用</text>
<text x="44" y="1404" fill="#476064" font-size="19" font-weight="400" text-anchor="start">有助手文字时计算文字项；有生成目标时计算对应图像或视频的流损失。</text>
<rect data-node="aw" x="44" y="1423" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="1454" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">真实助手文字</text>
<text x="59" y="1483" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">只监督回答与结束位置</text>
<rect data-node="l" x="404" y="1423" width="272" height="99" rx="12" fill="#f4e6dc" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="1454" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">训练目标</text>
<text x="419" y="1483" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">文字交叉熵／像素流速度误差</text>
<rect data-node="rgb" x="764" y="1423" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="1454" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">真实干净 RGB</text>
<text x="779" y="1483" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">给出流的目标速度</text>
