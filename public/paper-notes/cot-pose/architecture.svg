<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1670" viewBox="0 0 1200 1670" role="img" aria-labelledby="title desc">
<title id="title">CoT-Pose：从抽象文字到单个静态人体姿态</title>
<desc id="desc">三分区原创教学图：离线构建 AMASS 对齐与图像合成两路三元组，监督微调 UniPose 的 LoRA，测试时先自回归生成详细姿态描述，再通过 80 个查询并行预测 80 个姿态码，经 VQ 解码和 SMPL 生成网格。80 个码不是 80 帧。</desc>
<defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4474a3"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#bd7a29"/></marker></defs>
<rect width="1200" height="1670" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<text x="32" y="40" font-size="32" font-weight="750" fill="#263750" text-anchor="start">CoT-Pose｜先说清身体怎么摆，再生成一个姿态</text>
<text x="32" y="75" font-size="20" font-weight="400" fill="#60718a" text-anchor="start">蓝色实线：数据与推理流　　橙色虚线：训练更新／权重复用</text>
<rect x="20" y="98" width="1160" height="610" rx="17" fill="#f1f6fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="134" font-size="27" font-weight="750" fill="#263750" text-anchor="start">A  离线构建训练三元组</text>
<text x="46" y="166" font-size="20" font-weight="400" fill="#52647b" text-anchor="start">图像生成与 ChatGPT 只用于准备训练数据；两路数据均提供文本与单个姿态。</text>
<text x="52" y="195" font-size="23" font-weight="700" fill="#263750" text-anchor="start">已有数据对齐</text>
<text x="400" y="195" font-size="23" font-weight="700" fill="#263750" text-anchor="start">图像辅助合成</text>
<rect x="52" y="215" width="310" height="105" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="68" y="246" font-size="23" font-weight="650" fill="#263750" text-anchor="start">BABEL + PoseScript</text>
<text x="68" y="276" font-size="20" font-weight="400" fill="#263750" text-anchor="start">动作标签 + 详细描述</text>
<text x="68" y="303" font-size="20" font-weight="400" fill="#263750" text-anchor="start">来自已有动作／姿态标注</text>
<rect x="52" y="365" width="310" height="105" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="68" y="396" font-size="23" font-weight="650" fill="#263750" text-anchor="start">对齐 AMASS 同一帧</text>
<text x="68" y="426" font-size="20" font-weight="400" fill="#263750" text-anchor="start">帧索引对应 SMPL 姿态</text>
<text x="68" y="453" font-size="20" font-weight="400" fill="#263750" text-anchor="start">按动作标签去重</text>
<rect x="52" y="515" width="310" height="98" rx="12" fill="#e4edf9" stroke="#adbdcf" stroke-width="1.5"/>
<text x="68" y="546" font-size="23" font-weight="650" fill="#263750" text-anchor="start">3,374 个三元组</text>
<text x="68" y="576" font-size="20" font-weight="400" fill="#263750" text-anchor="start">抽象描述／详细描述</text>
<text x="68" y="603" font-size="20" font-weight="400" fill="#263750" text-anchor="start">对应的单帧 SMPL 姿态</text>
<path d="M207 320 V365" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M207 470 V515" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<rect x="400" y="215" width="270" height="80" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="416" y="246" font-size="22" font-weight="650" fill="#263750" text-anchor="start">550 个动作标签</text>
<text x="416" y="276" font-size="20" font-weight="400" fill="#263750" text-anchor="start">ChatGPT：11 类 × 50</text>
<rect x="720" y="215" width="432" height="80" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="736" y="246" font-size="22" font-weight="650" fill="#263750" text-anchor="start">FLUX + Super-Realism LoRA</text>
<text x="736" y="276" font-size="20" font-weight="400" fill="#263750" text-anchor="start">抽象提示 → 全身人物图像</text>
<rect x="720" y="335" width="432" height="80" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="736" y="366" font-size="22" font-weight="650" fill="#263750" text-anchor="start">SMPLest-X 估计姿态</text>
<text x="736" y="396" font-size="20" font-weight="400" fill="#263750" text-anchor="start">先得 SMPL-X，再转换为 SMPL</text>
<rect x="720" y="455" width="432" height="80" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="736" y="486" font-size="23" font-weight="650" fill="#263750" text-anchor="start">Pose2Text</text>
<text x="736" y="516" font-size="20" font-weight="400" fill="#263750" text-anchor="start">SMPL 姿态 → 初始详细描述</text>
<rect x="400" y="455" width="270" height="110" rx="12" fill="#e9effb" stroke="#adbdcf" stroke-width="1.5"/>
<text x="416" y="486" font-size="22" font-weight="650" fill="#263750" text-anchor="start">ChatGPT 修订描述</text>
<text x="416" y="516" font-size="20" font-weight="400" fill="#263750" text-anchor="start">参考标签、生成图</text>
<text x="416" y="543" font-size="20" font-weight="400" fill="#263750" text-anchor="start">以及初始详细描述</text>
<rect x="400" y="590" width="752" height="80" rx="12" fill="#e4edf9" stroke="#adbdcf" stroke-width="1.5"/>
<text x="416" y="621" font-size="23" font-weight="650" fill="#263750" text-anchor="start">人工筛选 → 239 个合成三元组</text>
<text x="416" y="651" font-size="20" font-weight="400" fill="#263750" text-anchor="start">抽象描述／修订后的详细描述／估计的 SMPL 姿态</text>
<path d="M670 255 H720" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M936 295 V335" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M936 415 V455" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M530 295 V455" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M780 295 V315 H695 V435 H610 V455" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M720 495 H670" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M535 565 V590" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M1152 375 H1167 V630 H1152" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<text x="416" y="365" font-size="20" font-weight="400" fill="#60718a" text-anchor="start">动作标签</text>
<text x="582" y="405" font-size="20" font-weight="400" fill="#60718a" text-anchor="start">生成图</text>
<path d="M207 613 V686 H600" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>

<rect x="20" y="730" width="1160" height="270" rx="17" fill="#f0f8f3" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="766" font-size="27" font-weight="750" fill="#263750" text-anchor="start">B  监督微调 UniPose</text>
<text x="46" y="798" font-size="20" font-weight="400" fill="#52647b" text-anchor="start">UniPose 基于 LLaVA-1.6V；使用文字与姿态目标联合监督，没有强化学习。</text>
<rect x="52" y="825" width="310" height="118" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="68" y="856" font-size="22" font-weight="650" fill="#263750" text-anchor="start">三元组监督</text>
<text x="68" y="883" font-size="20" font-weight="400" fill="#263750" text-anchor="start">抽象输入 + 详细文字目标</text>
<text x="68" y="908" font-size="20" font-weight="400" fill="#263750" text-anchor="start">姿态 → 已训练 tokenizer</text>
<text x="68" y="933" font-size="20" font-weight="400" fill="#263750" text-anchor="start">→ 80 个姿态码目标</text>
<rect x="402" y="825" width="390" height="118" rx="12" fill="#e1f0e7" stroke="#adbdcf" stroke-width="1.5"/>
<text x="418" y="856" font-size="24" font-weight="650" fill="#263750" text-anchor="start">同一个 UniPose 模型</text>
<text x="418" y="886" font-size="20" font-weight="400" fill="#263750" text-anchor="start">预训练语言主干冻结</text>
<text x="418" y="913" font-size="20" font-weight="400" fill="#263750" text-anchor="start">LoRA 适配参数微调</text>
<rect x="832" y="825" width="316" height="118" rx="12" fill="#fdf0dc" stroke="#adbdcf" stroke-width="1.5"/>
<text x="848" y="856" font-size="23" font-weight="650" fill="#263750" text-anchor="start">L = L_text + L_pose</text>
<text x="848" y="886" font-size="20" font-weight="400" fill="#263750" text-anchor="start">文字生成损失</text>
<text x="848" y="913" font-size="20" font-weight="400" fill="#263750" text-anchor="start">80 个姿态码预测损失</text>
<path d="M362 885 H402" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M792 885 H832" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M990 943 V973 H598 V943" fill="none" stroke="#bd7a29" stroke-width="2.7" stroke-dasharray="8 5" marker-end="url(#amber)"/>
<text x="52" y="980" font-size="20" font-weight="400" fill="#52647b" text-anchor="start">两种 token 目标，共同更新适配器</text>
<rect x="20" y="1024" width="1160" height="588" rx="17" fill="#f6f2fb" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="1060" font-size="27" font-weight="750" fill="#263750" text-anchor="start">C  实际推理：抽象文字 → 详细描述 → 单个姿态</text>
<text x="46" y="1092" font-size="20" font-weight="400" fill="#52647b" text-anchor="start">同一微调模型分两阶段解码；测试无需图像、ChatGPT 或真实姿态。</text>
<rect x="52" y="1120" width="300" height="100" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="68" y="1151" font-size="23" font-weight="650" fill="#263750" text-anchor="start">用户抽象文本</text>
<text x="68" y="1181" font-size="20" font-weight="400" fill="#263750" text-anchor="start">例如：生成弹钢琴的姿态</text>
<rect x="400" y="1120" width="370" height="100" rx="12" fill="#e8e5f7" stroke="#adbdcf" stroke-width="1.5"/>
<text x="416" y="1151" font-size="23" font-weight="650" fill="#263750" text-anchor="start">① 文字自回归生成</text>
<text x="416" y="1181" font-size="20" font-weight="400" fill="#263750" text-anchor="start">因果 mask：只看前序 token</text>
<text x="416" y="1208" font-size="20" font-weight="400" fill="#263750" text-anchor="start">复用微调后的 UniPose</text>
<rect x="810" y="1120" width="338" height="100" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="826" y="1151" font-size="23" font-weight="650" fill="#263750" text-anchor="start">详细姿态描述</text>
<text x="826" y="1181" font-size="20" font-weight="400" fill="#263750" text-anchor="start">身体各部位的空间配置</text>
<text x="826" y="1208" font-size="20" font-weight="400" fill="#263750" text-anchor="start">作为后续姿态生成的条件</text>
<path d="M352 1170 H400" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M770 1170 H810" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<rect x="52" y="1280" width="300" height="100" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="68" y="1311" font-size="21" font-weight="650" fill="#263750" text-anchor="start">SPQ + 80 个查询 + EPQ</text>
<text x="68" y="1341" font-size="20" font-weight="400" fill="#263750" text-anchor="start">查询是可学习 pose queries</text>
<text x="68" y="1368" font-size="20" font-weight="400" fill="#263750" text-anchor="start">SPQ／EPQ 标记查询段边界</text>
<rect x="400" y="1280" width="370" height="100" rx="12" fill="#e8e5f7" stroke="#adbdcf" stroke-width="1.5"/>
<text x="416" y="1311" font-size="22" font-weight="650" fill="#263750" text-anchor="start">② 姿态段一次并行解码</text>
<text x="416" y="1341" font-size="20" font-weight="400" fill="#263750" text-anchor="start">双向 mask：查询彼此可见</text>
<text x="416" y="1368" font-size="20" font-weight="400" fill="#263750" text-anchor="start">同时读取全部前序文本</text>
<rect x="810" y="1280" width="338" height="100" rx="12" fill="#e8e5f7" stroke="#adbdcf" stroke-width="1.5"/>
<text x="826" y="1311" font-size="23" font-weight="650" fill="#263750" text-anchor="start">80 个离散姿态码</text>
<text x="826" y="1341" font-size="20" font-weight="400" fill="#263750" text-anchor="start">共同表示一个静态姿态</text>
<text x="826" y="1368" font-size="20" font-weight="400" fill="#263750" text-anchor="start">不是 80 帧／80 个关节</text>
<path d="M352 1330 H400" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M770 1330 H810" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M979 1220 V1250 H585 V1280" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M202 1220 V1250 H380 V1330 H400" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<rect x="52" y="1430" width="300" height="102" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="68" y="1461" font-size="22" font-weight="650" fill="#263750" text-anchor="start">VQ-VAE detokenizer</text>
<text x="68" y="1491" font-size="20" font-weight="400" fill="#263750" text-anchor="start">查码本得到嵌入</text>
<text x="68" y="1518" font-size="20" font-weight="400" fill="#263750" text-anchor="start">解码为连续姿态参数</text>
<rect x="400" y="1430" width="370" height="102" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="416" y="1461" font-size="22" font-weight="650" fill="#263750" text-anchor="start">24 × 3 SMPL 姿态参数</text>
<text x="416" y="1491" font-size="20" font-weight="400" fill="#263750" text-anchor="start">24 个关节的 axis-angle</text>
<text x="416" y="1518" font-size="20" font-weight="400" fill="#263750" text-anchor="start">即轴角旋转表示</text>
<rect x="810" y="1430" width="338" height="102" rx="12" fill="#ffffff" stroke="#adbdcf" stroke-width="1.5"/>
<text x="826" y="1461" font-size="24" font-weight="650" fill="#263750" text-anchor="start">SMPL 人体网格</text>
<text x="826" y="1491" font-size="20" font-weight="400" fill="#263750" text-anchor="start">SMPL body model</text>
<text x="826" y="1518" font-size="20" font-weight="400" fill="#263750" text-anchor="start">输出 6,890 个顶点</text>
<path d="M979 1380 V1405 H202 V1430" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M352 1481 H400" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M770 1481 H810" fill="none" stroke="#4474a3" stroke-width="2.7" marker-end="url(#blue)"/>
<path d="M700 943 V1012 H1186 V1107 H600 V1120" fill="none" stroke="#bd7a29" stroke-width="2.7" stroke-dasharray="8 5" marker-end="url(#amber)"/>
<text x="52" y="1575" font-size="21" font-weight="650" fill="#263750" text-anchor="start">中间文字描述身体空间配置，不是时间动作计划；输出是一个静态人体姿态。</text>
<text x="32" y="1650" font-size="20" font-weight="400" fill="#60718a" text-anchor="start">原创教学重绘｜依据正式论文图 2、§3.1–3.3、§4.1–4.2；未运行模型。</text>
