<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2290" viewBox="0 0 1120 2290" role="img" aria-labelledby="title desc">
<title id="title">LabanDancer 从舞谱到动画的完整解释流程</title>
<desc id="desc">符号文件经绑定修饰和语义解析形成复合列表，分流为非承重动作、支撑变化与其他编排指令，使用规则、逆运动学和足迹方法生成并协调动作，与原舞谱图像同步显示。未来导出与逆向转谱独立标为未实现。</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#18324a}.title{font-size:32px;font-weight:700}.section{font-size:26px;font-weight:700}.node{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#52677d}.wire{fill:none;stroke:#475569;stroke-width:2.6;marker-end:url(#arr)}.side{fill:none;stroke:#78899b;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arr)}</style>
<rect width="1120" height="2290" fill="#f7f9fc"/>
<text x="45" y="57" class="title" text-anchor="start">LabanDancer · 从符号解释到连续动作</text>
<text x="45" y="94" class="body" text-anchor="start">VAST 2003｜人工编写舞谱 → 规则与几何过程 → 三维动画</text>
<text x="45" y="130" class="small" text-anchor="start">蓝：输入与中间表示    橙：规则及约束    绿：生成与展示    灰：未来计划</text>
<rect x="40" y="160" width="1030" height="570" rx="16" fill="#fff" stroke="#d7e1eb" stroke-width="2"/>
<text x="65" y="201" class="section" text-anchor="start">A · 先理解谱面含义，再组织运动</text>
<text x="65" y="234" class="small" text-anchor="start">.lw 是符号记录；.png 用来显示舞谱，不是图像识别输入。</text>
<rect x="70" y="270" width="600" height="115" rx="16" fill="#edf4ff" stroke="#88a9d1" stroke-width="2"/>
<text x="370.0" y="305" class="node" text-anchor="middle">LabanWriter · .lw 文件</text>
<text x="370.0" y="341" class="body" text-anchor="middle">符号标识 + 谱面位置 + 时长信息</text>
<rect x="755" y="270" width="285" height="115" rx="16" fill="#edf4ff" stroke="#88a9d1" stroke-width="2"/>
<text x="897.5" y="305" class="node" text-anchor="middle">舞谱图像 · .png</text>
<text x="897.5" y="341" class="body" text-anchor="middle">供用户对照查看</text>
<path d="M370 385 V425" class="wire"/>
<rect x="70" y="425" width="600" height="125" rx="16" fill="#fff4e4" stroke="#d6ad6a" stroke-width="2"/>
<text x="370.0" y="460" class="node" text-anchor="middle">绑定修饰符，解释部位与时间</text>
<text x="370.0" y="496" class="body" text-anchor="middle">主体 ↔ 修饰符；结合谱栏位置</text>
<text x="370.0" y="527" class="body" text-anchor="middle">区分承重 / 非承重，读方向与层级</text>
<path d="M370 550 V590" class="wire"/>
<rect x="70" y="590" width="970" height="105" rx="16" fill="#edf4ff" stroke="#88a9d1" stroke-width="2"/>
<text x="555.0" y="625" class="node" text-anchor="middle">Composite score · 内部复合动作列表</text>
<text x="555.0" y="661" class="body" text-anchor="middle">按时间组织运动条目；不是新图像，也不是学习出的 token</text>
<path d="M897 385 V410 H1090 V1915 H1040" class="side"/>
<text x="785" y="447" class="small" text-anchor="start">图像展示支线</text>
<text x="785" y="478" class="small" text-anchor="start">不代替符号解析</text>
<rect x="40" y="765" width="1030" height="925" rx="16" fill="#fff" stroke="#d7e1eb" stroke-width="2"/>
<text x="65" y="807" class="section" text-anchor="start">B · 三路解释：补出舞谱没有逐帧写明的动作</text>
<text x="65" y="841" class="small" text-anchor="start">知识规则处理舞种、节拍和上下文；没有数据训练或模型权重分支。</text>
<path d="M555 695 V745 H30 V875 H220 V920" class="wire"/>
<path d="M220 875 H560 V920" class="wire"/>
<path d="M560 875 H900 V920" class="wire"/>
<rect x="70" y="920" width="300" height="125" rx="16" fill="#edf4ff" stroke="#88a9d1" stroke-width="2"/>
<text x="220.0" y="955" class="node" text-anchor="middle">非承重动作</text>
<text x="220.0" y="991" class="body" text-anchor="middle">起止时间 + 目标朝向</text>
<text x="220.0" y="1022" class="body" text-anchor="middle">包括手臂和摆动腿</text>
<rect x="410" y="920" width="300" height="125" rx="16" fill="#edf4ff" stroke="#88a9d1" stroke-width="2"/>
<text x="560.0" y="955" class="node" text-anchor="middle">支撑变化</text>
<text x="560.0" y="991" class="body" text-anchor="middle">承重肢体 + 移动方向</text>
<text x="560.0" y="1022" class="body" text-anchor="middle">指定承重的时间段</text>
<rect x="750" y="920" width="300" height="125" rx="16" fill="#edf4ff" stroke="#88a9d1" stroke-width="2"/>
<text x="900.0" y="955" class="node" text-anchor="middle">其他编排指令</text>
<text x="900.0" y="991" class="body" text-anchor="middle">重复、舞台路径</text>
<text x="900.0" y="1022" class="body" text-anchor="middle">多舞者等过程</text>
<path d="M220 1045 V1090" class="wire"/>
<path d="M560 1045 V1090" class="wire"/>
<path d="M900 1045 V1090" class="wire"/>
<rect x="70" y="1090" width="300" height="270" rx="16" fill="#fff4e4" stroke="#d6ad6a" stroke-width="2"/>
<text x="220.0" y="1125" class="node" text-anchor="middle">逆运动学与路径约束</text>
<text x="220.0" y="1161" class="body" text-anchor="middle">解释舞种和节拍惯例</text>
<text x="220.0" y="1192" class="body" text-anchor="middle">约束运动平面</text>
<text x="220.0" y="1223" class="body" text-anchor="middle">必要时加中间关键帧</text>
<text x="220.0" y="1254" class="body" text-anchor="middle">构造肢体运动路径</text>
<rect x="410" y="1090" width="300" height="105" rx="16" fill="#fff4e4" stroke="#d6ad6a" stroke-width="2"/>
<text x="560.0" y="1125" class="node" text-anchor="middle">生成足迹</text>
<text x="560.0" y="1161" class="body" text-anchor="middle">落脚位置 + 落脚时间</text>
<path d="M560 1195 V1235" class="wire"/>
<rect x="410" y="1235" width="300" height="125" rx="16" fill="#fff4e4" stroke="#d6ad6a" stroke-width="2"/>
<text x="560.0" y="1270" class="node" text-anchor="middle">足迹驱动的运动生成</text>
<text x="560.0" y="1306" class="body" text-anchor="middle">组织身体重心与迈步</text>
<text x="560.0" y="1337" class="body" text-anchor="middle">加入舞蹈特定约束</text>
<rect x="750" y="1090" width="300" height="270" rx="16" fill="#fff4e4" stroke="#d6ad6a" stroke-width="2"/>
<text x="900.0" y="1125" class="node" text-anchor="middle">对应的程序化处理</text>
<text x="900.0" y="1161" class="body" text-anchor="middle">实现重复及路径等指令</text>
<text x="900.0" y="1192" class="body" text-anchor="middle">与其他运动流结合</text>
<text x="900.0" y="1223" class="body" text-anchor="middle">具体规则集合</text>
<text x="900.0" y="1254" class="body" text-anchor="middle">原文未完整公开</text>
<path d="M220 1360 V1410 H560 V1455" class="wire"/>
<path d="M560 1360 V1455" class="wire"/>
<path d="M900 1360 V1410 H560" class="wire"/>
<rect x="70" y="1455" width="980" height="130" rx="16" fill="#eaf6ef" stroke="#82b49b" stroke-width="2"/>
<text x="560.0" y="1490" class="node" text-anchor="middle">叠加并协调同一身体上的运动</text>
<text x="560.0" y="1526" class="body" text-anchor="middle">gesture 与支撑运动可能同时作用于一条腿</text>
<text x="560.0" y="1557" class="body" text-anchor="middle">作者原则：叠加不得损害支撑；并非简单相加</text>
<text x="70" y="1623" class="small" text-anchor="start">原文未展开完整冲突求解算法，也没有给出任意动作的无碰撞或平衡保证。</text>
<rect x="40" y="1725" width="1030" height="350" rx="16" fill="#fff" stroke="#d7e1eb" stroke-width="2"/>
<text x="65" y="1768" class="section" text-anchor="start">C · 动画与舞谱同步查看</text>
<path d="M560 1585 V1600 H30 V1705 H365 V1810" class="wire"/>
<rect x="70" y="1810" width="590" height="130" rx="16" fill="#eaf6ef" stroke="#82b49b" stroke-width="2"/>
<text x="365.0" y="1845" class="node" text-anchor="middle">连续三维人物动画</text>
<text x="365.0" y="1881" class="body" text-anchor="middle">显示人物、地面足迹与运动</text>
<text x="365.0" y="1912" class="body" text-anchor="middle">右脚红色 / 左脚绿色；可改变视角</text>
<rect x="755" y="1810" width="285" height="130" rx="16" fill="#edf4ff" stroke="#88a9d1" stroke-width="2"/>
<text x="897.5" y="1845" class="node" text-anchor="middle">原舞谱视图</text>
<text x="897.5" y="1881" class="body" text-anchor="middle">读取 .png</text>
<text x="897.5" y="1912" class="body" text-anchor="middle">随时间移动游标</text>
<path d="M365 1940 V1970 H560 V1990" class="wire"/>
<path d="M897 1940 V1970 H560" class="wire"/>
<rect x="70" y="1990" width="980" height="60" rx="16" fill="#eaf6ef" stroke="#82b49b" stroke-width="2"/>
<text x="560.0" y="2025" class="node" text-anchor="middle">播放 / 拖动时间轴 → 对照符号、足迹与动画</text>
<rect x="40" y="2110" width="1030" height="145" rx="16" fill="#f1f3f6" stroke="#bac3cd" stroke-width="2"/>
<text x="65" y="2150" class="section" text-anchor="start">2003年原型以外：未来功能，不能画成已完成的输出</text>
<text x="65" y="2190" class="body" text-anchor="start">DanceForms 可读文件导出：尚未实现；动画 → 舞谱：未来计划。</text>
<text x="65" y="2224" class="small" text-anchor="start">依据原文图2、§3–5教学重绘；无模型运行结果。</text>
</svg>