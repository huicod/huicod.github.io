<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2910" viewBox="0 0 1600 2910" role="img" aria-labelledby="title desc"><title id="title">FFMT完整训练与推理架构</title><desc id="desc">训练把根相对动作分为低高频和上下身四路量化；音乐推理先生成低频编码再条件化高频，两模型每步用训练统计重新评分。最终特征融合输出旋转和根运动，不是相加旋转。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#456175"/></marker></defs><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#193246}.title{font-size:36px;font-weight:700}.head{font-size:26px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.box{stroke:#9db3c3;stroke-width:2}.edge{fill:none;stroke:#456175;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}</style><rect width="1600" height="2910" fill="#fff"/>
<text x="50" y="60" class="title">FFMT · 先生成低频结构，再生成高频残差</text>
<text x="50" y="103" class="small">教学重绘｜图1、式1–14｜蓝：推理；绿：训练；紫：训练集统计的推理解码先验</text>
<rect x="30" y="140" width="1540" height="1695" rx="24" fill="#f4f8fc" stroke="#d5e1ee"/>
<text x="55" y="185" class="head">音乐 → 低频上／下身token对 → 高频上／下身token对 → 连续舞蹈</text>
<g class="node"><rect class="box" x="565" y="220" width="470" height="140" rx="16" fill="#edf4fa"/>
<text x="583" y="259" class="head">输入音乐 M</text>
<text x="583" y="299" class="body">完整音乐可用；局部上下文可前瞻</text>
<text x="583" y="330" class="body">音乐特征细节未完整披露</text>
</g>
<g class="node"><rect class="box" x="55" y="420" width="650" height="140" rx="16" fill="#edf4fa"/>
<text x="73" y="459" class="head">低频局部音乐编码器：3层</text>
<text x="73" y="499" class="body">邻近音乐特征 → 低频条件 Aᴸ</text>
<text x="73" y="530" class="body">每4秒对齐20个token位置</text>
</g>
<g class="node"><rect class="box" x="895" y="420" width="650" height="140" rx="16" fill="#edf4fa"/>
<text x="913" y="459" class="head">高频局部音乐编码器：3层</text>
<text x="913" y="499" class="body">邻近音乐特征 → 高频条件 Aᴴ</text>
<text x="913" y="530" class="body">每4秒对齐40个token位置</text>
</g>
<path class="edge" d="M665 360 V390 H380 V420"/>
<path class="edge" d="M935 360 V390 H1220 V420"/>
<g class="node"><rect class="box" x="55" y="620" width="650" height="170" rx="16" fill="#dfeafa"/>
<text x="73" y="659" class="head">低频自回归 Transformer：Plan</text>
<text x="73" y="699" class="body">音乐 Aᴸ + 已生成的低频token历史</text>
<text x="73" y="730" class="body">预测下一对上身／下身token的logits</text>
<text x="73" y="761" class="body">低频计划是运动编码，不是事件清单</text>
</g>
<path class="edge" d="M380 560 V620"/>
<g class="node"><rect class="box" x="55" y="850" width="650" height="170" rx="16" fill="#f0e8fa"/>
<text x="73" y="889" class="head">逐步候选重评分 → 选择下一对</text>
<text x="73" y="929" class="body">模型前64对 ∪ 训练集已见后继</text>
<text x="73" y="960" class="body">logits + 转移修正 + 拍点修正 → argmax</text>
<text x="73" y="991" class="body">统计权重固定；不把未知转移全部禁用</text>
</g>
<path class="edge" d="M380 790 V850"/>
<g class="node"><rect class="box" x="55" y="1080" width="650" height="170" rx="16" fill="#edf4fa"/>
<text x="73" y="1119" class="head">累计低频token Zᴸ</text>
<text x="73" y="1159" class="body">每步反馈；完成20对后提供给高频模型</text>
<text x="73" y="1190" class="body">上身20个 + 下身20个token</text>
<text x="73" y="1221" class="body">每个码本128项；token间隔0.2秒</text>
</g>
<path class="edge" d="M380 1020 V1080"/>
<path class="edge" d="M55 1145 H40 V700 H55"/>
<g class="node"><rect class="box" x="895" y="620" width="650" height="170" rx="16" fill="#edf4fa"/>
<text x="913" y="659" class="head">低频时间对齐与邻域条件</text>
<text x="913" y="699" class="body">高频第 2i−1、2i 步 → 低频第 i 步</text>
<text x="913" y="730" class="body">读取附近7个低频token作为条件 Cᴸ</text>
<text x="913" y="761" class="body">选择索引邻域，不对离散索引插值</text>
</g>
<path class="edge" d="M705 1145 H800 V700 H895"/>
<text x="725" y="1050" class="small">已完成的</text>
<text x="725" y="1080" class="small">低频序列</text>
<g class="node"><rect class="box" x="895" y="850" width="650" height="170" rx="16" fill="#fff0d9"/>
<text x="913" y="889" class="head">高频自回归 Transformer：Articulate</text>
<text x="913" y="929" class="body">音乐 Aᴴ + 高频历史 + 对齐低频条件 Cᴸ</text>
<text x="913" y="960" class="body">预测高频上身／下身token对</text>
<text x="913" y="991" class="body">与低频模型分开；动作注意力因果</text>
</g>
<path class="edge" d="M1220 790 V850"/>
<path class="edge" d="M1545 490 H1580 V930 H1545"/>
<g class="node"><rect class="box" x="895" y="1080" width="650" height="170" rx="16" fill="#f0e8fa"/>
<text x="913" y="1119" class="head">逐步候选重评分 → 选择下一对</text>
<text x="913" y="1159" class="body">同样使用候选并集与固定统计修正</text>
<text x="913" y="1190" class="body">高频拍点项权重为0；仍有音乐条件</text>
<text x="913" y="1221" class="body">转移权重可为负，不能一概视作奖励</text>
</g>
<path class="edge" d="M1220 1020 V1080"/>
<g class="node"><rect class="box" x="895" y="1310" width="650" height="170" rx="16" fill="#edf4fa"/>
<text x="913" y="1349" class="head">累计高频token Zᴴ</text>
<text x="913" y="1389" class="body">每步反馈；完成40对后提供给解码器</text>
<text x="913" y="1420" class="body">上身40个 + 下身40个token</text>
<text x="913" y="1451" class="body">每个码本512项；token间隔0.1秒</text>
</g>
<path class="edge" d="M1220 1250 V1310"/>
<path class="edge" d="M1545 1380 H1558 V980 H1545"/>
<g class="node"><rect class="box" x="320" y="1530" width="960" height="200" rx="16" fill="#e6f3eb"/>
<text x="338" y="1569" class="head">四路编码 → 帧率特征 → 融合动作解码器</text>
<text x="338" y="1609" class="body">每个身体区域：低／高频特征按通道拼接 → 时域网络 Φ</text>
<text x="338" y="1640" class="body">融合特征预测关节旋转；下身特征额外预测根速度</text>
<text x="338" y="1671" class="body">指定初始根位置 + 预测速度积分 → 全局平移</text>
<text x="338" y="1702" class="body">这里融合的是特征，不是直接相加低／高频旋转</text>
</g>
<path class="edge" d="M380 1250 V1530"/>
<path class="edge" d="M1220 1480 V1530"/>
<text x="55" y="1375" class="small">低频编码</text>
<text x="55" y="1410" class="small">直接送往解码器</text>
<text x="340" y="1790" class="body">输出：完整帧率的连续舞蹈；没有精确接触、关键帧或世界坐标目标求解器。</text>
<path class="edge" d="M800 1730 V1760"/>
<rect x="30" y="1885" width="1540" height="960" rx="24" fill="#f1f8f2" stroke="#c4dbcd"/>
<text x="55" y="1930" class="head">训练 A：用显式频率目标学习四路动作量化器</text>
<g class="node"><rect class="box" x="55" y="1980" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="73" y="2019" class="head">真实关节位置 → 根相对坐标</text>
<text x="73" y="2059" class="body">去掉全局根平移，得到 P̄</text>
<text x="73" y="2090" class="body">固定高斯低通：Pᴸ = G(P̄)</text>
<text x="73" y="2121" class="body">互补残差：Pᴴ = P̄ − Pᴸ</text>
<text x="73" y="2152" class="body">核31帧、σ=6帧；边界复制</text>
</g>
<g class="node"><rect class="box" x="565" y="1980" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="583" y="2019" class="head">低／高频 × 上／下身：4路VQ</text>
<text x="583" y="2059" class="body">每路独立编码器、码本、位置解码器</text>
<text x="583" y="2090" class="body">低频每身部20 token／128码</text>
<text x="583" y="2121" class="body">高频每身部40 token／512码</text>
<text x="583" y="2152" class="body">码向量维512；低高频网络大小不同</text>
</g>
<g class="node"><rect class="box" x="1075" y="1980" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="1093" y="2019" class="head">位置重建：按关节重组再相加</text>
<text x="1093" y="2059" class="body">P̂ = P̂ᴸ + P̂ᴴ</text>
<text x="1093" y="2090" class="body">每路及完整动作：位置／一二阶差分</text>
<text x="1093" y="2121" class="body">加commitment与潜向量正则</text>
<text x="1093" y="2152" class="body">精确相加分解不等于量化无损</text>
</g>
<path class="edge dash" d="M525 2080 H565"/>
<path class="edge dash" d="M1035 2080 H1075"/>
<text x="55" y="2250" class="head">训练 B／C：冻结动作编码后，学习动画解码与音乐条件生成</text>
<g class="node"><rect class="box" x="55" y="2300" width="710" height="200" rx="16" fill="#e5f2e7"/>
<text x="73" y="2339" class="head">旋转／根运动解码器训练</text>
<text x="73" y="2379" class="body">固定位置编码器与码本，解码四路量化编码</text>
<text x="73" y="2410" class="body">低高频恢复为帧率特征，按身体区域融合</text>
<text x="73" y="2441" class="body">用真实旋转、根运动及时间一致性监督</text>
<text x="73" y="2472" class="body">训练好的融合解码器供推理复用</text>
</g>
<g class="node"><rect class="box" x="815" y="2300" width="730" height="200" rx="16" fill="#e5f2e7"/>
<text x="833" y="2339" class="head">两个自回归生成器训练</text>
<text x="833" y="2379" class="body">配对音乐 + 真实低／高频token序列</text>
<text x="833" y="2410" class="body">next-token交叉熵；高频额外读取低频上下文</text>
<text x="833" y="2441" class="body">分别学习 p(Zᴸ | M) 与 p(Zᴴ | Zᴸ,M)</text>
<text x="833" y="2472" class="body">推理时高频条件换成已经生成的低频序列</text>
</g>
<path class="edge dash" d="M55 2395 H25 V1630 H320"/>
<path class="edge dash" d="M1545 2395 H1568 V810 H1440 V850"/>
<path class="edge dash" d="M1440 810 H750 V760 H705"/>
<text x="770" y="843" class="small">训练后复用</text>
<g class="node"><rect class="box" x="55" y="2570" width="1490" height="155" rx="16" fill="#f0e8fa"/>
<text x="73" y="2609" class="head">仅用训练集：统计各频率的token对后继，以及拍点／非拍点条件频率</text>
<text x="73" y="2649" class="body">先验不新增可训练参数；量化器变化时须重新统计。统计不是测试集检索库或硬动作规则。</text>
<text x="73" y="2680" class="body">AIST++：αᴸ=0.25、αᴴ=−0.30、βᴸ=0.12、βᴴ=0；FineDance：0、0.05、0.06、0。</text>
</g>
<path class="edge dash" d="M55 2650 H12 V940 H55"/>
<path class="edge dash" d="M1545 2650 H1590 V1170 H1545"/>
<text x="55" y="2785" class="body">实线是推理；虚线是训练／统计复用。120个索引／4秒是配置计数，不是速度测量或可读舞步数。</text>
</svg>