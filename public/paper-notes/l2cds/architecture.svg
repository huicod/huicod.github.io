<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1650" viewBox="0 0 1200 1650" role="img" aria-labelledby="title desc">
<title id="title">L2CDS 完整机制教学图</title><desc id="desc">两套系统分别采样，训练编码解码器与共享动力学，运行时分别进行状态对应或潜在运动想象。</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#38627a" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="1650" fill="#f6f8fb"/>
<text x="600" y="43" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="31" font-weight="700" fill="#183247">L2CDS：学习共享动力学，再交换状态解码器</text>
<text x="600" y="80" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" fill="#526778">原始状态包含姿态与速度；学习的是状态对应，不是跨身体的动作 / 力矩转换</text>
<rect x="35" y="105" width="1130" height="435" rx="18" fill="white" stroke="#c5d3de"/>
<text x="60" y="141" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" fill="#183247">A · 离线采样与编码：两份未逐帧配对的数据</text>
<text x="60" y="173" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" fill="#526778">各系统先拥有自己的控制策略；独立采样相邻状态对 (sₜ, sₜ₊₁)</text>
<rect x="75" y="200" width="450" height="75" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="300.0" y="231.0" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">系统 A：二维人形 + 已有策略</text>
<text x="300.0" y="260.0" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">原状态 sᴬ（walker2d：17 维）</text>
<rect x="675" y="200" width="450" height="75" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="900.0" y="231.0" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">系统 B：鸵鸟 + 已有策略</text>
<text x="900.0" y="260.0" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">原状态 sᴮ（ostrich2d：21 维）</text>
<rect x="75" y="320" width="450" height="65" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="300.0" y="360.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">各时刻共享的编码器 Eᴬ</text>
<rect x="675" y="320" width="450" height="65" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="900.0" y="360.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">各时刻共享的编码器 Eᴮ</text>
<path d="M300 275V320" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M900 275V320" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<rect x="75" y="430" width="450" height="70" rx="12" fill="#e7f4ed" stroke="#8cabbf" stroke-width="1.5"/>
<text x="300.0" y="458.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">zᴬₜ = Eᴬ(sᴬₜ)；zᴬₜ₊₁ = Eᴬ(sᴬₜ₊₁)</text>
<text x="300.0" y="487.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">两帧分别编码（共享参数）</text>
<rect x="675" y="430" width="450" height="70" rx="12" fill="#e7f4ed" stroke="#8cabbf" stroke-width="1.5"/>
<text x="900.0" y="458.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">zᴮₜ = Eᴮ(sᴮₜ)；zᴮₜ₊₁ = Eᴮ(sᴮₜ₊₁)</text>
<text x="900.0" y="487.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">两帧分别编码（共享参数）</text>
<path d="M300 385V430" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M900 385V430" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M535 462H665" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M665 485H535" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="600" y="418" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" fill="#183247">共享潜空间</text>
<rect x="35" y="560" width="1130" height="445" rx="18" fill="white" stroke="#c5d3de"/>
<text x="60" y="596" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" fill="#183247">B · 联合训练：编码器、解码器与共享 F 一起优化</text>
<text x="60" y="628" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" fill="#526778">A/B 各有 E、D 参数；只有 F 共享。以下约束共同塑造潜在状态与演化。</text>
<rect x="75" y="660" width="510" height="100" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="330.0" y="703.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">L_AE：Dᴬ(zᴬ) ≈ sᴬ；Dᴮ(zᴮ) ≈ sᴮ</text>
<text x="330.0" y="732.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">自身重建保留原始状态信息</text>
<rect x="615" y="660" width="510" height="100" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="870.0" y="703.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">L_NN：两域潜在状态的双向最近邻</text>
<text x="870.0" y="732.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">分布对齐；无需跨域配对标签</text>
<rect x="75" y="790" width="510" height="110" rx="12" fill="#e7f4ed" stroke="#8cabbf" stroke-width="1.5"/>
<text x="330.0" y="838.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">L_FD：zₜ + F(zₜ) ≈ E(sₜ₊₁)</text>
<text x="330.0" y="867.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">F 输出潜在增量；约束时间演化</text>
<rect x="615" y="790" width="510" height="110" rx="12" fill="#e7f4ed" stroke="#8cabbf" stroke-width="1.5"/>
<text x="870.0" y="838.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">L_PV：θ′ₜ + v′ₜ ≈ θ′ₜ₊₁</text>
<text x="870.0" y="867.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">z = [θ′, v′]；潜在姿态—速度关系</text>
<text x="600" y="942" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">总损失 = λ_AE L_AE + λ_NN L_NN + λ_FD L_FD + λ_PV L_PV</text>
<text x="600" y="978" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="400" fill="#526778">训练向 D 与 F 的输入加高斯噪声；上述关系均为软学习约束</text>
<rect x="35" y="1025" width="1130" height="485" rx="18" fill="white" stroke="#c5d3de"/>
<text x="60" y="1061" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" fill="#183247">C · 训练后运行：两条用途不同的路径</text>
<text x="60" y="1093" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" fill="#526778">复用训练后的参数，不再计算训练损失；下方所有目标状态均为解码估计。</text>
<text x="75" y="1135" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">① 状态对应：观察源系统，换用目标解码器</text>
<rect x="75" y="1160" width="220" height="70" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="185.0" y="1203.0" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">源仿真当前 sᴬ</text>
<rect x="345" y="1160" width="180" height="70" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="435.0" y="1203.0" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Eᴬ</text>
<rect x="575" y="1160" width="120" height="70" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="635.0" y="1203.0" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">z</text>
<rect x="745" y="1160" width="160" height="70" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="825.0" y="1203.0" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Dᴮ</text>
<rect x="955" y="1160" width="170" height="70" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="1040.0" y="1203.0" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">估计状态 ŝᴮ</text>
<path d="M295 1195H345" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M525 1195H575" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M695 1195H745" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M905 1195H955" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="75" y="1280" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">② 潜在运动想象：F 自行滚动，再分别解码</text>
<rect x="75" y="1340" width="220" height="80" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="185.0" y="1388.0" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">潜在初始状态 z₁</text>
<rect x="355" y="1325" width="360" height="110" rx="12" fill="#e7f4ed" stroke="#8cabbf" stroke-width="1.5"/>
<text x="535.0" y="1373.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">zₜ₊₁ = zₜ + F(zₜ)</text>
<text x="535.0" y="1402.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">重复形成潜在状态轨迹</text>
<rect x="805" y="1310" width="320" height="65" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="965.0" y="1350.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Dᴬ → 人形状态序列</text>
<rect x="805" y="1400" width="320" height="65" rx="12" fill="#e9f3f9" stroke="#8cabbf" stroke-width="1.5"/>
<text x="965.0" y="1440.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Dᴮ → 鸵鸟状态序列</text>
<path d="M295 1380H355" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M715 1360H755V1342H805" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M715 1400H755V1432H805" fill="none" stroke="#38627a" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="600" y="1488" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" fill="#825b30">解码并渲染 imagined motion；未输出目标控制动作，也未验证控制策略迁移</text>
<rect x="35" y="1535" width="1130" height="80" rx="12" fill="#fff5e6" stroke="#d8bc90" stroke-width="1.5"/>
<text x="600.0" y="1568.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">边界：等周期训练设置；无离群拒绝；不保证接触、动力学可执行性或任意新技能</text>
<text x="600.0" y="1597.5" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">正文网络与当前代码配置存在差异。依据 PMLR 2020 图 2、式 3–10、附录 A 原创重绘。</text>
</svg>