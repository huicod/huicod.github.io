<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1670" role="img" aria-label="OpenDance数据、训练与推理完整架构"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526174"/></marker></defs><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;fill:#203047}.t{font-size:29px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.n{font-size:16px}.a{fill:none;stroke:#526174;stroke-width:2.2;marker-end:url(#a)}.d{stroke-dasharray:7 5}</style><rect width="1280" height="1670" fill="white"/><text x="40" y="44" class="t">OpenDance｜同步标注 → 解耦码本 → 联合填空 → 物理细化</text><rect x="30" y="75" width="1220" height="245" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="108" class="h">A · 离线数据构建：生成器的训练来源</text><rect x="55" y="130" width="340" height="130" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="69" y="160" class="h">互联网舞蹈视频</text><text x="69" y="188" class="b">艺术家定义舞种；GPT辅助搜索</text><text x="69" y="213" class="b">人工筛选＋YOLOX单人完整身体</text><text x="69" y="238" class="b">超过600小时候选 → 30fps</text><rect x="455" y="130" width="350" height="130" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="469" y="160" class="h">同步标注与估计</text><text x="469" y="188" class="b">ViTPose二维点；GVHMR三维动作</text><text x="469" y="213" class="b">专家／人工／Qwen2.5-VL文字</text><text x="469" y="238" class="b">Jukebox与Librosa音频特征</text><rect x="865" y="130" width="360" height="130" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="879" y="160" class="h">过滤与OpenDanceSet</text><text x="879" y="188" class="b">Kalman平滑＋PFC优化</text><text x="879" y="213" class="b">抖动／静止／MotionCritic过滤</text><text x="879" y="238" class="b">100.26小时；147人；14细类</text><path d="M395 195H455" class="a"/><path d="M805 195H865" class="a"/><text x="55" y="295" class="n">这些是离线标注；推理不需要联网收集视频。原文41K长片段的统计口径尚不清楚。</text><rect x="30" y="350" width="1220" height="270" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="383" class="h">B · 第一阶段训练：Disentangled Dance Tokenizer（DDT）</text><rect x="55" y="410" width="340" height="140" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="69" y="440" class="h">统一动作与空间数据</text><text x="69" y="468" class="b">OpenDanceSet＋AIST++＋AMASS</text><text x="69" y="493" class="b">旋转J／二维关键点K／轨迹X</text><text x="69" y="518" class="b">每种信号独立编码</text><rect x="455" y="410" width="350" height="140" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="469" y="440" class="h">三路离散码本 · 可训练</text><text x="469" y="468" class="b">Encoder J/K/X → 量化</text><text x="469" y="493" class="b">Codebook J / K / X</text><text x="469" y="518" class="b">保留各类条件的独立入口</text><rect x="865" y="410" width="360" height="140" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="879" y="440" class="h">三路解码重建 · 可训练</text><text x="879" y="468" class="b">Decoder J / K / X</text><text x="879" y="493" class="b">恢复旋转、关键点与全局轨迹</text><text x="879" y="518" class="b">重建监督 → 学到DDT参数</text><path d="M395 480H455" class="a"/><path d="M805 480H865" class="a"/><text x="55" y="590" class="n">解耦不代表三路天然一致：下一阶段增加联合预测与解码后的几何监督。</text><rect x="30" y="650" width="1220" height="340" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="683" class="h">C · 第二阶段训练：让空间token既作条件，也作答案</text><rect x="55" y="710" width="340" height="160" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="69" y="740" class="h">条件与目标编码</text><text x="69" y="768" class="b">文字 → CLIP（冻结）</text><text x="69" y="793" class="b">音乐特征 → 音乐编码（可训练）</text><text x="69" y="818" class="b">J/K/X → DDT（冻结）</text><text x="69" y="843" class="b">模态子集；音乐最终不屏蔽</text><rect x="455" y="710" width="350" height="160" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="469" y="740" class="h">MCT · 可训练</text><text x="469" y="768" class="b">模态屏蔽＋三路token遮挡</text><text x="469" y="793" class="b">拼接条件与运动相关token</text><text x="469" y="818" class="b">自注意力Transformer</text><text x="469" y="843" class="b">同时预测J、K、X的token</text><rect x="865" y="710" width="360" height="160" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="879" y="740" class="h">监督回路</text><text x="879" y="768" class="b">遮挡位置：交叉熵</text><text x="879" y="793" class="b">Gumbel-Softmax → DDT解码</text><text x="879" y="818" class="b">轨迹／二维点／FK／接触损失</text><text x="879" y="843" class="b">梯度更新MCT及音乐编码</text><path d="M395 785H455" class="a"/><path d="M805 785H865" class="a"/><path d="M1045 870V915H630V870" class="a"/><text x="475" y="946" class="n">复用DDT解码计算连续几何误差</text><path d="M1045 550V635H40V695H225V710" class="a d"/><rect x="30" y="1020" width="1220" height="560" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="1053" class="h">D · 推理：可选条件组合与多轮重遮挡；模型权重固定</text><rect x="55" y="1080" width="340" height="170" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="1110" class="h">用户输入 Music＋X</text><text x="69" y="1138" class="b">音乐：基本条件</text><text x="69" y="1163" class="b">可选文字 → CLIP</text><text x="69" y="1188" class="b">可选稀疏二维点／轨迹 → DDT</text><text x="69" y="1213" class="b">给定token固定；其余填[MASK]</text><rect x="455" y="1080" width="350" height="170" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="469" y="1110" class="h">冻结MCT反复预测</text><text x="469" y="1138" class="b">输入当前token序列</text><text x="469" y="1163" class="b">预测遮挡位置的类别分布</text><text x="469" y="1188" class="b">记录跨轮token置信度</text><text x="469" y="1213" class="b">MS-LRM重遮低置信度位置</text><rect x="865" y="1080" width="360" height="170" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="879" y="1110" class="h">每轮脚滑细化</text><text x="879" y="1138" class="b">冻结DDT解码 → FK关节</text><text x="879" y="1163" class="b">主文：Lfs更新logits再取样</text><text x="879" y="1188" class="b">补充：Adam优化关节增量</text><text x="879" y="1213" class="b">两种表述与代码未完全一致</text><path d="M395 1165H455" class="a"/><path d="M805 1165H865" class="a"/><path d="M1045 1250V1290H630V1250" class="a"/><text x="645" y="1315" class="n">下一轮：重新遮挡与预测</text><rect x="455" y="1360" width="350" height="130" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="469" y="1390" class="h">最后一轮与后处理</text><text x="469" y="1418" class="b">脚滑梯度细化motion embedding</text><text x="469" y="1443" class="b">轻量处理残余脚滑</text><text x="469" y="1468" class="b">旋转＋轨迹解码为连续动作</text><rect x="865" y="1360" width="360" height="130" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="879" y="1390" class="h">最终SMPL运动</text><text x="879" y="1418" class="b">24关节旋转＋根平移＋接触</text><text x="879" y="1443" class="b">分别验收路径、姿态、节拍</text><text x="879" y="1468" class="b">空间误差并非必然为零</text><path d="M630 1250V1360" class="a"/><path d="M805 1425H865" class="a"/><path d="M630 990V1005H1235V1065H630V1080" class="a d"/><text x="55" y="1520" class="n">补充代码局部旋转未见回写到token状态；末轮latent细化另有实现。本图不是已验证运行轨迹。</text><text x="55" y="1550" class="n">图4的“hard conditions”指输入token固定；本文未给任意冲突条件的优先规则或连续坐标硬保证。</text><text x="40" y="1620" class="n">实线：计算／样本状态；虚线：复用参数。依据CVPR2026正式版图2/4、§3–4与式1–6。</text></svg>