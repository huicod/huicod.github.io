<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1810" viewBox="0 0 1440 1810" role="img" aria-labelledby="title desc"><title id="title">KP：训练、生成、编辑与白盒评测的完整架构</title><desc id="desc">规则把动作转为392维KP。双VAE联合对齐动作和KP latent。冻结后，文本条件扩散生成动作latent并解码；编辑和补间复用双编码器。KPG对解码动作重新提取KP，检查指定模式。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4b6478"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#1c3346}.title{font-size:32px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:22px;font-weight:700}.t{font-size:21px}.small{font-size:19px}.line{fill:none;stroke:#4b6478;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}</style><rect width="1440" height="1810" fill="#fff"/>
<text x="40" y="48" class="title" text-anchor="start">KP：让运动学事实进入表征学习，并从生成动作中重新检查</text>
<text x="42" y="88" class="small" text-anchor="start">教学示意 · ECCV 2024 正式稿图3–5 / §3–4 · 实线：数据与条件  |  虚线：阶段复用与训练关系</text>
<rect x="30" y="120" width="1380" height="230" rx="16" fill="#f5f9fd" stroke="#c6d6e2" stroke-width="1.5"/>
