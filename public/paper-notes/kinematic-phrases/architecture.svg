<text x="65" y="1060" class="small" text-anchor="start">扩散训练：真实 M 经冻结 Eₘ 得到动作 latent，加噪后学习条件去噪；表示训练与扩散训练分阶段。</text>
<text x="65" y="1094" class="small" text-anchor="start">生成推理不要求先输出可读KP；没有逐条执行符号计划或强制满足几何关系的求解器。</text>
