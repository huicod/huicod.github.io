<text x="660.0" y="215" class="b" text-anchor="middle">统一骨架与坐标</text>
<text x="660.0" y="244" class="t" text-anchor="middle">17关节 / 人体上、右、前方向</text>
<text x="660.0" y="273" class="t" text-anchor="middle">动作表示 M：147维 / 帧</text>
<rect x="925" y="183" width="450" height="123" rx="13" fill="#fff" stroke="#c6d6e2" stroke-width="1.5"/>
