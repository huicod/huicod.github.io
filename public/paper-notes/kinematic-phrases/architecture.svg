<text x="1150.0" y="244" class="t" text-anchor="middle">PP / PRPP / PDP / LAP / LOP / GVP</text>
<text x="1150.0" y="273" class="t" text-anchor="middle">C：每帧392个 −1 / 0 / +1</text>
