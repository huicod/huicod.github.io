<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2020" viewBox="0 0 1500 2020" role="img" aria-labelledby="title desc">
<title id="title">RDLA：滚动扩散与阶梯式多帧输出</title>
<desc id="desc">训练时为各帧设置不同噪声等级，以历史动作和音频条件预测连续动作，再从单帧滚动渐进微调到多帧阶梯。推理中，带噪窗口、历史和覆盖窗口的音频共同输入骨干，逐帧反向更新后释放前端动作，更新历史、移动窗口并补噪。底部对比单帧坡度和两帧、四帧阶梯，注明音频前瞻和延迟边界。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#44719d"/></marker><marker id="train-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8e68aa"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#25384b}.title{font-size:39px;font-weight:700}.subtitle{font-size:23px;fill:#56697d}.panel{fill:#fbfcfe;stroke:#cbd6df;stroke-width:2}.panel-title{font-size:27px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#56697d}.edge{fill:none;stroke:#44719d;stroke-width:3;marker-end:url(#arr)}.training{fill:none;stroke:#8e68aa;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#train-arr)}</style>
<rect width="1500" height="2020" fill="#ffffff"/>
<text x="55" y="62" class="title" text-anchor="start"><tspan x="55" dy="0">RDLA｜让动作窗口持续去噪，让前端动作及时释放</tspan></text><text x="57" y="104" class="subtitle" text-anchor="start"><tspan x="57" dy="0">AAAI 2026 · 基于 arXiv v3 图1–2、算法1–2、§2–3与附录B–D重绘</tspan></text><rect x="35" y="135" width="1430" height="330" rx="22" class="panel"/><text x="65" y="180" class="panel-title" text-anchor="start"><tspan x="65" dy="0">A  训练：先学习逐帧滚动，再逐级扩大输出阶梯</tspan></text><rect x="65" y="215" width="300" height="145" rx="16" fill="#fff4e6" stroke="#d7ae73" stroke-width="2"/><text x="87" y="255" class="head" text-anchor="start"><tspan x="87" dy="0">配对动作 + 语音</tspan></text><text x="87" y="294" class="body" text-anchor="start"><tspan x="87" dy="0">随机取历史与未来窗口</tspan><tspan x="87" dy="34">保留骨干原有条件</tspan></text><rect x="425" y="215" width="300" height="145" rx="16" fill="#f3eef9" stroke="#af92c4" stroke-width="2"/><text x="447" y="255" class="head" text-anchor="start"><tspan x="447" dy="0">渐增噪声训练样本</tspan></text><text x="447" y="294" class="body" text-anchor="start"><tspan x="447" dy="0">前低后高的逐帧 t</tspan><tspan x="447" dy="34">历史仅加极小噪声</tspan></text><rect x="785" y="215" width="300" height="145" rx="16" fill="#f3eef9" stroke="#af92c4" stroke-width="2"/><text x="807" y="255" class="head" text-anchor="start"><tspan x="807" dy="0">适配原扩散骨干</tspan></text><text x="807" y="294" class="body" text-anchor="start"><tspan x="807" dy="0">逐帧 timestep 嵌入</tspan><tspan x="807" dy="34">均匀加权重建误差</tspan></text><rect x="1145" y="215" width="290" height="145" rx="16" fill="#f3eef9" stroke="#af92c4" stroke-width="2"/><text x="1167" y="255" class="head" text-anchor="start"><tspan x="1167" dy="0">渐进 RDLA 微调</tspan></text><text x="1167" y="294" class="body" text-anchor="start"><tspan x="1167" dy="0">l = 1 → 2 → 4</tspan><tspan x="1167" dy="34">增加历史 + 惯性损失</tspan></text><path d="M365 285 H425" class="training"/><path d="M725 285 H785" class="training"/><path d="M1085 285 H1145" class="training"/><text x="70" y="414" class="small" text-anchor="start"><tspan x="70" dy="0">保留语音条件骨干；改变噪声调度与输出粒度。下面的推理使用训练／微调后的参数。</tspan></text><rect x="35" y="495" width="1430" height="760" rx="22" class="panel"/><text x="65" y="540" class="panel-title" text-anchor="start"><tspan x="65" dy="0">B  推理：持续维护“历史 + 尚未完成的动作窗口”</tspan></text><rect x="65" y="575" width="670" height="105" rx="16" fill="#fff4e6" stroke="#d7ae73" stroke-width="2"/><text x="87" y="615" class="head" text-anchor="start"><tspan x="87" dy="0">音频特征：覆盖历史到窗口末端</tspan></text><text x="87" y="654" class="body" text-anchor="start"><tspan x="87" dy="0">输出当前帧时，可读取后方对应的音频</tspan></text><rect x="785" y="575" width="650" height="105" rx="16" fill="#fff4e6" stroke="#d7ae73" stroke-width="2"/><text x="807" y="615" class="head" text-anchor="start"><tspan x="807" dy="0">风格／说话者等原骨干条件</tspan></text><text x="807" y="654" class="body" text-anchor="start"><tspan x="807" dy="0">是否使用、如何编码，依所选骨干而定</tspan></text><rect x="65" y="755" width="380" height="180" rx="16" fill="#edf5fd" stroke="#8aaed0" stroke-width="2"/><text x="87" y="795" class="head" text-anchor="start"><tspan x="87" dy="0">当前滚动状态</tspan></text><text x="87" y="834" class="body" text-anchor="start"><tspan x="87" dy="0">历史 n_cont 帧</tspan><tspan x="87" dy="34">带噪生成窗口 N 帧</tspan><tspan x="87" dy="34">逐帧或分组噪声等级 t</tspan></text><rect x="560" y="755" width="400" height="180" rx="16" fill="#edf5fd" stroke="#8aaed0" stroke-width="2"/><text x="582" y="795" class="head" text-anchor="start"><tspan x="582" dy="0">适配后的扩散去噪器</tspan></text><text x="582" y="834" class="body" text-anchor="start"><tspan x="582" dy="0">联合读取动作与条件</tspan><tspan x="582" dy="34">预测整窗干净动作 x̂₀</tspan><tspan x="582" dy="34">每帧读取自己的噪声嵌入</tspan></text><rect x="1075" y="755" width="360" height="180" rx="16" fill="#edf5fd" stroke="#8aaed0" stroke-width="2"/><text x="1097" y="795" class="head" text-anchor="start"><tspan x="1097" dy="0">按各帧噪声反向更新</tspan></text><text x="1097" y="834" class="body" text-anchor="start"><tspan x="1097" dy="0">尚未完成的帧留在窗口</tspan><tspan x="1097" dy="34">前端先完成并准备释放</tspan><tspan x="1097" dy="34">连续动作表示，无token</tspan></text><path d="M400 680 V715 H710 V755" class="edge"/><path d="M1110 680 V715 H835 V755" class="edge"/><path d="M445 845 H560" class="edge"/><path d="M960 845 H1075" class="edge"/><rect x="1075" y="1035" width="360" height="125" rx="16" fill="#ebf7f0" stroke="#83b69b" stroke-width="2"/><text x="1097" y="1075" class="head" text-anchor="start"><tspan x="1097" dy="0">释放前端动作</tspan></text><text x="1097" y="1114" class="body" text-anchor="start"><tspan x="1097" dy="0">l = 1：一帧</tspan><tspan x="1097" dy="34">l = 2 / 4：一组连续帧</tspan></text><rect x="560" y="1035" width="400" height="125" rx="16" fill="#edf5fd" stroke="#8aaed0" stroke-width="2"/><text x="582" y="1075" class="head" text-anchor="start"><tspan x="582" dy="0">移窗、补噪并反馈</tspan></text><text x="582" y="1114" class="body" text-anchor="start"><tspan x="582" dy="0">窗口向前移动 l 帧</tspan><tspan x="582" dy="34">保留中间状态，尾部补 l 帧</tspan></text><rect x="65" y="1035" width="380" height="125" rx="16" fill="#ebf7f0" stroke="#83b69b" stroke-width="2"/><text x="87" y="1075" class="head" text-anchor="start"><tspan x="87" dy="0">更新历史上下文</tspan></text><text x="87" y="1114" class="body" text-anchor="start"><tspan x="87" dy="0">把已完成动作加入历史</tspan><tspan x="87" dy="34">下一轮继续提供连续性</tspan></text><path d="M1255 935 V1035" class="edge"/><text x="1275" y="986" class="small" text-anchor="start"><tspan x="1275" dy="0">前端完成时</tspan></text><path d="M1120 935 V980 H890 V935" class="edge"/><text x="635" y="1012" class="small" text-anchor="start"><tspan x="635" dy="0">前端未完成：继续反向更新</tspan></text><path d="M1075 1100 H960" class="edge"/><path d="M560 1100 H445" class="edge"/><path d="M255 1035 V935" class="edge"/><path d="M760 1160 V1180 H50 V800 H65" class="edge"/><text x="70" y="1210" class="small" text-anchor="start"><tspan x="70" dy="0">启动：带风格的静止姿态 + 静音前缀，按噪声表初始化；之后复用同一滚动循环。</tspan></text><rect x="35" y="1285" width="1430" height="450" rx="22" class="panel"/><text x="65" y="1330" class="panel-title" text-anchor="start"><tspan x="65" dy="0">C  噪声安排：数字是帧序号，颜色越深表示噪声越高</tspan></text><text x="70" y="1375" class="head" text-anchor="start"><tspan x="70" dy="0">普通滚动  l = 1</tspan></text><text x="70" y="1410" class="small" text-anchor="start"><tspan x="70" dy="0">前端每次完成一帧</tspan></text><text x="70" y="1490" class="head" text-anchor="start"><tspan x="70" dy="0">RDLA  l = 2</tspan></text><text x="70" y="1525" class="small" text-anchor="start"><tspan x="70" dy="0">两帧共享一个等级</tspan></text><text x="70" y="1605" class="head" text-anchor="start"><tspan x="70" dy="0">RDLA  l = 4</tspan></text><text x="70" y="1640" class="small" text-anchor="start"><tspan x="70" dy="0">四帧共享一个等级</tspan></text><rect x="370" y="1350" width="112" height="76" rx="9" fill="#e6f2fb" stroke="#7696b1" stroke-width="1.5"/><text x="426" y="1396" text-anchor="middle" style="font-size:22px;fill:#25384b">1</text><rect x="495" y="1350" width="112" height="76" rx="9" fill="#cbe1f3" stroke="#7696b1" stroke-width="1.5"/><text x="551" y="1396" text-anchor="middle" style="font-size:22px;fill:#25384b">2</text><rect x="620" y="1350" width="112" height="76" rx="9" fill="#b1d2ec" stroke="#7696b1" stroke-width="1.5"/><text x="676" y="1396" text-anchor="middle" style="font-size:22px;fill:#25384b">3</text><rect x="745" y="1350" width="112" height="76" rx="9" fill="#94bfe2" stroke="#7696b1" stroke-width="1.5"/><text x="801" y="1396" text-anchor="middle" style="font-size:22px;fill:#25384b">4</text><rect x="870" y="1350" width="112" height="76" rx="9" fill="#78acd4" stroke="#7696b1" stroke-width="1.5"/><text x="926" y="1396" text-anchor="middle" style="font-size:22px;fill:#25384b">5</text><rect x="995" y="1350" width="112" height="76" rx="9" fill="#5a94c1" stroke="#7696b1" stroke-width="1.5"/><text x="1051" y="1396" text-anchor="middle" style="font-size:22px;fill:#ffffff">6</text><rect x="1120" y="1350" width="112" height="76" rx="9" fill="#3e7ba9" stroke="#7696b1" stroke-width="1.5"/><text x="1176" y="1396" text-anchor="middle" style="font-size:22px;fill:#ffffff">7</text><rect x="1245" y="1350" width="112" height="76" rx="9" fill="#26618e" stroke="#7696b1" stroke-width="1.5"/><text x="1301" y="1396" text-anchor="middle" style="font-size:22px;fill:#ffffff">8</text><rect x="370" y="1465" width="112" height="76" rx="9" fill="#cbe1f3" stroke="#7696b1" stroke-width="1.5"/><text x="426" y="1511" text-anchor="middle" style="font-size:22px;fill:#25384b">1</text><rect x="495" y="1465" width="112" height="76" rx="9" fill="#cbe1f3" stroke="#7696b1" stroke-width="1.5"/><text x="551" y="1511" text-anchor="middle" style="font-size:22px;fill:#25384b">2</text><rect x="620" y="1465" width="112" height="76" rx="9" fill="#94bfe2" stroke="#7696b1" stroke-width="1.5"/><text x="676" y="1511" text-anchor="middle" style="font-size:22px;fill:#25384b">3</text><rect x="745" y="1465" width="112" height="76" rx="9" fill="#94bfe2" stroke="#7696b1" stroke-width="1.5"/><text x="801" y="1511" text-anchor="middle" style="font-size:22px;fill:#25384b">4</text><rect x="870" y="1465" width="112" height="76" rx="9" fill="#5a94c1" stroke="#7696b1" stroke-width="1.5"/><text x="926" y="1511" text-anchor="middle" style="font-size:22px;fill:#ffffff">5</text><rect x="995" y="1465" width="112" height="76" rx="9" fill="#5a94c1" stroke="#7696b1" stroke-width="1.5"/><text x="1051" y="1511" text-anchor="middle" style="font-size:22px;fill:#ffffff">6</text><rect x="1120" y="1465" width="112" height="76" rx="9" fill="#26618e" stroke="#7696b1" stroke-width="1.5"/><text x="1176" y="1511" text-anchor="middle" style="font-size:22px;fill:#ffffff">7</text><rect x="1245" y="1465" width="112" height="76" rx="9" fill="#26618e" stroke="#7696b1" stroke-width="1.5"/><text x="1301" y="1511" text-anchor="middle" style="font-size:22px;fill:#ffffff">8</text><rect x="370" y="1580" width="112" height="76" rx="9" fill="#94bfe2" stroke="#7696b1" stroke-width="1.5"/><text x="426" y="1626" text-anchor="middle" style="font-size:22px;fill:#25384b">1</text><rect x="495" y="1580" width="112" height="76" rx="9" fill="#94bfe2" stroke="#7696b1" stroke-width="1.5"/><text x="551" y="1626" text-anchor="middle" style="font-size:22px;fill:#25384b">2</text><rect x="620" y="1580" width="112" height="76" rx="9" fill="#94bfe2" stroke="#7696b1" stroke-width="1.5"/><text x="676" y="1626" text-anchor="middle" style="font-size:22px;fill:#25384b">3</text><rect x="745" y="1580" width="112" height="76" rx="9" fill="#94bfe2" stroke="#7696b1" stroke-width="1.5"/><text x="801" y="1626" text-anchor="middle" style="font-size:22px;fill:#25384b">4</text><rect x="870" y="1580" width="112" height="76" rx="9" fill="#26618e" stroke="#7696b1" stroke-width="1.5"/><text x="926" y="1626" text-anchor="middle" style="font-size:22px;fill:#ffffff">5</text><rect x="995" y="1580" width="112" height="76" rx="9" fill="#26618e" stroke="#7696b1" stroke-width="1.5"/><text x="1051" y="1626" text-anchor="middle" style="font-size:22px;fill:#ffffff">6</text><rect x="1120" y="1580" width="112" height="76" rx="9" fill="#26618e" stroke="#7696b1" stroke-width="1.5"/><text x="1176" y="1626" text-anchor="middle" style="font-size:22px;fill:#ffffff">7</text><rect x="1245" y="1580" width="112" height="76" rx="9" fill="#26618e" stroke="#7696b1" stroke-width="1.5"/><text x="1301" y="1626" text-anchor="middle" style="font-size:22px;fill:#ffffff">8</text><text x="370" y="1697" class="small" text-anchor="start"><tspan x="370" dy="0">前端：接近输出</tspan></text><text x="1030" y="1697" class="small" text-anchor="start"><tspan x="1030" dy="0">后端：继续去噪／新增噪声</tspan></text><rect x="35" y="1765" width="1430" height="210" rx="22" class="panel"/><text x="65" y="1810" class="panel-title" text-anchor="start"><tspan x="65" dy="0">D  阅读边界：生成吞吐、输出粒度与端到端响应要分开</tspan></text><text x="70" y="1855" class="body" text-anchor="start"><tspan x="70" dy="0">• 格子仅演示8帧，不是论文实验参数；l与采样步数是不同的加速维度。</tspan><tspan x="70" dy="38">• 音频条件有窗口前瞻；表中200 FPS / 2 ms 不等于已验证的无缓冲首帧响应。</tspan><tspan x="70" dy="38">• 可选OFS平滑未画为必经环节：正文与附录消融对其使用口径存在差异。</tspan></text><text x="55" y="2010" class="small" text-anchor="start"><tspan x="55" dy="0">教学重绘 · 蓝色：生成状态与运算；橙色：外部条件；绿色：已完成动作；紫色虚线：训练流程。</tspan></text></svg>