<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1430" width="1080" height="1430" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">MCM 如何把音频条件接入文字动作扩散模型</title>
<desc id="desc">文字预训练的动作主干冻结后复制出控制分支。每个去噪步，文字与步数送入两支，音频送入控制支，逐层通过零初始化桥修正主干输入。主干预测干净动作，扩散采样器迭代得到每帧263维的动作。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#51606f" stroke-width="1.6"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a75c21" stroke-width="1.6"/></marker></defs>
<rect x="1" y="1" width="1078" height="1428" rx="21" fill="#fafbf9" stroke="#cbd6da" stroke-width="1.5"/>
<text x="37" y="65" font-size="43" fill="#203649" font-weight="700">MCM</text>
<text x="37" y="108" font-size="30" fill="#203649" font-weight="400">文字动作主干怎样学会听音乐与语音？</text>
<rect x="23" y="143" width="1034" height="252" rx="13" fill="#fff" stroke="#c1cfda" stroke-width="1.5"/>
<text x="49" y="187" font-size="30" fill="#203649" font-weight="700">训练分两步</text>
<rect x="48" y="210" width="406" height="152" rx="13" fill="#eaf2fa" stroke="#aac1d4" stroke-width="1.5"/>
<rect x="572" y="210" width="460" height="152" rx="13" fill="#eaf5ef" stroke="#add1be" stroke-width="1.5"/>
<text x="67" y="249" font-size="26" fill="#29567b" font-weight="700">① 文字 → 动作预训练</text>
<text x="67" y="291" font-size="24" fill="#203649" font-weight="400">用配对的文字、动作训练主干。</text>
<text x="67" y="328" font-size="24" fill="#203649" font-weight="400">主干学会从有噪动作还原姿态。</text>
<path d="M464 292 H556" fill="none" stroke="#51606f" stroke-width="3" marker-end="url(#arr)"/>
<text x="474" y="271" font-size="21" fill="#203649" font-weight="400">复制</text>
<text x="590" y="249" font-size="26" fill="#216247" font-weight="700">② 加入音频控制</text>
<text x="590" y="291" font-size="24" fill="#203649" font-weight="400">冻结主干，训练副本与连接模块。</text>
<text x="590" y="328" font-size="24" fill="#203649" font-weight="400">训练样本配动作、音频及伪描述。</text>
<rect x="23" y="420" width="1034" height="670" rx="13" fill="#fff" stroke="#c1cfda" stroke-width="1.5"/>
<text x="49" y="466" font-size="29" fill="#203649" font-weight="700">同一个扩散步内，两支读取相同的有噪动作</text>
<rect x="49" y="498" width="982" height="112" rx="13" fill="#f3f1fa" stroke="#c9c2da" stroke-width="1.5"/>
<text x="69" y="536" font-size="24" fill="#685580" font-weight="700">共享条件</text>
<text x="69" y="578" font-size="24" fill="#203649" font-weight="400">有噪动作 xₜ → 动作嵌入 h；动作文本 → CLIP 特征；去噪步 t → 步数嵌入</text>
<path d="M256 612 V650" fill="none" stroke="#51606f" stroke-width="3" marker-end="url(#arr)"/>
<path d="M810 612 V650" fill="none" stroke="#51606f" stroke-width="3" marker-end="url(#arr)"/>
<rect x="49" y="663" width="400" height="247" rx="13" fill="#eaf5ef" stroke="#add1be" stroke-width="1.5"/>
<text x="70" y="705" font-size="26" fill="#216247" font-weight="700">控制分支 · 可训练</text>
<text x="70" y="752" font-size="23" fill="#203649" font-weight="400">音乐或语音 → Jukebox 特征</text>
<text x="70" y="790" font-size="23" fill="#203649" font-weight="400">按 20 Hz 对齐，投影后加到 h</text>
<text x="70" y="835" font-size="23" fill="#203649" font-weight="400">副本层 i 读取动作、文字和 t</text>
<text x="70" y="874" font-size="22" fill="#203649" font-weight="400">该层输出继续传至副本层 i+1</text>
<rect x="649" y="663" width="382" height="247" rx="13" fill="#eaf2fa" stroke="#aac1d4" stroke-width="1.5"/>
<text x="669" y="705" font-size="26" fill="#29567b" font-weight="700">主分支 · 冻结</text>
<text x="669" y="752" font-size="23" fill="#203649" font-weight="400">当前层的输入加上桥输出</text>
<text x="669" y="790" font-size="23" fill="#203649" font-weight="400">主干层 i 读取文字和 t</text>
<text x="669" y="835" font-size="23" fill="#203649" font-weight="400">沿主干继续传递动作特征</text>
<text x="669" y="874" font-size="22" fill="#203649" font-weight="400">下一层重复同样的连接</text>
<path d="M454 813 H640" fill="none" stroke="#a75c21" stroke-width="3" marker-end="url(#amber)"/>
<text x="478" y="747" font-size="23" fill="#99561f" font-weight="700">逐层桥接</text>
<text x="468" y="783" font-size="22" fill="#99561f" font-weight="400">零初始化投影</text>
<path d="M830 915 V945" fill="none" stroke="#51606f" stroke-width="3" marker-end="url(#arr)"/>
<rect x="49" y="954" width="982" height="107" rx="13" fill="#faf3e9" stroke="#e0c7a8" stroke-width="1.5"/>
<text x="69" y="993" font-size="26" fill="#855426" font-weight="700">主干输出头预测干净动作 x₀</text>
<text x="69" y="1034" font-size="22" fill="#203649" font-weight="400">采样器更新 xₜ → xₜ₋₁，重复去噪。最终得到 20 Hz、每帧 263 维的连续全身动作。</text>
<rect x="23" y="1115" width="1034" height="279" rx="13" fill="#fff" stroke="#c1cfda" stroke-width="1.5"/>
<text x="49" y="1160" font-size="29" fill="#203649" font-weight="700">放大看一个 MWNet 层</text>
<text x="49" y="1206" font-size="25" fill="#29567b" font-weight="600">通道自注意力 → 前馈 → 时间自注意力 → 与文本交叉注意力 → 前馈</text>
<text x="49" y="1254" font-size="24" fill="#203649" font-weight="400">通道注意力在同组的特征维之间建立关系，时间注意力联系不同帧。</text>
<text x="49" y="1296" font-size="24" fill="#203649" font-weight="400">交叉注意力从文字取回动作线索，FiLM 按去噪步调节中间特征。</text>
<text x="49" y="1355" font-size="21" fill="#506475" font-weight="400">棕色箭头传递控制支的修正量；零初始化使刚接入音频时的输出与原主干相同。</text>
</svg>
