<svg xmlns="http://www.w3.org/2000/svg" width="940" height="738" viewBox="0 0 940 738" role="img" aria-labelledby="title desc">
  <title id="title">Cross-Axis Feature Fusion 的文本动作编辑流程</title>
  <desc id="desc">时间和通道两个编码器共同读取源动作与指令。以每帧特征为查询，从通道特征中取信息。融合结果条件化对目标动作的扩散去噪。只有训练阶段使用源、目标动作得出的逐帧相似度与逐旋转通道距离。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2a5063"/></marker>
    <marker id="train" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#935723"/></marker>
    <style>
      text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#19384a}
      .head{font-size:25px;font-weight:700}.sub{font-size:15px}.node{font-size:18px;font-weight:650}.note{font-size:15px}
      .edge{fill:none;stroke:#2a5063;stroke-width:2.2;marker-end:url(#arrow)}
      .aux{fill:none;stroke:#935723;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#train)}
      .label{fill:#70431d;font-size:16px;font-weight:650}
      .mid{text-anchor:middle}
    </style>
  </defs>
  <rect width="940" height="738" rx="14" fill="#f5f9fb"/>
  <text x="26" y="38" class="head">从一句编辑指令到一段连续骨架</text>
  <text x="26" y="64" class="sub">实线为生成路径　·　虚线为训练时接出的预测头　·　N 为动作帧数</text>

  <rect x="26" y="90" width="578" height="68" rx="12" fill="#e1eef5" stroke="#7c9fae"/>
  <text x="315" y="118" class="node mid">源动作 S［N × 207］＋ 编辑指令</text>
  <text x="315" y="142" class="note mid">CLIP 编码文字，两条分支都读取源动作与文字特征</text>
  <path class="edge" d="M174 158 V196"/><path class="edge" d="M464 158 V196"/>
  <rect x="26" y="199" width="275" height="78" rx="12" fill="#e2eefb" stroke="#7297b9"/>
  <text x="164" y="230" class="node mid">时间轴 Transformer</text>
  <text x="164" y="255" class="note mid">每帧一个向量［N × 512］</text>
  <rect x="329" y="199" width="275" height="78" rx="12" fill="#e3f1ec" stroke="#71a393"/>
  <text x="466" y="230" class="node mid">通道轴 Transformer</text>
  <text x="466" y="255" class="note mid">每通道一个向量［207 × 512］</text>
  <path class="edge" d="M164 277 V324"/><path class="edge" d="M466 277 V324"/>
  <text x="185" y="308" class="note">Q · 帧</text><text x="480" y="308" class="note">K、V · 通道</text>
  <rect x="26" y="327" width="578" height="82" rx="12" fill="#d8ecec" stroke="#71a5a6"/>
  <text x="315" y="358" class="node mid">一次跨轴注意力</text>
  <text x="315" y="385" class="note mid">每一帧读取相关通道，保持逐帧条件［N × 512］</text>

  <rect x="651" y="84" width="265" height="327" rx="15" fill="#fbf3e9" stroke="#c19a74" stroke-dasharray="5 4"/>
  <text x="671" y="117" class="label">训练监督 · 从真实动作对计算</text>
  <text x="671" y="145" class="note">输入配对的源动作 S 与目标 T</text>
  <line x1="668" y1="157" x2="898" y2="157" stroke="#d7bb9b"/>
  <text x="671" y="202" class="node">旋转轨迹差异</text>
  <text x="671" y="229" class="note">选 126 个旋转通道，各预测</text>
  <text x="671" y="251" class="note">一个整段 Soft-DTW 距离。</text>
  <path class="aux" d="M604 234 H649"/>
  <line x1="668" y1="280" x2="898" y2="280" stroke="#d7bb9b"/>
  <text x="671" y="328" class="node">逐帧动作相似度</text>
  <text x="671" y="355" class="note">融合后，预测每帧源动作与</text>
  <text x="671" y="377" class="note">目标动作的相似程度。</text>
  <path class="aux" d="M604 368 H649"/>

  <path class="edge" d="M315 409 V477"/>
  <text x="333" y="444" class="note">已融合的文字和源动作条件</text>
  <rect x="651" y="457" width="265" height="99" rx="12" fill="#edf1f5" stroke="#95a6b2"/>
  <text x="783" y="483" class="node mid">当前扩散状态</text>
  <text x="783" y="510" class="note mid">训练起自加噪目标动作</text>
  <text x="783" y="533" class="note mid">采样起自纯噪声</text>
  <path class="edge" d="M651 506 H608"/>
  <rect x="26" y="480" width="578" height="82" rx="12" fill="#e7e6f4" stroke="#9692b6"/>
  <text x="315" y="512" class="node mid">扩散 Transformer（DiT）</text>
  <text x="315" y="539" class="note mid">拼接条件和当前动作表示，结合扩散步预测噪声</text>
  <path class="edge" d="M315 562 V615"/>
  <text x="333" y="595" class="note">DDPM · 推理迭代 300 步</text>
  <rect x="26" y="618" width="578" height="75" rx="12" fill="#d9ece2" stroke="#69977e"/>
  <text x="315" y="647" class="node mid">编辑后的连续动作 M［N × 207］</text>
  <text x="315" y="672" class="note mid">可检查改动部位、动作幅度，以及其余关节的轨迹</text>
  <text x="27" y="718" class="sub">依据原文图 1、§3、§4.1 与补充 B.1 重绘</text>
</svg>
