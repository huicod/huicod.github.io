<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1184" width="860" height="1184" role="img" aria-labelledby="t d">
<title id="t">RoboPerform 的音频动作对齐、教师蒸馏和执行闭环</title><desc id="d">通过有动作配对的音频学习适配器，使用特权参考轨迹学教师，再用学生生成 G1 关节目标。</desc>
