<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1950" viewBox="0 0 1200 1950" role="img"><title>PROMP architecture</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#547c89"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" font-size="32" font-weight="700" fill="#193746">ProMP 把示范变成可组合的轨迹分布</text><text x="42" y="86" font-size="21" font-weight="400" fill="#193746">权重描述整条轨迹，协方差关联各关节与各时刻。训练、分布运算、执行可以分别观察。</text><rect x="24" y="116" width="1152" height="395" rx="16" fill="#f6f9fa" stroke="#c8d9dd" stroke-width="2"/><text x="47" y="152" font-size="27" font-weight="700" fill="#193746">A　从多次示范学习一个原语</text><text x="47" y="185" font-size="21" font-weight="400" fill="#193746">对每条演示建立相位和基函数，将所有自由度的权重放进同一个向量。</text><rect x="48" y="220" width="316" height="150" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="63" y="251" font-size="23" font-weight="700" fill="#193746">多条关节示范</text><text x="63" y="284" font-size="21" font-weight="400" fill="#193746">位置与速度 yₜ=[q, q̇]</text><text x="63" y="313" font-size="21" font-weight="400" fill="#193746">统一进度 z，选择核函数</text><rect x="445" y="220" width="310" height="150" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="460" y="251" font-size="23" font-weight="700" fill="#193746">线性基函数观测模型</text><text x="460" y="284" font-size="21" font-weight="400" fill="#193746">单条动作对应一组 w</text><text x="460" y="313" font-size="21" font-weight="400" fill="#193746">yₜ = Hₜw ＋ 观测噪声</text><rect x="836" y="220" width="316" height="150" rx="16" fill="#e3f2ed" stroke="#c8d9dd" stroke-width="2"/><text x="851" y="251" font-size="23" font-weight="700" fill="#193746">学习权重高斯分布</text><text x="851" y="284" font-size="21" font-weight="400" fill="#193746">得到均值 μw、协方差 Σw</text><text x="851" y="313" font-size="21" font-weight="400" fill="#193746">全协方差保留关节关联</text><path d="M 364,295 L 445,295" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 755,295 L 836,295" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="52" y="425" font-size="21" font-weight="400" fill="#193746">相位变化会改变动作快慢。点到点动作用高斯核，周期动作用圆周核。</text><text x="52" y="461" font-size="21" font-weight="400" fill="#193746">多次动作的一致性和变化量都被保留；原文以极大似然学习，给出 EM 作为估计方式。</text><rect x="24" y="545" width="1152" height="515" rx="16" fill="#f6f9fa" stroke="#c8d9dd" stroke-width="2"/><text x="47" y="581" font-size="27" font-weight="700" fill="#193746">B　使用已学分布：选择条件化、共激活或过渡</text><text x="47" y="614" font-size="21" font-weight="400" fill="#193746">这些操作有各自的输入，可以单独使用。</text><rect x="48" y="650" width="316" height="175" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="63" y="681" font-size="23" font-weight="700" fill="#193746">条件化</text><text x="63" y="714" font-size="21" font-weight="400" fill="#193746">输入时刻、目标状态、</text><text x="63" y="743" font-size="21" font-weight="400" fill="#193746">目标观测协方差 R</text><text x="63" y="772" font-size="21" font-weight="400" fill="#193746">将 p(w) 更新为后验</text><rect x="445" y="650" width="310" height="175" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="460" y="681" font-size="23" font-weight="700" fill="#193746">多个技能共激活</text><text x="460" y="714" font-size="21" font-weight="400" fill="#193746">输入兼容的原语分布</text><text x="460" y="743" font-size="21" font-weight="400" fill="#193746">逐时刻将概率密度相乘</text><text x="460" y="772" font-size="21" font-weight="400" fill="#193746">共同高密度区域获高权重</text><rect x="836" y="650" width="316" height="175" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="851" y="681" font-size="23" font-weight="700" fill="#193746">平滑切换技能</text><text x="851" y="714" font-size="21" font-weight="400" fill="#193746">让激活系数 αᵢ(t) 渐变</text><text x="851" y="743" font-size="21" font-weight="400" fill="#193746">每个时刻重新组合分布</text><text x="851" y="772" font-size="21" font-weight="400" fill="#193746">得到连续的过渡条件</text><path d="M 994,370 L 1165,370 L 1165,628 L 204,628 L 204,650" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-dasharray="8 6"/><rect x="48" y="895" width="1104" height="125" rx="16" fill="#e3f2ed" stroke="#c8d9dd" stroke-width="2"/><text x="63" y="926" font-size="23" font-weight="700" fill="#193746">经调节的期望状态分布 p(yₜ)：每个时刻都有均值与协方差。</text><text x="63" y="959" font-size="21" font-weight="400" fill="#193746">条件更新还能改变相关时刻与关节。分布乘积偏好各技能都允许的动作。</text><path d="M 206,825 L 206,895" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 600,825 L 600,895" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 994,825 L 994,895" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="24" y="1095" width="1152" height="410" rx="16" fill="#f6f9fa" stroke="#c8d9dd" stroke-width="2"/><text x="47" y="1131" font-size="27" font-weight="700" fill="#193746">C　从目标分布求随机反馈控制律</text><text x="47" y="1164" font-size="21" font-weight="400" fill="#193746">机器人局部线性模型和动力学噪声是额外输入。</text><rect x="48" y="1200" width="316" height="165" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="63" y="1231" font-size="23" font-weight="700" fill="#193746">目标状态统计量</text><text x="63" y="1264" font-size="21" font-weight="400" fill="#193746">各时刻均值、协方差</text><text x="63" y="1293" font-size="21" font-weight="400" fill="#193746">以及相邻时刻互协方差</text><rect x="445" y="1200" width="310" height="165" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="460" y="1231" font-size="23" font-weight="700" fill="#193746">匹配均值与协方差</text><text x="460" y="1264" font-size="21" font-weight="400" fill="#193746">结合局部动力学 A、B、c</text><text x="460" y="1293" font-size="21" font-weight="400" fill="#193746">求反馈 Kₜ、前馈 kₜ</text><text x="460" y="1322" font-size="21" font-weight="400" fill="#193746">与控制噪声协方差</text><rect x="836" y="1200" width="316" height="165" rx="16" fill="#e3f2ed" stroke="#c8d9dd" stroke-width="2"/><text x="851" y="1231" font-size="23" font-weight="700" fill="#193746">随机反馈策略</text><text x="851" y="1264" font-size="21" font-weight="400" fill="#193746">读取当前机器人状态 yₜ</text><text x="851" y="1293" font-size="21" font-weight="400" fill="#193746">uₜ = Kₜyₜ ＋ kₜ ＋ εᵤ</text><path d="M 364,1280 L 445,1280" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 755,1280 L 836,1280" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="52" y="1423" font-size="21" font-weight="400" fill="#193746">推导在高斯与模型相容的动力学条件下匹配分布矩。观察噪声与随机控制噪声分开处理。</text><rect x="24" y="1540" width="1152" height="300" rx="16" fill="#f6f9fa" stroke="#c8d9dd" stroke-width="2"/><text x="47" y="1576" font-size="27" font-weight="700" fill="#193746">D　机器人执行与实验评价</text><text x="47" y="1609" font-size="21" font-weight="400" fill="#193746">仿真检验途经点和平均成本，实机观察冰球落点与沙锤运动随速度和技能混合的变化。</text><rect x="48" y="1645" width="316" height="140" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="63" y="1676" font-size="23" font-weight="700" fill="#193746">施加控制 uₜ</text><text x="63" y="1709" font-size="21" font-weight="400" fill="#193746">当前状态和控制噪声</text><text x="63" y="1738" font-size="21" font-weight="400" fill="#193746">共同影响这一次执行</text><rect x="445" y="1645" width="310" height="140" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="460" y="1676" font-size="23" font-weight="700" fill="#193746">实际机器人状态</text><text x="460" y="1709" font-size="21" font-weight="400" fill="#193746">测量位置、速度</text><text x="460" y="1738" font-size="21" font-weight="400" fill="#193746">供下一步反馈使用</text><rect x="836" y="1645" width="316" height="140" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="851" y="1676" font-size="23" font-weight="700" fill="#193746">多次执行汇总</text><text x="851" y="1709" font-size="21" font-weight="400" fill="#193746">比较状态分布和任务结果</text><text x="851" y="1738" font-size="21" font-weight="400" fill="#193746">单条轨迹有自然变化</text><path d="M 364,1715 L 445,1715" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 755,1715 L 836,1715" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="42" y="1890" font-size="20" font-weight="400" fill="#193746">原理重绘　Paraschos 等，NIPS 2013，式1–22与补充实验。</text><text x="42" y="1926" font-size="20" font-weight="400" fill="#193746">实线传递状态或条件，虚线表示复用学得的分布；所有模块均为本文公式的教学表示。</text></g></svg>