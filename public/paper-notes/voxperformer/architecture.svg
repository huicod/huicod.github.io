<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1185" role="img" aria-labelledby="title desc">
  <title id="title">VOXPERFORMER 如何从说话手势连续转入舞蹈</title>
  <desc id="desc">动作分词器和双路音频先训练出对齐的先验，并建立训练集记忆库。生成时按时间安排取语音或音乐条件，检索部位先验，三支共享协调信息，通过十步去噪直接输出动作。末尾32帧成为下一窗前缀。</desc>
  <defs>
    <marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#476972"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203640}
      .title{font-size:30px;font-weight:700}.lead{font-size:17px}.section{font-size:24px;font-weight:700}.head{font-size:19px;font-weight:700}
      .body{font-size:16px}.fine{font-size:15px}.card{fill:#fff;stroke:#94b4b2;stroke-width:1.3}.warm{fill:#fff;stroke:#c6a270;stroke-width:1.3}
      .line,.split,.loop{fill:none;stroke:#476972;stroke-width:2}.line,.loop{marker-end:url(#tip)}.loop{stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="900" height="1185" fill="#fafaf6"/>
  <text x="28" y="43" class="title">声音怎样带着一个演员从说话转入舞蹈？</text>
  <text x="30" y="76" class="lead">VOXPERFORMER · 联合检查点在切换时继续使用同一段动作历史</text>

  <rect x="20" y="101" width="860" height="311" rx="14" fill="#fcf3e5" stroke="#d6b781"/>
  <text x="39" y="139" class="section">训练　让声音学会预测部位动作先验</text>
  <rect x="41" y="159" width="389" height="112" rx="9" class="warm"/>
  <text x="56" y="189" class="head">动作教师 · 三套独立 VQ-VAE</text>
  <text x="56" y="221" class="body">上身 39 维、手 90 维、下身 30 维</text>
  <text x="56" y="249" class="body">每部位 256 个码，码向量为 256 维</text>
  <rect x="469" y="159" width="390" height="112" rx="9" class="warm"/>
  <text x="484" y="189" class="head">音频学生 · 冻结的声音特征</text>
  <text x="484" y="221" class="body">WavLM 128 维 ＋ EnCodec 128 维</text>
  <text x="484" y="249" class="body">融成逐帧 256 维音频先验</text>
  <path class="line" d="M236 271V289"/><path class="line" d="M663 271V289"/>
  <rect x="41" y="294" width="818" height="94" rx="9" class="warm"/>
  <text x="56" y="325" class="head">音频与动作配对训练，再用训练片段离线建库</text>
  <text x="56" y="354" class="body">音频预测部位码和连续嵌入，IPA 对齐整段动作锚点。</text>
  <text x="56" y="378" class="fine">联合库 54,679 项，每项保存一个 32 帧音频键及三组动作先验。生成时只读。</text>

  <rect x="20" y="432" width="860" height="696" rx="14" fill="#edf5f1" stroke="#94b6ac"/>
  <text x="39" y="473" class="section">连续生成　一窗 128 帧，保留 32 帧，生成 96 帧</text>
  <rect x="41" y="499" width="388" height="104" rx="9" class="card"/>
  <text x="56" y="530" class="head">输入 · 音频及 speech/music 安排</text>
  <text x="56" y="561" class="body">双路声音编码器生成音频条件</text>
  <text x="56" y="585" class="fine">联合模型按照已给定的时段标签切换</text>
  <rect x="469" y="499" width="367" height="104" rx="9" class="card"/>
  <text x="484" y="530" class="head">输入 · 上一窗最后 32 帧</text>
  <text x="484" y="561" class="body">保留身体姿态与运动上下文</text>
  <text x="484" y="585" class="fine">各部位的目标帧从初始高斯噪声开始</text>
  <path class="line" d="M235 603V625"/>
  <rect x="41" y="629" width="575" height="102" rx="9" class="card"/>
  <text x="56" y="660" class="head">查询训练记忆 · 32 帧片段，步幅 4</text>
  <text x="56" y="691" class="body">25 次查询各取余弦前 4 项，按部位做码投票。</text>
  <text x="56" y="715" class="fine">汇合音频和三组检索先验，将对应条件送到各分支。</text>
  <path class="split" d="M652 603V752H174 M330 731V752 M652 752H718"/>
  <path class="line" d="M174 752V774"/><path class="line" d="M445 752V774"/><path class="line" d="M718 752V774"/>
  <rect x="43" y="777" width="258" height="68" rx="9" class="card"/>
  <rect x="317" y="777" width="258" height="68" rx="9" class="card"/>
  <rect x="591" y="777" width="245" height="68" rx="9" class="card"/>
  <text x="59" y="806" class="head">上身去噪</text><text x="59" y="831" class="fine">39 维 · 躯干和上肢</text>
  <text x="334" y="806" class="head">手部去噪</text><text x="334" y="831" class="fine">90 维 · 细小手指动作</text>
  <text x="608" y="806" class="head">下身去噪</text><text x="608" y="831" class="fine">30 维 · 下身运动</text>
  <path class="split" d="M174 845V863H718V845 M445 845V863"/><path class="line" d="M445 863V879"/>
  <rect x="41" y="883" width="795" height="92" rx="9" class="card"/>
  <text x="56" y="915" class="head">三路 MPC-DiT 共享协调特征，各支预测干净的连续动作</text>
  <text x="56" y="944" class="body">时间自注意力 → 读取声音和部位条件的交叉注意力 → 扩散步与域标签调制</text>
  <text x="56" y="966" class="fine">ITM 判别监督只用于训练大步反向扩散。</text>
  <path class="line" d="M445 975V995"/>
  <rect x="41" y="999" width="795" height="91" rx="9" fill="#dcece6" stroke="#7faaa0"/>
  <text x="56" y="1032" class="head">10 步确定性 DDIM　→　96 帧全身动作，30 FPS</text>
  <text x="56" y="1063" class="body">输出上身、手和下身共 159 维参数。末 32 帧成为下一窗前缀。</text>
  <path class="loop" d="M836 1045H856V551H839"/>
  <text x="30" y="1162" class="fine">据原文图 2–4、式 1–18 及附录 F 重绘。右侧虚线表示跨窗保留运动历史。</text>
</svg>
