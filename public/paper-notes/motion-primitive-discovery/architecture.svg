<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1610" viewBox="0 0 640 1610" role="img" aria-labelledby="title desc">
  <title id="title">人体动作基元如何被发现、命名，再用于识别</title>
  <desc id="desc">从三维关节姿态开始，按六个身体部分分别最大化运动通量能量来分段。每个无标签片段按肢段长度缩放。离线学习先用最外侧关节的轨迹聚类，人工给类别代表命名，再用组三个关节建类内模型。对新片段，用这些模型和几何距离识别基元，输出部位、区间和类别。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203b45}
      .kicker{font:700 18px Arial,sans-serif;letter-spacing:1.2px;fill:#4a6872}
      .title{font-size:36px;font-weight:700}.head{font-size:27px;font-weight:700}
      .body{font-size:23px}.small{font-size:21px}.bold{font-size:23px;font-weight:700}
      .num{font:700 17px Arial,sans-serif;fill:#fff;text-anchor:middle}
      .center{text-anchor:middle}.divider{stroke:#b9c8c7;stroke-width:1.4}
      .arrow{fill:none;stroke:#486d78;stroke-width:2.6;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5.8" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#486d78"/></marker>
  </defs>
  <rect width="640" height="1610" rx="18" fill="#f7f8f4"/>
  <text x="28" y="44" class="kicker">MOTION PRIMITIVES  /  PLOS ONE 2019</text>
  <text x="28" y="102" class="title">从连续轨迹读出动作基元</text>
  <path d="M28 131H612" class="divider"/>

  <rect x="28" y="155" width="44" height="34" rx="8" fill="#365e70"/>
  <text x="50" y="178" class="num">01</text><text x="84" y="182" class="head">得到六组身体轨迹</text>
  <rect x="28" y="207" width="584" height="158" rx="13" fill="#fffdf8" stroke="#bdcac5"/>
  <text x="52" y="247" class="bold">动作捕捉，或从视频估计的 3D 姿态</text>
  <text x="52" y="286" class="body">头、躯干、左右臂、左右腿，每组 3 个关节。</text>
  <text x="52" y="326" class="small">统一参考坐标，以三次样条平滑关节轨迹。</text>

  <rect x="28" y="395" width="44" height="34" rx="8" fill="#365e70"/>
  <text x="50" y="418" class="num">02</text><text x="84" y="422" class="head">每组独立寻找片段的边界</text>
  <rect x="28" y="447" width="584" height="314" rx="13" fill="#e7f0f2" stroke="#a0b9c1"/>
  <text x="52" y="486" class="bold">从上一边界出发，寻找能量的局部最大值</text>
  <text x="52" y="527" class="body">通量累积各关节沿参考方向的加速度绝对值。</text>
  <text x="52" y="565" class="small">能量另惩罚端点速度与路径长度，抑制过长切段。</text>
  <path d="M52 589H588" class="divider"/>
  <text x="52" y="630" class="small">右臂</text>
  <g transform="translate(126 606)">
    <rect width="107" height="33" rx="5" fill="#b8d4da"/><rect x="111" width="178" height="33" rx="5" fill="#d9e7e8"/><rect x="293" width="165" height="33" rx="5" fill="#b8d4da"/>
  </g>
  <text x="52" y="678" class="small">左腿</text>
  <g transform="translate(126 654)">
    <rect width="187" height="33" rx="5" fill="#d4debf"/><rect x="191" width="115" height="33" rx="5" fill="#e4e8d9"/><rect x="310" width="148" height="33" rx="5" fill="#d4debf"/>
  </g>
  <text x="52" y="735" class="small">条块仅示意各组边界；此时片段尚无类别标签。</text>

  <rect x="28" y="791" width="44" height="34" rx="8" fill="#365e70"/>
  <text x="50" y="814" class="num">03</text><text x="84" y="818" class="head">从无标签片段学习类别模型</text>
  <rect x="28" y="843" width="584" height="399" rx="13" fill="#ebf1e7" stroke="#a3b69c"/>
  <text x="52" y="883" class="small">各片段按肢段长度缩放，减小体型差异。</text>
  <path d="M52 908H588" class="divider"/>
  <text x="52" y="946" class="bold">第一层　按身体组聚类</text>
  <text x="52" y="983" class="body">取最外侧关节的轨迹特征，用狄利克雷</text>
  <text x="52" y="1019" class="body">过程混合模型（DPM）发现组内类别。</text>
  <path d="M64 1034v24" class="arrow"/>
  <text x="89" y="1057" class="small">检查各类代表片段，用生物力学术语命名。</text>
  <path d="M52 1083H588" class="divider"/>
  <text x="52" y="1124" class="bold">第二层　为每个类别单独建模</text>
  <text x="52" y="1162" class="body">改用组内全部 3 个关节的轨迹特征。</text>
  <text x="52" y="1202" class="body">每类再拟合一个 DPM，容纳类内的不同变体。</text>

  <rect x="28" y="1272" width="44" height="34" rx="8" fill="#365e70"/>
  <text x="50" y="1295" class="num">04</text><text x="84" y="1299" class="head">在新的活动中识别已有类别</text>
  <rect x="28" y="1324" width="584" height="250" rx="13" fill="#f5ebda" stroke="#c8b797"/>
  <text x="52" y="1364" class="bold">新片段也经过分段、尺度归一和特征提取。</text>
  <text x="52" y="1403" class="body">在所属身体组，用各类模型的概率筛候选，</text>
  <text x="52" y="1440" class="body">再用轨迹几何代价帮助选出类别。</text>
  <path d="M52 1469H588" class="divider"/>
  <text x="52" y="1511" class="bold">输出　身体组、时间区间、基元名称</text>
  <text x="52" y="1549" class="small">例如：某段右臂轨迹被识别为“屈肘”。</text>
</svg>
