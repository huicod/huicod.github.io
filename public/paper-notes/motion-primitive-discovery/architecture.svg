<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1448" viewBox="0 0 1040 1448" role="img" aria-labelledby="title desc">
<title id="title">Motion Primitive Discovery · 从轨迹到带名称的区间</title><desc id="desc">独立切段后，训练用组内聚类和人工代表命名建立词表。识别再用每类的统计模型和三关节的几何特征。用真实标注示范三个身体组的区间如何重叠。</desc>
<defs><marker id="arrow" viewBox="0 0 9 8" refX="8" refY="4" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#416c70"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203f43}.strong{font-weight:700}.label{fill:#355a5d}.id{fill:#17756f;font-weight:700}</style>
<rect width="1040" height="1448" fill="#f5f8f6"/>
<text x="34" y="54" font-size="36" class="strong">Motion Primitive Discovery · 从轨迹到带名称的区间</text>
<text x="36" y="95" font-size="22" class="label">PLOS ONE 2019　｜　六组身体部位分别切段，各自的时间区间允许重叠。</text>
<rect x="20" y="122" width="1000" height="281" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="164" font-size="23" class="id">01</text>
<text x="99" y="164" font-size="28" class="strong">发现边界：先知道哪一段在动</text>
<rect x="44" y="194" width="245" height="100" rx="12" fill="#e8f1f7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="59" y="227" font-size="24" class="strong">三维姿态</text>
<text x="59" y="260" font-size="21" class="">18 个关节分为 6 组，</text>
<text x="59" y="287" font-size="21" class="">每组跟踪 3 条轨迹。</text>
<rect x="350" y="194" width="319" height="100" rx="12" fill="#e3f1e9" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="365" y="227" font-size="24" class="strong">运动通量与端点目标</text>
<text x="365" y="260" font-size="21" class="">累积加速度在解剖轴的投影，</text>
<text x="365" y="287" font-size="21" class="">兼顾首尾速度与轨迹弧长。</text>
<rect x="733" y="194" width="262" height="100" rx="12" fill="#d7eeeb" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="748" y="227" font-size="24" class="strong">该组的候选基元</text>
<text x="748" y="260" font-size="21" class="">从起点搜索局部极大值，</text>
<text x="748" y="287" font-size="21" class="">取得无名区间 [a, b]。</text>
<path d="M289 243 H350" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M669 243 H733" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="48" y="359" font-size="20" class="label">单组的 3 个关节共用区间；另一组的边界独立计算。全身同一帧可以同时出现多个基元。</text>
<rect x="20" y="428" width="1000" height="384" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="470" font-size="23" class="id">02</text>
<text x="99" y="470" font-size="28" class="strong">建立词表：先聚出类，再由人给代表片段命名</text>
<rect x="45" y="507" width="259" height="107" rx="12" fill="#e8f1f7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="60" y="540" font-size="24" class="strong">分段后的三关节轨迹</text>
<text x="60" y="573" font-size="21" class="">按肢段长度归一化，</text>
<text x="60" y="600" font-size="21" class="">选该组最外侧关节。</text>
<rect x="367" y="507" width="298" height="107" rx="12" fill="#e3f1e9" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="382" y="540" font-size="24" class="strong">组内 DPM 聚类</text>
<text x="382" y="573" font-size="21" class="">轨迹局部特征 → 混合成分，</text>
<text x="382" y="600" font-size="21" class="">按 80% 归属阈值收集片段。</text>
<rect x="725" y="507" width="269" height="107" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="740" y="540" font-size="24" class="strong">人工查看代表</text>
<text x="740" y="573" font-size="21" class="">选类内模型评分最高者，</text>
<text x="740" y="600" font-size="21" class="">赋予生物力学名称。</text>
<path d="M304 561 H367" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M665 561 H725" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="367" y="687" width="627" height="92" rx="12" fill="#eeeaf7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="382" y="720" font-size="24" class="strong">每个已命名类单独训练一个 DPM</text>
<text x="382" y="753" font-size="21" class="">恢复使用组内全部 3 个关节，学习同一类别内的多种轨迹形状。</text>
<path d="M860 614 V687" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M175 614 V734 H367" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<rect x="20" y="836" width="1000" height="239" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="878" font-size="23" class="id">03</text>
<text x="99" y="878" font-size="28" class="strong">识别新片段：统计似然筛选，曲线几何定类</text>
<rect x="44" y="920" width="254" height="100" rx="12" fill="#e8f1f7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="59" y="953" font-size="24" class="strong">新视频或动捕</text>
<text x="59" y="986" font-size="21" class="">沿用 01 切段；提取</text>
<text x="59" y="1013" font-size="21" class="">组内 3 个关节的特征。</text>
<rect x="359" y="920" width="302" height="100" rx="12" fill="#eeeaf7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="374" y="953" font-size="24" class="strong">按似然筛候选</text>
<text x="374" y="986" font-size="21" class="">仅在当前身体组的已学</text>
<text x="374" y="1013" font-size="21" class="">类别模型中选成分。</text>
<rect x="724" y="920" width="270" height="100" rx="12" fill="#d7eeeb" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="739" y="953" font-size="24" class="strong">比较曲线几何</text>
<text x="739" y="986" font-size="21" class="">切平面距离与标架旋转</text>
<text x="739" y="1013" font-size="21" class="">→ 该区间的类别名称。</text>
<path d="M298 970 H359" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M661 970 H724" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="1099" width="1000" height="237" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="1141" font-size="23" class="id">04</text>
<text x="99" y="1141" font-size="28" class="strong">公开记录示例 · 同一段 Directions 的三条时间线</text>
<text x="45" y="1175" font-size="20" class="label">Human3.6M · S11_Directions1：条带是已发布的起止帧，没有表示动作强度。</text>
<text x="45" y="1221" font-size="21" class="">右臂：肩内旋并屈肘</text>
<rect x="335" y="1200" width="580" height="23" rx="4" fill="#edf2f0" stroke="#edf2f0" stroke-width="1.6"/>
<rect x="335.0" y="1200" width="404.2" height="23" rx="4" fill="#88bdb2" stroke="#88bdb2" stroke-width="1.6"/>
<text x="386.0" y="1218" font-size="18" class="">1–47 帧</text>
<text x="45" y="1258" font-size="21" class="">左臂：肩内旋并屈肘</text>
<rect x="335" y="1237" width="580" height="23" rx="4" fill="#edf2f0" stroke="#edf2f0" stroke-width="1.6"/>
<rect x="446.8" y="1237" width="309.59999999999997" height="23" rx="4" fill="#aebf85" stroke="#aebf85" stroke-width="1.6"/>
<text x="497.8" y="1255" font-size="18" class="">14–49 帧</text>
<text x="45" y="1295" font-size="21" class="">头：前倾</text>
<rect x="335" y="1274" width="580" height="23" rx="4" fill="#edf2f0" stroke="#edf2f0" stroke-width="1.6"/>
<rect x="532.8" y="1274" width="387.0" height="23" rx="4" fill="#96b9cd" stroke="#96b9cd" stroke-width="1.6"/>
<text x="583.8" y="1292" font-size="18" class="">24–68 帧</text>
<text x="38" y="1390" font-size="20" class="label">实线是建库或识别的数据流；虚线为训练时保留的完整三关节轨迹。第 24–47 帧三组共同运动。</text>
<text x="38" y="1424" font-size="20" class="label">据原文图 2、4、7–8、算法 1 与作者公开标注重绘。合成边界误差与类别识别另行评估。</text>
</svg>
