<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2380" role="img" aria-labelledby="title desc">
<title id="title">SemConFlow：四部位动作先验、整体语义对齐与对比流匹配</title>
<desc id="desc">先训练手部、上身、下身、面部四组RVQ-VAE。语音经HuBERT、转录经BERT编码与归一化形成条件。连续整体潜变量由条件速度场及ODE积分生成，随后投影、拆分、量化和解码。SACM和正负速度对比均为训练监督，不需要推理时输入真实动作或负例。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52677c"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3c836b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#1f344c}.title{font-size:31px;font-weight:700}.section{font-size:25px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:20px}.note{font-size:18px}.panel{fill:#f8fafc;stroke:#c9d5e2;stroke-width:1.5}.box{stroke:#a8bacd;stroke-width:1.5}.arrow{fill:none;stroke:#52677c;stroke-width:2.4;stroke-linejoin:round;marker-end:url(#a)}.train{stroke:#3c836b;stroke-dasharray:8 6;marker-end:url(#g)}</style><rect width="1440" height="2380" fill="white"/>
<text x="40" y="52" class="title">SemConFlow｜先让语义与整体动作对齐，再学习有正负参照的生成方向</text>
<text x="40" y="85" class="note">原名 HolisticSemGes · 教学重绘 · 依据 arXiv:2603.26553v2，图2–3与式3–17</text>
<rect x="30" y="110" width="1380" height="310" rx="18" class="panel"/>
<text x="54" y="148" class="section">A · 第一阶段：四部位 RVQ-VAE 学习动作压缩与重建</text>
<rect x="60" y="175" width="280" height="110" rx="12" class="box" fill="#fff1d8"/>
<text x="78" y="207" class="head">真实动作：SMPL-X</text>
<text x="78" y="237" class="body">拆成 hand / upper /</text>
<text x="78" y="265" class="body">lower / face 四个区域</text>
<rect x="395" y="175" width="280" height="110" rx="12" class="box" fill="#eaf2fb"/>
<text x="413" y="207" class="head">四组时间动作编码器</text>
<text x="413" y="237" class="body">各区域连续潜变量 Z_r</text>
<text x="413" y="265" class="body">时间压缩后的运动特征</text>
<rect x="730" y="175" width="280" height="110" rx="12" class="box" fill="#eaf2fb"/>
<text x="748" y="207" class="head">四组残差量化器 RVQ</text>
<text x="748" y="237" class="body">对应区域的码本 Q_r</text>
<text x="748" y="265" class="body">连续潜变量 → 量化潜变量</text>
<rect x="1065" y="175" width="310" height="110" rx="12" class="box" fill="#eaf2fb"/>
<text x="1083" y="207" class="head">四组动作解码器</text>
<text x="1083" y="237" class="body">重建各区域连续动作</text>
<text x="1083" y="265" class="body">拼回完整动作</text>
<path d="M340 230 H395" class="arrow"/>
<path d="M675 230 H730" class="arrow"/>
<path d="M1010 230 H1065" class="arrow"/>
<rect x="395" y="330" width="980" height="62" rx="12" class="box" fill="#eaf6ef"/>
<text x="413" y="362" class="head">训练：动作重建损失＋commitment；保留区域码本与解码器供第二阶段使用</text>
<path d="M1220 285 V330" class="arrow train"/>
<text x="60" y="348" class="note">四区域各有表示，</text>
<text x="60" y="376" class="note">第二阶段再整体建模。</text>
<rect x="30" y="455" width="1380" height="1165" rx="18" class="panel"/>
<text x="54" y="493" class="section">B · 第二阶段及推理：整体潜空间中的语音／转录条件生成</text>
<rect x="60" y="525" width="290" height="125" rx="12" class="box" fill="#fff1d8"/>
<text x="78" y="557" class="head">语音波形</text>
<text x="78" y="587" class="body">HuBERT → 音频特征</text>
<text x="78" y="615" class="body">时间对齐＋投影＋归一化</text>
<text x="78" y="643" class="body">得到音频表示 Ẑ_a</text>
<rect x="410" y="525" width="290" height="125" rx="12" class="box" fill="#fff1d8"/>
<text x="428" y="557" class="head">对应转录文本</text>
<text x="428" y="587" class="body">BERT → 文字特征</text>
<text x="428" y="615" class="body">时间对齐＋投影＋归一化</text>
<text x="428" y="643" class="body">得到文字表示 Ẑ_t</text>
<rect x="1030" y="525" width="340" height="110" rx="12" class="box" fill="#fff1d8"/>
<text x="1048" y="557" class="head">随机起点 Z_0</text>
<text x="1048" y="587" class="body">整体动作潜空间高斯噪声</text>
<text x="1048" y="615" class="body">与目标动作潜变量同形状</text>
<rect x="235" y="740" width="480" height="100" rx="12" class="box" fill="#eaf2fb"/>
<text x="253" y="772" class="head">多模态生成条件 O</text>
<text x="253" y="802" class="body">拼接 Ẑ_a 与 Ẑ_t，再经投影</text>
<text x="253" y="830" class="body">在所有 ODE 积分时刻复用</text>
<path d="M205 650 V690 H475 V740" class="arrow"/>
<path d="M555 650 V690 H475 V740" class="arrow"/>
<rect x="960" y="740" width="410" height="225" rx="12" class="box" fill="#eaf2fb"/>
<text x="978" y="772" class="head">条件速度网络 vθ(Z,t|O)</text>
<text x="978" y="802" class="body">动作潜变量＋身体结构位置嵌入</text>
<text x="978" y="830" class="body">① 时间交叉注意力 TCAM</text>
<text x="978" y="858" class="body">   动作作 Q；条件 O 作 K、V</text>
<text x="978" y="886" class="body">② 时间自注意力＋MLP</text>
<text x="978" y="914" class="body">③ 结合流时间 t，预测速度</text>
<path d="M715 790 H960" class="arrow"/>
<path d="M1200 635 V740" class="arrow"/>
<rect x="60" y="930" width="700" height="165" rx="12" class="box" fill="#eaf6ef"/>
<text x="78" y="962" class="head">训练支线：SACM 整体语义对齐</text>
<text x="78" y="992" class="body">四区域量化前潜变量拼接／缩放 → Z_1 → 投影／归一化</text>
<text x="78" y="1020" class="body">逐时间余弦：动作靠近加权融合的文本＋音频</text>
<text x="78" y="1048" class="body">整段池化 InfoNCE：动作↔音频、动作↔文本</text>
<text x="78" y="1076" class="body">匹配片段拉近，批次内不匹配片段推远</text>
<path d="M205 690 H48 V1010 H60" class="arrow train"/>
<path d="M535 285 V305 H1420 V1010 H760" class="arrow train"/>
<rect x="960" y="1030" width="410" height="100" rx="12" class="box" fill="#eaf2fb"/>
<text x="978" y="1062" class="head">ODE 积分：t 从 0 到 1</text>
<text x="978" y="1092" class="body">dZ / dt = vθ(Z,t|O)</text>
<text x="978" y="1120" class="body">得到完整的生成潜变量 Ẑ_1</text>
<path d="M1165 965 V1030" class="arrow"/>
<path d="M1370 1080 H1390 V705 H1310 V740" class="arrow"/>
<text x="975" y="1004" class="note">按当前状态反复求速度</text>
<rect x="960" y="1200" width="410" height="80" rx="12" class="box" fill="#eaf2fb"/>
<text x="978" y="1232" class="head">轻量投影头</text>
<text x="978" y="1262" class="body">回到与动作码本兼容的潜空间</text>
<path d="M1165 1130 V1200" class="arrow"/>
<rect x="485" y="1200" width="350" height="80" rx="12" class="box" fill="#eaf2fb"/>
<text x="503" y="1232" class="head">拆回四区域潜变量</text>
<text x="503" y="1262" class="body">手／上身／下身／面部</text>
<path d="M960 1240 H835" class="arrow"/>
<rect x="60" y="1200" width="300" height="80" rx="12" class="box" fill="#eaf2fb"/>
<text x="78" y="1232" class="head">各区域对应码本量化</text>
<text x="78" y="1262" class="body">Q_hand / upper / lower / face</text>
<path d="M485 1240 H360" class="arrow"/>
<rect x="60" y="1360" width="300" height="110" rx="12" class="box" fill="#eaf2fb"/>
<text x="78" y="1392" class="head">复用区域动作解码器</text>
<text x="78" y="1422" class="body">量化潜变量 → 连续运动</text>
<text x="78" y="1450" class="body">图3标注冻结解码器</text>
<path d="M210 1280 V1360" class="arrow"/>
<rect x="485" y="1360" width="885" height="110" rx="12" class="box" fill="#edf7f0"/>
<text x="503" y="1392" class="head">输出：身体＋手＋面部的连续共语动作</text>
<text x="503" y="1422" class="body">生成方式：连续潜变量流 → 投影 → 四区域量化 → 动作解码</text>
<text x="503" y="1450" class="body">不需要在推理时检索语义动作库，也不需要真实目标动作或错配负例。</text>
<path d="M360 1415 H485" class="arrow"/>
<text x="62" y="1525" class="body">两种融合各有用途：SACM 的余弦目标用加权融合；生成条件 O 使用拼接与投影。</text>
<text x="62" y="1563" class="note">转录提供说话语义；这里未设计独立动作命令、精确目标点或接触约束输入。</text>
<rect x="30" y="1650" width="1380" height="600" rx="18" class="panel"/>
<text x="54" y="1688" class="section">C · 仅训练：相同噪声起点下的正、负速度目标</text>
<text x="62" y="1720" class="note">训练上方同一条件速度网络；负例用于塑造速度场，不增加推理时的负例生成分支。</text>
<rect x="60" y="1750" width="330" height="110" rx="12" class="box" fill="#edf7f0"/>
<text x="78" y="1782" class="head">正确整体动作潜变量 Z_1</text>
<text x="78" y="1812" class="body">来自匹配语音／转录的动作</text>
<text x="78" y="1840" class="body">四部位潜变量拼接并缩放</text>
<rect x="450" y="1750" width="330" height="110" rx="12" class="box" fill="#fff1d8"/>
<text x="468" y="1782" class="head">共享噪声起点 Z_0</text>
<text x="468" y="1812" class="body">从高斯分布采样</text>
<text x="468" y="1840" class="body">正、负速度目标复用它</text>
<rect x="840" y="1750" width="530" height="110" rx="12" class="box" fill="#fff1d8"/>
<text x="858" y="1782" class="head">错配动作潜变量 Z̃_1</text>
<text x="858" y="1812" class="body">批次内错配音频／转录，取对应错误样本动作</text>
<text x="858" y="1840" class="body">不要求每个负例都有人工作过语义标注</text>
<rect x="60" y="1930" width="330" height="110" rx="12" class="box" fill="#eaf2fb"/>
<text x="78" y="1962" class="head">线性插值取训练状态</text>
<text x="78" y="1992" class="body">Z_t = (1−t)Z_0 + tZ_1</text>
<text x="78" y="2020" class="body">t 随机采样于 [0,1]</text>
<path d="M225 1860 V1930" class="arrow train"/>
<path d="M615 1860 V1890 H300 V1930" class="arrow train"/>
<rect x="450" y="1930" width="330" height="110" rx="12" class="box" fill="#eaf2fb"/>
<text x="468" y="1962" class="head">同一速度网络</text>
<text x="468" y="1992" class="body">输入 Z_t、t、正确条件 O</text>
<text x="468" y="2020" class="body">预测 vθ(Z_t,t|O)</text>
<path d="M390 1985 H450" class="arrow train"/>
<rect x="840" y="1920" width="530" height="170" rx="12" class="box" fill="#eaf6ef"/>
<text x="858" y="1952" class="head">对比速度目标 L_CFM（式12）</text>
<text x="858" y="1982" class="body">正目标 v⁺ = Z_1 − Z_0</text>
<text x="858" y="2010" class="body">负目标 v⁻ = Z̃_1 − Z_0</text>
<text x="858" y="2038" class="body">‖vθ − v⁺‖² − λ‖vθ − v⁻‖²</text>
<text x="858" y="2066" class="body">0 ≤ λ &lt; 1；靠近正确方向、远离错配方向</text>
<path d="M780 1985 H840" class="arrow train"/>
<path d="M1105 1860 V1920" class="arrow train"/>
<text x="62" y="2140" class="head">第二阶段总目标：λ_CFM · L_CFM ＋ λ_sem · L_sem</text>
<text x="62" y="2182" class="body">SACM 的 InfoNCE 对比“表示”；CFM 的差值回归对比“速度目标”，两者不是同一个损失。</text>
<text x="62" y="2218" class="note">论文未在取得的正文中给出 ODE 求解器／实际步数；图中没有推定实时速度或动作执行硬保证。</text>
<path d="M55 2300 H125" class="arrow"/>
<text x="145" y="2306" class="note">实线：推理数据流与迭代</text>
<path d="M615 2300 H685" class="arrow train"/>
<text x="705" y="2306" class="note">虚线：训练监督或阶段产物复用</text>
<text x="40" y="2350" class="note">来源：SemConFlow（原名 HolisticSemGes），ECCV 2026；本图按原文重绘，未表示模型运行验证。</text>
</svg>