<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="TM2D · 音乐与文字在同一条动作序列中相遇">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536477"/></marker></defs>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172b45}.title{font-size:30px;font-weight:700}.section{font-size:23px;font-weight:700}.node{font-size:21px;font-weight:700}.body{font-size:18px}.label{font-size:17px;fill:#536477}</style>
<rect width="1200" height="1500" fill="#fff"/>
<text x="36" y="46" class="title" text-anchor="start">TM2D · 音乐与文字在同一条动作序列中相遇</text>
<text x="36" y="80" class="body" text-anchor="start">教学示意 · 依据 ICCV 2023 图2–3、§3与补充材料 · 虚线表示训练完成后复用</text>
<rect x="20" y="105" width="1160" height="215" rx="16" fill="#f6f8fb" stroke="#d5deea"/>
<text x="40" y="140" class="section" text-anchor="start">A  训练共享动作表示：不需要三模态配对数据</text>
<rect x="40" y="160" width="230" height="105" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="155.0" y="190" class="node" text-anchor="middle">两套动作数据</text>
<text x="155.0" y="215" class="body" text-anchor="middle">AIST++ 舞蹈</text>
<text x="155.0" y="237" class="body" text-anchor="middle">HumanML3D 日常动作</text>
<rect x="310" y="160" width="230" height="105" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="425.0" y="190" class="node" text-anchor="middle">卷积编码器</text>
<text x="425.0" y="215" class="body" text-anchor="middle">统一60 fps</text>
<text x="425.0" y="237" class="body" text-anchor="middle">时间下采样8倍</text>
<rect x="580" y="160" width="240" height="105" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="700.0" y="190" class="node" text-anchor="middle">共享 VQ 码本</text>
<text x="700.0" y="215" class="body" text-anchor="middle">最近邻量化</text>
<text x="700.0" y="237" class="body" text-anchor="middle">1,024个动作编码</text>
<rect x="860" y="160" width="280" height="105" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="1000.0" y="190" class="node" text-anchor="middle">卷积动作解码器</text>
<text x="1000.0" y="215" class="body" text-anchor="middle">重建连续运动</text>
<text x="1000.0" y="237" class="body" text-anchor="middle">重建＋码本＋commitment</text>
<path d="M 270 210 L 310 210" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 540 210 L 580 210" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 820 210 L 860 210" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="299" class="label" text-anchor="start">训练完成后固定动作表示：编码器产生监督 token，码本与动作解码器供最终生成复用。</text>
<rect x="20" y="340" width="1160" height="265" rx="16" fill="#f6f8fb" stroke="#d5deea"/>
<text x="40" y="375" class="section" text-anchor="start">B  训练两个条件任务：条件编码器不同，Transformer 动作解码器共享参数</text>
<rect x="40" y="400" width="230" height="75" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="155.0" y="430" class="node" text-anchor="middle">音乐／动作配对</text>
<text x="155.0" y="455" class="body" text-anchor="middle">AIST++</text>
<rect x="310" y="400" width="230" height="75" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="425.0" y="430" class="node" text-anchor="middle">音乐编码器</text>
<text x="425.0" y="455" class="body" text-anchor="middle">声学特征＋Transformer</text>
<rect x="590" y="400" width="270" height="75" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="725.0" y="430" class="node" text-anchor="middle">动作 token 解码器</text>
<text x="725.0" y="455" class="body" text-anchor="middle">因果自注意＋交叉注意</text>
<rect x="910" y="400" width="230" height="75" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="1025.0" y="430" class="node" text-anchor="middle">下一 token 监督</text>
<text x="1025.0" y="455" class="body" text-anchor="middle">真值动作 token／交叉熵</text>
<rect x="40" y="505" width="230" height="75" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="155.0" y="535" class="node" text-anchor="middle">文字／动作配对</text>
<text x="155.0" y="560" class="body" text-anchor="middle">HumanML3D</text>
<rect x="310" y="505" width="230" height="75" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="425.0" y="535" class="node" text-anchor="middle">文字编码器</text>
<text x="425.0" y="560" class="body" text-anchor="middle">GloVe＋Transformer</text>
<rect x="590" y="505" width="270" height="75" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="725.0" y="535" class="node" text-anchor="middle">动作 token 解码器</text>
<text x="725.0" y="560" class="body" text-anchor="middle">与上路共享参数</text>
<rect x="910" y="505" width="230" height="75" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="1025.0" y="535" class="node" text-anchor="middle">下一 token 监督</text>
<text x="1025.0" y="560" class="body" text-anchor="middle">真值动作 token／交叉熵</text>
<path d="M 270 437 L 310 437" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 540 437 L 590 437" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 860 437 L 910 437" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 270 542 L 310 542" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 540 542 L 590 542" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 860 542 L 910 542" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 725 475 L 725 505" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="20" y="630" width="1160" height="820" rx="16" fill="#fbfcfe" stroke="#d5deea"/>
<text x="40" y="665" class="section" text-anchor="start">C  推理：先分别计算条件特征，再在输出 token 分类之前融合</text>
<rect x="40" y="700" width="290" height="85" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="185.0" y="730" class="node" text-anchor="middle">输入音乐</text>
<text x="185.0" y="755" class="body" text-anchor="middle">连续声学条件</text>
<rect x="455" y="700" width="290" height="85" rx="10" fill="#fff" stroke="#a9b8ca" stroke-width="1.5"/>
<text x="600.0" y="730" class="node" text-anchor="middle">已生成的动作历史</text>
<text x="600.0" y="755" class="body" text-anchor="middle">随机起始 token → 历史 token</text>
<rect x="870" y="700" width="290" height="85" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="1015.0" y="730" class="node" text-anchor="middle">动作文字＋作用时间窗</text>
<text x="1015.0" y="755" class="body" text-anchor="middle">例：6–8秒做侧手翻</text>
<rect x="40" y="825" width="290" height="85" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="185.0" y="855" class="node" text-anchor="middle">复用音乐编码器</text>
<text x="185.0" y="880" class="body" text-anchor="middle">对齐到动作 token 时间轴</text>
<rect x="455" y="825" width="290" height="85" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="600.0" y="855" class="node" text-anchor="middle">用户时间窗 → 权重 w</text>
<text x="600.0" y="880" class="body" text-anchor="middle">首尾20%平滑变化</text>
<text x="600.0" y="902" class="body" text-anchor="middle">文字峰值0.8；区间外为0</text>
<rect x="870" y="825" width="290" height="85" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="1015.0" y="855" class="node" text-anchor="middle">复用文字编码器</text>
<text x="1015.0" y="880" class="body" text-anchor="middle">指令特征序列</text>
<rect x="40" y="955" width="290" height="85" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="185.0" y="985" class="node" text-anchor="middle">共享解码器 · 音乐路径</text>
<text x="185.0" y="1010" class="body" text-anchor="middle">同一历史＋音乐 → hₐ</text>
<rect x="870" y="955" width="290" height="85" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="1015.0" y="985" class="node" text-anchor="middle">共享解码器 · 文字路径</text>
<text x="1015.0" y="1010" class="body" text-anchor="middle">同一历史＋文字 → hₜ</text>
<path d="M 185 785 L 185 825" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1015 785 L 1015 825" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 455 742 L 365 742 L 365 995 L 330 995" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="365" y="973" class="label" text-anchor="start">历史</text>
<path d="M 745 742 L 825 742 L 825 995 L 870 995" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="785" y="973" class="label" text-anchor="start">历史</text>
<path d="M 185 910 L 185 955" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1015 910 L 1015 955" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 870 765 L 790 765 L 790 867 L 745 867" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="440" y="1095" width="320" height="85" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="600.0" y="1125" class="node" text-anchor="middle">末端隐藏特征融合</text>
<text x="600.0" y="1150" class="body" text-anchor="middle">h = (1−w) hₐ + w hₜ</text>
<path d="M 185 1040 L 185 1137 L 440 1137" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="200" y="1117" class="label" text-anchor="start">音乐隐藏特征</text>
<path d="M 1015 1040 L 1015 1137 L 760 1137" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="825" y="1117" class="label" text-anchor="start">文字隐藏特征</text>
<path d="M 600 910 L 600 1095" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="612" y="1020" class="label" text-anchor="start">时间权重</text>
<rect x="440" y="1220" width="320" height="85" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="600.0" y="1250" class="node" text-anchor="middle">线性层 → softmax → 采样</text>
<text x="600.0" y="1275" class="body" text-anchor="middle">得到下一动作 token kᵢ</text>
<path d="M 600 1180 L 600 1220" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 440 1262 L 385 1262 L 385 685 L 600 685 L 600 700" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="392" y="1207" class="label" text-anchor="start">反馈至下一步</text>
<rect x="440" y="1345" width="320" height="75" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="600.0" y="1375" class="node" text-anchor="middle">查码本＋VQ动作解码器</text>
<text x="600.0" y="1400" class="body" text-anchor="middle">复用阶段A的固定组件</text>
<rect x="855" y="1345" width="290" height="75" rx="10" fill="#fff" stroke="#a9b8ca" stroke-width="1.5"/>
<text x="1000.0" y="1375" class="node" text-anchor="middle">连续三维舞蹈</text>
<text x="1000.0" y="1400" class="body" text-anchor="middle">角色运动与关节姿态</text>
<path d="M 600 1305 L 600 1345" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="615" y="1332" class="label" text-anchor="start">完整 token 序列</text>
<path d="M 760 1382 L 855 1382" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1000 265 L 1168 265 L 1168 1325 L 750 1325 L 750 1345" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="40" y="1480" class="label" text-anchor="start">融合的是分类前特征，不是整数 token 或已生成动画；时间窗约束条件影响，不保证动作边界、接触或物理可行性。</text>
</svg>