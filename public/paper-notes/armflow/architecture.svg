<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1940" role="img" aria-labelledby="title desc"><title id="title">ARMFlow：训练、潜变量自回归与离线变体</title><desc id="desc">VAE预训练后冻结；BSCE生成双方历史训练因果上下文和MeanFlow预测器；在线由文字、双方历史、当前actor潜变量、噪声与生成时刻预测当前reactor潜变量，解码且反馈；离线变体联合生成整段，公开编解码因果性另外标注。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#44657b" stroke-width="1.7"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#263c48}.head{font-size:31px;font-weight:700}.group{font-size:25px;font-weight:700}.title{font-size:23px;font-weight:700}.body{font-size:21px}.label{font-size:19px;fill:#526b7c}.line,.dash{fill:none;stroke:#44657b;stroke-width:2.6;marker-end:url(#a)}.dash{stroke:#9472ac;stroke-dasharray:8 7}</style><rect width="1500" height="1940" fill="white"/><text x="35" y="42" class="head">ARMFlow · 历史理解 + 每个反应潜变量的一步生成</text><rect x="20" y="68" width="1460" height="432" rx="18" fill="#faf7ff" stroke="#d3c4e5"/><text x="42" y="108" class="group">A  训练：动作表示预训练 → 冻结；用双方生成历史训练条件生成器</text><rect x="20" y="525" width="1460" height="960" rx="18" fill="#f9fcfe" stroke="#cbdce7"/><text x="42" y="565" class="group">B  在线设计：潜变量位置 i 逐次推进；每个位置对应约4帧</text><rect x="20" y="1510" width="1460" height="235" rx="18" fill="#f6f8fb" stroke="#cbdce7"/><text x="42" y="1550" class="group">C  离线 ReMFlow：独立变体；可读取完整行动者序列</text><rect x="45" y="145" width="365" height="135" rx="13" fill="#fff2dc" stroke="#d4ac70" stroke-width="1.8"/><text x="63" y="179" class="title">配对双人运动 + 交互文字</text><text x="63" y="212" class="body">行动者 a / 反应者 b</text><text x="63" y="241" class="body">真实当前动作仍提供监督</text><rect x="475" y="145" width="450" height="135" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="493" y="179" class="title">共享连续 CNN-VAE</text><text x="493" y="212" class="body">重建、位置等监督 + KL正则</text><text x="493" y="241" class="body">先训练；生成阶段冻结编解码器</text><text x="493" y="270" class="body">潜变量无VQ码本，无可读动作词</text><rect x="995" y="145" width="450" height="135" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="1013" y="179" class="title">BSCE 双方历史自举</text><text x="1013" y="212" class="body">分别生成行动者与反应者历史</text><text x="1013" y="241" class="body">逐渐增加重复轮数，生成支路停梯度</text><text x="1013" y="270" class="body">训练从错误历史中继续生成</text><path d="M410 212 H475" class="line"/><path d="M925 212 H995" class="line"/><rect x="475" y="340" width="450" height="115" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="493" y="374" class="title">当前潜变量的 MeanFlow 目标</text><text x="493" y="407" class="body">噪声插值 + 平均速度恒等式</text><text x="493" y="436" class="body">JVP / stopgrad；训练内引导</text><rect x="995" y="340" width="450" height="115" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="1013" y="374" class="title">联合训练上下文与预测器</text><text x="1013" y="407" class="body">因果 DiT + AdaLN MLP</text><text x="1013" y="436" class="body">文字适配层训练；CLIP主干冻结</text><path d="M1220 280 V340" class="dash"/><path d="M925 397 H995" class="dash"/><text x="45" y="375" class="label">没有额外扩散教师</text><text x="45" y="408" class="label">每步少采样，降低历史自举成本</text><rect x="45" y="610" width="365" height="115" rx="13" fill="#fff2dc" stroke="#d4ac70" stroke-width="1.8"/><text x="63" y="644" class="title">交互文字 → CLIP分支</text><text x="63" y="677" class="body">固定文字语义条件</text><text x="63" y="706" class="body">主干冻结 + 可训练适配层</text><rect x="475" y="610" width="450" height="115" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="493" y="644" class="title">双方历史潜变量缓冲区</text><text x="493" y="677" class="body">〈sos〉+ (a₁,b̂₁)…(aᵢ₋₁,b̂ᵢ₋₁)</text><text x="493" y="706" class="body">第一步仅用起始标记，无须种子动作</text><rect x="995" y="610" width="450" height="115" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="1013" y="644" class="title">因果 DiT 上下文编码</text><text x="1013" y="677" class="body">编码已发生的双方运动</text><text x="1013" y="706" class="body">文字调制；输出当前上下文 cᵢ</text><path d="M925 668 H995" class="line"/><path d="M228 610 V590 H1220 V610" class="line"/><text x="600" y="583" class="label">文字条件</text><rect x="45" y="815" width="365" height="115" rx="13" fill="#fff2dc" stroke="#d4ac70" stroke-width="1.8"/><text x="63" y="849" class="title">当前行动者动作输入</text><text x="63" y="882" class="body">对方当前与过去的原始运动</text><text x="63" y="911" class="body">在线目标不应读取未来帧</text><rect x="475" y="815" width="450" height="115" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="493" y="849" class="title">动作编码器 E（冻结）</text><text x="493" y="882" class="body">动作 → 当前连续潜变量 aᵢ</text><text x="493" y="911" class="body">时间压缩4倍；因果边界见图下注</text><rect x="995" y="815" width="450" height="145" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="1013" y="849" class="title">轻量 AdaLN MLP</text><text x="1013" y="882" class="body">输入：aᵢ + 当前反应噪声</text><text x="1013" y="911" class="body">调制：历史 cᵢ + 生成时刻 r、t</text><text x="1013" y="940" class="body">预测区间平均速度 uᵢ</text><path d="M410 872 H475" class="line"/><path d="M925 872 H995" class="line"/><path d="M1220 725 V815" class="line"/><text x="1240" y="778" class="label">上下文 cᵢ</text><path d="M700 280 V305 H30 V780 H700 V815" class="dash"/><text x="478" y="765" class="label">复用已训练编码器</text><path d="M1445 397 H1460 V780 H1220 V815" class="dash"/><text x="1080" y="765" class="label">复用生成参数</text><rect x="45" y="1050" width="365" height="115" rx="13" fill="#fff2dc" stroke="#d4ac70" stroke-width="1.8"/><text x="63" y="1084" class="title">当前噪声 εᵢ</text><text x="63" y="1117" class="body">每个自回归位置一个连续潜变量</text><text x="63" y="1146" class="body">无离散码预测／查表</text><rect x="475" y="1050" width="450" height="115" rx="13" fill="#fff2dc" stroke="#d4ac70" stroke-width="1.8"/><text x="493" y="1084" class="title">生成路径时刻 r=0、t=1</text><text x="493" y="1117" class="body">一步从噪声得到当前反应</text><text x="493" y="1146" class="body">与物理动作时间 i 区分</text><rect x="995" y="1050" width="450" height="115" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="1013" y="1084" class="title">一次平均速度更新</text><text x="1013" y="1117" class="body">b̂ᵢ = εᵢ − uθ(εᵢ,0,1,条件ᵢ)</text><text x="1013" y="1146" class="body">不是整段交互只运行一次网络</text><path d="M228 1050 V1005 H1110 V960" class="line"/><path d="M700 1050 V990 H1330 V960" class="line"/><path d="M1220 960 V1050" class="line"/><text x="1238" y="1020" class="label">uᵢ</text><rect x="995" y="1250" width="450" height="120" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="1013" y="1284" class="title">动作解码器 D（冻结）</text><text x="1013" y="1317" class="body">连续反应潜变量 → 连续姿态</text><text x="1013" y="1346" class="body">论文设计为逐段输出</text><rect x="475" y="1250" width="450" height="120" rx="13" fill="#eaf6ee" stroke="#8abb9b" stroke-width="1.8"/><text x="493" y="1284" class="title">反应动作 / 骨架渲染</text><text x="493" y="1317" class="body">进入下一响应位置</text><text x="493" y="1346" class="body">接触成功与穿透需单独评测</text><path d="M1220 1165 V1250" class="line"/><path d="M995 1310 H925" class="line"/><text x="1240" y="1210" class="label">b̂ᵢ</text><path d="M1445 1107 H1470 V745 H700 V725" class="line"/><text x="48" y="1410" class="label">反馈：把当前 (aᵢ,b̂ᵢ) 追加到潜变量历史；不是把未来动作加入上下文。</text><text x="48" y="1448" class="label">公开入口反复编码增长中的历史；“全历史”不代表恒定计算量或已有KV缓存。</text><rect x="45" y="1585" width="365" height="115" rx="13" fill="#fff2dc" stroke="#d4ac70" stroke-width="1.8"/><text x="63" y="1619" class="title">完整行动者 + 文字 + 噪声</text><text x="63" y="1652" class="body">共享VAE编码整段动作</text><text x="63" y="1681" class="body">未来信息在离线任务中可用</text><rect x="475" y="1585" width="450" height="115" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="493" y="1619" class="title">ReMFlow DiT</text><text x="493" y="1652" class="body">逐位置拼接行动者与反应噪声</text><text x="493" y="1681" class="body">一次MeanFlow更新，联合生成</text><rect x="995" y="1585" width="450" height="115" rx="13" fill="#eaf6ee" stroke="#8abb9b" stroke-width="1.8"/><text x="1013" y="1619" class="title">共享VAE解码器 → 整段反应</text><text x="1013" y="1652" class="body">不执行在线自回归闭环</text><text x="1013" y="1681" class="body">不是在线主线的额外后处理</text><path d="M410 1640 H475" class="line"/><path d="M925 1640 H995" class="line"/><rect x="45" y="1780" width="1400" height="110" rx="13" fill="#fff2dc" stroke="#d4ac70" stroke-width="1.8"/><text x="63" y="1814" class="title">实现边界：论文因果目标与公开端到端入口须分别核查</text><text x="63" y="1847" class="body">公开codec为对称卷积与跨时间归一化；测试先整段编码actor、最后整段decode反应。</text><text x="63" y="1876" class="body">因此图B是论文在线设计，不是已验证无未来信息的流式部署。7–11ms模型耗时 ≠ 总系统延迟。</text><text x="35" y="1925" class="label">教学重绘：主文图2、算法1、§3–4；紫色虚线为训练／参数复用。未运行模型，未验证硬接触或端到端延迟。</text></svg>