<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1288" viewBox="0 0 1040 1288" role="img" aria-labelledby="title desc">
<title id="title">SinMDM · 怎样只用一段动作训练扩散模型</title><desc id="desc">干净动作同时提供加噪输入和重建监督。局部去噪器在采样中复用，两种参考编辑接入不同位置。</desc>
<defs><marker id="arrow" viewBox="0 0 9 8" refX="8" refY="4" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#416c70"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203f43}.strong{font-weight:700}.label{fill:#355a5d}.id{fill:#17756f;font-weight:700}</style>
<rect width="1040" height="1288" fill="#f5f8f6"/>
<text x="34" y="54" font-size="36" class="strong">SinMDM · 怎样只用一段动作训练扩散模型</text>
<text x="36" y="95" font-size="22" class="label">ICLR 2024　｜　一段示范对应一套参数；同一骨架可采样不同长度。</text>
<rect x="20" y="122" width="1000" height="374" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="164" font-size="23" class="id">01</text>
<text x="99" y="164" font-size="28" class="strong">训练：整段输入，局部预测</text>
<rect x="45" y="198" width="225" height="99" rx="12" fill="#e8f1f7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="60" y="231" font-size="24" class="strong">示范 x₀</text>
<text x="60" y="264" font-size="21" class="">N 帧 × F 个特征</text>
<text x="60" y="291" font-size="21" class="">骨架与骨长固定。</text>
<rect x="327" y="198" width="278" height="99" rx="12" fill="#eeeaf7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="342" y="231" font-size="24" class="strong">随机步 t 加噪</text>
<text x="342" y="264" font-size="21" class="">混入高斯噪声，</text>
<text x="342" y="291" font-size="21" class="">得到与 t 对应的 xₜ。</text>
<rect x="667" y="198" width="328" height="99" rx="12" fill="#e3f1e9" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="682" y="231" font-size="24" class="strong">浅层 U-Net ＋ QnA</text>
<text x="682" y="264" font-size="21" class="">重叠窗口共享查询；</text>
<text x="682" y="291" font-size="21" class="">输出干净动作估计 x̂₀。</text>
<path d="M270 248 H327" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M605 248 H667" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="667" y="363" width="328" height="84" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="682" y="396" font-size="24" class="strong">平方误差</text>
<text x="682" y="429" font-size="21" class="">预测 x̂₀ 对齐训练示范 x₀。</text>
<path d="M831 297 V363" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M160 297 V405 H667" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<rect x="238" y="335" width="35" height="22" rx="4" fill="#d9e9e5" stroke="#adc6bf" stroke-width="1.6"/>
<rect x="280" y="335" width="35" height="22" rx="4" fill="#d9e9e5" stroke="#adc6bf" stroke-width="1.6"/>
<rect x="322" y="335" width="35" height="22" rx="4" fill="#d9e9e5" stroke="#adc6bf" stroke-width="1.6"/>
<rect x="364" y="335" width="35" height="22" rx="4" fill="#d9e9e5" stroke="#adc6bf" stroke-width="1.6"/>
<rect x="406" y="335" width="35" height="22" rx="4" fill="#d9e9e5" stroke="#adc6bf" stroke-width="1.6"/>
<rect x="448" y="335" width="35" height="22" rx="4" fill="#d9e9e5" stroke="#adc6bf" stroke-width="1.6"/>
<rect x="490" y="335" width="35" height="22" rx="4" fill="#d9e9e5" stroke="#adc6bf" stroke-width="1.6"/>
<rect x="532" y="335" width="35" height="22" rx="4" fill="#d9e9e5" stroke="#adc6bf" stroke-width="1.6"/>
<path d="M239 331v-9h159v9 M281 361v9h159v-9" stroke="#287467" stroke-width="3" fill="none"/>
<text x="242" y="394" font-size="20" class="label">QnA 的相邻时间窗共享查询</text>
<text x="47" y="470" font-size="20" class="label">时间邻域限制单次预测能看到的帧数；训练过程中使用同一套网络参数。</text>
<rect x="20" y="520" width="1000" height="295" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="562" font-size="23" class="id">02</text>
<text x="99" y="562" font-size="28" class="strong">生成：指定噪声的时间长度，反复调用已训练网络</text>
<rect x="44" y="600" width="218" height="90" rx="12" fill="#e8f1f7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="59" y="633" font-size="24" class="strong">噪声 xT</text>
<text x="59" y="666" font-size="21" class="">指定目标帧数。</text>
<rect x="316" y="600" width="300" height="90" rx="12" fill="#e3f1e9" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="331" y="633" font-size="24" class="strong">共享去噪器 θ</text>
<text x="331" y="666" font-size="21" class="">xₜ、t → 干净估计 x̂₀</text>
<rect x="690" y="600" width="306" height="90" rx="12" fill="#eeeaf7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="705" y="633" font-size="24" class="strong">反向扩散更新</text>
<text x="705" y="666" font-size="21" class="">结合当前步与估计采样 xₜ₋₁。</text>
<path d="M262 645 H316" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M616 645 H690" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M845 690 V741 H484 V690" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="506" y="732" font-size="20" class="label">t 减 1，直至生成结束</text>
<text x="47" y="785" font-size="20" class="label">最后一步的动态特征与原骨架经正向运动学组成姿态。图 8 展示了 10 秒示范生成 60 秒。</text>
<rect x="20" y="840" width="1000" height="341" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="882" font-size="23" class="id">03</text>
<text x="99" y="882" font-size="28" class="strong">编辑：同一轮去噪中的两种参考入口</text>
<rect x="45" y="920" width="441" height="94" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="60" y="953" font-size="24" class="strong">A　指定帧或关节</text>
<text x="60" y="986" font-size="21" class="">参考动作 y ＋ 保留区域。</text>
<rect x="552" y="920" width="443" height="94" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="567" y="953" font-size="24" class="strong">B　保留内容变化趋势</text>
<text x="567" y="986" font-size="21" class="">参考内容动作 y ＋ 时间低通滤波。</text>
<rect x="45" y="1051" width="441" height="99" rx="12" fill="#d7eeeb" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="60" y="1084" font-size="24" class="strong">写回干净预测 x̂₀</text>
<text x="60" y="1117" font-size="21" class="">已知特征取参考值，其余区域由模型补。</text>
<rect x="552" y="1051" width="443" height="99" rx="12" fill="#d7eeeb" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="567" y="1084" font-size="24" class="strong">调整带噪样本 xₜ₋₁</text>
<text x="567" y="1117" font-size="21" class="">参考的低频 ＋ 当前候选的高频。</text>
<path d="M265 1014 V1051" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<path d="M773 1014 V1051" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="38" y="1230" font-size="20" class="label">实线表示计算，虚线引入监督或参考。两种编辑各自作用在 02 的循环内。</text>
<text x="38" y="1264" font-size="20" class="label">据图 2、4、5、7–9 与附录 A、D 重绘。窗口是可学习的局部关系，未给它命名或分配词元。</text>
</svg>
