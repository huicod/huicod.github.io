<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1750" role="img" aria-label="MotivDance训练、关键姿态选择、节拍定位与扩散补间"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526174"/></marker></defs><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;fill:#203047}.t{font-size:29px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.n{font-size:16px}.a{fill:none;stroke:#526174;stroke-width:2.2;marker-end:url(#a)}.d{stroke-dasharray:7 5}</style><rect width="1280" height="1750" fill="white"/><text x="40" y="44" class="t">MotivDance｜文字给姿态，音乐选拍点，扩散补过渡</text><rect x="30" y="75" width="1220" height="355" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="108" class="h">A · 两类训练：音乐—动作配对；不要求新增细粒度文字三元组</text><rect x="55" y="135" width="340" height="115" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="69" y="165" class="h">定位器的配对监督</text><text x="69" y="193" class="b">音乐 → 冻结Wav2CLIP</text><text x="69" y="218" class="b">动作 → 冻结MotionCLIP</text><text x="69" y="243" class="b">正负配对在语义空间比较</text><rect x="455" y="135" width="350" height="115" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="469" y="165" class="h">仅训练音乐适配器</text><text x="469" y="193" class="b">三层残差MLP</text><text x="469" y="218" class="b">InfoNCE：拉近正确配对</text><text x="469" y="243" class="b">输出适配后的音乐嵌入</text><rect x="865" y="135" width="360" height="115" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="879" y="165" class="h">推理定位时复用</text><text x="879" y="193" class="b">音乐编码器＋已训练适配器</text><text x="879" y="218" class="b">MotionCLIP编码候选姿态</text><text x="879" y="243" class="b">不更新预训练主干</text><path d="M395 192H455" class="a"/><path d="M805 192H865" class="a"/><rect x="55" y="285" width="340" height="115" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="69" y="315" class="h">补间器的配对监督</text><text x="69" y="343" class="b">AIST++／FineDance真实动作</text><text x="69" y="368" class="b">随机抽取已知帧及特征通道</text><text x="69" y="393" class="b">其余动作加噪＋音乐条件</text><rect x="455" y="285" width="350" height="115" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="469" y="315" class="h">训练Transformer U-Net</text><text x="469" y="343" class="b">已知值融合＋拼接二值掩码</text><text x="469" y="368" class="b">音乐交叉注意力；时间FiLM</text><text x="469" y="393" class="b">预测干净动作x₀的重建目标</text><rect x="865" y="285" width="360" height="115" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="879" y="315" class="h">推理补间时复用</text><text x="879" y="343" class="b">冻结训练完成的去噪权重</text><text x="879" y="368" class="b">关键姿态来自文字选择</text><text x="879" y="393" class="b">未知状态由音乐条件补齐</text><path d="M395 342H455" class="a"/><path d="M805 342H865" class="a"/><rect x="30" y="460" width="1220" height="285" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="493" class="h">B · 推理第一段：从细粒度文字获得部分已知姿态</text><rect x="55" y="520" width="340" height="130" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="550" class="h">用户文字</text><text x="69" y="578" class="b">右脚站立、左膝弯90度</text><text x="69" y="603" class="b">双臂交叉、头正直等</text><text x="69" y="628" class="b">描述目标姿态的身体关系</text><rect x="455" y="520" width="350" height="130" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="469" y="550" class="h">冻结PoseScript</text><text x="469" y="578" class="b">生成12个候选姿态</text><text x="469" y="603" class="b">用户选择其中一项</text><text x="469" y="628" class="b">输出相对关节旋转</text><rect x="865" y="520" width="360" height="130" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="879" y="550" class="h">映射到272维表示</text><text x="879" y="578" class="b">FK得到根相对关节位置</text><text x="879" y="603" class="b">填入已知旋转与位置通道</text><text x="879" y="628" class="b">其他动态量保持未知</text><path d="M395 585H455" class="a"/><path d="M805 585H865" class="a"/><text x="55" y="710" class="n">候选选择是论文交互流程的一部分；静态姿态不自动给出速度、路径与完整接触状态。</text><rect x="30" y="775" width="1220" height="330" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="808" class="h">C · 推理第二段：Adaptive Keyframe Locator选择插入时刻</text><rect x="55" y="835" width="340" height="155" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="865" class="h">用户音乐 · 两类定位信息</text><text x="69" y="893" class="b">节拍检测 → 候选集合B</text><text x="69" y="918" class="b">Wav2CLIP＋适配器</text><text x="69" y="943" class="b">取各拍点的音乐嵌入mᵦ</text><text x="69" y="968" class="b">生成路径另用Jukebox</text><rect x="455" y="835" width="350" height="155" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="469" y="865" class="h">关键姿态的语义嵌入</text><text x="469" y="893" class="b">选定姿态 → 冻结MotionCLIP</text><text x="469" y="918" class="b">得到pₖ</text><text x="469" y="943" class="b">计算cos(mᵦ,pₖ)</text><text x="469" y="968" class="b">仅在检测节拍B内比较</text><rect x="865" y="835" width="360" height="155" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="879" y="865" class="h">选时间并构建时空掩码</text><text x="879" y="893" class="b">t̂ₖ = argmaxᵦ∈B cos(mᵦ,pₖ)</text><text x="879" y="918" class="b">时间：选定拍点对应帧</text><text x="879" y="943" class="b">空间：姿态已知特征通道</text><text x="879" y="968" class="b">已知M=1，其他M=0</text><path d="M395 912H455" class="a"/><path d="M805 912H865" class="a"/><path d="M1045 650V760H1235V820H630V835" class="a"/><text x="55" y="1045" class="n">时刻属于B是显式选择规则；语义排序是学习式相似度，未定义多姿态占拍／顺序冲突求解。</text><rect x="30" y="1135" width="1220" height="500" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="1168" class="h">D · 推理第三段：带已知姿态的音乐条件扩散补间</text><rect x="55" y="1195" width="340" height="155" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="69" y="1225" class="h">条件特征</text><text x="69" y="1253" class="b">音乐 → 预训练Jukebox</text><text x="69" y="1278" class="b">舞者ID／编舞ID → 嵌入</text><text x="69" y="1303" class="b">扩散时间步t → MLP</text><text x="69" y="1328" class="b">文字已转成姿态，不再直接拼入</text><rect x="455" y="1195" width="350" height="155" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="469" y="1225" class="h">输入融合与掩码拼接</text><text x="469" y="1253" class="b">xmasked = M·xkey＋(1−M)·xₜ</text><text x="469" y="1278" class="b">Concat(xmasked,M)</text><text x="469" y="1303" class="b">已知通道放入干净值</text><text x="469" y="1328" class="b">未知通道继续去噪</text><rect x="865" y="1195" width="360" height="155" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="879" y="1225" class="h">冻结Transformer U-Net</text><text x="879" y="1253" class="b">残差＋自注意力＋交叉注意力</text><text x="879" y="1278" class="b">时间步FiLM逐层调制</text><text x="879" y="1303" class="b">预测更干净的连续运动</text><text x="879" y="1328" class="b">反向采样得到xₜ₋₁</text><path d="M395 1272H420V1175H1045V1195" class="a"/><path d="M805 1272H865" class="a"/><path d="M1045 990V1128H630V1195" class="a"/><path d="M1045 1350V1390H630V1350" class="a"/><text x="650" y="1418" class="n">下一步：重新融合已知值后去噪</text><rect x="455" y="1460" width="350" height="115" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="469" y="1490" class="h">输出连续舞蹈</text><text x="469" y="1518" class="b">22关节，272维每帧</text><text x="469" y="1543" class="b">局部姿态＋全局状态</text><text x="469" y="1568" class="b">无离散动作token解码</text><rect x="865" y="1460" width="360" height="115" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="879" y="1490" class="h">分别验收</text><text x="879" y="1518" class="b">目标姿态关系与关键帧误差</text><text x="879" y="1543" class="b">音乐节拍与过渡自然度</text><text x="879" y="1568" class="b">无独立物理平衡／碰撞保证</text><path d="M1045 1350V1440H630V1460" class="a"/><path d="M805 1517H865" class="a"/><text x="55" y="1610" class="n">纯音乐模式：M全零。表1只测5个均匀根轨迹关键帧；表2/3纯音乐成绩不代表文本执行率。</text><path d="M805 230H830V440H15V820H225V835" class="a d"/><path d="M1225 380H1265V1175H1205V1195" class="a d"/><text x="655" y="1120" class="n">关键值xkey＋时空掩码M</text><text x="40" y="1680" class="n">依据AAAI2026正式PDF图2/3、§4与式5–13。蓝色表示复用／冻结，绿色为训练，橙色为用户输入。</text><text x="40" y="1712" class="n">输入掩码的强制赋值不等于最终输出零误差；图为教学示意，未运行模型。</text></svg>