<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1810" viewBox="0 0 1280 1810" role="img" aria-labelledby="title desc"><title id="title">Puppeteer · 有姿态与物体条件的伴随语音手势</title><desc id="desc">三阶段模型：因果VAE、姿态语音条件自回归扩散、冻结骨干后的物体融合。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#526477"/></marker><marker id="purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#8559ab"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#203044}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#526477}</style><rect width="1280" height="1810" fill="#f7fafc"/><text x="38" y="48" class="title">Puppeteer · 有姿态与物体条件的伴随语音手势</text><text x="39" y="80" class="small">蓝：语音 / 动作主干   橙：外部条件   紫：新增物体模块   虚线：训练 / 冻结复用</text><rect x="25" y="100" width="1230" height="255" rx="20" fill="#fff" stroke="#ccd7e1"/><text x="48" y="138" class="head">A  Stage 1 · 因果连续潜空间：保留可定位的动作时间顺序</text><rect x="50" y="163" width="320" height="125" rx="12" fill="#fff0db" stroke="#9eb2c4"/><text x="67" y="194" class="body">BEAT2 + 处理后的Embody3D</text><text x="67" y="222" class="body">标准体型 β=0 · 666维/帧</text><text x="67" y="250" class="body">站立模式移除行走并稳定下肢</text><text x="67" y="278" class="body">48帧 gesture primitive</text><rect x="420" y="163" width="365" height="125" rx="12" fill="#e8f2fa" stroke="#9eb2c4"/><text x="437" y="194" class="body">Causal Encoder</text><text x="437" y="222" class="body">2次 stride=2 → 12×256</text><text x="437" y="250" class="body">zᵢ仅编码当前与过去帧</text><text x="437" y="278" class="body">没有离散码本量化</text><rect x="835" y="163" width="390" height="125" rx="12" fill="#e6f4ed" stroke="#9eb2c4"/><text x="852" y="194" class="body">Causal Decoder → 48帧运动</text><text x="852" y="222" class="body">特征重建 + KL + 速度一致性</text><text x="852" y="250" class="body">SMPL-X关节 / 运动学一致性</text><text x="852" y="278" class="body">训练完成后冻结</text><path d="M370 223 H420" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M785 223 H835" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="50" y="329" class="small">连续token的因果性为局部语音对齐提供依据；不等同于全系统已测得实时延迟。</text><rect x="25" y="380" width="1230" height="335" rx="20" fill="#fff" stroke="#ccd7e1"/><text x="48" y="418" class="head">B  Stage 2 · 分开编码语音、转写时间与固定姿态参考</text><rect x="50" y="444" width="355" height="180" rx="12" fill="#e8f2fa" stroke="#9eb2c4"/><text x="67" y="475" class="body">音频</text><text x="67" y="503" class="body">冻结 HuBERT：768维</text><text x="67" y="531" class="body">7维韵律特征</text><text x="67" y="559" class="body">Audio Window Mask</text><text x="67" y="587" class="body">每个潜token读取附近音频</text><rect x="460" y="444" width="355" height="180" rx="12" fill="#fff0db" stroke="#9eb2c4"/><text x="477" y="475" class="body">语音转写 + WhisperX时间戳</text><text x="477" y="503" class="body">冻结 CLIP词嵌入：512维</text><text x="477" y="531" class="body">Text Span Mask</text><text x="477" y="559" class="body">按词的时间范围限制注意力</text><text x="477" y="587" class="body">文字是转写，不是独立指令</text><rect x="870" y="444" width="355" height="180" rx="12" fill="#fff0db" stroke="#9eb2c4"/><text x="887" y="475" class="body">首帧下肢姿态 γ</text><text x="887" y="503" class="body">12关节：6D旋转 + 3D位置</text><text x="887" y="531" class="body">关节MLP + joint-ID</text><text x="887" y="559" class="body">加 sitting/standing token</text><text x="887" y="587" class="body">13个姿态token反复复用</text><rect x="25" y="740" width="1230" height="475" rx="20" fill="#fff" stroke="#ccd7e1"/><text x="48" y="778" class="head">C  自回归扩散主干 · 生成一个primitive，再回传末尾历史</text><rect x="50" y="806" width="300" height="122" rx="12" fill="#e8f2fa" stroke="#9eb2c4"/><text x="67" y="837" class="body">最近 H 帧运动历史</text><text x="67" y="865" class="body">当前 primitive 的噪声潜变量</text><text x="67" y="893" class="body">投影 + 位置 / 扩散时刻</text><text x="67" y="921" class="body">speaker embedding</text><rect x="420" y="806" width="490" height="335" rx="12" fill="#e8f2fa" stroke="#9eb2c4"/><text x="437" y="837" class="body">7层Transformer · 宽512 / 8头</text><text x="437" y="865" class="body">① 历史与未来token Self-Attention</text><text x="437" y="893" class="body">② Gated Posture Cross-Attention</text><text x="437" y="921" class="body">③ 物体融合模块（Stage 3新增）</text><text x="437" y="949" class="body">④ 带时间mask的 Audio-Text CA</text><text x="437" y="977" class="body">⑤ FFN → 预测干净潜变量 ẑ₀</text><text x="437" y="1005" class="body">条件只更新future token</text><text x="437" y="1033" class="body">DDIM 20步 · CFG 2.5</text><rect x="965" y="806" width="260" height="160" rx="12" fill="#e6f4ed" stroke="#9eb2c4"/><text x="982" y="837" class="body">冻结因果解码器</text><text x="982" y="865" class="body">ẑ₀ → 48帧动作</text><text x="982" y="893" class="body">保留末尾H帧</text><text x="982" y="921" class="body">接续下一个primitive</text><path d="M350 865 H420" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M910 875 H965" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M1095 966 V1158 H200 V928" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M220 624 V697 H38 V944 H420" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M638 624 V697 H220" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M1045 624 V725 H935 V893 H910" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="50" y="1190" class="small">训练：动态幅度加权的运动空间误差 + 潜变量误差；姿态gate从0开始学习。</text><rect x="25" y="1240" width="1230" height="320" rx="20" fill="#fff" stroke="#ccd7e1"/><text x="48" y="1278" class="head">D  Stage 3 · 冻结基础生成器，只学习物体与人体几何融合</text><rect x="50" y="1306" width="340" height="165" rx="12" fill="#fff0db" stroke="#9eb2c4"/><text x="67" y="1337" class="body">物体mesh + 末帧人体真实体型</text><text x="67" y="1365" class="body">物体表面采样3,000点</text><text x="67" y="1393" class="body">椭球内固定1,024个BPS点</text><text x="67" y="1421" class="body">到物体 / 上半身的最近距离</text><text x="67" y="1449" class="body">Bₕ = [Bₒ, Bₚ]</text><rect x="440" y="1306" width="420" height="165" rx="12" fill="#f1eafa" stroke="#9eb2c4"/><text x="457" y="1337" class="body">BPS投影 + Gated Object Fusion</text><text x="457" y="1365" class="body">拼接future token与几何token</text><text x="457" y="1393" class="body">Self-Attention → 只保留future</text><text x="457" y="1421" class="body">零初始化tanh gate + FFN</text><text x="457" y="1449" class="body">新增模块训练；骨干冻结</text><rect x="910" y="1306" width="315" height="165" rx="12" fill="#e6f4ed" stroke="#9eb2c4"/><text x="927" y="1337" class="body">仅训练：解码 → 上半身顶点</text><text x="927" y="1365" class="body">物体 32³ SDF碰撞惩罚</text><text x="927" y="1393" class="body">损失权重：1 / 1 / 50</text><text x="927" y="1421" class="body">SceneGes : replay = 4 : 1</text><text x="927" y="1449" class="body">目标：减少穿透，非保证为零</text><path d="M390 1380 H440" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M860 1380 H910" fill="none" stroke="#8559ab" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#purple)"/><path d="M840 1306 V1230 H945 V921 H910" fill="none" stroke="#8559ab" stroke-width="2.4"  marker-end="url(#purple)"/><text x="50" y="1523" class="small">图按正文§3.3公式展示物体分支位置；原图2的Stage 3框图顺序略有简化。</text><rect x="25" y="1585" width="1230" height="195" rx="20" fill="#fff" stroke="#ccd7e1"/><text x="48" y="1623" class="head">E  SceneGes数据制作 · LLM参与数据构造，不在动作推理主干里</text><rect x="50" y="1650" width="370" height="85" rx="12" fill="#fff0db" stroke="#9eb2c4"/><text x="67" y="1681" class="body">153个桌椅资产 → Gemini情景/台词</text><text x="67" y="1709" class="body">场景首帧 + 台词/手势 → Veo 3</text><rect x="470" y="1650" width="370" height="85" rx="12" fill="#e8f2fa" stroke="#9eb2c4"/><text x="487" y="1681" class="body">SAM 3D Body 恢复运动</text><text x="487" y="1709" class="body">专业人员逐帧修正穿透与接触</text><rect x="890" y="1650" width="335" height="85" rx="12" fill="#e6f4ed" stroke="#9eb2c4"/><text x="907" y="1681" class="body">26场景 · 共28分钟</text><text x="907" y="1709" class="body">运动 + 语音 + 3D物体几何</text><path d="M420 1692 H470" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M840 1692 H890" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="50" y="1760" class="small">依据：arXiv:2609.00369v1 图2–3、§3、附录A–F；教学重绘。</text></svg>