<text x="55" y="625" class="stage">B 训练辅助支线：时间条件 FTA ＋ 完整 DCT 监督</text>
<a href="https://arxiv.org/html/2501.18232v2#S3.SS3" target="_blank"><rect x="65" y="670" width="350" height="120" rx="13" fill="#fff3e4" stroke="#d99c54" stroke-width="1.8"/>
<text x="83" y="702" class="node-title">取主干时序特征 X</text>
<text x="83" y="735" class="body">形状：batch × 帧数 × 通道</text>
<text x="83" y="762" class="body">训练支线帮助主干学表示</text>
</a>
<path d="M985 310H965V560H45V730H65" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="270" y="580" class="label">中间特征 X</text>
<a href="https://arxiv.org/html/2501.18232v2#S3.SS3" target="_blank"><rect x="500" y="670" width="390" height="160" rx="13" fill="#fff3e4" stroke="#d99c54" stroke-width="1.8"/>
<text x="518" y="702" class="node-title">时间条件注意力 FTA（训练）</text>
<text x="518" y="735" class="body">AdaLN 用 eₜ 调制 X</text>
<text x="518" y="762" class="body">正文：同一特征构造 Q、K、V</text>
<text x="518" y="789" class="body">残差时序 self-attention</text>
<text x="518" y="816" class="body">不等同于显式低／高频开关</text>
</a>
<a href="https://arxiv.org/html/2501.18232v2#S3.SS4" target="_blank"><rect x="985" y="670" width="390" height="120" rx="13" fill="#fff3e4" stroke="#d99c54" stroke-width="1.8"/>
<text x="1003" y="702" class="node-title">频域辅助预测（训练）</text>
<text x="1003" y="735" class="body">从 FTA 表示预测 Ŷdct</text>
<text x="1003" y="762" class="body">不是主动作的唯一解码器</text>
</a>
<path d="M415 730H500" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="447" y="715" class="label">X</text>
<path d="M890 730H985" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="915" y="715" class="label">表示</text>
<a href="https://arxiv.org/html/2501.18232v2#S3.SS3" target="_blank"><rect x="65" y="875" width="350" height="120" rx="13" fill="#fff3e4" stroke="#d99c54" stroke-width="1.8"/>
<text x="83" y="907" class="node-title">t → 位置编码 → 两层 MLP</text>
<text x="83" y="940" class="body">时间嵌入 eₜ 生成 γ、β</text>
<text x="83" y="967" class="body">调节 AdaLN 的尺度与偏移</text>
</a>
<path d="M415 935H460V790H500" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="466" y="851" class="label">eₜ</text>
<a href="https://arxiv.org/html/2501.18232v2#S3.SS4" target="_blank"><rect x="65" y="1050" width="350" height="115" rx="13" fill="#edf8f0" stroke="#77aa88" stroke-width="1.8"/>
<text x="83" y="1082" class="node-title">训练监督目标 Y</text>
<text x="83" y="1115" class="body">来自同一配对训练样本</text>
<text x="83" y="1142" class="body">推理时没有该真值</text>
</a>
<a href="https://arxiv.org/html/2501.18232v2#S3.SS4" target="_blank"><rect x="500" y="1050" width="390" height="115" rx="13" fill="#edf8f0" stroke="#77aa88" stroke-width="1.8"/>
<text x="518" y="1082" class="node-title">沿动作帧轴做正交 DCT</text>
<text x="518" y="1115" class="body">每个特征通道得到频率系数</text>
<text x="518" y="1142" class="body">默认完整频谱；无手工低通</text>
</a>
<a href="https://arxiv.org/html/2501.18232v2#S3.SS5" target="_blank"><rect x="985" y="940" width="390" height="225" rx="13" fill="#f5effb" stroke="#a585c6" stroke-width="1.8"/>
<text x="1003" y="972" class="node-title">频域辅助损失 Ldct</text>
<text x="1003" y="1005" class="body">masked MSE(Ŷdct, DCT(Y))</text>
<text x="1003" y="1032" class="body">Ltotal = Ldiff ＋ 0.2 Ldct</text>
<text x="1003" y="1059" class="body">联合反传更新主干及辅助分支</text>
<text x="1003" y="1086" class="body">k 是频率索引，n 是动作帧号</text>
<text x="1003" y="1113" class="body">不是测试时梯度 guidance</text>
</a>
<path d="M415 1108H500" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="432" y="1092" class="label">目标 Y</text>
<path d="M890 1108H985" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="903" y="1092" class="label">DCT(Y)</text>
<path d="M1180 790V940" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1200" y="867" class="label">Ŷdct</text>
<path d="M1375 1050H1390V495" fill="none" stroke="#8256ad" stroke-width="2.5" marker-end="url(#purple)" stroke-dasharray="7 6"/>
<path d="M1180 940V888H695V830" fill="none" stroke="#8256ad" stroke-width="2.5" marker-end="url(#purple)" stroke-dasharray="7 6"/>
<text x="740" y="879" class="label">监督反传</text>
<text x="65" y="1203" class="foot">图文接口提示：图2写 cross-attention＋learnable tokens，式5–9写 self-attention；此图不补造查询实现。</text>
<rect x="30" y="1270" width="1380" height="535" rx="18" fill="#f7f9fc" stroke="#d3dce6"/>
<text x="55" y="1305" class="stage">C 推理：从文本与噪声生成连续动作</text>
<a href="https://arxiv.org/html/2501.18232v2#S3.SS1" target="_blank"><rect x="65" y="1350" width="350" height="130" rx="13" fill="#eef6ff" stroke="#78a5ce" stroke-width="1.8"/>
<text x="83" y="1382" class="node-title">用户描述 ＋ 初始随机噪声</text>
<text x="83" y="1415" class="body">给定动作长度等采样设置</text>
<text x="83" y="1442" class="body">没有目标动作或目标频谱</text>
<text x="83" y="1469" class="body">没有独立音频／机器人状态</text>
</a>
<a href="https://arxiv.org/html/2501.18232v2#S3.SS5" target="_blank"><rect x="500" y="1350" width="390" height="130" rx="13" fill="#fff3e4" stroke="#d99c54" stroke-width="1.8"/>
<text x="518" y="1382" class="node-title">复用训练后的条件去噪模型</text>
<text x="518" y="1415" class="body">文本条件、当前动作、当前 t</text>
<text x="518" y="1442" class="body">预测下一次去噪所需信息</text>
<text x="518" y="1469" class="body">按采样器逐步减少噪声</text>
</a>
<a href="https://arxiv.org/html/2501.18232v2#S4.SS2" target="_blank"><rect x="985" y="1350" width="390" height="130" rx="13" fill="#f6f8fb" stroke="#a0afbf" stroke-width="1.8"/>
<text x="1003" y="1382" class="node-title">连续动作特征序列</text>
<text x="1003" y="1415" class="body">时域输出，不是频率 token</text>
<text x="1003" y="1442" class="body">按基准表示恢复关节轨迹</text>
<text x="1003" y="1469" class="body">得到骨架动画</text>
</a>
<path d="M415 1415H500" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="440" y="1398" class="label">条件</text>
<path d="M890 1415H985" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="904" y="1398" class="label">终点输出</text>
<path d="M695 1480V1530H460V1455H500" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="530" y="1520" class="label">迭代去噪</text>
<a href="https://arxiv.org/html/2501.18232v2#S1" target="_blank"><rect x="65" y="1605" width="620" height="145" rx="13" fill="#f6f8fb" stroke="#a0afbf" stroke-width="1.8"/>
<text x="83" y="1637" class="node-title">辅助模块的部署边界</text>
<text x="83" y="1670" class="body">作者称推理丢弃训练辅助信息；未列出完整移除清单。</text>
<text x="83" y="1697" class="body">公开代码早于 v2，没有FTA，不能核实各模块是否保留。</text>
<text x="83" y="1724" class="body">因此不根据此图声称推理零开销或已完成复现。</text>
</a>
<a href="https://arxiv.org/html/2501.18232v2#S4" target="_blank"><rect x="745" y="1605" width="630" height="145" rx="13" fill="#f6f8fb" stroke="#a0afbf" stroke-width="1.8"/>
<text x="763" y="1637" class="node-title">输出边界：人体动作生成 ≠ 机器人执行</text>
<text x="763" y="1670" class="body">没有输出任务程序、接触约束、力矩或控制器命令。</text>
<text x="763" y="1697" class="body">HumanML3D／KIT-ML与动画展示是论文实际实验范围。</text>
<text x="763" y="1724" class="body">没有真实机器人或物理仿真闭环的成功证据。</text>
</a>
<rect x="30" y="1840" width="1380" height="90" rx="15" fill="#fff8ed" stroke="#e0c7a0"/>
<text x="55" y="1874" class="foot">读图要点：DCT 区分信号变化尺度；低频不自动等于可读语义，高频不自动等于有效细节。</text>
<text x="55" y="1907" class="foot">全频正交 L2 本身可与时域 L2 等价；本文的新学习路径在于时间条件表示与独立辅助预测。</text>
</svg>