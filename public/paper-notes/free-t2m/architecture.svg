<text x="83" y="412" class="node-title">配对文本 → 文本编码</text>
<text x="83" y="445" class="body">例如：向前走并挥右手</text>
<text x="83" y="472" class="body">沿用基线文本条件接口</text>
</a>
<path d="M415 440H455V340H945V285H985" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="615" y="332" class="label">文本特征</text>
