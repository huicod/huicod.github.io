<text x="1003" y="422" class="node-title">原扩散任务预测</text>
<text x="1003" y="455" class="body">按模型参数化预测目标 Ŷ</text>
<text x="1003" y="482" class="body">图2以干净动作 x₀ 作示意</text>
</a>
<path d="M1180 325V390" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1200" y="367" class="label">预测头</text>
<a href="https://arxiv.org/html/2501.18232v2#S3.SS5" target="_blank"><rect x="500" y="390" width="350" height="120" rx="13" fill="#f5effb" stroke="#a585c6" stroke-width="1.8"/>
<text x="518" y="422" class="node-title">普通扩散损失 Ldiff</text>
<text x="518" y="455" class="body">比较预测 Ŷ 与训练目标 Y</text>
<text x="518" y="482" class="body">Y 可为干净动作／噪声</text>
</a>
