<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1955" viewBox="0 0 1440 1955" role="img" aria-labelledby="title desc">
<title id="title">Free-T2M新版：时域扩散生成与时间条件频域辅助训练</title><desc id="desc">训练时，文本、带噪动作和扩散时间输入UNet；特征经过时间调制注意力FTA和频域预测头，与监督目标DCT对齐。推理只用文本和噪声迭代生成连续动作，辅助模块具体裁剪尚未有新版公开代码核实，没有机器人控制器。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#52657a"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#8256ad"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#1d3045}.head{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#5a6b7d}.stage{font-size:23px;font-weight:700}.node-title{font-size:22px;font-weight:700}.body{font-size:19px}.label{font-size:17px;fill:#536577}.foot{font-size:19px;fill:#586a7c}a:hover rect{stroke-width:3}</style>
<rect width="1440" height="1955" fill="#ffffff" rx="20"/>
<text x="45" y="48" class="head">Free-T2M：让频域辅助监督适应去噪阶段</text>
<text x="45" y="79" class="sub">教学示意 · 依据公开 v2 图2、§III–IV · 节点可点击 · 主干仍生成时域动作</text>
<rect x="30" y="110" width="1380" height="440" rx="18" fill="#f7faff" stroke="#d3dce6"/>
<text x="55" y="145" class="stage">A 训练主任务：文本条件动作扩散</text>
<a href="https://arxiv.org/html/2501.18232v2#S4.SS1" target="_blank"><rect x="65" y="180" width="350" height="120" rx="13" fill="#edf8f0" stroke="#77aa88" stroke-width="1.8"/>
<text x="83" y="212" class="node-title">真实动作 x₀ ＋ 噪声 ε</text>
<text x="83" y="245" class="body">HumanML3D：每帧263维</text>
<text x="83" y="272" class="body">KIT-ML：每帧251维</text>
</a>
<a href="https://arxiv.org/html/2501.18232v2#S3.SS1" target="_blank"><rect x="500" y="180" width="350" height="120" rx="13" fill="#eef6ff" stroke="#78a5ce" stroke-width="1.8"/>
<text x="518" y="212" class="node-title">采样扩散时间 t 并加噪</text>
<text x="518" y="245" class="body">形成带噪动作 xₜ</text>
<text x="518" y="272" class="body">t 是去噪进程，不是动作帧号</text>
</a>
<a href="https://arxiv.org/html/2501.18232v2#S3.SS3" target="_blank"><rect x="985" y="180" width="390" height="145" rx="13" fill="#fff3e4" stroke="#d99c54" stroke-width="1.8"/>
<text x="1003" y="212" class="node-title">1D UNet 去噪主干（训练）</text>
<text x="1003" y="245" class="body">读取 xₜ、文本条件和 t</text>
<text x="1003" y="272" class="body">形成时序中间特征 X</text>
<text x="1003" y="299" class="body">主干参数接受两类损失更新</text>
</a>
