<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1505" viewBox="0 0 1100 1505"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#18334b}.h{font-weight:700;font-size:23px}.t{font-size:18px}.s{font-size:16px}.b{font-size:19px;font-weight:600}</style><rect width="1100" height="1505" fill="#f6f9fd"/>
<text x="34" y="42" class="h">MSCoT：离散选择动作结构，连续残差细化目标</text>
<text x="34" y="73" class="s">原创教学示意 · 依据 arXiv:2605.14935v1 正文与附录算法 1–3</text>
<rect x="24" y="98" width="1052" height="270" rx="18" fill="#edf3f9" stroke="#d3dfeb"/>
<text x="45" y="134" class="h">① 离线训练：学习通用动作先验，不使用控制目标标签</text>
<rect x="50" y="158" width="260" height="99" rx="12" fill="#fff" stroke="#b8c9d9"/>
<text x="65" y="186" class="b">真实动作 → 编码器</text>
<text x="65" y="212" class="s">时间下采样 4 倍</text>
<text x="65" y="238" class="s">64 帧 → 16 个潜位置</text>
<rect x="365" y="158" width="370" height="99" rx="12" fill="#e6efff" stroke="#b8c9d9"/>
<text x="380" y="186" class="b">多尺度残差量化</text>
<text x="380" y="212" class="s">十层：短序列 → 长序列</text>
<text x="380" y="238" class="s">共享码本：1,024 项 × 512 维</text>
<rect x="790" y="158" width="240" height="99" rx="12" fill="#fff" stroke="#b8c9d9"/>
<text x="805" y="186" class="b">各层上采样并相加</text>
<text x="805" y="212" class="s">解码器 → 重建动作</text>
<text x="805" y="238" class="s">重建 + 码本监督</text>
<polyline points="310,207 365,207" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<polyline points="735,207 790,207" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="50" y="286" width="465" height="62" rx="12" fill="#e6f4ed" stroke="#b8c9d9"/>
<text x="65" y="314" class="b">冻结 VQ 后：文本 → 逐尺度 Transformer</text>
<text x="65" y="340" class="s">真实多尺度 token 监督；学习离散分布</text>
<rect x="565" y="286" width="465" height="62" rx="12" fill="#fff3dc" stroke="#b8c9d9"/>
<text x="580" y="314" class="b">冻结 VQ 后：训练小型 refiner</text>
<text x="580" y="340" class="s">重建监督；预测码向量上的连续残差</text>
<polyline points="550,257 550,273 282,273 282,286" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<polyline points="550,273 795,273 795,286" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="24" y="388" width="1052" height="190" rx="18" fill="#edf3f9" stroke="#d3dfeb"/>
<text x="45" y="424" class="h">② 推理输入：冻结所有网络，指定文字、时域与可微目标</text>
<rect x="50" y="450" width="300" height="94" rx="12" fill="#e6f4ed" stroke="#b8c9d9"/>
<text x="65" y="478" class="b">文本条件</text>
<text x="65" y="504" class="s">CLIP 全局与词级特征</text>
<text x="65" y="530" class="s">输入下方 Transformer</text>
<rect x="400" y="450" width="300" height="94" rx="12" fill="#fff" stroke="#b8c9d9"/>
<text x="415" y="478" class="b">目标动作长度</text>
<text x="415" y="504" class="s">按比例调整各尺度长度</text>
<text x="415" y="530" class="s">例如 128 帧 → 最细 32 token</text>
<rect x="750" y="450" width="280" height="94" rx="12" fill="#fff3dc" stroke="#b8c9d9"/>
<text x="765" y="478" class="b">目标函数 G</text>
<text x="765" y="504" class="s">关节坐标 / 避障 / 场景 SDF</text>
<text x="765" y="530" class="s">在解码后的三维动作上评价</text>
<text x="52" y="565" class="s">无目标时可做普通文本生成；控制推理额外执行下方引导与最终优化。</text>
<rect x="24" y="598" width="1052" height="565" rx="18" fill="#edf3f9" stroke="#d3dfeb"/>
<text x="45" y="634" class="h">③ 从粗到细重复：用一次梯度，重加权当前整层 token</text>
<rect x="50" y="670" width="280" height="110" rx="12" fill="#e6f4ed" stroke="#b8c9d9"/>
<text x="65" y="698" class="b">逐尺度 Transformer</text>
<text x="65" y="724" class="s">文本 + 长度 + 已有粗层 prefix</text>
<text x="65" y="750" class="s">输出当前整层先验 π</text>
<text x="65" y="776" class="s">CFG 先作用于 logits</text>
<rect x="390" y="670" width="300" height="110" rx="12" fill="#e6efff" stroke="#b8c9d9"/>
<text x="405" y="698" class="b">先验平均码向量 a</text>
<text x="405" y="724" class="s">a = Σ π(v)eᵥ</text>
<text x="405" y="750" class="s">当前层所有位置同时计算</text>
<text x="405" y="776" class="s">此时是可微连续向量</text>
<rect x="750" y="670" width="280" height="110" rx="12" fill="#fff" stroke="#b8c9d9"/>
<text x="765" y="698" class="b">解码中间动作</text>
<text x="765" y="724" class="s">当前平均码上采样 / 卷积</text>
<text x="765" y="750" class="s">加上已有累积特征</text>
<text x="765" y="776" class="s">通过冻结解码器</text>
<polyline points="330,725 390,725" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<polyline points="690,725 750,725" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="750" y="845" width="280" height="110" rx="12" fill="#fff3dc" stroke="#b8c9d9"/>
<text x="765" y="873" class="b">计算目标误差</text>
<text x="765" y="899" class="s">输入：目标坐标 / 场景 SDF</text>
<text x="765" y="925" class="s">评价：中间解码的全身动作</text>
<text x="765" y="951" class="s">对平均码向量反向传播</text>
<rect x="390" y="845" width="300" height="110" rx="12" fill="#f0ebff" stroke="#b8c9d9"/>
<text x="405" y="873" class="b">局部梯度 g</text>
<text x="405" y="899" class="s">g = ∇ₐ log p(G | 动作)</text>
<text x="405" y="925" class="s">指向目标更容易满足的方向</text>
<text x="405" y="951" class="s">每尺度一次解码与反传</text>
<rect x="50" y="845" width="280" height="110" rx="12" fill="#e6efff" stroke="#b8c9d9"/>
<text x="65" y="873" class="b">近似后验 q</text>
<text x="65" y="899" class="s">q(v) ∝ π(v) exp[(eᵥ − a)ᵀg]</text>
<text x="65" y="925" class="s">码本候选沿梯度重加权</text>
<text x="65" y="951" class="s">一阶近似，不是精确硬投影</text>
<polyline points="890,780 890,845" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<polyline points="750,900 690,900" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<polyline points="390,900 330,900" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="50" y="1015" width="280" height="95" rx="12" fill="#e6efff" stroke="#b8c9d9"/>
<text x="65" y="1043" class="b">采样离散 token</text>
<text x="65" y="1069" class="s">从 q 选真实码 ID</text>
<text x="65" y="1095" class="s">查表得到向量 eₖ</text>
<rect x="390" y="1015" width="300" height="95" rx="12" fill="#fff3dc" stroke="#b8c9d9"/>
<text x="405" y="1043" class="b">训练好的 refiner</text>
<text x="405" y="1069" class="s">预测连续残差 Δeₖ</text>
<text x="405" y="1095" class="s">本层表示：eₖ + Δeₖ</text>
<rect x="750" y="1015" width="280" height="95" rx="12" fill="#fff" stroke="#b8c9d9"/>
<text x="765" y="1043" class="b">累积本层贡献</text>
<text x="765" y="1069" class="s">上采样 + 卷积 → 相加</text>
<text x="765" y="1095" class="s">离散码追加到粗层 prefix</text>
<polyline points="190,955 190,1015" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<polyline points="330,1062 390,1062" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<polyline points="690,1062 750,1062" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<polyline points="890,1110 890,1128 32,1128 32,725 50,725" fill="none" stroke="#52657b" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#a)"/>
<text x="52" y="1151" class="s">虚线：进入下一尺度；每层覆盖整段时域，并非按真实时间流式逐帧输出。</text>
<rect x="24" y="1183" width="1052" height="274" rx="18" fill="#edf3f9" stroke="#d3dfeb"/>
<text x="45" y="1219" class="h">④ 十层完成后：优化所有尺度残差，再验收最终动作</text>
<rect x="50" y="1252" width="330" height="118" rx="12" fill="#fff3dc" stroke="#b8c9d9"/>
<text x="65" y="1280" class="b">固定 token ID 与模型权重</text>
<text x="65" y="1306" class="s">仅更新 {Δe₁, …, Δe₁₀}</text>
<text x="65" y="1332" class="s">默认 200 次梯度更新，步长 0.01</text>
<text x="65" y="1358" class="s">目标误差通过解码器反传</text>
<rect x="430" y="1252" width="260" height="118" rx="12" fill="#fff" stroke="#b8c9d9"/>
<text x="445" y="1280" class="b">汇合全部尺度</text>
<text x="445" y="1306" class="s">Σ Conv1D(Up(eₖ + Δeₖ))</text>
<text x="445" y="1332" class="s">冻结解码器</text>
<text x="445" y="1358" class="s">生成最终整段动作</text>
<rect x="740" y="1252" width="290" height="118" rx="12" fill="#e6f4ed" stroke="#b8c9d9"/>
<text x="755" y="1280" class="b">检查输出是否可用</text>
<text x="755" y="1306" class="s">目标误差 / 脚滑 / 碰撞</text>
<text x="755" y="1332" class="s">未受约束部位是否漂移</text>
<text x="755" y="1358" class="s">无精确满足或动力学保证</text>
<polyline points="380,1310 430,1310" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<polyline points="690,1310 740,1310" fill="none" stroke="#52657b" stroke-width="2.3" marker-end="url(#a)"/>
<text x="52" y="1407" class="s">报告总时长 3.61 秒；末端残差优化 2.43 秒。测试 batch 32，时间归约未充分说明。</text>
<text x="52" y="1434" class="s">“无需控制专用训练”仍依赖预训练；更多优化可降低位置误差，也可能损害动作自然度。</text>
<text x="34" y="1485" class="s">边界：局部后验近似 + 可微代理目标；没有为任意场景或不可达目标提供保证。</text>
</svg>