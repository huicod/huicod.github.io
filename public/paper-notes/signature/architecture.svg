<text x="440.0" y="252" class="body" text-anchor="middle">学习身体运动先验</text>
<rect x="600" y="175" width="260" height="100" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="730.0" y="205" class="node" text-anchor="middle">BEAT2逐人微调</text>
<text x="730.0" y="230" class="body" text-anchor="middle">语音＋转录＋动作配对</text>
<text x="730.0" y="252" class="body" text-anchor="middle">每人约90分钟数据</text>
<rect x="900" y="175" width="260" height="100" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="1030.0" y="205" class="node" text-anchor="middle">个性化模型参数 θᵢ</text>
<text x="1030.0" y="230" class="body" text-anchor="middle">身份对应一个模型</text>
<text x="1030.0" y="252" class="body" text-anchor="middle">推理时固定参数</text>
