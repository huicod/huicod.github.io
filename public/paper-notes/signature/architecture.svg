<rect width="1200" height="1940" fill="#fff"/>
<text x="36" y="46" class="title" text-anchor="start">SiGnature · 让局部语义动作与个人全身风格共同生成</text>
<text x="36" y="80" class="body" text-anchor="start">教学示意 · 依据原文图2、§3–4与附录A/E/F · 外部动作只在指定关节和时间干预</text>
