<text x="40" y="315" class="body" text-anchor="start">监督：旋转重建 ＋ 100×旋转速度损失 ＋ 50×足部接触损失；CLIP文本编码器冻结。</text>
<text x="40" y="341" class="label" text-anchor="start">“新动作注入无需训练”指JMI；目标身份仍需要微调。</text>
<rect x="20" y="380" width="1160" height="375" rx="16" fill="#f6f8fb" stroke="#d5deea"/>
<text x="40" y="415" class="section" text-anchor="start">B  语义动作准备与选时：独立于生成器训练，可增添新的兼容动作</text>
<rect x="40" y="445" width="250" height="100" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="165.0" y="475" class="node" text-anchor="middle">SeG或外部动作</text>
<text x="165.0" y="500" class="body" text-anchor="middle">源动作＋名称／描述</text>
<text x="165.0" y="522" class="body" text-anchor="middle">示例与语境词典</text>
