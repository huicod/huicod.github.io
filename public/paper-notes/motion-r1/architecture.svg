<text x="418" y="2284" class="head">训练好的 Motion-R1</text>
<text x="418" y="2318" class="body">复用 C 的语言模型参数</text>
<text x="418" y="2347" class="body">先输出可读推理</text>
<text x="418" y="2376" class="body">继续预测动作 token</text>
<rect x="800" y="2250" width="430" height="145" rx="15" fill="#e8f4ed" stroke="#bdd0da" stroke-width="1.5"/>
<text x="818" y="2284" class="head">冻结 D → 连续动作</text>
<text x="818" y="2318" class="body">复用 A 的动作解码器</text>
<text x="818" y="2347" class="body">解码完整 token 序列</text>
<text x="818" y="2376" class="body">可读计划不等于硬保持／硬执行</text>
