<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1720" role="img" aria-label="Cont-Gest训练、推理与评价完整教学架构"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526174"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#203047}.title{font-size:28px;font-weight:700}.section{font-size:23px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.line{fill:none;stroke:#526174;stroke-width:2.2;marker-end:url(#arr)}.dashed{stroke-dasharray:7 5}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="44" class="title">Cont-Gest｜可选择的属性控制 → 语音手势 → 输出再测量</text><rect x="30" y="80" width="1220" height="355" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="113" class="section">A · 训练：从配对资料提取控制，学习“开启”和“未指定”</text><rect x="55" y="140" width="335" height="130" rx="10" fill="#fff" stroke="#aab9cc"/><text x="69" y="170" class="head">GENEA 2023 · 约18小时</text><text x="69" y="198" class="body">音频：去偏移、归一化、降噪</text><text x="69" y="224" class="body">动作：平滑，转为6D关节旋转</text><text x="69" y="250" class="body">配对语音与动作，不需动作文本</text><rect x="430" y="140" width="345" height="130" rx="10" fill="#fff" stroke="#aab9cc"/><text x="444" y="170" class="head">从动作直接计算</text><text x="444" y="198" class="body">左右手高度与速度</text><text x="444" y="224" class="body">活动范围radius、双手协同值</text><text x="444" y="250" class="body">不是人工动作事件标签</text><rect x="815" y="140" width="410" height="130" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="829" y="170" class="head">外部预训练语音提取器</text><text x="829" y="198" class="body">VAD；逐时刻情绪；年龄／类别</text><text x="829" y="224" class="body">只作为弱控制信号</text><text x="829" y="250" class="body">未报告与生成器联合微调</text><path d="M390 180H430" class="line"/><text x="394" y="168" class="small">动作</text><path d="M220 270V300H1020V270" class="line"/><text x="815" y="291" class="small">音频送入外部模型</text><rect x="55" y="335" width="550" height="75" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="365" class="head">两种控制掩码训练</text><text x="69" y="393" class="body">single-mask：关一个；single-control：只留一个</text><rect x="665" y="335" width="560" height="75" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="679" y="365" class="head">训练生成器 · 约6.8M可训练参数</text><text x="679" y="393" class="body">60×动作Huber ＋ 0.005×差分速度Huber</text><path d="M605 374H665" class="line"/><path d="M610 270V315H330V335" class="line"/><text x="60" y="322" class="small">控制值与关闭标记−2</text><path d="M1020 270V315H330V335" class="line"/><text x="50" y="465" class="small">真实动作监督损失；预训练提取器仅构造条件。下方展示训练后生成网络的数据流。</text><rect x="30" y="495" width="1220" height="800" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="528" class="section">B · 推理：语音条件＋可选属性，融合后驱动动作解码</text><rect x="55" y="565" width="240" height="110" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="595" class="head">语音录音</text><text x="69" y="623" class="body">连续声学信号</text><text x="69" y="649" class="body">不输入动作指令文本</text><rect x="335" y="565" width="290" height="110" rx="10" fill="#fff" stroke="#aab9cc"/><text x="349" y="595" class="head">声学前处理</text><text x="349" y="623" class="body">16kHz → 80通道log-Mel</text><text x="349" y="649" class="body">100fps → 30fps对齐</text><rect x="665" y="565" width="250" height="110" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="679" y="595" class="head">音频编码器</text><text x="679" y="623" class="body">2×Conv1D＋GELU</text><text x="679" y="649" class="body">Transformer编码</text><path d="M295 620H335" class="line"/><path d="M625 620H665" class="line"/><rect x="55" y="730" width="240" height="130" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="760" class="head">用户控制／开关</text><text x="69" y="788" class="body">手高、手速、范围等</text><text x="69" y="814" class="body">可选情绪／年龄弱标签</text><text x="69" y="840" class="body">未指定项关闭</text><rect x="335" y="730" width="290" height="130" rx="10" fill="#fff" stroke="#aab9cc"/><text x="349" y="760" class="head">准备时间控制曲线</text><text x="349" y="788" class="body">正常值预处理；关闭用−2</text><text x="349" y="814" class="body">固定／正态采样／VAD缩放</text><text x="349" y="840" class="body">三种动态方式分别比较</text><rect x="665" y="730" width="250" height="130" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="679" y="760" class="head">Control Fusion</text><text x="679" y="788" class="body">FiLM：γ(z)⊙x＋β(z)</text><text x="679" y="814" class="body">或Concat／AdaIN</text><text x="679" y="840" class="body">位于编码器之后</text><path d="M295 790H335" class="line"/><path d="M625 790H665" class="line"/><path d="M790 675V730" class="line"/><text x="800" y="709" class="small">编码特征 x</text><path d="M335 620H315V700H480V730" class="line"/><text x="350" y="691" class="small">音频→VAD提取→可选缩放</text><rect x="955" y="730" width="270" height="205" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="969" y="760" class="head">动作解码器</text><text x="969" y="788" class="body">masked self-attention</text><text x="969" y="814" class="body">＋条件cross-attention</text><text x="969" y="840" class="body">＋前馈与LayerNorm</text><text x="969" y="866" class="body">线性投影到动作表示</text><text x="969" y="892" class="body">3层、4头、宽度256</text><path d="M915 790H955" class="line"/><text x="916" y="777" class="small">条件</text><path d="M945 410V480H1238V705H1090V730" class="line dashed"/><text x="1040" y="470" class="small">训练后复用权重</text><rect x="55" y="990" width="240" height="100" rx="10" fill="#fff" stroke="#aab9cc"/><text x="69" y="1020" class="head">初始姿态</text><text x="69" y="1048" class="body">评估使用训练集均值</text><text x="69" y="1074" class="body">保持不同实验起点一致</text><rect x="335" y="990" width="290" height="100" rx="10" fill="#fff" stroke="#aab9cc"/><text x="349" y="1020" class="head">动作历史条件</text><text x="349" y="1048" class="body">已有运动序列／此前输出</text><text x="349" y="1074" class="body">按图4的因果注意力路径</text><rect x="955" y="990" width="270" height="100" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="969" y="1020" class="head">生成动作序列</text><text x="969" y="1048" class="body">30fps · 6D关节旋转</text><text x="969" y="1074" class="body">总特征维度原文未明确</text><path d="M295 1040H335" class="line"/><path d="M625 1040H650V900H935V870H955" class="line"/><text x="675" y="922" class="small">历史运动</text><path d="M1090 935V990" class="line"/><text x="1102" y="972" class="small">预测</text><path d="M1090 1090V1140H480V1090" class="line"/><text x="565" y="1168" class="small">输出反馈为历史；完整滚动解码细节未公开</text><rect x="55" y="1200" width="1170" height="65" rx="10" fill="#fff" stroke="#aab9cc"/><text x="69" y="1230" class="head">恢复骨架并用BVH观看；输出是运动表示，未包含角色网格、精准空间目标或接触求解</text><path d="M1225 1040H1238V1230H1225" class="line"/><rect x="30" y="1330" width="1220" height="315" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="1363" class="section">C · 离线评估与开发反馈：判断控制响应与动作分布的取舍</text><rect x="55" y="1400" width="350" height="130" rx="10" fill="#fff" stroke="#aab9cc"/><text x="69" y="1430" class="head">控制响应检查</text><text x="69" y="1458" class="body">输入15%／50%／85%分位</text><text x="69" y="1484" class="body">重新计算输出手高、手速等</text><text x="69" y="1510" class="body">检查方向、非单调与未控属性</text><rect x="445" y="1400" width="350" height="130" rx="10" fill="#fff" stroke="#aab9cc"/><text x="459" y="1430" class="head">动作质量代理</text><text x="459" y="1458" class="body">6D旋转 → Kinetic特征</text><text x="459" y="1484" class="body">与参考分布算Hellinger距离</text><text x="459" y="1510" class="body">Kin–Hel越低越好</text><rect x="835" y="1400" width="390" height="130" rx="10" fill="#fff" stroke="#aab9cc"/><text x="849" y="1430" class="head">研究者选择配置</text><text x="849" y="1458" class="body">Streamlit＋ThreeJS观看</text><text x="849" y="1484" class="body">对照指标与视觉反馈</text><text x="849" y="1510" class="body">不是运行时约束优化器</text><path d="M405 1465H425V1555H815V1500H835" class="line"/><path d="M795 1465H835" class="line"/><path d="M1238 1230V1380H230V1400" class="line"/><text x="725" y="1320" class="small">同一生成动作，分别测响应和分布</text><path d="M620 1380V1400" class="line"/><path d="M1030 1530V1580H230V1530" class="line dashed"/><text x="335" y="1610" class="small">反馈：比较掩码、融合、动态方式，必要时重新训练</text><text x="40" y="1680" class="small">依据：原文图1、图4，§3–5。实线为数据流；虚线为参数复用或开发反馈。</text><text x="40" y="1705" class="small">控制曲线是软条件；更低分布距离 ≠ 更精准的控制，也不证明同部位冲突已解决。</text></svg>