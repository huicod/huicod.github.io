<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3350" viewBox="0 0 1600 3350" role="img" aria-labelledby="title desc"><title id="title">DuetGen双人舞蹈训练与推理完整架构</title><desc id="desc">推理从音乐先掩码生成粗级双人token，再条件化生成细级token，音乐同时条件化连续动作解码。根轨迹网络预测A的帧间位移与B相对A的位置。下方训练区展示双人统一表示、层级VQ、两级掩码监督和轨迹训练。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#486579"/></marker></defs><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#193246}.title{font-size:36px;font-weight:700}.head{font-size:26px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.box{stroke:#9db3c3;stroke-width:2}.edge{fill:none;stroke:#486579;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}</style><rect width="1600" height="3350" fill="#fff"/>
<text x="50" y="62" class="title">DuetGen · 从音乐同时编排两位舞者</text>
<text x="50" y="106" class="small">教学重绘｜原图2–3、式1–10｜蓝：推理；绿：训练；虚线：训练后复用</text>
<rect x="30" y="140" width="1540" height="1820" rx="24" fill="#f4f8fc" stroke="#d5e1ee"/>
<text x="55" y="186" class="head">推理：先完成粗级，再完成细级；每一级内部是整段并行预测与重掩码</text>
<g class="node"><rect class="box" x="55" y="240" width="450" height="200" rx="16" fill="#eaf2fc"/>
<text x="73" y="279" class="head">输入音乐 → 音乐编码 Eᴹ</text>
<text x="73" y="319" class="body">MFCC + 差分 + Chroma</text>
<text x="73" y="350" class="body">与动作时间对齐的连续特征</text>
<text x="73" y="381" class="body">音乐分别进入两级生成与解码</text>
<text x="73" y="412" class="body">标准生成不输入真实舞伴动作</text>
</g>
<g class="node"><rect class="box" x="650" y="240" width="850" height="200" rx="16" fill="#eaf2fc"/>
<text x="668" y="279" class="head">顶层掩码 Transformer θᵀ</text>
<text x="668" y="319" class="body">初始化：N / ηᵀ 个 [MASK]，表示双人整体</text>
<text x="668" y="350" class="body">音乐条件 + 双向token上下文 → 并行预测与采样</text>
<text x="668" y="381" class="body">按余弦计划重掩码低置信位置；保留其余位置</text>
<text x="668" y="412" class="body">重复 Lᵀ 轮，直到整段粗级token完成</text>
</g>
<path class="edge" d="M505 330 H650"/>
<path class="edge" d="M1500 380 H1530 V220 H1080 V240"/>
<g class="node"><rect class="box" x="650" y="510" width="850" height="140" rx="16" fill="#eaf2fc"/>
<text x="668" y="549" class="head">完整粗级token序列 tᵀ</text>
<text x="668" y="589" class="body">较稀疏的学习式运动表示；每个token共同涉及两人</text>
<text x="668" y="620" class="body">没有逐token舞步文字标签，也不是显式低频信号</text>
</g>
<path class="edge" d="M1075 440 V510"/>
<g class="node"><rect class="box" x="650" y="720" width="850" height="200" rx="16" fill="#eaf2fc"/>
<text x="668" y="759" class="head">底层掩码 Transformer θᴮ</text>
<text x="668" y="799" class="body">初始化：N / ηᴮ 个 [MASK]，ηᵀ &gt; ηᴮ</text>
<text x="668" y="830" class="body">条件：音乐 + 已完成粗级token + 细级上下文</text>
<text x="668" y="861" class="body">并行预测；重掩码低置信位置，迭代 Lᴮ 轮</text>
<text x="668" y="892" class="body">两级之间有先后，时间位置之间不是逐帧自回归</text>
</g>
<path class="edge" d="M1075 650 V720"/>
<path class="edge" d="M1500 850 H1530 V700 H1300 V720"/>
<g class="node"><rect class="box" x="650" y="990" width="850" height="140" rx="16" fill="#eaf2fc"/>
<text x="668" y="1029" class="head">完整细级token序列 tᴮ</text>
<text x="668" y="1069" class="body">在更密时间网格表达补充细节；仍是双人联合编码</text>
<text x="668" y="1100" class="body">不存在“一条流是A、另一条流是B”的划分</text>
</g>
<path class="edge" d="M1075 920 V990"/>
<g class="node"><rect class="box" x="650" y="1210" width="850" height="200" rx="16" fill="#eaf2fc"/>
<text x="668" y="1249" class="head">码本查表 → 双人连续动作解码器 D</text>
<text x="668" y="1289" class="body">粗级上采样并与细级特征拼接，另加入音乐 zᵐ</text>
<text x="668" y="1320" class="body">输出联合536维动作特征：姿态、局部运动、根关系</text>
<text x="668" y="1351" class="body">x̂ = D(zᵀ, zᴮ, zᵐ)</text>
<text x="668" y="1382" class="body">这里是层级特征融合，不是低频／高频位置相加</text>
</g>
<path class="edge" d="M1075 1130 V1210"/>
<path class="edge" d="M1500 580 H1550 V1310 H1500"/>
<text x="1225" y="1180" class="small">粗级也直达解码</text>
<path class="edge" d="M505 370 H560 V810 H650"/>
<path class="edge" d="M560 810 V1310 H650"/>
<text x="55" y="570" class="head">音乐条件的两条用途</text>
<text x="55" y="615" class="body">① 决定要生成哪些运动token</text>
<text x="55" y="652" class="body">② 帮助连续动作解码与重建</text>
<g class="node"><rect class="box" x="55" y="750" width="450" height="200" rx="16" fill="#f0eafa"/>
<text x="73" y="789" class="head">关系表示贯穿两级</text>
<text x="73" y="829" class="body">A：自身前后帧的根平移差</text>
<text x="73" y="860" class="body">B：同帧相对A的根位置差</text>
<text x="73" y="891" class="body">两人全局根朝向 + 局部姿态</text>
<text x="73" y="922" class="body">关系来自联合学习，非接触求解</text>
</g>
<g class="node"><rect class="box" x="650" y="1490" width="850" height="200" rx="16" fill="#eaf2fc"/>
<text x="668" y="1529" class="head">根轨迹修正网络</text>
<text x="668" y="1569" class="body">输入：两人生成的局部动作与根朝向等非根平移特征</text>
<text x="668" y="1600" class="body">输出：A的帧间根位移 + B对A的同帧根偏移</text>
<text x="668" y="1631" class="body">替换原根通道；积分A，再由相对偏移恢复B</text>
<text x="668" y="1662" class="body">训练得到的回归器；没有碰撞／接触约束投影</text>
</g>
<path class="edge" d="M1075 1410 V1490"/>
<g class="node"><rect class="box" x="650" y="1770" width="850" height="140" rx="16" fill="#eaf2fc"/>
<text x="668" y="1809" class="head">输出：同一世界坐标中的两人连续舞蹈</text>
<text x="668" y="1849" class="body">根积分原点与体形用于场景导出，不是首帧姿态控制</text>
<text x="668" y="1880" class="body">协调质量需评估；不保证指定牵手、支撑或无滑步</text>
</g>
<path class="edge" d="M1075 1690 V1770"/>
<rect x="30" y="2010" width="1540" height="1290" rx="24" fill="#f1f8f2" stroke="#c4dbcd"/>
<text x="55" y="2058" class="head">训练 A：联合双人层级量化；粗细是时间分辨率，不是显式频带</text>
<g class="node"><rect class="box" x="55" y="2120" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="73" y="2159" class="head">真实双人动作 x：每帧536维</text>
<text x="73" y="2199" class="body">A自身根位移 + B对A相对偏移</text>
<text x="73" y="2230" class="body">各自全局根朝向、局部位置／旋转</text>
<text x="73" y="2261" class="body">局部速度与足地接触指示</text>
<text x="73" y="2292" class="body">首帧规范化；可交换A／B增强</text>
</g>
<g class="node"><rect class="box" x="565" y="2120" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="583" y="2159" class="head">底层编码器 Eᴮ</text>
<text x="583" y="2199" class="body">读取整个双人特征</text>
<text x="583" y="2230" class="body">1D卷积获得较密的时序表示</text>
<text x="583" y="2261" class="body">时间长度 N / ηᴮ</text>
<text x="583" y="2292" class="body">一支继续向粗级，一支保留细节</text>
</g>
<g class="node"><rect class="box" x="1075" y="2120" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="1093" y="2159" class="head">顶层编码器 Eᵀ + 量化 Qᵀ</text>
<text x="1093" y="2199" class="body">进一步下采样至 N / ηᵀ</text>
<text x="1093" y="2230" class="body">最近邻查找独立顶层码本</text>
<text x="1093" y="2261" class="body">形成粗级向量 zᵀ 与索引 tᵀ</text>
<text x="1093" y="2292" class="body">训练EMA更新与码本重置</text>
</g>
<path class="edge" d="M525 2215 H565"/>
<path class="edge" d="M1035 2215 H1075"/>
<g class="node"><rect class="box" x="1075" y="2390" width="470" height="170" rx="16" fill="#e5f2e7"/>
<text x="1093" y="2429" class="head">顶层解码 Dᵀ：时间上采样</text>
<text x="1093" y="2469" class="body">恢复到 N / ηᴮ 的特征长度</text>
<text x="1093" y="2500" class="body">粗级上下文送入底层量化</text>
<text x="1093" y="2531" class="body">不是把离散索引当数值插值</text>
</g>
<path class="edge" d="M1310 2320 V2390"/>
<g class="node"><rect class="box" x="565" y="2390" width="470" height="170" rx="16" fill="#e5f2e7"/>
<text x="583" y="2429" class="head">结合细特征 → 底层量化 Qᴮ</text>
<text x="583" y="2469" class="body">Eᴮ(x) 与上采样粗级特征</text>
<text x="583" y="2500" class="body">经独立底层码本得到 zᴮ / tᴮ</text>
<text x="583" y="2531" class="body">细级学习补充粗级的信息</text>
</g>
<path class="edge" d="M800 2320 V2390"/>
<path class="edge" d="M1075 2470 H1035"/>
<g class="node"><rect class="box" x="55" y="2390" width="470" height="170" rx="16" fill="#e5f2e7"/>
<text x="73" y="2429" class="head">配对音乐 → 音乐编码 Eᴹ</text>
<text x="73" y="2469" class="body">MFCC、差分和Chroma</text>
<text x="73" y="2500" class="body">连续音乐条件 zᵐ</text>
<text x="73" y="2531" class="body">直接进入VQ动作解码器</text>
</g>
<g class="node"><rect class="box" x="565" y="2650" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="583" y="2689" class="head">音乐条件动作解码 D</text>
<text x="583" y="2729" class="body">粗级 + 细级量化向量 + 音乐</text>
<text x="583" y="2760" class="body">对齐时间并融合，恢复双人 x̂</text>
<text x="583" y="2791" class="body">训练时端到端学习量化与重建</text>
<text x="583" y="2822" class="body">训练好的解码器在推理时复用</text>
</g>
<path class="edge" d="M800 2560 V2650"/>
<path class="edge" d="M525 2470 H545 V2750 H565"/>
<path class="edge" d="M1545 2215 H1560 V2615 H1048 V2750 H1035"/>
<g class="node"><rect class="box" x="1075" y="2650" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="1093" y="2689" class="head">重建与互动监督</text>
<text x="1093" y="2729" class="body">特征／差分 + commitment</text>
<text x="1093" y="2760" class="body">正向运动学后的世界关节误差</text>
<text x="1093" y="2791" class="body">跨人关节距离：近邻更重</text>
<text x="1093" y="2822" class="body">末端关节加权；属于软损失</text>
</g>
<path class="edge" d="M1035 2800 H1075"/>
<g class="node"><rect class="box" x="55" y="2940" width="710" height="240" rx="16" fill="#e5f2e7"/>
<text x="73" y="2979" class="head">训练 B：冻结量化器，学习两级掩码模型</text>
<text x="73" y="3019" class="body">真实 tᵀ 随机遮挡 + 音乐 → 顶层交叉熵</text>
<text x="73" y="3050" class="body">真实 tᴮ 遮挡 + 音乐 + tᵀ → 底层交叉熵</text>
<text x="73" y="3081" class="body">10%去掉音乐条件以训练CFG</text>
<text x="73" y="3112" class="body">代码另含部分预测粗级条件；正文折叠说明</text>
<text x="73" y="3143" class="body">训练好的 θᵀ、θᴮ 在推理迭代中复用</text>
</g>
<g class="node"><rect class="box" x="815" y="2940" width="730" height="240" rx="16" fill="#e5f2e7"/>
<text x="833" y="2979" class="head">训练 C：根轨迹回归器</text>
<text x="833" y="3019" class="body">真实局部动作和根朝向 → 根通道预测</text>
<text x="833" y="3050" class="body">监督A的移动、B的相对位置及重建轨迹</text>
<text x="833" y="3081" class="body">推理时改读生成的局部动作</text>
<text x="833" y="3112" class="body">只学习根运动修正，不解算受力／接触</text>
<text x="833" y="3143" class="body">音乐和两个掩码模型不在此重新训练</text>
</g>
<path class="edge dash" d="M55 3010 H12 V460 H610 V410 H650"/>
<path class="edge dash" d="M55 3070 H25 V965 H610 V890 H650"/>
<path class="edge dash" d="M565 2780 H40 V1360 H650"/>
<path class="edge dash" d="M1545 3070 H1590 V1590 H1500"/>
<text x="55" y="3245" class="body">教学图按论文主机制绘制；具体代码采样轮数与下采样配置单独说明，未运行模型。</text>
</svg>