<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1420" viewBox="0 0 1080 1420" role="img" aria-labelledby="title desc">
<title id="title">FiGMo · 给每帧姿态配上一个真实时刻</title><desc id="desc">空间编码器先经遮挡重建预训练，再用姿态和动作语言监督训练问答模型。推理时姿态向量和实际秒位置交错输入，视频为可选通道。</desc>
<defs><marker id="end" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#3c6370"/></marker><marker id="sup" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#976120"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#193c47} .title{font-size:36px;font-weight:700} .sub{font-size:21px;fill:#466471} .stage{font-size:28px;font-weight:700} .num{font-size:20px;fill:#fff;font-weight:700} .name{font-size:25px;font-weight:700} .field{font-size:22px} .tag{font-size:20px;fill:#3d5863} .e{fill:none;stroke:#3c6370;stroke-width:3;stroke-linejoin:round;marker-end:url(#end)} .s{fill:none;stroke:#976120;stroke-width:3;stroke-dasharray:7 5;stroke-linejoin:round;marker-end:url(#sup)} </style>
<rect width="1080" height="1420" rx="20" fill="#f4f7f6"/>
<text x="35" y="54" class="title" text-anchor="start">FiGMo · 给每帧姿态配上一个真实时刻</text>
<text x="37" y="94" class="sub" text-anchor="start">逐帧编码保留身体构型，语言模型沿时间读序列，输出问答或字幕。</text>
<path d="M39 129h55" class="e"/>
<text x="109" y="137" class="tag" text-anchor="start">数据流</text>
<path d="M246 129h55" class="s"/>
<text x="315" y="137" class="tag" text-anchor="start">训练监督</text>
<text x="512" y="137" class="tag" text-anchor="start">蓝：输入　绿：运算　黄：监督　紫：输出</text>
<rect x="18" y="165" width="1044" height="313" rx="15" fill="#fff" stroke="#c4d2d0" stroke-width="1.6"/>
<rect x="40" y="185" width="47" height="37" rx="8" fill="#356e68" stroke="#356e68" stroke-width="1.6"/>
<text x="63" y="211" class="num" text-anchor="middle">01</text>
<text x="103" y="215" class="stage" text-anchor="start">几何预训练　用同一套空间编码器处理 3D 与 2D</text>
<rect x="42" y="255" width="275" height="140" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="179.5" y="302.5" class="name" text-anchor="middle">遮挡、扰动关节</text>
<text x="179.5" y="333.5" class="field" text-anchor="middle">3D 坐标或 2D 检测</text>
<text x="179.5" y="364.5" class="field" text-anchor="middle">按单帧输入</text>
<rect x="391" y="255" width="284" height="140" rx="12" fill="#e0efeb" stroke="#88aa9f" stroke-width="1.6"/>
<text x="533.0" y="302.5" class="name" text-anchor="middle">空间姿态编码器</text>
<text x="533.0" y="333.5" class="field" text-anchor="middle">同一帧内关节间注意</text>
<text x="533.0" y="364.5" class="field" text-anchor="middle">预训练头恢复 3D</text>
<rect x="749" y="244" width="285" height="82" rx="12" fill="#fff0d7" stroke="#c3a06c" stroke-width="1.6"/>
<text x="891.5" y="278.0" class="name" text-anchor="middle">有 3D 标注</text>
<text x="891.5" y="309.0" class="field" text-anchor="middle">预测与真值比较</text>
<rect x="749" y="347" width="285" height="82" rx="12" fill="#fff0d7" stroke="#c3a06c" stroke-width="1.6"/>
<text x="891.5" y="381.0" class="name" text-anchor="middle">仅有 2D 观测</text>
<text x="891.5" y="412.0" class="field" text-anchor="middle">重投影，与 2D 比较</text>
<path d="M317 325H387" class="e"/>
<path d="M675 305H711V285H745" class="s"/>
<path d="M675 351H711V388H745" class="s"/>
<rect x="18" y="498" width="1044" height="504" rx="15" fill="#fff" stroke="#c4d2d0" stroke-width="1.6"/>
<rect x="40" y="518" width="47" height="37" rx="8" fill="#356e68" stroke="#356e68" stroke-width="1.6"/>
<text x="63" y="544" class="num" text-anchor="middle">02</text>
<text x="103" y="548" class="stage" text-anchor="start">问答路径　3D 动作本身提供哪些信息？</text>
<rect x="42" y="592" width="258" height="94" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="171.0" y="632.0" class="name" text-anchor="middle">逐帧关节构型</text>
<text x="171.0" y="663.0" class="field" text-anchor="middle">独立编码每一帧</text>
<rect x="390" y="592" width="295" height="94" rx="12" fill="#e0efeb" stroke="#88aa9f" stroke-width="1.6"/>
<text x="537.5" y="632.0" class="name" text-anchor="middle">姿态编码器＋MLP</text>
<text x="537.5" y="663.0" class="field" text-anchor="middle">映射为 LLM 的姿态向量</text>
<rect x="757" y="592" width="277" height="94" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="895.5" y="632.0" class="name" text-anchor="middle">相对片头的秒数</text>
<text x="895.5" y="663.0" class="field" text-anchor="middle">与姿态交错排列</text>
<path d="M300 639H386" class="e"/>
<rect x="390" y="788" width="295" height="114" rx="12" fill="#e0efeb" stroke="#88aa9f" stroke-width="1.6"/>
<text x="537.5" y="822.5" class="name" text-anchor="middle">VideoLLaMA3-7B</text>
<text x="537.5" y="853.5" class="field" text-anchor="middle">读姿态、时间和问题</text>
<text x="537.5" y="884.5" class="field" text-anchor="middle">可再接入视频特征</text>
<path d="M538 686V784" class="e"/>
<path d="M896 686V737H623V784" class="e"/>
<rect x="42" y="747" width="258" height="76" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="171.0" y="778.0" class="name" text-anchor="middle">用户问题</text>
<text x="171.0" y="809.0" class="field" text-anchor="middle">如“何时投球？”</text>
<rect x="42" y="848" width="258" height="76" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="171.0" y="879.0" class="name" text-anchor="middle">可选 · 视频</text>
<text x="171.0" y="910.0" class="field" text-anchor="middle">经视觉编码器</text>
<path d="M300 785H341V818H386" class="e"/>
<path d="M300 886H341V875H386" class="e"/>
<rect x="757" y="788" width="277" height="114" rx="12" fill="#edeaf5" stroke="#afa4c5" stroke-width="1.6"/>
<text x="895.5" y="822.5" class="name" text-anchor="middle">语言输出</text>
<text x="895.5" y="853.5" class="field" text-anchor="middle">时间／身体部位</text>
<text x="895.5" y="884.5" class="field" text-anchor="middle">或多个区间与字幕</text>
<path d="M685 845H753" class="e"/>
<text x="43" y="961" class="sub" text-anchor="start">抽帧后仍用原秒数。图 2 的 2.4 秒是一个回答示意，未量化出手时间误差。</text>
<rect x="18" y="1022" width="1044" height="336" rx="15" fill="#fff" stroke="#c4d2d0" stroke-width="1.6"/>
<rect x="40" y="1042" width="47" height="37" rx="8" fill="#356e68" stroke="#356e68" stroke-width="1.6"/>
<text x="63" y="1068" class="num" text-anchor="middle">03</text>
<text x="103" y="1072" class="stage" text-anchor="start">语言监督　由姿态描述到跨帧时间问答</text>
<rect x="42" y="1112" width="283" height="133" rx="12" fill="#fff0d7" stroke="#c3a06c" stroke-width="1.6"/>
<text x="183.5" y="1156.0" class="name" text-anchor="middle">姿态及姿态对</text>
<text x="183.5" y="1187.0" class="field" text-anchor="middle">PoseScript / PoseFix</text>
<text x="183.5" y="1218.0" class="field" text-anchor="middle">问位置、比较弯曲度</text>
<rect x="399" y="1112" width="283" height="133" rx="12" fill="#fff0d7" stroke="#c3a06c" stroke-width="1.6"/>
<text x="540.5" y="1156.0" class="name" text-anchor="middle">运动片段与整段</text>
<text x="540.5" y="1187.0" class="field" text-anchor="middle">BABEL 区间、FTM-QA</text>
<text x="540.5" y="1218.0" class="field" text-anchor="middle">问先后、持续时间</text>
<rect x="748" y="1112" width="286" height="133" rx="12" fill="#e0efeb" stroke="#88aa9f" stroke-width="1.6"/>
<text x="891.0" y="1156.0" class="name" text-anchor="middle">对齐与任务微调</text>
<text x="891.0" y="1187.0" class="field" text-anchor="middle">先冻结 LLM 做对齐</text>
<text x="891.0" y="1218.0" class="field" text-anchor="middle">再以 LoRA 适配 LLM</text>
<path d="M325 1245V1280H818V1249" class="s"/>
<path d="M682 1178H744" class="s"/>
<text x="43" y="1323" class="sub" text-anchor="start">训练材料可以分阶段加入；表 4 的同数据单阶段模型用来检验训练次序。</text>
<text x="37" y="1397" class="tag" text-anchor="start">依据论文图 2–3、§3.1–3.4、表 4 及附录 B；布局为教学重绘。</text>
</svg>
