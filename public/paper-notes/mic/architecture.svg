<text x="290.0" y="1292" class="body" text-anchor="middle">减小误差的步级引导</text>
<path d="M 290 1050 L 290 1090" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 290 1195 L 290 1235" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 920 860 L 920 884 L 575 884 L 575 936 L 290 936 L 290 955" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660" y="955" width="500" height="95" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="910.0" y="985" class="node" text-anchor="middle">共享 M＝16 个噪声候选</text>
<text x="910.0" y="1012" class="body" text-anchor="middle">q高斯提议 → 候选下一步状态 ηᵐ</text>
<rect x="660" y="1090" width="500" height="105" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="910.0" y="1120" class="node" text-anchor="middle">候选干净运动 ẑTᵐ</text>
<text x="910.0" y="1147" class="body" text-anchor="middle">复用冻结MDM＋Tweedie估计</text>
<text x="910.0" y="1171" class="body" text-anchor="middle">每个候选恢复可评价的运动</text>
<rect x="660" y="1235" width="500" height="95" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="910.0" y="1265" class="node" text-anchor="middle">规则／黑盒模拟判据 Eₖ</text>
<text x="910.0" y="1292" class="body" text-anchor="middle">碰撞／足滑／任务成功／可跟踪性</text>
<rect x="660" y="1370" width="500" height="80" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="910.0" y="1400" class="node" text-anchor="middle">判据控制方向 uₖ</text>
<text x="910.0" y="1427" class="body" text-anchor="middle">得分×重要性修正 → 加权噪声</text>
<path d="M 910 1050 L 910 1090" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 910 1195 L 910 1235" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
