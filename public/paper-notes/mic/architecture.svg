<path d="M 920 860 L 920 874 L 16 874 L 16 1632 L 40 1632" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path d="M 1195 1282 L 1195 1660 L 1160 1660" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="660" y="1760" width="500" height="100" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="910.0" y="1790" class="node" text-anchor="middle">注入控制，完成下一采样步</text>
<text x="910.0" y="1817" class="body" text-anchor="middle">先验去噪＋合成控制 u → zₜ₊₁</text>
<text x="910.0" y="1841" class="body" text-anchor="middle">所有控制范围外额外引导为0</text>
<rect x="40" y="1760" width="500" height="100" rx="10" fill="#fff" stroke="#a9b8ca" stroke-width="1.5"/>
<text x="290.0" y="1790" class="node" text-anchor="middle">循环直至整段采样完成</text>
<text x="290.0" y="1817" class="body" text-anchor="middle">每步重新预测、评价、调权与分配</text>
<text x="290.0" y="1841" class="body" text-anchor="middle">默认每步只做一次内部协调</text>
<path d="M 910 1690 L 910 1760" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 660 1810 L 540 1810" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 40 1810 L 27 1810 L 27 807 L 40 807" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="40" y="1890" class="label" text-anchor="start">合成控制只改变当前采样步；不保证未选关节逐帧不变，也不保证互斥条件同时满足。</text>
<rect x="20" y="1940" width="1160" height="250" rx="16" fill="#f6f8fb" stroke="#d5deea"/>
<text x="40" y="1975" class="section" text-anchor="start">E  生成结果与独立验收：动作轨迹不是物理执行成功证书</text>
<rect x="40" y="2005" width="330" height="105" rx="10" fill="#fff" stroke="#a9b8ca" stroke-width="1.5"/>
<text x="205.0" y="2035" class="node" text-anchor="middle">完成去噪：运动序列</text>
<text x="205.0" y="2062" class="body" text-anchor="middle">沿原模型表示恢复关节轨迹</text>
<text x="205.0" y="2086" class="body" text-anchor="middle">文本语义＋控制后的整段动作</text>
<rect x="430" y="2005" width="330" height="105" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="595.0" y="2035" class="node" text-anchor="middle">任务验收与质量评测</text>
<text x="595.0" y="2062" class="body" text-anchor="middle">控制误差／失败比例</text>
<text x="595.0" y="2086" class="body" text-anchor="middle">足滑／最大关节加速度</text>
<rect x="820" y="2005" width="340" height="105" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="990.0" y="2035" class="node" text-anchor="middle">MuJoCo跟踪检验／展示</text>
<text x="990.0" y="2062" class="body" text-anchor="middle">复用预训练人体控制器</text>
<text x="990.0" y="2086" class="body" text-anchor="middle">可跟踪且完成目标才算Pass</text>
<path d="M 40 1840 L 32 1840 L 32 2057 L 40 2057" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 370 2057 L 430 2057" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 370 2084 L 395 2084 L 395 2140 L 990 2140 L 990 2110" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="2170" class="label" text-anchor="start">分支说明：仿真既可作为C2可选评价器，也用于最终检验；具体任务与评价预算须分别核对。</text>
<text x="40" y="2230" class="body" text-anchor="start">蓝：复用冻结模型　绿：无需训练的计算　橙：外部规格／评价　虚线：参数复用／反馈</text>
<text x="40" y="2262" class="label" text-anchor="start">目标是偏向低违规动作的软后验；有限采样与近似控制不构成逐样本硬约束保证。</text>
</svg>
