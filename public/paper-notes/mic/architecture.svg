<path d="M 595 615 L 595 665 L 8 665 L 8 1002 L 40 1002" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path d="M 595 615 L 595 665 L 1195 665 L 1195 1282 L 1160 1282" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="40" y="1420" class="label" text-anchor="start">C2可接入仿真反馈；并非只在最后检查。</text>
<text x="40" y="1450" class="label" text-anchor="start">候选共享；各约束分别计算自己的得分与方向。</text>
<rect x="20" y="1510" width="1160" height="400" rx="16" fill="#fffaf2" stroke="#d5deea"/>
<text x="40" y="1545" class="section" text-anchor="start">D  约束协调：反馈决定多强，作用域决定改哪里</text>
<rect x="40" y="1575" width="500" height="115" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="290.0" y="1605" class="node" text-anchor="middle">反馈调权 Wₖ</text>
<text x="290.0" y="1632" class="body" text-anchor="middle">干净预测的违规量 → EMA归一化</text>
<text x="290.0" y="1656" class="body" text-anchor="middle">W ← clip(W＋γc, 0, Wmax)</text>
<text x="290.0" y="1680" class="body" text-anchor="middle">持续违规累加；满足后保持</text>
<rect x="660" y="1575" width="500" height="115" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="910.0" y="1605" class="node" text-anchor="middle">关节—时间控制分配</text>
<text x="910.0" y="1632" class="body" text-anchor="middle">输入：uₖ、Wₖ、外部掩码 Mₖ</text>
<text x="910.0" y="1656" class="body" text-anchor="middle">按Wₖ²加权的正则最小二乘</text>
<text x="910.0" y="1680" class="body" text-anchor="middle">重叠通道求折中，λ限制幅度</text>
<path d="M 540 1632 L 660 1632" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="570" y="1622" class="label" text-anchor="start">权重</text>
<path d="M 540 1275 L 610 1275 L 610 1500 L 630 1500 L 630 1605 L 660 1605" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="535" y="1490" class="label" text-anchor="start">连续方向</text>
<path d="M 910 1450 L 910 1575" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
