<text x="290.0" y="1171" class="body" text-anchor="middle">参数不更新，仍需反向计算</text>
<rect x="40" y="1235" width="500" height="80" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
