<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172b45}.title{font-size:30px;font-weight:700}.section{font-size:23px;font-weight:700}.node{font-size:21px;font-weight:700}.body{font-size:19px}.label{font-size:17px;fill:#536477}</style>
<rect width="1200" height="2280" fill="#fff"/>
<text x="36" y="46" class="title" text-anchor="start">MIC · 让可微目标与黑盒判据共同控制动作扩散</text>
<text x="36" y="80" class="body" text-anchor="start">教学示意 · 主文图2 / 式2–13，补充算法1 · 所有新控制在推理时计算，不更新模型权重</text>
<rect x="20" y="110" width="1160" height="230" rx="16" fill="#f6f8fb" stroke="#d5deea"/>
<text x="40" y="145" class="section" text-anchor="start">A  已训练的能力：MIC复用先验与控制器，不新增模型训练</text>
<rect x="40" y="175" width="240" height="100" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="160.0" y="205" class="node" text-anchor="middle">HumanML3D配对数据</text>
<text x="160.0" y="232" class="body" text-anchor="middle">文本与人体运动</text>
<text x="160.0" y="256" class="body" text-anchor="middle">原MDM的训练监督</text>
<rect x="320" y="175" width="260" height="100" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="450.0" y="205" class="node" text-anchor="middle">已预训练MDM</text>
<text x="450.0" y="232" class="body" text-anchor="middle">文本条件动作去噪器</text>
<text x="450.0" y="256" class="body" text-anchor="middle">学习自然运动分布</text>
<rect x="620" y="175" width="230" height="100" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="735.0" y="205" class="node" text-anchor="middle">冻结参数 θ</text>
<text x="735.0" y="232" class="body" text-anchor="middle">文本编码与动作主干</text>
<text x="735.0" y="256" class="body" text-anchor="middle">MIC只改变采样</text>
<rect x="900" y="175" width="260" height="100" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="1030.0" y="205" class="node" text-anchor="middle">预训练人体跟踪器</text>
<text x="1030.0" y="232" class="body" text-anchor="middle">供仿真判据／验收复用</text>
<text x="1030.0" y="256" class="body" text-anchor="middle">不属于MIC新训策略</text>
<path d="M 280 225 L 320 225" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 580 225 L 620 225" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="314" class="label" text-anchor="start">训练数据不在推理时重新读入；无需新增动作tokenizer、码本或神经解码器。</text>
<rect x="20" y="370" width="1160" height="270" rx="16" fill="#f6f8fb" stroke="#d5deea"/>
<text x="40" y="405" class="section" text-anchor="start">B  用户输入与初始化：约束规格、评价器和作用域均需外部提供</text>
<rect x="40" y="435" width="300" height="85" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="190.0" y="465" class="node" text-anchor="middle">文本提示 c</text>
<text x="190.0" y="492" class="body" text-anchor="middle">例如：人物向前行走</text>
<rect x="40" y="550" width="300" height="65" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
