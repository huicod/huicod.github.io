<path d="M 735 275 L 735 354 L 1188 354 L 1188 724 L 550 724 L 550 755" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="40" y="916" class="section" text-anchor="start">C1  可微连续目标：通过冻结网络回传</text>
<text x="660" y="916" class="section" text-anchor="start">C2  判据式目标：只需前向评价</text>
<rect x="40" y="955" width="500" height="95" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="290.0" y="985" class="node" text-anchor="middle">计算连续误差 vₖ(ẑT)</text>
<text x="290.0" y="1012" class="body" text-anchor="middle">例如：头高／手部目标／时间平滑</text>
<rect x="40" y="1090" width="500" height="105" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
