<text x="595.0" y="492" class="body" text-anchor="middle">目标 dₖ ＋ 评价函数 vₖ</text>
<text x="595.0" y="516" class="body" text-anchor="middle">类型：连续可微／判据式</text>
<text x="595.0" y="540" class="body" text-anchor="middle">范围：关节×帧掩码 Mₖ</text>
<text x="595.0" y="564" class="body" text-anchor="middle">阈值／场景几何由用户定义</text>
<rect x="850" y="435" width="310" height="85" rx="10" fill="#fff" stroke="#a9b8ca" stroke-width="1.5"/>
