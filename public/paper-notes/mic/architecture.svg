<rect x="850" y="550" width="310" height="65" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="1005.0" y="580" class="node" text-anchor="middle">优化 warm start</text>
<text x="1005.0" y="607" class="body" text-anchor="middle">沿用既有优化初始化</text>
<path d="M 1005 520 L 1005 550" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="675" width="1160" height="805" rx="16" fill="#fbfcfe" stroke="#d5deea"/>
<text x="40" y="710" class="section" text-anchor="start">C  展开一个去噪步：共享同一动作状态，分别构造每个约束的方向</text>
<rect x="40" y="755" width="220" height="105" rx="10" fill="#fff" stroke="#a9b8ca" stroke-width="1.5"/>
<text x="150.0" y="785" class="node" text-anchor="middle">当前噪声状态 zₜ</text>
<text x="150.0" y="812" class="body" text-anchor="middle">整段运动中间状态</text>
<text x="150.0" y="836" class="body" text-anchor="middle">不是物理关节力矩</text>
<rect x="320" y="755" width="300" height="105" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="470.0" y="785" class="node" text-anchor="middle">冻结MDM去噪器</text>
<text x="470.0" y="812" class="body" text-anchor="middle">输入状态＋文本＋步数</text>
<text x="470.0" y="836" class="body" text-anchor="middle">预测干净运动／score</text>
<rect x="680" y="755" width="480" height="105" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
