<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2280" viewBox="0 0 1200 2280" role="img" aria-label="MIC完整架构：预训练先验、初始化、双路约束控制、调权与分配、去噪循环与最终检查">
