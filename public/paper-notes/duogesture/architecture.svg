<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1580" viewBox="0 0 1560 1580" role="img" aria-label="DuoGesture｜语义与节拍分流，按帧融合"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657a"/></marker><marker id="train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9875b6"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#203148} .title{font-size:36px;font-weight:700} .sub{font-size:23px;fill:#617085} .group{font-size:27px;font-weight:700} .node{font-size:26px;font-weight:700} .body{font-size:23px} .edge{font-size:21px;fill:#53677e} .tiny{font-size:21px;fill:#617085}</style><rect width="1560" height="1580" fill="#ffffff"/><text x="48" y="58" class="title" text-anchor="start">DuoGesture｜语义与节拍分流，按帧融合</text><text x="48" y="96" class="sub" text-anchor="start">依据 arXiv:2605.26236v1 图 2–3、§3 与附录 C；脸部不参与双流融合。</text><rect x="30" y="125" width="1500" height="220" rx="20" fill="#f6f1fa" stroke="#d9e2eb" stroke-width="2"/><text x="52" y="165" class="group" text-anchor="start">A  先学动作表示；第二阶段冻结编解码器</text><rect x="60" y="190" width="330" height="115" rx="13" fill="#fff5e8" stroke="#d9a265" stroke-width="2"/><text x="225.0" y="228" class="node" text-anchor="middle">配对真值动作</text><text x="225.0" y="265" class="body" text-anchor="middle">手 / 上身 / 下身 / 脸</text><rect x="500" y="190" width="470" height="115" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="735.0" y="228" class="node" text-anchor="middle">区域 RVQ-VAE</text><text x="735.0" y="265" class="body" text-anchor="middle">重建 + 码本承诺损失</text><rect x="1080" y="190" width="410" height="115" rx="13" fill="#edf3fd" stroke="#84a7d4" stroke-width="2"/><text x="1285.0" y="228" class="node" text-anchor="middle">冻结码本与解码器</text><text x="1285.0" y="265" class="body" text-anchor="middle">第二阶段目标及最终解码</text><path d="M 390 248 L 500 248" fill="none" stroke="#9875b6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#train)"/><text x="420" y="235" class="edge" text-anchor="start">训练</text><path d="M 970 248 L 1080 248" fill="none" stroke="#9875b6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#train)"/><text x="996" y="235" class="edge" text-anchor="start">复用</text><rect x="30" y="375" width="1500" height="940" rx="20" fill="#f4f7fa" stroke="#d9e2eb" stroke-width="2"/><text x="52" y="415" class="group" text-anchor="start">B  第二阶段生成 / 推理：两种条件、两条身体流、一个随机门</text><rect x="60" y="445" width="330" height="115" rx="13" fill="#fff5e8" stroke="#d9a265" stroke-width="2"/><text x="225.0" y="483" class="node" text-anchor="middle">语音</text><text x="225.0" y="520" class="body" text-anchor="middle">HuBERT 声学 + onset</text><rect x="500" y="445" width="470" height="115" rx="13" fill="#fff5e8" stroke="#d9a265" stroke-width="2"/><text x="735.0" y="483" class="node" text-anchor="middle">转写、时间戳、情绪</text><text x="735.0" y="520" class="body" text-anchor="middle">逐词 FastText + 整句动作表示</text><rect x="1080" y="445" width="410" height="115" rx="13" fill="#fff5e8" stroke="#d9a265" stroke-width="2"/><text x="1285.0" y="483" class="node" text-anchor="middle">人物 ID + 4 帧 seed</text><text x="1285.0" y="520" class="body" text-anchor="middle">两条身体分支共用</text><rect x="60" y="635" width="330" height="125" rx="13" fill="#edf3fd" stroke="#84a7d4" stroke-width="2"/><text x="225.0" y="673" class="node" text-anchor="middle">声学与时序编码</text><text x="225.0" y="710" class="body" text-anchor="middle">1024 维 → 特征</text><text x="225.0" y="741" class="body" text-anchor="middle">64 维时序支线</text><rect x="500" y="635" width="470" height="125" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="735.0" y="673" class="node" text-anchor="middle">MGSC 动作语义条件</text><text x="735.0" y="710" class="body" text-anchor="middle">动作 / 情绪 memory 混合</text><text x="735.0" y="741" class="body" text-anchor="middle">逐词 query → Sᵐ（256维）</text><rect x="1080" y="635" width="410" height="125" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="1285.0" y="673" class="node" text-anchor="middle">S-VIB 随机语义门</text><text x="1285.0" y="710" class="body" text-anchor="middle">Sᵐ + 时序 → μ, σ → z</text><text x="1285.0" y="741" class="body" text-anchor="middle">16 维 z → Ψ ∈ [0,1]</text><path d="M 225 560 L 225 635" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 735 560 L 735 635" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 970 697 L 1080 697" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="987" y="681" class="edge" text-anchor="start">Sᵐ</text><path d="M 390 705 L 430 705 L 430 800 L 1285 800 L 1285 760" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="490" y="790" class="edge" text-anchor="start">时序支线</text><rect x="60" y="875" width="330" height="155" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="225.0" y="913" class="node" text-anchor="middle">节拍身体流</text><text x="225.0" y="950" class="body" text-anchor="middle">seed + ID + 音频</text><text x="225.0" y="981" class="body" text-anchor="middle">手 / 上身 / 下身</text><text x="225.0" y="1012" class="body" text-anchor="middle">区域 HCA 交互</text><rect x="500" y="875" width="470" height="155" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="735.0" y="913" class="node" text-anchor="middle">语义身体流</text><text x="735.0" y="950" class="body" text-anchor="middle">seed + ID + Sᵐ</text><text x="735.0" y="981" class="body" text-anchor="middle">手 / 上身 / 下身</text><text x="735.0" y="1012" class="body" text-anchor="middle">区域 HCA 交互</text><rect x="1080" y="875" width="410" height="155" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="1285.0" y="913" class="node" text-anchor="middle">脸部音频旁路</text><text x="1285.0" y="950" class="body" text-anchor="middle">音频 → face latent</text><text x="1285.0" y="981" class="body" text-anchor="middle">不融合语义 / 无 IBP</text><text x="1285.0" y="1012" class="body" text-anchor="middle">脸 latent → RVQ 查找</text><path d="M 225 760 L 225 875" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 735 760 L 735 875" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 1080 500 L 1020 500 L 1020 840 L 390 840 L 390 900" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="820" y="866" class="edge" text-anchor="start">seed / ID</text><path d="M 1020 840 L 970 840 L 970 900" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 225 760 L 225 820 L 1460 820 L 1460 875" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="1355" y="808" class="edge" text-anchor="start">音频</text><rect x="60" y="1120" width="910" height="150" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="515.0" y="1158" class="node" text-anchor="middle">按帧融合 → RVQ 查找</text><text x="515.0" y="1195" class="body" text-anchor="middle">Zᵣ = (1−Ψ) Zᵇᵣ + Ψ Zˢᵣ</text><text x="515.0" y="1226" class="body" text-anchor="middle">仅手 / 上身 / 下身；最近码本向量不是动作检索</text><rect x="1080" y="1120" width="410" height="150" rx="13" fill="#edf3fd" stroke="#84a7d4" stroke-width="2"/><text x="1285.0" y="1158" class="node" text-anchor="middle">冻结区域解码器</text><text x="1285.0" y="1195" class="body" text-anchor="middle">身体融合码 + 脸部码</text><text x="1285.0" y="1226" class="body" text-anchor="middle">输出全身 / 手 / 脸动作</text><path d="M 225 1030 L 225 1120" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 735 1030 L 735 1120" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 1080 730 L 1045 730 L 1045 1080 L 900 1080 L 900 1120" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="1052" y="1050" class="edge" text-anchor="start">Ψ</text><path d="M 1285 1030 L 1285 1120" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="1300" y="1087" class="edge" text-anchor="start">脸部码</text><path d="M 970 1190 L 1080 1190" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="979" y="1175" class="edge" text-anchor="start">身体码</text><rect x="30" y="1345" width="1500" height="155" rx="20" fill="#f6f1fa" stroke="#d9e2eb" stroke-width="2"/><text x="52" y="1385" class="group" text-anchor="start">C  仅训练：不是推理必经步骤</text><text x="60" y="1428" class="body" text-anchor="start">语义 flags → 监督 Ψ；VIB KL / free-bits → 防塌缩；真实动作码 → latent / 分类目标</text><text x="60" y="1470" class="body" text-anchor="start">IBP：解码节拍姿态，按质量 × (1−Ψ) × 方差加权恒速残差；只限 arm-chain，不是物理仿真</text><path d="M 120 1345 L 45 1345 L 45 1060 L 130 1060 L 130 1030" fill="none" stroke="#9875b6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#train)"/><text x="65" y="1330" class="edge" text-anchor="start">IBP 训练约束</text><path d="M 1430 1345 L 1510 1345 L 1510 700 L 1490 700" fill="none" stroke="#9875b6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#train)"/><text x="1302" y="1331" class="edge" text-anchor="start">语义监督</text><text x="48" y="1545" class="tiny" text-anchor="start">教学重绘 · 实线：推理表示流   虚线：训练 / 复用   蓝：冻结或复用   绿：学习模块   紫：训练专用</text></svg>