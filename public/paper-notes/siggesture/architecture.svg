<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1420" viewBox="0 0 1080 1420" role="img" aria-labelledby="title desc">
<title id="title">siggesture · 总体架构</title>
<desc id="desc">教学重绘依据 · 作者稿图 1、2、6 与式 7–9。晚期去噪和解码仍可改变最终手势的形状与峰值时刻。</desc>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
<path d="M0 0 8 4 0 8Z" fill="#446a68"/>
</marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
<path d="M0 0 8 4 0 8Z" fill="#99765e"/>
</marker>
</defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.e{fill:none;stroke:#446a68;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#a)}.d{stroke:#99765e;stroke-dasharray:7 5;marker-end:url(#b)}.edge-label{font-size:17px;font-weight:600;paint-order:stroke;stroke:white;stroke-width:5;stroke-linejoin:round}</style>
<rect width="1080" height="1420" fill="#f7f7f0"/>
<rect x="20" y="180" width="1040" height="235" rx="17" fill="#fff" stroke="#d0ded8" stroke-width="1.6"/>
<rect x="20" y="437" width="1040" height="247" rx="17" fill="#fff" stroke="#d0ded8" stroke-width="1.6"/>
<rect x="20" y="706" width="1040" height="651" rx="17" fill="#fff" stroke="#d0ded8" stroke-width="1.6"/>
<path d="M42 147H96" class="e"/>
<path d="M365 147H419" class="e d"/>
<path d="M316 340.5 L404 340.5" class="e"/>
<path d="M676 340.5 L764 340.5" class="e d"/>
<path d="M676 602.5 L764 602.5" class="e"/>
<path d="M316 874.5 L404 874.5" class="e"/>
<path d="M540 924 L540 1002" class="e"/>
<path d="M900 924 L900 946 L540 946 L540 1002" class="e"/>
<path d="M404 1051.5 L316 1051.5" class="e"/>
<path d="M180 1101 L180 1184" class="e"/>
<path d="M316 1233.5 L404 1233.5" class="e"/>
<path d="M44 602.5 L31 602.5 L31 874.5 L44 874.5" class="e"/>
<path d="M1036 602.5 L1048 602.5 L1048 874.5 L1036 874.5" class="e"/>
<path d="M180 924 L180 1002" class="e"/>
<text x="40" y="72" fill="#173b40" font-size="36" font-weight="700" text-anchor="start">SIGGesture · 给语音手势注入词义</text>
<text x="40" y="112" fill="#173b40" font-size="23" font-weight="400" text-anchor="start">节奏条件影响整段动作，语义范例只在选定词的时段进入潜空间。</text>
<text x="40" y="32" fill="#19766f" font-size="18" font-weight="700" text-anchor="start">SIGGRAPH Asia 2024   /   共语手势生成</text>
<text x="108" y="154" fill="#173b40" font-size="19" font-weight="400" text-anchor="start">动作、特征或条件</text>
<text x="430" y="154" fill="#87644b" font-size="19" font-weight="400" text-anchor="start">训练目标或真值</text>
<text x="42" y="220" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">01</text>
<text x="94" y="220" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">先准备共用的动作潜表示</text>
<text x="44" y="254" fill="#476064" font-size="19" font-weight="400" text-anchor="start">动作 VQ-VAE 学到连续码向量。扩散和范例库在同一空间交换信息。</text>
<rect data-node="gesture" x="44" y="291" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="322" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">配对语音与骨骼动作</text>
<text x="59" y="351" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">动作编码、码本最近邻</text>
<text x="59" y="376" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">每四帧对应一项潜表示</text>
<rect data-node="den" x="404" y="291" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="322" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">节奏去噪器</text>
<text x="419" y="351" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">真实潜动作加噪，以音频、</text>
<text x="419" y="376" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">说话人和噪声等级为条件</text>
<rect data-node="train" x="764" y="291" width="272" height="99" rx="12" fill="#f4e6dc" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="322" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">去噪训练目标</text>
<text x="779" y="351" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">预测干净动作潜表示</text>
<text x="779" y="376" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">与真实潜表示计算误差</text>
<text x="360" y="325" text-anchor="middle" class="edge-label" fill="#19766f">潜序列</text>
<text x="720" y="325" text-anchor="middle" class="edge-label" fill="#866044">监督</text>
<text x="42" y="477" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">02</text>
<text x="94" y="477" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">在新讲话上分别准备声音与语义</text>
<text x="44" y="511" fill="#476064" font-size="19" font-weight="400" text-anchor="start">词的时间位置来自对齐转写。语言模型提供标签，实际动作来自人工筛选的短片段库。</text>
<rect data-node="speech" x="44" y="553" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="584" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">新语音、说话人 ID</text>
<text x="59" y="613" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">Jukebox 提取声学节奏</text>
<text x="59" y="638" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">与说话人条件合用</text>
<rect data-node="words" x="404" y="553" width="272" height="99" rx="12" fill="#f6e8ca" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="584" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">转写＋词时间</text>
<text x="419" y="613" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">GPT-4 依据上下文</text>
<text x="419" y="638" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">为少数词选择标签</text>
<rect data-node="lookup" x="764" y="553" width="272" height="99" rx="12" fill="#f6e8ca" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="584" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">语义动作库</text>
<text x="779" y="613" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">按标签找已编码片段</text>
<text x="779" y="638" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">构造候选 G 和时段掩码 m</text>
<text x="720" y="591" text-anchor="middle" class="edge-label" fill="#19766f">类别标签</text>
<text x="42" y="746" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">03</text>
<text x="94" y="746" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">在扩散的哪一步、动作的哪一段写入范例？</text>
<text x="44" y="780" fill="#476064" font-size="19" font-weight="400" text-anchor="start">扩散步 t 和语音时间轴是两件事。整段一直由声音调节，范例只进入部分去噪步。</text>
<rect data-node="ac" x="44" y="825" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="856" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">音频特征＋身份</text>
<text x="59" y="885" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">条件贯穿早、晚去噪阶段</text>
<rect data-node="xt" x="404" y="825" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="856" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">整段带噪潜动作</text>
<text x="419" y="885" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">随机噪声初始化；去噪器</text>
<text x="419" y="910" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">依音频生成当前潜值 xₜ</text>
<rect data-node="hint" x="764" y="825" width="272" height="99" rx="12" fill="#f6e8ca" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="856" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">候选片段 G 与 m</text>
<text x="779" y="885" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">只覆盖被选词的时间位置</text>
<text x="779" y="910" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">在其余位置 m = 1</text>
<rect data-node="late" x="44" y="1002" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="1033" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">后段 · K 至 1</text>
<text x="59" y="1062" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">继续条件去噪</text>
<text x="59" y="1087" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">让注入片段与上下文衔接</text>
<rect data-node="mix" x="404" y="1002" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="1033" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">前段 · T 至 K</text>
<text x="419" y="1062" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">m × xₜ + (1−m) × G</text>
<text x="419" y="1087" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">在选中时段融合范例</text>
<rect data-node="decode" x="44" y="1184" width="272" height="99" rx="12" fill="#e6efe0" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="1215" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">VQ-VAE 解码器</text>
<text x="59" y="1244" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">还原完整的三维骨骼旋转</text>
<rect data-node="out" x="404" y="1184" width="272" height="99" rx="12" fill="#deece7" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="1215" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">连续共语动作</text>
<text x="419" y="1244" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">节奏动作与被选词的手势</text>
<text x="419" y="1269" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">出现在同一条时间线上</text>
<text x="360" y="861" text-anchor="middle" class="edge-label" fill="#19766f">条件</text>
<text x="596" y="967" text-anchor="middle" class="edge-label" fill="#19766f">当前潜值</text>
<text x="746" y="938" text-anchor="middle" class="edge-label" fill="#19766f">G 与 m</text>
<text x="360" y="1036" text-anchor="middle" class="edge-label" fill="#19766f">到达 K</text>
<text x="245" y="1144" text-anchor="middle" class="edge-label" fill="#19766f">最终潜表示</text>
<text x="360" y="1222" text-anchor="middle" class="edge-label" fill="#19766f">骨骼帧</text>
<text x="250" y="970" text-anchor="middle" class="edge-label" fill="#19766f">声音贯穿后段</text>
<text x="40" y="1395" fill="#4a6263" font-size="18" font-weight="400" text-anchor="start">教学重绘依据 · 作者稿图 1、2、6 与式 7–9。晚期去噪和解码仍可改变最终手势的形状与峰值时刻。</text>
</svg>
