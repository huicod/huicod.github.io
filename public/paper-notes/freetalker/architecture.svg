<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1250" role="img" aria-label="FreeTalker｜共同动作空间 → 条件扩散 → 两轮过渡"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526174"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#203047} .title{font-size:29px;font-weight:700} .section{font-size:23px;font-weight:700} .head{font-size:21px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{fill:none;stroke:#526174;stroke-width:2.2;marker-end:url(#arr)} .dashed{stroke-dasharray:7 5}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="44" class="title" text-anchor="start">FreeTalker｜共同动作空间 → 条件扩散 → 两轮过渡</text><rect x="30" y="75" width="1220" height="245" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="108" class="section" text-anchor="start">A · 训练：异构资料共享一个动作去噪器</text><rect x="55" y="130" width="330" height="100" rx="10" fill="#fff" stroke="#aab9cc"/><text x="69" y="160" class="head" text-anchor="start">两类已有数据</text><text x="69" y="187" class="body" text-anchor="start">HumanML3D：动作文字＋运动</text><text x="69" y="212" class="body" text-anchor="start">BEAT：语音＋手势</text><rect x="425" y="130" width="350" height="100" rx="10" fill="#fff" stroke="#aab9cc"/><text x="439" y="160" class="head" text-anchor="start">统一骨架与运动学表示</text><text x="439" y="187" class="body" text-anchor="start">SMPL-X转换／拟合、尺度和朝向</text><text x="439" y="212" class="body" text-anchor="start">每帧659维；20fps</text><rect x="815" y="130" width="410" height="100" rx="10" fill="#fff" stroke="#aab9cc"/><text x="829" y="160" class="head" text-anchor="start">训练共享注意力网络</text><text x="829" y="187" class="body" text-anchor="start">带噪动作 xₜ → 干净预测 x̂₀</text><text x="829" y="212" class="body" text-anchor="start">动作重建监督；文字随机屏蔽</text><path d="M385 180H425" class="line"/><path d="M775 180H815" class="line"/><rect x="55" y="250" width="1170" height="48" rx="10" fill="#fff5df" stroke="#aab9cc"/><text x="69" y="280" class="head" text-anchor="start">缺失条件置零；两类样本加权采样；不等于已有完整的“文字＋语音＋动作”配对</text><rect x="30" y="350" width="1220" height="530" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="383" class="section" text-anchor="start">B · 推理：每个片段从噪声开始，重复共享模型的条件预测</text><rect x="55" y="410" width="270" height="95" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="440" class="head" text-anchor="start">动作文字 d</text><text x="69" y="467" class="body" text-anchor="start">例如“向观众挥手”</text><text x="69" y="492" class="body" text-anchor="start">不是必须使用讲话转录</text><rect x="365" y="410" width="300" height="95" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="379" y="440" class="head" text-anchor="start">预训练CLIP特征</text><text x="379" y="467" class="body" text-anchor="start">512维文字向量</text><text x="379" y="492" class="body" text-anchor="start">线性映射为条件单元</text><path d="M325 456H365" class="line"/><rect x="55" y="545" width="270" height="100" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="575" class="head" text-anchor="start">语音 a</text><text x="69" y="602" class="body" text-anchor="start">当前表演片段的音频</text><text x="69" y="627" class="body" text-anchor="start">与动作时间对齐</text><rect x="365" y="545" width="300" height="100" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="379" y="575" class="head" text-anchor="start">音频特征提取</text><text x="379" y="602" class="body" text-anchor="start">WavLM＋声学特征</text><text x="379" y="627" class="body" text-anchor="start">插值为 Tₘ × 1133</text><path d="M325 590H365" class="line"/><rect x="745" y="410" width="440" height="185" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="759" y="440" class="head" text-anchor="start">同一注意力去噪器 · 两次调用</text><text x="759" y="467" class="body" text-anchor="start">带噪动作 xₜ ＋ 扩散步 t</text><text x="759" y="492" class="body" text-anchor="start">① D(xₜ,t,[d,a])：文字＋语音</text><text x="759" y="517" class="body" text-anchor="start">② D(xₜ,t,[∅,a])：保留语音</text><text x="759" y="542" class="body" text-anchor="start">每次预测干净的659维动作</text><path d="M665 456H745" class="line"/><path d="M665 590H705V535H745" class="line"/><path d="M1015 320V390H965V410" class="line dashed"/><text x="1025" y="378" class="small" text-anchor="start">训练后复用参数</text><rect x="55" y="700" width="270" height="90" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="730" class="head" text-anchor="start">文字控制强度 γ</text><text x="69" y="757" class="body" text-anchor="start">γ=0：采用语音预测</text><text x="69" y="782" class="body" text-anchor="start">γ=1：采用双条件预测</text><rect x="365" y="700" width="300" height="90" rx="10" fill="#fff" stroke="#aab9cc"/><text x="379" y="730" class="head" text-anchor="start">初始高斯噪声 xT</text><text x="379" y="757" class="body" text-anchor="start">形状：片段帧数 × 659</text><text x="379" y="782" class="body" text-anchor="start">同时输入扩散步 t</text><path d="M665 740H705V570H745" class="line"/><text x="673" y="700" class="small" text-anchor="start">xₜ, t</text><rect x="745" y="630" width="440" height="90" rx="10" fill="#fff" stroke="#aab9cc"/><text x="759" y="660" class="head" text-anchor="start">组合干净运动预测</text><text x="759" y="687" class="body" text-anchor="start">x̂₀ = ② ＋ γ(①−②)</text><text x="759" y="712" class="body" text-anchor="start">软引导，不是部位或空间硬约束</text><path d="M965 595V630" class="line"/><path d="M325 745H345V675H745" class="line"/><text x="350" y="666" class="small" text-anchor="start">γ</text><rect x="745" y="760" width="440" height="80" rx="10" fill="#fff" stroke="#aab9cc"/><text x="759" y="790" class="head" text-anchor="start">构造下一噪声级 xₜ₋₁</text><text x="759" y="817" class="body" text-anchor="start">t递减至0，得到当前片段</text><path d="M965 720V760" class="line"/><path d="M1185 800H1220V485H1185" class="line"/><text x="1160" y="865" class="small" text-anchor="start">下一轮</text><rect x="30" y="915" width="1220" height="285" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="948" class="section" text-anchor="start">C · 多片段接续：DoubleTake修整时间边界，再恢复骨架</text><rect x="55" y="980" width="240" height="120" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="1010" class="head" text-anchor="start">片段安排</text><text x="69" y="1037" class="body" text-anchor="start">上台 → 挥手 → 讲话</text><text x="69" y="1062" class="body" text-anchor="start">每段文字／音频／长度</text><text x="69" y="1087" class="body" text-anchor="start">由用户提供</text><rect x="340" y="980" width="250" height="120" rx="10" fill="#fff" stroke="#aab9cc"/><text x="354" y="1010" class="head" text-anchor="start">Take 1：握手区</text><text x="354" y="1037" class="body" text-anchor="start">相邻后缀与前缀共享</text><text x="354" y="1062" class="body" text-anchor="start">线性权重组合 τ</text><text x="354" y="1087" class="body" text-anchor="start">h=20帧，即1秒</text><rect x="635" y="980" width="270" height="120" rx="10" fill="#fff" stroke="#aab9cc"/><text x="649" y="1010" class="head" text-anchor="start">Take 2：过渡细化</text><text x="649" y="1037" class="body" text-anchor="start">过渡三明治重新加噪</text><text x="649" y="1062" class="body" text-anchor="start">软／硬掩码与10帧缓冲</text><text x="649" y="1087" class="body" text-anchor="start">局部重做后展开</text><rect x="950" y="980" width="275" height="120" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="964" y="1010" class="head" text-anchor="start">长动作与后续展示</text><text x="964" y="1037" class="body" text-anchor="start">连续659维运动特征</text><text x="964" y="1062" class="body" text-anchor="start">恢复骨架；可另行拟合</text><text x="964" y="1087" class="body" text-anchor="start">不直接输出完整数字人</text><path d="M295 1040H340" class="line"/><path d="M590 1040H635" class="line"/><path d="M905 1040H950" class="line"/><path d="M965 840V895H790V960H465V980" class="line"/><text x="805" y="921" class="small" text-anchor="start">各段预测</text><text x="55" y="1145" class="body" text-anchor="start">第二轮默认T′=900步；渐变掩码与模型先验帮助衔接，不保证任意源动作世界坐标完全保持。</text><text x="55" y="1178" class="small" text-anchor="start">教学示意依据：原文图1、式2、§2.1–2.4；虚线为训练复用，实线为数据流。</text><text x="40" y="1230" class="small" text-anchor="start">阅读重点：一个联合生成器、两种条件、独立的跨段过渡机制。</text></svg>