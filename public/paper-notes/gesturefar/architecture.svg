<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1540" viewBox="0 0 1560 1540" role="img" aria-label="GestureFAR｜因果上下文 + 每 token 连续采样"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657a"/></marker><marker id="train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9875b6"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#203148} .title{font-size:36px;font-weight:700} .sub{font-size:23px;fill:#617085} .group{font-size:27px;font-weight:700} .node{font-size:26px;font-weight:700} .body{font-size:23px} .edge{font-size:21px;fill:#53677e} .tiny{font-size:21px;fill:#617085}</style><rect width="1560" height="1540" fill="#ffffff"/><text x="48" y="58" class="title" text-anchor="start">GestureFAR｜因果上下文 + 每 token 连续采样</text><text x="48" y="96" class="sub" text-anchor="start">依据 arXiv:2609.21576v1 图 3–4、§3；“单步”只指当前 latent 的 flow head。</text><rect x="30" y="125" width="1500" height="300" rx="20" fill="#f6f1fa" stroke="#d9e2eb" stroke-width="2"/><text x="52" y="165" class="group" text-anchor="start">A  三阶段学习；蒸馏时冻结 VAE 与 AR 主干</text><rect x="60" y="195" width="350" height="180" rx="13" fill="#f5edfb" stroke="#ad91c4" stroke-width="2"/><text x="235.0" y="233" class="node" text-anchor="middle">① 因果连续 VAE</text><text x="235.0" y="270" class="body" text-anchor="middle">真实动作 → 连续 latent</text><text x="235.0" y="301" class="body" text-anchor="middle">128 维，时间 stride 4</text><text x="235.0" y="332" class="body" text-anchor="middle">encoder / decoder 均因果</text><rect x="520" y="195" width="440" height="180" rx="13" fill="#f5edfb" stroke="#ad91c4" stroke-width="2"/><text x="740.0" y="233" class="node" text-anchor="middle">② AR 主干 + flow teacher</text><text x="740.0" y="270" class="body" text-anchor="middle">历史 latent + 当前语音</text><text x="740.0" y="301" class="body" text-anchor="middle">teacher：8 步 Heun</text><text x="740.0" y="332" class="body" text-anchor="middle">学习下一 latent 分布</text><rect x="1070" y="195" width="420" height="180" rx="13" fill="#f5edfb" stroke="#ad91c4" stroke-width="2"/><text x="1280.0" y="233" class="node" text-anchor="middle">③ 只蒸馏 flow head</text><text x="1280.0" y="270" class="body" text-anchor="middle">缓存固定条件 cᵢ</text><text x="1280.0" y="301" class="body" text-anchor="middle">dCM 预热 + DMD 分布匹配</text><text x="1280.0" y="332" class="body" text-anchor="middle">fake-score 只训练时使用</text><path d="M 410 280 L 520 280" fill="none" stroke="#9875b6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#train)"/><text x="433" y="264" class="edge" text-anchor="start">latent</text><path d="M 960 280 L 1070 280" fill="none" stroke="#9875b6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#train)"/><text x="969" y="264" class="edge" text-anchor="start">条件缓存</text><rect x="30" y="455" width="1500" height="715" rx="20" fill="#f4f7fa" stroke="#d9e2eb" stroke-width="2"/><text x="52" y="495" class="group" text-anchor="start">B  因果生成主线</text><rect x="60" y="530" width="350" height="135" rx="13" fill="#fff5e8" stroke="#d9a265" stroke-width="2"/><text x="235.0" y="568" class="node" text-anchor="middle">当前可用语音</text><text x="235.0" y="605" class="body" text-anchor="middle">冻结 mHuBERT</text><text x="235.0" y="636" class="body" text-anchor="middle">音频缓存持续保留</text><rect x="520" y="530" width="440" height="135" rx="13" fill="#fff5e8" stroke="#d9a265" stroke-width="2"/><text x="740.0" y="568" class="node" text-anchor="middle">历史连续 latent</text><text x="740.0" y="605" class="body" text-anchor="middle">自回归状态 / KV cache</text><text x="740.0" y="636" class="body" text-anchor="middle">不是离散码本编号</text><rect x="1070" y="530" width="420" height="135" rx="13" fill="#fff5e8" stroke="#d9a265" stroke-width="2"/><text x="1280.0" y="568" class="node" text-anchor="middle">高斯噪声 ε</text><text x="1280.0" y="605" class="body" text-anchor="middle">每次采样新的连续 latent</text><text x="1280.0" y="636" class="body" text-anchor="middle">不进入 AR 历史条件</text><rect x="60" y="770" width="470" height="170" rx="13" fill="#edf3fd" stroke="#84a7d4" stroke-width="2"/><text x="295.0" y="808" class="node" text-anchor="middle">8 层因果音频—动作主干</text><text x="295.0" y="845" class="body" text-anchor="middle">motion self-attn：只看过去</text><text x="295.0" y="876" class="body" text-anchor="middle">audio cross-attn：只看可用音频</text><text x="295.0" y="907" class="body" text-anchor="middle">输出条件向量 cᵢ</text><rect x="635" y="770" width="365" height="170" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="817.5" y="808" class="node" text-anchor="middle">单步 student head</text><text x="817.5" y="845" class="body" text-anchor="middle">cᵢ + ε → zᵢ</text><text x="817.5" y="876" class="body" text-anchor="middle">连续 128 维 token</text><text x="817.5" y="907" class="body" text-anchor="middle">一次 head 求值</text><rect x="1100" y="770" width="390" height="170" rx="13" fill="#edf3fd" stroke="#84a7d4" stroke-width="2"/><text x="1295.0" y="808" class="node" text-anchor="middle">因果 VAE decoder</text><text x="1295.0" y="845" class="body" text-anchor="middle">卷积 cache 延续</text><text x="1295.0" y="876" class="body" text-anchor="middle">7.5 Hz latent → 30 FPS动作</text><text x="1295.0" y="907" class="body" text-anchor="middle">只解码新可发射帧</text><path d="M 235 665 L 235 770" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="252" y="730" class="edge" text-anchor="start">h≤i</text><path d="M 740 665 L 740 705 L 395 705 L 395 770" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="475" y="693" class="edge" text-anchor="start">z&lt;i</text><path d="M 1280 665 L 1280 705 L 818 705 L 818 770" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="1060" y="695" class="edge" text-anchor="start">ε</text><path d="M 530 855 L 635 855" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="570" y="841" class="edge" text-anchor="start">cᵢ</text><path d="M 1000 855 L 1100 855" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="1032" y="841" class="edge" text-anchor="start">zᵢ</text><path d="M 818 770 L 818 740 L 980 740 L 980 510 L 740 510 L 740 530" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="1020" y="735" class="edge" text-anchor="start">下一 token 历史</text><rect x="60" y="1010" width="940" height="110" rx="13" fill="#f2f5f8" stroke="#9cabbc" stroke-width="2"/><text x="530.0" y="1048" class="node" text-anchor="middle">因果性需要全链路成立</text><text x="530.0" y="1085" class="body" text-anchor="middle">论文规定 h≤i；公开项目 404 / 空仓库，尚未运行核验音频窗口与缓存</text><path d="M 235 375 L 235 445 L 1510 445 L 1510 845 L 1490 845" fill="none" stroke="#9875b6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#train)"/><text x="1180" y="436" class="edge" text-anchor="start">冻结解码器复用</text><path d="M 740 375 L 740 430 L 510 430 L 510 770" fill="none" stroke="#9875b6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#train)"/><text x="532" y="740" class="edge" text-anchor="start">冻结主干</text><path d="M 1280 375 L 1280 450 L 1015 450 L 1015 735 L 900 735 L 900 770" fill="none" stroke="#9875b6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#train)"/><text x="1030" y="485" class="edge" text-anchor="start">student 参数</text><rect x="30" y="1200" width="1500" height="260" rx="20" fill="#f4f7fa" stroke="#d9e2eb" stroke-width="2"/><text x="52" y="1240" class="group" text-anchor="start">C  状态化播放：不是所有行为都由生成模型学习</text><rect x="60" y="1275" width="370" height="130" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="245.0" y="1313" class="node" text-anchor="middle">身体锚点</text><text x="245.0" y="1350" class="body" text-anchor="middle">平移 / 地面高度 / 朝向</text><text x="245.0" y="1381" class="body" text-anchor="middle">连接上一渲染状态</text><rect x="535" y="1275" width="430" height="130" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="750.0" y="1313" class="node" text-anchor="middle">短 motion buffer</text><text x="750.0" y="1350" class="body" text-anchor="middle">后端生成与固定帧率解耦</text><text x="750.0" y="1381" class="body" text-anchor="middle">旋转 slerp / 位移插值</text><rect x="1070" y="1275" width="420" height="130" rx="13" fill="#f2f5f8" stroke="#9cabbc" stroke-width="2"/><text x="1280.0" y="1313" class="node" text-anchor="middle">Avatar 连续播放</text><text x="1280.0" y="1350" class="body" text-anchor="middle">说话：生成动作</text><text x="1280.0" y="1381" class="body" text-anchor="middle">倾听：短 idle clip 循环</text><path d="M 1295 940 L 1295 1180 L 45 1180 L 45 1250 L 245 1250 L 245 1275" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="675" y="1170" class="edge" text-anchor="start">新动作帧</text><path d="M 430 1340 L 535 1340" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 965 1340 L 1070 1340" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="48" y="1505" class="tiny" text-anchor="start">教学重绘 · 实线：推理表示流   虚线：训练 / 复用   蓝：冻结或复用   绿：学习模块   紫：训练专用</text></svg>