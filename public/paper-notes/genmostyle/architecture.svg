<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2040" viewBox="0 0 1200 2040"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#416f91"/></marker></defs><rect width="1200" height="2040" fill="#f7f9fc"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#18344b}.title{font-size:32px;font-weight:700}.head{font-size:26px;font-weight:700}.small{font-size:22px}.note{font-size:20px}</style><text x="40" y="47" class="title" text-anchor="start">GenMoStyle：内容保留时间轴，风格成为可采样分布</text><text x="40" y="82" class="note" text-anchor="start">ICLR 2024 · 中文教学重绘 · 连续运动码，非离散 VQ token；无扩散、无强化学习</text><rect x="25" y="112" width="1150" height="415" rx="19" fill="white" stroke="#c9d7e3" stroke-width="2"/><text x="48" y="152" class="head" text-anchor="start">A  离线预训练：建立动作空间，并学习平移预测器</text><text x="48" y="188" class="small" text-anchor="start">数据统一骨架 / 30 fps / 标准化；第一阶段 AE 与 VAE 是两种替代设置</text><rect x="55" y="222" width="230" height="95" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="170.0" y="246.5" class="small" text-anchor="middle">姿态序列 P：260D</text><text x="170.0" y="276.5" class="small" text-anchor="middle">排除 4 个接触通道</text><text x="170.0" y="306.5" class="small" text-anchor="middle">E 输入：256D</text><rect x="330" y="222" width="220" height="95" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="440.0" y="261.5" class="small" text-anchor="middle">时间卷积 E</text><text x="440.0" y="291.5" class="small" text-anchor="middle">160 → 40 帧特征</text><rect x="595" y="222" width="240" height="95" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="715.0" y="261.5" class="small" text-anchor="middle">运动码 z</text><text x="715.0" y="291.5" class="small" text-anchor="middle">40 × 512 · 连续</text><rect x="880" y="222" width="255" height="95" rx="13" fill="#eaf4e9" stroke="#9fb6ca" stroke-width="1.7"/><text x="1007.5" y="261.5" class="small" text-anchor="middle">时间卷积 D</text><text x="1007.5" y="291.5" class="small" text-anchor="middle">恢复姿态序列</text><path d="M285 269 H330" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M550 269 H595" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M835 269 H880" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><text x="55" y="363" class="small" text-anchor="start">重建 + AE 幅值 / 平滑 L1，或 VAE 轻 KL；E / D 训练后复用。</text><rect x="55" y="410" width="270" height="75" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="190.0" y="454.5" class="small" text-anchor="middle">局部关节运动</text><rect x="400" y="410" width="350" height="75" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="575.0" y="454.5" class="small" text-anchor="middle">GMP：小型时间卷积</text><rect x="835" y="410" width="300" height="75" rx="13" fill="#eaf4e9" stroke="#9fb6ca" stroke-width="1.7"/><text x="985.0" y="454.5" class="small" text-anchor="middle">预测根部平移速度</text><path d="M325 448 H400" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M750 448 H835" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><text x="400" y="511" class="note" text-anchor="start">独立训练，MAE 监督真实全局运动</text><rect x="25" y="557" width="1150" height="635" rx="19" fill="white" stroke="#c9d7e3" stroke-width="2"/><text x="48" y="597" class="head" text-anchor="start">B  离线风格学习：拆分、重组与循环恢复</text><text x="48" y="633" class="small" text-anchor="start">z¹、z² 来自同一序列；z³ 来自另一段。风格标签只在监督设置使用</text><rect x="55" y="667" width="260" height="95" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="185.0" y="706.5" class="small" text-anchor="middle">复用 E 提取运动码</text><text x="185.0" y="736.5" class="small" text-anchor="middle">同序列两段 + 随机段</text><rect x="385" y="667" width="325" height="95" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="547.5" y="691.5" class="small" text-anchor="middle">内容编码器 E_c</text><text x="547.5" y="721.5" class="small" text-anchor="middle">卷积 + IN → z_c</text><text x="547.5" y="751.5" class="small" text-anchor="middle">保留时间轴，例 20 × 512</text><rect x="385" y="817" width="325" height="115" rx="13" fill="#fbefdc" stroke="#9fb6ca" stroke-width="1.7"/><text x="547.5" y="851.5" class="small" text-anchor="middle">风格编码器 E_s</text><text x="547.5" y="881.5" class="small" text-anchor="middle">卷积 + 平均池化</text><text x="547.5" y="911.5" class="small" text-anchor="middle">输出 μ_s、σ_s（各 512D）</text><path d="M315 714 H385" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M315 732 H350 V874 H385" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><rect x="55" y="842" width="260" height="65" rx="13" fill="#fbefdc" stroke="#9fb6ca" stroke-width="1.7"/><text x="185.0" y="881.5" class="small" text-anchor="middle">可选：风格标签 sl</text><path d="M315 874 H385" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><rect x="835" y="817" width="300" height="115" rx="13" fill="#fbefdc" stroke="#9fb6ca" stroke-width="1.7"/><text x="985.0" y="851.5" class="small" text-anchor="middle">重参数采样</text><text x="985.0" y="881.5" class="small" text-anchor="middle">z_s ∼ N_s(μ_s, σ_s)</text><text x="985.0" y="911.5" class="small" text-anchor="middle">与可选 sl 合并</text><path d="M710 874 H835" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><rect x="835" y="667" width="300" height="95" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="985.0" y="691.5" class="small" text-anchor="middle">生成器 G</text><text x="985.0" y="721.5" class="small" text-anchor="middle">卷积 + AdaIN</text><text x="985.0" y="751.5" class="small" text-anchor="middle">风格生成各层缩放 / 偏移</text><path d="M710 714 H835" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M985 817 V762" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><rect x="835" y="982" width="300" height="85" rx="13" fill="#eaf4e9" stroke="#9fb6ca" stroke-width="1.7"/><text x="985.0" y="1016.5" class="small" text-anchor="middle">新运动码 ẑ → 复用 D</text><text x="985.0" y="1046.5" class="small" text-anchor="middle">解码姿态 P̂</text><path d="M1135 713 H1150 V1024 H1135" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><rect x="55" y="989" width="655" height="85" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="382.5" y="1023.5" class="small" text-anchor="middle">自重建：自身内容 + 自身风格 → 恢复原输入</text><text x="382.5" y="1053.5" class="small" text-anchor="middle">交换：z² 内容 + z³ 风格 → zᵗ → 两路循环恢复</text><path d="M835 1025 H710" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" stroke-dasharray="8 5"/><text x="55" y="1117" class="note" text-anchor="start">训练监督：运动码 / 姿态重建；同序列风格分布 KL；循环重建；标准高斯 KL。</text><text x="55" y="1156" class="note" text-anchor="start">这些是软学习约束，不将源关节、原路径、脚接触或未修改部位硬复制。</text><rect x="25" y="1222" width="1150" height="680" rx="19" fill="white" stroke="#c9d7e3" stroke-width="2"/><text x="48" y="1262" class="head" text-anchor="start">C  推理：三种风格入口，共用一个潜空间生成器</text><text x="48" y="1298" class="small" text-anchor="start">输入内容动作始终必需；参考动作监督版还需标签，无监督版不需标签</text><rect x="55" y="1332" width="310" height="95" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="210.0" y="1356.5" class="small" text-anchor="middle">源内容动作</text><text x="210.0" y="1386.5" class="small" text-anchor="middle">复用 E → E_c</text><text x="210.0" y="1416.5" class="small" text-anchor="middle">时序内容码 z_c</text><rect x="440" y="1332" width="330" height="125" rx="13" fill="#fbefdc" stroke="#9fb6ca" stroke-width="1.7"/><text x="605.0" y="1356.5" class="small" text-anchor="middle">参考风格动作</text><text x="605.0" y="1386.5" class="small" text-anchor="middle">复用 E → E_s</text><text x="605.0" y="1416.5" class="small" text-anchor="middle">得到风格高斯 → z_s</text><text x="605.0" y="1446.5" class="small" text-anchor="middle">监督版附加 sl</text><rect x="845" y="1332" width="290" height="125" rx="13" fill="#fbefdc" stroke="#9fb6ca" stroke-width="1.7"/><text x="990.0" y="1356.5" class="small" text-anchor="middle">标签 / 无条件先验</text><text x="990.0" y="1386.5" class="small" text-anchor="middle">采样 z_s ∼ N(0,I)</text><text x="990.0" y="1416.5" class="small" text-anchor="middle">标签版附加 sl</text><text x="990.0" y="1446.5" class="small" text-anchor="middle">先验版不附加标签</text><rect x="440" y="1537" width="330" height="95" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="605.0" y="1576.5" class="small" text-anchor="middle">G：AdaIN 风格重组</text><text x="605.0" y="1606.5" class="small" text-anchor="middle">输出连续新运动码 ẑ</text><path d="M210 1427 V1584 H440" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M605 1457 V1537" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M990 1457 V1584 H770" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><rect x="55" y="1717" width="310" height="85" rx="13" fill="#eaf4e9" stroke="#9fb6ca" stroke-width="1.7"/><text x="210.0" y="1751.5" class="small" text-anchor="middle">最终风格化动作</text><text x="210.0" y="1781.5" class="small" text-anchor="middle">局部姿态 + 全局移动</text><rect x="440" y="1717" width="330" height="85" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="605.0" y="1751.5" class="small" text-anchor="middle">GMP 适配根部平移</text><text x="605.0" y="1781.5" class="small" text-anchor="middle">与新局部姿态组合</text><rect x="845" y="1717" width="290" height="85" rx="13" fill="#e7f0fa" stroke="#9fb6ca" stroke-width="1.7"/><text x="990.0" y="1751.5" class="small" text-anchor="middle">复用 D</text><text x="990.0" y="1781.5" class="small" text-anchor="middle">解码身体姿态</text><path d="M605 1632 V1670 H990 V1717" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M845 1760 H770" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M440 1760 H365" fill="none" stroke="#416f91" stroke-width="2.6" marker-end="url(#arr)" /><text x="55" y="1854" class="note" text-anchor="start">外部文本到动作可提供内容输入；本模型没有自由文本风格编码器。</text><text x="50" y="1940" class="note" text-anchor="start">实现说明：当前脚本对参考高斯也采样；保留源根角速度，并可追加接触阈值 + IK。</text><text x="50" y="1973" class="note" text-anchor="start">数据边界：风格模型仅在 Aberman 训练；AE / GMP 数据覆盖存在主文与附录差异。</text><text x="50" y="2006" class="note" text-anchor="start">来源：正式 §3、图 2–3、附图 9–10。蓝为网络，橙为风格，绿为动作；未运行模型。</text></svg>