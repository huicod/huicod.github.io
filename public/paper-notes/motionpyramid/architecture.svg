<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2020" viewBox="0 0 1200 2020"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#406f91"/></marker></defs><rect width="1200" height="2020" fill="#f7f9fc"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1a344b}.title{font-size:32px;font-weight:700}.head{font-size:26px;font-weight:700}.small{font-size:22px}.note{font-size:20px}</style><text x="40" y="48" class="title" text-anchor="start">MotionPyramid：先编辑中间表示，再生成完整动作</text><text x="40" y="82" class="note" text-anchor="start">SCA / CGF 2026 · 中文教学重绘 · 蓝：表示/模型；橙：风格与编辑；绿：生成动作</text><rect x="25" y="110" width="1150" height="640" rx="20" fill="white" stroke="#c9d7e3" stroke-width="2"/><text x="48" y="149" class="head" text-anchor="start">A  离线表示学习：局部动作 → 风格化相位流形</text><text x="48" y="185" class="small" text-anchor="start">无风格标签；重建与量化训练，不把离散类别当成文字标签</text><rect x="55" y="220" width="245" height="100" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="177.5" y="262.0" class="small" text-anchor="middle">局部骨架动作 X</text><text x="177.5" y="292.0" class="small" text-anchor="middle">关节位置 / 旋转 / 速度</text><rect x="350" y="220" width="260" height="100" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="480.0" y="262.0" class="small" text-anchor="middle">卷积编码器</text><text x="480.0" y="292.0" class="small" text-anchor="middle">时序潜在特征 c</text><rect x="700" y="205" width="435" height="110" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="917.5" y="237.0" class="small" text-anchor="middle">时间分支</text><text x="917.5" y="267.0" class="small" text-anchor="middle">单通道信号 → FFT / 频率估计</text><text x="917.5" y="297.0" class="small" text-anchor="middle">中心相位 φ、频率 f</text><rect x="700" y="380" width="435" height="110" rx="13" fill="#fbefdc" stroke="#9eb6ca" stroke-width="1.6"/><text x="917.5" y="412.0" class="small" text-anchor="middle">Gram 矩阵 Gᵢⱼ = ⟨cᵢ,cⱼ⟩</text><text x="917.5" y="442.0" class="small" text-anchor="middle">MLP 分成幅值 Ã 与风格 s</text><text x="917.5" y="472.0" class="small" text-anchor="middle">Ã → VQ 码本 A；s 连续且不量化</text><path d="M300 270 H350" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M610 250 H700" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M610 290 H655 V435 H700" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><rect x="785" y="565" width="350" height="100" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="960.0" y="592.0" class="small" text-anchor="middle">p(τ) = Ψ(A, φ + fτ)</text><text x="960.0" y="622.0" class="small" text-anchor="middle">m(τ) = (p(τ), s)</text><text x="960.0" y="652.0" class="small" text-anchor="middle">椭圆进度 + 连续风格</text><rect x="385" y="575" width="295" height="85" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="532.5" y="609.5" class="small" text-anchor="middle">风格注入 + 卷积解码</text><text x="532.5" y="639.5" class="small" text-anchor="middle">重建原局部动作</text><rect x="55" y="575" width="235" height="85" rx="13" fill="#eaf4e9" stroke="#9eb6ca" stroke-width="1.6"/><text x="172.5" y="609.5" class="small" text-anchor="middle">重建 X̃</text><text x="172.5" y="639.5" class="small" text-anchor="middle">重建 / 量化损失</text><path d="M1135 260 H1152 V535 H1020 V565" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M918 490 V565" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M785 615 H680" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M385 615 H290" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><text x="55" y="390" class="small" text-anchor="start">A：从有限码本选择内容结构</text><text x="55" y="420" class="small" text-anchor="start">φ：连续周期进度</text><text x="55" y="450" class="small" text-anchor="start">s ∈ [0,1]：局部稳定风格</text><text x="55" y="715" class="note" text-anchor="start">训练后保留编码得到的逐帧 m；平均姿态 MLP 仅用于分析，不是最终动作生成器。</text><rect x="25" y="780" width="1150" height="385" rx="20" fill="white" stroke="#c9d7e3" stroke-width="2"/><text x="48" y="819" class="head" text-anchor="start">B  离线扩散训练：两个模型各自预测干净目标</text><text x="48" y="855" class="small" text-anchor="start">全卷积条件 1D U-Net + AdaGN；稠密条件拼接，无交叉注意力</text><rect x="55" y="890" width="320" height="90" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="215.0" y="927.0" class="small" text-anchor="middle">带噪 zₜ + 冻结 CLIP 文本</text><text x="215.0" y="957.0" class="small" text-anchor="middle">z 含类别 / 相位 / s / r</text><rect x="430" y="890" width="310" height="90" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="585.0" y="927.0" class="small" text-anchor="middle">Text2Phase U-Net</text><text x="585.0" y="957.0" class="small" text-anchor="middle">扩散步 t → 干净 z₀</text><rect x="795" y="890" width="340" height="90" rx="13" fill="#eaf4e9" stroke="#9eb6ca" stroke-width="1.6"/><text x="965.0" y="927.0" class="small" text-anchor="middle">监督：真实中间表示</text><text x="965.0" y="957.0" class="small" text-anchor="middle">去噪重建损失</text><path d="M375 935 H430" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M740 935 H795" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><rect x="55" y="1030" width="320" height="90" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="215.0" y="1067.0" class="small" text-anchor="middle">带噪 Oₜ + 条件 m、r</text><text x="215.0" y="1097.0" class="small" text-anchor="middle">O 含局部姿态 / 根 / 接触</text><rect x="430" y="1030" width="310" height="90" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="585.0" y="1067.0" class="small" text-anchor="middle">Phase2Motion U-Net</text><text x="585.0" y="1097.0" class="small" text-anchor="middle">扩散步 t → 干净 O₀</text><rect x="795" y="1030" width="340" height="90" rx="13" fill="#eaf4e9" stroke="#9eb6ca" stroke-width="1.6"/><text x="965.0" y="1067.0" class="small" text-anchor="middle">监督：真实动作与接触</text><text x="965.0" y="1097.0" class="small" text-anchor="middle">去噪重建 + 滑动损失</text><path d="M375 1075 H430" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M740 1075 H795" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><rect x="25" y="1195" width="1150" height="700" rx="20" fill="white" stroke="#c9d7e3" stroke-width="2"/><text x="48" y="1234" class="head" text-anchor="start">C  推理与编辑：三个入口，共用同一可编辑中间层</text><text x="48" y="1270" class="small" text-anchor="start">模型参数复用；编辑控制信号后重新采样，未修改的原关节不做硬复制</text><rect x="55" y="1310" width="310" height="105" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="210.0" y="1339.5" class="small" text-anchor="middle">文本提示 + 随机噪声</text><text x="210.0" y="1369.5" class="small" text-anchor="middle">CLIP → Text2Phase</text><text x="210.0" y="1399.5" class="small" text-anchor="middle">迭代去噪 → 类别 / φ / s / r</text><rect x="445" y="1310" width="310" height="105" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="600.0" y="1339.5" class="small" text-anchor="middle">已有源动作</text><text x="600.0" y="1369.5" class="small" text-anchor="middle">复用表示编码器</text><text x="600.0" y="1399.5" class="small" text-anchor="middle">提取 m 与根路径 r</text><rect x="835" y="1310" width="300" height="105" rx="13" fill="#fbefdc" stroke="#9eb6ca" stroke-width="1.6"/><text x="985.0" y="1339.5" class="small" text-anchor="middle">人工编排控制</text><text x="985.0" y="1369.5" class="small" text-anchor="middle">选类别、相位、风格</text><text x="985.0" y="1399.5" class="small" text-anchor="middle">绘制 / 修改根路径</text><rect x="335" y="1505" width="800" height="110" rx="13" fill="#fbefdc" stroke="#9eb6ca" stroke-width="1.6"/><text x="735.0" y="1552.0" class="small" text-anchor="middle">编辑层：相位序列 m = (p, s) 与根路径 r</text><text x="735.0" y="1582.0" class="small" text-anchor="middle">重复 / 删除 / 拼接 / 重排；改变相位频率；调整风格；改路径</text><path d="M210 1415 V1460 H470 V1505" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M600 1415 V1505" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M985 1415 V1505" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><rect x="55" y="1685" width="250" height="90" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="180.0" y="1722.0" class="small" text-anchor="middle">随机动作噪声</text><text x="180.0" y="1752.0" class="small" text-anchor="middle">扩散初始状态</text><rect x="390" y="1685" width="370" height="90" rx="13" fill="#e7f0fa" stroke="#9eb6ca" stroke-width="1.6"/><text x="575.0" y="1722.0" class="small" text-anchor="middle">Phase2Motion 迭代去噪</text><text x="575.0" y="1752.0" class="small" text-anchor="middle">输入条件：编辑后的 m、r</text><rect x="860" y="1670" width="275" height="120" rx="13" fill="#eaf4e9" stroke="#9eb6ca" stroke-width="1.6"/><text x="997.5" y="1707.0" class="small" text-anchor="middle">完整动作</text><text x="997.5" y="1737.0" class="small" text-anchor="middle">局部姿态 + 根运动</text><text x="997.5" y="1767.0" class="small" text-anchor="middle">脚接触预测</text><path d="M735 1615 V1685" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M305 1730 H390" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><path d="M760 1730 H860" fill="none" stroke="#406f91" stroke-width="2.6" marker-end="url(#arr)" /><text x="55" y="1840" class="note" text-anchor="start">只用相位生成 ≠ 从文本开始生成；两者原表输入条件与结果分别报告。</text><text x="50" y="1930" class="note" text-anchor="start">控制边界：接触损失和路径条件是软约束；不提供硬端点、任意关节轨迹或细节保持保证。</text><text x="50" y="1962" class="note" text-anchor="start">论文设置：1D 风格、K = 512、嵌入维数 128；100/1000 扩散步的文内差异见正文。</text><text x="50" y="1994" class="note" text-anchor="start">来源：正式图 2–4、§3 与附录 A–D。公开代码的根维度、训练命令差异另列；未运行模型。</text></svg>