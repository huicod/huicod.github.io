<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="2080" viewBox="0 0 1040 2080" role="img" aria-labelledby="title desc"><title id="title">MECo：动作示例控制共语手势</title><desc id="desc">分别训练分部动作 tokenizer 和三阶段语言模型；推理将语音、参考动作、历史动作送入语言模型，经采样和分部解码输出完整动作。图片视频文字先经过外部转换。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#49675a"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#244034}.line{fill:none;stroke:#49675a;stroke-width:2.2;marker-end:url(#a)}.dash{fill:none;stroke:#a17b48;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#a)}</style><rect width="1040" height="2080" fill="white"/>
<text x="40" y="45" font-size="30" font-weight="700" text-anchor="start">MECo · 用动作示例指导语音手势</text>
<text x="40" y="80" font-size="19" font-weight="400" text-anchor="start">论文架构教学示意：参考动作成分可组合，具体时序由语音与历史共同生成。</text>
<rect x="24" y="110" width="992" height="260" rx="15" fill="#f8faf7" stroke="#d8e2d8"/>
<text x="48" y="146" font-size="23" font-weight="700" text-anchor="start">A  动作 tokenizer 训练</text>
<rect x="60" y="180" width="270" height="115" rx="12" fill="#fff3e5" stroke="#d3ba96" stroke-width="1.5"/>
<text x="195.0" y="211" font-size="21" font-weight="700" text-anchor="middle">成对语音与动作数据</text>
<text x="195.0" y="239" font-size="18" font-weight="400" text-anchor="middle">BEAT2 / ZeroEGGS</text>
<text x="195.0" y="264" font-size="18" font-weight="400" text-anchor="middle">动作分为上身、下身、手部</text>
<rect x="385" y="180" width="295" height="115" rx="12" fill="#e8f4ea" stroke="#93b79d" stroke-width="1.5"/>
<text x="532.5" y="211" font-size="21" font-weight="700" text-anchor="middle">三个独立 RQ-VAE</text>
<text x="532.5" y="239" font-size="18" font-weight="400" text-anchor="middle">重建训练 + 残差层 dropout</text>
<text x="532.5" y="264" font-size="18" font-weight="400" text-anchor="middle">时间下采样 4 倍</text>
<rect x="735" y="180" width="245" height="115" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="857.5" y="211" font-size="21" font-weight="700" text-anchor="middle">训练后保留模块</text>
<text x="857.5" y="239" font-size="18" font-weight="400" text-anchor="middle">分部编码器与解码器</text>
<text x="857.5" y="264" font-size="18" font-weight="400" text-anchor="middle">生成阶段只用基层</text>
<path d="M330 238 H385" class="line"/>
<path d="M680 238 H735" class="line"/>
<text x="520" y="337" font-size="19" font-weight="400" text-anchor="middle">训练使用残差量化；后续 LLM 不预测整套残差层，也没有额外残差补全。</text>
<rect x="24" y="405" width="992" height="340" rx="15" fill="#f8faf7" stroke="#d8e2d8"/>
<text x="48" y="441" font-size="23" font-weight="700" text-anchor="start">B  扩展 Qwen 词表并分三阶段微调</text>
<rect x="60" y="480" width="270" height="175" rx="12" fill="#e8f4ea" stroke="#93b79d" stroke-width="1.5"/>
<text x="195.0" y="511" font-size="21" font-weight="700" text-anchor="middle">① 新 token 初始化</text>
<text x="195.0" y="539" font-size="18" font-weight="400" text-anchor="middle">语音 / 动作各自预测下一码</text>
<text x="195.0" y="564" font-size="18" font-weight="400" text-anchor="middle">冻结 LLM 主体</text>
<text x="195.0" y="589" font-size="18" font-weight="400" text-anchor="middle">训练嵌入与输出投影</text>
<rect x="385" y="480" width="295" height="175" rx="12" fill="#e8f4ea" stroke="#93b79d" stroke-width="1.5"/>
<text x="532.5" y="511" font-size="21" font-weight="700" text-anchor="middle">② 语音 → 动作</text>
<text x="532.5" y="539" font-size="18" font-weight="400" text-anchor="middle">user：语音 token</text>
<text x="532.5" y="564" font-size="18" font-weight="400" text-anchor="middle">assistant：目标动作 token</text>
<text x="532.5" y="589" font-size="18" font-weight="400" text-anchor="middle">LLM 全参数微调</text>
<rect x="735" y="480" width="245" height="175" rx="12" fill="#e8f4ea" stroke="#93b79d" stroke-width="1.5"/>
<text x="857.5" y="511" font-size="21" font-weight="700" text-anchor="middle">③ 示例 + 语音 → 动作</text>
<text x="857.5" y="539" font-size="18" font-weight="400" text-anchor="middle">示例去重 / 打乱 / dropout</text>
<text x="857.5" y="564" font-size="18" font-weight="400" text-anchor="middle">加入示例外 token 惩罚</text>
<text x="857.5" y="589" font-size="18" font-weight="400" text-anchor="middle">继续全参数微调</text>
<path d="M330 568 H385" class="line"/>
<path d="M680 568 H735" class="line"/>
<text x="520" y="704" font-size="18" font-weight="400" text-anchor="middle">训练监督：对应的真实动作 token；示例条件从目标动作构造，打断时序复制。</text>
<rect x="24" y="790" width="992" height="1190" rx="15" fill="#f8faf7" stroke="#d8e2d8"/>
<text x="48" y="826" font-size="23" font-weight="700" text-anchor="start">C  推理：语音、示例与历史合流，生成并解码动作</text>
<rect x="60" y="865" width="270" height="100" rx="12" fill="#fff3e5" stroke="#d3ba96" stroke-width="1.5"/>
<text x="195.0" y="896" font-size="21" font-weight="700" text-anchor="middle">输入语音</text>
<text x="195.0" y="924" font-size="18" font-weight="400" text-anchor="middle">新说话音频</text>
<rect x="385" y="865" width="295" height="100" rx="12" fill="#fff3e5" stroke="#d3ba96" stroke-width="1.5"/>
<text x="532.5" y="896" font-size="21" font-weight="700" text-anchor="middle">输入动作示例</text>
<text x="532.5" y="924" font-size="18" font-weight="400" text-anchor="middle">可给不同身体部位不同参考</text>
<rect x="735" y="865" width="245" height="100" rx="12" fill="#fff3e5" stroke="#d3ba96" stroke-width="1.5"/>
<text x="857.5" y="896" font-size="21" font-weight="700" text-anchor="middle">可选其他控制输入</text>
<text x="857.5" y="924" font-size="18" font-weight="400" text-anchor="middle">图片 / 视频 / 文字</text>
<rect x="60" y="1020" width="270" height="100" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="195.0" y="1051" font-size="21" font-weight="700" text-anchor="middle">HuBERT 音频 tokenizer</text>
<text x="195.0" y="1079" font-size="18" font-weight="400" text-anchor="middle">50 Hz 离散语音单元</text>
<rect x="385" y="1020" width="295" height="100" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="532.5" y="1051" font-size="21" font-weight="700" text-anchor="middle">分部动作 tokenizer</text>
<text x="532.5" y="1079" font-size="18" font-weight="400" text-anchor="middle">上身 / 下身 / 手部基层码</text>
<rect x="735" y="1020" width="245" height="100" rx="12" fill="#f2edfa" stroke="#b9abd0" stroke-width="1.5"/>
<text x="857.5" y="1051" font-size="21" font-weight="700" text-anchor="middle">外部转换或检索</text>
<text x="857.5" y="1079" font-size="18" font-weight="400" text-anchor="middle">图像 / 视频 → 姿态或动作</text>
<text x="857.5" y="1104" font-size="18" font-weight="400" text-anchor="middle">文字 → 标注匹配 / TMR</text>
<path d="M195 965 V1020" class="line"/>
<path d="M532 965 V1020" class="line"/>
<path d="M857 965 V1020" class="line"/>
<path d="M735 1070 H680" class="line"/>
<rect x="385" y="1200" width="295" height="125" rx="12" fill="#fff3e5" stroke="#d3ba96" stroke-width="1.5"/>
<text x="532.5" y="1231" font-size="21" font-weight="700" text-anchor="middle">组织模型提示</text>
<text x="532.5" y="1259" font-size="18" font-weight="400" text-anchor="middle">system：示例动作成分</text>
<text x="532.5" y="1284" font-size="18" font-weight="400" text-anchor="middle">user：新语音 token</text>
<text x="532.5" y="1309" font-size="18" font-weight="400" text-anchor="middle">assistant 前缀：动作历史</text>
<rect x="735" y="1185" width="245" height="100" rx="12" fill="#fff3e5" stroke="#d3ba96" stroke-width="1.5"/>
<text x="857.5" y="1216" font-size="21" font-weight="700" text-anchor="middle">初始姿态 / 前段历史</text>
<text x="857.5" y="1244" font-size="18" font-weight="400" text-anchor="middle">下一段沿用末尾三个码</text>
<path d="M195 1120 V1260 H385" class="line"/>
<path d="M532 1120 V1200" class="line"/>
<path d="M735 1235 H680" class="line"/>
<rect x="385" y="1380" width="295" height="100" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="532.5" y="1411" font-size="21" font-weight="700" text-anchor="middle">Qwen2.5-0.5B-Instruct</text>
<text x="532.5" y="1439" font-size="18" font-weight="400" text-anchor="middle">逐个预测后续动作 token</text>
<text x="532.5" y="1464" font-size="18" font-weight="400" text-anchor="middle">复用三阶段训练的参数</text>
<path d="M532 1325 V1380" class="line"/>
<path d="M857 655 V767 H1001 V1430 H680" class="dash"/>
<rect x="793.5" y="755" width="101" height="25" rx="4" fill="white"/>
<text x="844" y="773" font-size="17" font-weight="400" text-anchor="middle">训练后复用</text>
<rect x="385" y="1535" width="295" height="100" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="532.5" y="1566" font-size="21" font-weight="700" text-anchor="middle">示例偏置采样</text>
<text x="532.5" y="1594" font-size="18" font-weight="400" text-anchor="middle">提高示例码概率</text>
<text x="532.5" y="1619" font-size="18" font-weight="400" text-anchor="middle">抑制总重复同一码</text>
<rect x="60" y="1535" width="270" height="100" rx="12" fill="#fff3e5" stroke="#d3ba96" stroke-width="1.5"/>
<text x="195.0" y="1566" font-size="21" font-weight="700" text-anchor="middle">用户可调采样参数</text>
<text x="195.0" y="1594" font-size="18" font-weight="400" text-anchor="middle">默认 β = 5，γ = 0.9</text>
<text x="195.0" y="1619" font-size="18" font-weight="400" text-anchor="middle">概率偏好，不是硬约束</text>
<path d="M532 1480 V1535" class="line"/>
<path d="M330 1585 H385" class="line"/>
<rect x="60" y="1705" width="270" height="100" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="195.0" y="1736" font-size="21" font-weight="700" text-anchor="middle">上身动作解码器</text>
<text x="195.0" y="1764" font-size="18" font-weight="400" text-anchor="middle">上身基层 token → 动作</text>
<rect x="385" y="1705" width="295" height="100" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="532.5" y="1736" font-size="21" font-weight="700" text-anchor="middle">下身动作解码器</text>
<text x="532.5" y="1764" font-size="18" font-weight="400" text-anchor="middle">下身基层 token → 动作</text>
<rect x="735" y="1705" width="245" height="100" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="857.5" y="1736" font-size="21" font-weight="700" text-anchor="middle">手部动作解码器</text>
<text x="857.5" y="1764" font-size="18" font-weight="400" text-anchor="middle">手部基层 token → 动作</text>
<path d="M532 1635 V1668 H195 V1705" class="line"/>
<path d="M532 1668 V1705" class="line"/>
<path d="M532 1668 H857 V1705" class="line"/>
<rect x="290" y="1870" width="460" height="75" rx="12" fill="#fff3e5" stroke="#d3ba96" stroke-width="1.5"/>
<text x="520.0" y="1901" font-size="21" font-weight="700" text-anchor="middle">组合为完整的共语身体动作</text>
<path d="M195 1805 V1840 H520 V1870" class="line"/>
<path d="M532 1805 V1840" class="line"/>
<path d="M857 1805 V1840 H520" class="line"/>
<text x="40" y="2020" font-size="18" font-weight="400" text-anchor="start">绿色：训练阶段　蓝色：复用模块　紫色：外部工具　虚线：训练参数复用</text>
<text x="40" y="2053" font-size="18" font-weight="400" text-anchor="start">非因果动作 tokenizer → 离线生成；图不表示精确轨迹保证、脸部生成或已验证实时系统。</text>
</svg>