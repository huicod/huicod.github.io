<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1480" viewBox="0 0 1560 1480" role="img" aria-label="StreamTalk｜生成 → 检索末尾姿态 → 修正 → 下一窗口"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657a"/></marker><marker id="train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9875b6"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#203148} .title{font-size:36px;font-weight:700} .sub{font-size:23px;fill:#617085} .group{font-size:27px;font-weight:700} .node{font-size:26px;font-weight:700} .body{font-size:23px} .edge{font-size:21px;fill:#53677e} .tiny{font-size:21px;fill:#617085}</style><rect width="1560" height="1480" fill="#ffffff"/><text x="48" y="58" class="title" text-anchor="start">StreamTalk｜生成 → 检索末尾姿态 → 修正 → 下一窗口</text><text x="48" y="96" class="sub" text-anchor="start">依据 arXiv:2608.01643v1 图 2–3、算法 1；补充公开推理 / 采样代码的软条件边界。</text><rect x="30" y="125" width="1500" height="260" rx="20" fill="#f6f1fa" stroke="#d9e2eb" stroke-width="2"/><text x="52" y="165" class="group" text-anchor="start">A  训练与离线准备</text><rect x="60" y="195" width="330" height="145" rx="13" fill="#fff5e8" stroke="#d9a265" stroke-width="2"/><text x="225.0" y="233" class="node" text-anchor="middle">训练集语音与动作</text><text x="225.0" y="270" class="body" text-anchor="middle">BEAT2 配对数据</text><text x="225.0" y="301" class="body" text-anchor="middle">测试未来动作不入库</text><rect x="500" y="195" width="470" height="145" rx="13" fill="#f5edfb" stroke="#ad91c4" stroke-width="2"/><text x="735.0" y="233" class="node" text-anchor="middle">SAM 独立随机掩码</text><text x="735.0" y="270" class="body" text-anchor="middle">Pose / Translation prompts</text><text x="735.0" y="301" class="body" text-anchor="middle">回归 + FK + prompt 损失</text><rect x="1080" y="195" width="410" height="145" rx="13" fill="#edf3fd" stroke="#84a7d4" stroke-width="2"/><text x="1285.0" y="233" class="node" text-anchor="middle">按人物建立姿态库</text><text x="1285.0" y="270" class="body" text-anchor="middle">训练集旋转 → FK 关节</text><text x="1285.0" y="301" class="body" text-anchor="middle">不借用库中世界平移</text><path d="M 390 250 L 500 250" fill="none" stroke="#9875b6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#train)"/><text x="418" y="238" class="edge" text-anchor="start">监督</text><path d="M 390 320 L 440 320 L 440 362 L 1280 362 L 1280 340" fill="none" stroke="#9875b6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#train)"/><text x="710" y="352" class="edge" text-anchor="start">离线构建</text><rect x="30" y="415" width="1500" height="930" rx="20" fill="#f4f7fa" stroke="#d9e2eb" stroke-width="2"/><text x="52" y="455" class="group" text-anchor="start">B  60 帧窗口循环</text><rect x="60" y="485" width="330" height="135" rx="13" fill="#fff5e8" stroke="#d9a265" stroke-width="2"/><text x="225.0" y="523" class="node" text-anchor="middle">当前 2 秒语音窗口</text><text x="225.0" y="560" class="body" text-anchor="middle">WavLM 1024维</text><text x="225.0" y="591" class="body" text-anchor="middle">窗口内可见完整音频</text><rect x="500" y="485" width="470" height="135" rx="13" fill="#edf3fd" stroke="#84a7d4" stroke-width="2"/><text x="735.0" y="523" class="node" text-anchor="middle">音频 → 脸部预测</text><text x="735.0" y="560" class="body" text-anchor="middle">4 层 Transformer</text><text x="735.0" y="591" class="body" text-anchor="middle">音频 + 预测 expression</text><rect x="1080" y="485" width="410" height="135" rx="13" fill="#fff5e8" stroke="#d9a265" stroke-width="2"/><text x="1285.0" y="523" class="node" text-anchor="middle">人物 ID + 历史 8 帧</text><text x="1285.0" y="560" class="body" text-anchor="middle">Pose / Trans 分开输入</text><text x="1285.0" y="591" class="body" text-anchor="middle">首段由示例姿态初始化</text><path d="M 390 550 L 500 550" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 1080 550 L 970 550" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="1010" y="535" class="edge" text-anchor="start">ID</text><path d="M 500 300 L 450 300 L 450 700 L 470 700 L 470 720" fill="none" stroke="#9875b6" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#train)"/><text x="460" y="400" class="edge" text-anchor="start">训练后复用</text><rect x="60" y="720" width="470" height="180" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="295.0" y="758" class="node" text-anchor="middle">① 三分支 DiT 粗生成</text><text x="295.0" y="795" class="body" text-anchor="middle">Hands / Body / Translation</text><text x="295.0" y="826" class="body" text-anchor="middle">10 步 flow，预测干净动作</text><text x="295.0" y="857" class="body" text-anchor="middle">缓存全部中间态 x₀ … x₁</text><rect x="635" y="720" width="365" height="180" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="817.5" y="758" class="node" text-anchor="middle">② FK 近邻检索</text><text x="817.5" y="795" class="body" text-anchor="middle">粗末 8 帧择 1 帧</text><text x="817.5" y="826" class="body" text-anchor="middle">同人物训练姿态库</text><text x="817.5" y="857" class="body" text-anchor="middle">恢复原平移 / 朝向</text><rect x="1100" y="720" width="390" height="180" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="1295.0" y="758" class="node" text-anchor="middle">③ 加锚点并修正</text><text x="1295.0" y="795" class="body" text-anchor="middle">锚点写入 pose prompt</text><text x="1295.0" y="826" class="body" text-anchor="middle">从缓存 xN/2 重跑后半程</text><text x="1295.0" y="857" class="body" text-anchor="middle">最终输出不做锚点硬覆盖</text><path d="M 735 620 L 735 650 L 295 650 L 295 720" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="465" y="640" class="edge" text-anchor="start">音频—面部条件</text><path d="M 1285 620 L 1285 675 L 530 675 L 530 760" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="1005" y="663" class="edge" text-anchor="start">ID / 历史 prompts</text><path d="M 530 810 L 635 810" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="548" y="795" class="edge" text-anchor="start">粗片段</text><path d="M 1000 810 L 1100 810" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="1005" y="795" class="edge" text-anchor="start">末尾锚点</text><path d="M 1285 340 L 1510 340 L 1510 700 L 1015 700 L 1015 750 L 1000 750" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="1310" y="687" class="edge" text-anchor="start">训练姿态库</text><path d="M 295 900 L 295 965 L 1295 965 L 1295 900" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="635" y="952" class="edge" text-anchor="start">缓存中点 + 同一音频条件</text><rect x="60" y="1105" width="470" height="160" rx="13" fill="#fff5e8" stroke="#d9a265" stroke-width="2"/><text x="295.0" y="1143" class="node" text-anchor="middle">下一窗口历史</text><text x="295.0" y="1180" class="body" text-anchor="middle">修正结果的末 8 帧</text><text x="295.0" y="1211" class="body" text-anchor="middle">保存 pose + translation</text><rect x="635" y="1105" width="365" height="160" rx="13" fill="#f2f5f8" stroke="#9cabbc" stroke-width="2"/><text x="817.5" y="1143" class="node" text-anchor="middle">连续动作输出</text><text x="817.5" y="1180" class="body" text-anchor="middle">重叠区平均 / 拼接</text><text x="817.5" y="1211" class="body" text-anchor="middle">SMPL-X .npz</text><rect x="1100" y="1105" width="390" height="160" rx="13" fill="#ecf7f1" stroke="#72ac91" stroke-width="2"/><text x="1295.0" y="1143" class="node" text-anchor="middle">修正后 60 帧</text><text x="1295.0" y="1180" class="body" text-anchor="middle">学习式 inpainting</text><text x="1295.0" y="1211" class="body" text-anchor="middle">表达 / 姿态 / 根平移</text><path d="M 1295 900 L 1450 900 L 1450 1105" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="1305" y="1040" class="edge" text-anchor="start">修正片段</text><path d="M 1100 1185 L 1000 1185" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 635 1185 L 530 1185" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 60 1185 L 45 1185 L 45 465 L 1120 465 L 1120 485" fill="none" stroke="#52657a" stroke-width="3"  marker-end="url(#arrow)"/><text x="75" y="1070" class="edge" text-anchor="start">下一轮</text><text x="55" y="1400" class="body" text-anchor="start">控制边界：锚点是训练姿态的软条件；闭环不感知场景，也不保证精确接触或任意关键帧零误差。</text><text x="48" y="1445" class="tiny" text-anchor="start">教学重绘 · 实线：推理表示流   虚线：训练 / 复用   蓝：冻结或复用   绿：学习模块   紫：训练专用</text></svg>