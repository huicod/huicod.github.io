<text x="275.0" y="1527" font-size="18" font-weight="400" text-anchor="middle" class="sub">EBR 编译奖励，复用 Meta Motivo</text>
<text x="275.0" y="1551" font-size="18" font-weight="400" text-anchor="middle" class="sub">在 HumEnv 中生成新的动作样本</text>
<rect x="550" y="1470" width="430" height="104" rx="12" fill="#e8f4eb" stroke="#8fb79b" stroke-width="1.6"/>
