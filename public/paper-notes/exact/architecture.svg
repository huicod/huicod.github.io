<text x="520" y="955" font-size="19" font-weight="400" text-anchor="middle" class="">训练损失：程序语言建模 + 0.15 × 动作—语言 InfoNCE 对齐</text>
<rect x="851.0" y="771" width="120" height="25" fill="#fff" rx="4"/>
