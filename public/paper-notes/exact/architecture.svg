<text x="765.0" y="1527" font-size="18" font-weight="400" text-anchor="middle" class="sub">同一解析器输出查询程序</text>
<text x="765.0" y="1551" font-size="18" font-weight="400" text-anchor="middle" class="sub">不需要仿真重演查询动作</text>
