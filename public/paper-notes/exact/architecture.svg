<text x="192.5" y="879" font-size="18" font-weight="400" text-anchor="middle" class="sub">骨架关系 + 时间变化</text>
<text x="192.5" y="903" font-size="18" font-weight="400" text-anchor="middle" class="sub">全参数训练</text>
<rect x="385" y="822" width="295" height="92" rx="12" fill="#e8f4eb" stroke="#8fb79b" stroke-width="1.6"/>
<text x="532.5" y="852" font-size="21" font-weight="700" text-anchor="middle" class="">Qwen2.5-Coder-3B</text>
<text x="532.5" y="879" font-size="18" font-weight="400" text-anchor="middle" class="sub">动作特征作为前缀</text>
<text x="532.5" y="903" font-size="18" font-weight="400" text-anchor="middle" class="sub">LoRA 微调 + 语法约束</text>
<rect x="740" y="822" width="240" height="92" rx="12" fill="#fff3e4" stroke="#d2b995" stroke-width="1.6"/>
<text x="860.0" y="852" font-size="21" font-weight="700" text-anchor="middle" class="">预测程序文本</text>
<text x="860.0" y="879" font-size="18" font-weight="400" text-anchor="middle" class="sub">输出节点、目标、区间</text>
<text x="860.0" y="903" font-size="18" font-weight="400" text-anchor="middle" class="sub">语法合法 ≠ 语义正确</text>
