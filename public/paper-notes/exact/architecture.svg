<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1940" viewBox="0 0 1040 1940" role="img" aria-labelledby="title desc">
<title id="title">ExAct：合成监督、动作解析与可执行行为表示</title>
<desc id="desc">人工定义程序语言；预训练 Meta Motivo 执行奖励生成程序动作对；训练 ST-GCN 与 Qwen LoRA 解析器；真实训练集按标签聚合程序成 EBR；分别用于合成分割数据和程序距离评估。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9Z" fill="#52695e"/></marker><marker id="dasharrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9Z" fill="#a27946"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#233d32}.sub{fill:#586b61}.line{fill:none;stroke:#52695e;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#a27946;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#dasharrow)}</style><rect width="1040" height="1940" fill="#fff"/>
<text x="40" y="45" font-size="30" font-weight="700" text-anchor="start" class="">ExAct · 从可执行程序到动作理解</text>
<text x="40" y="80" font-size="19" font-weight="400" text-anchor="start" class="sub">程序指定部分位置目标；控制先验补足动作；解析器再把观察转回程序。</text>
<rect x="24" y="110" width="992" height="510" rx="15" fill="#f8faf7" stroke="#d7e2d9" stroke-width="1.5"/>
<text x="48" y="145" font-size="23" font-weight="700" text-anchor="start" class="">A  构建合成监督</text>
<text x="990" y="145" font-size="17" font-weight="400" text-anchor="end" class="sub">控制模型预训练后复用，不逐个任务重新训练</text>
<rect x="60" y="175" width="270" height="102" rx="12" fill="#fff" stroke="#becdc2" stroke-width="1.6"/>
<text x="195.0" y="205" font-size="21" font-weight="700" text-anchor="middle" class="">人工定义 ExAct DSL</text>
<text x="195.0" y="232" font-size="18" font-weight="400" text-anchor="middle" class="sub">节点 + 坐标轴 + 目标值</text>
<text x="195.0" y="256" font-size="18" font-weight="400" text-anchor="middle" class="sub">时间区间与顺序组合</text>
<rect x="385" y="175" width="270" height="102" rx="12" fill="#fff3e4" stroke="#d2b995" stroke-width="1.6"/>
<text x="520.0" y="205" font-size="21" font-weight="700" text-anchor="middle" class="">采样程序</text>
<text x="520.0" y="232" font-size="18" font-weight="400" text-anchor="middle" class="sub">变化片段数、谓词与时长</text>
<text x="520.0" y="256" font-size="18" font-weight="400" text-anchor="middle" class="sub">保留程序作为监督答案</text>
<rect x="710" y="175" width="270" height="102" rx="12" fill="#fff" stroke="#becdc2" stroke-width="1.6"/>
<text x="845.0" y="205" font-size="21" font-weight="700" text-anchor="middle" class="">程序编译为奖励</text>
<text x="845.0" y="232" font-size="18" font-weight="400" text-anchor="middle" class="sub">当前节点位置接近目标</text>
<text x="845.0" y="256" font-size="18" font-weight="400" text-anchor="middle" class="sub">同段多个目标共同约束</text>
<path d="M330 226 H385" class="line"/>
<path d="M655 226 H710" class="line"/>
<rect x="60" y="330" width="300" height="112" rx="12" fill="#eaf1fa" stroke="#9db7d0" stroke-width="1.6"/>
<text x="210.0" y="360" font-size="21" font-weight="700" text-anchor="middle" class="">Meta Motivo 控制先验</text>
<text x="210.0" y="387" font-size="18" font-weight="400" text-anchor="middle" class="sub">预训练 F/B 表示 + 策略</text>
<text x="210.0" y="411" font-size="18" font-weight="400" text-anchor="middle" class="sub">复用 50 万状态推理缓存</text>
<text x="210.0" y="435" font-size="18" font-weight="400" text-anchor="middle" class="sub">不属于新训练的解析器</text>
<rect x="425" y="330" width="555" height="112" rx="12" fill="#eaf1fa" stroke="#9db7d0" stroke-width="1.6"/>
<text x="702.5" y="360" font-size="21" font-weight="700" text-anchor="middle" class="">奖励重标定 → 行为条件 z → 仿真执行</text>
<text x="702.5" y="387" font-size="18" font-weight="400" text-anchor="middle" class="sub">策略读取当前状态与 z，HumEnv 推进身体</text>
<text x="702.5" y="411" font-size="18" font-weight="400" text-anchor="middle" class="sub">生成完整动作，未指定部位由先验补足</text>
<path d="M845 277 V330" class="line"/>
<path d="M360 386 H425" class="line"/>
<rect x="425" y="490" width="555" height="88" rx="12" fill="#fff3e4" stroke="#d2b995" stroke-width="1.6"/>
<text x="702.5" y="520" font-size="21" font-weight="700" text-anchor="middle" class="">合成的程序—动作配对数据</text>
<text x="702.5" y="547" font-size="18" font-weight="400" text-anchor="middle" class="sub">论文：50K 训练对 + 3K 超参数选择数据</text>
