<text x="195.0" y="1167" font-size="18" font-weight="400" text-anchor="middle" class="sub">输入骨架运动序列</text>
<rect x="385" y="1110" width="295" height="83" rx="12" fill="#e8f4eb" stroke="#8fb79b" stroke-width="1.6"/>
<text x="532.5" y="1140" font-size="21" font-weight="700" text-anchor="middle" class="">训练好的解析器</text>
<text x="532.5" y="1167" font-size="18" font-weight="400" text-anchor="middle" class="sub">ST-GCN → Qwen → 程序</text>
<rect x="735" y="1110" width="245" height="83" rx="12" fill="#fff3e4" stroke="#d2b995" stroke-width="1.6"/>
