<text x="760.0" y="1280" font-size="21" font-weight="700" text-anchor="middle" class="">按标签选取与聚合程序 → EBR</text>
<text x="760.0" y="1307" font-size="18" font-weight="400" text-anchor="middle" class="sub">保留多样程序；可执行的类别表示</text>
<path d="M330 1291 H540" class="line"/>
<path d="M857 1193 V1223 H760 V1250" class="line"/>
