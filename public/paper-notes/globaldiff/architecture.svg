<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2050" viewBox="0 0 1500 2050" role="img" aria-labelledby="title desc">
<title id="title">GlobalDiff：全局旋转生成与多层结构监督</title><desc id="desc">上方训练比较虚拟锚点、骨角矩阵与时序VAE特征。下方音频及表情驱动手指和躯干双分支，直接生成全局旋转与平移；VAE不参与动作解码。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#506a80"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b6ca9"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#223950} .title{font-size:31px;font-weight:700} .heading{font-size:25px;font-weight:700} .label{font-size:21px;font-weight:700} .body{font-size:19px} .small{font-size:18px} .edge{fill:none;stroke:#506a80;stroke-width:2.5;marker-end:url(#a)} .train{fill:none;stroke:#8b6ca9;stroke-width:2.5;stroke-dasharray:9 6;marker-end:url(#b)}</style><rect width="1500" height="2050" fill="#fff"/>
<text x="40" y="49" class="title"><tspan x="40" dy="0">GlobalDiff | 直接生成全局旋转，用三层监督补回结构关系</tspan></text>
<text x="40" y="84" class="small"><tspan x="40" dy="0">教学重绘 · AAAI 2026 / arXiv:2511.10076v3，图 2 与式 1–15 · 原文方法 + 已核对公开训练实现</tspan></text>
<rect x="28" y="110" width="1444" height="575" rx="18" fill="#f8fafc" stroke="#cbd8e6" stroke-width="1.8"/>
<text x="52" y="150" class="heading"><tspan x="52" dy="0">A · 仅训练：预测和真值共同进入三层结构比较</tspan></text>
<rect x="55" y="185" width="290" height="105" rx="12" fill="#fff2da" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="73" y="217" class="label"><tspan x="73" dy="0">真实配对动作</tspan></text>
<text x="73" y="248" class="body"><tspan x="73" dy="0">局部旋转 + 根平移</tspan><tspan x="73" dy="29">配对音频 / 身份</tspan></text>
<rect x="395" y="185" width="290" height="105" rx="12" fill="#edf4fc" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="413" y="217" class="label"><tspan x="413" dy="0">坐标转换</tspan></text>
<text x="413" y="248" class="body"><tspan x="413" dy="0">local → global rotation</tspan><tspan x="413" dy="29">得到干净全局真值 x₁</tspan></text>
<rect x="735" y="185" width="290" height="105" rx="12" fill="#edf4fc" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="753" y="217" class="label"><tspan x="753" dy="0">噪声插值</tspan></text>
<text x="753" y="248" class="body"><tspan x="753" dy="0">噪声 x₀ ↔ 真值 x₁</tspan><tspan x="753" dy="29">形成训练状态 xₜ</tspan></text>
<rect x="1075" y="185" width="365" height="105" rx="12" fill="#e5f5ed" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="1093" y="217" class="label"><tspan x="1093" dy="0">调用下方同一双分支模型</tspan></text>
<text x="1093" y="248" class="body"><tspan x="1093" dy="0">预测干净全局动作 x̂₁</tspan><tspan x="1093" dy="29">保持条件与 seed 接口一致</tspan></text>
<path d="M345 238H395" class="train"/>
<path d="M685 238H735" class="train"/>
<path d="M1025 238H1075" class="train"/>
<text x="55" y="333" class="small"><tspan x="55" dy="0">以下三路均比较 x̂₁ 与 x₁；监督目标是训练真值，不是推理输入的外部目标。</tspan></text>
<rect x="55" y="370" width="425" height="158" rx="12" fill="#f2edf7" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="73" y="402" class="label"><tspan x="73" dy="0">① 关节朝向：虚拟锚点 Lⱼ</tspan></text>
<text x="73" y="433" class="body"><tspan x="73" dy="0">每个关节周围 6 个非共面点</tspan><tspan x="73" dy="29">分别用预测 / 真值旋转这些点</tspan><tspan x="73" dy="29">比较变换后的局部探针位置</tspan><tspan x="73" dy="29">末端关节原地转动也能被监督</tspan></text>
<rect x="535" y="370" width="425" height="158" rx="12" fill="#f2edf7" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="553" y="402" class="label"><tspan x="553" dy="0">② 骨架关系：角度矩阵 Lₛ</tspan></text>
<text x="553" y="433" class="body"><tspan x="553" dy="0">FK 得到关节 → 单位骨向量</tspan><tspan x="553" dy="29">所有骨对两两点积 Aᵢⱼ=bᵢᵀbⱼ</tspan><tspan x="553" dy="29">比较预测与真值 Angular Matrix</tspan><tspan x="553" dy="29">包含远距离骨骼之间的关系</tspan></text>
<rect x="1015" y="370" width="425" height="158" rx="12" fill="#f2edf7" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="1033" y="402" class="label"><tspan x="1033" dy="0">③ 时间结构：VAE 特征 Lₘ</tspan></text>
<text x="1033" y="433" class="body"><tspan x="1033" dy="0">共享预训练多尺度 VAE encoder</tspan><tspan x="1033" dy="29">分别编码预测 / 真值序列</tspan><tspan x="1033" dy="29">比较时序特征；编码器冻结</tspan><tspan x="1033" dy="29">仅训练监督，不解码最终动作</tspan></text>
<path d="M1260 290V349H267V370" class="train"/>
<path d="M747 349V370" class="train"/>
<path d="M1227 349V370" class="train"/>
<rect x="450" y="574" width="600" height="78" rx="12" fill="#f2edf7" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="468" y="606" class="label"><tspan x="468" dy="0">生成器总训练目标</tspan></text>
<text x="468" y="637" class="body"><tspan x="468" dy="0">基础旋转 / 平移回归 + 关节 / 骨架 / 时序结构项</tspan></text>
<path d="M267 528V552H750V574" class="train"/>
<path d="M747 528V574" class="train"/>
<path d="M1227 528V552H750" class="train"/>
<rect x="28" y="715" width="1444" height="275" rx="18" fill="#f8fafc" stroke="#cbd8e6" stroke-width="1.8"/>
<text x="52" y="755" class="heading"><tspan x="52" dy="0">B · 条件准备：音频与人物身份先生成面部表情</tspan></text>
<rect x="55" y="792" width="265" height="110" rx="12" fill="#fff2da" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="73" y="824" class="label"><tspan x="73" dy="0">语音波形</tspan></text>
<text x="73" y="855" class="body"><tspan x="73" dy="0">冻结 WavLM 提取特征</tspan><tspan x="73" dy="29">对齐动作时间轴</tspan></text>
<rect x="385" y="792" width="270" height="110" rx="12" fill="#fff2da" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="403" y="824" class="label"><tspan x="403" dy="0">人物身份 ID</tspan></text>
<text x="403" y="855" class="body"><tspan x="403" dy="0">已给定的说话者标签</tspan><tspan x="403" dy="29">同时用于动作分支调制</tspan></text>
<rect x="720" y="792" width="345" height="110" rx="12" fill="#edf4fc" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="738" y="824" class="label"><tspan x="738" dy="0">冻结语音—表情预测器</tspan></text>
<text x="738" y="855" class="body"><tspan x="738" dy="0">WavLM 特征 + speaker ID</tspan><tspan x="738" dy="29">输出 100 维表情系数</tspan></text>
<rect x="1130" y="792" width="310" height="110" rx="12" fill="#edf4fc" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="1148" y="824" class="label"><tspan x="1148" dy="0">共享生成条件 c</tspan></text>
<text x="1148" y="855" class="body"><tspan x="1148" dy="0">声学特征 + 预测表情</tspan><tspan x="1148" dy="29">两条动作分支均可读取</tspan></text>
<path d="M320 835H350V775H890V792" class="edge"/>
<path d="M655 835H720" class="edge"/>
<path d="M1065 847H1130" class="edge"/>
<path d="M320 875H350V938H1457V850H1440" class="edge"/>
<text x="55" y="969" class="small"><tspan x="55" dy="0">表情属于单独预测的输出，也成为身体生成条件。没有输入转写文本、LLM 动作计划或检索动作库。</tspan></text>
<rect x="28" y="1020" width="1444" height="820" rx="18" fill="#f8fafc" stroke="#cbd8e6" stroke-width="1.8"/>
<text x="52" y="1060" class="heading"><tspan x="52" dy="0">C · 推理：连续全局动作的双分支 flow matching</tspan></text>
<rect x="55" y="1105" width="305" height="135" rx="12" fill="#fff2da" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="73" y="1137" class="label"><tspan x="73" dy="0">带噪全局动作 xₜ</tspan></text>
<text x="73" y="1168" class="body"><tspan x="73" dy="0">55 个关节 × rot6d + 平移</tspan><tspan x="73" dy="29">每帧 333 维连续量</tspan><tspan x="73" dy="29">从噪声初始化</tspan></text>
<rect x="55" y="1282" width="305" height="135" rx="12" fill="#fff2da" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="73" y="1314" class="label"><tspan x="73" dy="0">seed 动作 / t / ID</tspan></text>
<text x="73" y="1345" class="body"><tspan x="73" dy="0">8 帧 seed 延续前段状态</tspan><tspan x="73" dy="29">与时间、身份提供生成上下文</tspan><tspan x="73" dy="29">后续片段复用前段末 8 帧</tspan></text>
<rect x="455" y="1105" width="510" height="135" rx="12" fill="#e5f5ed" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="473" y="1137" class="label"><tspan x="473" dy="0">手指分支</tspan></text>
<text x="473" y="1168" class="body"><tspan x="473" dy="0">30 个手指关节 + 完整带噪动作 + c</tspan><tspan x="473" dy="29">投影 → Motion Generation Blocks</tspan><tspan x="473" dy="29">预测干净手指全局旋转</tspan></text>
<rect x="455" y="1300" width="510" height="135" rx="12" fill="#e5f5ed" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="473" y="1332" class="label"><tspan x="473" dy="0">躯干 / 其余关节与平移分支</tspan></text>
<text x="473" y="1363" class="body"><tspan x="473" dy="0">自身部位 + 完整带噪动作 + c</tspan><tspan x="473" dy="29">覆盖手腕；使用相同条件接口</tspan><tspan x="473" dy="29">DiT 式生成块 → 干净预测</tspan></text>
<rect x="1060" y="1205" width="380" height="135" rx="12" fill="#e5f5ed" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="1078" y="1237" class="label"><tspan x="1078" dy="0">合并干净全局动作 x̂₁</tspan></text>
<text x="1078" y="1268" class="body"><tspan x="1078" dy="0">55 关节全局旋转 + 根平移</tspan><tspan x="1078" dy="29">直接运动空间预测</tspan><tspan x="1078" dy="29">不是潜变量 VAE 解码</tspan></text>
<path d="M360 1160H455" class="edge"/>
<path d="M395 1160V1326H455" class="edge"/>
<path d="M360 1350H410V1208H455" class="edge"/>
<path d="M410 1350H455" class="edge"/>
<path d="M965 1170H1007V1240H1060" class="edge"/>
<path d="M965 1365H1007V1300H1060" class="edge"/>
<path d="M1285 902V1078H710V1105" class="edge"/>
<path d="M990 1078V1270H710V1300" class="edge"/>
<rect x="1060" y="1410" width="380" height="110" rx="12" fill="#edf4fc" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="1078" y="1442" class="label"><tspan x="1078" dy="0">条件 flow 采样更新</tspan></text>
<text x="1078" y="1473" class="body"><tspan x="1078" dy="0">用干净预测更新当前噪声状态</tspan><tspan x="1078" dy="29">重复采样直至生成完整片段</tspan></text>
<path d="M1250 1340V1410" class="edge"/>
<path d="M1440 1470H1457V1005H40V1160H55" class="edge"/>
<rect x="1060" y="1605" width="380" height="135" rx="12" fill="#e5f5ed" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="1078" y="1637" class="label"><tspan x="1078" dy="0">角色输出与连续播放</tspan></text>
<text x="1078" y="1668" class="body"><tspan x="1078" dy="0">全局 → 角色所需局部骨架表示</tspan><tspan x="1078" dy="29">与 100 维表情组合 / SMPL-X</tspan><tspan x="1078" dy="29">输出连续动作，不需训练真值</tspan></text>
<path d="M1250 1520V1605" class="edge"/>
<rect x="455" y="1605" width="510" height="135" rx="12" fill="#edf4fc" stroke="#b7c9dc" stroke-width="1.8"/>
<text x="473" y="1637" class="label"><tspan x="473" dy="0">下一片段的条件</tspan></text>
<text x="473" y="1668" class="body"><tspan x="473" dy="0">从当前已生成片段取末 8 帧</tspan><tspan x="473" dy="29">作为下一段 seed，再生成新动作</tspan><tspan x="473" dy="29">分段衔接不等于逐帧因果音频</tspan></text>
<path d="M1060 1670H965" class="edge"/>
<path d="M455 1670H400V1465H205V1417" class="edge"/>
<text x="55" y="1789" class="small"><tspan x="55" dy="0">变化的是旋转预测坐标系：不再连乘预测的局部旋转；关节位置仍沿骨架路径累加，根平移也可能有误差。</tspan></text>
<text x="40" y="1900" class="small"><tspan x="40" dy="0">实线：推理与条件；虚线：训练监督。橙色：输入；蓝色：复用 / 条件；绿色：动作生成；紫色：训练目标。</tspan></text>
<text x="40" y="1940" class="small"><tspan x="40" dy="0">虚拟锚点、角度矩阵和时序特征均为软训练约束；不是推理中的场景目标、碰撞求解或接触保证。</tspan></text>
<text x="40" y="1980" class="small"><tspan x="40" dy="0">读图：先沿 B → C 走完音频到动作，再回看 A 的三路监督；VAE 没有出现在推理生成主线上。</tspan></text>
<text x="40" y="2020" class="small"><tspan x="40" dy="0">来源：原文图 2 / 式 5–15；公开 train.py 与 SMPLXConfig.py。本文未加载模型权重或运行生成。</tspan></text>
</svg>