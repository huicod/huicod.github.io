<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1256" width="960" height="1256" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">UniMo 如何一起生成视频与三维动作？</title>
  <desc id="desc">Cosmos 编码图像和视频，训练时从 SMPL-X 身体参数学习一个向量量化动作编码器。单图任务将参考图放在前缀，交替生成同一时间段的视频码和动作码。捕捉任务把整段视频放在前缀，只生成动作码。共用的自回归 Transformer 给两种模态各自的嵌入和旋转位置编码。视觉解码器恢复视频，动作码经四个参数解码器恢复三维身体。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203b3b}
      .title{font-size:33px;font-weight:700}.section{font-size:23px;font-weight:700;fill:#285d57}
      .head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#405b59}
      .chip{font-size:17px;font-weight:650;text-anchor:middle;dominant-baseline:central}
      .vision{fill:#eaf2fa;stroke:#9fbed4}.motion{fill:#fcf1e2;stroke:#d5b381}
      .task{fill:#f5f8f8;stroke:#bccdcd}.model{fill:#edf5ef;stroke:#a4beaf}
      .training{fill:#f5f0f7;stroke:#c9b8d0}.block{stroke-width:1.4}
      .tag{fill:#dae4e5;stroke:#b2c2c3}.start{fill:#fff;stroke:#95aba9;stroke-dasharray:4 3}
      .lead,.branch{fill:none;stroke:#4a6c67;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .lead{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4a6c67"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="1254" rx="16" fill="white" stroke="#c6d4d3"/>
  <text class="title" x="38" y="54">UniMo 如何一起生成视频与三维动作？</text>
  <text class="body" x="39" y="88">同一模型有两种读法。从一张图续写人物动作，或从整段视频捕捉人物已经做出的动作。</text>

  <text class="section" x="38" y="141">把两种观测变成离散码</text>
  <g class="card">
    <rect class="block vision" x="38" y="162" width="388" height="164" rx="12"/>
    <text class="head" x="56" y="194">视觉码　来自图像或视频</text>
    <text class="body" x="56" y="228">Cosmos 视觉分词器编码像素。</text>
    <text class="body" x="56" y="261">视频时、高、宽三个方向分别</text>
    <text class="body" x="56" y="288">压缩 8、16、16 倍。</text>
  </g>
  <g class="card">
    <rect class="block motion" x="444" y="162" width="478" height="164" rx="12"/>
    <text class="head" x="462" y="194">动作码　训练阶段来自三维身体参数</text>
    <text class="body" x="462" y="228">取身体姿态、体形、全局朝向和平移四组参数。</text>
    <text class="body" x="462" y="259">一维卷积编码并沿时间展开，查同一个码本。</text>
    <text class="body" x="462" y="290">每帧用 36 个码表示，每个码可取 512 个值。</text>
  </g>

  <text class="section" x="38" y="380">任务标记决定给什么、接着生成什么</text>
  <text class="small" x="39" y="409">STG 是生成起点。它之前的序列是已知条件，之后是预测目标。下方每个视频块或动作块覆盖 16 帧。</text>
  <g class="card">
    <rect class="block task" x="38" y="430" width="884" height="122" rx="12"/>
    <text class="head" x="57" y="462">单图联合生成　I2VM</text>
    <g class="pills">
      <rect class="tag" x="57" y="483" width="48" height="36" rx="6"/><text class="chip" x="81" y="501">T2</text>
      <rect class="vision" x="114" y="483" width="106" height="36" rx="6"/><text class="chip" x="167" y="501">参考图</text>
      <rect class="start" x="231" y="483" width="65" height="36" rx="6"/><text class="chip" x="263.5" y="501">STG</text>
      <rect class="vision" x="316" y="483" width="111" height="36" rx="6"/><text class="chip" x="371.5" y="501">视频块 1</text>
      <rect class="motion" x="436" y="483" width="111" height="36" rx="6"/><text class="chip" x="491.5" y="501">动作块 1</text>
      <rect class="vision" x="558" y="483" width="111" height="36" rx="6"/><text class="chip" x="613.5" y="501">视频块 2</text>
      <rect class="motion" x="678" y="483" width="111" height="36" rx="6"/><text class="chip" x="733.5" y="501">动作块 2</text>
      <text class="chip" x="819" y="501">…</text>
    </g>
  </g>
  <g class="card">
    <rect class="block task" x="38" y="563" width="884" height="120" rx="12"/>
    <text class="head" x="57" y="595">视频动作捕捉　V2M</text>
    <g class="pills">
      <rect class="tag" x="57" y="615" width="48" height="36" rx="6"/><text class="chip" x="81" y="633">T1</text>
      <rect class="vision" x="114" y="615" width="235" height="36" rx="6"/><text class="chip" x="231.5" y="633">整段视频的所有视觉码</text>
      <rect class="start" x="360" y="615" width="65" height="36" rx="6"/><text class="chip" x="392.5" y="633">STG</text>
      <rect class="motion" x="446" y="615" width="111" height="36" rx="6"/><text class="chip" x="501.5" y="633">动作块 1</text>
      <rect class="motion" x="566" y="615" width="111" height="36" rx="6"/><text class="chip" x="621.5" y="633">动作块 2</text>
      <text class="chip" x="706" y="633">…</text>
    </g>
  </g>
  <path class="branch" d="M922 491H940V706H480 M922 623H940"/>
  <path class="lead" d="M480 706V728"/>
  <g class="card">
    <rect class="block model" x="38" y="731" width="884" height="151" rx="12"/>
    <text class="head" x="57" y="763">共享 Cosmos 自回归 Transformer　每次预测下一个离散码</text>
    <text class="body" x="57" y="799">视觉、动作分别查嵌入表。视觉用时空三轴 RoPE，动作用时间 RoPE。</text>
    <text class="body" x="57" y="829">整条序列另加绝对位置编码，使模型知道一个码在前缀与生成序列中的位置。</text>
    <text class="body" x="57" y="859">条件段可双向互看，目标段只看已给定的条件和先前的码。</text>
  </g>
  <path class="branch" d="M480 883V908 M230 908H680"/>
  <path class="lead" d="M230 908V929"/>
  <path class="lead" d="M680 908V929"/>
  <g class="card">
    <rect class="block vision" x="38" y="933" width="388" height="129" rx="12"/>
    <text class="head" x="56" y="966">视觉码 → 人物视频（仅 I2VM）</text>
    <text class="body" x="56" y="998">视觉解码器将码还原为视频帧。</text>
    <text class="body" x="56" y="1027">作者另用 SeedVR 改善生成画质。</text>
  </g>
  <g class="card">
    <rect class="block motion" x="444" y="933" width="478" height="129" rx="12"/>
    <text class="head" x="462" y="966">动作码 → SMPL-X 身体运动</text>
    <text class="body" x="462" y="998">四个解码器从同一串码分别恢复身体姿态、</text>
    <text class="body" x="462" y="1027">体形、全局朝向和平移。两项任务均输出动作。</text>
  </g>
  <g class="card">
    <rect class="block training" x="38" y="1090" width="884" height="110" rx="12"/>
    <text class="head" x="57" y="1122">怎样训练这两部分？</text>
    <text class="body" x="57" y="1153">先训练动作分词器，重建身体参数并监督速度、加速度和量化。</text>
    <text class="body" x="57" y="1180">再冻结动作分词器，将两项任务按 1∶1 混合，用目标段下一码的交叉熵训练共享模型。</text>
  </g>
  <text class="small" x="39" y="1232">据原文图 2、§3.1–3.3 与 §4.1 重绘。两种推理任务都从视觉条件出发，训练用的参考动作无需由用户提供。</text>
</svg>
