<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1530" role="img" aria-label="STREAM｜文字提供动作内容，音乐调节节奏关系"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526174"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#203047} .title{font-size:29px;font-weight:700} .section{font-size:23px;font-weight:700} .head{font-size:21px;font-weight:700} .body{font-size:18px} .small{font-size:16px} .line{fill:none;stroke:#526174;stroke-width:2.2;marker-end:url(#arr)} .dashed{stroke-dasharray:7 5}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="44" class="title" text-anchor="start">STREAM｜文字提供动作内容，音乐调节节奏关系</text><rect x="30" y="75" width="1220" height="240" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="108" class="section" text-anchor="start">A · 训练准备与监督</text><rect x="55" y="130" width="350" height="120" rx="10" fill="#fff" stroke="#aab9cc"/><text x="69" y="160" class="head" text-anchor="start">Motorica++标注</text><text x="69" y="187" class="body" text-anchor="start">舞者：逐帧舞步技术标签</text><text x="69" y="212" class="body" text-anchor="start">Gemini辅助说明 → TMR过滤</text><text x="69" y="237" class="body" text-anchor="start">人工修正；183种舞步技术</text><rect x="455" y="130" width="350" height="120" rx="10" fill="#fff" stroke="#aab9cc"/><text x="469" y="160" class="head" text-anchor="start">统一动作与时间窗口</text><text x="469" y="187" class="body" text-anchor="start">Motorica拟合到SMPL</text><text x="469" y="212" class="body" text-anchor="start">5秒 × 30fps；1秒滑窗</text><text x="469" y="237" class="body" text-anchor="start">干净运动 x₀ ＋ 随机加噪</text><rect x="855" y="130" width="370" height="120" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="869" y="160" class="head" text-anchor="start">训练BEAM去噪网络</text><text x="869" y="187" class="body" text-anchor="start">预测x₀；位置／速度／脚滑损失</text><text x="869" y="212" class="body" text-anchor="start">随机屏蔽条件以学习CFG</text><text x="869" y="237" class="body" text-anchor="start">更新投影、BEAM和输出层</text><path d="M405 190H455" class="line"/><path d="M805 190H855" class="line"/><text x="55" y="285" class="small" text-anchor="start">专业标注提供监督；用户的编辑区间是运行时输入，不是模型自动发现的事件边界。</text><rect x="30" y="345" width="1220" height="410" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="378" class="section" text-anchor="start">B · 单窗口生成：分路编码 → BEAM去噪器 → 连续运动</text><rect x="55" y="400" width="340" height="110" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="69" y="430" class="head" text-anchor="start">文字：高层概念＋低层描述</text><text x="69" y="457" class="body" text-anchor="start">舞步名称／动作细节</text><text x="69" y="482" class="body" text-anchor="start">预训练CLIP分别编码 → 投影</text><rect x="55" y="550" width="340" height="110" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="69" y="580" class="head" text-anchor="start">音乐：固定的节奏参考</text><text x="69" y="607" class="body" text-anchor="start">预训练Jukebox → 30Hz特征</text><text x="69" y="632" class="body" text-anchor="start">投影为音乐条件 cₘ</text><rect x="465" y="400" width="360" height="110" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="479" y="430" class="head" text-anchor="start">带噪运动 xₜ ＋ 时间步 t</text><text x="479" y="457" class="body" text-anchor="start">输入嵌入＋位置／时间编码</text><text x="479" y="482" class="body" text-anchor="start">UNet式去噪器：9个BEAM</text><rect x="895" y="400" width="330" height="110" rx="10" fill="#fff" stroke="#aab9cc"/><text x="909" y="430" class="head" text-anchor="start">直接预测干净运动 x̂₀</text><text x="909" y="457" class="body" text-anchor="start">SMPL根平移、6D旋转等</text><text x="909" y="482" class="body" text-anchor="start">没有离散动作token解码</text><path d="M395 455H465" class="line"/><text x="416" y="442" class="small" text-anchor="start">cₜ</text><path d="M395 605H435V485H465" class="line"/><text x="401" y="564" class="small" text-anchor="start">cₘ</text><path d="M825 455H895" class="line"/><rect x="465" y="565" width="360" height="100" rx="10" fill="#fff" stroke="#aab9cc"/><text x="479" y="595" class="head" text-anchor="start">分层CFG · 三种预测</text><text x="479" y="622" class="body" text-anchor="start">无条件 → 仅文字 → 文字＋音乐</text><text x="479" y="647" class="body" text-anchor="start">λₜ文字增量 ＋ λₘ音乐增量</text><rect x="895" y="565" width="330" height="100" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="909" y="595" class="head" text-anchor="start">反向扩散与运动输出</text><text x="909" y="622" class="body" text-anchor="start">构造xₜ₋₁，反复至t=0</text><text x="909" y="647" class="body" text-anchor="start">恢复SMPL运动／渲染</text><path d="M1060 510V540H645V565" class="line"/><path d="M825 610H895" class="line"/><path d="M1060 665V705H850V380H645V400" class="line"/><text x="885" y="728" class="small" text-anchor="start">下一噪声级</text><path d="M1030 315V330H655V400" class="line dashed"/><text x="670" y="325" class="small" text-anchor="start">复用训练权重</text><rect x="30" y="790" width="1220" height="390" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="823" class="section" text-anchor="start">C · 展开一个BEAM：文本调制、双能量注意力、非对称条件更新</text><rect x="55" y="850" width="250" height="115" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="880" class="head" text-anchor="start">① Text-AdaLN</text><text x="69" y="907" class="body" text-anchor="start">文字产生缩放γ与偏移β</text><text x="69" y="932" class="body" text-anchor="start">直接调制运动特征</text><text x="69" y="957" class="body" text-anchor="start">接Transformer编码层</text><rect x="355" y="850" width="490" height="115" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="369" y="880" class="head" text-anchor="start">② D-EBCA：双能量交叉注意力</text><text x="369" y="907" class="body" text-anchor="start">Q来自动作；Kₜ、Vₜ来自文字；Kₘ来自音乐</text><text x="369" y="932" class="body" text-anchor="start">A = QKₜᵀ ＋ γₘ QKₘᵀ</text><text x="369" y="957" class="body" text-anchor="start">Softmax(A/√d)Vₜ − γd · ∇Q R</text><rect x="895" y="850" width="330" height="115" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="909" y="880" class="head" text-anchor="start">③ 文字上下文更新</text><text x="909" y="907" class="body" text-anchor="start">运动query吸引＋正则化</text><text x="909" y="932" class="body" text-anchor="start">仅更新嵌入，不改写文字</text><text x="909" y="957" class="body" text-anchor="start">新cₜ再次调制动作</text><path d="M305 907H355" class="line"/><path d="M845 907H895" class="line"/><rect x="355" y="1010" width="490" height="115" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="369" y="1040" class="head" text-anchor="start">音乐drift：关联相似时间位置</text><text x="369" y="1067" class="body" text-anchor="start">Sₘ = 归一化Kₘ × 归一化Kₘᵀ</text><text x="369" y="1092" class="body" text-anchor="start">屏蔽对角线；归一化drift稳定幅度</text><text x="369" y="1117" class="body" text-anchor="start">音乐也进入A，不能简化成只有Sₘ路径</text><path d="M605 1010V965" class="line"/><text x="620" y="994" class="small" text-anchor="start">∇Q R</text><rect x="895" y="1010" width="330" height="115" rx="10" fill="#fff" stroke="#aab9cc"/><text x="909" y="1040" class="head" text-anchor="start">下一BEAM层</text><text x="909" y="1067" class="body" text-anchor="start">传递更新的文字上下文</text><text x="909" y="1092" class="body" text-anchor="start">音乐上下文保持不变</text><text x="909" y="1117" class="body" text-anchor="start">运动特征继续处理</text><path d="M1060 965V1010" class="line"/><text x="55" y="1158" class="small" text-anchor="start">实线是前向计算；BEAM提供结构偏置，不构成指定舞步、脚接触或几何目标的硬保证。</text><rect x="30" y="1210" width="1220" height="250" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="1243" class="section" text-anchor="start">D · 可选长序列／局部编辑：带历史的滑窗采样</text><rect x="55" y="1270" width="340" height="110" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="1300" class="head" text-anchor="start">用户修改标签区间</text><text x="69" y="1327" class="body" text-anchor="start">选择舞步／描述／时间范围</text><text x="69" y="1352" class="body" text-anchor="start">音乐保持或替换</text><rect x="455" y="1270" width="400" height="110" rx="10" fill="#fff" stroke="#aab9cc"/><text x="469" y="1300" class="head" text-anchor="start">5秒窗口，每次前进2.5秒</text><text x="469" y="1327" class="body" text-anchor="start">重叠旋转前缀按噪声级回注</text><text x="469" y="1352" class="body" text-anchor="start">文本CFG由历史区向新区间渐强</text><rect x="915" y="1270" width="310" height="110" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="929" y="1300" class="head" text-anchor="start">边界接续与展示</text><text x="929" y="1327" class="body" text-anchor="start">旋转匹配＋SLERP</text><text x="929" y="1352" class="body" text-anchor="start">根平移不由前缀混合固定</text><path d="M395 1325H455" class="line"/><path d="M855 1325H915" class="line"/><text x="55" y="1425" class="small" text-anchor="start">教学示意依据：原文图2、式6–12、附录§9–10；条件编码为预训练特征，生成器为任务训练。</text><text x="40" y="1495" class="small" text-anchor="start">“保留语义”由学习目标与评测器衡量；EDS=1或Stext=1不是动作执行成功率。</text></svg>