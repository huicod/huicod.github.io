<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="3180" viewBox="0 0 1320 3180" role="img" aria-labelledby="title desc">
<title id="title">RAG-Gesture：先检索语义示例，再引导连续动作扩散</title>
<desc id="desc">四区展示四部位时间感知VAE与基础扩散的离线训练，两种候选检索路线，DDIM反演和局部噪声初始化，以及对当前噪声latent的检索引导和解码。按论文方法绘制，当前公开实现的额外覆写差异在正文独立解释。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="context-stroke"/></marker></defs>
<style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#243a4b}.title{font-size:32px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:20px}</style>
<rect width="1320" height="3180" fill="white"/>
<text x="60" y="52" class="title">RAG-Gesture：把检索到的语义手势融入生成</text>
<text x="60" y="94" class="body">CVPR 2025｜论文方法重绘：检索增强发生在推理时，基础 VAE / 扩散模型需要训练</text>
<rect x="60" y="130" width="1200" height="620" rx="15" fill="#f2f7fb" stroke="#bdd0da" stroke-width="1.5"/>
<text x="90" y="172" class="head">A · 离线训练：先学四部位表示，再学语音条件扩散</text>
<text x="90" y="208" class="small">连续 VAE latent，不是离散姿态码；基础模型学习自然运动与音频、文本、身份的对应。</text>
<rect x="90" y="255" width="330" height="160" rx="15" fill="#eaf3fb" stroke="#bdd0da" stroke-width="1.5"/>
<text x="108" y="289" class="head">真实动作序列 x</text>
<text x="108" y="323" class="body">上身／双手／面部</text>
<text x="108" y="352" class="body">下身 + 根平移 + 足部接触</text>
<text x="108" y="381" class="body">15 fps；10 秒 = 150 帧</text>
<rect x="470" y="245" width="350" height="180" rx="15" fill="#f0ebfa" stroke="#bdd0da" stroke-width="1.5"/>
<text x="488" y="279" class="head">四套时间感知 VAE</text>
<text x="488" y="313" class="body">每 15 帧编码为一个 latent</text>
<text x="488" y="342" class="body">分块编码，联合解码重建</text>
<text x="488" y="371" class="body">重建／几何／运动损失 + KL</text>
<text x="488" y="400" class="body">训练好后冻结 E 与 D</text>
<rect x="870" y="245" width="360" height="180" rx="15" fill="#eaf3fb" stroke="#bdd0da" stroke-width="1.5"/>
<text x="888" y="279" class="head">连续表示 z⁽⁰⁾</text>
<text x="888" y="313" class="body">每部位 10 个时间 token</text>
<text x="888" y="342" class="body">沿时间轴拼接 + 3 个分隔符</text>
<text x="888" y="371" class="body">总长 43；部位按区段排列</text>
<text x="888" y="400" class="body">共同进入基础扩散模型</text>
<path d="M420,335 L470,335" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M820,335 L870,335" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="90" y="520" width="330" height="155" rx="15" fill="#fff2df" stroke="#bdd0da" stroke-width="1.5"/>
<text x="108" y="554" class="head">语音条件 C</text>
<text x="108" y="588" class="body">音频 → wav2vec2 特征</text>
<text x="108" y="617" class="body">逐词文本 → BERT 对齐特征</text>
<text x="108" y="646" class="body">说话人身份 → embedding</text>
<rect x="470" y="520" width="350" height="155" rx="15" fill="#f0ebfa" stroke="#bdd0da" stroke-width="1.5"/>
<text x="488" y="554" class="head">训练去噪网络 fθ</text>
<text x="488" y="588" class="body">读取 z⁽ᵗ⁾、t 和条件 C</text>
<text x="488" y="617" class="body">三模态 cross-attention</text>
<text x="488" y="646" class="body">预测干净 latent ẑ⁽⁰⁾</text>
<rect x="870" y="520" width="360" height="155" rx="15" fill="#eaf3fb" stroke="#bdd0da" stroke-width="1.5"/>
<text x="888" y="554" class="head">Gaussian 加噪</text>
<text x="888" y="588" class="body">真实 z⁽⁰⁾ → 噪声态 z⁽ᵗ⁾</text>
<text x="888" y="617" class="body">训练 1,000 个噪声时刻</text>
<text x="888" y="646" class="body">按时间步选择噪声强度</text>
<path d="M1050,425 L1050,520" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M870,595 L820,595" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M420,595 L470,595" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<text x="90" y="720" class="small">监督：预测干净 latent 与真实 z⁽⁰⁾ 的 MSE；完成后推理复用固定网络，不为每次检索再训练。</text>
<rect x="60" y="790" width="1200" height="770" rx="15" fill="#f7f3fb" stroke="#bdd0da" stroke-width="1.5"/>
<text x="90" y="832" class="head">B · 推理检索：两种替代路线，决定在哪个词使用什么示例</text>
<text x="90" y="868" class="small">两条路线共享输入与 BEAT2 检索库；图中顺序为论文给出的过滤与重排序顺序。</text>
<rect x="90" y="910" width="540" height="110" rx="15" fill="#fff2df" stroke="#bdd0da" stroke-width="1.5"/>
<text x="108" y="944" class="head">查询输入</text>
<text x="108" y="978" class="body">语音、逐词转录与时间位置、说话人身份</text>
<rect x="690" y="910" width="540" height="110" rx="15" fill="#eaf3fb" stroke="#bdd0da" stroke-width="1.5"/>
<text x="708" y="944" class="head">BEAT2 示例库</text>
<text x="708" y="978" class="body">动作、配套语音／转录／身份与手势类型标签</text>
<path d="M360,1040 L960,1040" fill="none" stroke="#72909e" stroke-width="2.3"/>
<path d="M360,1020 L360,1060" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M960,1020 L960,1060" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="90" y="1060" width="540" height="245" rx="15" fill="#f0ebfa" stroke="#bdd0da" stroke-width="1.5"/>
<text x="108" y="1094" class="head">路线 1 · LLM 预测词与手势类型</text>
<text x="108" y="1128" class="body">GPT-4o-mini 提示式调用，非微调</text>
<text x="108" y="1157" class="body">至多 2 个词 → 图像性／隐喻性／指示性</text>
<text x="108" y="1186" class="body">按类型标签筛选候选</text>
<text x="108" y="1215" class="body">同说话人优先 → 文本语义相似度</text>
<text x="108" y="1244" class="body">再按目标词的韵律显著性重排</text>
<rect x="690" y="1060" width="540" height="245" rx="15" fill="#f0ebfa" stroke="#bdd0da" stroke-width="1.5"/>
<text x="708" y="1094" class="head">路线 2 · 篇章关系检索</text>
<text x="708" y="1128" class="body">discopy 解析连接词及关系含义</text>
<text x="708" y="1157" class="body">按相同关系含义筛选候选</text>
<text x="708" y="1186" class="body">连接词相似度 → 同说话人优先</text>
<text x="708" y="1215" class="body">再按目标词的韵律显著性重排</text>
<text x="708" y="1244" class="body">例如：因果 since 可匹配 because</text>
<path d="M360,1305 L360,1360" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M960,1305 L960,1360" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="90" y="1360" width="1140" height="145" rx="15" fill="#e8f4ed" stroke="#bdd0da" stroke-width="1.5"/>
<text x="108" y="1394" class="head">输出排名最高的语义示例与窗口对应关系</text>
<text x="108" y="1428" class="body">返回动作 m，以及该示例的语音、转录和身份</text>
<text x="108" y="1457" class="body">标记检索窗口 [sᵣ,eᵣ] 与查询目标词附近窗口 [sᵩ,eᵩ]；需要匹配可插入的 latent 长度</text>
<text x="108" y="1486" class="body">动作来自数据库；LLM 给的是词与类型，不生成关节轨迹</text>
<rect x="60" y="1600" width="1200" height="580" rx="15" fill="#f2f7fb" stroke="#bdd0da" stroke-width="1.5"/>
<text x="90" y="1642" class="head">C · 将示例变成反演轨迹，再初始化局部噪声</text>
<text x="90" y="1678" class="small">先编码并反演整段检索动作，之后切出所需时间段；不是直接粘贴原始关节。</text>
<rect x="90" y="1730" width="320" height="160" rx="15" fill="#fff2df" stroke="#bdd0da" stroke-width="1.5"/>
<text x="108" y="1764" class="head">选中的检索动作 m</text>
<text x="108" y="1798" class="body">连同自身的音频／文本</text>
<text x="108" y="1827" class="body">和说话人条件 Cᵣ</text>
<text x="108" y="1856" class="body">确定检索片段窗口</text>
<rect x="460" y="1730" width="320" height="160" rx="15" fill="#eaf3fb" stroke="#bdd0da" stroke-width="1.5"/>
<text x="478" y="1764" class="head">冻结四部位编码器 E</text>
<text x="478" y="1798" class="body">m → 连续检索 latent r⁽⁰⁾</text>
<text x="478" y="1827" class="body">保持与基础模型一致</text>
<text x="478" y="1856" class="body">按同一时间网格定位</text>
<rect x="830" y="1730" width="400" height="160" rx="15" fill="#f0ebfa" stroke="#bdd0da" stroke-width="1.5"/>
<text x="848" y="1764" class="head">基础模型做 DDIM 反演</text>
<text x="848" y="1798" class="body">σ = 0 的确定性反演路径</text>
<text x="848" y="1827" class="body">r⁽⁰⁾ → r⁽¹⁾ → … → r⁽ᵀ⁾</text>
<text x="848" y="1856" class="body">保存每个噪声级 r⁽ᵗ⁾ 供后续引导</text>
<path d="M410,1810 L460,1810" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M780,1810 L830,1810" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M250,1730 L250,1705 L1030,1705 L1030,1730" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="90" y="1970" width="420" height="145" rx="15" fill="#eaf3fb" stroke="#bdd0da" stroke-width="1.5"/>
<text x="108" y="2004" class="head">查询序列独立噪声 z⁽ᵀ⁾</text>
<text x="108" y="2038" class="body">为整段待生成动作初始化</text>
<text x="108" y="2067" class="body">非检索位置仍从随机噪声开始</text>
<rect x="590" y="1970" width="640" height="145" rx="15" fill="#e8f4ed" stroke="#bdd0da" stroke-width="1.5"/>
<text x="608" y="2004" class="head">局部初始化 · 只转移上身与双手</text>
<text x="608" y="2038" class="body">z⁽ᵀ⁾[查询窗口] ← r⁽ᵀ⁾[检索窗口]</text>
<text x="608" y="2067" class="body">1 秒一枚时间 latent；不是连续逐帧精确对齐</text>
<text x="608" y="2096" class="body">面部／下身未被插入，但仍由基础模型共同生成</text>
<path d="M510,2040 L590,2040" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M1030,1890 L1030,1970" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="60" y="2220" width="1200" height="870" rx="15" fill="#f1f7f3" stroke="#bdd0da" stroke-width="1.5"/>
<text x="90" y="2262" class="head">D · 检索引导：在相同噪声级比较局部 latent，迭代到解码</text>
<text x="90" y="2298" class="small">以下按论文式 5–6 绘制；引导优化当前采样状态，不更新基础模型的参数。</text>
<rect x="90" y="2350" width="320" height="110" rx="15" fill="#fff2df" stroke="#bdd0da" stroke-width="1.5"/>
<text x="108" y="2384" class="head">反演轨迹中的 r⁽ᵗ⁾</text>
<text x="108" y="2418" class="body">取同一 t 的检索窗口</text>
<text x="108" y="2447" class="body">仅上身与双手通道</text>
<rect x="490" y="2350" width="340" height="110" rx="15" fill="#eaf3fb" stroke="#bdd0da" stroke-width="1.5"/>
<text x="508" y="2384" class="head">当前查询状态 z⁽ᵗ⁾</text>
<text x="508" y="2418" class="body">首步来自 C 区局部初始化</text>
<text x="508" y="2447" class="body">后续来自上一轮 DDIM</text>
<rect x="890" y="2350" width="340" height="110" rx="15" fill="#fff2df" stroke="#bdd0da" stroke-width="1.5"/>
<text x="908" y="2384" class="head">查询语音条件 Cᵩ</text>
<text x="908" y="2418" class="body">目标语音／逐词文本</text>
<text x="908" y="2447" class="body">说话人身份 + 时间步 t</text>
<rect x="90" y="2520" width="450" height="165" rx="15" fill="#f0ebfa" stroke="#bdd0da" stroke-width="1.5"/>
<text x="108" y="2554" class="head">局部检索损失与梯度更新</text>
<text x="108" y="2588" class="body">G = ‖z⁽ᵗ⁾[查询] − r⁽ᵗ⁾[检索]‖²</text>
<text x="108" y="2617" class="body">对当前噪声 latent z⁽ᵗ⁾ 求梯度</text>
<text x="108" y="2646" class="body">z̃⁽ᵗ⁾ = z⁽ᵗ⁾ − λ∇G</text>
<text x="108" y="2675" class="body">目标不是干净姿态或原始关节</text>
<rect x="620" y="2520" width="610" height="165" rx="15" fill="#f0ebfa" stroke="#bdd0da" stroke-width="1.5"/>
<text x="638" y="2554" class="head">固定去噪模型 + 一步 DDIM</text>
<text x="638" y="2588" class="body">fθ(z̃⁽ᵗ⁾, t, Cᵩ) 预测干净 latent ẑ⁽⁰⁾</text>
<text x="638" y="2617" class="body">常规 DDIM 更新到 z⁽ᵗ⁻¹⁾</text>
<text x="638" y="2646" class="body">继续读取对应的 r⁽ᵗ⁻¹⁾，重复到 t = 0</text>
<text x="638" y="2675" class="body">网络权重保持不变</text>
<path d="M250,2460 L250,2520" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M660,2460 L660,2490 L500,2490 L500,2520" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M1060,2460 L1060,2520" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M540,2600 L620,2600" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M1230,2600 L1245,2600 L1245,2325 L660,2325 L660,2350" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="90" y="2800" width="330" height="160" rx="15" fill="#fff2df" stroke="#bdd0da" stroke-width="1.5"/>
<text x="108" y="2834" class="head">用户调节检索影响</text>
<text x="108" y="2868" class="body">调节 λ、每步更新次数</text>
<text x="108" y="2897" class="body">以及哪些噪声时刻启用引导</text>
<text x="108" y="2926" class="body">没有指定空间／接触硬保证</text>
<rect x="490" y="2800" width="340" height="160" rx="15" fill="#e8f4ed" stroke="#bdd0da" stroke-width="1.5"/>
<text x="508" y="2834" class="head">最终 z⁽⁰⁾ → 四路 D</text>
<text x="508" y="2868" class="body">去除分隔符并拆分部位</text>
<text x="508" y="2897" class="body">冻结 VAE 解码器重建</text>
<text x="508" y="2926" class="body">恢复完整动作与面部通道</text>
<rect x="890" y="2800" width="340" height="160" rx="15" fill="#e8f4ed" stroke="#bdd0da" stroke-width="1.5"/>
<text x="908" y="2834" class="head">输出完整动作 x̂</text>
<text x="908" y="2868" class="body">语义示例与语音共同影响</text>
<text x="908" y="2897" class="body">未插入区域也参与生成</text>
<text x="908" y="2926" class="body">不承诺原动作逐帧硬保持</text>
<path d="M1060,2685 L1060,2740 L660,2740 L660,2800" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M830,2880 L890,2880" fill="none" stroke="#72909e" stroke-width="2.3" marker-end="url(#a)"/>
<text x="90" y="3030" class="small">增加检索影响可提高跟随程度，也可能损害自然度；权重不是动作执行成功率。</text>
<text x="60" y="3140" class="small">实线：数据／条件／采样迭代｜依据正式主文图 3–4、§3、补充 §5 重绘；公开实现差异另见正文</text>
</svg>