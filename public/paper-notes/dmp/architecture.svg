<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1780" viewBox="0 0 1200 1780" role="img"><title>DMP architecture</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#547c89"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="48" font-size="32" font-weight="700" fill="#193746">DMP 运动如何成形，又怎样到达目标</text><text x="42" y="86" font-size="21" font-weight="400" fill="#193746">同一组局部权重刻画途中形状。目标、动作快慢及外部反馈各有自己的入口。</text><rect x="24" y="116" width="1152" height="395" rx="16" fill="#f6f9fa" stroke="#c8d9dd" stroke-width="2"/><text x="47" y="152" font-size="27" font-weight="700" fill="#193746">A　从示范拟合形状权重</text><text x="47" y="185" font-size="21" font-weight="400" fill="#193746">位置、速度和加速度为监督，示范首尾与持续时间决定高层参数。</text><rect x="48" y="220" width="316" height="150" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="63" y="251" font-size="23" font-weight="700" fill="#193746">示范序列</text><text x="63" y="284" font-size="21" font-weight="400" fill="#193746">离散：起点、终点、时长</text><text x="63" y="313" font-size="21" font-weight="400" fill="#193746">周期：振荡中心、周期</text><rect x="445" y="220" width="310" height="150" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="460" y="251" font-size="23" font-weight="700" fill="#193746">反推动力学差额</text><text x="460" y="284" font-size="21" font-weight="400" fill="#193746">用示范导数和基础弹簧</text><text x="460" y="313" font-size="21" font-weight="400" fill="#193746">计算各时刻目标驱动</text><rect x="836" y="220" width="316" height="150" rx="16" fill="#e3f2ed" stroke="#c8d9dd" stroke-width="2"/><text x="851" y="251" font-size="23" font-weight="700" fill="#193746">局部加权回归</text><text x="851" y="284" font-size="21" font-weight="400" fill="#193746">每个自由度单独拟合</text><text x="851" y="313" font-size="21" font-weight="400" fill="#193746">每个核得到一个权重 wᵢ</text><path d="M 364,295 L 445,295" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 755,295 L 836,295" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="52" y="425" font-size="21" font-weight="400" fill="#193746">拟合目标：真实示范的加速度与基础弹簧–阻尼系统加速度之间，尚需补偿的部分。</text><text x="52" y="461" font-size="21" font-weight="400" fill="#193746">同一相位可供多个自由度共用；它们分别学习自己的形状。</text><rect x="24" y="548" width="1152" height="615" rx="16" fill="#f6f9fa" stroke="#c8d9dd" stroke-width="2"/><text x="47" y="584" font-size="27" font-weight="700" fill="#193746">B　在线积分生成期望运动</text><text x="47" y="617" font-size="21" font-weight="400" fill="#193746">选择离散或周期形式，给定起点、目标、时间尺度与需要的幅度。</text><rect x="48" y="655" width="316" height="175" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="63" y="686" font-size="23" font-weight="700" fill="#193746">规范系统产生相位</text><text x="63" y="719" font-size="21" font-weight="400" fill="#193746">离散 x 从 1 衰减至 0</text><text x="63" y="748" font-size="21" font-weight="400" fill="#193746">周期 φ 环绕推进</text><text x="63" y="777" font-size="21" font-weight="400" fill="#193746">可接入节拍或进度耦合</text><rect x="445" y="655" width="310" height="175" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="460" y="686" font-size="23" font-weight="700" fill="#193746">归一化基函数查权重</text><text x="460" y="719" font-size="21" font-weight="400" fill="#193746">离散用高斯核</text><text x="460" y="748" font-size="21" font-weight="400" fill="#193746">周期用圆周核</text><text x="460" y="777" font-size="21" font-weight="400" fill="#193746">得到相位依赖形状 W</text><rect x="836" y="655" width="316" height="175" rx="16" fill="#e3f2ed" stroke="#c8d9dd" stroke-width="2"/><text x="851" y="686" font-size="23" font-weight="700" fill="#193746">各自由度驱动 f</text><text x="851" y="719" font-size="21" font-weight="400" fill="#193746">离散 W·x·(g−y₀)</text><text x="851" y="748" font-size="21" font-weight="400" fill="#193746">周期 W·r</text><text x="851" y="777" font-size="21" font-weight="400" fill="#193746">共用相位，驱动各异</text><path d="M 364,742 L 445,742" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 755,742 L 836,742" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 994,370 L 1165,370 L 1165,635 L 600,635 L 600,655" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round" stroke-dasharray="8 6"/><rect x="48" y="925" width="316" height="155" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="63" y="956" font-size="23" font-weight="700" fill="#193746">运动参数</text><text x="63" y="989" font-size="21" font-weight="400" fill="#193746">目标或振荡中心 g</text><text x="63" y="1018" font-size="21" font-weight="400" fill="#193746">时间尺度 τ，当前状态</text><rect x="445" y="925" width="310" height="155" rx="16" fill="#e3f2ed" stroke="#c8d9dd" stroke-width="2"/><text x="460" y="956" font-size="23" font-weight="700" fill="#193746">二阶变换系统</text><text x="460" y="989" font-size="21" font-weight="400" fill="#193746">弹簧–阻尼＋驱动 f</text><text x="460" y="1018" font-size="21" font-weight="400" fill="#193746">可接入空间耦合 Cₜ</text><rect x="836" y="925" width="316" height="155" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="851" y="956" font-size="23" font-weight="700" fill="#193746">期望运动状态</text><text x="851" y="989" font-size="21" font-weight="400" fill="#193746">积分得到 y、ẏ、ÿ</text><text x="851" y="1018" font-size="21" font-weight="400" fill="#193746">离散到点，周期重复</text><path d="M 364,1000 L 445,1000" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 755,1000 L 836,1000" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 994,830 L 994,875 L 600,875 L 600,925" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="52" y="1125" font-size="21" font-weight="400" fill="#193746">离散分支的形状驱动最终衰减；固定参数、有界周期驱动在稳定系统中形成周期响应。</text><rect x="24" y="1200" width="1152" height="460" rx="16" fill="#f6f9fa" stroke="#c8d9dd" stroke-width="2"/><text x="47" y="1236" font-size="27" font-weight="700" fill="#193746">C　应用闭环：从参考运动到实际执行</text><text x="47" y="1269" font-size="21" font-weight="400" fill="#193746">机械臂实验使用独立跟踪控制，反馈可作用于 B 的时钟或运动方向。</text><rect x="48" y="1305" width="316" height="150" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="63" y="1336" font-size="23" font-weight="700" fill="#193746">B 的期望运动</text><text x="63" y="1369" font-size="21" font-weight="400" fill="#193746">关节或末端的参考状态</text><text x="63" y="1398" font-size="21" font-weight="400" fill="#193746">位置、速度、加速度</text><rect x="445" y="1305" width="310" height="150" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="460" y="1336" font-size="23" font-weight="700" fill="#193746">机器人跟踪器</text><text x="460" y="1369" font-size="21" font-weight="400" fill="#193746">例如 PD 反馈＋</text><text x="460" y="1398" font-size="21" font-weight="400" fill="#193746">前馈逆动力学</text><rect x="836" y="1305" width="316" height="150" rx="16" fill="#ffffff" stroke="#c8d9dd" stroke-width="2"/><text x="851" y="1336" font-size="23" font-weight="700" fill="#193746">实际机械臂与传感</text><text x="851" y="1369" font-size="21" font-weight="400" fill="#193746">执行控制并观测实际状态</text><text x="851" y="1398" font-size="21" font-weight="400" fill="#193746">测量目标、障碍或偏差</text><path d="M 364,1380 L 445,1380" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 755,1380 L 836,1380" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="48" y="1515" width="1104" height="110" rx="16" fill="#fcf4e7" stroke="#c8d9dd" stroke-width="2"/><text x="63" y="1546" font-size="23" font-weight="700" fill="#193746">反馈送回 B：目标变化更新 g，障碍影响 Cₜ，跟踪误差可放慢共同进度。</text><text x="63" y="1579" font-size="21" font-weight="400" fill="#193746">机器人能否安全跟踪，还依赖控制器、执行限制与具体的耦合项。</text><path d="M 994,1455 L 994,1515" fill="none" stroke="#547c89" stroke-width="3" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="42" y="1710" font-size="20" font-weight="400" fill="#193746">原理重绘　Ijspeert 等，Neural Computation 2013，图6、7及表1。</text><text x="42" y="1746" font-size="20" font-weight="400" fill="#193746">实线传递状态或条件，虚线表示使用阶段复用拟合权重。</text></g></svg>