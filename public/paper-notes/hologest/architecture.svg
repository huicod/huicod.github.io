<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 2240" role="img" aria-label="HoloGest训练与完整推理架构"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526174"/></marker></defs><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;fill:#203047}.t{font-size:29px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.n{font-size:16px}.a{fill:none;stroke:#526174;stroke-width:2.2;marker-end:url(#a)}.d{stroke:#628ec1;stroke-dasharray:7 5}</style><rect width="1280" height="2240" fill="white"/><text x="40" y="44" class="t">HoloGest｜先生成表达动作，再重做轨迹与手指</text><rect x="30" y="80" width="1220" height="445" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="115" class="h">A · 训练分区：语义对齐、扩散分布与动作先验分别学习</text><rect x="55" y="140" width="340" height="315" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="69" y="170" class="h">转写—动作对比学习</text><text x="69" y="200" class="b">语音 → wav2vec2转写</text><text x="69" y="226" class="b">文本侧＋Predictor ↔ motion VAE</text><text x="69" y="252" class="b">配对latent：NT-Xent对比目标</text><text x="69" y="278" class="b">训练后冻结语义对齐模块</text><text x="69" y="304" class="b">推理只部署转写侧</text><text x="69" y="330" class="b">真实动作编码器不进入推理</text><rect x="455" y="140" width="350" height="315" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="469" y="170" class="h">SIDD主生成器训练</text><text x="469" y="200" class="b">BEATX语音—动作配对</text><text x="469" y="226" class="b">真实前向态／生成反向态</text><text x="469" y="252" class="b">→ 条件GAN判别器</text><text x="469" y="278" class="b">对抗项＋x₀重建＋AFD</text><text x="469" y="304" class="b">更新大步去噪生成器</text><text x="469" y="330" class="b">判别器仅训练时使用</text><rect x="865" y="140" width="360" height="315" rx="10" fill="#eaf6ef" stroke="#aab9cc"/><text x="879" y="170" class="h">两类先验的额外训练</text><text x="879" y="200" class="b">轨迹：100-STYLE＋AMASS</text><text x="879" y="226" class="b">身体坐标 → 9维全局轨迹</text><text x="879" y="252" class="b">手指：SignAvatars＋BEATX</text><text x="879" y="278" class="b">预训练仅前臂旋转，无音频</text><text x="879" y="304" class="b">BEATX微调接回音频与语义</text><text x="879" y="330" class="b">学习式生成；没有物理模拟器</text><text x="55" y="495" class="n">语义、扩散与先验各有训练目标；虚线向下连接运行时复用的模块。</text><rect x="30" y="570" width="1220" height="425" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="605" class="h">B · 推理输入：同一语音的声学与转写语义，另带人物身份与seed</text><rect x="55" y="635" width="340" height="225" rx="10" fill="#fff1d4" stroke="#aab9cc"/><text x="69" y="665" class="h">用户音频</text><text x="69" y="695" class="b">语音波形</text><text x="69" y="721" class="b">ASR文本来自这一段语音</text><text x="69" y="747" class="b">不是独立导演动作指令</text><text x="69" y="773" class="b">没有用户目标轨迹输入</text><rect x="455" y="635" width="350" height="105" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="469" y="665" class="h">预训练WavLM</text><text x="469" y="695" class="b">声学特征 → 插值到动作帧率</text><rect x="455" y="790" width="350" height="145" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="469" y="820" class="h">冻结转写语义分支</text><text x="469" y="850" class="b">wav2vec2 → 文本编码</text><text x="469" y="876" class="b">线性映射＋Predictor</text><text x="469" y="902" class="b">输出语义latent</text><rect x="865" y="635" width="360" height="300" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="879" y="665" class="h">汇合条件c</text><text x="879" y="695" class="b">逐帧声学特征＋语义latent</text><text x="879" y="721" class="b">人物身份 → embedding</text><text x="879" y="747" class="b">扩散步t＋seed → 投影</text><text x="879" y="773" class="b">首次seed初始化；后窗复用尾帧</text><text x="879" y="799" class="b">不同条件供身体分支使用</text><text x="879" y="825" class="b">并非可执行动作事件程序</text><path d="M395 687H455" class="a"/><path d="M395 820H425V862H455" class="a"/><path d="M805 687H865" class="a"/><path d="M805 862H865" class="a"/><path d="M55 440H15V950H630V935" class="a d"/><text x="55" y="975" class="n">语义模块训练时有动作真值，运行时无动作真值；音乐迁移在论文中另作微调，非同权重保证。</text><rect x="30" y="1035" width="1220" height="415" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="1070" class="h">C · 第一阶段：半隐式分部位扩散，主实验使用50步</text><rect x="55" y="1100" width="340" height="170" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="69" y="1130" class="h">当前带噪动作xₜ</text><text x="69" y="1160" class="b">高斯噪声初始化</text><text x="69" y="1186" class="b">结合seed保持窗口衔接</text><text x="69" y="1212" class="b">输入条件c与扩散时间步</text><rect x="455" y="1100" width="350" height="170" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="469" y="1130" class="h">并行身体去噪分支</text><text x="469" y="1160" class="b">上身  │  下身  │  手指</text><text x="469" y="1186" class="b">各自学习局部动作分布</text><text x="469" y="1212" class="b">预测干净动作x̂₀</text><rect x="865" y="1100" width="360" height="170" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="879" y="1130" class="h">后验采样／反向更新</text><text x="879" y="1160" class="b">由x̂₀与当前状态得到xₜ₋₁</text><text x="879" y="1186" class="b">继续下一步，直到干净动作</text><text x="879" y="1212" class="b">判别器不参与此推理循环</text><rect x="455" y="1310" width="350" height="100" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="469" y="1340" class="h">共享global token</text><text x="469" y="1370" class="b">三分支特征拼接→映射</text><text x="469" y="1396" class="b">提供跨身体部位协调信息</text><path d="M395 1185H455" class="a"/><path d="M805 1185H865" class="a"/><path d="M630 1270V1310" class="a"/><path d="M805 1360H835V1240H805" class="a"/><path d="M1045 1270V1425H225V1270" class="a"/><text x="60" y="1402" class="n">下一扩散步：更新xₜ</text><path d="M1045 935V1015H835V1085H630V1100" class="a"/><path d="M805 440H835V540H1265V1080H805V1115" class="a d"/><rect x="30" y="1490" width="1220" height="390" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="1525" class="h">D · 第二阶段：用身体线索重新生成轨迹与手指</text><rect x="55" y="1555" width="340" height="225" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="69" y="1585" class="h">初步局部动作</text><text x="69" y="1615" class="b">关节旋转经FK得到坐标</text><text x="69" y="1641" class="b">抽取21个非根身体关节</text><text x="69" y="1667" class="b">另取前臂6D旋转</text><text x="69" y="1693" class="b">传递音频／语义给手指分支</text><rect x="455" y="1555" width="350" height="225" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="469" y="1585" class="h">轨迹先验 · 条件扩散</text><text x="469" y="1615" class="b">身体坐标＋时间步</text><text x="469" y="1641" class="b">音频不作为该先验条件</text><text x="469" y="1667" class="b">反复去噪9维轨迹</text><text x="469" y="1693" class="b">Δx / Δy / Δz ＋ 根rot6d</text><text x="469" y="1719" class="b">输出世界位移与朝向</text><rect x="865" y="1555" width="360" height="225" rx="10" fill="#eaf2ff" stroke="#aab9cc"/><text x="879" y="1585" class="h">手指先验 · 条件扩散</text><text x="879" y="1615" class="b">前臂旋转＋音频／语义</text><text x="879" y="1641" class="b">预训练后按BEATX微调</text><text x="879" y="1667" class="b">反复去噪手指旋转</text><text x="879" y="1693" class="b">替换初步手指结果</text><text x="879" y="1719" class="b">不是手语片段检索</text><path d="M1045 1270V1470H225V1555" class="a"/><path d="M395 1635H455" class="a"/><path d="M395 1720H420V1800H1045V1778" class="a"/><path d="M805 1690H825V1535H630V1555" class="a"/><path d="M1225 1690H1240V1535H1045V1555" class="a"/><path d="M1225 440H1275V1810H820V1765H805" class="a d"/><path d="M1275 1810H1235V1765H1225" class="a d"/><text x="55" y="1848" class="n">“Optimizer”在这里是学习式二次生成：没有用户路径求解、接触力约束或环境碰撞保证。</text><rect x="30" y="1915" width="1220" height="230" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="1950" class="h">E · 合并、窗口衔接与连续输出</text><rect x="55" y="1975" width="340" height="130" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="69" y="2005" class="h">合并身体＋轨迹＋手指</text><text x="69" y="2035" class="b">保留身体动作；更新根与手指</text><text x="69" y="2061" class="b">官方demo另做坐标系转换</text><text x="69" y="2087" class="b">MotionPrior需从外部包取得</text><rect x="455" y="1975" width="350" height="130" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="469" y="2005" class="h">滑窗与动作参数</text><text x="469" y="2035" class="b">30 fps，72帧窗／12帧seed</text><text x="469" y="2061" class="b">前窗尾帧作为后窗seed</text><text x="469" y="2087" class="b">初步输出433维→轴角／NPZ</text><rect x="865" y="1975" width="360" height="130" rx="10" fill="#ffffff" stroke="#aab9cc"/><text x="879" y="2005" class="h">分别验收输出</text><text x="879" y="2035" class="b">语义与音频节奏</text><text x="879" y="2061" class="b">脚滑／漂浮／手指自然度</text><text x="879" y="2087" class="b">低误差和高SA均非事件保证</text><path d="M630 1778V1895H225V1975" class="a"/><path d="M1045 1778V1905H225V1975" class="a"/><path d="M395 2040H455" class="a"/><path d="M805 2040H865" class="a"/><text x="40" y="2188" class="n">依据arXiv:2503.13229v1图2、§3及官方demo静态代码重绘；未运行模型或验证外部权重。</text><text x="40" y="2220" class="n">蓝色＝复用／冻结模块；绿色＝训练；橙色＝运行输入。先验微调与编码器预训练均有额外数据成本。</text></svg>