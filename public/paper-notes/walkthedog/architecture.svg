<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1900" viewBox="0 0 1200 1900"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#386b92"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#758596"/></marker></defs><rect width="1200" height="1900" fill="#f7f9fc"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#19324a} .title{font-size:32px;font-weight:700}.head{font-size:26px;font-weight:700}.node{font-size:23px;font-weight:600}.small{font-size:21px}.note{font-size:20px}</style><text x="40" y="48" class="title" text-anchor="start">WalkTheDog：共享相位对齐 → 目标动作库检索</text><text x="40" y="82" class="note" text-anchor="start">SIGGRAPH 2024 · 教学重绘 · 蓝色为学习/表示，绿色为动作应用，灰色为诊断支路</text><rect x="25" y="110" width="1150" height="270" rx="20" fill="white" stroke="#c8d6e3" stroke-width="2"/><text x="48" y="150" class="head" text-anchor="start">A  多角色联合训练：骨架可以不同，幅值码本共同使用</text><text x="48" y="185" class="small" text-anchor="start">无配对动作、语义标签或关节对应；每个角色使用自己的 VQ-PAE</text><rect x="55" y="210" width="260" height="65" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="185.0" y="249.5" class="small" text-anchor="middle">人类局部速度窗口</text><rect x="55" y="300" width="260" height="65" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="185.0" y="339.5" class="small" text-anchor="middle">狗 / 其他角色速度窗口</text><rect x="365" y="210" width="340" height="65" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="535.0" y="249.5" class="small" text-anchor="middle">角色 1 的 VQ-PAE</text><rect x="365" y="300" width="340" height="65" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="535.0" y="339.5" class="small" text-anchor="middle">角色 2 的 VQ-PAE</text><rect x="820" y="230" width="310" height="115" rx="14" fill="#fbeed8" stroke="#d7b574" stroke-width="1.6"/><text x="975.0" y="263.5" class="small" text-anchor="middle">共享幅值码本 A</text><text x="975.0" y="294.5" class="small" text-anchor="middle">K 项离散高维向量</text><text x="975.0" y="325.5" class="small" text-anchor="middle">少用码跨角色重新初始化</text><path d="M315 242 H365" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M315 332 H365" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M705 242 H765 V260 H820" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M705 332 H765 V315 H820" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><text x="720" y="195" class="note" text-anchor="start">仅共享码本</text><rect x="25" y="405" width="1150" height="660" rx="20" fill="white" stroke="#c8d6e3" stroke-width="2"/><text x="48" y="445" class="head" text-anchor="start">B  单个 VQ-PAE 内部：用一个局部周期重建速度窗口</text><text x="48" y="480" class="small" text-anchor="start">以下按论文训练路径；时间进度连续，量化只发生在幅值分支</text><rect x="55" y="505" width="250" height="100" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="180.0" y="531.0" class="small" text-anchor="middle">X：约 1 秒中心窗口</text><text x="180.0" y="562.0" class="small" text-anchor="middle">角色局部关节速度</text><text x="180.0" y="593.0" class="small" text-anchor="middle">J × T</text><rect x="355" y="505" width="270" height="100" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="490.0" y="546.5" class="small" text-anchor="middle">两层 1D 卷积编码</text><text x="490.0" y="577.5" class="small" text-anchor="middle">得到时序特征</text><rect x="700" y="495" width="435" height="105" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="917.5" y="523.5" class="small" text-anchor="middle">时间分支：单通道信号</text><text x="917.5" y="554.5" class="small" text-anchor="middle">FFT 功率 → MLP → 频率 f</text><text x="917.5" y="585.5" class="small" text-anchor="middle">信号投影 → 中心相位 φ</text><rect x="700" y="665" width="435" height="105" rx="14" fill="#fbeed8" stroke="#d7b574" stroke-width="1.6"/><text x="917.5" y="693.5" class="small" text-anchor="middle">幅值分支：时间平均池化</text><text x="917.5" y="724.5" class="small" text-anchor="middle">MLP → 连续 Ã → 最近邻量化</text><text x="917.5" y="755.5" class="small" text-anchor="middle">从共享码本取 A = [A⁰, A¹]</text><path d="M305 555 H355" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M625 535 H700" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M625 575 H655 V715 H700" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><rect x="770" y="840" width="365" height="105" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="952.5" y="868.5" class="small" text-anchor="middle">Φ(τ) = φ + fτ</text><text x="952.5" y="899.5" class="small" text-anchor="middle">P(τ) = A⁰sin(2πΦ)</text><text x="952.5" y="930.5" class="small" text-anchor="middle">           + A¹cos(2πΦ)</text><rect x="390" y="850" width="280" height="85" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="530.0" y="884.0" class="small" text-anchor="middle">两层卷积解码</text><text x="530.0" y="915.0" class="small" text-anchor="middle">重建局部速度窗口</text><rect x="55" y="850" width="245" height="85" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="177.5" y="884.0" class="small" text-anchor="middle">重建结果 X̃</text><text x="177.5" y="915.0" class="small" text-anchor="middle">与输入 X 比较</text><path d="M1135 548 H1155 V810 H960 V840" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M918 770 V840" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M770 892 H670" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M390 892 H300" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><text x="60" y="685" class="small" text-anchor="start">短窗口假设：</text><text x="60" y="716" class="small" text-anchor="start">相位近似线性推进</text><text x="60" y="747" class="small" text-anchor="start">幅值近似恒定</text><rect x="55" y="970" width="1080" height="68" rx="14" fill="#edf5ec" stroke="#8db289" stroke-width="1.6"/><text x="595.0" y="1011.0" class="small" text-anchor="middle">训练损失：各角色重建项 + 共享码本量化项；网络与码本联合学习</text><path d="M178 935 V970" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" stroke-dasharray="8 6"/><path d="M700 740 H680 V970" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" stroke-dasharray="8 6"/><rect x="25" y="1090" width="1150" height="735" rx="20" fill="white" stroke="#c8d6e3" stroke-width="2"/><text x="48" y="1130" class="head" text-anchor="start">C  训练后应用：编码 → 按周期匹配 → 回放目标动作</text><text x="48" y="1165" class="small" text-anchor="start">复用角色编码器与码本；丢弃 B 区的卷积重建解码器</text><rect x="55" y="1200" width="245" height="85" rx="14" fill="#e9f5ef" stroke="#94bda6" stroke-width="1.6"/><text x="177.5" y="1234.0" class="small" text-anchor="middle">新源动作</text><text x="177.5" y="1265.0" class="small" text-anchor="middle">例如人类奔跑</text><rect x="345" y="1200" width="245" height="85" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="467.5" y="1234.0" class="small" text-anchor="middle">源角色编码器</text><text x="467.5" y="1265.0" class="small" text-anchor="middle">逐中心窗口编码</text><rect x="635" y="1200" width="250" height="85" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="760.0" y="1234.0" class="small" text-anchor="middle">源流形序列 P</text><text x="760.0" y="1265.0" class="small" text-anchor="middle">相位与频率</text><rect x="55" y="1355" width="245" height="85" rx="14" fill="#e9f5ef" stroke="#94bda6" stroke-width="1.6"/><text x="177.5" y="1389.0" class="small" text-anchor="middle">目标角色动作库</text><text x="177.5" y="1420.0" class="small" text-anchor="middle">例如狗的已有动作</text><rect x="345" y="1355" width="245" height="85" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="467.5" y="1389.0" class="small" text-anchor="middle">目标角色编码器</text><text x="467.5" y="1420.0" class="small" text-anchor="middle">离线预计算</text><rect x="635" y="1355" width="250" height="85" rx="14" fill="#e8f1fb" stroke="#95b4cf" stroke-width="1.6"/><text x="760.0" y="1389.0" class="small" text-anchor="middle">目标流形序列 Q</text><text x="760.0" y="1420.0" class="small" text-anchor="middle">姿态与周期描述</text><path d="M300 1242 H345" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M590 1242 H635" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M300 1397 H345" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M590 1397 H635" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><rect x="935" y="1255" width="205" height="190" rx="14" fill="#e9f5ef" stroke="#94bda6" stroke-width="1.6"/><text x="1037.5" y="1310.5" class="small" text-anchor="middle">按周期匹配</text><text x="1037.5" y="1341.5" class="small" text-anchor="middle">比较 P 与 Q</text><text x="1037.5" y="1372.5" class="small" text-anchor="middle">兼顾过渡姿态</text><text x="1037.5" y="1403.5" class="small" text-anchor="middle">与周期差异</text><path d="M885 1242 H915 V1295 H935" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M885 1397 H935" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><rect x="805" y="1535" width="335" height="90" rx="14" fill="#e9f5ef" stroke="#94bda6" stroke-width="1.6"/><text x="972.5" y="1571.5" class="small" text-anchor="middle">检索目标动作片段</text><text x="972.5" y="1602.5" class="small" text-anchor="middle">重定时到源周期长度</text><rect x="425" y="1535" width="290" height="90" rx="14" fill="#e9f5ef" stroke="#94bda6" stroke-width="1.6"/><text x="570.0" y="1571.5" class="small" text-anchor="middle">惯性过渡 / 拼接</text><text x="570.0" y="1602.5" class="small" text-anchor="middle">继续下一个源周期</text><rect x="55" y="1535" width="280" height="90" rx="14" fill="#e9f5ef" stroke="#94bda6" stroke-width="1.6"/><text x="195.0" y="1571.5" class="small" text-anchor="middle">目标骨架动作</text><text x="195.0" y="1602.5" class="small" text-anchor="middle">目标库提供具体细节</text><path d="M1040 1445 V1535" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M805 1580 H715" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><path d="M425 1580 H335" fill="none" stroke="#386b92" stroke-width="2.8" marker-end="url(#arr)" /><rect x="55" y="1680" width="1085" height="100" rx="14" fill="#f1f3f6" stroke="#abb5c1" stroke-width="1.6"/><text x="597.5" y="1721.5" class="small" text-anchor="middle">独立诊断：流形单点 → 各角色平均姿态 MLP → 平均姿态显示 / 表 1 误差</text><text x="597.5" y="1752.5" class="small" text-anchor="middle">该支路不等于完整动作迁移；目标检索路径也不是任意动作生成器</text><text x="50" y="1860" class="note" text-anchor="start">边界：依赖目标库语义覆盖；无硬接触、末端、轨迹或未编辑关节保持保证。</text><text x="50" y="1890" class="note" text-anchor="start">来源：正式主文图 2–4、式 1–10 与补充。当前代码设置差异另见正文；未运行模型。</text></svg>