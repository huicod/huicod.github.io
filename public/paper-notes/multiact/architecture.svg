<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1840" viewBox="0 0 1480 1840" role="img" aria-labelledby="title desc"><title id="title">MultiAct 完整框架：离线准备、在线选参与注意力引导扩散</title><desc id="desc">以冻结MDM星骨干生成并评分离线候选；提示通过最近邻、误差阈值和LLM候选词选择参数；单候选通过早期注意力梯度引导完成50步扩散。LLM不读取动作、不输出动作token。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#61728a"/></marker></defs><rect width="1480" height="1840" fill="#f7f9fc"/>
<text x="40" y="48" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="30" font-weight="700" fill="#26364b" text-anchor="start">MultiAct：先找到遗漏语义，再用注意力梯度改变生成状态</text>
<text x="40" y="80" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#607087" text-anchor="start">SIGGRAPH 2026 · 论文机制教学图 · 同时动作组合，不提供精确时间或关节硬约束</text>
<rect x="25" y="105" width="1415" height="420" rx="20" fill="#edf3ff" stroke="#dbe3ed"/>
<text x="48" y="143" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="700" fill="#26364b" text-anchor="start">A  已有骨干与离线选参准备</text>
<text x="48" y="173" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#56677e" text-anchor="start">冻结的是后续使用的生成器；离线提示构建、候选生成和阈值校准仍有计算成本。</text>
<rect x="50" y="200" width="330" height="115" rx="13" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="68" y="232" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">HumanML3D 配对数据</text>
<text x="68" y="263" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">动作 + 对应文本</text>
<text x="68" y="292" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">用于训练逐词条件的骨干</text>
<rect x="445" y="200" width="420" height="115" rx="13" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="463" y="232" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">重新训练 MDM*</text>
<text x="463" y="263" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">BERT 逐词编码 + 8层 decoder</text>
<text x="463" y="292" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">采用连续动作特征，非离散动作词</text>
<rect x="930" y="200" width="480" height="115" rx="13" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="948" y="232" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">固定骨干 G</text>
<text x="948" y="263" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">提供去噪预测与跨注意力</text>
<text x="948" y="292" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">离线生成、在线基线、候选生成复用</text>
<path d="M380 258 L445 258" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M865 258 L930 258" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="50" y="355" width="390" height="135" rx="13" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="68" y="387" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">困难但可实现的复合提示</text>
<text x="68" y="418" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">15条手工初筛；ChatGPT-5.2扩展</text>
<text x="68" y="447" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">迭代过滤得到140条提示</text>
<text x="68" y="476" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">没有逐条配对的真实动作</text>
<rect x="490" y="355" width="420" height="135" rx="13" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="508" y="387" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">参数裁剪 + 生成并评分</text>
<text x="508" y="418" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">层3/4/5；截止步48/47/46</text>
<text x="508" y="447" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">候选词 × 参数 × 随机种子</text>
<text x="508" y="476" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">约30K生成动作；偏差取8seed均值</text>
<rect x="960" y="355" width="450" height="135" rx="13" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="978" y="387" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">选参库 D</text>
<text x="978" y="418" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">提示、参数、生成动作、双项偏差</text>
<text x="978" y="447" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">得到：最近邻层标签 / 误差阈值</text>
<text x="978" y="476" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">无新大型预测网络，无骨干微调</text>
<path d="M440 422 L490 422" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M910 422 L960 422" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="25" y="550" width="1415" height="445" rx="20" fill="#f3efff" stroke="#dbe3ed"/>
<text x="48" y="588" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="700" fill="#26364b" text-anchor="start">B  在线 ParamGate：按每条新提示选参数</text>
<text x="48" y="618" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#56677e" text-anchor="start">参数为 θ = (目标词 m，模型层 ℓ，引导截止步 t̂)。候选搜索会调用下方完整生成循环。</text>
<rect x="50" y="640" width="1360" height="70" rx="13" fill="#fff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="68" y="672" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">复合文本 y：一个人向前跳，同时举起双臂</text>
<path d="M280 710 L280 745" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M730 710 L730 745" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M1180 710 L1180 745" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="50" y="745" width="430" height="155" rx="13" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="68" y="777" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">选择层 ℓ</text>
<text x="68" y="808" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">提示CLS向量 → 离线库最近邻</text>
<text x="68" y="837" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">取相似提示对应的最佳层</text>
<text x="68" y="866" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">候选：3、4、5</text>
<rect x="515" y="745" width="430" height="155" rx="13" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="533" y="777" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">选择截止步 t̂</text>
<text x="533" y="808" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">无引导G先生成 → 基线偏差</text>
<text x="533" y="837" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">离线有序阈值 → 干预范围</text>
<text x="533" y="866" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">候选48/47/46：最初1/2/3步</text>
<rect x="980" y="745" width="430" height="155" rx="13" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="998" y="777" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">选择目标词 m</text>
<text x="998" y="808" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">LLM只读文本 → 通常3–4候选</text>
<text x="998" y="837" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">每词引导生成并评分 → 选优</text>
<text x="998" y="866" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">快速支线：抽取动作细节词</text>
<path d="M280 900 L280 930" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M730 900 L730 930" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M1180 900 L1180 930" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="50" y="930" width="1360" height="45" rx="13" fill="#e7e0fb" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="68" y="962" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">候选搜索与最终生成共用 C；以双项语义偏差选词，生成器权重始终固定</text>
<path d="M1410 470 L1458 470 L1458 732 L730 732 L730 745" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="1426" y="565" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="700" fill="#26364b" text-anchor="start">D</text>
<rect x="25" y="1020" width="1415" height="680" rx="20" fill="#eaf6f3" stroke="#dbe3ed"/>
<text x="48" y="1058" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="700" fill="#26364b" text-anchor="start">C  单个候选的注意力引导扩散：候选试跑和最终生成均可调用</text>
<text x="48" y="1088" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#56677e" text-anchor="start">论文式2–3、算法1–2：更新当前动作表示；固定G产生注意力与干净动作预测。</text>
<rect x="50" y="1110" width="1360" height="75" rx="13" fill="#fff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="68" y="1142" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">文本 y → BERT逐词表示 E；候选参数 θ → 控制哪个词、哪层、哪几个扩散步</text>
<path d="M580 1185 L580 1230" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M995 1185 L995 1230" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="50" y="1260" width="255" height="125" rx="13" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="68" y="1292" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">当前动作 X_t</text>
<text x="68" y="1323" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">从高斯噪声开始</text>
<text x="68" y="1352" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">连续动作状态</text>
<rect x="360" y="1230" width="440" height="220" rx="13" fill="#d9eee8" stroke="#77b6a5" stroke-width="1.5"/>
<text x="378" y="1262" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">仅最初1–3步：注意力内循环</text>
<text x="378" y="1293" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">冻结G前向 → 指定层注意力A</text>
<text x="378" y="1322" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">L = mean_i (1 − A_i,m)²</text>
<text x="378" y="1351" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">X ← X − η∇_X L</text>
<text x="378" y="1380" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">r=18次；η=.02</text>
<text x="378" y="1409" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">其余扩散步直接跳过本优化</text>
<rect x="855" y="1230" width="275" height="125" rx="13" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="873" y="1262" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">固定 G 去噪</text>
<text x="873" y="1293" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">输入优化后的 X′ + E</text>
<text x="873" y="1322" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">预测干净动作 X̂₀</text>
<rect x="1185" y="1230" width="225" height="125" rx="13" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="1203" y="1262" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">DDPM采样</text>
<text x="1203" y="1293" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">得到下一 X_(t−1)</text>
<text x="1203" y="1322" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">共50步反向扩散</text>
<path d="M305 1322 L360 1322" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M800 1292 L855 1292" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M1130 1292 L1185 1292" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M1297 1355 L1297 1485 L177 1485 L177 1385" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="715" y="1470" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="middle">未结束：返回下一去噪步</text>
<path d="M1297 1485 L1297 1530" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="1060" y="1530" width="350" height="115" rx="13" fill="#d5eadf" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="1078" y="1562" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">最终连续动作 X₀</text>
<text x="1078" y="1593" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">动作成分在部分时段共现</text>
<text x="1078" y="1622" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">不保证精确姿态、接触或时刻</text>
<rect x="50" y="1530" width="950" height="115" rx="13" fill="#fff" stroke="#c8d4e3" stroke-width="1.5"/>
<text x="68" y="1562" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">前/后半句分别与动作送入 T2M评价器</text>
<text x="68" y="1593" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">Dual MM Dist = √(d_prefix² + d_suffix²)；越低越好</text>
<text x="68" y="1622" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">候选阶段用该分数择优；不是几何控制成功率</text>
<path d="M1060 1587 L1000 1587" fill="none" stroke="#61728a" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="50" y="1680" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400" fill="#52687a" text-anchor="start">图按论文算法绘制：公开代码改用输入映射后的 xseq + Adam；并未原样实现全部自动选参链路。</text>
<rect x="25" y="1730" width="1415" height="85" rx="13" fill="#fff2de" stroke="#dec59b" stroke-width="1.5"/>
<text x="43" y="1762" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#26364b" text-anchor="start">成本与能力边界</text>
<text x="43" y="1793" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#26364b" text-anchor="start">不搜索约2×骨干时间；候选搜索约6×。无绝对实时延迟报告。LLM不读源动作，也不输出动作token。</text>
</svg>