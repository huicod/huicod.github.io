<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1910" viewBox="0 0 1200 1910" role="img" aria-labelledby="t d">
<title id="t">原版 CurveCodec：确定性曲线编码与共享神经解码</title>
<desc id="d">原SIGGRAPH Asia 2026论文机制，非CurveCodec2。训练共享masked transformer；编码发送起点、尺度、Fourier描述、极值锚点；解码双向补全，替换已知值并恢复旋转。</desc>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5.5 L0,11 Z" fill="#54728b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style>
<rect x="0" y="0" width="1200" height="1910" rx="14" fill="#fff" stroke="#cbd7e2" stroke-width="2"/>
<text x="40" y="48" font-size="33" fill="#243b53" font-weight="700">CurveCodec：存下曲线证据，让共享网络补全</text>
<text x="40" y="87" font-size="22" fill="#536879" font-weight="400">SIGGRAPH Asia 2026 原版 / v0.1 · 不是当前 CurveCodec 2 的学习熵编码路线</text>
<rect x="25" y="115" width="1150" height="340" rx="14" fill="#f0f6fc" stroke="#cbd7e2" stroke-width="2"/>
<text x="48" y="154" font-size="28" fill="#243b53" font-weight="700">A  离线训练：学习曲线先验，不绑定固定骨架</text>
<text x="48" y="190" font-size="21" fill="#536879" font-weight="400">同一网络处理不同关节的标量曲线；三轴分组计算旋转误差，不学习跨关节接触约束。</text>
<rect x="48" y="220" width="328" height="155" rx="14" fill="#e7f0ff" stroke="#cbd7e2" stroke-width="2"/>
<text x="66" y="255" font-size="25" fill="#243b53" font-weight="700">真实运动 → 曲线窗口</text>
<text x="66" y="292" font-size="22" fill="#243b53" font-weight="400">约 370 小时训练动作</text>
<text x="66" y="323" font-size="22" fill="#243b53" font-weight="400">旋转 x / y / z；最多 240 帧</text>
<text x="66" y="354" font-size="22" fill="#243b53" font-weight="400">随机改变时间分辨率</text>
<rect x="433" y="220" width="331" height="155" rx="14" fill="#e7f0ff" stroke="#cbd7e2" stroke-width="2"/>
<text x="451" y="255" font-size="25" fill="#243b53" font-weight="700">确定性构造训练输入</text>
<text x="451" y="292" font-size="22" fill="#243b53" font-weight="400">delta 归一化 + Fourier</text>
<text x="451" y="323" font-size="22" fill="#243b53" font-weight="400">极值锚点放回原时间位置</text>
<text x="451" y="354" font-size="22" fill="#243b53" font-weight="400">其余位置使用 mask</text>
<rect x="820" y="220" width="332" height="155" rx="14" fill="#e4f3ec" stroke="#cbd7e2" stroke-width="2"/>
<text x="838" y="255" font-size="25" fill="#243b53" font-weight="700">共享 Transformer 解码器</text>
<text x="838" y="292" font-size="22" fill="#243b53" font-weight="400">预测密集归一化曲线</text>
<text x="838" y="323" font-size="22" fill="#243b53" font-weight="400">平均 / 最大 shell + L2</text>
<text x="838" y="354" font-size="22" fill="#243b53" font-weight="400">训练后权重固定，共享 19MB</text>
<polyline points="377,300 429,300" fill="none" stroke="#54728b" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="765,300 816,300" fill="none" stroke="#54728b" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="48" y="425" font-size="22" fill="#243b53" font-weight="400">学习发生在解码端；编码器无可训练参数。推理时不为新骨架或新片段再训练。</text>
<rect x="25" y="485" width="1150" height="445" rx="14" fill="#f4f7ff" stroke="#cbd7e2" stroke-width="2"/>
<text x="48" y="524" font-size="28" fill="#243b53" font-weight="700">B  编码与存储：把已存在的动画变小</text>
<text x="48" y="560" font-size="21" fill="#536879" font-weight="400">输入已有骨骼动画；这一步不从文本或随机噪声生成新动作。</text>
<rect x="48" y="590" width="335" height="215" rx="14" fill="#fff" stroke="#cbd7e2" stroke-width="2"/>
<text x="66" y="625" font-size="25" fill="#243b53" font-weight="700">预处理与分解</text>
<text x="66" y="662" font-size="22" fill="#243b53" font-weight="400">常量轨道 → 常量旁信息</text>
<text x="66" y="693" font-size="22" fill="#243b53" font-weight="400">四元数符号连续 → 丢弃 w</text>
<text x="66" y="724" font-size="22" fill="#243b53" font-weight="400">记录恢复 w 所需符号</text>
<text x="66" y="755" font-size="22" fill="#243b53" font-weight="400">各旋转分量切非重叠窗口</text>
<text x="66" y="786" font-size="22" fill="#243b53" font-weight="400">f₀、s → 相对归一化曲线</text>
<rect x="435" y="590" width="329" height="215" rx="14" fill="#e8edff" stroke="#cbd7e2" stroke-width="2"/>
<text x="453" y="625" font-size="25" fill="#243b53" font-weight="700">每条曲线的三类信息</text>
<text x="453" y="662" font-size="22" fill="#243b53" font-weight="400">① 起始值 f₀ + 变化幅度 s</text>
<text x="453" y="693" font-size="22" fill="#243b53" font-weight="400">② 低频 Fourier 描述</text>
<text x="453" y="724" font-size="22" fill="#243b53" font-weight="400">③ 极值锚点（时间, 值）</text>
<text x="453" y="755" font-size="22" fill="#243b53" font-weight="400">阈值 η ↓ → 更多锚点</text>
<text x="453" y="786" font-size="22" fill="#243b53" font-weight="400">同一网络覆盖不同码率</text>
<rect x="818" y="590" width="334" height="215" rx="14" fill="#fff" stroke="#cbd7e2" stroke-width="2"/>
<text x="836" y="625" font-size="25" fill="#243b53" font-weight="700">压缩运动流</text>
<text x="836" y="662" font-size="22" fill="#243b53" font-weight="400">所有值按 32 bit 计数</text>
<text x="836" y="693" font-size="22" fill="#243b53" font-weight="400">原版无熵编码 / 量化</text>
<text x="836" y="724" font-size="22" fill="#243b53" font-weight="400">每窗口头 + 描述 + 锚点</text>
<text x="836" y="755" font-size="22" fill="#243b53" font-weight="400">骨架结构仍需外部保留</text>
<text x="836" y="786" font-size="22" fill="#243b53" font-weight="400">19MB 解码器另行部署</text>
<polyline points="384,693 431,693" fill="none" stroke="#54728b" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="765,693 814,693" fill="none" stroke="#54728b" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="48" y="853" font-size="22" fill="#243b53" font-weight="400">主实验范围：神经部分处理旋转；平移与缩放使用 ACL 路线，不是全部变换都神经压缩。</text>
<text x="48" y="894" font-size="22" fill="#536879" font-weight="400">每条曲线可有不同锚点时刻；它们不是所有关节共用的一组完整姿态关键帧。</text>
<rect x="25" y="960" width="1150" height="495" rx="14" fill="#eff8f3" stroke="#cbd7e2" stroke-width="2"/>
<text x="48" y="999" font-size="28" fill="#243b53" font-weight="700">C  解码：双向补空位，再恢复原坐标</text>
<text x="48" y="1035" font-size="21" fill="#536879" font-weight="400">整个窗口的描述与前后锚点都已知；masked timeline 不表示因果流式生成。</text>
<rect x="48" y="1070" width="335" height="180" rx="14" fill="#fff" stroke="#cbd7e2" stroke-width="2"/>
<text x="66" y="1105" font-size="25" fill="#243b53" font-weight="700">构造时间 token</text>
<text x="66" y="1142" font-size="22" fill="#243b53" font-weight="400">描述 token + N 个时间位置</text>
<text x="66" y="1173" font-size="22" fill="#243b53" font-weight="400">第 0 帧 / 锚点：已知值</text>
<text x="66" y="1204" font-size="22" fill="#243b53" font-weight="400">其他帧：可学习 mask</text>
<text x="66" y="1235" font-size="22" fill="#243b53" font-weight="400">类型嵌入 + RoPE 时间位置</text>
<rect x="435" y="1070" width="329" height="180" rx="14" fill="#dff0e6" stroke="#cbd7e2" stroke-width="2"/>
<text x="453" y="1105" font-size="25" fill="#243b53" font-weight="700">共享解码器前向</text>
<text x="453" y="1142" font-size="22" fill="#243b53" font-weight="400">6 层 / 宽 256 / 4 头</text>
<text x="453" y="1173" font-size="22" fill="#243b53" font-weight="400">双向自注意力</text>
<text x="453" y="1204" font-size="22" fill="#243b53" font-weight="400">sin(60x) 前馈 + tanh</text>
<text x="453" y="1235" font-size="22" fill="#243b53" font-weight="400">输出全部时间位置标量</text>
<rect x="818" y="1070" width="334" height="180" rx="14" fill="#fff" stroke="#cbd7e2" stroke-width="2"/>
<text x="836" y="1105" font-size="25" fill="#243b53" font-weight="700">恢复与组合</text>
<text x="836" y="1142" font-size="22" fill="#243b53" font-weight="400">已知位置替换为传输值</text>
<text x="836" y="1173" font-size="22" fill="#243b53" font-weight="400">反归一化：s·x̂ + f₀</text>
<text x="836" y="1204" font-size="22" fill="#243b53" font-weight="400">恢复 w / 局部四元数</text>
<text x="836" y="1235" font-size="22" fill="#243b53" font-weight="400">组回原骨架的密集动画</text>
<polyline points="384,1155 431,1155" fill="none" stroke="#54728b" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="765,1155 814,1155" fill="none" stroke="#54728b" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="1153,693 1187,693 1187,945 12,945 12,1056 215,1056 215,1066" fill="none" stroke="#54728b" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="48" y="1300" width="1104" height="105" rx="14" fill="#fff8e9" stroke="#cbd7e2" stroke-width="2"/>
<text x="66" y="1335" font-size="25" fill="#243b53" font-weight="700">保持与误差边界</text>
<text x="66" y="1372" font-size="22" fill="#243b53" font-weight="400">发送的标量值会替换回去；未发送帧仍是预测，不保证最坏误差或足端接触。</text>
<text x="48" y="1432" font-size="22" fill="#536879" font-weight="400">批处理可同时解码很多曲线；“窗口 / 秒”不能直接当完整人物帧率。</text>
<rect x="25" y="1485" width="1150" height="290" rx="14" fill="#fff8ed" stroke="#cbd7e2" stroke-width="2"/>
<text x="48" y="1524" font-size="28" fill="#243b53" font-weight="700">D  应用扩展与版本边界</text>
<text x="48" y="1560" font-size="21" fill="#536879" font-weight="400">压缩器、生成控制器和后续 CurveCodec 2 是不同层级的系统。</text>
<rect x="48" y="1590" width="530" height="125" rx="14" fill="#fff" stroke="#cbd7e2" stroke-width="2"/>
<text x="66" y="1625" font-size="25" fill="#243b53" font-weight="700">原论文的下游控制应用</text>
<text x="66" y="1662" font-size="22" fill="#243b53" font-weight="400">另训控制器 → 2FPS 稀疏 keystates</text>
<text x="66" y="1693" font-size="22" fill="#243b53" font-weight="400">codec 补全高帧率；脚滑指标并非更优</text>
<rect x="625" y="1590" width="527" height="125" rx="14" fill="#fff" stroke="#cbd7e2" stroke-width="2"/>
<text x="643" y="1625" font-size="25" fill="#243b53" font-weight="700">后续发布：不要倒填到原论文</text>
<text x="643" y="1662" font-size="22" fill="#243b53" font-weight="400">v0.1 默认归档已加插值先验 / 闭环锚点</text>
<text x="643" y="1693" font-size="22" fill="#243b53" font-weight="400">v0.2 网络改为熵模型，另有误差契约</text>
<text x="40" y="1825" font-size="22" fill="#536879" font-weight="400">来源：正式论文 §3–7、图2–3、表1–4；历史归档静态核对，未运行模型。</text>
<text x="40" y="1864" font-size="22" fill="#856329" font-weight="400">本文图只表达原版主体；平均误差接近 ACL ≠ 最大 / P99 误差都更好。</text>
</svg>