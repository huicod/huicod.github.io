<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2140" viewBox="0 0 1500 2140" role="img" aria-label="SemTalk · 稳定基础动作 + 稀疏语义强调">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#516477"/></marker></defs>
<rect width="1500" height="2140" fill="#ffffff"/>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#183044}.title{font-size:36px;font-weight:700}.sub{font-size:21px;fill:#53677b}.label{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:20px;fill:#53677b}.panel{fill:#f8fafc;stroke:#d7e0e8;stroke-width:2}.edge{fill:none;stroke:#516477;stroke-width:3;marker-end:url(#a)}.dash{stroke-dasharray:9 7}</style>
<text x="40" y="55" class="title">SemTalk · 稳定基础动作 + 稀疏语义强调</text>
<text x="40" y="94" class="sub">教学示意｜四部位动作先验 → 基础与语义两路预测 → 逐位置选码 → 连续全身动作</text>
<rect x="30" y="125" width="1440" height="260" rx="20" class="panel"/>
<text x="55" y="167" class="label">A · 动作表示预训练（真实动作仅训练使用）</text>
<rect x="65" y="205" width="335" height="120" rx="13" fill="#fff3dd" stroke="#a9bdce" stroke-width="2"/>
<text x="83" y="239" class="label">真实分部位动作</text>
<text x="83" y="274" class="body">面部 / 手 / 上身 / 下身</text>
<text x="83" y="304" class="body">每个部位独立编码</text>
<rect x="490" y="205" width="440" height="120" rx="13" fill="#eaf2fb" stroke="#a9bdce" stroke-width="2"/>
<text x="508" y="239" class="label">四组 RVQ-VAE</text>
<text x="508" y="274" class="body">编码 → 六层残差量化 → 重建</text>
<text x="508" y="304" class="body">重建 / 码本学习，时间压缩 ×4</text>
<rect x="1020" y="205" width="395" height="120" rx="13" fill="#e5f4e9" stroke="#a9bdce" stroke-width="2"/>
<text x="1038" y="239" class="label">学习后的动作先验</text>
<text x="1038" y="274" class="body">部位码本与解码器</text>
<text x="1038" y="304" class="body">供后续码预测与最终解码复用</text>
<path d="M400 265H490" class="edge"/>
<path d="M930 265H1020" class="edge"/>
<rect x="30" y="420" width="1440" height="450" rx="20" class="panel"/>
<text x="55" y="462" class="label">B · 基础动作：声音节奏形成持续运动</text>
<rect x="65" y="505" width="315" height="130" rx="13" fill="#fff3dd" stroke="#a9bdce" stroke-width="2"/>
<text x="83" y="539" class="label">声音节奏条件</text>
<text x="83" y="574" class="body">幅度 / 短时能量 / onset</text>
<text x="83" y="604" class="body">HuBERT 高层语音特征</text>
<rect x="65" y="670" width="315" height="120" rx="13" fill="#fff3dd" stroke="#a9bdce" stroke-width="2"/>
<text x="83" y="704" class="label">种子姿态 + 身份</text>
<text x="83" y="739" class="body">动作上下文与人物条件</text>
<text x="83" y="769" class="body">同时提供给稀疏分支</text>
<rect x="460" y="505" width="450" height="130" rx="13" fill="#eaf2fb" stroke="#a9bdce" stroke-width="2"/>
<text x="478" y="539" class="label">Face / Body Part-Aware</text>
<text x="478" y="574" class="body">生成脸、手、上身、下身特征</text>
<text x="478" y="604" class="body">读取声音、种子姿态与身份</text>
<rect x="1000" y="505" width="415" height="130" rx="13" fill="#eaf2fb" stroke="#a9bdce" stroke-width="2"/>
<text x="1018" y="539" class="label">Coarse2Fine 引导</text>
<text x="1018" y="574" class="body">脸 → 手 → 上身 → 下身</text>
<text x="1018" y="604" class="body">产生基础特征 f_b</text>
<rect x="1000" y="705" width="415" height="110" rx="13" fill="#e5f4e9" stroke="#a9bdce" stroke-width="2"/>
<text x="1018" y="739" class="label">基础码预测 q_b</text>
<text x="1018" y="774" class="body">部位 MLP → 各层动作码</text>
<text x="1018" y="804" class="body">面部码始终走基础路径</text>
<rect x="460" y="705" width="450" height="110" rx="13" fill="#f1eaf8" stroke="#a9bdce" stroke-width="2"/>
<text x="478" y="739" class="label">节奏一致性训练</text>
<text x="478" y="774" class="body">脸 / 手 ↔ HuBERT</text>
<text x="478" y="804" class="body">局部帧级 + 全局句级 InfoNCE</text>
<path d="M380 565H460" class="edge"/>
<path d="M380 730H415V600H460" class="edge"/>
<path d="M910 570H1000" class="edge"/>
<path d="M1210 635V705" class="edge"/>
<path d="M1090 635V670H685V705" class="edge dash"/>
<text x="65" y="840" class="small">训练还使用码分类与重建目标；节奏对齐是软监督，不是逐帧时间或接触保证。</text>
<rect x="30" y="905" width="1440" height="620" rx="20" class="panel"/>
<text x="55" y="947" class="label">C · 稀疏语义动作：身体分支，保留基础面部码</text>
<rect x="65" y="990" width="335" height="160" rx="13" fill="#fff3dd" stroke="#a9bdce" stroke-width="2"/>
<text x="83" y="1024" class="label">语义条件 + 声音</text>
<text x="83" y="1059" class="body">局部转录 / CLIP 句级特征</text>
<text x="83" y="1089" class="body">emotion2vec 情绪特征</text>
<text x="83" y="1119" class="body">HuBERT 语音特征</text>
<rect x="480" y="990" width="400" height="160" rx="13" fill="#ffeddf" stroke="#a9bdce" stroke-width="2"/>
<text x="498" y="1024" class="label">融合特征 fₜ → Sem-gate</text>
<text x="498" y="1059" class="body">预测逐帧语义分数 ψ</text>
<text x="498" y="1089" class="body">ψ 对语义特征加权 W_f</text>
<text x="498" y="1119" class="body">高分帧在训练中加权 W_l</text>
<rect x="970" y="990" width="445" height="160" rx="13" fill="#ffeddf" stroke="#a9bdce" stroke-width="2"/>
<text x="988" y="1024" class="label">身体特征 + 分层引导</text>
<text x="988" y="1059" class="body">种子姿态 / ID 参与条件</text>
<text x="988" y="1089" class="body">手 → 上身 → 下身</text>
<text x="988" y="1119" class="body">得到语义表示 fₛ；不再生成脸</text>
<rect x="970" y="1265" width="445" height="150" rx="13" fill="#e5f4e9" stroke="#a9bdce" stroke-width="2"/>
<text x="988" y="1299" class="label">内部软融合 → 语义码 qˢ</text>
<text x="988" y="1334" class="body">ψ fₛ + (1−ψ) f_b</text>
<text x="988" y="1364" class="body">MLP 预测身体语义码</text>
<text x="988" y="1394" class="body">这里融合的是特征，不是整数码</text>
<rect x="65" y="1270" width="675" height="145" rx="13" fill="#f1eaf8" stroke="#a9bdce" stroke-width="2"/>
<text x="83" y="1304" class="label">仅训练：语义标注与稀疏目标</text>
<text x="83" y="1339" class="body">BEAT2 真值 / SHOW 由预训练门控提供伪标签</text>
<text x="83" y="1369" class="body">门控分类监督 + 按语义权重的码分类 / 重建</text>
<text x="83" y="1399" class="body">语义分数不是动作事件完成的验证结果</text>
<path d="M400 1065H480" class="edge"/>
<path d="M880 1065H970" class="edge"/>
<path d="M1190 1150V1265" class="edge"/>
<path d="M680 1150V1200H930V1310H970" class="edge"/>
<text x="710" y="1190" class="small">ψ</text>
<path d="M1400 635H1450V1225H1305V1265" class="edge"/>
<text x="1275" y="1215" class="small">基础 f_b</text>
<path d="M370 1270V1210H570V1150" class="edge dash"/>
<path d="M970 1375H740" class="edge dash"/>
<text x="65" y="1485" class="small">输入文本来自当前话语；门控决定强调时刻，没有另一路任意动作命令的冲突优先级。</text>
<rect x="30" y="1560" width="1440" height="420" rx="20" class="panel"/>
<text x="55" y="1602" class="label">D · 推理最终融合：阈值选择后统一解码</text>
<rect x="65" y="1650" width="450" height="160" rx="13" fill="#ffeddf" stroke="#a9bdce" stroke-width="2"/>
<text x="83" y="1684" class="label">逐位置选择身体动作码</text>
<text x="83" y="1719" class="body">若 ψᵢ &gt; 0.5：选语义 qˢᵢ</text>
<text x="83" y="1749" class="body">否则：保留基础 q_bᵢ</text>
<text x="83" y="1779" class="body">面部始终选基础码</text>
<rect x="600" y="1650" width="360" height="160" rx="13" fill="#e5f4e9" stroke="#a9bdce" stroke-width="2"/>
<text x="618" y="1684" class="label">四部位 RVQ 解码器</text>
<text x="618" y="1719" class="body">所选码 → 连续部位动作</text>
<text x="618" y="1749" class="body">卷积结构帮助时间衔接</text>
<text x="618" y="1779" class="body">复用 A 的动作先验</text>
<rect x="1045" y="1650" width="370" height="160" rx="13" fill="#e5f4e9" stroke="#a9bdce" stroke-width="2"/>
<text x="1063" y="1684" class="label">全身共语动作</text>
<text x="1063" y="1719" class="body">脸 + 手 + 上身 + 下身</text>
<text x="1063" y="1749" class="body">连续节奏中出现语义强调</text>
<text x="1063" y="1779" class="body">不是物理约束求解器</text>
<path d="M1210 815H1435V1545H45V1730H65" class="edge"/>
<text x="950" y="1538" class="small">基础 q_b（含面部）</text>
<path d="M1190 1415V1620H405V1650" class="edge"/>
<text x="820" y="1613" class="small">语义 qˢ + 分数 ψ</text>
<path d="M515 1730H600" class="edge"/>
<path d="M960 1730H1045" class="edge"/>
<text x="65" y="1870" class="small">内部 ψ 加权特征（C）与最终阈值选码（D）是两步；解码平滑不等于精确单帧编辑。</text>
<text x="65" y="1920" class="small">A 的码本 / 解码器在推理中复用；真实动作与人工语义标签不作为当前推理输入。</text>
<text x="40" y="2040" class="small">来源：ICCV 2025 正文图 2–3、式 1–5；实线为数据流，虚线为训练监督。本文未运行模型。</text>
<text x="40" y="2080" class="small">蓝：基础与条件；橙：语义与门控；绿：动作码及输出；紫：训练目标。</text>
</svg>
