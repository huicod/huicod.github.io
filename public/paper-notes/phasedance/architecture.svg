<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1040" viewBox="0 0 1040 1040" role="img" aria-labelledby="title desc">
<title id="title">PhaseDance：摘要中的周期与表达</title>
<desc id="desc">八拍教学示意：音乐强调第 1、5 拍，动作 A 在 1、5 拍加强，动作 B 在 1、6 拍加强。概念图随后区分相位条件舞蹈生成和基于十五项拉班指标的文字描述。</desc>
<defs><marker id="arr" viewBox="0 0 9 8" refX="8" refY="4" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#416c70"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#244146}.title{font-size:35px;font-weight:700}.head{font-size:26px;font-weight:700}.num{font-size:22px;fill:#197269;font-weight:700}.b{font-size:23px;font-weight:700}.t{font-size:20px}.fine{font-size:19px;fill:#496b6d}.sect{fill:#fff;stroke:#cad9d3;stroke-width:1.5}.arrow{fill:none;stroke:#416c70;stroke-width:2.4;marker-end:url(#arr)}</style>
<rect width="1040" height="1040" fill="#f4f8f6"/>
<text x="35" y="56" class="title">PhaseDance · 舞步为什么不只看落脚时刻？</text>
<text x="36" y="92" class="t">NeurIPS 2026 海报摘要导读　｜　教学示例与摘要确认的设计分开标示</text>
<rect x="20" y="122" width="1000" height="354" rx="16" class="sect"/>
<text x="43" y="161" class="num">01</text><text x="102" y="161" class="head">教学例子：八次落脚都在拍上，强调的位置可以不同</text>
<text x="46" y="207" class="fine">设音乐每四拍回到重音。条高只表示本例中音量或动作强调的相对大小。</text>
<text x="48" y="294" class="b">音乐</text><text x="48" y="361" class="b">动作 A</text><text x="48" y="428" class="b">动作 B</text>
<path d="M169 304 H975 M169 371 H975 M169 438 H975" stroke="#c9d6d2" fill="none" stroke-width="1.5"/>
<path d="M572 231 V443" stroke="#a3b6b1" stroke-dasharray="5 5" fill="none"/>
<text x="220" y="244" class="fine" text-anchor="middle">1</text><rect x="200" y="265" width="40" height="39" rx="3" fill="#c29a58"/><rect x="200" y="332" width="40" height="39" rx="3" fill="#5c9e8e"/><rect x="200" y="399" width="40" height="39" rx="3" fill="#7697b2"/>
<text x="320" y="244" class="fine" text-anchor="middle">2</text><rect x="300" y="289" width="40" height="15" rx="3" fill="#c29a58"/><rect x="300" y="356" width="40" height="15" rx="3" fill="#5c9e8e"/><rect x="300" y="423" width="40" height="15" rx="3" fill="#7697b2"/>
<text x="420" y="244" class="fine" text-anchor="middle">3</text><rect x="400" y="289" width="40" height="15" rx="3" fill="#c29a58"/><rect x="400" y="356" width="40" height="15" rx="3" fill="#5c9e8e"/><rect x="400" y="423" width="40" height="15" rx="3" fill="#7697b2"/>
<text x="520" y="244" class="fine" text-anchor="middle">4</text><rect x="500" y="289" width="40" height="15" rx="3" fill="#c29a58"/><rect x="500" y="356" width="40" height="15" rx="3" fill="#5c9e8e"/><rect x="500" y="423" width="40" height="15" rx="3" fill="#7697b2"/>
<text x="620" y="244" class="fine" text-anchor="middle">5</text><rect x="600" y="265" width="40" height="39" rx="3" fill="#c29a58"/><rect x="600" y="332" width="40" height="39" rx="3" fill="#5c9e8e"/><rect x="600" y="423" width="40" height="15" rx="3" fill="#7697b2"/>
<text x="720" y="244" class="fine" text-anchor="middle">6</text><rect x="700" y="289" width="40" height="15" rx="3" fill="#c29a58"/><rect x="700" y="356" width="40" height="15" rx="3" fill="#5c9e8e"/><rect x="700" y="399" width="40" height="39" rx="3" fill="#7697b2"/>
<text x="820" y="244" class="fine" text-anchor="middle">7</text><rect x="800" y="289" width="40" height="15" rx="3" fill="#c29a58"/><rect x="800" y="356" width="40" height="15" rx="3" fill="#5c9e8e"/><rect x="800" y="423" width="40" height="15" rx="3" fill="#7697b2"/>
<text x="920" y="244" class="fine" text-anchor="middle">8</text><rect x="900" y="289" width="40" height="15" rx="3" fill="#c29a58"/><rect x="900" y="356" width="40" height="15" rx="3" fill="#5c9e8e"/><rect x="900" y="423" width="40" height="15" rx="3" fill="#7697b2"/>
<rect x="20" y="496" width="1000" height="224" rx="16" class="sect"/>
<text x="43" y="537" class="num">02</text><text x="102" y="537" class="head">摘要的节奏线索：比较动作与音乐的周期</text>
<rect x="43" y="565" width="375" height="56" rx="11" fill="#e6f0f6"/><text x="58" y="602" class="b">音乐侧 · 跨拍的节奏结构</text>
<rect x="43" y="639" width="375" height="56" rx="11" fill="#e5f1e9"/><text x="58" y="676" class="b">舞蹈侧 · 动作的周期相位表示</text>
<rect x="550" y="576" width="445" height="109" rx="11" fill="#d9eeea"/><text x="566" y="613" class="b">相位条件舞蹈生成</text><text x="566" y="650" class="t">关注两个周期如何对应，动作怎样跨拍组织。</text>
<path d="M418 593 H480 V630 H550" class="arrow"/><path d="M418 667 H480 V630" fill="none" stroke="#416c70" stroke-width="2.4"/>
<rect x="20" y="741" width="1000" height="210" rx="16" class="sect"/>
<text x="43" y="783" class="num">03</text><text x="102" y="783" class="head">摘要的表达线索：文字怎样指向运动品质？</text>
<rect x="43" y="816" width="421" height="103" rx="11" fill="#fbefd6"/><text x="58" y="852" class="b">15 项拉班动作分析指标</text><text x="58" y="890" class="t">与音乐相关，涉及用力、形态、动态。</text>
<rect x="571" y="816" width="424" height="103" rx="11" fill="#d9eeea"/><text x="586" y="852" class="b">舞蹈的文字描述</text><text x="586" y="890" class="t">比一个舞种名称更细地描述怎样动。</text>
<path d="M464 866 H571" class="arrow"/>
<text x="34" y="989" class="fine">依据 NeurIPS 2026 官方摘要绘制。箭头表达概念关系，不代表已核实的网络层或损失函数。</text>
<text x="34" y="1020" class="fine">八拍条带为教学构造，未使用作者实验数据。</text>
</svg>
