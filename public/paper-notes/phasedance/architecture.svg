<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2900" viewBox="0 0 1200 2900" role="img" aria-label="PhaseDance完整训练与推理架构：动作token、离线相位与拉班描述，四任务路由，PCCA及三处相位注入，动作与文字输出">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536477"/></marker></defs>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172b45}.title{font-size:30px;font-weight:700}.section{font-size:23px;font-weight:700}.node{font-size:21px;font-weight:700}.body{font-size:18px}.label{font-size:17px;fill:#536477}</style>
<rect width="1200" height="2900" fill="#fff"/>
<text x="36" y="46" class="title" text-anchor="start">PhaseDance · 用连续相位组织动作token的生成</text>
<text x="36" y="80" class="body" text-anchor="start">教学示意 · 依据原文图2、表1与附录A/D/H · 主模型四任务；音乐条件是独立微调扩展</text>
<rect x="20" y="110" width="1160" height="720" rx="16" fill="#f6f8fb" stroke="#d5deea"/>
<text x="40" y="145" class="section" text-anchor="start">A  离线数据与两阶段训练：运动内容、周期和文字质感分别准备</text>
<rect x="40" y="175" width="1120" height="100" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="600.0" y="205" class="node" text-anchor="middle">训练语料：HumanML3D ＋ AIST++ ＋ DanceDB ＋ DT</text>
<text x="600.0" y="232" class="body" text-anchor="middle">运动轨迹＋已有舞种／舞步／动作描述；部分舞蹈有配对音乐</text>
<text x="600.0" y="256" class="body" text-anchor="middle">运动表示263维 → RIC恢复22关节；音乐不作为四任务模型的音频特征输入</text>
<rect x="40" y="335" width="330" height="135" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="205.0" y="365" class="node" text-anchor="middle">阶段1：训练动作VQ-VAE</text>
<text x="205.0" y="392" class="body" text-anchor="middle">50 Hz运动重建与量化</text>
<text x="205.0" y="416" class="body" text-anchor="middle">1个码本 × 1024项</text>
<text x="205.0" y="440" class="body" text-anchor="middle">不做时间下采样；输出token</text>
<rect x="435" y="335" width="330" height="135" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="600.0" y="365" class="node" text-anchor="middle">确定性ABFS相位提取</text>
<text x="600.0" y="392" class="body" text-anchor="middle">速度谷值＋音乐BeatNet／FFT</text>
<text x="600.0" y="416" class="body" text-anchor="middle">DP拍链 → (cos S, sin S)</text>
<text x="600.0" y="440" class="body" text-anchor="middle">60 → 50 Hz；幅度A未进入模型</text>
<rect x="830" y="335" width="330" height="135" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="995.0" y="365" class="node" text-anchor="middle">LMA描述与模板合成</text>
<text x="995.0" y="392" class="body" text-anchor="middle">15项运动统计 → 词汇＋已有标注</text>
<text x="995.0" y="416" class="body" text-anchor="middle">丰富／中等／简短＝60/25/15%</text>
<text x="995.0" y="440" class="body" text-anchor="middle">输出文字；无音频回归监督</text>
<path d="M 205 275 L 205 335" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 275 L 600 335" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 995 275 L 995 335" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="240" y="560" width="720" height="110" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="600.0" y="590" class="node" text-anchor="middle">阶段2：四任务共享模型训练</text>
<text x="600.0" y="617" class="body" text-anchor="middle">TP2M / MP2M / IB：动作token交叉熵；M2T：文字交叉熵</text>
<text x="600.0" y="641" class="body" text-anchor="middle">任务权重：1 / 1 / 0.8 / 0.1；更新解码器、动作编码器及相位模块</text>
<path d="M 205 470 L 205 530 L 350 530 L 350 560" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path d="M 600 470 L 600 560" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path d="M 995 470 L 995 530 L 850 530 L 850 560" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="240" y="705" width="720" height="85" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="600.0" y="735" class="node" text-anchor="middle">训练后参数：推理期间固定</text>
<text x="600.0" y="762" class="body" text-anchor="middle">冻结复用：动作tokenizer，T5编码器／文字嵌入／LM head</text>
<path d="M 600 670 L 600 705" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="814" class="label" text-anchor="start">阶段2不训练相位提取器，不把运动token改成语言词表；生成器是自回归模型，不是扩散模型。</text>
<rect x="20" y="860" width="1160" height="405" rx="16" fill="#f6f8fb" stroke="#d5deea"/>
<text x="40" y="895" class="section" text-anchor="start">B  推理输入与任务选择：未来真值相位只用于oracle对照</text>
<rect x="40" y="925" width="300" height="100" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="190.0" y="955" class="node" text-anchor="middle">TP2M：文字提示</text>
<text x="190.0" y="982" class="body" text-anchor="middle">舞种／舞步／质感描述</text>
<text x="190.0" y="1006" class="body" text-anchor="middle">例如：Roger Rabbit</text>
<rect x="400" y="925" width="390" height="100" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="595.0" y="955" class="node" text-anchor="middle">MP2M／IB／M2T：运动输入</text>
<text x="595.0" y="982" class="body" text-anchor="middle">前1秒／首尾各25%／完整片段</text>
<text x="595.0" y="1006" class="body" text-anchor="middle">IB另加首尾段标记</text>
<rect x="850" y="925" width="310" height="135" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="1005.0" y="955" class="node" text-anchor="middle">部署：合成相位</text>
<text x="1005.0" y="982" class="body" text-anchor="middle">用户指定名义速度与相位</text>
<text x="1005.0" y="1006" class="body" text-anchor="middle">synthesis_phase</text>
<text x="1005.0" y="1030" class="body" text-anchor="middle">不需要未来真实动作</text>
<rect x="40" y="1080" width="300" height="100" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="190.0" y="1110" class="node" text-anchor="middle">冻结T5-small编码器</text>
<text x="190.0" y="1137" class="body" text-anchor="middle">文字 → 语义上下文</text>
<rect x="400" y="1080" width="390" height="100" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="595.0" y="1110" class="node" text-anchor="middle">动作tokenizer → 动作编码器</text>
<text x="595.0" y="1137" class="body" text-anchor="middle">冻结VQ编码 → 4层Transformer Eₘ</text>
<text x="595.0" y="1161" class="body" text-anchor="middle">Eₘ在阶段2训练，推理固定</text>
<rect x="850" y="1100" width="310" height="95" rx="10" fill="#fff" stroke="#a9b8ca" stroke-width="1.5"/>
<text x="1005.0" y="1130" class="node" text-anchor="middle">评测：真值相位（oracle）</text>
<text x="1005.0" y="1157" class="body" text-anchor="middle">GT测试运动 → 离线ABFS</text>
<text x="1005.0" y="1181" class="body" text-anchor="middle">gt_phase；非部署必需输入</text>
<path d="M 190 1025 L 190 1080" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 595 1025 L 595 1080" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="1235" class="label" text-anchor="start">选择当前任务的一条上下文 Hc；三种动作任务使用ϕ，M2T关闭相位路径。</text>
<rect x="20" y="1300" width="1160" height="970" rx="16" fill="#fbfcfe" stroke="#d5deea"/>
<text x="40" y="1335" class="section" text-anchor="start">C  共享解码器：PCCA解释相位，三处原始相位注入驱动逐帧预测</text>
<rect x="40" y="1365" width="270" height="100" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="175.0" y="1395" class="node" text-anchor="middle">当前模态上下文 Hc</text>
<text x="175.0" y="1422" class="body" text-anchor="middle">来自文字或运动编码</text>
<text x="175.0" y="1446" class="body" text-anchor="middle">保留内容与已有动作信息</text>
<rect x="350" y="1365" width="470" height="100" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="585.0" y="1395" class="node" text-anchor="middle">PCCA：上下文解释相位</text>
<text x="585.0" y="1422" class="body" text-anchor="middle">Q＝相位嵌入；K/V＝Hc</text>
<text x="585.0" y="1446" class="body" text-anchor="middle">交叉注意力＋残差FFN → Hϕ fused</text>
<rect x="850" y="1365" width="310" height="100" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="1005.0" y="1395" class="node" text-anchor="middle">原始相位 ϕₜ</text>
<text x="1005.0" y="1422" class="body" text-anchor="middle">(cos Sₜ, sin Sₜ)</text>
<text x="1005.0" y="1446" class="body" text-anchor="middle">单一全身周期坐标</text>
<path d="M 310 1415 L 350 1415" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 850 1415 L 820 1415" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="1515" width="470" height="90" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="585.0" y="1545" class="node" text-anchor="middle">编码memory：拼接 Hc 与 Hϕ fused</text>
<text x="585.0" y="1572" class="body" text-anchor="middle">解码器cross-attention读取此条件</text>
<path d="M 585 1465 L 585 1515" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 175 1465 L 175 1560 L 350 1560" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 190 1180 L 190 1210 L 12 1210 L 12 1415 L 40 1415" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 595 1180 L 595 1210 L 190 1210" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1160 992 L 1176 992 L 1176 1348 L 1030 1348 L 1030 1365" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1005 1195 L 1005 1365" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="40" y="1665" width="240" height="105" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="160.0" y="1695" class="node" text-anchor="middle">上一个动作token</text>
<text x="160.0" y="1722" class="body" text-anchor="middle">训练：teacher forcing</text>
<text x="160.0" y="1746" class="body" text-anchor="middle">推理：上一步采样结果</text>
<rect x="320" y="1665" width="300" height="105" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="470.0" y="1695" class="node" text-anchor="middle">① 输入嵌入＋相位</text>
<text x="470.0" y="1722" class="body" text-anchor="middle">Emb(mₜ₋₁) ＋ φemb(ϕₜ)</text>
<text x="470.0" y="1746" class="body" text-anchor="middle">提供当前周期位置</text>
<rect x="680" y="1665" width="480" height="105" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="920.0" y="1695" class="node" text-anchor="middle">窗口因果自注意力</text>
<text x="920.0" y="1722" class="body" text-anchor="middle">动作任务：当前位置＋前4个token</text>
<text x="920.0" y="1746" class="body" text-anchor="middle">减少长历史对当前节奏的主导</text>
<rect x="680" y="1815" width="480" height="105" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="920.0" y="1845" class="node" text-anchor="middle">解码器交叉注意力</text>
<text x="920.0" y="1872" class="body" text-anchor="middle">读取PCCA拼接memory</text>
<text x="920.0" y="1896" class="body" text-anchor="middle">把动作内容与节奏状态联系起来</text>
<rect x="680" y="1965" width="480" height="105" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="920.0" y="1995" class="node" text-anchor="middle">② 相位门控MoE FFN</text>
<text x="920.0" y="2022" class="body" text-anchor="middle">每层4个FFN专家，softmax混合</text>
<text x="920.0" y="2046" class="body" text-anchor="middle">门控仅看ϕₜ，不是预定义动作阶段</text>
<rect x="680" y="2115" width="480" height="105" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="920.0" y="2145" class="node" text-anchor="middle">③ 相位门控动作输出头</text>
<text x="920.0" y="2172" class="body" text-anchor="middle">8个专家头混合logits → softmax</text>
<text x="920.0" y="2196" class="body" text-anchor="middle">预测1024项动作词表中的下一token</text>
<path d="M 280 1717 L 320 1717" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 620 1717 L 680 1717" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 920 1770 L 920 1815" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 920 1920 L 920 1965" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 920 2070 L 920 2115" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 350 1590 L 300 1590 L 300 1867 L 680 1867" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1160 1415 L 1188 1415 L 1188 1640 L 470 1640 L 470 1665" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1188 1640 L 1188 2017 L 1160 2017" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1188 2017 L 1188 2167 L 1160 2167" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 680 2167 L 640 2167 L 640 1625 L 160 1625 L 160 1665" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="40" y="1910" class="label" text-anchor="start">一个解码器，各任务选择不同路由</text>
<rect x="40" y="1965" width="540" height="145" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="310.0" y="1995" class="node" text-anchor="middle">M2T无相位路由（同一解码器）</text>
<text x="310.0" y="2022" class="body" text-anchor="middle">Hc直接作为memory，不使用PCCA相位</text>
<text x="310.0" y="2046" class="body" text-anchor="middle">自注意力恢复完整因果历史</text>
<text x="310.0" y="2070" class="body" text-anchor="middle">4个FFN专家均匀平均；跳过动作输出头</text>
<path d="M 40 1415 L 28 1415 L 28 2037 L 40 2037" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="40" y="2170" class="label" text-anchor="start">三处直接注入之外，PCCA是第4个相位入口。</text>
<text x="40" y="2200" class="label" text-anchor="start">动作生成改变token分布，不做硬约束投影。</text>
<text x="40" y="2248" class="label" text-anchor="start">训练后参数在推理中固定；相位、文本和动作条件随任务变化。</text>
<path d="M 960 747 L 1196 747 L 1196 1717 L 1160 1717" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="20" y="2300" width="1160" height="260" rx="16" fill="#f6f8fb" stroke="#d5deea"/>
<text x="40" y="2335" class="section" text-anchor="start">D  按任务解码：运动与文字使用不同输出头</text>
<rect x="40" y="2365" width="540" height="110" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="310.0" y="2395" class="node" text-anchor="middle">M2T：冻结T5 LM head → 舞蹈描述</text>
<text x="310.0" y="2422" class="body" text-anchor="middle">文字token自回归；beam＝4</text>
<text x="310.0" y="2446" class="body" text-anchor="middle">描述舞种、舞步、运动方式与质感</text>
<rect x="680" y="2365" width="480" height="110" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="920.0" y="2395" class="node" text-anchor="middle">动作token → 冻结VQ-VAE解码器</text>
<text x="920.0" y="2422" class="body" text-anchor="middle">top-k＝50，top-p＝0.95，temperature＝1</text>
<text x="920.0" y="2446" class="body" text-anchor="middle">还原50 Hz运动：整段／续写／中间片段</text>
<path d="M 40 2075 L 16 2075 L 16 2420 L 40 2420" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path d="M 920 2220 L 920 2365" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="2518" class="label" text-anchor="start">相位频率是条件旋钮，不保证指定舞步次数、精确接触或逐部位事件时刻。</text>
<rect x="20" y="2590" width="1160" height="235" rx="16" fill="#fffaf2" stroke="#d5deea"/>
<text x="40" y="2625" class="section" text-anchor="start">E  可选MuP2M扩展：从四任务checkpoint单独微调音乐条件</text>
<rect x="40" y="2655" width="235" height="100" rx="10" fill="#fff2df" stroke="#d1ab70" stroke-width="1.5"/>
<text x="157.5" y="2685" class="node" text-anchor="middle">配对音乐</text>
<text x="157.5" y="2712" class="body" text-anchor="middle">仅扩展阶段使用</text>
<text x="157.5" y="2736" class="body" text-anchor="middle">AIST++配对数据</text>
<rect x="310" y="2655" width="260" height="100" rx="10" fill="#eaf3ff" stroke="#82a8d6" stroke-width="1.5"/>
<text x="440.0" y="2685" class="node" text-anchor="middle">冻结MERT-v1-95M</text>
<text x="440.0" y="2712" class="body" text-anchor="middle">768维、75 Hz</text>
<text x="440.0" y="2736" class="body" text-anchor="middle">音频语义特征</text>
<rect x="605" y="2655" width="260" height="100" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="735.0" y="2685" class="node" text-anchor="middle">可训练音乐适配器</text>
<text x="735.0" y="2712" class="body" text-anchor="middle">768 → 512维</text>
<text x="735.0" y="2736" class="body" text-anchor="middle">75 → 50 Hz</text>
<rect x="900" y="2655" width="260" height="100" rx="10" fill="#eaf6ef" stroke="#8ab99a" stroke-width="1.5"/>
<text x="1030.0" y="2685" class="node" text-anchor="middle">音乐＋相位条件</text>
<text x="1030.0" y="2712" class="body" text-anchor="middle">复用C区机制</text>
<text x="1030.0" y="2736" class="body" text-anchor="middle">微调适配器与解码器</text>
<path d="M 275 2705 L 310 2705" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 570 2705 L 605 2705" fill="none" stroke="#536477" stroke-width="2" marker-end="url(#arrow)"/>
