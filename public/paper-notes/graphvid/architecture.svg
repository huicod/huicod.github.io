<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2000" viewBox="0 0 1440 2000" role="img" aria-labelledby="title desc">
<title id="title">GraphVid完整架构：交互图如何成为视频生成条件</title><desc id="desc">图像对象与用户交互构成有向场景图；节点及边特征经过时序投影和GINEConv，再变成LTX条件token。目标视频提供流匹配监督，只训练图网络、适配器及LoRA。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#435b73"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#ac6b20"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183a56}.title{font-size:32px;font-weight:700}.section{font-size:26px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:22px}.small{font-size:20px;fill:#486884}</style><rect width="1440" height="2000" fill="white"/>
<text x="32" y="48" class="title">GraphVid：把“谁如何影响谁”变成视频模型的生成条件</text>
<text x="32" y="82" class="small">教学重绘 · 依据 arXiv:2607.21580v2 图2–3、§3–5、附录A–B与提示词 · 非运行结果</text>
<rect x="24" y="108" width="1392" height="447" rx="18" fill="#f7f9fc" stroke="#c9d7e4" stroke-width="1.5"/>
<text x="46" y="147" class="section">A  图像中的实体 + 用户意图 → 可编辑的有向交互图</text>
<rect x="55" y="180" width="280" height="140" rx="14" fill="#f1eaf8" stroke="#ad94cf" stroke-width="1.5"/>
<text x="71" y="214" class="head">输入图像 I₀</text>
<text x="71" y="247" class="body">单帧场景与对象外观</text>
<text x="71" y="276" class="body">保留首帧作为视频条件</text>
<text x="71" y="305" class="body">用户在图像上操作</text>
<rect x="390" y="180" width="320" height="140" rx="14" fill="#eef1f5" stroke="#a9bbcb" stroke-width="1.5"/>
<text x="406" y="214" class="head">对象提取（预训练）</text>
<text x="406" y="247" class="body">Qwen3-VL检测对象</text>
<text x="406" y="276" class="body">对象ID、标签与边界框</text>
<text x="406" y="305" class="body">裁剪区域用于视觉特征</text>
<rect x="810" y="180" width="550" height="140" rx="14" fill="#e7f4ef" stroke="#80b8a4" stroke-width="1.5"/>
<text x="826" y="214" class="head">初始场景图</text>
<text x="826" y="247" class="body">MLLM按图像与对象列表推断初始关系</text>
<text x="826" y="276" class="body">节点绑定实体，边绑定源对象 → 目标对象</text>
<text x="826" y="305" class="body">关系含文字描述、定性方向与强弱</text>
<rect x="390" y="380" width="320" height="120" rx="14" fill="#f1eaf8" stroke="#ad94cf" stroke-width="1.5"/>
<text x="406" y="414" class="head">用户交互记录</text>
<text x="406" y="447" class="body">选择对象、箭头/向量</text>
<text x="406" y="476" class="body">文字说明期望动作</text>
<rect x="810" y="365" width="550" height="145" rx="14" fill="#e9f1ff" stroke="#80a7db" stroke-width="1.5"/>
<text x="826" y="399" class="head">MLLM更新图结构</text>
<text x="826" y="432" class="body">基于当前图 + 用户记录 + 图像证据</text>
<text x="826" y="461" class="body">删除旧边 / 加入或更新目标关系</text>
<text x="826" y="490" class="body">对象间交互用有向边；单对象用自环</text>
<path d="M335 250 H390" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M710 250 H810" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1085 320 V365" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M710 440 H810" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M195 320 V440 H390" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="55" y="534" class="small">关系文字提供条件：push / pull / hold 等不是数值物理求解器，也没有自动保证接触或避碰。</text>
<rect x="24" y="580" width="1392" height="425" rx="18" fill="#f7f9fc" stroke="#c9d7e4" stroke-width="1.5"/>
<text x="46" y="619" class="section">B  节点与边分别编码 → 带关系语义的消息传递</text>
<rect x="55" y="650" width="380" height="145" rx="14" fill="#e7f4ef" stroke="#80b8a4" stroke-width="1.5"/>
<text x="71" y="684" class="head">节点特征 xᵢ</text>
<text x="71" y="717" class="body">对象crop视觉池化：8192维</text>
<text x="71" y="746" class="body">对象标签文字：2560维</text>
<text x="71" y="775" class="body">归一化边界框：4维</text>
<rect x="55" y="825" width="380" height="130" rx="14" fill="#e7f4ef" stroke="#80b8a4" stroke-width="1.5"/>
<text x="71" y="859" class="head">边特征 eⱼᵢ</text>
<text x="71" y="892" class="body">开放词汇的交互描述</text>
<text x="71" y="921" class="body">Qwen3-Embedding：2560维</text>
<rect x="500" y="685" width="350" height="240" rx="14" fill="#e9f1ff" stroke="#80a7db" stroke-width="1.5"/>
<text x="516" y="719" class="head">两路投影与时序聚合</text>
<text x="516" y="752" class="body">图3：Linear → Temporal</text>
<text x="516" y="781" class="body">Conv1D → Temporal Pooling</text>
<text x="516" y="810" class="body">节点与边投影到512维</text>
<text x="516" y="839" class="body">保留边方向与邻接关系</text>
<text x="516" y="868" class="body">仅编码条件，不解码轨迹</text>
<rect x="930" y="685" width="430" height="240" rx="14" fill="#e9f1ff" stroke="#80a7db" stroke-width="1.5"/>
<text x="946" y="719" class="head">Edge-Aware GNN</text>
<text x="946" y="752" class="body">GINEConv → ReLU → …</text>
<text x="946" y="781" class="body">目标节点聚合邻居与边语义</text>
<text x="946" y="810" class="body">hⱼ + aⱼᵢ 先结合，再聚合</text>
<text x="946" y="839" class="body">每个对象得到交互感知表示</text>
<text x="946" y="868" class="body">节点身份 + “谁对它做什么”</text>
<path d="M1085 510 V565 H885 V628 H245 V650" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1085 565 H32 V890 H55" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M435 722 H500" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M435 885 H500" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M850 805 H930" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="55" y="981" class="small">节点维度：8192 + 2560 + 4 = 10756。箭头表示特征与图关系；物理词汇仍是学习条件。</text>
<rect x="24" y="1030" width="1392" height="455" rx="18" fill="#f7f9fc" stroke="#c9d7e4" stroke-width="1.5"/>
<text x="46" y="1069" class="section">C  图条件 + 首帧 + 噪声 → 连续视频latent → RGB视频</text>
<rect x="55" y="1125" width="360" height="180" rx="14" fill="#e9f1ff" stroke="#80a7db" stroke-width="1.5"/>
<text x="71" y="1159" class="head">Graph-to-Video Adapter</text>
<text x="71" y="1192" class="body">三层MLP：512 → 4096</text>
<text x="71" y="1221" class="body">对象token补齐到最多30节点</text>
<text x="71" y="1250" class="body">与边文字token拼接</text>
<text x="71" y="1279" class="body">送入encoder hidden states</text>
<rect x="495" y="1125" width="455" height="180" rx="14" fill="#eef1f5" stroke="#a9bbcb" stroke-width="1.5"/>
<text x="511" y="1159" class="head">LTX-Video DiT（原权重冻结）</text>
<text x="511" y="1192" class="body">接收首帧、图条件、噪声及时间</text>
<text x="511" y="1221" class="body">注意力Q/K/V/输出加入LoRA</text>
<text x="511" y="1250" class="body">LoRA可训练：rank128，α32</text>
<text x="511" y="1279" class="body">迭代预测流速度并更新latent</text>
<rect x="1040" y="1125" width="320" height="180" rx="14" fill="#eef1f5" stroke="#a9bbcb" stroke-width="1.5"/>
<text x="1056" y="1159" class="head">VAE解码（冻结）</text>
<text x="1056" y="1192" class="body">视频latent → RGB视频</text>
<text x="1056" y="1221" class="body">默认81帧，16FPS</text>
<text x="1056" y="1250" class="body">输出约5秒人物/物体画面</text>
<text x="1056" y="1279" class="body">并非3D骨架或力学轨迹</text>
<rect x="55" y="1350" width="360" height="95" rx="14" fill="#f1eaf8" stroke="#ad94cf" stroke-width="1.5"/>
<text x="71" y="1384" class="head">首帧 + 视频latent噪声</text>
<text x="71" y="1417" class="body">首帧外观条件与采样起点</text>
<rect x="1040" y="1350" width="320" height="95" rx="14" fill="#f1eaf8" stroke="#ad94cf" stroke-width="1.5"/>
<text x="1056" y="1384" class="head">检查生成结果</text>
<text x="1056" y="1417" class="body">关系是否实现需看输出</text>
<path d="M1145 925 V1098 H235 V1125" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="850" y="1085" class="small">交互感知节点表示</text>
<path d="M415 1215 H495" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M950 1215 H1040" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M415 1397 H720 V1305" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1200 1305 V1350" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="455" y="1420" class="small">图指定意图，生成器补连续运动与外观；</text>
<text x="455" y="1450" class="small">没有另一个显式动力学/约束求解模块。</text>
<rect x="24" y="1510" width="1392" height="350" rx="18" fill="#f7f9fc" stroke="#c9d7e4" stroke-width="1.5"/>
<text x="46" y="1549" class="section">D  训练支线：从已有视频构建图监督，学习图到视频的适配</text>
<rect x="55" y="1590" width="355" height="180" rx="14" fill="#fff3e1" stroke="#d3a365" stroke-width="1.5"/>
<text x="71" y="1624" class="head">视频语料与自动整理</text>
<text x="71" y="1657" class="body">WISA-80K / SSv2 / MagicData</text>
<text x="71" y="1686" class="body">VLM保留离散对象交互</text>
<text x="71" y="1715" class="body">512×288；81帧；16FPS</text>
<text x="71" y="1744" class="body">选择运动能量最大的片段</text>
<rect x="475" y="1590" width="440" height="180" rx="14" fill="#fff3e1" stroke="#d3a365" stroke-width="1.5"/>
<text x="491" y="1624" class="head">图—视频配对与流匹配</text>
<text x="491" y="1657" class="body">初始图 + 视频描述 → 合成图编辑</text>
<text x="491" y="1686" class="body">目标视频经冻结VAE得到x₀</text>
<text x="491" y="1715" class="body">xₜ = (1−t)x₀ + tx₁；x₁为噪声</text>
<text x="491" y="1744" class="body">预测速度与 x₁−x₀ 匹配</text>
<rect x="990" y="1590" width="370" height="180" rx="14" fill="#e9f1ff" stroke="#80a7db" stroke-width="1.5"/>
<text x="1006" y="1624" class="head">更新范围</text>
<text x="1006" y="1657" class="body">图网络 + 三层适配器 + LoRA</text>
<text x="1006" y="1686" class="body">VAE与DiT原权重保持冻结</text>
<text x="1006" y="1715" class="body">不从零训练整个视频基础模型</text>
<text x="1006" y="1744" class="body">训练所得模块复用于B、C</text>
<path d="M410 1680 H475" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M915 1680 H990" fill="none" stroke="#435b73" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1175 1590 V1500 H1388 V805 H1360" fill="none" stroke="#ac6b20" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#orange)"/>
<text x="55" y="1823" class="small">语料：27,504条。报告训练8×A100约2.5天（约480 GPU-hours）；不包含上游基础模型预训练。</text>
<text x="32" y="1900" class="small">图例：绿色＝结构/特征；蓝色＝学习模块；紫色＝用户/生成条件；灰色＝冻结主干；橙色＝训练数据。</text>
<text x="32" y="1934" class="small">实线＝数据流；橙色虚线＝训练模块复用。框架按论文主实验LTX版本说明，未运行公开权重。</text>
<text x="32" y="1970" class="body">图关系正确 ≠ 精确时序/接触正确 ≠ 视频物理正确；检测遗漏还会让编辑绑定到错误对象。</text>
</svg>