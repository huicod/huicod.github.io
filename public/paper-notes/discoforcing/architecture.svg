<text x="457.5" y="3126" font-size="26" text-anchor="middle" font-weight="700">补充静音训练：BABEL 站立片段 + 空音乐</text>
<text x="457.5" y="3162" font-size="24" text-anchor="middle" font-weight="400">无音乐时站立来自训练设计，并非扩散结构天然保证</text>
