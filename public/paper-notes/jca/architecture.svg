<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1450" width="1120" height="1450" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Joints, Camera, Action! 骨架动作与视频联合生成架构</title>
<desc id="desc">给定文本、任意拓扑的角色骨架和可选参考图像，骨架图编码器给出关节描述。视频流与骨架动作流在配对层交换特征并联合去噪。关节定位头从视频预测二维位置，再结合生成的三维关节为整段视频拟合静态透视相机。图中另列两路预训练、配对联合训练以及已知单模态的采样方式。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#607b7f" stroke-width="1.6"/></marker></defs>
