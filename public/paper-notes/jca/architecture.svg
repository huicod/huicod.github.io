<text x="191" y="226" font-size="23" fill="#066f69" font-weight="700" text-anchor="start">任意树形骨架</text>
<text x="191" y="263" font-size="20" fill="#193945" font-weight="400" text-anchor="start">关节名、静止姿势、父子骨骼、节点类型</text>
<text x="191" y="301" font-size="20" fill="#193945" font-weight="400" text-anchor="start">沿骨骼传播 → 全关节注意力 → 每关节描述 D</text>
<rect x="720" y="192" width="353" height="151" rx="13" fill="#eaf2fa" stroke="#b7ccdd" stroke-width="1.5"/>
<text x="741" y="226" font-size="23" fill="#315d84" font-weight="700" text-anchor="start">条件</text>
<text x="741" y="263" font-size="20" fill="#193945" font-weight="400" text-anchor="start">文本描述所需动作与场景</text>
<text x="741" y="301" font-size="20" fill="#193945" font-weight="400" text-anchor="start">可选参考图及图中关节位置</text>
<path d="M365 344 V385" fill="none" stroke="#607b7f" stroke-width="2.4" marker-end="url(#tip)"/>
<path d="M895 344 V385" fill="none" stroke="#607b7f" stroke-width="2.4" marker-end="url(#tip)"/>
<rect x="22" y="389" width="1076" height="392" rx="16" fill="#ffffff" stroke="#c4d6d4" stroke-width="1.5"/>
<text x="47" y="429" font-size="27" fill="#193945" font-weight="700" text-anchor="start">联合采样 · 两条流同时去噪</text>
<rect x="48" y="454" width="390" height="224" rx="13" fill="#e4f3ee" stroke="#a6cfc0" stroke-width="1.5"/>
<text x="68" y="491" font-size="24" fill="#066f69" font-weight="700" text-anchor="start">骨架动作流</text>
<text x="68" y="531" font-size="20" fill="#193945" font-weight="400" text-anchor="start">每帧每关节一个动作 token</text>
<text x="68" y="569" font-size="20" fill="#193945" font-weight="400" text-anchor="start">旋转、位置及帧间变化共 18 维</text>
<text x="68" y="608" font-size="20" fill="#193945" font-weight="400" text-anchor="start">跨时空注意力 + 帧内骨架图注意力</text>
<text x="68" y="647" font-size="20" fill="#193945" font-weight="400" text-anchor="start">每个动作块都读入关节描述 D</text>
<rect x="682" y="454" width="390" height="224" rx="13" fill="#f1edf8" stroke="#cbbadc" stroke-width="1.5"/>
<text x="703" y="491" font-size="24" fill="#644588" font-weight="700" text-anchor="start">视频流</text>
<text x="703" y="531" font-size="22" fill="#193945" font-weight="400" text-anchor="start">Wan2.2 I2V-A14B</text>
<text x="703" y="569" font-size="20" fill="#193945" font-weight="400" text-anchor="start">在压缩的视频潜变量上去噪</text>
<text x="703" y="608" font-size="20" fill="#193945" font-weight="400" text-anchor="start">配对的视频块读取动作特征</text>
<text x="703" y="647" font-size="20" fill="#193945" font-weight="400" text-anchor="start">解码潜变量得到连续画面</text>
<text x="560" y="511" font-size="22" fill="#315d84" font-weight="700" text-anchor="middle">交叉注意力</text>
<path d="M452 548 H668" fill="none" stroke="#607b7f" stroke-width="2.4" marker-end="url(#tip)"/>
<path d="M668 584 H452" fill="none" stroke="#607b7f" stroke-width="2.4" marker-end="url(#tip)"/>
<text x="560" y="629" font-size="20" fill="#4c626b" font-weight="400" text-anchor="middle">配对层双向交换</text>
<text x="560" y="665" font-size="18" fill="#4c626b" font-weight="400" text-anchor="middle">输出投影零初始化</text>
<text x="52" y="723" font-size="21" fill="#193945" font-weight="400" text-anchor="start">从两路噪声出发，同时更新动作与视频。跨模态引导用桥接开启和关闭时的速度差调节耦合。</text>
<text x="52" y="757" font-size="20" fill="#4c626b" font-weight="400" text-anchor="start">给定其中一路完整信号时，也可据此生成另一路，例如由动作生成视频，或由视频恢复动作。</text>
<rect x="22" y="801" width="1076" height="380" rx="16" fill="#ffffff" stroke="#c4d6d4" stroke-width="1.5"/>
<text x="47" y="841" font-size="27" fill="#193945" font-weight="700" text-anchor="start">关节定位与相机拟合 · 用二维观测把两个输出对起来</text>
