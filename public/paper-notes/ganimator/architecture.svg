<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1493" viewBox="0 0 1040 1493" role="img" aria-labelledby="title desc">
<title id="title">GANimator · 一条示范怎样监督七层生成器</title><desc id="desc">一条示范构成时间金字塔。各层从前一层输出及噪声生成细化动作，各自用局部判别、重建和接触监督训练。粗层编辑和逐层轨迹条件是不同入口。</desc>
<defs><marker id="arrow" viewBox="0 0 9 8" refX="8" refY="4" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#416c70"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203f43}.strong{font-weight:700}.label{fill:#355a5d}.id{fill:#17756f;font-weight:700}</style>
<rect width="1040" height="1493" fill="#f5f8f6"/>
<text x="34" y="54" font-size="36" class="strong">GANimator · 一条示范怎样监督七层生成器</text>
<text x="36" y="95" font-size="22" class="label">SIGGRAPH 2022　｜　沿水平方向读时间分辨率，沿竖直方向读训练信号。</text>
<rect x="20" y="122" width="1000" height="614" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="164" font-size="23" class="id">01</text>
<text x="99" y="164" font-size="28" class="strong">训练：每一层看到同一段动作的不同帧率</text>
<rect x="46" y="201" width="128" height="58" rx="12" fill="#e8f1f7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="61" y="234" font-size="24" class="strong">示范 T₁</text>
<rect x="191" y="201" width="128" height="58" rx="12" fill="#d7eeeb" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="206" y="234" font-size="24" class="strong">生成 Q₁</text>
<path d="M109 259 V296 H183 V346" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M254 259 V296 H183 V346" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="383" y="201" width="128" height="58" rx="12" fill="#e8f1f7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="398" y="234" font-size="24" class="strong">示范 Tᵢ</text>
<rect x="528" y="201" width="128" height="58" rx="12" fill="#d7eeeb" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="543" y="234" font-size="24" class="strong">生成 Qᵢ</text>
<path d="M446 259 V296 H520 V346" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M591 259 V296 H520 V346" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="720" y="201" width="128" height="58" rx="12" fill="#e8f1f7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="735" y="234" font-size="24" class="strong">示范 T₇</text>
<rect x="865" y="201" width="128" height="58" rx="12" fill="#d7eeeb" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="880" y="234" font-size="24" class="strong">生成 Q₇</text>
<path d="M783 259 V296 H857 V346" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M928 259 V296 H857 V346" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="46" y="320" font-size="20" class="label">粗尺度</text>
<text x="383" y="320" font-size="20" class="label">中间尺度</text>
<text x="720" y="320" font-size="20" class="label">原帧率</text>
<rect x="46" y="347" width="274" height="99" rx="12" fill="#eeeaf7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="61" y="380" font-size="24" class="strong">判别器 D₁</text>
<text x="61" y="413" font-size="21" class="">真实 T₁ ↔ 生成 Q₁</text>
<text x="61" y="440" font-size="21" class="">局部窗口评分后取均值</text>
<rect x="383" y="347" width="274" height="99" rx="12" fill="#eeeaf7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="398" y="380" font-size="24" class="strong">判别器 Dᵢ</text>
<text x="398" y="413" font-size="21" class="">真实 Tᵢ ↔ 生成 Qᵢ</text>
<text x="398" y="440" font-size="21" class="">局部窗口评分后取均值</text>
<rect x="720" y="347" width="274" height="99" rx="12" fill="#eeeaf7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="735" y="380" font-size="24" class="strong">判别器 D₇</text>
<text x="735" y="413" font-size="21" class="">真实 T₇ ↔ 生成 Q₇</text>
<text x="735" y="440" font-size="21" class="">局部窗口评分后取均值</text>
<rect x="46" y="489" width="948" height="57" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="61" y="522" font-size="24" class="strong">局部对抗损失：各层在自己的帧率上学怎样的短动作像示范。</text>
<path d="M183 446 V489" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<path d="M520 446 V489" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<path d="M857 446 V489" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<rect x="46" y="583" width="439" height="111" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="61" y="616" font-size="24" class="strong">固定噪声 → 重建示范</text>
<text x="61" y="649" font-size="21" class="">对每层预测与对应的示范动作计算 L1。</text>
<rect x="552" y="583" width="442" height="111" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="567" y="616" font-size="24" class="strong">FK 脚速 × 预测的接触强度</text>
<text x="567" y="649" font-size="21" class="">从生成的关节旋转与根位移计算脚速。</text>
<g transform="translate(0 155)">
<rect x="20" y="606" width="1000" height="279" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="648" font-size="23" class="id">02</text>
<text x="99" y="648" font-size="28" class="strong">生成：粗层先出轮廓，后续层预测运动残差</text>
<rect x="46" y="694" width="239" height="100" rx="12" fill="#e3f1e9" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="61" y="727" font-size="24" class="strong">G₁：噪声 z₁</text>
<text x="61" y="760" font-size="21" class="">输出低帧率动作 Q₁。</text>
<rect x="352" y="694" width="332" height="100" rx="12" fill="#e3f1e9" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="367" y="727" font-size="24" class="strong">Gᵢ：上采样基底 B</text>
<text x="367" y="760" font-size="21" class="">B 与本层噪声 zᵢ 送入骨架卷积，</text>
<text x="367" y="787" font-size="21" class="">输出 Qᵢ = B ＋ 预测残差。</text>
<rect x="751" y="694" width="244" height="100" rx="12" fill="#d7eeeb" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="766" y="727" font-size="24" class="strong">最终动作 Q₇</text>
<text x="766" y="760" font-size="21" class="">同一角色的关节运动</text>
<text x="766" y="787" font-size="21" class="">和足部接触标签。</text>
<path d="M285 744 H352" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M684 744 H751" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="47" y="850" font-size="20" class="label">对第 2 至 7 层重复中间操作。自由生成只使用生成器；原文图 4 从 371 帧舞蹈生成了 600 帧。</text>
<rect x="20" y="910" width="1000" height="320" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="952" font-size="23" class="id">03</text>
<text x="99" y="952" font-size="28" class="strong">编辑：改变粗层动作，或另训根轨迹条件模型</text>
<rect x="44" y="993" width="433" height="86" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="59" y="1026" font-size="24" class="strong">稀疏关键帧或内容姿势</text>
<text x="59" y="1059" font-size="21" class="">改写最粗层动作，沿用已有细层。</text>
<rect x="563" y="993" width="432" height="86" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="578" y="1026" font-size="24" class="strong">指定根轨迹</text>
<text x="578" y="1059" font-size="21" class="">先用普通生成器的样本训练条件模型。</text>
<rect x="44" y="1126" width="433" height="79" rx="12" fill="#d7eeeb" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="59" y="1159" font-size="24" class="strong">细化过渡、补风格细节</text>
<text x="59" y="1192" font-size="21" class="">编辑姿势由粗层传给后续层。</text>
<rect x="563" y="1126" width="432" height="79" rx="12" fill="#d7eeeb" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="578" y="1159" font-size="24" class="strong">逐层写回受控通道</text>
<text x="578" y="1192" font-size="21" class="">输入、输出都保留根条件，生成其他关节。</text>
<path d="M261 1079 V1126" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M779 1079 V1126" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
<text x="38" y="1435" font-size="20" class="label">实线表示动作或条件传递；虚线对应训练损失。各尺度的局部窗口用于学习，没有舞步标签。</text>
<text x="38" y="1469" font-size="20" class="label">据原文图 2–4、8–11 与式 4–8 重绘。七个时间尺度的中间层以 i 表示。</text>
</svg>
