<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1540" role="img" aria-labelledby="title desc"><title id="title">FlowerDance：平均速度训练与整段舞蹈生成</title><desc id="desc">训练以MeanFlow目标和重建位置速度损失优化同一骨干；推理融合音乐与舞种，双向Mamba读取整段带噪动作，预测平均速度并多步更新，可选软掩码编辑，输出姿态经FK得到骨架。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#44657b" stroke-width="1.7"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#263c48}.head{font-size:31px;font-weight:700}.group{font-size:25px;font-weight:700}.title{font-size:23px;font-weight:700}.body{font-size:21px}.label{font-size:19px;fill:#526b7c}.line,.dash,.edit{fill:none;stroke:#44657b;stroke-width:2.6;marker-end:url(#a)}.dash{stroke:#9472ac;stroke-dasharray:8 7}.edit{stroke:#bb873e;stroke-dasharray:8 7}</style><rect width="1500" height="1540" fill="white"/><text x="35" y="42" class="head">FlowerDance · 音乐与舞种 → 整段平均速度更新 → 连续舞蹈</text><rect x="20" y="68" width="1460" height="388" rx="18" fill="#faf7ff" stroke="#d3c4e5"/><text x="42" y="108" class="group">A  训练：同一骨干同时接受平均速度与运动学监督</text><rect x="20" y="480" width="1460" height="1000" rx="18" fill="#f9fcfe" stroke="#cbdce7"/><text x="42" y="520" class="group">B  推理：非自回归整段生成；公开 v3 主实验为20次更新</text><rect x="45" y="145" width="365" height="120" rx="13" fill="#fff2dc" stroke="#d4ac70" stroke-width="1.8"/><text x="63" y="179" class="title">配对音乐与真实舞蹈</text><text x="63" y="212" class="body">舞种标签 + 连续动作 x</text><text x="63" y="241" class="body">采样高斯噪声 ε 与时刻 t、r</text><rect x="475" y="145" width="450" height="120" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="493" y="179" class="title">带噪动作与区间目标</text><text x="493" y="212" class="body">z_t=(1−t)x+tε；v=ε−x</text><text x="493" y="241" class="body">同一速度网络 + JVP 全导数</text><rect x="995" y="145" width="450" height="120" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="1013" y="179" class="title">MeanFlow 损失</text><text x="1013" y="212" class="body">目标：stopgrad[v−(t−r)du/dt]</text><text x="1013" y="241" class="body">学习跨生成区间的平均速度</text><path d="M410 205 H475" class="line"/><path d="M925 205 H995" class="line"/><rect x="475" y="315" width="450" height="110" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="493" y="349" class="title">额外还原一次干净动作</text><text x="493" y="382" class="body">另采 t₁；x̂=z_t₁−t₁uθ(z_t₁,0,t₁)</text><rect x="995" y="315" width="450" height="110" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="1013" y="349" class="title">PCC 运动学监督</text><text x="1013" y="382" class="body">表示重建 + FK位置 + 关节速度</text><text x="1013" y="411" class="body">与MeanFlow目标共同优化</text><path d="M700 265 V315" class="dash"/><path d="M925 370 H995" class="dash"/><text x="50" y="326" class="label">无外部蒸馏教师</text><text x="50" y="357" class="label">无冻结动作 VAE</text><text x="50" y="388" class="label">PCC 不进入推理循环</text><rect x="45" y="565" width="365" height="115" rx="13" fill="#fff2dc" stroke="#d4ac70" stroke-width="1.8"/><text x="63" y="599" class="title">整段音乐</text><text x="63" y="632" class="body">35维逐帧 Librosa 特征</text><text x="63" y="661" class="body">节拍、色度、MFCC 等</text><rect x="475" y="565" width="450" height="115" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="493" y="599" class="title">舞种条件 + 音乐编码</text><text x="493" y="632" class="body">舞种嵌入与门控融合</text><text x="493" y="661" class="body">双向 Mamba 读取前后文</text><rect x="995" y="565" width="450" height="115" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="1013" y="599" class="title">对齐的条件序列 C</text><text x="1013" y="632" class="body">条件表示保留整段时间轴</text><text x="1013" y="661" class="body">音乐、舞种在此融合</text><path d="M410 622 H475" class="line"/><path d="M925 622 H995" class="line"/><rect x="45" y="755" width="365" height="135" rx="13" fill="#fff2dc" stroke="#d4ac70" stroke-width="1.8"/><text x="63" y="789" class="title">整段高斯噪声 / 当前 z_t</text><text x="63" y="822" class="body">所有帧共同更新</text><text x="63" y="851" class="body">147维姿态（论文表示）</text><text x="63" y="880" class="body">代码另含4个接触通道</text><rect x="475" y="755" width="450" height="135" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="493" y="789" class="title">平均速度网络 uθ</text><text x="493" y="822" class="body">BiMamba → 时间 FiLM</text><text x="493" y="851" class="body">→ 逐通道加入音乐条件 C</text><text x="493" y="880" class="body">输出每帧状态的平均速度</text><rect x="995" y="755" width="450" height="135" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="1013" y="789" class="title">生成区间信息</text><text x="1013" y="822" class="body">t、r（代码用 t 与 t−r）</text><text x="1013" y="851" class="body">嵌入后注入 FiLM</text><text x="1013" y="880" class="body">不是舞蹈帧时间或动作相位</text><path d="M410 820 H475" class="line"/><path d="M995 820 H925" class="line"/><path d="M1220 680 V720 H700 V755" class="line"/><text x="730" y="711" class="label">条件 C</text><path d="M1445 370 H1460 V920 H950 V850 H925" class="dash"/><text x="990" y="910" class="label">训练参数复用；推理不更新参数</text><rect x="475" y="975" width="450" height="120" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="493" y="1009" class="title">区间更新</text><text x="493" y="1042" class="body">z_r = z_t − (t−r)uθ</text><text x="493" y="1071" class="body">每步共同推进整段动作</text><path d="M700 890 V975" class="line"/><text x="720" y="945" class="label">高维生成路径的平均速度</text><rect x="995" y="975" width="450" height="120" rx="13" fill="#fff2dc" stroke="#d4ac70" stroke-width="1.8"/><text x="1013" y="1009" class="title">可选：参考动作 x′ + 掩码 M</text><text x="1013" y="1042" class="body">按当前时刻加噪后软混合</text><text x="1013" y="1071" class="body">权重 t·M 随 t→0 而减弱</text><path d="M995 1035 H925" class="edit"/><text x="1020" y="1135" class="label">不保证最终关键帧完全等于输入</text><path d="M475 1035 H435 V720 H228 V755" class="line"/><text x="48" y="950" class="label">下一生成时刻</text><text x="48" y="980" class="label">继续更新；共20步</text><rect x="45" y="1220" width="365" height="130" rx="13" fill="#eaf6ee" stroke="#8abb9b" stroke-width="1.8"/><text x="63" y="1254" class="title">完成的连续动作</text><text x="63" y="1287" class="body">根位移 + 24关节6维旋转</text><text x="63" y="1316" class="body">不是离散动作词或文本计划</text><rect x="475" y="1220" width="450" height="130" rx="13" fill="#eaf6ee" stroke="#8abb9b" stroke-width="1.8"/><text x="493" y="1254" class="title">旋转转换 + 前向运动学</text><text x="493" y="1287" class="body">无额外学习式动作解码器</text><text x="493" y="1316" class="body">由SMPL骨架计算关节位置</text><rect x="995" y="1220" width="450" height="130" rx="13" fill="#eaf6ee" stroke="#8abb9b" stroke-width="1.8"/><text x="1013" y="1254" class="title">舞蹈骨架 / 渲染</text><text x="1013" y="1287" class="body">整段输出，可用于预览与编辑</text><text x="1013" y="1316" class="body">接触、碰撞与目标误差另行检查</text><path d="M700 1095 V1160 H228 V1220" class="line"/><text x="280" y="1150" class="label">最后一步完成</text><path d="M410 1285 H475" class="line"/><path d="M925 1285 H995" class="line"/><text x="45" y="1410" class="label">读图边界：双向音乐上下文 ≠ 严格在线；20步平均速度更新 ≠ 一次前向完成。</text><text x="45" y="1445" class="label">软掩码和PCC是平滑／运动学机制，没有物理仿真或硬接触求解器。</text><text x="35" y="1520" class="label">教学重绘依据：arXiv v3 图2、式1–10、§3；实线数据流，紫色虚线训练复用，橙色虚线可选编辑。</text></svg>