<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2230" viewBox="0 0 1200 2230"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#476579"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#183247} .small{font-size:20px} .body{font-size:22px} .title{font-size:28px;font-weight:700}</style><rect width="1200" height="2230" fill="#f5f8fb"/><text x="40" y="48" font-size="32" font-weight="700">Control Operators · 结构化控制如何进入动作模型</text><text x="40" y="82" font-size="20" font-weight="normal">依据论文 §3–4 / 图3、5重绘；蓝色：控制结构，绿色：动作表示，紫色：学习模型</text><rect x="30" y="110" width="1140" height="285" rx="20" fill="white" stroke="#c9d8e2"/><text x="55" y="153" font-size="28" font-weight="700">① 设计阶段：先声明允许的输入结构</text><rect x="65" y="185" width="310" height="125" rx="12" fill="#e9f2f9" stroke="#87a6ba"/><text x="83" y="219" font-size="24" font-weight="700">Control Schema</text><text x="83" y="252" font-size="22" font-weight="normal">字段类型 / 可选值</text><text x="83" y="281" font-size="22" font-weight="normal">行为分支 / 集合与数组</text><rect x="445" y="185" width="310" height="125" rx="12" fill="#e9f2f9" stroke="#87a6ba"/><text x="463" y="219" font-size="24" font-weight="700">组合控制算子</text><text x="463" y="252" font-size="22" font-weight="normal">And / Or / Set / Optional</text><text x="463" y="281" font-size="22" font-weight="normal">为该结构生成编码网络</text><rect x="825" y="185" width="310" height="125" rx="12" fill="#e9f2f9" stroke="#87a6ba"/><text x="843" y="219" font-size="24" font-weight="700">Control Encoder C</text><text x="843" y="252" font-size="22" font-weight="normal">结构固定，参数可训练</text><text x="843" y="281" font-size="22" font-weight="normal">不同输入 → 固定维 c</text><path d="M375 245 H445" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><path d="M755 245 H825" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><text x="65" y="359" font-size="22" font-weight="normal">运行时可在已声明结构内切换；Or 由调用方选分支，不负责规划下一种行为。</text><rect x="30" y="420" width="1140" height="815" rx="20" fill="white" stroke="#c9d8e2"/><text x="55" y="463" font-size="28" font-weight="700">② 离线阶段：训练动作表示，再分别训练一个后端</text><rect x="65" y="500" width="300" height="125" rx="12" fill="#e8f4ec" stroke="#87a6ba"/><text x="83" y="534" font-size="24" font-weight="700">动作捕捉数据</text><text x="83" y="567" font-size="22" font-weight="normal">姿态 / 速度 / 接触标签</text><text x="83" y="596" font-size="22" font-weight="normal">Training Controls 提取 v</text><rect x="435" y="500" width="300" height="125" rx="12" fill="#e8f4ec" stroke="#87a6ba"/><text x="453" y="534" font-size="24" font-weight="700">姿态自编码器 E / D</text><text x="453" y="567" font-size="22" font-weight="normal">归一化、误差传播加权</text><text x="453" y="596" font-size="22" font-weight="normal">重建 p → z → p</text><rect x="805" y="500" width="330" height="125" rx="12" fill="#e8f4ec" stroke="#87a6ba"/><text x="823" y="534" font-size="24" font-weight="700">128 维潜在姿态 z</text><text x="823" y="567" font-size="22" font-weight="normal">相邻帧或 8 帧片段</text><text x="823" y="596" font-size="22" font-weight="normal">E / D 完成训练后复用</text><path d="M365 560 H435" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><text x="372" y="545" font-size="20" font-weight="normal">姿态 p</text><path d="M735 560 H805" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><text x="750" y="545" font-size="20" font-weight="normal">E(p)</text><rect x="65" y="690" width="510" height="155" rx="12" fill="#edf0fc" stroke="#87a6ba"/><text x="83" y="724" font-size="24" font-weight="700">A · Flow 分支的训练样本</text><text x="83" y="757" font-size="22" font-weight="normal">相邻 z_prev、z_target 与当前控制 v</text><text x="83" y="786" font-size="22" font-weight="normal">单位高斯 ε；插值 z̄=(1−t)ε+t z_target</text><text x="83" y="815" font-size="22" font-weight="normal">上一帧加噪；t 为积分时间</text><rect x="625" y="690" width="510" height="155" rx="12" fill="#fff4df" stroke="#87a6ba"/><text x="643" y="724" font-size="24" font-weight="700">B · LMM 分支的训练样本</text><text x="643" y="757" font-size="22" font-weight="normal">控制 v → 用户定义 Matching Function</text><text x="643" y="786" font-size="22" font-weight="normal">在动作库匹配最佳帧</text><text x="643" y="815" font-size="22" font-weight="normal">取随后 8 帧 latent，拼成目标 w</text><path d="M970 625 V660 H320 V690" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><text x="505" y="651" font-size="20" font-weight="normal">z 与控制标签在各分支配对</text><path d="M970 660 H880 V690" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="920" width="510" height="155" rx="12" fill="#edf0fc" stroke="#87a6ba"/><text x="83" y="954" font-size="24" font-weight="700">联合训练 C 与 Flow Network V</text><text x="83" y="987" font-size="22" font-weight="normal">V(z̄, ẑ_prev, C(v), t) → 运输速度</text><text x="83" y="1016" font-size="22" font-weight="normal">MSE 目标：z_target − ε</text><text x="83" y="1045" font-size="22" font-weight="normal">可选：多步教师再蒸馏成单步模型</text><rect x="625" y="920" width="510" height="155" rx="12" fill="#fff4df" stroke="#87a6ba"/><text x="643" y="954" font-size="24" font-weight="700">联合训练 C 与 Projector P</text><text x="643" y="987" font-size="22" font-weight="normal">P(C(v)) → 8 帧潜在片段 w</text><text x="643" y="1016" font-size="22" font-weight="normal">匹配结果提供监督</text><text x="643" y="1045" font-size="22" font-weight="normal">可加入交互控制记录后重新匹配训练</text><path d="M320 845 V920" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><path d="M880 845 V920" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><text x="65" y="1130" font-size="22" font-weight="normal">C 的结构来自①；E / D 由本阶段先行训练。两条路线分别训练、分别使用。</text><text x="65" y="1170" font-size="20" font-weight="normal">LMM 所需当前姿态等匹配信息可作为控制字段；匹配函数只用于构造训练监督。</text><rect x="30" y="1260" width="1140" height="745" rx="20" fill="white" stroke="#c9d8e2"/><text x="55" y="1303" font-size="28" font-weight="700">③ 运行阶段：选择后端，持续生成交互动画</text><rect x="65" y="1340" width="370" height="125" rx="12" fill="#e9f2f9" stroke="#87a6ba"/><text x="83" y="1374" font-size="24" font-weight="700">手柄 / 游戏 AI / 当前状态</text><text x="83" y="1407" font-size="22" font-weight="normal">Runtime Controls 生成对象 v</text><text x="83" y="1436" font-size="22" font-weight="normal">转换坐标、选择行为与可选字段</text><rect x="525" y="1340" width="310" height="125" rx="12" fill="#e9f2f9" stroke="#87a6ba"/><text x="543" y="1374" font-size="24" font-weight="700">已训练的 C</text><text x="543" y="1407" font-size="22" font-weight="normal">结构化 v → 控制向量 c</text><text x="543" y="1436" font-size="22" font-weight="normal">每次使用相同 Schema</text><rect x="900" y="1340" width="235" height="125" rx="12" fill="#e8f4ec" stroke="#87a6ba"/><text x="918" y="1374" font-size="24" font-weight="700">上一帧 z_prev</text><text x="918" y="1407" font-size="22" font-weight="normal">自回归状态</text><text x="918" y="1436" font-size="22" font-weight="normal">Flow 分支使用</text><path d="M435 1400 H525" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="1565" width="510" height="155" rx="12" fill="#edf0fc" stroke="#87a6ba"/><text x="83" y="1599" font-size="24" font-weight="700">A · 每帧生成一个 latent</text><text x="83" y="1632" font-size="22" font-weight="normal">新单位高斯 ε + z_prev + c</text><text x="83" y="1661" font-size="22" font-weight="normal">V 做 4 步 Euler 积分 → z_next</text><text x="83" y="1690" font-size="22" font-weight="normal">或使用已蒸馏的单步版本</text><rect x="625" y="1565" width="510" height="155" rx="12" fill="#fff4df" stroke="#87a6ba"/><text x="643" y="1599" font-size="24" font-weight="700">B · 每 8 帧更新一次片段</text><text x="643" y="1632" font-size="22" font-weight="normal">P(c) → 下一个 8 帧 latent 块</text><text x="643" y="1661" font-size="22" font-weight="normal">依次播放；inertialization 衔接</text><text x="643" y="1690" font-size="22" font-weight="normal">与 Flow 分支二选一</text><path d="M680 1465 V1510 H320 V1565" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><text x="330" y="1536" font-size="20" font-weight="normal">c</text><path d="M680 1510 H880 V1565" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><text x="890" y="1536" font-size="20" font-weight="normal">c</text><path d="M1015 1465 V1490 H95 V1565" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><text x="108" y="1484" font-size="20" font-weight="normal">历史输入</text><rect x="65" y="1810" width="510" height="125" rx="12" fill="#e8f4ec" stroke="#87a6ba"/><text x="83" y="1844" font-size="24" font-weight="700">已训练的 D：解码姿态</text><text x="83" y="1877" font-size="22" font-weight="normal">latent → 根运动、关节旋转等</text><text x="83" y="1906" font-size="22" font-weight="normal">Flow 输出回填下一帧历史</text><rect x="665" y="1810" width="470" height="125" rx="12" fill="#e8f4ec" stroke="#87a6ba"/><text x="683" y="1844" font-size="24" font-weight="700">程序化后处理与输出</text><text x="683" y="1877" font-size="22" font-weight="normal">足锁定 / IK；旋转与角速度融合</text><text x="683" y="1906" font-size="22" font-weight="normal">渲染并反馈角色状态</text><path d="M320 1720 V1810" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><path d="M880 1720 V1765 H530 V1810" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><path d="M575 1870 H665" fill="none" stroke="#476579" stroke-width="3" marker-end="url(#a)"/><text x="595" y="1850" font-size="20" font-weight="normal">姿态</text><text x="65" y="1970" font-size="20" font-weight="normal">已训练模块由②复用；游戏系统继续更新控制值，模型没有自动的行为规划保证。</text><rect x="30" y="2030" width="1140" height="170" rx="20" fill="white" stroke="#c9d8e2"/><text x="55" y="2073" font-size="28" font-weight="700">④ 评价边界：条件编码、生成结果与严格保证分开看</text><text x="65" y="2110" font-size="22" font-weight="normal">原表1：无控制 rollout 的滑动 / 抖动 / 穿地；不启用上述程序化后处理。</text><text x="65" y="2150" font-size="22" font-weight="normal">输入类型正确 ≠ 目标位置、接触或碰撞被严格满足；本文系统也不执行物理仿真。</text><text x="65" y="2190" font-size="20" font-weight="normal">实线：本阶段数据流。跨阶段模块复用由分区文字标明；此图按论文版本绘制。</text></svg>