<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1985" viewBox="0 0 1120 1985" role="img" aria-labelledby="title desc">
<title id="title">VersatileMotion 正式版完整架构</title>
<desc id="desc">训练因果身体分词器与两阶段通用语言模型，再将可选文字、音频和动作条件编码为统一消息，自回归生成并按模态解码。按 ECCV 2026 正文第三节绘制。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#456b73"/></marker><marker id="train" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ad823a"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#203c48}.title{font-size:32px;font-weight:700}.section{font-size:25px;font-weight:700}.name{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#45677c}.panel{fill:#fff;stroke:#ccd9d8;stroke-width:1.5}.node{stroke:#aac5c6;stroke-width:1.5}.flow{fill:none;stroke:#456b73;stroke-width:2.5;marker-end:url(#arrow)}.training{fill:none;stroke:#ad823a;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#train)}</style>
<rect width="1120" height="1985" rx="18" fill="#fafbf9"/>
<text x="34" y="48" class="title" text-anchor="start">VersatileMotion · 用统一 token 接口连接生成与理解</text>
<text x="34" y="81" class="small" text-anchor="start">ECCV 2026 正式版教学示意 · 依据图 2、§3.1–3.3、式 1–4 重绘</text>
<rect x="24" y="108" width="1072" height="502" rx="18" class="panel"/>
<text x="44" y="144" class="section" text-anchor="start">01 先学习动作分词器 · 保留世界坐标，沿时间保持因果</text>
<rect x="48" y="170" width="300" height="112" rx="12" class="node" fill="#edf3fa"/>
<text x="63" y="202" class="name" text-anchor="start">逐帧动作 X ∈ Rᵀˣᴷˣ⁶</text>
<text x="63" y="232" class="body" text-anchor="start">根位置 p + 速度 v：6 维</text>
<text x="63" y="260" class="body" text-anchor="start">其余为各关节 6D 旋转</text>
<rect x="400" y="170" width="320" height="112" rx="12" class="node" fill="#e8f3ed"/>
<text x="415" y="202" class="name" text-anchor="start">VerMoVQ 编码器</text>
<text x="415" y="232" class="body" text-anchor="start">时间卷积：只看当前与过去</text>
<text x="415" y="260" class="body" text-anchor="start">身体自注意力：关联关节</text>
<rect x="768" y="170" width="300" height="112" rx="12" class="node" fill="#fff2d7"/>
<text x="783" y="202" class="name" text-anchor="start">FSQ 有限标量量化</text>
<text x="783" y="232" class="body" text-anchor="start">逐时间、逐身体位置量化</text>
<text x="783" y="260" class="body" text-anchor="start">离散编号 I ∈ {0,…}ᴸˣᴷ</text>
<path d="M348 225 H400" class="flow"/>
<path d="M720 225 H768" class="flow"/>
<rect x="768" y="352" width="300" height="112" rx="12" class="node" fill="#e8f3ed"/>
<text x="783" y="384" class="name" text-anchor="start">VerMoVQ 解码器</text>
<text x="783" y="414" class="body" text-anchor="start">量化特征 → 重建动作</text>
<text x="783" y="442" class="body" text-anchor="start">时间解码同样不看未来</text>
<rect x="400" y="352" width="320" height="112" rx="12" class="node" fill="#edf3fa"/>
<text x="415" y="384" class="name" text-anchor="start">重建世界空间人体</text>
<text x="415" y="414" class="body" text-anchor="start">恢复根位置、速度与旋转</text>
<text x="415" y="442" class="body" text-anchor="start">FK 计算根中心关节位置</text>
<rect x="48" y="352" width="300" height="112" rx="12" class="node" fill="#fff2d7"/>
<text x="63" y="384" class="name" text-anchor="start">重建监督</text>
<text x="63" y="414" class="body" text-anchor="start">L1 参数误差 + λ · FK误差</text>
<text x="63" y="442" class="body" text-anchor="start">FSQ 无码本／承诺损失</text>
<path d="M918 282 V352" class="flow"/>
<path d="M768 410 H720" class="flow"/>
<path d="M400 410 H348" class="flow"/>
<path d="M198 282 V352" class="training"/>
<path d="M198 464 V502 H374 V314 H560 V282" class="training"/>
<path d="M374 502 V520 H918 V464" class="training"/>
<text x="213" y="493" class="small" text-anchor="start">训练参数更新</text>
<text x="48" y="552" class="body" text-anchor="start">压缩时间后得到 L × K 个编号，再按时间与身体位置展开为一维动作 token。</text>
<text x="48" y="582" class="small" text-anchor="start">各人物使用同一个动作分词器；保留世界坐标使人物之间的位置关系仍可表示。</text>
<rect x="24" y="640" width="1072" height="310" rx="18" class="panel"/>
<text x="44" y="676" class="section" text-anchor="start">02 训练通用模型 · 先覆盖多任务，再增加稀缺任务的训练机会</text>
<rect x="48" y="710" width="270" height="134" rx="12" class="node" fill="#fff2d7"/>
<text x="63" y="742" class="name" text-anchor="start">MotionHub 训练消息</text>
<text x="63" y="772" class="body" text-anchor="start">约 38 万片段 · 30 FPS</text>
<text x="63" y="800" class="body" text-anchor="start">动作／文字／音频配对</text>
<text x="63" y="828" class="body" text-anchor="start">不同任务组合成消息</text>
<rect x="370" y="710" width="310" height="134" rx="12" class="node" fill="#e8f3ed"/>
<text x="385" y="742" class="name" text-anchor="start">阶段一：通用预训练</text>
<text x="385" y="772" class="body" text-anchor="start">按数据量比例采样</text>
<text x="385" y="800" class="body" text-anchor="start">学习跨模态动作先验</text>
<text x="385" y="828" class="body" text-anchor="start">整条消息：下一 token 损失</text>
<rect x="736" y="710" width="332" height="134" rx="12" class="node" fill="#e8f3ed"/>
<text x="751" y="742" class="name" text-anchor="start">阶段二：通用指令微调</text>
<text x="751" y="772" class="body" text-anchor="start">先均匀选任务，再取样本</text>
<text x="751" y="800" class="body" text-anchor="start">提高音频等稀缺任务曝光</text>
<text x="751" y="828" class="body" text-anchor="start">仅回复部分计算监督损失</text>
<path d="M318 778 H370" class="flow"/>
<path d="M680 778 H736" class="flow"/>
<text x="48" y="886" class="body" text-anchor="start">两阶段更新同一个自回归模型；动作、文字和音频以模态标记组织。</text>
<text x="48" y="922" class="small" text-anchor="start">此处依正文两阶段绘制；原图 2 另画 Specialist SFT，图文差异见解读说明。</text>
<rect x="24" y="980" width="1072" height="900" rx="18" class="panel"/>
<text x="44" y="1016" class="section" text-anchor="start">03 推理 · 选择条件与目标模态，生成回复，再按模态解码</text>
<rect x="48" y="1044" width="300" height="100" rx="12" class="node" fill="#f1f4f1"/>
<text x="63" y="1076" class="name" text-anchor="start">文字与任务指令</text>
<text x="63" y="1106" class="body" text-anchor="start">描述、任务、人数或时长</text>
<rect x="408" y="1044" width="300" height="100" rx="12" class="node" fill="#f1f4f1"/>
<text x="423" y="1076" class="name" text-anchor="start">音频条件（可选）</text>
<text x="423" y="1106" class="body" text-anchor="start">语音／音乐片段</text>
<rect x="768" y="1044" width="300" height="100" rx="12" class="node" fill="#f1f4f1"/>
<text x="783" y="1076" class="name" text-anchor="start">已知动作（可选）</text>
<text x="783" y="1106" class="body" text-anchor="start">单人／多人／已知片段</text>
<rect x="48" y="1180" width="300" height="112" rx="12" class="node" fill="#edf3fa"/>
<text x="63" y="1212" class="name" text-anchor="start">文字子词分词</text>
<text x="63" y="1242" class="body" text-anchor="start">文字 token 与任务信息</text>
<text x="63" y="1270" class="body" text-anchor="start">模态起止标记</text>
<rect x="408" y="1180" width="300" height="112" rx="12" class="node" fill="#edf3fa"/>
<text x="423" y="1212" class="name" text-anchor="start">音频 VQ 编码</text>
<text x="423" y="1242" class="body" text-anchor="start">音频离散 token</text>
<text x="423" y="1270" class="body" text-anchor="start">模态起止标记</text>
<rect x="768" y="1180" width="300" height="112" rx="12" class="node" fill="#edf3fa"/>
<text x="783" y="1212" class="name" text-anchor="start">复用 VerMoVQ 编码</text>
<text x="783" y="1242" class="body" text-anchor="start">按人物展开动作 token</text>
<text x="783" y="1270" class="body" text-anchor="start">人物间加入 AGENT_SEP</text>
<path d="M198 1144 V1180" class="flow"/>
<path d="M558 1144 V1180" class="flow"/>
<path d="M918 1144 V1180" class="flow"/>
<rect x="280" y="1350" width="560" height="112" rx="12" class="node" fill="#edf3fa"/>
<text x="295" y="1382" class="name" text-anchor="start">统一 Motion Message</text>
<text x="295" y="1412" class="body" text-anchor="start">指令 Instruction + 条件 Condition + 回复 Reply</text>
<text x="295" y="1440" class="body" text-anchor="start">已知部分作为前缀，待生成部分作为回复</text>
<path d="M198 1292 V1320 H360 V1350" class="flow"/>
<path d="M558 1292 V1350" class="flow"/>
<path d="M918 1292 V1320 H760 V1350" class="flow"/>
<rect x="280" y="1520" width="560" height="112" rx="12" class="node" fill="#e8f3ed"/>
<text x="295" y="1552" class="name" text-anchor="start">同一个 decoder-only AR Transformer</text>
<text x="295" y="1582" class="body" text-anchor="start">默认骨干：LLaMA 3.2–1B</text>
<text x="295" y="1610" class="body" text-anchor="start">读取前缀与已有回复，预测下一个 token</text>
<path d="M560 1462 V1520" class="flow"/>
<path d="M280 1594 H218 V1496 H370 V1520" class="flow"/>
<text x="46" y="1530" class="small" text-anchor="start">逐 token 回填</text>
<path d="M902 844 V965 H1082 V1560 H840" class="training"/>
<text x="954" y="1517" class="small" text-anchor="start">训练后复用</text>
<path d="M560 1632 V1670 H198 V1710" class="flow"/>
<path d="M560 1632 V1710" class="flow"/>
<path d="M560 1632 V1670 H918 V1710" class="flow"/>
<rect x="48" y="1710" width="300" height="130" rx="12" class="node" fill="#fff2d7"/>
<text x="63" y="1742" class="name" text-anchor="start">文字目标 → 文字解码</text>
<text x="63" y="1772" class="body" text-anchor="start">动作描述／互动描述</text>
<text x="63" y="1800" class="body" text-anchor="start">读取动作后输出语言</text>
<rect x="408" y="1710" width="300" height="130" rx="12" class="node" fill="#fff2d7"/>
<text x="423" y="1742" class="name" text-anchor="start">音频目标 → 音频解码</text>
<text x="423" y="1772" class="body" text-anchor="start">舞蹈条件 → 音乐</text>
<text x="423" y="1800" class="body" text-anchor="start">回复中的音频 token 解码</text>
<rect x="768" y="1710" width="300" height="130" rx="12" class="node" fill="#fff2d7"/>
<text x="783" y="1742" class="name" text-anchor="start">动作目标 → 因果解码</text>
<text x="783" y="1772" class="body" text-anchor="start">按人物、时间、身体反展开</text>
<text x="783" y="1800" class="body" text-anchor="start">恢复根状态与关节旋转</text>
<text x="34" y="1918" class="small" text-anchor="start">实线：数据与生成流    金色虚线：训练监督／已训练参数复用</text>
<text x="34" y="1951" class="small" text-anchor="start">按目标模态选择输出分支；图中人体 token 仍是压缩表示，不等于可执行事件或接触保证。</text>
</svg>
