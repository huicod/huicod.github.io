<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1500" role="img" aria-labelledby="title desc">
<title id="title">PhaseBetweener：训练、逐帧生成及状态反馈</title><desc id="desc">动作数据经周期自编码器学习相位，训练相位门控和混合专家网络；运行时姿态目标与时间条件进入运动网络，相位通过门控混合专家；双坐标姿态、接触和相位更新分别融合与反馈。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#44657b" stroke-width="1.7"/></marker><marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#8460a2" stroke-width="1.7"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243844}.heading{font-size:31px;font-weight:700}.group{font-size:24px;font-weight:700}.title{font-size:24px;font-weight:700}.body{font-size:21px}.label{font-size:19px;fill:#46677b}.note{font-size:20px;fill:#566672}.line{fill:none;stroke:#44657b;stroke-width:2.8;marker-end:url(#arrow)}.p-line{fill:none;stroke:#8460a2;stroke-width:2.8;marker-end:url(#purple)}.dash{fill:none;stroke:#8460a2;stroke-width:2.6;stroke-dasharray:8 7;marker-end:url(#purple)}</style>
<rect width="1500" height="1500" fill="#ffffff"/><text x="40" y="40" class="heading">PhaseBetweener · 相位调节生成，目标决定到达哪里与何时</text>
<rect x="20" y="65" width="1460" height="240" rx="18" fill="#faf7ff" stroke="#d3c4e5"/><text x="40" y="98" class="group">A  离线特征学习与监督训练</text>
<rect x="20" y="325" width="1460" height="1110" rx="18" fill="#f9fcfe" stroke="#cbdce7"/><text x="40" y="358" class="group">B  运行时：每次前进一帧；持续维护身体与相位状态</text>
<rect x="40" y="120" width="315" height="125" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="60" y="154" class="title">动作捕捉数据</text><text x="60" y="188" class="body">关节速度、姿态与根轨迹</text><text x="60" y="217" class="body">接触提取；随机目标1–60帧</text><rect x="400" y="120" width="315" height="125" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="420" y="154" class="title">周期自编码器 PAE</text><text x="420" y="188" class="body">2秒速度窗口 → 5通道相位</text><text x="420" y="217" class="body">训练后提取特征，运行时移除</text><rect x="760" y="120" width="315" height="125" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="780" y="154" class="title">训练样本与监督</text><text x="780" y="188" class="body">姿态／目标／相位 → 下一帧</text><text x="780" y="217" class="body">两种坐标、接触、相位更新</text><rect x="1120" y="120" width="330" height="125" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="1140" y="154" class="title">训练门控与动作网络</text><text x="1140" y="188" class="body">8专家参数混合；全特征MSE</text><text x="1140" y="217" class="body">额外风格标签需对应训练</text><path d="M355 182 H400" class="line"/><path d="M715 182 H760" class="line"/><path d="M1075 182 H1120" class="line"/><path d="M195 120 V110 H915 V120" class="line"/><text x="720" y="104" class="label">原动作监督</text><text x="40" y="282" class="label">PAE先学相位；之后训练逐帧生成器。学习相位不是动作语义标签，也不是运行时目标指令。</text><rect x="40" y="390" width="390" height="140" rx="13" fill="#fff2dc" stroke="#d4ac70" stroke-width="1.8"/><text x="60" y="424" class="title">用户给定控制</text><text x="60" y="458" class="body">起始姿态、目标关键帧、时长</text><text x="60" y="487" class="body">可选：路径／朝向／已训练风格</text><rect x="500" y="390" width="390" height="140" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="520" y="424" class="title">当前身体与控制窗口</text><text x="520" y="458" class="body">22关节状态、接触历史、根轨迹</text><text x="520" y="487" class="body">目标姿态 + 剩余时间；数值条件</text><rect x="960" y="390" width="390" height="140" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="980" y="424" class="title">当前相位窗口</text><text x="980" y="458" class="body">13采样点 × 5通道 × 2维</text><text x="980" y="487" class="body">振幅 × (sin相位, cos相位)</text><rect x="960" y="590" width="390" height="100" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="980" y="624" class="title">相位门控网络</text><text x="980" y="658" class="body">生成8个专家的软混合系数</text><rect x="960" y="760" width="390" height="110" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="980" y="794" class="title">专家参数组合</text><text x="980" y="828" class="body">按系数混合三层网络的参数</text><text x="980" y="857" class="body">不是8段动作片段的检索</text><rect x="500" y="760" width="390" height="150" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="520" y="794" class="title">运动预测网络</text><text x="520" y="828" class="body">接收身体／目标等数值条件</text><text x="520" y="857" class="body">使用当前相位决定的参数组合</text><text x="520" y="886" class="body">一次输出下一帧和后续状态</text><path d="M235 530 V715 H695 V760" class="line"/><text x="45" y="700" class="label">关键帧、时长与可选控制</text><path d="M695 530 V760" class="line"/><text x="710" y="705" class="label">连续状态条件</text><path d="M1155 530 V590" class="p-line"/><path d="M1155 690 V760" class="p-line"/><text x="1170" y="730" class="label">混合系数 g</text><path d="M960 815 H890" class="p-line"/><text x="897" y="800" class="label">参数</text><path d="M1285 245 V315 H920 V640 H960" class="dash"/><text x="935" y="568" class="label">门控参数</text><path d="M1410 245 H1430 V815 H1350" class="dash"/><rect x="40" y="1000" width="390" height="150" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="60" y="1034" class="title">两种坐标下的姿态与轨迹</text><text x="60" y="1068" class="body">当前根参照：继续当前运动</text><text x="60" y="1097" class="body">目标参照：逼近目标全身姿态</text><text x="60" y="1126" class="body">同一步预测；不是反向播放</text><rect x="500" y="1000" width="390" height="150" rx="13" fill="#f1ebfb" stroke="#b6a2cf" stroke-width="1.8"/><text x="520" y="1034" class="title">相位／频率／振幅更新</text><text x="520" y="1068" class="body">频率推进相位，并融合预测状态</text><text x="520" y="1097" class="body">维护下一帧相位窗口</text><rect x="960" y="1000" width="390" height="150" rx="13" fill="#eaf6ee" stroke="#8abb9b" stroke-width="1.8"/><text x="980" y="1034" class="title">接触预测</text><text x="980" y="1068" class="body">脚、手、髋等关键点状态</text><text x="980" y="1097" class="body">人体演示以脚部修正减少滑动</text><path d="M695 910 V950 H235 V1000" class="line"/><path d="M695 950 V1000" class="p-line"/><path d="M695 950 H1155 V1000" class="line"/><text x="714" y="981" class="label">下一步多路输出</text><rect x="40" y="1230" width="390" height="130" rx="13" fill="#edf5ff" stroke="#91b5d0" stroke-width="1.8"/><text x="60" y="1264" class="title">双坐标融合</text><text x="60" y="1298" class="body">变换至同一参照系后融合</text><text x="60" y="1327" class="body">按时间权重逐渐靠近目标</text><rect x="500" y="1230" width="390" height="130" rx="13" fill="#eaf6ee" stroke="#8abb9b" stroke-width="1.8"/><text x="520" y="1264" class="title">脚部 IK 后处理</text><text x="520" y="1298" class="body">融合后的身体 + 预测接触</text><text x="520" y="1327" class="body">减少残余脚滑；非全身物理保证</text><rect x="960" y="1230" width="390" height="130" rx="13" fill="#eaf6ee" stroke="#8abb9b" stroke-width="1.8"/><text x="980" y="1264" class="title">下一帧连续骨架</text><text x="980" y="1298" class="body">更新身体、轨迹与接触状态</text><text x="980" y="1327" class="body">送入Unity显示，并自回归反馈</text><path d="M235 1150 V1230" class="line"/><path d="M430 1295 H500" class="line"/><path d="M1155 1150 V1215 H695 V1230" class="line"/><path d="M890 1295 H960" class="line"/><path d="M890 1080 H920 V1190 H1395 V460 H1350" class="p-line"/><text x="950" y="1178" class="label">相位状态反馈</text><text x="1190" y="1178" class="label">无需再运行PAE</text><path d="M1155 1360 V1405 H475 V460 H500" class="line"/><text x="505" y="1390" class="label">身体状态反馈</text><text x="725" y="1390" class="label">含轨迹／接触</text><text x="40" y="1475" class="note">教学重绘：论文图2、图9、§3–5。实线为数据流，紫色虚线为训练参数复用；目标误差与接触仍需独立验证。</text></svg>