<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2040" viewBox="0 0 1600 2040" role="img" aria-labelledby="title desc">
<title id="title">M3GPT：文本、音乐、动作的共享词表与多任务生成</title>
<desc id="desc">上方展示三阶段训练：共享动作VQ-VAE、复用音乐Jukebox、模态对齐和指令微调；推理分三路编码文本、连续22关节动作和音乐波形，输入扩展词表的T5编码器解码器。三路输出分别还原文字、连续动作和音乐波形。训练继续优化动作解码器，音乐编码和解码冻结。下方区别两种零样本任务组合及其定性证据范围。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#44719d"/></marker><marker id="train-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8e68aa"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#25384b}.title{font-size:40px;font-weight:700}.subtitle{font-size:23px;fill:#56697d}.panel{fill:#fbfcfe;stroke:#cbd6df;stroke-width:2}.panel-title{font-size:28px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#56697d}.edge{fill:none;stroke:#44719d;stroke-width:3;marker-end:url(#arr)}.training{fill:none;stroke:#8e68aa;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#train-arr)}</style>
<rect width="1600" height="2040" fill="#ffffff"/>
<text x="55" y="62" class="title" text-anchor="start"><tspan x="55" dy="0">M³GPT｜共享词表连接理解与生成，解码器恢复连续信号</tspan></text><text x="57" y="107" class="subtitle" text-anchor="start"><tspan x="57" dy="0">NeurIPS 2024 · 图2、图3、§3与附录B教学重绘 · 音乐为可解码音频码，动作仍经离散码生成</tspan></text><rect x="35" y="145" width="1530" height="455" rx="22" class="panel"/><text x="65" y="193" class="panel-title" text-anchor="start"><tspan x="65" dy="0">A  训练：三个阶段；文本桥接是辅助监督，不是推理时必走的中转站</tspan></text><rect x="65" y="230" width="450" height="285" rx="16" fill="#f3eef9" stroke="#af92c4" stroke-width="2"/><text x="85" y="269" class="head" text-anchor="start"><tspan x="85" dy="0">阶段1  建立模态表示</tspan></text><text x="85" y="310" class="body" text-anchor="start"><tspan x="85" dy="0">动作／舞蹈共享VQ-VAE</tspan><tspan x="85" dy="35">22关节、30 fps、512项码本</tspan><tspan x="85" dy="35">训练：重建 + 码本 + commitment</tspan><tspan x="85" dy="35">音乐：复用Jukebox VQ-VAE</tspan><tspan x="85" dy="35">2048项码本；后续始终冻结</tspan></text><rect x="575" y="230" width="450" height="285" rx="16" fill="#f3eef9" stroke="#af92c4" stroke-width="2"/><text x="595" y="269" class="head" text-anchor="start"><tspan x="595" dy="0">阶段2  模态对齐与多任务训练</tspan></text><text x="595" y="310" class="body" text-anchor="start"><tspan x="595" dy="0">共享T5 + 继续优化动作解码器</tspan><tspan x="595" dy="35">下一token目标 + 连续动作L1</tspan><tspan x="595" dy="35">音乐风格标签 → 辅助文本</tspan><tspan x="595" dy="35">增加：音乐→文本、文本→舞蹈</tspan><tspan x="595" dy="35">动作编码器和音乐tokenizer固定</tspan></text><rect x="1085" y="230" width="450" height="285" rx="16" fill="#f3eef9" stroke="#af92c4" stroke-width="2"/><text x="1105" y="269" class="head" text-anchor="start"><tspan x="1105" dy="0">阶段3  指令微调</tspan></text><text x="1105" y="310" class="body" text-anchor="start"><tspan x="1105" dy="0">GPT-4辅助构造任务模板</tspan><tspan x="1105" dy="35">六项核心任务 + 五项扩展任务</tspan><tspan x="1105" dy="35">对输入条件生成指定模态输出</tspan><tspan x="1105" dy="35">T5与动作解码器继续优化</tspan><tspan x="1105" dy="35">不改为“直接输出连续坐标”</tspan></text><path d="M515 365 H575" class="training"/><path d="M1025 365 H1085" class="training"/><text x="65" y="565" class="small" text-anchor="start"><tspan x="65" dy="0">动作输出训练链：预测动作码 → 查表嵌入 → 可训练动作解码器 → 连续动作L1监督。</tspan></text><rect x="35" y="650" width="1530" height="810" rx="22" class="panel"/><text x="65" y="698" class="panel-title" text-anchor="start"><tspan x="65" dy="0">B  推理：按任务选择输入组合与输出模态；同一T5负责有条件的自回归预测</tspan></text><rect x="65" y="745" width="270" height="155" rx="16" fill="#fff4e6" stroke="#d7ae73" stroke-width="2"/><text x="85" y="784" class="head" text-anchor="start"><tspan x="85" dy="0">文字</tspan></text><text x="85" y="825" class="body" text-anchor="start"><tspan x="85" dy="0">任务指令</tspan><tspan x="85" dy="35">动作描述／条件文字</tspan></text><rect x="400" y="745" width="280" height="155" rx="16" fill="#fff4e6" stroke="#d7ae73" stroke-width="2"/><text x="420" y="784" class="head" text-anchor="start"><tspan x="420" dy="0">文本分词器</tspan></text><text x="420" y="825" class="body" text-anchor="start"><tspan x="420" dy="0">保留原文本词表</tspan><tspan x="420" dy="35">得到文本token</tspan></text><rect x="65" y="975" width="270" height="155" rx="16" fill="#fff4e6" stroke="#d7ae73" stroke-width="2"/><text x="85" y="1014" class="head" text-anchor="start"><tspan x="85" dy="0">动作／舞蹈</tspan></text><text x="85" y="1055" class="body" text-anchor="start"><tspan x="85" dy="0">连续身体动作</tspan><tspan x="85" dy="35">或前缀／两端片段</tspan></text><rect x="400" y="975" width="280" height="155" rx="16" fill="#fff4e6" stroke="#d7ae73" stroke-width="2"/><text x="420" y="1014" class="head" text-anchor="start"><tspan x="420" dy="0">共享动作编码器</tspan></text><text x="420" y="1055" class="body" text-anchor="start"><tspan x="420" dy="0">时间下采样4倍</tspan><tspan x="420" dy="35">512项码本索引</tspan></text><rect x="65" y="1205" width="270" height="155" rx="16" fill="#fff4e6" stroke="#d7ae73" stroke-width="2"/><text x="85" y="1244" class="head" text-anchor="start"><tspan x="85" dy="0">音乐波形</tspan></text><text x="85" y="1285" class="body" text-anchor="start"><tspan x="85" dy="0">22050 Hz音频</tspan><tspan x="85" dy="35">训练多取5秒窗口</tspan></text><rect x="400" y="1205" width="280" height="155" rx="16" fill="#fff4e6" stroke="#d7ae73" stroke-width="2"/><text x="420" y="1244" class="head" text-anchor="start"><tspan x="420" dy="0">冻结音乐编码器</tspan></text><text x="420" y="1285" class="body" text-anchor="start"><tspan x="420" dy="0">Jukebox VQ-VAE</tspan><tspan x="420" dy="35">2048项音乐码</tspan></text><path d="M335 822 H400" class="edge"/><path d="M335 1052 H400" class="edge"/><path d="M335 1282 H400" class="edge"/><rect x="770" y="825" width="320" height="480" rx="16" fill="#edf5fd" stroke="#8aaed0" stroke-width="2"/><text x="790" y="864" class="head" text-anchor="start"><tspan x="790" dy="0">T5 编码器—解码器</tspan></text><text x="790" y="905" class="body" text-anchor="start"><tspan x="790" dy="0">论文主干：base 220M</tspan><tspan x="790" dy="43">扩展输入embedding</tspan><tspan x="790" dy="43">扩展输出预测层</tspan><tspan x="790" dy="43">词表 = 文本 ∪ 动作 ∪ 音乐</tspan><tspan x="790" dy="43">输入：条件token序列</tspan><tspan x="790" dy="43">输出：逐token预测</tspan><tspan x="790" dy="43">任务决定目标模态</tspan><tspan x="790" dy="43">共享参数，非三次独立训练</tspan></text><path d="M680 822 H725 V915 H770" class="edge"/><path d="M680 1052 H770" class="edge"/><path d="M680 1282 H725 V1210 H770" class="edge"/><rect x="1170" y="745" width="365" height="155" rx="16" fill="#ebf7f0" stroke="#83b69b" stroke-width="2"/><text x="1190" y="784" class="head" text-anchor="start"><tspan x="1190" dy="0">文本输出</tspan></text><text x="1190" y="825" class="body" text-anchor="start"><tspan x="1190" dy="0">预测文本token</tspan><tspan x="1190" dy="35">文本解码 → 动作说明</tspan></text><rect x="1170" y="975" width="365" height="155" rx="16" fill="#ebf7f0" stroke="#83b69b" stroke-width="2"/><text x="1190" y="1014" class="head" text-anchor="start"><tspan x="1190" dy="0">连续动作输出</tspan></text><text x="1190" y="1055" class="body" text-anchor="start"><tspan x="1190" dy="0">动作码 → 查表 → 动作解码器</tspan><tspan x="1190" dy="35">恢复22关节身体运动</tspan></text><rect x="1170" y="1205" width="365" height="155" rx="16" fill="#ebf7f0" stroke="#83b69b" stroke-width="2"/><text x="1190" y="1244" class="head" text-anchor="start"><tspan x="1190" dy="0">音乐波形输出</tspan></text><text x="1190" y="1285" class="body" text-anchor="start"><tspan x="1190" dy="0">音乐码 → 冻结音乐解码器</tspan><tspan x="1190" dy="35">恢复可播放音频，不是检索</tspan></text><path d="M1090 915 H1130 V822 H1170" class="edge"/><path d="M1090 1052 H1170" class="edge"/><path d="M1090 1210 H1130 V1282 H1170" class="edge"/><path d="M1310 515 V625 H1580 V1395 H930 V1305" class="training"/><text x="965" y="1430" class="small" text-anchor="start"><tspan x="965" dy="0">紫色虚线：训练提供的模型参数</tspan></text><text x="70" y="1415" class="small" text-anchor="start"><tspan x="70" dy="0">实线 = 条件与生成表示流；动作和音乐码号均不直接等于可解释事件。</tspan></text><rect x="35" y="1500" width="1530" height="440" rx="22" class="panel"/><text x="65" y="1548" class="panel-title" text-anchor="start"><tspan x="65" dy="0">C  两种零样本组合：由已训练能力迁移；主要证据是定性图与演示</tspan></text><rect x="65" y="1590" width="420" height="130" rx="16" fill="#fff4e6" stroke="#d7ae73" stroke-width="2"/><text x="85" y="1629" class="head" text-anchor="start"><tspan x="85" dy="0">长音乐 → 长舞蹈</tspan></text><text x="85" y="1670" class="body" text-anchor="start"><tspan x="85" dy="0">先由音乐生成首个5秒动作</tspan><tspan x="85" dy="35">再输入已有舞蹈与后续音乐</tspan></text><rect x="570" y="1590" width="410" height="130" rx="16" fill="#edf5fd" stroke="#8aaed0" stroke-width="2"/><text x="590" y="1629" class="head" text-anchor="start"><tspan x="590" dy="0">复用同一T5与动作解码器</tspan></text><text x="590" y="1670" class="body" text-anchor="start"><tspan x="590" dy="0">音乐 + 已有舞蹈 → 后续动作</tspan><tspan x="590" dy="35">递归调用，保留片段上下文</tspan></text><rect x="1065" y="1590" width="470" height="130" rx="16" fill="#ebf7f0" stroke="#83b69b" stroke-width="2"/><text x="1085" y="1629" class="head" text-anchor="start"><tspan x="1085" dy="0">较长连续舞蹈</tspan></text><text x="1085" y="1670" class="body" text-anchor="start"><tspan x="1085" dy="0">不是单次无限长度预测</tspan><tspan x="1085" dy="35">不代表已验证小时级稳定性</tspan></text><path d="M485 1655 H570" class="edge"/><path d="M980 1655 H1065" class="edge"/><rect x="65" y="1790" width="420" height="105" rx="16" fill="#fff4e6" stroke="#d7ae73" stroke-width="2"/><text x="85" y="1829" class="head" text-anchor="start"><tspan x="85" dy="0">音乐 + 独立动作文字</tspan></text><text x="85" y="1870" class="body" text-anchor="start"><tspan x="85" dy="0">例：伴随音乐完成侧手翻</tspan></text><rect x="570" y="1790" width="410" height="105" rx="16" fill="#edf5fd" stroke="#8aaed0" stroke-width="2"/><text x="590" y="1829" class="head" text-anchor="start"><tspan x="590" dy="0">输入联合条件token</tspan></text><text x="590" y="1870" class="body" text-anchor="start"><tspan x="590" dy="0">同一模型直接生成动作码</tspan></text><rect x="1065" y="1790" width="470" height="105" rx="16" fill="#ebf7f0" stroke="#83b69b" stroke-width="2"/><text x="1085" y="1829" class="head" text-anchor="start"><tspan x="1085" dy="0">动作解码为舞蹈</tspan></text><text x="1085" y="1870" class="body" text-anchor="start"><tspan x="1085" dy="0">有双条件示例；无冲突优先级保证</tspan></text><path d="M485 1843 H570" class="edge"/><path d="M980 1843 H1065" class="edge"/><text x="55" y="1990" class="small" text-anchor="start"><tspan x="55" dy="0">阅读边界：多任务最优值与单任务微调最优值分开；节拍指标不等于完整听感；本文未运行模型。</tspan></text><text x="55" y="2027" class="small" text-anchor="start"><tspan x="55" dy="0">橙色：输入／编码　蓝色：统一预测　绿色：解码后输出　紫色：训练与参数；箭头仅表示论文机制。</tspan></text></svg>