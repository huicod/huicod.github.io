<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1510" viewBox="0 0 1040 1510" role="img" aria-labelledby="title desc"><title id="title">TMR 的双编码器、训练目标及检索过程</title><desc id="desc">配对动作与文本分别编码，重建、分布约束、带负例过滤的双向对比共同训练。检索时取高斯均值排序。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#416e76"/></marker></defs><rect width="1040" height="1510" fill="#f8f7f1"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" fill="#19343b"><text x="35" y="42" font-size="20" fill="#147972" font-weight="700">ICCV 2023   /   文本与动作检索</text><text x="35" y="93" font-size="43" fill="#15363d" font-weight="700">TMR</text><text x="35" y="135" font-size="25" fill="#263e43" font-weight="400">训练时重建动作，查询时在动作库中按相似度排序。</text><rect x="20" y="170" width="1000" height="272" rx="18" fill="#fff" stroke="#d4ded9" stroke-width="1.7"/><text x="46" y="211" font-size="21" fill="#147972" font-weight="700">01</text><text x="99" y="211" font-size="26" fill="#173c43" font-weight="700">配对数据进入两个独立的编码器</text><text x="47" y="245" font-size="20" fill="#42616a" font-weight="400">训练用一条动作和它的文字描述。每路均用 Transformer 输出高斯分布参数。</text><rect x="45" y="270" width="460" height="143" rx="14" fill="#f8eed7" stroke="none" stroke-width="1.7"/><text x="62" y="304" font-size="23" fill="#153f45" font-weight="700">文本 → 文本编码器</text><text x="62" y="339" font-size="21" fill="#263e43" font-weight="400">冻结的 DistilBERT 提供词特征</text><text x="62" y="368" font-size="21" fill="#263e43" font-weight="400">编码为文本分布，采样得到 zT</text><text x="62" y="397" font-size="21" fill="#263e43" font-weight="400">输出向量维度 256</text><rect x="535" y="270" width="460" height="143" rx="14" fill="#eaf3ea" stroke="none" stroke-width="1.7"/><text x="552" y="304" font-size="23" fill="#153f45" font-weight="700">动作 → 动作编码器</text><text x="552" y="339" font-size="21" fill="#263e43" font-weight="400">输入逐帧骨架运动特征</text><text x="552" y="368" font-size="21" fill="#263e43" font-weight="400">编码为动作分布，采样得到 zM</text><text x="552" y="397" font-size="21" fill="#263e43" font-weight="400">输出向量维度 256</text><rect x="20" y="465" width="1000" height="489" rx="18" fill="#fff" stroke="#d4ded9" stroke-width="1.7"/><text x="46" y="506" font-size="21" fill="#147972" font-weight="700">02</text><text x="99" y="506" font-size="26" fill="#173c43" font-weight="700">联合训练让向量既描述动作，也能用于排序</text><text x="47" y="540" font-size="20" fill="#42616a" font-weight="400">相同的一批文本向量与动作向量参与下列目标，梯度共同更新两路编码器。</text><rect x="45" y="566" width="460" height="235" rx="14" fill="#eaf3ea" stroke="none" stroke-width="1.7"/><text x="62" y="600" font-size="23" fill="#153f45" font-weight="700">运动重建与分布约束</text><text x="62" y="635" font-size="21" fill="#263e43" font-weight="400">zT 和 zM 分别进入同一解码器</text><text x="62" y="664" font-size="21" fill="#263e43" font-weight="400">按目标帧数提供时间位置编码</text><text x="62" y="693" font-size="21" fill="#263e43" font-weight="400">分别生成动作，与配对动作比较</text><text x="62" y="722" font-size="21" fill="#263e43" font-weight="400">另用 KL 约束分布，用 Smooth L1</text><text x="62" y="751" font-size="21" fill="#263e43" font-weight="400">拉近同一文动对的潜向量</text><rect x="535" y="566" width="460" height="235" rx="14" fill="#f8eed7" stroke="none" stroke-width="1.7"/><text x="552" y="600" font-size="23" fill="#153f45" font-weight="700">带过滤的双向对比</text><text x="552" y="635" font-size="21" fill="#263e43" font-weight="400">计算批内每个文本与各动作的余弦</text><text x="552" y="664" font-size="21" fill="#263e43" font-weight="400">同一文动对位于矩阵对角线</text><text x="552" y="693" font-size="21" fill="#263e43" font-weight="400">MPNet 比较两条描述的语义</text><text x="552" y="722" font-size="21" fill="#263e43" font-weight="400">相似度高于阈值的非配对项跳过</text><text x="552" y="751" font-size="21" fill="#263e43" font-weight="400">其余项参与双向 InfoNCE</text><path d="M275 801 V820 H765 V801" fill="none" stroke="#416e76" stroke-width="2.6" stroke-linejoin="round" /><path d="M520 820 V850" fill="none" stroke="#416e76" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="82" y="850" width="876" height="84" rx="14" fill="#e4f1f2" stroke="none" stroke-width="1.7"/><text x="99" y="884" font-size="23" fill="#153f45" font-weight="700">训练目标</text><text x="99" y="919" font-size="21" fill="#263e43" font-weight="400">动作重建 ＋ KL 与配对约束 ＋ 加权双向 InfoNCE。</text><rect x="20" y="980" width="1000" height="443" rx="18" fill="#fff" stroke="#d4ded9" stroke-width="1.7"/><text x="46" y="1021" font-size="21" fill="#147972" font-weight="700">03</text><text x="99" y="1021" font-size="26" fill="#173c43" font-weight="700">用均值向量检索库中已有的动作</text><text x="47" y="1055" font-size="20" fill="#42616a" font-weight="400">可预先计算候选向量。正向查询用文本找动作，反向查询交换两种模态。</text><rect x="45" y="1080" width="460" height="112" rx="14" fill="#eaf3ea" stroke="none" stroke-width="1.7"/><text x="62" y="1114" font-size="23" fill="#153f45" font-weight="700">离线动作库</text><text x="62" y="1149" font-size="21" fill="#263e43" font-weight="400">逐条编码候选动作，保存均值 μM</text><text x="62" y="1178" font-size="21" fill="#263e43" font-weight="400">保留向量到动作片段的索引。</text><rect x="535" y="1080" width="460" height="112" rx="14" fill="#f8eed7" stroke="none" stroke-width="1.7"/><text x="552" y="1114" font-size="23" fill="#153f45" font-weight="700">在线文字查询</text><text x="552" y="1149" font-size="21" fill="#263e43" font-weight="400">用同一文本编码路径处理新描述</text><text x="552" y="1178" font-size="21" fill="#263e43" font-weight="400">取文本分布的均值 μT。</text><path d="M275 1192 V1214 H765 V1192" fill="none" stroke="#416e76" stroke-width="2.6" stroke-linejoin="round" /><path d="M520 1214 V1243" fill="none" stroke="#416e76" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="82" y="1243" width="876" height="108" rx="14" fill="#e4f1f2" stroke="none" stroke-width="1.7"/><text x="99" y="1277" font-size="23" fill="#153f45" font-weight="700">计算余弦并返回排名</text><text x="99" y="1312" font-size="21" fill="#263e43" font-weight="400">对候选按 cos(μT, μM) 排序，由索引取回相应动作片段。</text><text x="99" y="1341" font-size="21" fill="#263e43" font-weight="400">长动作定位扩展把多个滑动窗口作为候选，逐窗评分。</text><text x="47" y="1393" font-size="21" fill="#263e43" font-weight="400">解码器提供训练中的重建监督。常规检索调用编码器和已缓存的候选向量。</text><text x="35" y="1474" font-size="20" fill="#46676d" font-weight="400">依据 Petrovich 等，ICCV 2023，正文图 2、§3 与 §4 原创整理。</text></g></svg>
