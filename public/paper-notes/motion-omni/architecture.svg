<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1900" role="img" aria-label="Motion-Omni｜语音单元与隐藏状态共同驱动面部和全身动作"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526174"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#203047}.title{font-size:30px;font-weight:700}.section{font-size:24px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.line{fill:none;stroke:#526174;stroke-width:2.3;marker-end:url(#arr)}.dashed{stroke-dasharray:8 6}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="50" class="title" text-anchor="start">Motion-Omni｜语音单元与隐藏状态共同驱动面部和全身动作</text><rect x="30" y="90" width="1300" height="305" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="125" class="section" text-anchor="start">A · 数据与训练支线：教师伪标注 + 分阶段共同适配</text><rect x="60" y="155" width="330" height="125" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="76" y="187" class="head" text-anchor="start">一致音色的响应音频</text><text x="76" y="217" class="body" text-anchor="start">InstructS2S响应</text><text x="76" y="244" class="body" text-anchor="start">不是新增真人动作捕捉</text><rect x="450" y="155" width="350" height="125" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="466" y="187" class="head" text-anchor="start">LOM教师 + 冻结VQ-VAE</text><text x="466" y="217" class="body" text-anchor="start">四部位动作伪标签</text><text x="466" y="244" class="body" text-anchor="start">422,856对 / 1,402.3小时</text><rect x="860" y="155" width="430" height="125" rx="11" fill="#e9f5ed" stroke="#9eafc3"/><text x="876" y="187" class="head" text-anchor="start">双指标质量排序</text><text x="876" y="217" class="body" text-anchor="start">VQ重建误差 + 节奏BC</text><text x="876" y="244" class="body" text-anchor="start">12.5% → 25% → 50% → 全量</text><path d="M390 220H450" class="line"/><text x="400" y="200" class="small" text-anchor="start">波形</text><path d="M800 220H860" class="line"/><text x="803" y="200" class="small" text-anchor="start">标签 / 得分</text><text x="60" y="330" class="body" text-anchor="start">Stage 1：projector做ASR → Stage 2：语音生成器做TTS → Stage 3：语音 + 动作生成器</text><text x="60" y="367" class="small" text-anchor="start">Stage 4：LLM、projector、语音和动作一起微调；Whisper与LOM VQ-VAE始终冻结。</text><rect x="30" y="435" width="1300" height="1380" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="470" class="section" text-anchor="start">B · 离线响应：先接收完整用户输入，再生成回复、语音与动作</text><rect x="60" y="500" width="330" height="110" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="76" y="532" class="head" text-anchor="start">用户语音 / 可选文字</text><text x="76" y="562" class="body" text-anchor="start">语音16kHz</text><text x="76" y="589" class="body" text-anchor="start">文字可直接进入LLM</text><rect x="450" y="500" width="380" height="110" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="466" y="532" class="head" text-anchor="start">Whisper-large-v3（冻结）</text><text x="466" y="562" class="body" text-anchor="start">连续声学特征，1280维</text><rect x="900" y="500" width="390" height="110" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="916" y="532" class="head" text-anchor="start">Speech Projector（可训练）</text><text x="916" y="562" class="body" text-anchor="start">每5帧拼接 → 两层MLP</text><text x="916" y="589" class="body" text-anchor="start">替换LLM中的语音占位位置</text><path d="M390 555H450" class="line"/><path d="M830 555H900" class="line"/><rect x="450" y="675" width="840" height="125" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="466" y="707" class="head" text-anchor="start">Qwen2.5-7B-Instruct LLM</text><text x="466" y="737" class="body" text-anchor="start">根据完整对话输入产生回复文字 token w + 隐藏状态 HLLM</text><text x="466" y="764" class="body" text-anchor="start">Stage 1–3冻结；Stage 4共同适配</text><path d="M1095 610V675" class="line"/><path d="M225 610V735H450" class="line"/><text x="235" y="720" class="small" text-anchor="start">可选文字token</text><rect x="450" y="865" width="840" height="130" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="466" y="897" class="head" text-anchor="start">Speech Generator：TQGF + Qwen2.5-0.5B</text><text x="466" y="927" class="body" text-anchor="start">文字token作为Q；LLM状态经MLP展开作为K/V</text><text x="466" y="954" class="body" text-anchor="start">门控交叉注意力 → 自回归生成语音unit u + 隐藏状态 Hₛ</text><path d="M870 800V865" class="line"/><text x="885" y="840" class="small" text-anchor="start">w、HLLM</text><rect x="60" y="1060" width="320" height="110" rx="11" fill="#e9f5ed" stroke="#9eafc3"/><text x="76" y="1092" class="head" text-anchor="start">离散语音unit u</text><text x="76" y="1122" class="body" text-anchor="start">16,384类；12.5Hz</text><text x="76" y="1149" class="body" text-anchor="start">同一unit也为动作提供query</text><rect x="450" y="1060" width="380" height="110" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="466" y="1092" class="head" text-anchor="start">动作query Q</text><text x="466" y="1122" class="body" text-anchor="start">查表E[u] → 投影We</text><text x="466" y="1149" class="body" text-anchor="start">线性插值12.5Hz → 30Hz</text><rect x="900" y="1060" width="390" height="110" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="916" y="1092" class="head" text-anchor="start">动作key / value Z</text><text x="916" y="1122" class="body" text-anchor="start">语音末层Hₛ → 投影Wh</text><text x="916" y="1149" class="body" text-anchor="start">896维 → 工作维512</text><path d="M640 995V1025H220V1060" class="line"/><text x="250" y="1017" class="small" text-anchor="start">语音unit</text><path d="M870 995V1025H1095V1060" class="line"/><text x="1110" y="1030" class="small" text-anchor="start">语音隐藏状态</text><path d="M380 1115H450" class="line"/><rect x="60" y="1240" width="320" height="130" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="76" y="1272" class="head" text-anchor="start">冻结音频解码器</text><text x="76" y="1302" class="body" text-anchor="start">unit → flow → mel</text><text x="76" y="1329" class="body" text-anchor="start">HiFi-GAN → 波形22.05kHz</text><text x="76" y="1356" class="body" text-anchor="start">不作为动作生成输入</text><path d="M220 1170V1240" class="line"/><rect x="450" y="1235" width="840" height="140" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="466" y="1267" class="head" text-anchor="start">四个部位分别执行：TQGF × 2 + 因果Transformer × 6</text><text x="466" y="1297" class="body" text-anchor="start">Q读取共享Z；周期RoPE = 30帧；动作率30Hz</text><text x="466" y="1324" class="body" text-anchor="start">四分支参数独立；不读取其他部位已采样动作</text><text x="466" y="1351" class="body" text-anchor="start">动作交叉熵反传到语音 / LLM的适配范围取决于训练阶段</text><path d="M640 1170V1235" class="line"/><text x="655" y="1210" class="small" text-anchor="start">Q</text><path d="M1095 1170V1235" class="line"/><text x="1110" y="1210" class="small" text-anchor="start">K/V</text><rect x="60" y="1450" width="280" height="110" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="76" y="1482" class="head" text-anchor="start">面部码 256类</text><text x="76" y="1512" class="body" text-anchor="start">下颌6D + 表情100维</text><text x="76" y="1539" class="body" text-anchor="start">106维输出</text><rect x="380" y="1450" width="280" height="110" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="396" y="1482" class="head" text-anchor="start">双手码 256类</text><text x="396" y="1512" class="body" text-anchor="start">30手关节 × 6D</text><text x="396" y="1539" class="body" text-anchor="start">180维输出</text><rect x="700" y="1450" width="280" height="110" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="716" y="1482" class="head" text-anchor="start">上身码 256类</text><text x="716" y="1512" class="body" text-anchor="start">13关节 × 6D</text><text x="716" y="1539" class="body" text-anchor="start">78维输出</text><rect x="1020" y="1450" width="280" height="110" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="1036" y="1482" class="head" text-anchor="start">下身码 256类</text><text x="1036" y="1512" class="body" text-anchor="start">关节 + 平移 + 足接触</text><text x="1036" y="1539" class="body" text-anchor="start">61维输出</text><path d="M870 1375V1410H200V1450" class="line"/><path d="M870 1410H520V1450" class="line"/><path d="M870 1410H840V1450" class="line"/><path d="M870 1410H1160V1450" class="line"/><rect x="330" y="1640" width="750" height="110" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="346" y="1672" class="head" text-anchor="start">冻结LOM四部位VQ-VAE → SMPL-X / FLAME</text><text x="346" y="1702" class="body" text-anchor="start">不做时间下采样；30Hz连续人体与表情参数 → 渲染</text><text x="346" y="1729" class="body" text-anchor="start">码本输出不是已通过碰撞、平衡或语义事件验证的动作</text><path d="M200 1560V1600H500V1640" class="line"/><path d="M520 1560V1640" class="line"/><path d="M840 1560V1640" class="line"/><path d="M1160 1560V1600H940V1640" class="line"/><path d="M1290 220H1320V1305H1290" class="line dashed"/><text x="1110" y="418" class="small" text-anchor="start">伪动作码监督</text><text x="60" y="1790" class="small" text-anchor="start">4.32秒 / RTF 0.78是完整离线响应；RTF分母为用户输入语音时长，不是首包延迟。</text><text x="40" y="1860" class="small" text-anchor="start">教学图：原文图2–3、附录A；代码快照11eac80e。动作分支无波形输入，四部位无显式冲突裁决。</text></svg>