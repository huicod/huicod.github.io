<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1810" role="img" aria-label="UniMotion MTV｜连续动作、文字与图像的共享模型"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526174"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#203047}.title{font-size:30px;font-weight:700}.section{font-size:24px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.line{fill:none;stroke:#526174;stroke-width:2.3;marker-end:url(#arr)}.dashed{stroke-dasharray:8 6}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="50" class="title" text-anchor="start">UniMotion MTV｜连续动作、文字与图像的共享模型</text><rect x="30" y="90" width="1300" height="310" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="125" class="section" text-anchor="start">A · CMA-VAE训练：DPA将视觉信息迁移到纯动作后验</text><rect x="60" y="155" width="310" height="100" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="76" y="187" class="head" text-anchor="start">动作 m + 配对图像 v</text><text x="76" y="217" class="body" text-anchor="start">仅训练时使用配对视觉信息</text><rect x="430" y="145" width="340" height="100" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="446" y="177" class="head" text-anchor="start">动作编码器 qφ(z|m)</text><text x="446" y="207" class="body" text-anchor="start">纯动作输入；推理时保留</text><rect x="430" y="285" width="340" height="90" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="446" y="317" class="head" text-anchor="start">融合编码器 qψ(z|m,v)</text><text x="446" y="347" class="body" text-anchor="start">HRNet + 关节采样 + 动作</text><rect x="850" y="155" width="440" height="170" rx="11" fill="#e9f5ed" stroke="#9eafc3"/><text x="866" y="187" class="head" text-anchor="start">共享解码器 + 重建 / KL</text><text x="866" y="217" class="body" text-anchor="start">两后验均约束到标准高斯</text><text x="866" y="244" class="body" text-anchor="start">DPA：KL(qφ || stopgrad(qψ))</text><text x="866" y="271" class="body" text-anchor="start">按论文：无配对图像不算DPA</text><path d="M370 185H430" class="line"/><path d="M370 225H400V330H430" class="line"/><path d="M770 195H850" class="line"/><path d="M770 330H810V280H850" class="line"/><text x="60" y="390" class="small" text-anchor="start">视觉融合编码器只用于训练；它不同于下方仍在视觉任务中使用的RGB输入路径。</text><rect x="30" y="430" width="1300" height="235" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="465" class="section" text-anchor="start">B · LRA训练：用密集动作条件先校准新路径</text><rect x="60" y="495" width="310" height="110" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="76" y="527" class="head" text-anchor="start">已编码动作潜变量 z</text><text x="76" y="557" class="body" text-anchor="start">抽样保留20%–50%时间位置</text><text x="76" y="584" class="body" text-anchor="start">特征dropout + 小噪声</text><rect x="430" y="495" width="430" height="110" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="446" y="527" class="head" text-anchor="start">动作embedder → 骨干 → flow head</text><text x="446" y="557" class="body" text-anchor="start">退化条件帮助恢复完整z</text><text x="446" y="584" class="body" text-anchor="start">共同训练动作组件与动作LoRA</text><rect x="920" y="495" width="370" height="110" rx="11" fill="#e9f5ed" stroke="#9eafc3"/><text x="936" y="527" class="head" text-anchor="start">完整z + 高斯目标噪声</text><text x="936" y="557" class="body" text-anchor="start">flow速度监督：z − z₀</text><text x="936" y="584" class="body" text-anchor="start">随后逐步加入七项下游任务</text><path d="M370 550H430" class="line"/><text x="380" y="535" class="small" text-anchor="start">条件</text><path d="M920 550H860" class="line dashed"/><text x="870" y="535" class="small" text-anchor="start">监督</text><text x="60" y="642" class="small" text-anchor="start">论文§3.4与当前代码对LRA噪声位置有差异；下方采样路径按已核公开实现绘制。</text><rect x="30" y="705" width="1300" height="1020" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="740" class="section" text-anchor="start">C · 推理：多路条件 → 共享骨干 → 文字或连续潜变量输出</text><rect x="60" y="770" width="330" height="105" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="76" y="802" class="head" text-anchor="start">文字输入</text><text x="76" y="832" class="body" text-anchor="start">指令 / 描述 / 编辑要求</text><rect x="455" y="770" width="380" height="105" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="471" y="802" class="head" text-anchor="start">条件动作 m（可选）</text><text x="471" y="832" class="body" text-anchor="start">269维：HumanML3D263 + 朝向6</text><rect x="900" y="770" width="390" height="105" rx="11" fill="#fff1d8" stroke="#9eafc3"/><text x="916" y="802" class="head" text-anchor="start">RGB输入（视觉任务）</text><text x="916" y="832" class="body" text-anchor="start">图像 / 抽样视频帧</text><rect x="60" y="930" width="330" height="100" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="76" y="962" class="head" text-anchor="start">Text tokenizer</text><text x="76" y="992" class="body" text-anchor="start">文字token</text><rect x="455" y="930" width="380" height="100" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="471" y="962" class="head" text-anchor="start">CMA-VAE动作编码器</text><text x="471" y="992" class="body" text-anchor="start">动作 → 连续潜变量 z</text><rect x="900" y="920" width="390" height="130" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="916" y="952" class="head" text-anchor="start">WAN2.1 VAE + 双路图像嵌入</text><text x="916" y="982" class="body" text-anchor="start">SigLIP语义 + PatchEmbed细节</text><text x="916" y="1009" class="body" text-anchor="start">另融合冻结TokenHMR姿态特征</text><path d="M225 875V930" class="line"/><path d="M645 875V930" class="line"/><path d="M1095 875V920" class="line"/><rect x="455" y="1090" width="380" height="135" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="471" y="1122" class="head" text-anchor="start">动作双路embedder → 融合</text><text x="471" y="1152" class="body" text-anchor="start">语义：MLP + Transformer</text><text x="471" y="1179" class="body" text-anchor="start">细节：MLP + 位置编码</text><text x="471" y="1206" class="body" text-anchor="start">通道拼接 → RMSNorm + MLP</text><rect x="60" y="1090" width="330" height="135" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="76" y="1122" class="head" text-anchor="start">目标潜变量噪声 + t</text><text x="76" y="1152" class="body" text-anchor="start">生成任务从高斯噪声开始</text><text x="76" y="1179" class="body" text-anchor="start">动作 / 图像用对应输入嵌入</text><text x="76" y="1206" class="body" text-anchor="start">源与目标都可进入骨干</text><path d="M645 1030V1090" class="line"/><path d="M390 1155H455" class="line"/><text x="395" y="1136" class="small" text-anchor="start">动作zₜ</text><rect x="455" y="1290" width="755" height="110" rx="11" fill="#e9f5ed" stroke="#9eafc3"/><text x="471" y="1322" class="head" text-anchor="start">Show-o2 1.5B骨干 + 模态路由LoRA</text><text x="471" y="1352" class="body" text-anchor="start">文字/RGB与动作分开适配；段内双向、段间因果</text><text x="471" y="1379" class="body" text-anchor="start">输入模态决定路径；共享参数不构成冲突裁决或几何硬约束</text><path d="M225 1030H415V1340H455" class="line"/><path d="M645 1225V1290" class="line"/><path d="M1095 1050V1290" class="line"/><text x="1105" y="1200" class="small" text-anchor="start">RGB嵌入</text><rect x="60" y="1460" width="330" height="105" rx="11" fill="#eaf2ff" stroke="#9eafc3"/><text x="76" y="1492" class="head" text-anchor="start">文本头 → 描述</text><text x="76" y="1522" class="body" text-anchor="start">动作 / 视觉到文本</text><text x="76" y="1549" class="body" text-anchor="start">自回归生成</text><rect x="455" y="1460" width="380" height="105" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="471" y="1492" class="head" text-anchor="start">动作flow head + Euler</text><text x="471" y="1522" class="body" text-anchor="start">速度预测；50步，CFG 3.0</text><text x="471" y="1549" class="body" text-anchor="start">CMA-VAE解码 → 连续动作</text><rect x="900" y="1460" width="390" height="105" rx="11" fill="#f1eafa" stroke="#9eafc3"/><text x="916" y="1492" class="head" text-anchor="start">视觉flow head + Euler</text><text x="916" y="1522" class="body" text-anchor="start">速度预测 → 连续图像潜变量</text><text x="916" y="1549" class="body" text-anchor="start">WAN VAE解码 → 编辑图像</text><path d="M550 1400V1430H225V1460" class="line"/><path d="M645 1400V1460" class="line"/><path d="M1095 1400V1460" class="line"/><path d="M455 1515H410V1250H225V1225" class="line"/><text x="65" y="1270" class="small" text-anchor="start">下一采样步（目标噪声更新）</text><path d="M1290 1515H1310V1060H1230V1050" class="line"/><text x="955" y="1600" class="small" text-anchor="start">视觉采样回路复用对应输入路径</text><path d="M770 195H810V410H1310V680H850V980H835" class="line dashed"/><path d="M860 550H890V690H1320V1360H1210" class="line dashed"/><text x="60" y="1650" class="body" text-anchor="start">七任务：T2M、M2T、预测、动作编辑、V2M、V2T、动作指导图像编辑。</text><text x="60" y="1690" class="small" text-anchor="start">DPA/LRA是训练机制；V2M主评测为单参考图像，V2T另展示多帧视频输入。</text><text x="40" y="1770" class="small" text-anchor="start">教学图：原文图2–3、附录D–E；代码快照5124e679。实线为计算，虚线为监督。</text></svg>