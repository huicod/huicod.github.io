<text x="118" y="4635" class="small">急促敬礼：手臂轨迹大致正确，但急停阶段被过度平滑。</text>
<text x="118" y="4664" class="small">飞鸟式行走：能展开双臂，却缺少清楚、周期性的拍翼动态。</text>
<text x="118" y="4693" class="small">主表内容指标评价文字匹配，不是源动作逐关节保持或最终物理可执行性。</text>
