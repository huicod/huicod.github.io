<text x="118" y="4375" class="head">内容 + 风格</text>
<text x="118" y="4410" class="small">内容：右手投掷</text>
<text x="118" y="4439" class="small">风格：飞机式展开</text>
<text x="118" y="4468" class="small">右臂同时收到冲突要求</text>
<rect x="490" y="4340" width="330" height="160" rx="15" fill="#f0ebfa" stroke="#b9ced8" stroke-width="1.5"/>
<text x="508" y="4375" class="head">部位组合方案</text>
<text x="508" y="4410" class="small">右臂：承担投掷任务</text>
<text x="508" y="4439" class="small">左臂：借用飞机式伸展</text>
<text x="508" y="4468" class="small">躯干与腿采用相容支持</text>
<rect x="880" y="4340" width="340" height="160" rx="15" fill="#e8f4ed" stroke="#b9ced8" stroke-width="1.5"/>
<text x="898" y="4375" class="head">生成后仍要检查</text>
<text x="898" y="4410" class="small">动作内容是否完成</text>
<text x="898" y="4439" class="small">风格是否真正表现</text>
<text x="898" y="4468" class="small">不是复制源右臂逐帧轨迹</text>
