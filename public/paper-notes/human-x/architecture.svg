<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1395" viewBox="0 0 1000 1395" lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">Human-X 怎样一边预判双方动作，一边根据真人的新动作修正反应？</title>
  <desc id="desc">真人的实测动作分两路，一路与角色历史共同进入扩散规划器，一路直接进入跟踪策略。规划器同时预测角色参考、真人动作和接触关系。跟踪策略在仿真中结合最新观测与角色自身状态执行参考。图末单列两个模块的离线训练。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486b69"/></marker>
    <marker id="live-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f6d9e"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#213839}
      .title{font-size:30px;font-weight:700}.section{font-size:23px;font-weight:700;fill:#275e58}.head{font-size:21px;font-weight:700}.copy{font-size:18px}.note{font-size:16px;fill:#405859}
      .box rect{stroke-width:1.45}.input{fill:#eef5fb;stroke:#adc6d8}.plan{fill:#edf5ef;stroke:#a7c2af}.generated{fill:#fcf5e9;stroke:#dbc393}.control{fill:#f0f5f4;stroke:#afc7c4}.train rect{fill:#f5f1f8;stroke:#c7b9cf;stroke-dasharray:5 3}
      .link,.live{fill:none;stroke:#486b69;stroke-width:2.1;stroke-linejoin:round;marker-end:url(#arrow)}.live{stroke:#2f6d9e;marker-end:url(#live-arrow)}.stem{fill:none;stroke:#486b69;stroke-width:2.1}
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="1393" rx="16" fill="#fff" stroke="#c6d4d3"/>
  <text x="40" y="54" class="title">Human-X 如何跟上一个会临时改动作的人？</text>
  <text x="40" y="91" class="note">蓝线传递最新观测。灰绿线传递动作历史、预测或控制量。底部虚线框说明模块怎样训练。</text>
  <text x="40" y="143" class="section">实时采集与交互表示</text>

  <g class="box"><rect x="40" y="162" width="580" height="91" rx="10" class="input"/>
    <text x="58" y="198" class="head">真人动作 · RGB-D 相机，30 帧/秒</text>
    <text x="58" y="232" class="copy">HybrIK 估计姿态，相机给出深度，再映射到仿真骨架。</text></g>
  <g class="box"><rect x="658" y="162" width="302" height="91" rx="10" class="input"/>
    <text x="676" y="198" class="head">本窗口的可选文本</text>
    <text x="676" y="232" class="copy">例如提示角色一起跳舞。</text></g>
  <path d="M328 255V278" class="live"/><path d="M810 255V278" class="link"/>
  <g class="box"><rect x="40" y="283" width="580" height="104" rx="10" class="plan"/>
    <text x="58" y="319" class="head">最近 20 帧双人历史</text>
    <text x="58" y="347" class="copy">采集的真人动作与已生成的角色动作，共用角色坐标系。</text>
    <text x="58" y="372" class="note">每帧保留角色动作、相对真人动作和 6 × 6 关节接触场。</text></g>
  <g class="box"><rect x="658" y="283" width="302" height="104" rx="10" class="plan"/>
    <text x="676" y="319" class="head">冻结的 DistilBERT</text>
    <text x="676" y="350" class="copy">将提示编码为条件，</text>
    <text x="676" y="374" class="note">供生成本窗口时引导去噪。</text></g>
  <path d="M328 389V417" class="link"/><path d="M810 389V417" class="link"/>

  <g class="box"><rect x="40" y="422" width="920" height="107" rx="10" class="plan"/>
    <text x="58" y="459" class="head">A　自回归扩散规划器 · 联合预测未来 40 帧</text>
    <text x="58" y="493" class="copy">以历史为前缀，从噪声去噪出两人未来动作及关节接触场。下一窗口再收集真人的新历史。</text></g>
  <path d="M500 530V546" class="stem"/><path d="M500 546H275V565" class="link"/><path d="M500 546H725V565" class="link"/>
  <g class="box"><rect x="55" y="570" width="430" height="95" rx="10" class="generated"/>
    <text x="74" y="608" class="head">角色未来参考</text>
    <text x="74" y="644" class="copy">把预测的角色姿态逐帧给跟踪器作目标。</text></g>
  <g class="box"><rect x="515" y="570" width="430" height="95" rx="10" class="generated"/>
    <text x="534" y="608" class="head">预测的真人动作</text>
    <text x="534" y="644" class="copy">描述规划器预期真人接下来会怎样动。</text></g>

  <path d="M40 208H18V740H38" class="live"/>
  <path d="M275 667V795" class="link"/><path d="M725 667V795" class="link"/>
  <g class="box"><rect x="40" y="693" width="215" height="83" rx="10" class="input"/>
    <text x="55" y="726" class="head">实测的真人动作</text>
    <text x="55" y="757" class="note">相机持续更新的位置。</text></g>
  <g class="box"><rect x="747" y="693" width="213" height="83" rx="10" class="input"/>
    <text x="762" y="726" class="head">角色自身状态</text>
    <text x="762" y="757" class="note">仿真返回本体感知。</text></g>
  <path d="M147 778V795" class="live"/><path d="M851 778V795" class="live"/>
  <g class="box"><rect x="40" y="800" width="920" height="110" rx="10" class="control"/>
    <text x="58" y="837" class="head">B　感知真人的动作跟踪策略 · 30 Hz</text>
    <text x="58" y="871" class="copy">真人按预期运动时，角色继续跟踪关节目标。真人临时改动作时，策略可调整姿态和间距。</text>
    <text x="58" y="895" class="note">控制器同时接收两个版本的真人运动，能在扩散规划器两次更新之间作出反应。</text></g>
  <path d="M500 912V938" class="link"/>
  <g class="box"><rect x="40" y="943" width="920" height="91" rx="10" class="control"/>
    <text x="58" y="979" class="head">Isaac Gym 物理仿真 · 60 Hz</text>
    <text x="58" y="1013" class="copy">施加控制动作，得到执行后的角色姿态和速度；这些状态回到下一步跟踪。</text></g>
  <path d="M962 988H981V740H963" class="live"/>
  <path d="M500 1035V1050" class="stem"/><path d="M500 1050H275V1067" class="link"/><path d="M500 1050H725V1067" class="link"/>
  <g class="box"><rect x="40" y="1072" width="445" height="87" rx="10" class="control"/>
    <text x="58" y="1107" class="head">人体角色 / VR 化身</text>
    <text x="58" y="1139" class="copy">渲染双人互动，可从头戴设备观看。</text></g>
  <g class="box"><rect x="515" y="1072" width="445" height="87" rx="10" class="control"/>
    <text x="533" y="1107" class="head">Unitree H1 虚拟机器人</text>
    <text x="533" y="1139" class="copy">目标先转到 H1 关节，再在虚拟环境演示。</text></g>

  <text x="40" y="1207" class="section">两个模块的离线训练</text>
  <g class="box train"><rect x="40" y="1225" width="445" height="116" rx="10"/>
    <text x="58" y="1260" class="head">双人动作序列 → A 的去噪器</text>
    <text x="58" y="1292" class="copy">重建双人窗口，同时约束脚滑、关节接触</text>
    <text x="58" y="1319" class="copy">和跨窗口衔接。逐步改用模型生成的历史。</text></g>
  <g class="box train"><rect x="515" y="1225" width="445" height="116" rx="10"/>
    <text x="533" y="1260" class="head">物理仿真中的强化学习 → B 的策略</text>
    <text x="533" y="1292" class="copy">根据真人实测与预测的差异，在模仿参考</text>
    <text x="533" y="1319" class="copy">和维持默认姿态、调整双方间距之间加权。</text></g>
  <text x="40" y="1372" class="note">依据原文图 2、算法 1、§3–5 与附录 B 重绘。图中帧数取 §5.2 的设置。</text>
</svg>
