<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1790" viewBox="0 0 1040 1790" role="img" aria-labelledby="title desc">
<title id="title">LaCT-Motion：从显式分解到连续潜在规划</title><desc id="desc">四区教学架构图：数据构建，显式与渐进潜在SFT，全潜在GRPO，以及复用训练权重的推理。潜在规划连续隐藏状态与离散运动码严格区分。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#436ba3"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#c17b23"/></marker></defs>
<rect width="1040" height="1790" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<text x="36" y="38" font-size="30" fill="#23354d" font-weight="750" text-anchor="start">LaCT-Motion｜把文字步骤内化为连续规划</text>
<text x="36" y="68" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">蓝色实线：数据／状态流    橙色虚线：训练更新／权重复用</text>
<rect x="24" y="88" width="992" height="305" rx="16" fill="#f1f6fc" stroke="#cbd5e1"/>
<text x="44" y="123" font-size="25" fill="#23354d" font-weight="700" text-anchor="start">A  数据构建：两路监督配成同一训练样本</text>
<text x="44" y="152" font-size="19" fill="#586779" font-weight="400" text-anchor="start">仅训练需要视频、显式步骤与真实动作；不是测试输入。</text>
<rect x="60" y="168" width="440" height="70" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="76" y="198" font-size="22" fill="#23354d" font-weight="650" text-anchor="start">文本 + 动作视频</text>
<text x="76" y="226" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">Qwen 描述 → 分句；DeepSeek-R1 核完整性</text>
<rect x="550" y="168" width="430" height="70" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="566" y="198" font-size="23" fill="#23354d" font-weight="650" text-anchor="start">真实运动 m：每帧 263 维</text>
<text x="566" y="226" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">冻结预训练 VQ-VAE encoder → 512 码本</text>
<rect x="60" y="270" width="440" height="70" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="76" y="300" font-size="23" fill="#23354d" font-weight="650" text-anchor="start">显式原子步骤 s₁…sₙ</text>
<text x="76" y="328" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">原始 1–9 步；极少数 9 步样本截为 8 步</text>
<rect x="550" y="270" width="430" height="70" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="566" y="300" font-size="23" fill="#23354d" font-weight="650" text-anchor="start">离散 motion codes a</text>
<text x="566" y="328" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">时间下采样 4 倍；带动作起止标记</text>
<path d="M280 238 V270" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M765 238 V270" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M280 340 V358 H496" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M765 340 V358 H544" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<text x="520" y="381" font-size="20" fill="#23354d" font-weight="650" text-anchor="middle">66,515 个训练实例：(描述 q，步骤 s，动作码 a)</text>
<rect x="24" y="413" width="992" height="485" rx="16" fill="#f0f8f5" stroke="#cbd5e1"/>
<text x="44" y="448" font-size="25" fill="#23354d" font-weight="700" text-anchor="start">B  阶段 I–II：显式练习 → 渐进内化 → 全潜在巩固</text>
<text x="44" y="477" font-size="19" fill="#586779" font-weight="400" text-anchor="start">同一个 Qwen2.5-3B 策略模型；默认每移除一步，用 2 个潜在位置替代。</text>
<rect x="60" y="496" width="275" height="105" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="76" y="526" font-size="23" fill="#23354d" font-weight="650" text-anchor="start">阶段 I · 练习</text>
<text x="76" y="554" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">完整文字 CoT + 动作码</text>
<text x="76" y="581" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">2 epochs</text>
<rect x="382" y="496" width="282" height="105" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="398" y="526" font-size="23" fill="#23354d" font-weight="650" text-anchor="start">阶段 II · 内化</text>
<text x="398" y="554" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">逐步移除前 k 个步骤</text>
<text x="398" y="581" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">8 阶段 × 0.5 epoch</text>
<rect x="710" y="496" width="270" height="105" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="726" y="526" font-size="23" fill="#23354d" font-weight="650" text-anchor="start">阶段 II · 巩固</text>
<text x="726" y="554" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">固定 16 个潜在位置</text>
<text x="726" y="581" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">1 epoch；无显式 CoT</text>
<path d="M335 548 H382" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M664 548 H710" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="60" y="638" width="920" height="66" rx="12" fill="#e5f1ec" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="76" y="668" font-size="22" fill="#23354d" font-weight="650" text-anchor="start">每个潜在位置是动态隐藏状态，不是 VQ 码</text>
<text x="76" y="696" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">前位置末层 h → 覆盖下一位置 e(lᵢ)；多轮递推并复用 KV cache</text>
<path d="M520 601 V638" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="60" y="740" width="440" height="90" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="76" y="770" font-size="21" fill="#23354d" font-weight="650" text-anchor="start">M 次状态注入 + 最后一次前向</text>
<text x="76" y="798" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">连续向量依赖前缀与先前 latent</text>
<text x="76" y="825" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">没有额外量化、投影或文字解码</text>
<rect x="550" y="740" width="430" height="90" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="566" y="770" font-size="21" fill="#23354d" font-weight="650" text-anchor="start">仅剩余文字与动作码计算 CE</text>
<text x="566" y="798" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">潜在位置没有直接 CE 标签</text>
<text x="566" y="825" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">下游梯度仍可通过 h 回传</text>
<path d="M280 704 V740" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M765 704 V740" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M500 785 H550" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="350" y="846" width="340" height="36" rx="12" fill="#e3f0e9" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="366" y="876" font-size="20" fill="#23354d" font-weight="650" text-anchor="start">SFT 策略 checkpoint</text>
<path d="M765 830 V864 H690" fill="none" stroke="#c17b23" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#amber)"/>
<text x="60" y="627" font-size="18" fill="#586779" font-weight="400" text-anchor="start">渐进阶段 10% 随机阶段；巩固阶段关闭</text>
<rect x="24" y="920" width="992" height="474" rx="16" fill="#fff7ec" stroke="#cbd5e1"/>
<text x="44" y="955" font-size="25" fill="#23354d" font-weight="700" text-anchor="start">C  阶段 III：全潜在 GRPO，用结果奖励更新策略</text>
<text x="44" y="984" font-size="19" fill="#586779" font-weight="400" text-anchor="start">真实动作只用于奖励；文本／运动奖励编码器与 SFT 参考策略均冻结。</text>
<rect x="60" y="1005" width="250" height="80" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="76" y="1035" font-size="22" fill="#23354d" font-weight="650" text-anchor="start">SFT 策略 + 描述 q</text>
<text x="76" y="1063" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">全模型策略可更新</text>
<rect x="350" y="1005" width="300" height="80" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="366" y="1035" font-size="22" fill="#23354d" font-weight="650" text-anchor="start">16 位置潜在前向</text>
<text x="366" y="1063" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">只算一次 → 共享 KV</text>
<rect x="690" y="1005" width="290" height="80" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="706" y="1035" font-size="22" fill="#23354d" font-weight="650" text-anchor="start">8 条候选动作码</text>
<text x="706" y="1063" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">温度采样，不是 8 条潜在链</text>
<path d="M310 1045 H350" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M650 1045 H690" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="60" y="1130" width="250" height="80" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="76" y="1160" font-size="21" fill="#23354d" font-weight="650" text-anchor="start">冻结 SFT 参考策略</text>
<text x="76" y="1188" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">为 KL 惩罚提供参照</text>
<rect x="350" y="1130" width="300" height="80" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="366" y="1160" font-size="21" fill="#23354d" font-weight="650" text-anchor="start">训练参考：真实动作 + q</text>
<text x="366" y="1188" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">只进入相似度评分支路</text>
<rect x="690" y="1121" width="290" height="116" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="706" y="1151" font-size="20" fill="#23354d" font-weight="650" text-anchor="start">冻结 VQ 解码 + 奖励</text>
<text x="706" y="1179" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">格式是否合法</text>
<text x="706" y="1206" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">动作相似度 + 文本相似度</text>
<path d="M835 1085 V1121" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M650 1170 H690" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="60" y="1280" width="590" height="75" rx="12" fill="#fbe8ce" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="76" y="1310" font-size="22" fill="#23354d" font-weight="650" text-anchor="start">组内相对优势 + KL → 更新策略 θ</text>
<text x="76" y="1338" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">更新权重，影响下一次潜在状态与动作概率</text>
<path d="M185 1210 V1280" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M835 1237 V1260 H355 V1280" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M60 1317 H42 V1045 H60" fill="none" stroke="#c17b23" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#amber)"/>
<text x="690" y="1295" font-size="21" fill="#23354d" font-weight="650" text-anchor="start">G=8，β=0.001</text>
<text x="690" y="1325" font-size="18" fill="#586779" font-weight="400" text-anchor="start">奖励没有直接物理求解器</text>
<text x="60" y="1378" font-size="19" fill="#586779" font-weight="400" text-anchor="start">共享缓存只减少重复规划；每条候选仍需独立动作解码和评分。</text>
<path d="M520 882 V909 H1004 V997 H185 V1005" fill="none" stroke="#c17b23" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#amber)"/>
<rect x="24" y="1414" width="992" height="338" rx="16" fill="#f3f2fb" stroke="#cbd5e1"/>
<text x="44" y="1449" font-size="25" fill="#23354d" font-weight="700" text-anchor="start">D  测试：只输入描述，不生成显式推理文字</text>
<text x="44" y="1478" font-size="19" fill="#586779" font-weight="400" text-anchor="start">复用阶段 III 策略；不需要真实动作、视频、步骤标注或奖励模块。</text>
<rect x="60" y="1495" width="250" height="80" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="76" y="1525" font-size="22" fill="#23354d" font-weight="650" text-anchor="start">动作描述 q</text>
<text x="76" y="1553" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">如：转身，再向右滑步</text>
<rect x="350" y="1495" width="300" height="80" rx="12" fill="#eae7f8" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="366" y="1525" font-size="22" fill="#23354d" font-weight="650" text-anchor="start">连续潜在规划</text>
<text x="366" y="1553" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">16 次隐藏状态回注</text>
<rect x="690" y="1495" width="290" height="80" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="706" y="1525" font-size="21" fill="#23354d" font-weight="650" text-anchor="start">自回归 motion codes</text>
<text x="706" y="1553" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">直接复用前缀 KV cache</text>
<path d="M310 1535 H350" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M650 1535 H690" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="350" y="1620" width="300" height="80" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="366" y="1650" font-size="21" fill="#23354d" font-weight="650" text-anchor="start">冻结 VQ-VAE decoder</text>
<text x="366" y="1678" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">离散码 → 连续运动特征</text>
<rect x="690" y="1620" width="290" height="80" rx="12" fill="#ffffff" stroke="#b6c7d8" stroke-width="1.5"/>
<text x="706" y="1650" font-size="22" fill="#23354d" font-weight="650" text-anchor="start">输出人体动作</text>
<text x="706" y="1678" font-size="20" fill="#23354d" font-weight="400" text-anchor="start">22 关节 / 每帧 263 维</text>
<path d="M835 1575 V1596 H500 V1620" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M650 1660 H690" fill="none" stroke="#436ba3" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M650 1317 V1350 H1004 V1489 H500 V1495" fill="none" stroke="#c17b23" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#amber)"/>
<text x="60" y="1649" font-size="20" fill="#586779" font-weight="400" text-anchor="start">省去的是文字生成；</text>
<text x="60" y="1677" font-size="20" fill="#586779" font-weight="400" text-anchor="start">潜在规划仍有计算成本。</text>
<text x="60" y="1732" font-size="19" fill="#586779" font-weight="400" text-anchor="start">无显式 CoT ≠ 无规划开销；语义奖励 ≠ 轨迹、关键帧或接触的硬保证。</text>
<text x="36" y="1780" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">教学重绘 · 依据主文图 2–3、§3 与附录图 5、§A.2；不是实际模型运行结果。</text>
</g></svg>