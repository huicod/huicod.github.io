<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1136" viewBox="0 0 820 1136" role="img" aria-labelledby="title desc">
  <title id="title">CHGS：从一段新语音和一段风格示例生成三维说话动作</title>
  <desc id="desc">训练先建立三维风格空间，把二维动作特征映到同一空间；身体动作另用残差量化自编码器建模。生成时，两条可训练的语音编码分支分别服务于面部和身体。参考视频或三维参考产生一个风格向量，和扩散时间步共同进入身体去噪器；面部直接在连续参数中生成。两路动作在同一语音时间轴上合成。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#213842}
      .title{font-size:27px;font-weight:700}.section{font-size:20px;font-weight:700}
      .heading{font-size:17px;font-weight:700}.body{font-size:15px}.note{font-size:14px;fill:#4c626b}
      .panel{fill:#f6f8f8;stroke:#cbd5d7}.neutral{fill:white;stroke:#a5b5b9}
      .style{fill:#e6f3ed;stroke:#80a997}.sound{fill:#eaf1fa;stroke:#92a9c4}
      .out{fill:#faf1db;stroke:#bba66c}.panel,.neutral,.style,.sound,.out{stroke-width:1.4}
      .wire,.arrow,.voice,.stylewire{fill:none;stroke:#566f7b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .arrow{marker-end:url(#tip)}.voice{stroke:#557a9d;marker-end:url(#audio-tip)}
      .stylewire{stroke:#4c8069;marker-end:url(#style-tip)}
    </style>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#566f7b"/></marker>
    <marker id="audio-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#557a9d"/></marker>
    <marker id="style-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 9 5 0 10Z" fill="#4c8069"/></marker>
  </defs>
  <rect width="820" height="1136" rx="16" fill="#fdfdfb"/>
  <text x="27" y="40" class="title">CHGS 如何把一段视频里的动作风格用到新语音上？</text>
  <text x="28" y="68" class="note">蓝色表示语音特征，绿色表示风格，金色表示生成的动作。两路去噪器结构相同、分别预测。</text>

  <g aria-label="训练使用的三维动作和二维三维对齐">
    <rect x="16" y="89" width="788" height="219" rx="14" class="panel"/>
    <text x="32" y="121" class="section">训练时建立风格空间与身体动作码本</text>
    <rect x="32" y="137" width="365" height="119" rx="10" class="style"/>
    <text x="48" y="165" class="heading">三维动作片段 → 风格编码器</text>
    <text x="48" y="193" class="body">线性投影 → Transformer → 时间平均池化。</text>
    <text x="48" y="219" class="body">同一片段分出的两段为正例，批内其他</text>
    <text x="48" y="241" class="body">片段为负例，训练片段级风格编码器。</text>
    <rect x="420" y="137" width="368" height="119" rx="10" class="style"/>
    <text x="436" y="165" class="heading">二维动作特征 → 跨模态映射</text>
    <text x="436" y="193" class="body">用同段动作的二维投影匹配冻结的三维</text>
    <text x="436" y="219" class="body">编码器输出，并用二维条件重建动作。</text>
    <path d="M397 200H418" class="stylewire"/>
    <text x="33" y="286" class="body">身体另行训练上身、手部、下身三个 RVQ-VAE。潜序列时间降采样 4 倍，量化 6 级。</text>
  </g>

  <g aria-label="推理使用目标语音与可替换的风格参考">
    <rect x="16" y="323" width="788" height="299" rx="14" class="panel"/>
    <text x="32" y="356" class="section">生成时输入目标语音，再选择一个风格示例</text>
    <rect x="32" y="374" width="366" height="66" rx="10" class="sound"/>
    <text x="48" y="402" class="heading">目标语音波形</text>
    <text x="48" y="425" class="body">这段新语音提供生成动作的时间轴。</text>
    <rect x="420" y="374" width="368" height="66" rx="10" class="style"/>
    <text x="436" y="402" class="heading">真人参考视频，或一段三维参考动作</text>
    <text x="436" y="425" class="body">两种输入通过各自的风格编码路径。</text>
    <path d="M215 441V462" class="voice"/>
    <path d="M605 441V462" class="stylewire"/>
    <rect x="32" y="464" width="366" height="124" rx="10" class="sound"/>
    <text x="48" y="493" class="heading">共享 HuBERT 底层，分开适配上层</text>
    <text x="48" y="520" class="body">冻结卷积与 Transformer 第 0–1 层。</text>
    <text x="48" y="547" class="body">两套可训练的第 2–11 层分别提取</text>
    <text x="48" y="570" class="body">面部语音特征和身体语音特征。</text>
    <rect x="420" y="464" width="368" height="124" rx="10" class="style"/>
    <text x="436" y="493" class="heading">片段级风格向量</text>
    <text x="436" y="520" class="body">视频二维关键点经编码器映入风格空间。</text>
    <text x="436" y="547" class="body">三维动作经三维编码器直接得到风格码。</text>
    <text x="436" y="570" class="body">风格码与扩散时间步组成条件。</text>
  </g>

  <g aria-label="面部和身体沿共同语音时间轴分别生成">
    <rect x="16" y="643" width="788" height="411" rx="14" class="panel"/>
    <path d="M153 589V677" class="voice"/>
    <path d="M290 589V622H431V677" class="voice"/>
    <path d="M606 589V677" class="stylewire"/>
    <rect x="32" y="680" width="242" height="134" rx="10" class="neutral"/>
    <text x="48" y="708" class="heading">面部去噪</text>
    <text x="48" y="737" class="body">用面部语音特征约束生成，</text>
    <text x="48" y="763" class="body">直接预测连续的面部参数。</text>
    <text x="48" y="792" class="note">训练另约束网格、速度与平滑性。</text>
    <rect x="295" y="680" width="493" height="134" rx="10" class="neutral"/>
    <text x="311" y="708" class="heading">身体潜空间去噪</text>
    <text x="311" y="737" class="body">从带噪潜表示预测干净动作，10 帧种子提供上下文。</text>
    <text x="311" y="763" class="body">先做动作自注意，再以动作查询语音。条件位置</text>
    <text x="311" y="789" class="body">可看全段语音，动作位置 n 只直连语音特征 n。</text>
    <path d="M153 815V844" class="arrow"/>
    <path d="M541 815V844" class="arrow"/>
    <rect x="32" y="847" width="242" height="88" rx="10" class="out"/>
    <text x="48" y="876" class="heading">连续面部动作</text>
    <text x="48" y="905" class="body">100 维表情 + 6 维下颌旋转。</text>
    <rect x="295" y="847" width="493" height="88" rx="10" class="out"/>
    <text x="311" y="876" class="heading">残差量化 → 冻结的身体解码器</text>
    <text x="311" y="905" class="body">依次量化剩余误差，再解码上身、手部与下身动作。</text>
    <path d="M153 935V951H410M541 935V951H410" class="wire"/>
    <path d="M410 951V967" class="arrow"/>
    <rect x="32" y="969" width="756" height="64" rx="10" class="out"/>
    <text x="410" y="997" text-anchor="middle" class="heading">同一语音下的三维身体、手势与面部表情</text>
    <text x="410" y="1020" text-anchor="middle" class="note">论文按 30 帧/秒、每段 120 帧训练，采用 500 个扩散步。</text>
  </g>
  <text x="27" y="1084" class="note">依据期刊原图 2–4、补充材料 A 与作者的 CHGS 演示代码重绘。</text>
  <text x="27" y="1109" class="note">图示为论文的完整方法。作者仓库已提供不带风格编码器的演示，视频风格入口仍标为待发布。</text>
</svg>
