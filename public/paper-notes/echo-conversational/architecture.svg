<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1628" viewBox="0 0 640 1628" role="img" aria-labelledby="title desc">
  <title id="title">Echo 怎样从“两个人在谈旅行”生成主角的动作</title>
  <desc id="desc">作者图 4 的旅行对话经过三次语义抽取、复核择一与格式检查。双方的声音、转写、角色标识和伙伴的已知动作组成帧级条件。局部意图、情绪、主动性和强度加入句级融合；话题和全局意图加入对话级融合。三个尺度的特征拼接，输入已有生成器，预测主角的骨骼序列。图 5 中指向伙伴的动作属于另一段对话。</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L6 3.5L0 7Z" fill="#416660"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Source Han Sans CN",sans-serif;fill:#16342f}
      .label{font-size:19px;font-weight:700;letter-spacing:1.1px}
      .title{font-size:41px;font-weight:700;letter-spacing:-.8px}
      .section{font-size:30px;font-weight:700}
      .subhead{font-size:26px;font-weight:700}
      .body{font-size:24px}
      .small{font-size:21px}
      .caps{font-family:Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:1.35px}
      .muted{fill:#49625c}
      .edge{stroke:#416660;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="640" height="1628" rx="20" fill="#faf8f2"/>

  <text x="28" y="42" class="caps" fill="#486b63">ECHO   /   SIGGRAPH ASIA 2025</text>
  <text x="28" y="105" class="title">从一句旅行感想到主角动作</text>
  <path d="M28 136H612" stroke="#b2c2b7" stroke-width="2"/>

  <text x="28" y="190" class="section">①  两人在说什么？</text>
  <rect x="28" y="209" width="584" height="182" rx="14" fill="#e8efeb" stroke="#b2c2b7"/>
  <text x="51" y="250" class="label" style="fill:#216c5c">主角</text>
  <text x="134" y="250" class="body">我想去旅行，听说日本的樱花很美。</text>
  <path d="M51 270H588" stroke="#c1cdc4"/>
  <text x="51" y="309" class="label" style="fill:#124e78">伙伴</text>
  <text x="134" y="309" class="body">我去过，确实不错。</text>
  <text x="51" y="364" class="small muted">据图 4 意译。场景中有双方语音和伙伴动作。</text>

  <text x="28" y="456" class="section">②  这句话在做什么？</text>
  <text x="28" y="494" class="body">语言模型从转写读上下文，结合语音情绪。</text>
  <text x="28" y="528" class="body">窗口初始为 10 句，变换窗口与提示，抽取 3 次。</text>
  <g>
    <rect x="28" y="551" width="176" height="61" rx="12" fill="#fff" stroke="#a2b5af"/>
    <rect x="214" y="551" width="176" height="61" rx="12" fill="#fff" stroke="#a2b5af"/>
    <rect x="400" y="551" width="176" height="61" rx="12" fill="#fff" stroke="#a2b5af"/>
    <text x="116" y="590" text-anchor="middle" class="body">候选 A</text>
    <text x="302" y="590" text-anchor="middle" class="body">候选 B</text>
    <text x="488" y="590" text-anchor="middle" class="body">候选 C</text>
    <path d="M116 612V624H488V612" fill="none" stroke="#8ba39b" stroke-width="2"/>
    <path d="M302 612V646" class="edge"/>
  </g>
  <rect x="28" y="651" width="584" height="78" rx="12" fill="#fffdf9" stroke="#a2b5af"/>
  <text x="50" y="685" class="subhead">复核器参照示例，择一</text>
  <text x="50" y="715" class="small muted">规则检查格式与缺项；不合格则请求重新生成。</text>

  <text x="28" y="799" class="section">③  三种时间尺度怎样汇合？</text>

  <rect x="28" y="823" width="584" height="96" rx="13" fill="#e5eef4" stroke="#97adbd"/>
  <rect x="28" y="823" width="10" height="96" rx="5" fill="#366a8b"/>
  <text x="51" y="858" class="subhead" style="fill:#205071">逐帧 · Hf</text>
  <text x="51" y="894" class="body">双方语音与转写、角色标识、伙伴的已知动作</text>
  <path d="M75 919V945" class="edge"/>
  <rect x="28" y="950" width="584" height="131" rx="13" fill="#f7eddd" stroke="#c7ac7e"/>
  <rect x="28" y="950" width="10" height="131" rx="5" fill="#a96e29"/>
  <text x="51" y="985" class="subhead" style="fill:#79501d">当前句 · Hs</text>
  <text x="51" y="1022" class="body">图 4 的判断：陈述、高兴、主动、强度 5/10。</text>
  <text x="51" y="1057" class="small muted">这些类别经独热编码，与 Hf 在融合块中合并。</text>
  <path d="M75 1081V1107" class="edge"/>
  <rect x="28" y="1112" width="584" height="131" rx="13" fill="#e6efe7" stroke="#a0b5a3"/>
  <rect x="28" y="1112" width="10" height="131" rx="5" fill="#50816a"/>
  <text x="51" y="1148" class="subhead" style="fill:#305f46">整段对话 · Hc</text>
  <text x="51" y="1185" class="body">话题是旅行经历；主角想向伙伴寻求建议。</text>
  <text x="51" y="1219" class="small muted">全局文本经 BERT 编码，与 Hs 再做一次融合。</text>
  <text x="28" y="1280" class="small muted">每个融合块依次拼接特征、做交叉注意力、再过 MLP。</text>

  <text x="28" y="1349" class="section">④  谁的动作被生成？</text>
  <rect x="28" y="1370" width="584" height="117" rx="14" fill="#22483f"/>
  <text x="50" y="1413" class="subhead" style="fill:#fff">拼接 Hf、Hs、Hc　→　动作生成器</text>
  <text x="50" y="1455" class="body" style="fill:#fff">已知的是伙伴动作，输出的是主角的骨骼序列。</text>
  <text x="28" y="1531" class="small">图 4 展示语义判断；图 5 指向伙伴的动作来自另一句</text>
  <text x="28" y="1561" class="small">“you know”。强度 5/10 不指定哪只手或哪一帧。</text>
  <path d="M28 1583H612" stroke="#b2c2b7"/>
  <text x="28" y="1613" class="caps muted">依据主文图 2、4、5，式 1–4；补充材料 §1.2</text>
</svg>
