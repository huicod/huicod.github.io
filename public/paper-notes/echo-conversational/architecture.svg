<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1310" viewBox="0 0 1040 1310" role="img" aria-labelledby="title desc">
<title id="title">Echo · 从对话理解到主角动作</title><desc id="desc">两个说话人的语义先被提取和择一复核。三条时间尺度逐级融合，再一起送进主角生成器。</desc>
<defs><marker id="arrow" viewBox="0 0 9 8" refX="8" refY="4" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="11" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#416c70"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#203f43}.strong{font-weight:700}.label{fill:#355a5d}.id{fill:#17756f;font-weight:700}</style>
<rect width="1040" height="1310" fill="#f5f8f6"/>
<text x="34" y="54" font-size="36" class="strong">Echo · 从对话理解到主角动作</text>
<text x="36" y="95" font-size="22" class="label">SIGGRAPH Asia 2025　｜　伙伴的动作已知，合成目标是主角。</text>
<rect x="20" y="122" width="1000" height="300" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="164" font-size="23" class="id">01</text>
<text x="99" y="164" font-size="28" class="strong">先解释这一场谈话与当前一句</text>
<rect x="42" y="198" width="260" height="108" rx="12" fill="#e8f1f7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="57" y="231" font-size="24" class="strong">双方的转写</text>
<text x="57" y="264" font-size="21" class="">从初始 10 句上下文</text>
<text x="57" y="291" font-size="21" class="">读取发言次序。</text>
<rect x="382" y="198" width="272" height="108" rx="12" fill="#e3f1e9" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="397" y="231" font-size="24" class="strong">语言模型抽取</text>
<text x="397" y="264" font-size="21" class="">改变窗口、提示、温度</text>
<text x="397" y="291" font-size="21" class="">得到 3 份候选解释。</text>
<rect x="722" y="198" width="272" height="108" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="737" y="231" font-size="24" class="strong">复核与规则检查</text>
<text x="737" y="264" font-size="21" class="">参照示例择一，检查</text>
<text x="737" y="291" font-size="21" class="">字段格式与完整性。</text>
<path d="M302 250 H382" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M654 250 H722" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="42" y="328" width="260" height="68" rx="12" fill="#e8f1f7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="57" y="361" font-size="24" class="strong">语音 → emotion2vec</text>
<path d="M302 362 H388" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="388" y="328" width="268" height="68" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="403" y="361" font-size="24" class="strong">8 类情绪 → 句标签</text>
<rect x="722" y="328" width="272" height="68" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="737" y="361" font-size="24" class="strong">局部与全局语义 ↓</text>
<path d="M858 306 V328" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="446" width="1000" height="486" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="488" font-size="23" class="id">02</text>
<text x="99" y="488" font-size="28" class="strong">帧级特征先与句标签融合，再接入整场语义</text>
<rect x="44" y="526" width="286" height="102" rx="12" fill="#e8f1f7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="59" y="559" font-size="24" class="strong">帧级输入</text>
<text x="59" y="592" font-size="21" class="">双方语音、转写、角色标识</text>
<text x="59" y="619" font-size="21" class="">和伙伴已知的运动。</text>
<rect x="377" y="526" width="286" height="102" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="392" y="559" font-size="24" class="strong">当前句的标签</text>
<text x="392" y="592" font-size="21" class="">如：陈述，触发强度 5。</text>
<text x="392" y="619" font-size="21" class="">局部类别 → 独热向量。</text>
<rect x="710" y="526" width="286" height="102" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="725" y="559" font-size="24" class="strong">整场对话的文本</text>
<text x="725" y="592" font-size="21" class="">如：谈旅行，想求建议。</text>
<text x="725" y="619" font-size="21" class="">全局文本 → BERT 编码。</text>
<rect x="44" y="704" width="286" height="103" rx="12" fill="#e3f1e9" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="59" y="737" font-size="24" class="strong">原骨干编码 → Hf</text>
<text x="59" y="770" font-size="21" class="">逐帧保留声音节奏</text>
<text x="59" y="797" font-size="21" class="">和伙伴运动。</text>
<rect x="377" y="704" width="286" height="103" rx="12" fill="#e3f1e9" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="392" y="737" font-size="24" class="strong">融合 IF → Hs</text>
<text x="392" y="770" font-size="21" class="">Hf 与当句标签融合。</text>
<rect x="710" y="704" width="286" height="103" rx="12" fill="#e3f1e9" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="725" y="737" font-size="24" class="strong">融合 IF → Hc</text>
<text x="725" y="770" font-size="21" class="">Hs 与整场文本融合。</text>
<path d="M187 628 V704" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M520 628 V704" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M853 628 V704" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M330 748 H377" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M663 748 H710" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M187 807 V857" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M520 807 V857" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M853 807 V857" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="857" width="880" height="58" rx="12" fill="#d7eeeb" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="95" y="890" font-size="24" class="strong">拼接 Hf、Hs、Hc，保留三种尺度</text>
<rect x="20" y="956" width="1000" height="260" rx="18" fill="#fff" stroke="#cbd8d3" stroke-width="1.6"/>
<text x="43" y="998" font-size="23" class="id">03</text>
<text x="99" y="998" font-size="28" class="strong">沿用动作骨干，输出主角的骨骼序列</text>
<rect x="46" y="1025" width="248" height="80" rx="12" fill="#e8f1f7" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="61" y="1058" font-size="24" class="strong">三级条件</text>
<text x="61" y="1091" font-size="21" class="">来自 02 的拼接。</text>
<rect x="360" y="1025" width="302" height="80" rx="12" fill="#e3f1e9" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="375" y="1058" font-size="24" class="strong">动作生成器</text>
<text x="375" y="1091" font-size="21" class="">可接 DSG+ 等骨干。</text>
<rect x="738" y="1025" width="256" height="80" rx="12" fill="#d7eeeb" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="753" y="1058" font-size="24" class="strong">主角的骨骼运动</text>
<text x="753" y="1091" font-size="21" class="">与已知伙伴配对。</text>
<path d="M294 1065 H360" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M662 1065 H738" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="360" y="1143" width="302" height="53" rx="12" fill="#fcf0d6" stroke="#c4d4ce" stroke-width="1.6"/>
<text x="375" y="1176" font-size="24" class="strong">真实主角动作 · 训练用</text>
<path d="M512 1143 V1105" fill="none" stroke="#416c70" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="38" y="1252" font-size="20" class="label">实线表示数据流；虚线仅在训练时提供监督。生成时给定伙伴动作，无需真实主角动作。</text>
<text x="38" y="1286" font-size="20" class="label">据主文图 2–4、式 1–4 及补充 §1.2 重绘。图 4 的旅行案例展示到语义分析为止。</text>
</svg>
