<text x="795.0" y="1364" font-size="18" font-weight="400" text-anchor="middle">逐块生成连续表情系数</text>
<path d="M795 1220 V1280" class="line"/>
<rect x="60" y="1380" width="430" height="90" rx="12" fill="#fff3e5" stroke="#d3ba96" stroke-width="1.5"/>
<text x="275.0" y="1411" font-size="21" font-weight="700" text-anchor="middle">按时间与部位还原 RVQ 码</text>
<text x="275.0" y="1439" font-size="18" font-weight="400" text-anchor="middle">三个身体分区，每区六层残差</text>
