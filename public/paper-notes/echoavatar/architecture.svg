<text x="275.0" y="1589" font-size="18" font-weight="400" text-anchor="middle">因果解码并组合</text>
<text x="275.0" y="1614" font-size="18" font-weight="400" text-anchor="middle">输出关节姿态与根平移</text>
<path d="M275 1470 V1530" class="line"/>
<rect x="60" y="1690" width="430" height="85" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="275.0" y="1721" font-size="21" font-weight="700" text-anchor="middle">轻量 IK 与插值</text>
<text x="275.0" y="1749" font-size="18" font-weight="400" text-anchor="middle">缓解手穿躯干；30 FPS → 60 FPS</text>
<rect x="610" y="1690" width="370" height="85" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="795.0" y="1721" font-size="21" font-weight="700" text-anchor="middle">面部平滑与插值</text>
<text x="795.0" y="1749" font-size="18" font-weight="400" text-anchor="middle">30 FPS → 60 FPS</text>
