<text x="275.0" y="991" font-size="21" font-weight="700" text-anchor="middle">因果 EnCodec</text>
<text x="275.0" y="1019" font-size="18" font-weight="400" text-anchor="middle">增量音频 → 音频 token / 滑动窗口</text>
<rect x="610" y="960" width="370" height="90" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="795.0" y="991" font-size="21" font-weight="700" text-anchor="middle">多语言 HuBERT</text>
<text x="795.0" y="1019" font-size="18" font-weight="400" text-anchor="middle">同一音频块 → 连续音频特征</text>
<rect x="60" y="1090" width="240" height="80" rx="12" fill="#f2edfa" stroke="#b9abd0" stroke-width="1.5"/>
<text x="180.0" y="1121" font-size="21" font-weight="700" text-anchor="middle">可选动作调用</text>
<text x="180.0" y="1149" font-size="18" font-weight="400" text-anchor="middle">查参考码 + 采样偏置</text>
<rect x="330" y="1090" width="160" height="80" rx="12" fill="#fff3e5" stroke="#d3ba96" stroke-width="1.5"/>
<text x="410.0" y="1121" font-size="21" font-weight="700" text-anchor="middle">动作历史</text>
<text x="410.0" y="1149" font-size="18" font-weight="400" text-anchor="middle">最近动作 token</text>
<rect x="60" y="1220" width="430" height="100" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="275.0" y="1251" font-size="21" font-weight="700" text-anchor="middle">Qwen 自回归身体生成</text>
<text x="275.0" y="1279" font-size="18" font-weight="400" text-anchor="middle">音频 + 历史 + 可选示例</text>
<text x="275.0" y="1304" font-size="18" font-weight="400" text-anchor="middle">输出三部位的完整 RVQ 层级</text>
<path d="M490 1005 H540 V1270 H490" class="line"/>
<path d="M180 1170 V1220" class="line"/>
<path d="M410 1170 V1220" class="line"/>
<rect x="610" y="1120" width="370" height="100" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
<text x="795.0" y="1151" font-size="21" font-weight="700" text-anchor="middle">面部因果 GPT</text>
<text x="795.0" y="1179" font-size="18" font-weight="400" text-anchor="middle">音频条件 + 历史表情帧</text>
<path d="M795 1050 V1120" class="line"/>
<rect x="610" y="1280" width="370" height="100" rx="12" fill="#eaf2fb" stroke="#a4bad0" stroke-width="1.5"/>
