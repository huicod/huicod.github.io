<text x="52" y="1192" font-size="20" font-weight="400" fill="#476570" text-anchor="start">预测还有一种可选的补全方式：先重建已观测动作，再在每个反向扩散步固定该前缀。</text>
<text x="36" y="1268" font-size="17" font-weight="400" fill="#476570" text-anchor="start">依据论文图 2、图 7、§3 与附录 D/F 绘制。时间格表示可见范围，生成行的第一格仅表示一张图。</text>
