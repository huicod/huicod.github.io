<text x="845" y="325" font-size="19" font-weight="700" fill="#476570" text-anchor="start">地面参考系</text>
<text x="696" y="389" font-size="17" font-weight="400" fill="#476570" text-anchor="start">示意  ·  脚下的原点随头部移动</text>
<rect x="24" y="434" width="1072" height="380" rx="16" fill="#ffffff" stroke="#cbdcda" stroke-width="1.5"/>
<text x="48" y="473" font-size="18" font-weight="700" fill="#087b78" text-anchor="start">扩散训练</text>
<text x="174" y="475" font-size="27" font-weight="700" fill="#183844" text-anchor="start">设备轨迹和图像从两个不同的位置进入去噪器</text>
<g class="card">
<rect x="50" y="503" width="320" height="109" rx="12" fill="#f1edf8" stroke="#c3b1d7" stroke-width="1.5"/>
<text x="66" y="536" font-size="23" font-weight="700" fill="#664a89" text-anchor="start">加噪的动作序列</text>
<text x="66" y="566" font-size="20" font-weight="400" fill="#183844" text-anchor="start">逐帧投影到隐空间</text>
</g>
<g class="card">
<rect x="400" y="503" width="305" height="109" rx="12" fill="#e6f5ef" stroke="#9bcabb" stroke-width="1.5"/>
<text x="416" y="536" font-size="23" font-weight="700" fill="#087b78" text-anchor="start">设备的 6 自由度轨迹</text>
<text x="416" y="566" font-size="20" font-weight="400" fill="#183844" text-anchor="start">逐帧做线性投影</text>
</g>
<g class="card">
<rect x="735" y="503" width="335" height="109" rx="12" fill="#eaf1fb" stroke="#b1c6da" stroke-width="1.5"/>
