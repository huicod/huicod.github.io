<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1295" width="1120" height="1295" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">UniEgoMotion 如何从眼前画面推断佩戴者的动作</title><desc id="desc">训练用第一人称画面和头戴设备轨迹给动作扩散模型提供条件。推理时按已观测的时段选择重建、预测或单图生成。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8.4 5 L1 9" fill="none" stroke="#55747b" stroke-width="1.8"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}path,polyline,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="1" y="1" width="1118" height="1293" rx="20" fill="#f7faf9" stroke="#bcd0cf" stroke-width="1.5"/>
<text x="40" y="62" font-size="42" font-weight="700" fill="#183844" text-anchor="start">UniEgoMotion</text>
<text x="40" y="104" font-size="27" font-weight="400" fill="#183844" text-anchor="start">从头戴相机看见的场景，推断戴相机的人怎样动</text>
<rect x="24" y="136" width="1072" height="276" rx="16" fill="#ffffff" stroke="#cbdcda" stroke-width="1.5"/>
<text x="48" y="175" font-size="18" font-weight="700" fill="#087b78" text-anchor="start">动作表示</text>
<text x="174" y="177" font-size="27" font-weight="700" fill="#183844" text-anchor="start">用头部在地面的投影建立每帧坐标系</text>
<text x="52" y="230" font-size="21" font-weight="400" fill="#183844" text-anchor="start">外部多机位协助拟合 SMPL-X，得到训练用动作。</text>
<text x="52" y="267" font-size="21" font-weight="400" fill="#183844" text-anchor="start">将头部投到地面，保留平面位置和朝向，</text>
<text x="52" y="304" font-size="21" font-weight="400" fill="#183844" text-anchor="start">逐帧记录地面参考系的变化，以及身体各关节</text>
<text x="52" y="341" font-size="21" font-weight="400" fill="#183844" text-anchor="start">在该参考系中的姿态。</text>
<path d="M649 361 L979 361 L1021 330" fill="none" stroke="#b0c6c2" stroke-width="2"/>
