<text x="565" y="722" font-size="23" font-weight="700" fill="#664a89" text-anchor="middle">Transformer 解码器  ·  结合扩散时间步，逐帧预测干净动作</text>
<text x="52" y="783" font-size="20" font-weight="400" fill="#476570" text-anchor="start">训练时随机遮蔽观测条件，缺失位置由可学习的掩码填充。模型通过与干净动作比较来学习去噪。</text>
<rect x="24" y="837" width="1072" height="388" rx="16" fill="#ffffff" stroke="#cbdcda" stroke-width="1.5"/>
<text x="48" y="876" font-size="18" font-weight="700" fill="#087b78" text-anchor="start">任务切换</text>
<text x="174" y="878" font-size="27" font-weight="700" fill="#183844" text-anchor="start">同一个去噪器，输入的可见时段决定输出</text>
<text x="52" y="929" font-size="18" font-weight="400" fill="#476570" text-anchor="start">每格代表一段时间</text>
<rect x="310" y="913" width="17" height="17" rx="3" fill="#087b78" stroke="none" stroke-width="1.5"/>
<text x="337" y="929" font-size="18" font-weight="400" fill="#476570" text-anchor="start">已观测</text>
