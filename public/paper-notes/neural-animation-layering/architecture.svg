<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2780" viewBox="0 0 1200 2780" role="img"><title>Neural Animation Layering完整架构</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#668199"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="40" y="48" font-size="32" fill="#26354a" font-weight="700" text-anchor="start">Neural Animation Layering：轨迹层叠，全身协调</text><text x="40" y="87" font-size="22" fill="#26354a" font-weight="400" text-anchor="start">任务模块决定控制曲线；共享接口组合意图；一个已训练生成器预测完整身体。</text><rect x="25" y="120" width="1150" height="490" rx="22" fill="#f7f9fc" stroke="#dae3ed" stroke-width="2"/><text x="48" y="159" font-size="28" fill="#26354a" font-weight="700" text-anchor="start">A  训练：先学习全身生成，再独立构建任务模块</text><text x="48" y="194" font-size="21" fill="#53667c" font-weight="400" text-anchor="start">所有神经模块以动捕目标监督；并非端到端联合微调全部任务。</text><rect x="50" y="225" width="310" height="155" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="257" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">动捕与派生特征</text><text x="68" y="292" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">当前全身姿态</text><text x="68" y="322" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">轨迹窗口、下一帧目标</text><rect x="435" y="225" width="330" height="155" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="453" y="257" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">① 全身生成器训练</text><text x="453" y="292" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">gating ＋ 8 专家参数组</text><text x="453" y="322" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">共同学习姿态预测</text><rect x="840" y="225" width="310" height="155" rx="16" fill="#e8f3f1" stroke="#ccd7e3" stroke-width="2"/><text x="858" y="257" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">已训练全身模型</text><text x="858" y="292" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">保留参数供 D 复用</text><text x="858" y="322" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">新增控制无需重训主干</text><path d="M360,300 L435,300" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M765,300 L840,300" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="50" y="435" width="1100" height="125" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="467" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">② 各任务独立准备</text><text x="68" y="502" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">相关动捕子集 → 移动 / 重定向 / 闪避 / 近身网络；或选择参考片段、建立检索库。</text><text x="68" y="532" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">控制模块有不同输入，但都返回关键关节轨迹；不是所有模块都必须训练。</text><rect x="25" y="645" width="1150" height="580" rx="22" fill="#f7f9fc" stroke="#dae3ed" stroke-width="2"/><text x="48" y="684" font-size="28" fill="#26354a" font-weight="700" text-anchor="start">B  运行时任务模块：多种输入，共享输出</text><text x="48" y="719" font-size="21" fill="#53667c" font-weight="400" text-anchor="start">用户操作、参考片段、双方姿态与交互状态进入各自对应模块。</text><rect x="50" y="750" width="1100" height="80" rx="16" fill="#e8f3f1" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="782" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">外部输入：手柄 / 动作索引 / 对手状态 / 接触冲击；当前与历史状态由缓存提供。</text><rect x="50" y="880" width="310" height="160" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="912" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">移动控制网络</text><text x="68" y="947" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">根控制＋当前状态</text><text x="68" y="977" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">双脚局部相位</text><text x="68" y="1007" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">输出未来轨迹与相位更新</text><rect x="435" y="880" width="330" height="160" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="453" y="912" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">片段与检索模块</text><text x="453" y="947" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">待机 / 攻击：参考片段</text><text x="453" y="977" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">受击：区域＋冲击速度</text><text x="453" y="1007" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">返回检索片段的轨迹</text><rect x="840" y="880" width="310" height="160" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="858" y="912" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">交互控制网络</text><text x="858" y="947" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">重定向攻击、闪避</text><text x="858" y="977" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">主从角色近身交互</text><text x="858" y="1007" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">另输出接触约束供 D</text><path d="M205,830 L205,880" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600,830 L600,880" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M995,830 L995,880" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="50" y="1100" width="1100" height="85" rx="16" fill="#e8f3f1" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="1132" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">统一输出：根轨迹＋11个关键关节轨迹；未来1秒，共7个采样点。</text><path d="M205,1040 L205,1100" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600,1040 L600,1100" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M995,1040 L995,1100" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="25" y="1260" width="1150" height="510" rx="22" fill="#f7f9fc" stroke="#dae3ed" stroke-width="2"/><text x="48" y="1299" font-size="28" fill="#26354a" font-weight="700" text-anchor="start">C  共享控制接口：编辑的是轨迹，不是最终姿态</text><text x="48" y="1334" font-size="21" fill="#53667c" font-weight="400" text-anchor="start">通道选择与优先级由动画师 / 游戏逻辑指定；可在训练后动态改变。</text><rect x="50" y="1365" width="310" height="150" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="1397" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">覆盖 Override</text><text x="68" y="1432" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">按通道选择来源</text><text x="68" y="1462" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">如移动下肢＋攻击上肢</text><rect x="435" y="1365" width="330" height="150" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="453" y="1397" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">偏移 Additive</text><text x="453" y="1432" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">修改所选轨迹</text><text x="453" y="1462" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">位置 / 方向 / 自定义信号</text><rect x="840" y="1365" width="310" height="150" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="858" y="1397" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">混合 Blending</text><text x="858" y="1432" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">在两组控制之间过渡</text><text x="858" y="1462" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">位置与旋转按相应方式插值</text><rect x="50" y="1580" width="1100" height="125" rx="16" fill="#e8f3f1" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="1612" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">合成控制 C：12个通道，共同描述拟实现的运动</text><text x="68" y="1647" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">未来7点 ＋ 已生成的历史 → 前后各1秒、共13点窗口</text><text x="68" y="1677" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">位置、朝向与速度被一起传入生成器；没有最终姿态逐点硬拷贝。</text><path d="M205,1515 L205,1580" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600,1515 L600,1580" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M995,1515 L995,1580" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="55" y="1743" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">不合理的轨迹组合仍会失败；生成器的协调调整也会改变未被直接编辑的关节。</text><rect x="25" y="1805" width="1150" height="880" rx="22" fill="#f7f9fc" stroke="#dae3ed" stroke-width="2"/><text x="48" y="1844" font-size="28" fill="#26354a" font-weight="700" text-anchor="start">D  逐帧生成与接触修正</text><text x="48" y="1879" font-size="21" fill="#53667c" font-weight="400" text-anchor="start">全身主干不使用局部相位；未来轨迹来自 B / C，而不是真实未来观测。</text><rect x="50" y="1910" width="310" height="145" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="1942" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">当前姿态 Pᵢ</text><text x="68" y="1977" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">身体位置、方向与速度</text><text x="68" y="2007" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">角色自身根坐标系</text><rect x="435" y="1910" width="330" height="145" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="453" y="1942" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">C 的合成控制窗口</text><text x="453" y="1977" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">完整轨迹 → 姿态预测</text><text x="453" y="2007" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">未来关节速度大小 → gating</text><rect x="840" y="1910" width="310" height="145" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="858" y="1942" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">gating 网络</text><text x="858" y="1977" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">11 关节 × 7 点速度幅值</text><text x="858" y="2007" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">混合 8 组专家参数</text><path d="M765,1980 L840,1980" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="50" y="2110" width="270" height="90" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="2142" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">① A 中已训模型</text><text x="68" y="2177" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">训练产物复用</text><rect x="435" y="2140" width="330" height="145" rx="16" fill="#e8f3f1" stroke="#ccd7e3" stroke-width="2"/><text x="453" y="2172" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">统一姿态预测网络</text><text x="453" y="2207" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">当前姿态＋控制窗口</text><text x="453" y="2237" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">使用混合后的网络参数</text><rect x="840" y="2140" width="310" height="145" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="858" y="2172" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">预测下一帧</text><text x="858" y="2207" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">身体、手指、根更新</text><text x="858" y="2237" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">手脚接触开关</text><path d="M320,2155 L435,2155" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M205,2055 L350,2055 L350,2240 L435,2240" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600,2055 L600,2140" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M995,2055 L995,2095 L790,2095 L790,2205 L765,2205" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M765,2240 L840,2240" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="50" y="2350" width="310" height="150" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="2382" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">B 的近身交互约束</text><text x="68" y="2417" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">关节对：接触开关</text><text x="68" y="2447" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">＋相对位置向量</text><text x="68" y="2477" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">仅对应交互任务使用</text><rect x="435" y="2350" width="330" height="150" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="453" y="2382" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">接触与 IK 修正</text><text x="453" y="2417" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">变换目标到当前空间</text><text x="453" y="2447" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">按预测接触选择 / 加权约束</text><text x="453" y="2477" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">处理支撑与角色间接触</text><rect x="840" y="2350" width="310" height="150" rx="16" fill="#fff" stroke="#ccd7e3" stroke-width="2"/><text x="858" y="2382" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">输出与反馈</text><text x="858" y="2417" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">显示完整角色动作</text><text x="858" y="2447" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">更新姿态 / 历史缓存</text><text x="858" y="2477" font-size="21" fill="#26354a" font-weight="400" text-anchor="start">进入下一帧 B → C → D</text><path d="M360,2425 L435,2425" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M765,2425 L840,2425" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M995,2285 L995,2315 L600,2315 L600,2350" fill="none" stroke="#668199" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="50" y="2560" width="1100" height="80" rx="16" fill="#fff4e7" stroke="#ccd7e3" stroke-width="2"/><text x="68" y="2592" font-size="24" fill="#26354a" font-weight="700" text-anchor="start">边界：运动学系统；预测轨迹、接触标签与 IK 不等于动力学或无碰撞保证。</text><text x="40" y="2730" font-size="20" fill="#53667c" font-weight="400" text-anchor="start">原创教学重绘｜依据 Starke 等，SIGGRAPH 2021：图2–5、§3–7、附录A。</text><text x="40" y="2761" font-size="20" fill="#53667c" font-weight="400" text-anchor="start">实线：数据、条件与反馈；虚线：已训练模块复用。当前官方入口未提供本篇对应实现。</text></g></svg>