<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 765" role="img" aria-labelledby="title desc">
  <title id="title">MoLingo 架构：先训练时间局部的连续动作表示，再用文本生成这些表示</title>
  <desc id="desc">上半图为表征训练。动作特征经因果一维卷积得到连续向量并用于重建。BABEL 帧标签在同一时间窗内经 T5、平均、投影后以余弦损失对齐这些向量。下半图为生成。文本词元作为键和值，部分已知的动作位置作为查询，Transformer 为一批空位提供上下文。小型流模型从噪声生成这些位置的连续向量，回填后重复。最后通过动作解码器得到骨架。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#405669" stroke-width="1.5"/></marker></defs>
  <style>
    text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#18354b}.heading{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:650}.detail{font-size:16px}.micro{font-size:15px}.a{fill:none;stroke:#405669;stroke-width:2;marker-end:url(#a)}.train{fill:#edf5f9;stroke:#84a6bd}.txt{fill:#fcf1df;stroke:#c1a46b}.flow{fill:#eaf5ed;stroke:#8bb39c}.out{fill:#f1edf9;stroke:#ab9abf}.box{stroke-width:1.5;rx:9}
  </style>
  <rect width="960" height="765" rx="16" fill="#fcfcfa"/>
  <text class="heading" x="28" y="42">① 训练动作自编码器：同一向量同时保留姿态细节与局部语义</text>
  <rect class="box train" x="28" y="66" width="197" height="69"/><text class="label" x="43" y="94">真实动作序列</text><text class="detail" x="43" y="119">N 帧全身特征</text>
  <path class="a" d="M226 100H259"/>
  <rect class="box train" x="264" y="66" width="180" height="69"/><text class="label" x="279" y="94">因果动作编码器</text><text class="detail" x="279" y="119">按时间压缩</text>
  <path class="a" d="M445 100H477"/>
  <rect class="box flow" x="482" y="66" width="190" height="69"/><text class="label" x="496" y="94">局部动作向量 mᵢ</text><text class="detail" x="496" y="119">主评测每 4 帧一个</text>
  <path class="a" d="M673 100H708"/>
  <rect class="box train" x="713" y="66" width="219" height="69"/><text class="label" x="727" y="94">动作解码器</text><text class="detail" x="727" y="119">重建特征、关节位置与速度*</text>
  <rect class="box txt" x="28" y="183" width="197" height="69"/><text class="label" x="43" y="211">BABEL 帧级标签</text><text class="detail" x="43" y="236">取与 mᵢ 对应的时间窗</text>
  <path class="a" d="M226 218H259"/>
  <rect class="box txt" x="264" y="183" width="180" height="69"/><text class="label" x="279" y="211">冻结 T5-Large</text><text class="detail" x="279" y="236">窗口内平均，再投影</text>
  <path class="a" d="M445 218H477"/>
  <rect class="box txt" x="482" y="183" width="190" height="69"/><text class="label" x="496" y="211">局部文本向量 κᵢ</text><text class="detail" x="496" y="236">去掉高度重复的监督项</text>
  <path d="M578 181V140" fill="none" stroke="#94702e" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="micro" x="588" y="162">余弦对齐</text>
  <text class="detail" x="28" y="285">* 重建损失用于整个训练集，局部语义损失只用于 HumanML3D 与 BABEL 有标注的交集。</text>
  <path d="M28 311H932" stroke="#ccd6d9"/>
  <text class="heading" x="28" y="350">② 文本生成动作：按批填回空位，每个空位在连续空间内采样</text>
  <rect class="box txt" x="28" y="378" width="225" height="76"/><text class="label" x="42" y="409">整句动作描述</text><text class="detail" x="42" y="434">冻结 T5 + 可训练文本适配器</text>
  <rect class="box train" x="28" y="478" width="225" height="78"/><text class="label" x="42" y="510">动作时间轴</text><text class="detail" x="42" y="535">已填向量 + 未填位置的掩码</text>
  <path class="a" d="M254 416H294V452H325"/><path class="a" d="M254 517H294V495H325"/>
  <rect class="box train" x="330" y="410" width="256" height="117"/><text class="label" x="345" y="440">掩码 Transformer</text><text class="detail" x="345" y="467">Q 来自动作，K/V 来自文本词元</text><text class="detail" x="345" y="494">每个待填位置得到上下文 zᵢ</text>
  <path class="a" d="M588 467H628"/>
  <rect class="box flow" x="633" y="410" width="299" height="117"/><text class="label" x="648" y="440">条件整流流 MLP</text><text class="detail" x="648" y="467">输入 zᵢ、流时间、带噪向量</text><text class="detail" x="648" y="494">从随机噪声采样出局部动作 mᵢ</text>
  <path class="a" d="M782 528V577H140V560"/><text class="micro" x="310" y="570">将生成的向量写回，选择下一批位置</text>
  <rect class="box flow" x="28" y="620" width="265" height="65"/><text class="label" x="44" y="659">所有位置都已填入连续向量</text>
  <path class="a" d="M294 651H339"/>
  <rect class="box train" x="344" y="620" width="242" height="65"/><text class="label" x="361" y="659">阶段①的动作解码器</text>
  <path class="a" d="M587 651H628"/>
  <rect class="box out" x="633" y="620" width="299" height="65"/><text class="label" x="649" y="659">连续的全身动作序列</text>
  <text class="detail" x="28" y="725">训练生成器时随机遮住真实向量；从文字生成时，所有位置从掩码开始，无需真实骨架或帧级标签。</text>
</svg>
