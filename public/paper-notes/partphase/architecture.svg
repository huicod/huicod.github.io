<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1080" height="1530" viewBox="0 0 1080 1530"><title id="title">MIB-BodyPartPhase 身体部位相位与动作补间</title><desc id="desc">A 训练部位周期自编码器，B 训练动作 CVAE 及专家，C 用参考风格、目标关键帧和可编辑相位逐帧生成全身状态，D 在已生成的骨架上回读控制效果。</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L11 6L0 11z" fill="#396073"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#163848}.title{font-weight:700;font-size:39px}.sub{font-size:23px}.section{font-size:31px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:19px}.fine{font-size:18px}.arrow{fill:none;stroke:#396073;stroke-width:3;marker-end:url(#arr)}</style><rect width="1080" height="1530" fill="#f1f6f6"/><rect x="25" y="20" width="1030" height="125" rx="19" fill="#13394a"/><text x="55" y="74" class="title" style="fill:white">MIB-BodyPartPhase｜关键帧之间，部位怎样动？</text><text x="55" y="114" class="sub" style="fill:#d3e8ec">目标姿态给定终点，参考动作给定风格，局部相位控制途中的幅度与节奏。</text><rect x="25" y="164" width="1030" height="265" rx="21" fill="white" stroke="#bdd0d4" stroke-width="2"/><text x="54" y="212" class="section" text-anchor="start">A  先学会从动作中读出部位相位</text><text x="54" y="247" class="sub" text-anchor="start">短窗骨架经周期自编码器重建。五部位各分配两个相位通道。</text><rect x="53" y="272" width="284" height="102" rx="12" fill="#dceefa"/><text x="195" y="306" class="label" text-anchor="middle">短窗骨架状态</text><text x="195" y="337" class="small" text-anchor="middle">坐标、速度、6D 旋转</text><path class="arrow" d="M340 323L395 323"/><rect x="400" y="272" width="280" height="102" rx="12" fill="#dcefe7"/><text x="540" y="306" class="label" text-anchor="middle">BPPAE</text><text x="540" y="337" class="small" text-anchor="middle">部位运动链 · 周期瓶颈</text><path class="arrow" d="M684 323L737 323"/><rect x="744" y="272" width="284" height="102" rx="12" fill="#f8e9c9"/><text x="886" y="306" class="label" text-anchor="middle">每帧 20 维相位</text><text x="886" y="337" class="small" text-anchor="middle">5 部位 × 2 通道 × 2 坐标</text><text x="55" y="407" class="small" text-anchor="start">每通道的二维坐标为 (A sin 2πS, A cos 2πS)，半径 A 与周期进度 S 可分开改动。</text><rect x="25" y="449" width="1030" height="259" rx="21" fill="white" stroke="#bdd0d4" stroke-width="2"/><text x="54" y="497" class="section" text-anchor="start">B  阶段一：学习能迈出下一帧的全身生成器</text><text x="54" y="532" class="sub" text-anchor="start">相邻真实状态只在这一步进入 CVAE 编码器；下面的 BPMoE 会在阶段二被冻结。</text><rect x="52" y="554" width="280" height="111" rx="12" fill="#dceefa"/><text x="192" y="588" class="label" text-anchor="middle">CVAE 编码器</text><text x="192" y="619" class="small" text-anchor="middle">当前帧 + 真实下一帧</text><text x="192" y="646" class="small" text-anchor="middle">得到 32 维控制量 z</text><path class="arrow" d="M335 609L389 609"/><rect x="396" y="554" width="281" height="111" rx="12" fill="#dcefe7"/><text x="536.5" y="588" class="label" text-anchor="middle">BPMoE · 8 个专家</text><text x="536.5" y="619" class="small" text-anchor="middle">z 与下一相位决定权重</text><text x="536.5" y="646" class="small" text-anchor="middle">结合当前状态产生增量</text><path class="arrow" d="M682 609L736 609"/><rect x="742" y="554" width="286" height="111" rx="12" fill="#f8e9c9"/><text x="885" y="588" class="label" text-anchor="middle">下一帧全身状态</text><text x="885" y="619" class="small" text-anchor="middle">当前状态 + 预测增量</text><text x="885" y="646" class="small" text-anchor="middle">重建、KL 与足部约束</text><rect x="25" y="728" width="1030" height="457" rx="21" fill="white" stroke="#bdd0d4" stroke-width="2"/><text x="54" y="776" class="section" text-anchor="start">C  阶段二与推理：给定终点，逐帧补间</text><text x="54" y="811" class="sub" text-anchor="start">移除 CVAE 编码器，训练控制预测器；推理时不需要真实中间帧。</text><rect x="53" y="834" width="310" height="102" rx="12" fill="#dceefa"/><text x="208" y="868" class="label" text-anchor="middle">风格参考</text><text x="208" y="899" class="small" text-anchor="middle">BPPAE → 部位相位流</text><path class="arrow" d="M366 885L419 885"/><rect x="423" y="834" width="288" height="102" rx="12" fill="#dcefe7"/><text x="567" y="868" class="label" text-anchor="middle">部位融合与时序卷积</text><text x="567" y="899" class="small" text-anchor="middle">参考风格编码 · 512 维</text><rect x="764" y="834" width="264" height="102" rx="12" fill="#dceefa"/><text x="896" y="868" class="label" text-anchor="middle">目标关键帧</text><text x="896" y="899" class="small" text-anchor="middle">另一路已知输入</text><path d="M567 936V951M896 936V951H217" fill="none" stroke="#396073" stroke-width="2.5"/><path class="arrow" d="M217 951V965"/><rect x="53" y="967" width="327" height="115" rx="12" fill="#dcefe7"/><text x="216.5" y="1001" class="label" text-anchor="middle">控制预测器 · LSTM</text><text x="216.5" y="1032" class="small" text-anchor="middle">当前状态、目标状态、风格</text><text x="216.5" y="1059" class="small" text-anchor="middle">解码还读当前可编辑相位</text><path class="arrow" d="M383 1025L435 1025"/><rect x="441" y="967" width="224" height="115" rx="12" fill="#f8e9c9"/><text x="553" y="1001" class="label" text-anchor="middle">这一步的输出</text><text x="553" y="1032" class="small" text-anchor="middle">控制 z 与下一相位</text><text x="553" y="1059" class="small" text-anchor="middle">全身共同使用</text><path class="arrow" d="M668 1025L717 1025"/><rect x="722" y="967" width="306" height="115" rx="12" fill="#dcefe7"/><text x="875" y="1001" class="label" text-anchor="middle">固定 BPMoE</text><text x="875" y="1032" class="small" text-anchor="middle">预测全身状态增量</text><text x="875" y="1059" class="small" text-anchor="middle">下一帧作为新的当前帧</text><text x="55" y="1119" class="small" text-anchor="start">风格编辑：替换选定部位的参考相位流。幅度编辑：缩放 A。节奏编辑：缩放 S。</text><text x="55" y="1153" class="small" text-anchor="start">循环到指定过渡结束。末帧 L1 在训练中拉向目标关键帧，正文没有给出硬投影步骤。</text><rect x="25" y="1206" width="1030" height="244" rx="21" fill="white" stroke="#bdd0d4" stroke-width="2"/><text x="54" y="1254" class="section" text-anchor="start">D  高抬腿实例：回到生成骨架检查控制是否生效</text><text x="54" y="1289" class="sub" text-anchor="start">图 5 可看膝高与峰值时刻；表 5 在 1,197 条过渡中回读生成动作。</text><rect x="54" y="1311" width="277" height="96" rx="12" fill="#dceefa"/><text x="192.5" y="1345" class="label" text-anchor="middle">输入控制</text><text x="192.5" y="1376" class="small" text-anchor="middle">下肢 A 设为 0.5×</text><path class="arrow" d="M335 1359L383 1359"/><rect x="389" y="1311" width="283" height="96" rx="12" fill="#dcefe7"/><text x="530.5" y="1345" class="label" text-anchor="middle">生成 60 帧动作</text><text x="530.5" y="1376" class="small" text-anchor="middle">冻结 BPPAE 回读振幅</text><path class="arrow" d="M676 1359L728 1359"/><rect x="735" y="1311" width="292" height="96" rx="12" fill="#f8e9c9"/><text x="881" y="1345" class="label" text-anchor="middle">配对输出均值</text><text x="881" y="1376" class="small" text-anchor="middle">振幅比 0.932 · 方向 72.8%</text><text x="50" y="1501" class="fine" text-anchor="start">按 Pacific Graphics 2026 正式版图 2–5、式 1–7 及表 5 重绘，D 中统计量来自最终动作。</text></svg>
