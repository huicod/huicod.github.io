<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1405" viewBox="0 0 1080 1405" role="img" aria-labelledby="title desc">
<title id="title">partphase · 总体架构</title>
<desc id="desc">教学重绘依据 · 正式版图 2–5、式 1–7。第 3 步训练预测器时也使用末帧目标、相位与足部损失。</desc>
