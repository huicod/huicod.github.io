<text x="40" y="72" fill="#173b40" font-size="36" font-weight="700" text-anchor="start">MIB-BodyPartPhase · 关键帧之间逐帧补间</text>
<text x="40" y="112" fill="#173b40" font-size="23" font-weight="400" text-anchor="start">部位相位描述“怎样动”，关键帧给出“向哪里去”。</text>
<text x="40" y="32" fill="#19766f" font-size="18" font-weight="700" text-anchor="start">Pacific Graphics 2026   /   动作补间</text>
<text x="108" y="154" fill="#173b40" font-size="19" font-weight="400" text-anchor="start">动作、特征或条件</text>
<text x="430" y="154" fill="#87644b" font-size="19" font-weight="400" text-anchor="start">训练目标或真值</text>
<text x="42" y="220" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">01</text>
<text x="94" y="220" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">先从每个身体部位学习周期坐标</text>
<text x="44" y="254" fill="#476064" font-size="19" font-weight="400" text-anchor="start">BPPAE 先独立训练。它产生可按身体区域编辑的二维相位对。</text>
<rect data-node="x" x="44" y="291" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="322" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">动作窗口</text>
<text x="59" y="351" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">位置、速度、6D 旋转</text>
<rect data-node="enc" x="404" y="291" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="322" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">BPPAE</text>
<text x="419" y="351" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">每区提取振幅 A、进度 S</text>
<text x="419" y="376" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">构造 Θ = A[sin, cos]</text>
<rect data-node="rec" x="764" y="291" width="272" height="99" rx="12" fill="#f4e6dc" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="322" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">动作重建目标</text>
<text x="779" y="351" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">周期解码重建输入</text>
<text x="779" y="376" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">训练后复用相位表示</text>
<text x="360" y="326" text-anchor="middle" class="edge-label" fill="#19766f">分区</text>
<text x="720" y="326" text-anchor="middle" class="edge-label" fill="#866044">预训练</text>
<text x="42" y="482" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">02</text>
<text x="94" y="482" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">用相邻真值帧训练下一帧生成器</text>
<text x="44" y="516" fill="#476064" font-size="19" font-weight="400" text-anchor="start">CVAE 编码器在这里可以看到下一帧；补间时替代它的是下面的控制预测器。</text>
<rect data-node="pair" x="44" y="552" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="583" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">相邻真实状态</text>
<text x="59" y="612" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">Xᵢ、Xᵢ₊₁ → CVAE 编码器</text>
<text x="59" y="637" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">得到 32 维控制量 z</text>
<rect data-node="experts" x="404" y="552" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="583" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">BPMoE 解码器</text>
<text x="419" y="612" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">以 z、Θᵢ₊₁ 调节门控</text>
<text x="419" y="637" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">混合八个专家算增量</text>
<rect data-node="sup" x="764" y="552" width="272" height="99" rx="12" fill="#f4e6dc" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="583" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">下一帧监督</text>
<text x="779" y="612" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">Xᵢ + ΔX 对照真实 Xᵢ₊₁</text>
<text x="779" y="637" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">另有 KL 与足部约束</text>
<text x="360" y="587" text-anchor="middle" class="edge-label" fill="#19766f">z</text>
<text x="720" y="587" text-anchor="middle" class="edge-label" fill="#866044">ΔX</text>
<text x="42" y="749" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">03</text>
<text x="94" y="749" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">给定关键帧与参考风格，循环生成到终点附近</text>
<text x="44" y="783" fill="#476064" font-size="19" font-weight="400" text-anchor="start">同一组相位既可用于提取风格，又可在预测器中表示当前周期进度。八个专家共享全身状态。</text>
<rect data-node="ref" x="44" y="819" width="272" height="99" rx="12" fill="#f6e8ca" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="850" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">风格参考动作</text>
<text x="59" y="879" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">取参考片段的部位相位</text>
<text x="59" y="904" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">可替换选定部位流</text>
<rect data-node="style" x="404" y="819" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="850" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">风格编码器</text>
<text x="419" y="879" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">融合各部位 → 一维卷积</text>
<text x="419" y="904" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">输出 512 维风格码</text>
<rect data-node="kp" x="764" y="819" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="850" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">当前状态与目标帧</text>
<text x="779" y="879" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">当前状态 Xᵢ</text>
<text x="779" y="904" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">未来目标状态 Xⱼ</text>
<rect data-node="ph" x="44" y="997" width="272" height="99" rx="12" fill="#f6e8ca" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="1028" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">当前部位相位 Θᵢ</text>
<text x="59" y="1057" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">可调整选定部位的 A 或 S</text>
<text x="59" y="1082" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">S 为周期进度</text>
<rect data-node="lstm" x="404" y="997" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="1028" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">控制与相位预测器</text>
<text x="419" y="1057" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">LSTM 与预测分支</text>
<text x="419" y="1082" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">给出 z 和下一部位相位</text>
<rect data-node="bpm" x="764" y="997" width="272" height="99" rx="12" fill="#e6efe0" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="1028" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">已训练的 BPMoE</text>
<text x="779" y="1057" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">固定权重，输入当前状态、</text>
<text x="779" y="1082" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">z 与下一部位相位</text>
<rect data-node="next" x="44" y="1179" width="272" height="99" rx="12" fill="#deece7" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="1210" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">下一步的状态／相位</text>
<text x="59" y="1239" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">送回预测器，继续向</text>
<text x="59" y="1264" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">目标关键帧逐帧补间</text>
<rect data-node="out" x="764" y="1179" width="272" height="99" rx="12" fill="#deece7" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="1210" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">全身状态更新</text>
<text x="779" y="1239" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">Xᵢ₊₁ = Xᵢ + ΔX</text>
<text x="779" y="1264" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">写入输出序列</text>
<text x="360" y="855" text-anchor="middle" class="edge-label" fill="#19766f">参考相位</text>
<text x="583" y="965" text-anchor="middle" class="edge-label" fill="#19766f">风格码</text>
<text x="726" y="937" text-anchor="middle" class="edge-label" fill="#19766f">Xᵢ、Xⱼ</text>
<text x="360" y="1034" text-anchor="middle" class="edge-label" fill="#19766f">Θᵢ</text>
<text x="719" y="1034" text-anchor="middle" class="edge-label" fill="#19766f">z、Θᵢ₊₁</text>
<text x="936" y="1145" text-anchor="middle" class="edge-label" fill="#19766f">ΔX</text>
<text x="540" y="1217" text-anchor="middle" class="edge-label" fill="#19766f">下一步 Xᵢ ← Xᵢ₊₁</text>
<text x="370" y="1122" text-anchor="middle" class="edge-label" fill="#19766f">新的 Xᵢ 和 Θᵢ</text>
<text x="40" y="1380" fill="#4a6263" font-size="18" font-weight="400" text-anchor="start">教学重绘依据 · 正式版图 2–5、式 1–7。第 3 步训练预测器时也使用末帧目标、相位与足部损失。</text>
</svg>
