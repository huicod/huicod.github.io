<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2600" viewBox="0 0 1120 2600" role="img" aria-labelledby="title desc">
<title id="title">CtrlCoMo 完整架构教学示意</title>
<desc id="desc">先独立训练身体和手部 Pyramid-VQ，以不同时间分辨率量化残差，并用递减的 CLIP 语义约束帮助分层。生成器共享 Transformer 主干，接受动作文本、语音和可选强度条件，逐 token 从粗到细输出两路离散码，再查表、上采样求和并解码为运动。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#456b73"/></marker><marker id="trainArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#a77b2f"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#203c48}.title{font-size:31px;font-weight:700}.section{font-size:25px;font-weight:700}.name{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:20px;fill:#45677c}.panel{stroke:#ccd9d8;stroke-width:1.5;fill:#fff}.node{stroke:#aac5c6;stroke-width:1.5}.flow{fill:none;stroke:#456b73;stroke-width:2.5;marker-end:url(#arrow)}.train{fill:none;stroke:#a77b2f;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#trainArrow)}</style>
<rect width="1120" height="2600" rx="18" fill="#fafbf9"/>
<text x="34" y="47" class="title" text-anchor="start">CtrlCoMo · 先分层学习，再控制边说话边做动作</text>
<text x="34" y="80" class="small" text-anchor="start">ECCV 2026 · 教学重绘，依据正文图 4–5、§4、式 3–16 和 §5.1</text>
<path d="M40 106 H104" class="flow"/>
<text x="116" y="113" class="small" text-anchor="start">数据流 / 生成流程</text>
<path d="M400 106 H464" class="train"/>
<text x="476" y="113" class="small" text-anchor="start">训练监督 / 训练标签</text>
<text x="772" y="113" class="small" text-anchor="start">浅层与深层是学习倾向</text>
<rect x="24" y="140" width="1072" height="570" rx="14" class="panel" fill="#fff"/>
<text x="44" y="178" class="section" text-anchor="start">01 表示学习 · 身体与手部分别训练一套 Pyramid-VQ</text>
<text x="48" y="209" class="small" text-anchor="start">训练运动 X 按身体 / 手部拆分；两套网络各自学习，不是“动作路 / 手势路”。</text>
<rect x="48" y="235" width="200" height="92" rx="14" class="node" fill="#edf3fa"/>
<text x="64" y="269" class="name" text-anchor="start">身体运动 X</text>
<text x="64" y="301" class="body" text-anchor="start">拟合 SMPL-X</text>
<rect x="290" y="235" width="200" height="92" rx="14" class="node" fill="#e8f3ed"/>
<text x="306" y="269" class="name" text-anchor="start">1D 编码器</text>
<text x="306" y="301" class="body" text-anchor="start">时间压缩 8 倍</text>
<rect x="532" y="235" width="240" height="92" rx="14" class="node" fill="#fff2d7"/>
<text x="548" y="269" class="name" text-anchor="start">Pyramid-VQ</text>
<text x="548" y="301" class="body" text-anchor="start">10 层多尺度离散码</text>
<rect x="814" y="235" width="252" height="92" rx="14" class="node" fill="#e8f3ed"/>
<text x="830" y="269" class="name" text-anchor="start">身体运动解码器</text>
<text x="830" y="301" class="body" text-anchor="start">层级求和 → 重建身体</text>
<path d="M248 281 H290" class="flow"/>
<path d="M490 281 H532" class="flow"/>
<path d="M772 281 H814" class="flow"/>
<rect x="48" y="365" width="200" height="92" rx="14" class="node" fill="#edf3fa"/>
<text x="64" y="399" class="name" text-anchor="start">手部运动 X</text>
<text x="64" y="431" class="body" text-anchor="start">拟合 SMPL-X</text>
<rect x="290" y="365" width="200" height="92" rx="14" class="node" fill="#e8f3ed"/>
<text x="306" y="399" class="name" text-anchor="start">1D 编码器</text>
<text x="306" y="431" class="body" text-anchor="start">时间压缩 8 倍</text>
<rect x="532" y="365" width="240" height="92" rx="14" class="node" fill="#fff2d7"/>
<text x="548" y="399" class="name" text-anchor="start">Pyramid-VQ</text>
<text x="548" y="431" class="body" text-anchor="start">10 层多尺度离散码</text>
<rect x="814" y="365" width="252" height="92" rx="14" class="node" fill="#e8f3ed"/>
<text x="830" y="399" class="name" text-anchor="start">手部运动解码器</text>
<text x="830" y="431" class="body" text-anchor="start">层级求和 → 重建手部</text>
<path d="M248 411 H290" class="flow"/>
<path d="M490 411 H532" class="flow"/>
<path d="M772 411 H814" class="flow"/>
<rect x="48" y="520" width="326" height="112" rx="14" class="node" fill="#edf3fa"/>
<text x="64" y="554" class="name" text-anchor="start">动作描述 → CLIP</text>
<text x="64" y="586" class="body" text-anchor="start">作为表示学习的语义监督</text>
<text x="64" y="615" class="body" text-anchor="start">不要求逐帧动作标签</text>
<rect x="424" y="520" width="642" height="112" rx="14" class="node" fill="#fff2d7"/>
<text x="440" y="554" class="name" text-anchor="start">每层量化特征做时间池化 → 与文本余弦对齐</text>
<text x="440" y="586" class="body" text-anchor="start">λd = (1 − d / L)²：浅层较强，第 10 层为 0</text>
<text x="440" y="615" class="body" text-anchor="start">对两套 tokenizer 的各层施加递减约束</text>
<path d="M374 576 H424" class="train"/>
<path d="M652 457 V488 H745 V520" class="train"/>
<path d="M745 520 V488 H790 V345 H652 V327" class="train"/>
<text x="48" y="676" class="body" text-anchor="start">训练目标：重建损失 + 各层 commitment + 逐层语义损失；码本用 EMA 更新。</text>
<rect x="24" y="740" width="1072" height="540" rx="14" class="panel" fill="#fff"/>
<text x="44" y="778" class="section" text-anchor="start">02 放大看一层 · 对剩余残差降采样、量化，再还原到统一长度</text>
<text x="48" y="810" class="small" text-anchor="start">两套 Pyramid-VQ 都使用以下流程；初始残差 R¹ = 编码特征 Z。</text>
<rect x="48" y="844" width="225" height="114" rx="14" class="node" fill="#edf3fa"/>
<text x="64" y="878" class="name" text-anchor="start">当前残差 Rᵈ</text>
<text x="64" y="910" class="body" text-anchor="start">下采样至 T_d</text>
<text x="64" y="939" class="body" text-anchor="start">线性时间插值</text>
<rect x="315" y="844" width="225" height="114" rx="14" class="node" fill="#fff2d7"/>
<text x="331" y="878" class="name" text-anchor="start">本层码本查表</text>
<text x="331" y="910" class="body" text-anchor="start">最近邻量化</text>
<text x="331" y="939" class="body" text-anchor="start">得到 Z̄ᵈ</text>
<rect x="582" y="844" width="225" height="114" rx="14" class="node" fill="#e8f3ed"/>
<text x="598" y="878" class="name" text-anchor="start">上采样回 T</text>
<text x="598" y="910" class="body" text-anchor="start">恢复共同时间长度</text>
<text x="598" y="939" class="body" text-anchor="start">得到本层贡献 Ẑᵈ</text>
<rect x="849" y="844" width="217" height="114" rx="14" class="node" fill="#edf3fa"/>
<text x="865" y="878" class="name" text-anchor="start">本层输出</text>
<text x="865" y="910" class="body" text-anchor="start">离散编号供 AR 学习</text>
<text x="865" y="939" class="body" text-anchor="start">Ẑᵈ 用于残差更新</text>
<path d="M273 901 H315" class="flow"/>
<path d="M540 901 H582" class="flow"/>
<path d="M807 901 H849" class="flow"/>
<rect x="48" y="1024" width="310" height="110" rx="14" class="node" fill="#fff2d7"/>
<text x="64" y="1058" class="name" text-anchor="start">残差减去本层贡献</text>
<text x="64" y="1090" class="body" text-anchor="start">Rᵈ⁺¹ = Rᵈ − Ẑᵈ</text>
<text x="64" y="1119" class="body" text-anchor="start">后续层逐渐细化时间尺度</text>
<rect x="410" y="1024" width="330" height="110" rx="14" class="node" fill="#e8f3ed"/>
<text x="426" y="1058" class="name" text-anchor="start">所有层贡献逐项相加</text>
<text x="426" y="1090" class="body" text-anchor="start">Ẑ = Ẑ¹ + Ẑ² + … + Ẑ¹⁰</text>
<text x="426" y="1119" class="body" text-anchor="start">相加发生在潜表示空间</text>
<rect x="792" y="1024" width="274" height="110" rx="14" class="node" fill="#edf3fa"/>
<text x="808" y="1058" class="name" text-anchor="start">运动 Decoder</text>
<text x="808" y="1090" class="body" text-anchor="start">将累加潜表示解码</text>
<text x="808" y="1119" class="body" text-anchor="start">恢复该路连续运动</text>
<path d="M953 958 V989 H203 V1024" class="flow"/>
<path d="M695 958 V1000 H575 V1024" class="flow"/>
<path d="M740 1079 H792" class="flow"/>
<path d="M48 1079 H34 V825 H160 V844" class="flow"/>
<text x="48" y="1180" class="body" text-anchor="start">176 帧 → T = 22；10 层时间长度：2、2、3、4、5、6、7、8、11、22。</text>
<text x="48" y="1213" class="body" text-anchor="start">码本：512、512、256、256、128、128、64、64、32、32；潜特征维度 512。</text>
<text x="48" y="1246" class="small" text-anchor="start">粗层倾向承载动作结构，细层补充局部细节；不等于完全可分离的动作标签。</text>
<rect x="24" y="1310" width="1072" height="1190" rx="14" class="panel" fill="#fff"/>
<text x="44" y="1350" class="section" text-anchor="start">03 条件生成 · 共享主干，双路输出，从粗到细逐 token 预测</text>
<rect x="48" y="1380" width="1018" height="156" rx="14" class="node" fill="#fff9ec"/>
<text x="66" y="1412" class="name" text-anchor="start">训练时：由目标动作计算手势强度标签，不是推理时额外需要的输入</text>
<text x="66" y="1450" class="body" text-anchor="start">前 5 层重建误差 E₅ − 全 10 层重建误差 E₁₀ → 缩放到 [0, 1]</text>
<text x="66" y="1484" class="body" text-anchor="start">E_l = ‖X − X̂⁽ˡ⁾‖²；以 p = 0.35 随机丢弃强度条件，学习可省略的控制。</text>
<text x="66" y="1517" class="small" text-anchor="start">训练的层级目标 token 来自已训练的两套 tokenizer；运动 decoder 在生成端复用。</text>
<rect x="48" y="1590" width="300" height="120" rx="14" class="node" fill="#edf3fa"/>
<text x="64" y="1624" class="name" text-anchor="start">动作描述文本</text>
<text x="64" y="1656" class="body" text-anchor="start">例如：打开盒子并解释</text>
<text x="64" y="1685" class="body" text-anchor="start">CLIP 文本特征</text>
<rect x="408" y="1590" width="300" height="120" rx="14" class="node" fill="#edf3fa"/>
<text x="424" y="1624" class="name" text-anchor="start">语音音频</text>
<text x="424" y="1656" class="body" text-anchor="start">提供伴随讲话的条件</text>
<text x="424" y="1685" class="body" text-anchor="start">MFCC 音频特征</text>
<rect x="768" y="1590" width="298" height="120" rx="14" class="node" fill="#fff2d7"/>
<text x="784" y="1624" class="name" text-anchor="start">用户强度（可选）</text>
<text x="784" y="1656" class="body" text-anchor="start">可调节的强度标量 α</text>
<text x="784" y="1685" class="body" text-anchor="start">省略时使用学习的先验</text>
<text x="48" y="1570" class="small" text-anchor="start">推理主线：文本、音频、可选强度 → tokens → 查码重建 → 运动</text>
<rect x="230" y="1810" width="650" height="186" rx="14" class="node" fill="#e8f3ed"/>
<text x="246" y="1844" class="name" text-anchor="start">共享的 12 层自回归 Transformer</text>
<text x="246" y="1876" class="body" text-anchor="start">文本 + 音频：cross-attention 条件</text>
<text x="246" y="1905" class="body" text-anchor="start">强度标量：AdaLN-Zero 调制</text>
<text x="246" y="1934" class="body" text-anchor="start">因果顺序：先粗层，后细层；层内逐 token</text>
<path d="M198 1710 V1776 H414 V1810" class="flow"/>
<path d="M558 1710 V1810" class="flow"/>
<path d="M917 1710 V1894 H880" class="flow"/>
<text x="908" y="1853" class="small" text-anchor="start">AdaLN</text>
<path d="M1044 1536 V1560 H1080 V1927 H880" class="train"/>
<rect x="48" y="1810" width="152" height="186" rx="14" class="node" fill="#edf3fa"/>
<text x="64" y="1844" class="name" text-anchor="start">历史 tokens</text>
<text x="64" y="1876" class="body" text-anchor="start">前面层级</text>
<text x="64" y="1905" class="body" text-anchor="start">+ 本层前面</text>
<text x="64" y="1934" class="body" text-anchor="start">已生成位置</text>
<text x="64" y="1963" class="body" text-anchor="start">因果上下文</text>
<path d="M200 1903 H230" class="flow"/>
<rect x="108" y="2052" width="400" height="92" rx="14" class="node" fill="#fff2d7"/>
<text x="124" y="2086" class="name" text-anchor="start">身体卷积输出头</text>
<text x="124" y="2118" class="body" text-anchor="start">预测对应层的 body token</text>
<rect x="612" y="2052" width="400" height="92" rx="14" class="node" fill="#fff2d7"/>
<text x="628" y="2086" class="name" text-anchor="start">手部卷积输出头</text>
<text x="628" y="2118" class="body" text-anchor="start">预测对应层的 hand token</text>
<path d="M430 1996 V2024 H308 V2052" class="flow"/>
<path d="M680 1996 V2024 H812 V2052" class="flow"/>
<path d="M308 2144 V2172 H34 V2022 H124 V1996" class="flow"/>
<path d="M812 2144 V2172 H308" class="flow"/>
<text x="143" y="2029" class="small" text-anchor="start">继续预测后续位置</text>
<rect x="108" y="2210" width="400" height="128" rx="14" class="node" fill="#e8f3ed"/>
<text x="124" y="2244" class="name" text-anchor="start">身体运动重建</text>
<text x="124" y="2276" class="body" text-anchor="start">层级 token 查各层码本</text>
<text x="124" y="2305" class="body" text-anchor="start">上采样 → 潜表示求和</text>
<text x="124" y="2334" class="body" text-anchor="start">复用身体 Decoder</text>
<rect x="612" y="2210" width="400" height="128" rx="14" class="node" fill="#e8f3ed"/>
<text x="628" y="2244" class="name" text-anchor="start">手部运动重建</text>
<text x="628" y="2276" class="body" text-anchor="start">层级 token 查各层码本</text>
<text x="628" y="2305" class="body" text-anchor="start">上采样 → 潜表示求和</text>
<text x="628" y="2334" class="body" text-anchor="start">复用手部 Decoder</text>
<path d="M308 2144 V2210" class="flow"/>
<path d="M812 2144 V2210" class="flow"/>
<rect x="278" y="2390" width="565" height="78" rx="14" class="node" fill="#edf3fa"/>
<text x="294" y="2424" class="name" text-anchor="start">组合身体与手部 → 连续 co-speech 运动</text>
<path d="M308 2338 V2364 H420 V2390" class="flow"/>
<path d="M812 2338 V2364 H700 V2390" class="flow"/>
<text x="40" y="2545" class="small" text-anchor="start">边界：强度改变生成条件；没有指定关节 / 物体接触的硬约束，也不保证完全语义解耦。</text>
<text x="40" y="2580" class="small" text-anchor="start">源文图 4–5、§4.1–4.2、式 3–16、§5.1 · 本图为机制教学示意，并非模型运行结果。</text>
</svg>
