<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1090" viewBox="0 0 840 1090" role="img" aria-labelledby="title desc">
  <title id="title">Light-T2M 如何在动作帧与压缩片段之间去噪</title>
  <desc id="desc">训练从加噪的真实动作出发，推理从给定长度的高斯噪声出发。扩散时刻放在帧列首位，冻结 CLIP 提供独立的句向量。四个块依次执行局部卷积、片段级文本注入与伪双向 Mamba 扫描、上采样融合和第二次局部卷积。去噪器预测干净动作，训练比较干净动作目标，推理通过十步 UniPC 得到整段动作。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#23343d}
      .title{font-size:29px;font-weight:700}.subtitle{font-size:17px;fill:#465a62}
      .heading{font-size:22px;font-weight:700}.label{font-size:18px;font-weight:700}
      .body{font-size:16px}.note{font-size:15px;fill:#445963}.em{fill:#254f72;font-weight:700}
      .box{stroke:#a6b7be;stroke-width:1.3;fill:#fff}
      .local{stroke:#97b5c9;stroke-width:1.3;fill:#e9f1f7}
      .segments{stroke:#b5a2c6;stroke-width:1.3;fill:#f2edf7}
      .condition{stroke:#94b9ac;stroke-width:1.3;fill:#e9f4ee}
      .result{stroke:#c6aa76;stroke-width:1.3;fill:#faf2dc}
      .line,.join,.condLine{fill:none;stroke:#526872;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
      .line{marker-end:url(#arrow)}.condLine{stroke:#55806f;stroke-dasharray:6 5;marker-end:url(#condArrow)}
    </style>
    <marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526872"/></marker>
    <marker id="condArrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#55806f"/></marker>
  </defs>
  <rect width="840" height="1090" rx="16" fill="#fcfcfa"/>
  <text x="25" y="41" class="title">Light-T2M 怎样给整段动作去噪？</text>
  <text x="26" y="73" class="subtitle">蓝色沿原帧率处理动作，紫色处理压缩片段，绿色虚线传递全句文本条件。</text>

  <rect x="16" y="94" width="808" height="208" rx="14" fill="#f4f7f6" stroke="#c8d4cf"/>
  <text x="35" y="127" class="heading">输入　同一套去噪器接收动作、扩散时刻和文本</text>
  <rect x="34" y="147" width="426" height="134" rx="11" class="box"/>
  <text x="50" y="177" class="label">带噪动作 Mₜ 与扩散时刻 t</text>
  <text x="50" y="204" class="body">训练时按 t 给真实动作加噪。</text>
  <text x="50" y="229" class="body">推理从给定长度的整段高斯噪声开始。</text>
  <text x="50" y="258" class="body em">时间令牌放在动作帧列首位，加入位置编码。</text>
  <rect x="478" y="147" width="328" height="134" rx="11" class="condition"/>
  <text x="494" y="177" class="label">动作描述 → 冻结的 CLIP</text>
  <text x="494" y="204" class="body">提取整句向量，再投影至 256 维。</text>
  <text x="494" y="229" class="body">训练时有 20% 概率置空文本条件。</text>
  <text x="494" y="258" class="body">这条条件支路送往每个块的 ATII。</text>

  <rect x="16" y="321" width="808" height="479" rx="14" fill="#f7f7fa" stroke="#c7c8d2"/>
  <text x="35" y="356" class="heading">去噪主干　串联 4 个同结构的块，下面展开其中一个</text>
  <path class="line" d="M186 281V307H24V412H43"/>
  <path class="condLine" d="M786 281H815V510H798"/>
  <rect x="46" y="380" width="748" height="66" rx="10" class="local"/>
  <text x="64" y="406" class="label">局部建模 LIMM ①</text>
  <text x="64" y="431" class="body">逐点卷积混合通道，深度时间卷积交换相邻帧信息。保留逐帧特征供后面融合。</text>
  <path class="line" d="M220 446V471"/>
  <text x="462" y="466" class="note">全局模块包含分段、注入、扫描与上采样融合。</text>
  <rect x="46" y="474" width="331" height="81" rx="10" class="segments"/>
  <text x="63" y="502" class="label">动作帧 → 片段</text>
  <text x="63" y="530" class="body">抽出时间令牌，每 8 帧压为 1 个片段。</text>
  <path class="line" d="M377 514H439"/>
  <rect x="443" y="474" width="351" height="81" rx="10" class="condition"/>
  <text x="460" y="502" class="label">逐段文本注入 ATII</text>
  <text x="460" y="530" class="body">片段与句向量算通道门，再融合文本。</text>
  <path class="line" d="M611 555V577"/>
  <rect x="46" y="580" width="748" height="96" rx="10" class="segments"/>
  <text x="64" y="608" class="label">伪双向扫描　把「倒序片段 + 正序片段」送入同一个 Mamba</text>
  <text x="64" y="635" class="body">例如 3 个片段按 ③ ② ① ｜ ① ② ③ 从左到右扫一次，只取竖线右侧的输出。</text>
  <text x="64" y="660" class="note">正序的第一个片段也能读取倒序前缀积累的上下文。扫描的元素都是已注入文本的动作片段。</text>
  <path class="line" d="M219 676V696"/>
  <rect x="46" y="700" width="401" height="75" rx="10" class="segments"/>
  <text x="63" y="728" class="label">重复上采样 → 与原帧率特征融合</text>
  <text x="63" y="753" class="body">每段输出重复 8 次，裁去填充，接回时间令牌。</text>
  <path class="line" d="M447 738H488"/>
  <rect x="492" y="700" width="302" height="75" rx="10" class="local"/>
  <text x="510" y="728" class="label">局部建模 LIMM ②</text>
  <text x="510" y="753" class="body">在恢复的帧率上再次聚合邻帧。</text>

  <path class="line" d="M642 775V808H421V829"/>
  <rect x="46" y="832" width="748" height="54" rx="10" class="result"/>
  <text x="64" y="865" class="label">第 4 个块结束后，移去时间令牌，逐帧线性投影得到干净动作估计。</text>
  <path class="join" d="M420 887V904"/>
  <path class="line" d="M420 904H218V921"/>
  <path class="line" d="M420 904H627V921"/>
  <rect x="31" y="925" width="363" height="100" rx="11" class="box"/>
  <text x="48" y="954" class="label">训练　比较干净动作</text>
  <text x="48" y="982" class="body">在有效帧上计算预测与真实 M₀ 的均方误差，</text>
  <text x="48" y="1007" class="body">更新去噪网络。训练噪声日程为 1000 步。</text>
  <rect x="411" y="925" width="397" height="100" rx="11" class="result"/>
  <text x="428" y="954" class="label">推理　用 UniPC 迭代 10 步</text>
  <text x="428" y="982" class="body">合并有文本与空文本的预测引导下一步更新，</text>
  <text x="428" y="1007" class="body">重复调用同一去噪器，得到整段动作特征。</text>
  <text x="28" y="1060" class="note">本站据原文图 2–4、§3.2–3.5、附录 B 与公开实现绘制。片段编号为教学示意。</text>
</svg>
