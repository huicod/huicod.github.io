<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1750" viewBox="0 0 1440 1750" role="img" aria-labelledby="title desc">
<title id="title">TSG：从时间规范到注意力干预，再独立检查解码视频</title>
<desc id="desc">提示与MTL规范准备概念token和latent时间区间。同一个噪声latent经过参考、普通条件和注意力引导三条共享冻结Transformer的预测分支。引导分支逐层将注意力时间曲线转换为规范评分，只对断开的曲线求导，产生logit偏置。预测残差与CFG组合后更新latent，最后由VAE解码。独立评测对21个解码帧用Qwen检测命题，再用布尔MTL判断。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#465b70"/></marker>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:22px;fill:#203447}.title{font-size:30px;font-weight:700}.section{font-size:25px;font-weight:700}.head{font-size:23px;font-weight:700}.small{font-size:19px}.tiny{font-size:17px}.muted{fill:#596d80}.panel{fill:#f7f9fc;stroke:#cbd6e1;stroke-width:1.5;rx:17}.box{fill:#fff;stroke:#a6b8c9;stroke-width:1.5;rx:12}.frozen{fill:#edf1f5;stroke:#a6b6c4}.spec{fill:#f1eafa;stroke:#b6a0cf}.score{fill:#e7f5ee;stroke:#7aa993}.sample{fill:#eaf2ff;stroke:#80a5d8}.eval{fill:#fff3df;stroke:#c6a36c}.arr{fill:none;stroke:#465b70;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#71869a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style></defs><rect width="1440" height="1750" fill="white"/>
<text x="32" y="43" class="title">TSG：时间要求 → 局部注意力干预 → 视频生成 → 独立评测</text>
<text x="32" y="76" class="small muted">教学重绘 · arXiv:2610.20822v1 图2、§4、附录B–E · 模型权重冻结，无新增训练</text>
<rect x="25" y="100" width="1390" height="240" class="panel"/>
<text x="46" y="136" class="section">A　准备条件：文字描述与显式时间规范分别承担内容和时序要求</text>
<rect x="55" y="168" width="390" height="118" class="box spec"/>
<text x="71" y="200" class="head">文字 p ＋ MTL 规范 φ</text>
<text x="71" y="231" class="small">如：狗依次站立、坐下、躺下</text>
<text x="71" y="259" class="small">规范由用户提供或辅助整理</text>
<rect x="500" y="168" width="445" height="118" class="box spec"/>
<text x="516" y="200" class="head">概念与时间映射</text>
<text x="516" y="231" class="small">概念 → 提示token集合 P_c</text>
<text x="516" y="259" class="small">规范区间 → latent 时间网格</text>
<rect x="1000" y="168" width="380" height="118" class="box sample"/>
<text x="1016" y="200" class="head">采样初始状态</text>
<text x="1016" y="231" class="small">高斯噪声 z_N → 当前 z_k</text>
<text x="1016" y="259" class="small">预训练文本编码器与视频模型</text>
<path d="M445 227H500" class="arr"/>
<text x="55" y="317" class="small muted">基准采用人工模板＋LLM协助实例化；规范并非自动提供关节、空间目标或物理约束。</text>
<rect x="25" y="365" width="1390" height="750" class="panel"/>
<text x="46" y="401" class="section">B　每个引导步：三路共享同一冻结 Transformer；额外条件分支逐层干预</text>
<rect x="55" y="435" width="365" height="118" class="box frozen"/>
<text x="71" y="467" class="head">参考提示前向 → d_u</text>
<text x="71" y="498" class="small">当前 z_k ＋ 空/负提示</text>
<text x="71" y="526" class="small">无注意力干预</text>
<rect x="55" y="625" width="365" height="118" class="box frozen"/>
<text x="71" y="657" class="head">普通条件前向 → d_c</text>
<text x="71" y="688" class="small">当前 z_k ＋ 文字 p</text>
<text x="71" y="716" class="small">无注意力干预</text>
<rect x="55" y="838" width="365" height="118" class="box sample"/>
<text x="71" y="870" class="head">普通 CFG 方向</text>
<text x="71" y="901" class="small">d_cfg = d_u</text>
<text x="71" y="929" class="small">＋ λ_cfg(d_c − d_u)</text>
<path d="M238 553V585H40V897H55" class="arr"/>
<path d="M238 743V838" class="arr"/>
<rect x="475" y="425" width="905" height="575" class="box frozen"/>
<text x="500" y="463" class="head">额外条件前向：从相同 z_k、文字 p 开始</text>
<rect x="505" y="495" width="390" height="126" class="box score"/>
<text x="521" y="527" class="head">当前层 / 当前注意力头</text>
<text x="521" y="558" class="small">A → 空间平均的概念时间曲线 a</text>
<text x="521" y="586" class="small">校准为软证据 p(t,c)</text>
<text x="521" y="614" class="small">断开主干图，只保留曲线梯度</text>
<rect x="945" y="495" width="400" height="126" class="box score"/>
<text x="961" y="527" class="head">可微 MTL 评分 S</text>
<text x="961" y="558" class="small">读取规范 φ 与当前概念轨迹</text>
<text x="961" y="586" class="small">log 域和–积 / 时间窗口聚合</text>
<text x="961" y="614" class="small">计算局部梯度 g = ∂S/∂a</text>
<path d="M895 558H945" class="arr"/>
<rect x="505" y="690" width="840" height="124" class="box score"/>
<text x="521" y="722" class="head">梯度 → 偏置 → 当前层输出</text>
<text x="521" y="753" class="small">归一化、广播到query/token、居中并裁剪；L′ = L ＋ B</text>
<text x="521" y="781" class="small">B断开梯度，当前层使用新注意力；后续层接收已改变的表示</text>
<text x="521" y="809" class="small">不对 Transformer 权重或整个 latent 计算图反向传播</text>
<path d="M1145 621V655H925V690" class="dash"/>
<path d="M1345 752H1362V478H695V495" class="dash"/>
<text x="1060" y="670" class="small">梯度转为偏置</text>
<text x="1010" y="845" class="small muted">下一层重新提取证据并干预</text>
<rect x="760" y="885" width="585" height="84" class="box frozen"/>
<text x="776" y="917" class="head">所有选定层完成 → d_φ</text>
<text x="776" y="948" class="small">单次额外条件前向的最终预测</text>
<path d="M925 814V868H1052V885" class="arr"/>
<text x="55" y="1039" class="small muted">规范分数不是概率；注意力不是真实概念检测，局部评分改善不构成最终视频满足保证。</text>
<text x="55" y="1080" class="small muted">主实验：最初15步启用TSG，所有注意力层/头参与；此后仅保留CFG。</text>
<rect x="25" y="1140" width="1390" height="245" class="panel"/>
<text x="46" y="1176" class="section">C　组合预测并更新：规范残差补充 CFG，而非替代整个采样器</text>
<rect x="55" y="1210" width="610" height="116" class="box sample"/>
<text x="71" y="1242" class="head">按范数匹配引导残差</text>
<text x="71" y="1273" class="small">d_tsg = d_cfg ＋ λ_tsg(d_φ − d_c)</text>
<text x="71" y="1301" class="small">ρ=1：规范残差与CFG条件贡献等范数</text>
<rect x="720" y="1210" width="300" height="116" class="box sample"/>
<text x="736" y="1242" class="head">采样器更新一次</text>
<text x="736" y="1273" class="small">Step(z_k, d_tsg)</text>
<text x="736" y="1301" class="small">迭代到最终 z_0</text>
<rect x="1075" y="1210" width="305" height="116" class="box frozen"/>
<text x="1091" y="1242" class="head">冻结 VAE 解码</text>
<text x="1091" y="1273" class="small">z_0 → RGB 视频</text>
<text x="1091" y="1301" class="small">未生成3D骨骼动作</text>
<path d="M665 1268H720" class="arr"/>
<path d="M1020 1268H1075" class="arr"/>
<path d="M238 956V980H40V1268H55" class="arr"/>
<path d="M1345 927H1400V1195H520V1210" class="arr"/>
<text x="720" y="1360" class="small muted">循环只在生成内部；下方评测不反馈到采样。</text>
<rect x="25" y="1410" width="1390" height="220" class="panel"/>
<text x="46" y="1446" class="section">D　生成后评测：检查解码画面，不用引导注意力自证成功</text>
<rect x="55" y="1477" width="365" height="112" class="box eval"/>
<text x="71" y="1509" class="head">均匀抽取21个解码帧</text>
<text x="71" y="1540" class="small">Qwen2.5-VL逐帧识别概念</text>
<text x="71" y="1568" class="small">看当前图，不看目标时间表</text>
<rect x="475" y="1477" width="420" height="112" class="box eval"/>
<text x="491" y="1509" class="head">命题轨迹 → 布尔MTL</text>
<text x="491" y="1540" class="small">检查顺序、持续与排他条件</text>
<text x="491" y="1568" class="small">多数阶段要求≥0.5秒见证</text>
<rect x="950" y="1477" width="430" height="112" class="box eval"/>
<text x="966" y="1509" class="head">整段规范通过 / 失败</text>
<text x="966" y="1540" class="small">识别和稀疏采样仍有误差</text>
<text x="966" y="1568" class="small">另测画质、延迟与峰值显存</text>
<path d="M420 1533H475" class="arr"/>
<path d="M895 1533H950" class="arr"/>
<path d="M1228 1326V1398H40V1533H55" class="dash"/>
<text x="32" y="1670" class="small muted">图例：紫色为规范/输入；灰色为冻结模型；绿色为局部评分和干预；蓝色为采样；橙色为独立评测。</text>
<text x="32" y="1705" class="small muted">实线为主要数据流；虚线为层间重复或评测分支。公式简化省略采样步下标，细节以正文为准。</text>
<text x="32" y="1737" class="small muted">有规范 ≠ 有准确视觉证据 ≠ 生成必然满足；Temporal Acc.逐帧指标也不等于整段 Sat Acc.。</text>
</svg>
