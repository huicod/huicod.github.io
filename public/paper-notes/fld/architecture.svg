<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1470" viewBox="0 0 1360 1470" role="img" aria-labelledby="title desc">
<title id="title">FLD：从周期表示到物理跟踪及在线回退</title>
<desc id="desc">三个阶段展示FLD表示训练、冻结表示后的PPO物理策略训练、在线输入接受或回退。潜在参数不直接产生物理动作，最终需要策略输出目标关节位置，经PD控制和环境执行。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#4d6575"/></marker>
<marker id="dashArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#8a7cad"/></marker>
<style>
text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183341}
.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#546a75}.paneltitle{font-size:23px;font-weight:700}
.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:17px;fill:#405a68}
.box{stroke-width:1.5;rx:12}.a{fill:#fff;stroke:#6098b4}.b{fill:#fff;stroke:#6b9b81}.c{fill:#fff;stroke:#c69a5b}
.edge{fill:none;stroke:#4d6575;stroke-width:2.3;marker-end:url(#arrow)}
.dash{fill:none;stroke:#8a7cad;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#dashArrow)}
</style></defs>
<rect width="1360" height="1470" fill="#fff"/>
<text x="32" y="42" class="title">FLD｜相位负责推进，连续参数选择运动，策略负责执行</text>
<text x="32" y="73" class="sub">教学示意 · 依据 ICLR 2024 正式论文图1–3、图S12 · 在线回退按论文算法绘制</text>

<rect x="20" y="96" width="1320" height="400" rx="18" fill="#eff6fa" stroke="#c9dce7"/>
<text x="40" y="133" class="paneltitle">A · 表示训练：同一组参数必须同时解释当前窗口与未来窗口</text>
<rect x="40" y="192" width="210" height="104" class="box a"/>
<text x="59" y="224" class="head">机器人状态窗口</text>
<text x="59" y="253" class="body">27维 × 51帧</text>
<text x="59" y="279" class="small">v、ω、g、18个关节角</text>
<rect x="290" y="192" width="210" height="104" class="box a"/>
<text x="310" y="224" class="head">卷积编码器</text>
<text x="310" y="253" class="body">可训练 · 全身时序混合</text>
<text x="310" y="279" class="small">输出8 × 51潜在序列</text>
<rect x="550" y="167" width="220" height="86" class="box a"/>
<text x="570" y="198" class="head">可微 FFT</text>
<text x="570" y="230" class="body">频率f、幅度a、偏置b</text>
<rect x="550" y="281" width="220" height="86" class="box a"/>
<text x="570" y="313" class="head">线性层 + Atan2</text>
<text x="570" y="345" class="body">独立提取8维相位φ</text>
<rect x="820" y="216" width="210" height="108" class="box a"/>
<text x="839" y="247" class="head">推进潜在动力学</text>
<text x="839" y="277" class="body">φ′ = φ + i f Δt</text>
<text x="839" y="305" class="small">固定θ=(f,a,b)，i=0…N</text>
<rect x="1080" y="216" width="235" height="108" class="box a"/>
<text x="1099" y="247" class="head">正弦重建 → 解码器</text>
<text x="1099" y="277" class="body">可训练卷积解码器</text>
<text x="1099" y="305" class="small">输出当前 / 未来27维窗口</text>
<path d="M250 244H290" class="edge"/>
<path d="M500 244H524V210H550" class="edge"/>
<path d="M524 244V324H550" class="edge"/>
<path d="M770 210H794V247H820" class="edge"/>
<path d="M770 324H794V292H820" class="edge"/>
<path d="M1030 270H1080" class="edge"/>
<text x="783" y="191" class="small">θ</text><text x="782" y="352" class="small">φ</text>
<rect x="40" y="411" width="340" height="57" class="box a"/>
<text x="58" y="447" class="body">原始轨迹提供 sₜ、sₜ₊₁ … sₜ₊ᴺ</text>
<rect x="550" y="411" width="650" height="57" class="box a"/>
<text x="575" y="447" class="body">训练目标：Σ αⁱ MSE（预测窗口，真实窗口）</text>
<path d="M380 439H550" class="dash"/>
<path d="M1196 324V411" class="dash"/>
<text x="550" y="389" class="small">当前重建 + 未来预测，共同监督编码器与解码器</text>

<rect x="20" y="518" width="1320" height="410" rx="18" fill="#eff8f2" stroke="#c9dfd0"/>
<text x="40" y="555" class="paneltitle">B · 物理策略训练：冻结 FLD，以生成的参考状态训练 PPO</text>
<rect x="40" y="609" width="235" height="104" class="box b"/>
<text x="58" y="641" class="head">技能采样器</text>
<text x="58" y="671" class="body">θ + 随机初始φ</text>
<text x="58" y="697" class="small">四种采样器（含ALPGMM）</text>
<rect x="325" y="609" width="230" height="104" class="box b"/>
<text x="344" y="641" class="head">潜在目标状态 φ, θ</text>
<text x="344" y="671" class="body">每步推进φ，回合内固定θ</text>
<text x="344" y="697" class="small">可继续生成参考序列</text>
<rect x="635" y="609" width="235" height="104" class="box b"/>
<text x="655" y="641" class="head">控制策略 π</text>
<text x="655" y="671" class="body">本体状态 + 潜在目标</text>
<text x="655" y="697" class="small">可训练；输出18维目标角</text>
<rect x="950" y="609" width="365" height="104" class="box b"/>
<text x="970" y="641" class="head">PD控制 → 物理仿真</text>
<text x="970" y="671" class="body">MIT Humanoid · Isaac Gym</text>
<text x="970" y="697" class="small">驱动与动力学决定真实运动</text>
<path d="M275 661H325" class="edge"/>
<path d="M555 661H635" class="edge"/>
<path d="M870 661H950" class="edge"/>
<text x="878" y="644" class="small">动作</text>
<path d="M1130 609V582H755V609" class="edge"/>
<text x="910" y="576" class="small">测得本体状态反馈</text>
<rect x="325" y="773" width="230" height="92" class="box b"/>
<text x="344" y="805" class="head">正弦 + 冻结解码器</text>
<text x="344" y="837" class="body">27维参考状态 ŝₜ</text>
<rect x="635" y="773" width="235" height="92" class="box b"/>
<text x="655" y="805" class="head">跟踪奖励 + 正则</text>
<text x="655" y="837" class="body">参考 ŝₜ 对比实际 sₜ</text>
<path d="M440 713V773" class="edge"/>
<path d="M555 819H635" class="edge"/>
<path d="M1130 713V819H870" class="edge"/>
<path d="M753 773V713" class="dash"/>
<text x="773" y="748" class="small">PPO更新</text>
<path d="M753 865V900H158V713" class="dash"/>
<text x="220" y="894" class="small">仅自适应采样：跟踪表现 → 学习进展 → 更新 ALPGMM</text>
<path d="M40 496V518" class="dash"/>
<text x="60" y="513" class="small">复用已训练的表示模型</text>

<rect x="20" y="950" width="1320" height="434" rx="18" fill="#fff7ea" stroke="#e4d4b6"/>
<text x="40" y="987" class="paneltitle">C · 在线跟踪与回退：检查新目标，接受新编码或延续旧动作</text>
<rect x="40" y="1032" width="230" height="100" class="box c"/>
<text x="59" y="1064" class="head">用户参考动作流</text>
<text x="59" y="1094" class="body">最近若干状态窗口缓存</text>
<text x="59" y="1120" class="small">不是文本 / 音乐指令</text>
<rect x="320" y="1032" width="260" height="100" class="box c"/>
<text x="338" y="1064" class="head">FLD动态一致性检查</text>
<text x="338" y="1094" class="body">编码、预测并计算损失 L</text>
<text x="338" y="1120" class="small">用训练统计阈值ε判断</text>
<rect x="645" y="1020" width="280" height="74" class="box c"/>
<text x="663" y="1049" class="head">接受：编码最新窗口</text>
<text x="663" y="1077" class="body">更新φ与θ</text>
<rect x="645" y="1132" width="280" height="88" class="box c"/>
<text x="663" y="1163" class="head">拒绝 / 无输入：回退</text>
<text x="663" y="1194" class="body">旧θ不变，φ继续推进</text>
<rect x="1015" y="1068" width="300" height="110" class="box c"/>
<text x="1035" y="1100" class="head">本步选择的潜在目标</text>
<text x="1035" y="1131" class="body">φ 与 θ=(f,a,b)</text>
<text x="1035" y="1158" class="small">回退不等于完成被拒绝动作</text>
<path d="M270 1082H320" class="edge"/>
<path d="M580 1060H645" class="edge"/>
<text x="590" y="1040" class="small">L &lt; ε</text>
<path d="M580 1106H611V1175H645" class="edge"/>
<text x="587" y="1143" class="small">L ≥ ε</text>
<path d="M925 1057H970V1102H1015" class="edge"/>
<path d="M925 1176H970V1146H1015" class="edge"/>
<rect x="1015" y="1264" width="300" height="83" class="box c"/>
<text x="1035" y="1297" class="head">冻结策略 π → 18维目标角</text>
<text x="1035" y="1327" class="body">在线策略50 Hz</text>
<rect x="645" y="1264" width="280" height="83" class="box c"/>
<text x="665" y="1297" class="head">PD控制与物理执行</text>
<text x="665" y="1327" class="body">实际连续运动 / 本体状态</text>
<path d="M1165 1178V1264" class="edge"/>
<path d="M1015 1306H925" class="edge"/>
<path d="M785 1347V1368H1165V1347" class="edge"/>
<text x="950" y="1362" class="small">状态反馈</text>
<text x="40" y="1260" class="small">门控测量与训练动态的相似程度；</text>
<text x="40" y="1288" class="small">不逐条验证碰撞、平衡、接触或力矩。</text>
<text x="40" y="1320" class="small">论文原型在单一人形机器人仿真中评估。</text>

<text x="32" y="1420" class="sub">实现边界：公开 play.py 用 k=1 的重建误差、阈值1.0，只更新f/a/b而保留自身相位。</text>
<text x="32" y="1449" class="sub">上图是论文多步门控算法；公开示例与论文并不完全一致，本文未执行模型或控制实验。</text>
</svg>
