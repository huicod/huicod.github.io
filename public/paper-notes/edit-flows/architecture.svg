<title id="title">Edit Flows：辅助对齐训练与变长编辑生成</title><desc id="desc">训练中构造带空白的对齐过程，网络仅接收去空白序列，预测三类编辑速率；推理迭代执行编辑，可选反向纠正，生成变长文本或代码。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#52657a"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#8256ad"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#1d3045}.head{font-size:30px;font-weight:700}.sub{font-size:19px;fill:#5a6b7d}.stage{font-size:23px;font-weight:700}.node-title{font-size:22px;font-weight:700}.body{font-size:19px}.label{font-size:17px;fill:#536577}.foot{font-size:19px;fill:#586a7c}a:hover rect{stroke-width:3}</style>
<rect width="1440" height="1770" fill="#ffffff" rx="20"/>
<text x="45" y="48" class="head">Edit Flows：把序列长度也纳入生成过程</text>
<text x="45" y="78" class="sub">教学示意 · 依据正式论文 §3、图1–3、附录C/E · 节点可点击 · t是生成时间</text>
<rect x="30" y="105" width="1380" height="440" rx="18" fill="#f7fbf8" stroke="#d3dce6"/>
<text x="55" y="140" class="stage">A 训练辅助空间：提供监督，不是推理输入</text>
<a href="https://arxiv.org/html/2506.09018v3#S3.SS2" target="_blank"><rect x="65" y="170" width="350" height="120" rx="13" fill="#edf8f0" stroke="#77aa88" stroke-width="1.8"/>
<text x="83" y="202" class="node-title">源序列 x₀ ＋ 目标 x₁</text>
<text x="83" y="235" class="body">空序列／随机 token → 数据</text>
<text x="83" y="262" class="body">训练目标：文本、代码、描述</text>
</a>
<a href="https://arxiv.org/html/2506.09018v3#S3.SS2" target="_blank"><rect x="500" y="170" width="400" height="120" rx="13" fill="#edf8f0" stroke="#77aa88" stroke-width="1.8"/>
<text x="518" y="202" class="node-title">构造辅助对齐 z₀、z₁</text>
<text x="518" y="235" class="body">ε→词：插入；词→ε：删除</text>
<text x="518" y="262" class="body">词a→词b：替换；ε只供训练</text>
</a>
<a href="https://arxiv.org/html/2506.09018v3#S3.SS2" target="_blank"><rect x="985" y="170" width="355" height="120" rx="13" fill="#edf8f0" stroke="#77aa88" stroke-width="1.8"/>
<text x="1003" y="202" class="node-title">采样辅助中间状态 zₜ</text>
<text x="1003" y="235" class="body">基础路径：按 κ(t) 混合端点</text>
<text x="1003" y="262" class="body">主实验 κ(t)=t³</text>
</a>
<path d="M415 230H500" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="437" y="215" class="label">对齐</text>
<path d="M900 230H985" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="919" y="215" class="label">时间 t</text>
<a href="https://arxiv.org/html/2506.09018v3#A3.SS1" target="_blank"><rect x="65" y="345" width="350" height="145" rx="13" fill="#edf8f0" stroke="#77aa88" stroke-width="1.8"/>
<text x="83" y="377" class="node-title">可选：局部传播路径</text>
<text x="83" y="410" class="body">辅助 m、M 从多个起点生长</text>
<text x="83" y="437" class="body">已出现的位置促进邻居出现</text>
<text x="83" y="464" class="body">同一理论导出训练监督</text>
</a>
<path d="M240 345V315H950V270H985" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="570" y="310" class="label">改变训练路径</text>
<a href="https://arxiv.org/html/2506.09018v3#A2.SS1" target="_blank"><rect x="500" y="355" width="400" height="135" rx="13" fill="#f5effb" stroke="#a585c6" stroke-width="1.8"/>
<text x="518" y="387" class="node-title">编辑速率损失（式23）</text>
<text x="518" y="420" class="body">Σ候选速率 − Σ目标编辑 log率</text>
<text x="518" y="447" class="body">目标编辑由 zₜ 与 z₁ 提供</text>
<text x="518" y="474" class="body">反向率可另按反向路径学习</text>
</a>
<path d="M700 290V355" fill="none" stroke="#8256ad" stroke-width="2.5" marker-end="url(#purple)" stroke-dasharray="7 6"/>
<text x="720" y="329" class="label">剩余编辑与权重</text>
<a href="https://arxiv.org/html/2506.09018v3#S3.SS2" target="_blank"><rect x="985" y="355" width="355" height="110" rx="13" fill="#edf8f0" stroke="#77aa88" stroke-width="1.8"/>
<text x="1003" y="387" class="node-title">移除全部 ε → xₜ</text>
<text x="1003" y="420" class="body">得到真正的变长 token 序列</text>
<text x="1003" y="447" class="body">不向网络暴露对齐或空白</text>
</a>
<path d="M1160 290V355" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1180" y="330" class="label">去空白</text>
<rect x="30" y="580" width="1380" height="535" rx="18" fill="#fffcf7" stroke="#d3dce6"/>
<text x="55" y="615" class="stage">B 可训练速率网络：预测做什么、在哪里做、以多大速率做</text>
<a href="https://arxiv.org/html/2506.09018v3#A5" target="_blank"><rect x="65" y="650" width="370" height="150" rx="13" fill="#eef6ff" stroke="#78a5ce" stroke-width="1.8"/>
<text x="83" y="682" class="node-title">条件 c（按任务选择）</text>
<text x="83" y="715" class="body">文本／代码：已给定前缀</text>
<text x="83" y="742" class="body">图像：冻结 CLIP → 可训练 MLP</text>
<text x="83" y="769" class="body">图像嵌入作为序列提示</text>
</a>
<a href="https://arxiv.org/html/2506.09018v3#S5" target="_blank"><rect x="535" y="650" width="370" height="120" rx="13" fill="#eef6ff" stroke="#78a5ce" stroke-width="1.8"/>
<text x="553" y="682" class="node-title">真实当前序列 xₜ ＋ t</text>
<text x="553" y="715" class="body">可变长度 token 与条件标记</text>
<text x="553" y="742" class="body">训练和推理共用输入接口</text>
</a>
<path d="M1160 465V560H720V650" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="745" y="550" class="label">仅真实 token 进入网络</text>
<a href="https://arxiv.org/html/2506.09018v3#S5" target="_blank"><rect x="535" y="850" width="370" height="150" rx="13" fill="#fff3e4" stroke="#d99c54" stroke-width="1.8"/>
<text x="553" y="882" class="node-title">双向 Transformer（训练）</text>
<text x="553" y="915" class="body">Llama架构；280M／1.3B</text>
<text x="553" y="942" class="body">全自注意力，含时间 token</text>
<text x="553" y="969" class="body">输出三类编辑头</text>
</a>
<path d="M720 770V850" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="738" y="812" class="label">序列表示</text>
<path d="M435 730H470V925H535" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="475" y="835" class="label">条件</text>
<a href="https://arxiv.org/html/2506.09018v3#S3.SS1" target="_blank"><rect x="990" y="640" width="350" height="115" rx="13" fill="#fff3e4" stroke="#d99c54" stroke-width="1.8"/>
<text x="1008" y="672" class="node-title">插入头：λins ＋ Qins</text>
<text x="1008" y="705" class="body">在当前位置右侧插入</text>
<text x="1008" y="732" class="body">速率 × 新 token 分布</text>
</a>
<a href="https://arxiv.org/html/2506.09018v3#S3.SS1" target="_blank"><rect x="990" y="800" width="350" height="105" rx="13" fill="#fff3e4" stroke="#d99c54" stroke-width="1.8"/>
<text x="1008" y="832" class="node-title">删除头：λdel</text>
<text x="1008" y="865" class="body">删除当前位置的 token</text>
<text x="1008" y="892" class="body">不需要新 token 分布</text>
</a>
<a href="https://arxiv.org/html/2506.09018v3#S3.SS1" target="_blank"><rect x="990" y="950" width="350" height="115" rx="13" fill="#fff3e4" stroke="#d99c54" stroke-width="1.8"/>
<text x="1008" y="982" class="node-title">替换头：λsub ＋ Qsub</text>
<text x="1008" y="1015" class="body">当前位置换成另一 token</text>
<text x="1008" y="1042" class="body">速率 × 新 token 分布</text>
</a>
