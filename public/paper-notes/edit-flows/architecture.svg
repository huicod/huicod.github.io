<text x="65" y="1075" class="foot">条件不是动作指令接口：本文没有语音编码器、动作解码器或物理控制器。</text>
<rect x="30" y="1150" width="1380" height="470" rx="18" fill="#f7f9fc" stroke="#d3dce6"/>
<text x="55" y="1185" class="stage">C 推理：在真实序列上迭代编辑，到 t=1 输出</text>
<a href="https://arxiv.org/html/2506.09018v3#S3.SS3" target="_blank"><rect x="65" y="1220" width="340" height="130" rx="13" fill="#f6f8fb" stroke="#a0afbf" stroke-width="1.8"/>
<text x="83" y="1252" class="node-title">初始化与任务条件</text>
<text x="83" y="1285" class="body">默认 x₀=∅（保留 BOS）</text>
<text x="83" y="1312" class="body">或随机初态／已有序列</text>
<text x="83" y="1339" class="body">不需要目标长度与辅助对齐</text>
</a>
<a href="https://arxiv.org/html/2506.09018v3#A3" target="_blank"><rect x="490" y="1220" width="370" height="130" rx="13" fill="#fff3e4" stroke="#d99c54" stroke-width="1.8"/>
<text x="508" y="1252" class="node-title">复用已训练速率网络</text>
<text x="508" y="1285" class="body">读取当前完整序列和时间</text>
<text x="508" y="1312" class="body">可选CFG、温度、top-p/k</text>
<text x="508" y="1339" class="body">预测本步候选编辑</text>
</a>
<a href="https://arxiv.org/html/2506.09018v3#A3" target="_blank"><rect x="965" y="1220" width="390" height="130" rx="13" fill="#f6f8fb" stroke="#a0afbf" stroke-width="1.8"/>
<text x="983" y="1252" class="node-title">CTMC 一阶近似采样</text>
<text x="983" y="1285" class="body">小步概率约为 hλ，抽样 token</text>
<text x="983" y="1312" class="body">同位置删除／替换互斥</text>
<text x="983" y="1339" class="body">多位置编辑可并行执行</text>
</a>
