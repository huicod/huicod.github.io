<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1710" role="img" aria-label="U-Mind｜从训练监督到统一回答，再到连续语音、动作与画面"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#56657a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b}.title{font-size:28px;font-weight:700}.section{font-size:23px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.arrow{fill:none;stroke:#56657a;stroke-width:2.3;marker-end:url(#a)}.dash{stroke-dasharray:7 5}</style><rect width="1280" height="1710" fill="#fff"/><text x="40" y="44" class="title">U-Mind｜从训练监督到统一回答，再到连续语音、动作与画面</text><rect x="30" y="75" width="1220" height="390" rx="16" fill="#f6f8fb" stroke="#c9d2df"/><text x="50" y="109" class="section">A · 数据构建与两阶段训练（训练支线）</text><rect x="55" y="130" width="350" height="120" rx="10" fill="#fff0d4" stroke="#aab8ca"/><text x="70" y="160" class="head">BEAT v2 / HumanML3D</text><text x="70" y="189" class="body">语音—动作 / 文字—动作</text><text x="70" y="215" class="body">Qwen3生成问答与规划</text><text x="70" y="241" class="body">Orpheus合成回答语音</text><rect x="455" y="130" width="350" height="120" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="470" y="160" class="head">分段与离散表示</text><text x="470" y="189" class="body">停顿、节奏、标点划分片段</text><text x="470" y="215" class="body">随机组合训练样本</text><text x="470" y="241" class="body">语音 / 运动codec编码</text><rect x="855" y="130" width="370" height="120" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="870" y="160" class="head">阶段1：基础混合训练</text><text x="870" y="189" class="body">T2M、S2M、T2S</text><text x="870" y="215" class="body">＋OpenOrca纯文字回放</text><text x="870" y="241" class="body">学习新模态，保留语言能力</text><path d="M405 190H455" class="arrow"/><path d="M805 190H855" class="arrow"/><rect x="55" y="295" width="350" height="120" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="70" y="325" class="head">运动codec独立训练</text><text x="70" y="354" class="body">SMPL-X → 6D旋转</text><text x="70" y="380" class="body">RVQ：4级，时间下采样4倍</text><text x="70" y="406" class="body">随后冻结编码与解码参数</text><rect x="455" y="295" width="350" height="120" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="470" y="325" class="head">统一骨干 / 扩展词表</text><text x="470" y="354" class="body">AnyGPT初始化LLaMA2-7B</text><text x="470" y="380" class="body">文字＋语音＋运动＋边界符</text><text x="470" y="406" class="body">统一next-token训练</text><rect x="855" y="295" width="370" height="120" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="870" y="325" class="head">阶段2：指令微调</text><text x="870" y="354" class="body">带规划的对话 / 动作指令</text><text x="870" y="380" class="body">学习text-first输出顺序</text><text x="870" y="406" class="body">codec在LLM训练中冻结</text><path d="M1030 250V295" class="arrow"/><path d="M855 355H805" class="arrow dash"/><text x="810" y="285" class="small">更新骨干</text><path d="M405 355H455" class="arrow dash"/><text x="408" y="340" class="small">冻结表示</text><rect x="30" y="505" width="1220" height="625" rx="16" fill="#f6f8fb" stroke="#c9d2df"/><text x="50" y="539" class="section">B · 推理主线：结构化回答 → 分支解码（顺序不等于已测端到端时延）</text><rect x="55" y="565" width="350" height="120" rx="10" fill="#fff0d4" stroke="#aab8ca"/><text x="70" y="595" class="head">用户文字 / 语音提示</text><text x="70" y="624" class="body">文字token / SpeechTokenizer</text><text x="70" y="650" class="body">带模态边界的提示序列</text><text x="70" y="676" class="body">输入交互上下文</text><rect x="465" y="565" width="350" height="120" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="480" y="595" class="head">统一自回归骨干</text><text x="480" y="624" class="body">先内部文字规划</text><text x="480" y="650" class="body">再生成文字回答</text><text x="480" y="676" class="body">内容骨架指导后续模态</text><rect x="875" y="565" width="350" height="120" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="890" y="595" class="head">继续生成模态token</text><text x="890" y="624" class="body">语音码与运动码</text><text x="890" y="650" class="body">模态起止标记区分序列</text><text x="890" y="676" class="body">不直接生成像素或关节坐标</text><path d="M405 625H465" class="arrow"/><path d="M815 625H875" class="arrow"/><path d="M630 415V480H1240V550H640V565" class="arrow dash"/><text x="650" y="480" class="small">复用训练权重</text><rect x="55" y="755" width="350" height="120" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="70" y="785" class="head">SpeechTokenizer decoder</text><text x="70" y="814" class="body">预训练 / 冻结复用</text><text x="70" y="840" class="body">声学码 → 连续音频波形</text><text x="70" y="866" class="body">供播放及后续音频编码</text><rect x="465" y="755" width="350" height="120" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="480" y="785" class="head">运动RVQ-VAE decoder</text><text x="480" y="814" class="body">独立训练后冻结</text><text x="480" y="840" class="body">运动码 → 连续SMPL-X姿态</text><text x="480" y="866" class="body">量化细节限制输出表达</text><rect x="875" y="755" width="350" height="120" rx="10" fill="#fff" stroke="#aab8ca"/><text x="890" y="785" class="head">文字回答与声音输出</text><text x="890" y="814" class="body">文字可显示，音频可播放</text><text x="890" y="840" class="body">播放分块调度细节未充分披露</text><text x="890" y="866" class="body">没有报告首音频输出时间</text><path d="M1050 685V720H230V755" class="arrow"/><text x="240" y="712" class="small">语音码</text><path d="M1050 720H640V755" class="arrow"/><text x="660" y="745" class="small">运动码</text><path d="M405 815H430V915H1050V875" class="arrow"/><rect x="55" y="965" width="350" height="110" rx="10" fill="#e9f2ff" stroke="#aab8ca"/><text x="70" y="995" class="head">音频特征重编码</text><text x="70" y="1024" class="body">波形 → 视频使用的音频特征</text><text x="70" y="1050" class="body">补充材料明确存在此步骤</text><rect x="465" y="965" width="350" height="110" rx="10" fill="#fff" stroke="#aab8ca"/><text x="480" y="995" class="head">姿态条件准备</text><text x="480" y="1024" class="body">SMPL-X姿态 → 2D关键点</text><text x="480" y="1050" class="body">或保留3D参数供高斯角色</text><rect x="875" y="965" width="350" height="110" rx="10" fill="#fff" stroke="#aab8ca"/><text x="890" y="995" class="head">选择可视化后端</text><text x="890" y="1024" class="body">2D扩散 / 3D高斯二选一</text><text x="890" y="1050" class="body">各自另训，并非同一LLM输出</text><path d="M230 875V965" class="arrow"/><path d="M640 875V965" class="arrow"/><path d="M815 1020H875" class="arrow"/><rect x="30" y="1170" width="1220" height="430" rx="16" fill="#f6f8fb" stroke="#c9d2df"/><text x="50" y="1204" class="section">C · 两条可视化路径与监督来源</text><rect x="55" y="1230" width="350" height="125" rx="10" fill="#fff0d4" stroke="#aab8ca"/><text x="70" y="1260" class="head">专有视频 / DWPose监督</text><text x="70" y="1289" class="body">WAN：16张H100另行训练</text><text x="70" y="1315" class="body">主文400h，补充500h有冲突</text><text x="70" y="1341" class="body">不是推理时输入数据集</text><rect x="465" y="1230" width="350" height="125" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="480" y="1260" class="head">WAN扩散渲染器</text><text x="480" y="1289" class="body">动作与音频cross-attention</text><text x="480" y="1315" class="body">生成2D人物视频</text><text x="480" y="1341" class="body">没有独立速度表</text><rect x="875" y="1230" width="350" height="125" rx="10" fill="#fff" stroke="#aab8ca"/><text x="890" y="1260" class="head">2D视频输出</text><text x="890" y="1289" class="body">与语音 / 姿态协调</text><text x="890" y="1315" class="body">训练25fps不等于生成25fps</text><path d="M405 1290H465" class="arrow dash"/><text x="407" y="1274" class="small">训练监督</text><path d="M815 1290H875" class="arrow"/><path d="M230 1075V1145H640V1230" class="arrow"/><text x="680" y="1158" class="small">音频＋姿态</text><path d="M640 1075V1145" class="arrow"/><rect x="55" y="1400" width="350" height="125" rx="10" fill="#fff0d4" stroke="#aab8ca"/><text x="70" y="1430" class="head">TaoAvatar数据 / 3D监督</text><text x="70" y="1459" class="body">单张H100训练高斯后端</text><text x="70" y="1485" class="body">角色资产与渲染网络另备</text><text x="70" y="1511" class="body">不同于通用动作模型</text><rect x="465" y="1400" width="350" height="125" rx="10" fill="#e9f5ec" stroke="#aab8ca"/><text x="480" y="1430" class="head">SMPL-X驱动高斯角色</text><text x="480" y="1459" class="body">复用姿态序列</text><text x="480" y="1485" class="body">按Gaussian Splatting渲染</text><text x="480" y="1511" class="body">不依次经过WAN</text><rect x="875" y="1400" width="350" height="125" rx="10" fill="#fff" stroke="#aab8ca"/><text x="890" y="1430" class="head">3D角色视频输出</text><text x="890" y="1459" class="body">与音频组合展示</text><text x="890" y="1485" class="body">完整链路仍需单独计时</text><path d="M405 1460H465" class="arrow dash"/><text x="407" y="1444" class="small">训练监督</text><path d="M815 1460H875" class="arrow"/><path d="M1050 1075V1120H840V1380H640V1400" class="arrow"/><text x="890" y="1120" class="small">3D姿态</text><text x="55" y="1567" class="small">实线：运行数据流；虚线：训练监督 / 参数复用。图为教学重绘，依据主文图2与补充§1–2。</text><text x="40" y="1650" class="body">核查边界：文字规划和token对齐不保证精确接触；论文未给首响应、吞吐或端到端实时延迟表。</text></svg>