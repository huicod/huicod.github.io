<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2080" viewBox="0 0 1200 2080" role="img" aria-labelledby="title desc">
<title id="title">多层扩散：语义协调、关键帧精修与源动作编辑的完整流程</title>
<desc id="desc">原创教学图。共享模型从局部关键帧特征拼接和全局文本关键帧交叉注意力预测干净运动。训练使用去噪、关键帧和接触脚速度损失。DDIM推理前期直接更新，末期先按速度比例修正根轨迹再覆盖约束姿态。编辑以DDIM反演与固定点迭代获得源动作噪声，再用新的关键帧采样。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#397ca9"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c07a2a"/></marker></defs>
<rect width="1200" height="2080" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<text x="35" y="46" font-size="32" fill="#173851" font-weight="750">多层扩散：把语义协调与关键帧硬约束分开处理</text>
<text x="35" y="81" font-size="21" fill="#536d80" font-weight="400">CVPR 2026  ·  教学重绘，非论文原图  ·  x 为运动特征序列，关键帧不是图片</text>
<rect x="18" y="110" width="1164" height="660" rx="18" fill="#f1f7fc" stroke="#d3dee7" stroke-width="1.4"/>
<text x="40" y="146" font-size="27" fill="#153b56" font-weight="700">A  共享条件模型：局部拼接 + 全局语义协调</text>
<text x="40" y="179" font-size="20" fill="#567084" font-weight="400">训练、生成与编辑复用同一个去噪模型；下列条件输入均为动作数据或文本。</text>
<rect x="18" y="790" width="1164" height="310" rx="18" fill="#f3f8ef" stroke="#d3dee7" stroke-width="1.4"/>
<text x="40" y="826" font-size="27" fill="#153b56" font-weight="700">B  训练：学习运动先验与约束响应</text>
<text x="40" y="859" font-size="20" fill="#567084" font-weight="400">HumanML3D 重提取为 SMPL-X，30 fps、22 关节、每帧 218 维。</text>
<rect x="18" y="1120" width="1164" height="540" rx="18" fill="#fff7eb" stroke="#d3dee7" stroke-width="1.4"/>
<text x="40" y="1156" font-size="27" fill="#153b56" font-weight="700">C  生成：DDIM 50 步，末阶段先轨迹、后姿态精修</text>
<text x="40" y="1189" font-size="20" fill="#567084" font-weight="400">文本 CFG = 2.5；有 / 无文本的两路都保留关键帧，关键帧条件不额外放大。</text>
<rect x="18" y="1680" width="1164" height="305" rx="18" fill="#f6f1fa" stroke="#d3dee7" stroke-width="1.4"/>
<text x="40" y="1716" font-size="27" fill="#153b56" font-weight="700">D  编辑：反演原动作，再带着新关键帧采样</text>
<text x="40" y="1749" font-size="20" fill="#567084" font-weight="400">不为一次编辑额外训练；论文定量编辑实验不输入文本。</text>
