<path d="M770 1845 H830" fill="none" stroke="#397ca9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="50" y="190" width="310" height="120" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="67" y="221" font-size="23" fill="#183b5a" font-weight="650">关键帧 K 与二值掩码 mₖ</text>
<text x="67" y="251" font-size="20" fill="#2c4358" font-weight="400">K：N×218 的运动特征约束</text>
<text x="67" y="278" font-size="20" fill="#2c4358" font-weight="400">未约束项置零，mask 区分未知</text>
<text x="67" y="305" font-size="20" fill="#2c4358" font-weight="400">部分关节控制也需要根信息</text>
<rect x="420" y="190" width="310" height="120" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="437" y="221" font-size="23" fill="#183b5a" font-weight="650">逐帧条件编码</text>
<text x="437" y="251" font-size="20" fill="#2c4358" font-weight="400">[K, mₖ] 沿特征维拼接</text>
<text x="437" y="278" font-size="20" fill="#2c4358" font-weight="400">MLP → 逐帧 embedding eₖ</text>
<text x="437" y="305" font-size="20" fill="#2c4358" font-weight="400">一份表征，送入两条条件路径</text>
<rect x="830" y="190" width="320" height="120" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="847" y="221" font-size="23" fill="#183b5a" font-weight="650">全局关键帧编码</text>
<text x="847" y="251" font-size="20" fill="#2c4358" font-weight="400">位置编码 + 8 个 learned tokens</text>
<text x="847" y="278" font-size="20" fill="#2c4358" font-weight="400">mask 过滤 → 4 层 Transformer</text>
<text x="847" y="305" font-size="20" fill="#2c4358" font-weight="400">输出 8×512 的关键帧特征</text>
<rect x="50" y="350" width="310" height="120" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="67" y="381" font-size="23" fill="#183b5a" font-weight="650">文本条件 p</text>
<text x="67" y="411" font-size="20" fill="#2c4358" font-weight="400">例如：走路，然后停下坐下</text>
<text x="67" y="438" font-size="20" fill="#2c4358" font-weight="400">提供动作意图与整体语义</text>
<text x="67" y="465" font-size="20" fill="#2c4358" font-weight="400">不自动生成编辑目标关键帧</text>
<rect x="420" y="350" width="310" height="120" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="437" y="381" font-size="23" fill="#183b5a" font-weight="650">文本条件编码</text>
<text x="437" y="411" font-size="20" fill="#2c4358" font-weight="400">预训练 CLIP token embeddings</text>
<text x="437" y="438" font-size="20" fill="#2c4358" font-weight="400">4 层 Transformer + 8 tokens</text>
<text x="437" y="465" font-size="20" fill="#2c4358" font-weight="400">输出 8×512 的文本特征</text>
<rect x="830" y="350" width="320" height="120" rx="13" fill="#e8f2fb" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="847" y="381" font-size="23" fill="#183b5a" font-weight="650">全局条件：16×512</text>
<text x="847" y="411" font-size="20" fill="#2c4358" font-weight="400">两组特征沿 token 维拼接</text>
<text x="847" y="438" font-size="20" fill="#2c4358" font-weight="400">作为 cross-attention 的 K / V</text>
<text x="847" y="465" font-size="20" fill="#2c4358" font-weight="400">U-Net 运动特征作为 Q</text>
<rect x="50" y="515" width="310" height="110" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="67" y="546" font-size="23" fill="#183b5a" font-weight="650">噪声运动 xₜ 与时间 t</text>
<text x="67" y="576" font-size="20" fill="#2c4358" font-weight="400">xₜ 经 MLP 投影；t 为扩散时间</text>
<text x="67" y="603" font-size="20" fill="#2c4358" font-weight="400">每一帧均为运动特征向量</text>
<rect x="420" y="515" width="310" height="110" rx="13" fill="#e8f2fb" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="437" y="546" font-size="23" fill="#183b5a" font-weight="650">局部条件路径</text>
<text x="437" y="576" font-size="20" fill="#2c4358" font-weight="400">xₜ 投影与同帧 eₖ 按特征拼接</text>
<text x="437" y="603" font-size="20" fill="#2c4358" font-weight="400">时间卷积传播到邻近过渡</text>
<rect x="830" y="515" width="320" height="155" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="847" y="546" font-size="23" fill="#183b5a" font-weight="650">Conv1D U-Net</text>
<text x="847" y="576" font-size="20" fill="#2c4358" font-weight="400">接收局部输入与全局注意力</text>
<text x="847" y="603" font-size="20" fill="#2c4358" font-weight="400">基础通道 512；使用 AdaGN</text>
<text x="847" y="630" font-size="20" fill="#2c4358" font-weight="400">扩散时间 t 也输入去噪模型</text>
<text x="847" y="657" font-size="20" fill="#2c4358" font-weight="400">输出 clean-motion 估计 x̂₀</text>
<rect x="50" y="690" width="1100" height="44" rx="13" fill="#e8f2fb" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="67" y="721" font-size="23" fill="#183b5a" font-weight="650">x̂₀ 只是学习模型的预测；精确关键帧由 C 区的显式推理精修落实。</text>
<text x="50" y="756" font-size="20" fill="#506c82" font-weight="400">218D = 世界系根位置 / 旋转 + 根相对关节位置 / 父关节相对旋转 + 接触 + 体型；不是速度型训练表示。</text>
<rect x="50" y="875" width="310" height="150" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="67" y="906" font-size="23" fill="#183b5a" font-weight="650">真实动作 x₀ → 加噪 xₜ</text>
<text x="67" y="936" font-size="20" fill="#2c4358" font-weight="400">随机抽取帧、再抽取关节</text>
<text x="67" y="963" font-size="20" fill="#2c4358" font-weight="400">保留相应完整特征形成 K / mₖ</text>
<text x="67" y="990" font-size="20" fill="#2c4358" font-weight="400">文本与关键帧各独立 10% 置空</text>
<text x="67" y="1017" font-size="20" fill="#2c4358" font-weight="400">训练噪声日程：1000 步 cosine</text>
<rect x="420" y="875" width="340" height="150" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="437" y="906" font-size="23" fill="#183b5a" font-weight="650">复用 A 区条件模型</text>
<text x="437" y="936" font-size="20" fill="#2c4358" font-weight="400">输入 xₜ、t、文本、K / mₖ</text>
<text x="437" y="963" font-size="20" fill="#2c4358" font-weight="400">预测整段干净运动 x̂₀</text>
<text x="437" y="990" font-size="20" fill="#2c4358" font-weight="400">训练阶段不依赖末期硬覆盖</text>
<text x="437" y="1017" font-size="20" fill="#2c4358" font-weight="400">优化模型响应与运动先验</text>
<rect x="830" y="875" width="320" height="150" rx="13" fill="#eaf5e4" stroke="#a4b995" stroke-width="1.8"/>
<text x="847" y="906" font-size="23" fill="#183b5a" font-weight="650">联合监督损失</text>
<text x="847" y="936" font-size="20" fill="#2c4358" font-weight="400">L = Ldiff + Lkey + Lfoot</text>
<text x="847" y="963" font-size="20" fill="#2c4358" font-weight="400">整段去噪 MSE + 关键帧误差</text>
<text x="847" y="990" font-size="20" fill="#2c4358" font-weight="400">接触脚的相邻帧位置差分惩罚</text>
<text x="847" y="1017" font-size="20" fill="#2c4358" font-weight="400">λkey = λfoot = 1</text>
<text x="390" y="1043" font-size="20" fill="#9a691e" font-weight="400">真实动作 / 约束作为监督目标</text>
<text x="50" y="1081" font-size="20" fill="#536c4c" font-weight="400">论文训练配置：batch 64、500K iterations、Adam、EMA；未披露训练 GPU 型号或完整时长。</text>
<rect x="50" y="1225" width="260" height="140" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="67" y="1256" font-size="23" fill="#183b5a" font-weight="650">生成起点</text>
<text x="67" y="1286" font-size="20" fill="#2c4358" font-weight="400">高斯噪声 xT</text>
<text x="67" y="1313" font-size="20" fill="#2c4358" font-weight="400">目标文本 + K / mₖ</text>
<text x="67" y="1340" font-size="20" fill="#2c4358" font-weight="400">进入 50 步去噪循环</text>
<rect x="350" y="1225" width="340" height="140" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="367" y="1256" font-size="23" fill="#183b5a" font-weight="650">复用 A：预测 x̂₀</text>
<text x="367" y="1286" font-size="20" fill="#2c4358" font-weight="400">有文本 / 无文本预测做 CFG</text>
<text x="367" y="1313" font-size="20" fill="#2c4358" font-weight="400">K / mₖ 在两路始终保留</text>
<text x="367" y="1340" font-size="20" fill="#2c4358" font-weight="400">条件是软引导，尚非硬对齐</text>
<rect x="780" y="1225" width="370" height="140" rx="13" fill="#fff0d8" stroke="#c7aa7b" stroke-width="1.8"/>
<text x="797" y="1256" font-size="23" fill="#183b5a" font-weight="650">① 根轨迹精修（末阶段）</text>
<text x="797" y="1286" font-size="20" fill="#2c4358" font-weight="400">逐轴权重 |v̂| / Σ|v̂| 分配端点误差</text>
<text x="797" y="1313" font-size="20" fill="#2c4358" font-weight="400">由已对齐起点逐段积分</text>
<text x="797" y="1340" font-size="20" fill="#2c4358" font-weight="400">替换根轨迹，得到 x̃₀</text>
<text x="350" y="1407" font-size="20" fill="#426c88" font-weight="400">下一步</text>
<text x="570" y="1398" font-size="20" fill="#426c88" font-weight="400">前期跳过精修</text>
<rect x="780" y="1435" width="370" height="150" rx="13" fill="#fff0d8" stroke="#c7aa7b" stroke-width="1.8"/>
<text x="797" y="1466" font-size="23" fill="#183b5a" font-weight="650">② 姿态精修（末阶段）</text>
<text x="797" y="1496" font-size="20" fill="#2c4358" font-weight="400">x̄₀ = K⊙mₖ + x̃₀⊙(1−mₖ)</text>
<text x="797" y="1523" font-size="20" fill="#2c4358" font-weight="400">受约束特征直接写回目标值</text>
<text x="797" y="1550" font-size="20" fill="#2c4358" font-weight="400">其余特征采用轨迹修正结果</text>
<text x="797" y="1577" font-size="20" fill="#2c4358" font-weight="400">顺序：轨迹在先，姿态回填在后</text>
<rect x="350" y="1435" width="340" height="150" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="367" y="1466" font-size="23" fill="#183b5a" font-weight="650">DDIM 更新下一状态</text>
<text x="367" y="1496" font-size="20" fill="#2c4358" font-weight="400">用 xₜ 与当前 x₀ 估计计算 ε</text>
<text x="367" y="1523" font-size="20" fill="#2c4358" font-weight="400">更新到下一去噪状态 xₛ</text>
<text x="367" y="1550" font-size="20" fill="#2c4358" font-weight="400">前期：用 x̂₀；末期：用 x̄₀</text>
<text x="367" y="1577" font-size="20" fill="#2c4358" font-weight="400">继续循环，直到最终动作</text>
<rect x="50" y="1435" width="260" height="150" rx="13" fill="#fff" stroke="#a8bfd4" stroke-width="1.8"/>
<text x="67" y="1466" font-size="23" fill="#183b5a" font-weight="650">输出动作序列</text>
<text x="67" y="1496" font-size="20" fill="#2c4358" font-weight="400">x₀ ∈ Rᴺˣ²¹⁸</text>
<text x="67" y="1523" font-size="20" fill="#2c4358" font-weight="400">满足已施加的关键帧约束</text>
<text x="67" y="1550" font-size="20" fill="#2c4358" font-weight="400">0 约束误差不等于</text>
<text x="67" y="1577" font-size="20" fill="#2c4358" font-weight="400">零脚滑或零抖动</text>
<text x="50" y="1633" font-size="20" fill="#795c37" font-weight="400">轨迹公式需要有效分母与起点对齐；补充算法的阈值与状态同步细节存在歧义，正文单列说明。</text>
<rect x="50" y="1780" width="300" height="130" rx="13" fill="#fff" stroke="#bda5cb" stroke-width="1.8"/>
<text x="67" y="1811" font-size="23" fill="#183b5a" font-weight="650">输入源动作 x₀</text>
<text x="67" y="1841" font-size="20" fill="#2c4358" font-weight="400">原动作提供语义与动态线索</text>
<text x="67" y="1868" font-size="20" fill="#2c4358" font-weight="400">不需要成对编辑数据重新训练</text>
<text x="67" y="1895" font-size="20" fill="#2c4358" font-weight="400">不是把动作转换为文字计划</text>
<rect x="410" y="1780" width="360" height="130" rx="13" fill="#f1e9f7" stroke="#bda5cb" stroke-width="1.8"/>
<text x="427" y="1811" font-size="23" fill="#183b5a" font-weight="650">DDIM 反演 → 源噪声 xT</text>
<text x="427" y="1841" font-size="20" fill="#2c4358" font-weight="400">50 步；每步 1 次 fixed-point 迭代</text>
<text x="427" y="1868" font-size="20" fill="#2c4358" font-weight="400">反演过程不提供关键帧条件</text>
