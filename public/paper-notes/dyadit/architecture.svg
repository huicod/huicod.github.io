<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="3190" viewBox="0 0 1360 3190" role="img" aria-labelledby="title"><title id="title">DyaDiT完整架构：双人音频、社会条件、动作字典与潜空间扩散</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#40566c"/></marker></defs><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#20394c}.flow{fill:none;stroke:#40566c;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#38867b;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#arrow)}</style>
<rect width="1360" height="3190" fill="white"/>
<text x="55" y="60" font-size="36" text-anchor="start" font-weight="700">DyaDiT：给定双人对话上下文，生成一方上身手势</text>
<text x="55" y="105" font-size="25" text-anchor="start" font-weight="400">目标人物 A：生成动作；伙伴 B：提供上下文。关系与人格是输入条件。</text>
<rect x="25" y="145" width="1310" height="1240" rx="22" fill="#eff6fc" stroke="#cbd8e2" stroke-width="2"/>
<text x="50" y="188" font-size="30" text-anchor="start" font-weight="700">A 推理主线：音频与可选条件 → 潜空间去噪 → 上身动作</text>
<text x="50" y="225" font-size="23" text-anchor="start" font-weight="400">沿用论文架构；蓝色是生成路径，绿色虚线表示可选条件。</text>
<rect x="60" y="275" width="350" height="160" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="235.0" y="311" font-size="26" text-anchor="middle" font-weight="700">双方独立语音轨</text>
<text x="235.0" y="347" font-size="24" text-anchor="middle" font-weight="400">目标 A + 伙伴 B</text>
<text x="235.0" y="378" font-size="24" text-anchor="middle" font-weight="400">各自 Wav2Vec2 编码</text>
<text x="235.0" y="409" font-size="24" text-anchor="middle" font-weight="400">768 维 → 512 维</text>
<rect x="505" y="275" width="350" height="160" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="680.0" y="311" font-size="26" text-anchor="middle" font-weight="700">ORCA 音频融合</text>
<text x="680.0" y="347" font-size="24" text-anchor="middle" font-weight="400">可选 motion bank 调制</text>
<text x="680.0" y="378" font-size="24" text-anchor="middle" font-weight="400">投影减冗余 + 双向注意力</text>
<text x="680.0" y="409" font-size="24" text-anchor="middle" font-weight="400">细节见 B 区</text>
<rect x="950" y="275" width="350" height="160" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="1125.0" y="311" font-size="26" text-anchor="middle" font-weight="700">融合音频 f_audio</text>
<text x="1125.0" y="347" font-size="24" text-anchor="middle" font-weight="400">门控组合两路特征</text>
<text x="1125.0" y="378" font-size="24" text-anchor="middle" font-weight="400">提供对话声音条件</text>
<path d="M410 355H505" class="flow"/>
<path d="M855 355H950" class="flow"/>
<rect x="60" y="535" width="350" height="150" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="235.0" y="571" font-size="26" text-anchor="middle" font-weight="700">可选伙伴 B 动作</text>
<text x="235.0" y="607" font-size="24" text-anchor="middle" font-weight="400">运动条件编码</text>
<text x="235.0" y="638" font-size="24" text-anchor="middle" font-weight="400">不是目标 A 的答案</text>
<rect x="505" y="535" width="350" height="175" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="680.0" y="571" font-size="26" text-anchor="middle" font-weight="700">多模态条件序列</text>
<text x="680.0" y="607" font-size="24" text-anchor="middle" font-weight="400">音频 + 伙伴动作</text>
<text x="680.0" y="638" font-size="24" text-anchor="middle" font-weight="400">+ 关系 + 人格特征</text>
<text x="680.0" y="669" font-size="24" text-anchor="middle" font-weight="400">作为 Cross-Attention K/V</text>
<rect x="950" y="535" width="350" height="150" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="1125.0" y="571" font-size="26" text-anchor="middle" font-weight="700">社会条件</text>
<text x="1125.0" y="607" font-size="24" text-anchor="middle" font-weight="400">4 类关系 one-hot</text>
<text x="1125.0" y="638" font-size="24" text-anchor="middle" font-weight="400">5 维连续人格分数</text>
<path d="M1125 435V475H680V535" class="flow"/>
<path d="M410 610H505" class="dash"/>
<path d="M950 610H855" class="dash"/>
<rect x="950" y="780" width="350" height="150" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="1125.0" y="816" font-size="26" text-anchor="middle" font-weight="700">FiLM 调制</text>
<text x="1125.0" y="852" font-size="24" text-anchor="middle" font-weight="400">扩散时间 t</text>
<text x="1125.0" y="883" font-size="24" text-anchor="middle" font-weight="400">+ 关系 / 人格 embedding</text>
<path d="M1125 685V780" class="dash"/>
<rect x="60" y="855" width="350" height="150" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="235.0" y="891" font-size="26" text-anchor="middle" font-weight="700">高斯噪声 xₜ</text>
<text x="235.0" y="927" font-size="24" text-anchor="middle" font-weight="400">T/4 × 64 维 embedding</text>
<text x="235.0" y="958" font-size="24" text-anchor="middle" font-weight="400">初始化目标运动隐变量</text>
<rect x="505" y="855" width="350" height="185" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="680.0" y="891" font-size="26" text-anchor="middle" font-weight="700">4 层 DiT 去噪器</text>
<text x="680.0" y="927" font-size="24" text-anchor="middle" font-weight="400">时间 Self-Attention</text>
<text x="680.0" y="958" font-size="24" text-anchor="middle" font-weight="400">条件 Cross-Attention</text>
<text x="680.0" y="989" font-size="24" text-anchor="middle" font-weight="400">预测噪声 ε，迭代更新</text>
<path d="M680 710V855" class="flow"/>
<path d="M410 930H505" class="flow"/>
<path d="M950 855H900V950H855" class="flow"/>
<rect x="505" y="1130" width="350" height="160" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="680.0" y="1166" font-size="26" text-anchor="middle" font-weight="700">残差 VQ-VAE 解码</text>
<text x="680.0" y="1202" font-size="24" text-anchor="middle" font-weight="400">生成的连续 embedding</text>
<text x="680.0" y="1233" font-size="24" text-anchor="middle" font-weight="400">时间上采样 4 倍</text>
<text x="680.0" y="1264" font-size="24" text-anchor="middle" font-weight="400">恢复关节旋转</text>
<rect x="950" y="1130" width="350" height="160" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="1125.0" y="1166" font-size="26" text-anchor="middle" font-weight="700">目标 A 连续动作</text>
<text x="1125.0" y="1202" font-size="24" text-anchor="middle" font-weight="400">43 个上身关节 × 6D</text>
<text x="1125.0" y="1233" font-size="24" text-anchor="middle" font-weight="400">包含手指；无下身生成</text>
<text x="1125.0" y="1264" font-size="24" text-anchor="middle" font-weight="400">B 动作为已知参照</text>
<path d="M680 1040V1130" class="flow"/>
<path d="M855 1210H950" class="flow"/>
<text x="60" y="1190" font-size="24" text-anchor="start" font-weight="400">有 seed pose / 前缀条件</text>
<text x="60" y="1230" font-size="24" text-anchor="start" font-weight="400">不等于全程无条件生成。</text>
<text x="60" y="1335" font-size="24" text-anchor="start" font-weight="400">动作字典 ≠ 残差量化码本；双人上下文 ≠ 同时生成双方语言与全身动作。</text>
<rect x="25" y="1440" width="1310" height="800" rx="22" fill="#f5effb" stroke="#cbd8e2" stroke-width="2"/>
<text x="50" y="1483" font-size="30" text-anchor="start" font-weight="700">B 音频细节：风格先验与双向交互</text>
<text x="50" y="1520" font-size="23" text-anchor="start" font-weight="400">原文投影称轻量 MLP；公开代码采用点积投影。此处画论文的功能关系。</text>
<rect x="60" y="1580" width="350" height="150" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="235.0" y="1616" font-size="26" text-anchor="middle" font-weight="700">目标 A 音频特征</text>
<text x="235.0" y="1652" font-size="24" text-anchor="middle" font-weight="400">Wav2Vec2 输出投影</text>
<text x="235.0" y="1683" font-size="24" text-anchor="middle" font-weight="400">保留目标语音线索</text>
<rect x="505" y="1580" width="350" height="150" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="680.0" y="1616" font-size="26" text-anchor="middle" font-weight="700">可选风格动作特征</text>
<text x="680.0" y="1652" font-size="24" text-anchor="middle" font-weight="400">调制可学习 motion bank</text>
<text x="680.0" y="1683" font-size="24" text-anchor="middle" font-weight="400">1,000 个 512 维原型</text>
<rect x="950" y="1580" width="350" height="150" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="1125.0" y="1616" font-size="26" text-anchor="middle" font-weight="700">字典交叉注意力</text>
<text x="1125.0" y="1652" font-size="24" text-anchor="middle" font-weight="400">音频查询风格原型</text>
<text x="1125.0" y="1683" font-size="24" text-anchor="middle" font-weight="400">残差更新目标音频</text>
<path d="M410 1655H455V1775H900V1695H950" class="flow"/>
<path d="M855 1655H950" class="dash"/>
<rect x="60" y="1850" width="350" height="150" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="235.0" y="1886" font-size="26" text-anchor="middle" font-weight="700">伙伴 B 音频特征</text>
<text x="235.0" y="1922" font-size="24" text-anchor="middle" font-weight="400">相对目标音频减去</text>
<text x="235.0" y="1953" font-size="24" text-anchor="middle" font-weight="400">相关投影分量</text>
<rect x="505" y="1850" width="350" height="150" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="680.0" y="1886" font-size="26" text-anchor="middle" font-weight="700">双向 Cross-Attention</text>
<text x="680.0" y="1922" font-size="24" text-anchor="middle" font-weight="400">目标查询伙伴</text>
<text x="680.0" y="1953" font-size="24" text-anchor="middle" font-weight="400">伙伴查询目标</text>
<rect x="950" y="1850" width="350" height="150" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="1125.0" y="1886" font-size="26" text-anchor="middle" font-weight="700">可学习门控 g</text>
<text x="1125.0" y="1922" font-size="24" text-anchor="middle" font-weight="400">g · h₁ + (1−g) · h₂</text>
<text x="1125.0" y="1953" font-size="24" text-anchor="middle" font-weight="400">输出融合音频条件</text>
<path d="M1125 1730V1805H235V1850" class="flow"/>
<path d="M410 1925H505" class="flow"/>
<path d="M1125 1805H680V1850" class="flow"/>
<path d="M855 1925H950" class="flow"/>
<text x="60" y="2080" font-size="24" text-anchor="start" font-weight="400">功能：处理相关声音线索；输入本来就是双方分离声轨，不是盲源分离。</text>
<text x="60" y="2125" font-size="24" text-anchor="start" font-weight="400">motion bank 联合学习时不强制正交，也不提供可命名、可硬执行的手势原语。</text>
<text x="60" y="2170" font-size="24" text-anchor="start" font-weight="400">社会标签可能与音频隐含风格冲突；门控与注意力没有明确冲突优先规则。</text>
<rect x="25" y="2295" width="1310" height="670" rx="22" fill="#eff9f4" stroke="#cbd8e2" stroke-width="2"/>
<text x="50" y="2338" font-size="30" text-anchor="start" font-weight="700">C 训练与表示：先学残差量化，再训练噪声预测</text>
<text x="50" y="2375" font-size="23" text-anchor="start" font-weight="400">数据约 182 小时 / 3,000 对片段；上身质量与标注范围限制模型能力。</text>
<rect x="60" y="2440" width="350" height="175" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="235.0" y="2476" font-size="26" text-anchor="middle" font-weight="700">真实上身运动</text>
<text x="235.0" y="2512" font-size="24" text-anchor="middle" font-weight="400">43 × 6D 旋转</text>
<text x="235.0" y="2543" font-size="24" text-anchor="middle" font-weight="400">卷积编码，时间降采样 4</text>
<text x="235.0" y="2574" font-size="24" text-anchor="middle" font-weight="400">T/4 × 64 维 latent</text>
<rect x="505" y="2440" width="350" height="175" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="680.0" y="2476" font-size="26" text-anchor="middle" font-weight="700">4 级残差量化</text>
<text x="680.0" y="2512" font-size="24" text-anchor="middle" font-weight="400">每级 512 项码本</text>
<text x="680.0" y="2543" font-size="24" text-anchor="middle" font-weight="400">逐级修正量化误差</text>
<text x="680.0" y="2574" font-size="24" text-anchor="middle" font-weight="400">解码重建训练动作表示</text>
<rect x="950" y="2440" width="350" height="175" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="1125.0" y="2476" font-size="26" text-anchor="middle" font-weight="700">量化 embedding 加噪</text>
<text x="1125.0" y="2512" font-size="24" text-anchor="middle" font-weight="400">连续空间 DDPM</text>
<text x="1125.0" y="2543" font-size="24" text-anchor="middle" font-weight="400">DiT 预测 ε</text>
<text x="1125.0" y="2574" font-size="24" text-anchor="middle" font-weight="400">均方误差训练</text>
<path d="M410 2525H505" class="flow"/>
<path d="M855 2525H950" class="flow"/>
<rect x="60" y="2720" width="795" height="145" rx="12" fill="#ffffff" stroke="#8aa9bd" stroke-width="2"/>
<text x="457.5" y="2756" font-size="26" text-anchor="middle" font-weight="700">训练条件与监督</text>
<text x="457.5" y="2792" font-size="24" text-anchor="middle" font-weight="400">双路音频、伙伴动作、关系、人格、可选风格特征</text>
<text x="457.5" y="2823" font-size="24" text-anchor="middle" font-weight="400">关系 / 人格来自数据标签；未使用含噪 IPC 交际意图标签</text>
<path d="M855 2795H900V2900H1310V2660H1125V2615" class="dash"/>
<text x="950" y="2760" font-size="24" text-anchor="start" font-weight="400">公开实现需另备</text>
<text x="950" y="2800" font-size="24" text-anchor="start" font-weight="400">VQ-VAE 检查点</text>
<text x="950" y="2840" font-size="24" text-anchor="start" font-weight="400">及 SMPL-H 资产。</text>
<text x="55" y="3040" font-size="23" text-anchor="start" font-weight="400">来源：正式论文图 2、式 1–5、§3；附录 §10。教学重绘，本次未运行模型。</text>
<text x="55" y="3083" font-size="24" text-anchor="start" font-weight="400">论文 300 帧评估与当前代码 96 帧窗口 / 参考前缀协议，应分别核对。</text>
</svg>
