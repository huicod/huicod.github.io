<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1700" viewBox="0 0 1120 1700" role="img" aria-labelledby="title desc">
<title id="title">UniMuMo · 音乐与动作共同生成，文字描述另行训练</title><desc id="desc">依据原文图 2、§3–4 及附录 D 重绘的完整框架教学示意</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4e6b69"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#233d3d} .title{font-size:31px;font-weight:700} .sub{font-size:20px;fill:#59706f} .section{font-size:24px;font-weight:700} .head{font-size:22px;font-weight:700} .body{font-size:20px} .small{font-size:18px;fill:#536b69} .line{fill:none;stroke:#4e6b69;stroke-width:2.5;marker-end:url(#arrow)} .dash{stroke-dasharray:7 5;stroke:#9b8058}</style>
<rect width="1120" height="1700" fill="#fafbf8"/>
<text x="32" y="48" class="title">UniMuMo · 音乐与动作共同生成，文字描述另行训练</text>
<text x="32" y="82" class="sub">依据原文图 2、§3–4 及附录 D 重绘的完整框架教学示意</text>
<rect x="24" y="108" width="1072" height="210" rx="16" fill="#ffffff" stroke="#c8d7d1"/>
<text x="44" y="144" class="section">01  数据准备 · 先建立音乐、动作与描述的训练对应</text>
<rect x="48" y="166" width="222" height="112" rx="10" fill="#e9f1f8" stroke="#a7bfb7"/>
<text x="62" y="198" class="head">音乐 + 独立动作</text>
<text x="62" y="228" class="body">音乐拍点 / 视觉拍点</text>
<text x="62" y="255" class="body">检测减速与节奏事件</text>
<rect x="311" y="166" width="214" height="112" rx="10" fill="#e3f0e9" stroke="#a7bfb7"/>
<text x="325" y="198" class="head">DTW 时间对齐</text>
<text x="325" y="228" class="body">插值改变动作时序</text>
<text x="325" y="255" class="body">保持音乐波形</text>
<rect x="568" y="166" width="222" height="112" rx="10" fill="#fff0d9" stroke="#a7bfb7"/>
<text x="582" y="198" class="head">配对音乐与动作</text>
<text x="582" y="228" class="body">十秒训练片段</text>
<text x="582" y="255" class="body">每首音乐配五段动作</text>
<rect x="833" y="166" width="238" height="112" rx="10" fill="#f1f3ef" stroke="#a7bfb7"/>
<text x="847" y="198" class="head">补充两种文字</text>
<text x="847" y="228" class="body">音乐模型 / 元数据</text>
<text x="847" y="255" class="body">原动作标注 / 模板</text>
<path d="M270 220 H306" class="line"/>
<path d="M525 220 H563" class="line"/>
<path d="M833 220 H795" class="line dash"/>
<rect x="24" y="340" width="1072" height="330" rx="16" fill="#ffffff" stroke="#c8d7d1"/>
<text x="44" y="376" class="section">02  阶段一 · 训练动作编解码器，复用冻结的音乐码本</text>
<rect x="48" y="404" width="245" height="86" rx="10" fill="#e9f1f8" stroke="#a7bfb7"/>
<text x="62" y="436" class="head">音乐编码器 · 冻结</text>
<text x="62" y="466" class="body">32 kHz 波形 → 50 Hz</text>
<rect x="48" y="527" width="245" height="100" rx="10" fill="#e3f0e9" stroke="#a7bfb7"/>
<text x="62" y="559" class="head">动作编码器 · 训练</text>
<text x="62" y="589" class="body">60 Hz / 263 维动作</text>
<text x="62" y="616" class="body">→ 50 Hz / 128 维</text>
<rect x="360" y="445" width="338" height="130" rx="10" fill="#e9f1f8" stroke="#a7bfb7"/>
<text x="374" y="477" class="head">共享 Encodec 残差码本</text>
<text x="374" y="507" class="body">四级，每级 2,048 个条目</text>
<text x="374" y="534" class="body">码本与音乐编解码器冻结</text>
<text x="374" y="561" class="body">输出音乐码或动作码</text>
<rect x="769" y="404" width="301" height="86" rx="10" fill="#e9f1f8" stroke="#a7bfb7"/>
<text x="783" y="436" class="head">音乐解码器 · 冻结</text>
<text x="783" y="466" class="body">音乐码 → 波形</text>
<rect x="769" y="527" width="301" height="100" rx="10" fill="#e3f0e9" stroke="#a7bfb7"/>
<text x="783" y="559" class="head">动作解码器 · 训练</text>
<text x="783" y="589" class="body">动作码 → 263 维运动</text>
<text x="783" y="616" class="body">重建 + 承诺损失</text>
<path d="M293 448 H329 V477 H354" class="line"/>
<path d="M293 577 H329 V538 H354" class="line"/>
<path d="M698 477 H733 V448 H763" class="line"/>
<path d="M698 538 H733 V577 H763" class="line"/>
<path d="M921 627 V649 H170 V631" class="line dash"/>
<text x="424" y="644" class="small">动作重建监督</text>
<rect x="24" y="694" width="1072" height="545" rx="16" fill="#ffffff" stroke="#c8d7d1"/>
<text x="44" y="730" class="section">03  阶段二与生成推理 · 同一步预测两条流的下一组 token</text>
<rect x="48" y="752" width="255" height="90" rx="10" fill="#e9f1f8" stroke="#a7bfb7"/>
<text x="62" y="784" class="head">两组文字 → T5</text>
<text x="62" y="814" class="body">音乐描述 / 动作描述</text>
<rect x="360" y="752" width="430" height="90" rx="10" fill="#e3f0e9" stroke="#a7bfb7"/>
<text x="374" y="784" class="head">分别交叉注意力</text>
<text x="374" y="814" class="body">音乐流看音乐文字，动作流看动作文字</text>
<path d="M303 797 H354" class="line"/>
<rect x="48" y="907" width="255" height="138" rx="10" fill="#e9f1f8" stroke="#a7bfb7"/>
<text x="62" y="939" class="head">音乐 / 动作前缀</text>
<text x="62" y="969" class="body">来自上方共享码本</text>
<text x="62" y="996" class="body">或此前生成的 token</text>
<text x="62" y="1023" class="body">各自应用 delay pattern</text>
<rect x="360" y="884" width="430" height="190" rx="10" fill="#e3f0e9" stroke="#a7bfb7"/>
<text x="374" y="916" class="head">MusicGen 初始化的双流模型</text>
<text x="374" y="946" class="body">跨模态因果注意力</text>
<text x="374" y="973" class="body">两条流均可看双方此前的 token</text>
<text x="374" y="1000" class="body">各自的 embedding、FFN、输出头</text>
<text x="374" y="1027" class="body">同一时间位置编码</text>
<path d="M575 842 V878" class="line"/>
<path d="M303 972 H354" class="line"/>
<rect x="841" y="884" width="230" height="84" rx="10" fill="#fff0d9" stroke="#a7bfb7"/>
<text x="855" y="916" class="head">音乐码 → 波形</text>
<text x="855" y="946" class="body">冻结音乐解码器</text>
<rect x="841" y="1000" width="230" height="84" rx="10" fill="#fff0d9" stroke="#a7bfb7"/>
<text x="855" y="1032" class="head">动作码 → 运动</text>
<text x="855" y="1062" class="body">阶段一动作解码器</text>
<path d="M790 931 H835" class="line"/>
<path d="M790 1036 H835" class="line"/>
<path d="M956 1084 V1124 H170 V1051" class="line"/>
<text x="388" y="1115" class="small">预测码回填前缀，再进行下一步</text>
<text x="52" y="1172" class="body">训练监督  两条真实目标序列 → token 交叉熵，音乐权重 0.85 / 动作 0.15</text>
<text x="52" y="1208" class="body">条件推理  给定音乐则固定音乐前缀；给定动作则固定动作前缀，只采样未知流。</text>
<rect x="24" y="1263" width="1072" height="326" rx="16" fill="#ffffff" stroke="#c8d7d1"/>
<text x="44" y="1299" class="section">04  阶段三与描述推理 · 读取整段模态，再生成文字</text>
<rect x="48" y="1330" width="245" height="118" rx="10" fill="#e9f1f8" stroke="#a7bfb7"/>
<text x="62" y="1362" class="head">音乐或动作 token</text>
<text x="62" y="1392" class="body">另一模态整条置空</text>
<text x="62" y="1419" class="body">沿用阶段一编码</text>
<rect x="348" y="1330" width="421" height="145" rx="10" fill="#e3f0e9" stroke="#a7bfb7"/>
<text x="362" y="1362" class="head">阶段二特征网络 + 全注意力</text>
<text x="362" y="1392" class="body">新全注意力层可训练</text>
<text x="362" y="1419" class="body">已有 embedding / FFN 等冻结</text>
<text x="362" y="1446" class="body">单模态整段特征送往 T5</text>
<rect x="824" y="1330" width="248" height="145" rx="10" fill="#fff0d9" stroke="#a7bfb7"/>
<text x="838" y="1362" class="head">T5 文字解码器</text>
<text x="838" y="1392" class="body">可训练，逐词输出</text>
<text x="838" y="1419" class="body">音乐描述 或 动作描述</text>
<text x="838" y="1446" class="body">文字交叉熵监督</text>
<path d="M293 1390 H342" class="line"/>
<path d="M769 1390 H818" class="line"/>
<path d="M576 1239 V1250 H1084 V1307 H558 V1324" class="line dash"/>
<text x="51" y="1522" class="body">描述训练使用自己的注意力与 T5 分支，生成音乐/动作继续使用上方因果路径。</text>
<text x="51" y="1560" class="small">训练对齐支线提供数据与监督，推理时按已知模态选择相应入口。</text>
<text x="35" y="1632" class="small">蓝色  冻结或复用组件      绿色  对应阶段训练组件      橙色  输出 / 解码结果</text>
<text x="35" y="1668" class="small">实线  数据与特征流      虚线  训练监督或已训练参数的复用</text>
</svg>
