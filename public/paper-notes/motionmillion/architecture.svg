<rect x="297" y="598" width="226" height="105" rx="12" fill="#e0efeb" stroke="#88aa9f" stroke-width="1.6"/>
<text x="410.0" y="643.5" class="name" text-anchor="middle">小波与编码器</text>
<text x="410.0" y="674.5" class="field" text-anchor="middle">分解不同时间频率</text>
<rect x="558" y="598" width="218" height="105" rx="12" fill="#e0efeb" stroke="#88aa9f" stroke-width="1.6"/>
<text x="667.0" y="643.5" class="name" text-anchor="middle">FSQ</text>
<text x="667.0" y="674.5" class="field" text-anchor="middle">逐坐标量化、编号</text>
<rect x="812" y="598" width="224" height="105" rx="12" fill="#edeaf5" stroke="#afa4c5" stroke-width="1.6"/>
<text x="924.0" y="643.5" class="name" text-anchor="middle">动作码索引</text>
<text x="924.0" y="674.5" class="field" text-anchor="middle">用作生成训练目标</text>
<path d="M260 650H293" class="e"/>
<path d="M523 650H554" class="e"/>
<path d="M776 650H808" class="e"/>
