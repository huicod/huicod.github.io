<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1505" viewBox="0 0 1080 1505" role="img" aria-labelledby="title desc">
<title id="title">MotionMillion · 动作怎样成为文字可预测的码？</title><desc id="desc">数据构建从视频和既有库得到动作文本对。小波与 FSQ 学习动作编解码，训练文本模型预测下一个动作码。采样用文字条件和生成的前缀，经解码得到骨骼。</desc>
<defs><marker id="end" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#3c6370"/></marker><marker id="sup" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#976120"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#193c47} .title{font-size:36px;font-weight:700} .sub{font-size:21px;fill:#466471} .stage{font-size:28px;font-weight:700} .num{font-size:20px;fill:#fff;font-weight:700} .name{font-size:25px;font-weight:700} .field{font-size:22px} .tag{font-size:20px;fill:#3d5863} .e{fill:none;stroke:#3c6370;stroke-width:3;stroke-linejoin:round;marker-end:url(#end)} .s{fill:none;stroke:#976120;stroke-width:3;stroke-dasharray:7 5;stroke-linejoin:round;marker-end:url(#sup)} </style>
<rect width="1080" height="1505" rx="20" fill="#f4f7f6"/>
<text x="35" y="54" class="title" text-anchor="start">MotionMillion · 动作怎样成为文字可预测的码？</text>
<text x="37" y="94" class="sub" text-anchor="start">数据建设、动作压缩、条件生成是三个不同阶段。</text>
<path d="M39 129h55" class="e"/>
<text x="109" y="137" class="tag" text-anchor="start">数据流</text>
<path d="M246 129h55" class="s"/>
<text x="315" y="137" class="tag" text-anchor="start">训练监督</text>
<text x="512" y="137" class="tag" text-anchor="start">蓝：输入　绿：运算　黄：监督　紫：输出</text>
<rect x="18" y="165" width="1044" height="325" rx="15" fill="#fff" stroke="#c4d2d0" stroke-width="1.6"/>
<rect x="40" y="185" width="47" height="37" rx="8" fill="#356e68" stroke="#356e68" stroke-width="1.6"/>
<text x="63" y="211" class="num" text-anchor="middle">01</text>
<text x="103" y="215" class="stage" text-anchor="start">数据建设　把不同来源整理为动作—文字对</text>
<rect x="42" y="252" width="266" height="95" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="175.0" y="292.5" class="name" text-anchor="middle">新采人物视频</text>
<text x="175.0" y="323.5" class="field" text-anchor="middle">检测、跟踪，恢复人体</text>
<rect x="390" y="252" width="293" height="95" rx="12" fill="#e0efeb" stroke="#88aa9f" stroke-width="1.6"/>
<text x="536.5" y="277.0" class="name" text-anchor="middle">动作与描述</text>
<text x="536.5" y="308.0" class="field" text-anchor="middle">GVHMR 恢复并过滤轨迹</text>
<text x="536.5" y="339.0" class="field" text-anchor="middle">GPT-4o 描述、LLM 改写</text>
<rect x="753" y="252" width="282" height="95" rx="12" fill="#edeaf5" stroke="#afa4c5" stroke-width="1.6"/>
<text x="894.0" y="292.5" class="name" text-anchor="middle">配对动作库</text>
<text x="894.0" y="323.5" class="field" text-anchor="middle">动作、文本的多种说法</text>
<rect x="42" y="375" width="266" height="74" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="175.0" y="420.5" class="name" text-anchor="middle">既有动作库</text>
