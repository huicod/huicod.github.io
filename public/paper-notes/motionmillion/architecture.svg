<text x="63" y="909" class="num" text-anchor="middle">03</text>
<text x="103" y="913" class="stage" text-anchor="start">训练文本生成器　文字读全句，动作只读前缀</text>
<rect x="42" y="949" width="266" height="82" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="175.0" y="983.0" class="name" text-anchor="middle">文本描述</text>
<text x="175.0" y="1014.0" class="field" text-anchor="middle">T5-XL 词级特征</text>
<rect x="42" y="1050" width="266" height="82" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="175.0" y="1084.0" class="name" text-anchor="middle">真实动作码前缀</text>
<text x="175.0" y="1115.0" class="field" text-anchor="middle">来自已训编解码器</text>
<rect x="393" y="973" width="299" height="130" rx="12" fill="#e0efeb" stroke="#88aa9f" stroke-width="1.6"/>
<text x="542.5" y="1015.5" class="name" text-anchor="middle">混合注意力骨干</text>
<text x="542.5" y="1046.5" class="field" text-anchor="middle">文本侧双向交互</text>
<text x="542.5" y="1077.5" class="field" text-anchor="middle">动作侧因果预测</text>
<rect x="763" y="973" width="271" height="130" rx="12" fill="#fff0d7" stroke="#c3a06c" stroke-width="1.6"/>
<text x="898.5" y="1031.0" class="name" text-anchor="middle">下一枚真实码</text>
<text x="898.5" y="1062.0" class="field" text-anchor="middle">交叉熵更新生成器</text>
<path d="M308 990H339V1010H389" class="e"/>
<path d="M308 1092H339V1070H389" class="e"/>
<path d="M692 1039H759" class="s"/>
<rect x="18" y="1192" width="1044" height="250" rx="15" fill="#fff" stroke="#c4d2d0" stroke-width="1.6"/>
<rect x="40" y="1212" width="47" height="37" rx="8" fill="#356e68" stroke="#356e68" stroke-width="1.6"/>
<text x="63" y="1238" class="num" text-anchor="middle">04</text>
<text x="103" y="1242" class="stage" text-anchor="start">推理　不再提供真实动作或配对描述库</text>
<rect x="42" y="1280" width="283" height="111" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
