<rect x="65" y="747" width="351" height="66" rx="12" fill="#fff0d7" stroke="#c3a06c" stroke-width="1.6"/>
<text x="240.5" y="788.5" class="name" text-anchor="middle">与原动作为重建监督</text>
<path d="M923 703V743" class="e"/>
<path d="M531 780H420" class="s"/>
<rect x="18" y="863" width="1044" height="309" rx="15" fill="#fff" stroke="#c4d2d0" stroke-width="1.6"/>
