<rect x="40" y="530" width="47" height="37" rx="8" fill="#356e68" stroke="#356e68" stroke-width="1.6"/>
<text x="63" y="556" class="num" text-anchor="middle">02</text>
<text x="103" y="560" class="stage" text-anchor="start">训练动作编解码器　先取得能还原动作的离散索引</text>
<rect x="42" y="598" width="218" height="105" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
