<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1550" viewBox="0 0 1080 1550" role="img" aria-labelledby="title desc">
<title id="title">MotionSpaceFlow · 直接在动作帧上学习流场</title><desc id="desc">263D 和 XYZ 分别训练，图中展示各自的注意力和共享的数据流程。仅 XYZ 可把约束投影到指定帧的关节坐标上。</desc>
<defs>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#3e6167"/></marker>
<marker id="train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a57134"/></marker>
</defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1e3843} .line{stroke-linejoin:round;stroke-linecap:round;fill:none}</style>
<rect width="1080" height="1550" rx="20" fill="#f3f7f7"/>
<text x="38" y="59" font-size="38" font-weight="700" text-anchor="start">MotionSpaceFlow · 直接在动作帧上学习流场</text>
<text x="40" y="102" font-size="22" font-weight="400" text-anchor="start" style="fill:#47626b">训练择一表示  →  预测干净终点  →  积分或逐步投影</text>
<rect x="20" y="132" width="1040" height="336" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="174" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">01</text>
<text x="112" y="175" font-size="27" font-weight="700" text-anchor="start">配对训练样本 · 一次训练选择一种表示</text>
<rect x="52" y="207" width="295" height="105" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="68" y="242" font-size="25" font-weight="700" text-anchor="start">增量特征 · 263D</text>
<text x="68" y="277" font-size="21" font-weight="400" text-anchor="start">根速度、旋转、接触等</text>
<rect x="392" y="207" width="294" height="105" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="408" y="242" font-size="25" font-weight="700" text-anchor="start">绝对坐标 · 66D</text>
<text x="408" y="277" font-size="21" font-weight="400" text-anchor="start">22 关节 × XYZ</text>
<rect x="738" y="207" width="287" height="105" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="754" y="242" font-size="25" font-weight="700" text-anchor="start">噪声 x₀ = s ε</text>
<text x="754" y="277" font-size="21" font-weight="400" text-anchor="start">按样本抽流时刻 t</text>
<path d="M197 312 L197 331 L376 331" class="line" stroke="#3e6167" stroke-width="2.8"/>
<path d="M539 312 L539 331 L376 331" class="line" stroke="#3e6167" stroke-width="2.8"/>
<path d="M376 331 L376 355" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M882 312 L882 332 L703 332 L703 355" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="168" y="355" width="744" height="92" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="184" y="390" font-size="25" font-weight="700" text-anchor="start">沿直线路径加噪，得到当前状态 xₜ</text>
<text x="184" y="425" font-size="21" font-weight="400" text-anchor="start">所选真实动作 x₁ 和同形噪声 x₀ 以 t 为权重混合。</text>
<rect x="20" y="489" width="1040" height="464" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="531" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">02</text>
<text x="112" y="532" font-size="27" font-weight="700" text-anchor="start">RA-MMDiT · 决定每一帧能从哪里读信息</text>
<rect x="53" y="565" width="460" height="104" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="69" y="600" font-size="25" font-weight="700" text-anchor="start">文本支路</text>
<text x="69" y="635" font-size="21" font-weight="400" text-anchor="start">DistilBERT（冻结）→ 逐词特征</text>
<rect x="567" y="565" width="460" height="104" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="583" y="600" font-size="25" font-weight="700" text-anchor="start">动作支路</text>
<text x="583" y="635" font-size="21" font-weight="400" text-anchor="start">xₜ → 每帧一个连续词元</text>
<path d="M283 669 L283 691 L449 691 L449 712" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M797 669 L797 691 L641 691 L641 712" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="136" y="712" width="812" height="103" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="152" y="747" font-size="25" font-weight="700" text-anchor="start">联合注意力 · 各模态各自投影，共用键和值的上下文</text>
<text x="152" y="782" font-size="21" font-weight="400" text-anchor="start">263D 动作只读先前和当前帧；XYZ 可读取前后所有有效帧。</text>
<path d="M542 815 L542 844" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="199" y="844" width="478" height="85" rx="11" fill="#e7f3f4" stroke="#85aeb4" stroke-width="2"/>
<text x="215" y="879" font-size="25" font-weight="700" text-anchor="start">输出整段干净终点 x̂₁</text>
<text x="215" y="914" font-size="21" font-weight="400" text-anchor="start">由 x̂₁ 与 xₜ 换算流速。</text>
<rect x="755" y="844" width="271" height="85" rx="11" fill="#fcf2df" stroke="#ceb383" stroke-width="2"/>
<text x="771" y="879" font-size="25" font-weight="700" text-anchor="start">训练监督</text>
<text x="771" y="914" font-size="21" font-weight="400" text-anchor="start">有效帧速度误差</text>
<path d="M677 886 L755 886" class="line" stroke="#a57134" stroke-width="2.8" marker-end="url(#train)" stroke-dasharray="8 7"/>
<rect x="20" y="977" width="1040" height="491" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="1019" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">03</text>
<text x="112" y="1020" font-size="27" font-weight="700" text-anchor="start">推理 · 同一个终点预测，两条更新路径</text>
<rect x="331" y="1051" width="416" height="72" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="539.0" y="1095.0" font-size="24" font-weight="700" text-anchor="middle">按目标帧数初始化噪声</text>
<path d="M539 1123 L539 1146 L271 1146 L271 1164" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M539 1146 L807 1146 L807 1164" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="53" y="1164" width="444" height="106" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="69" y="1199" font-size="25" font-weight="700" text-anchor="start">普通文生动作 · 两种模型均可</text>
<text x="69" y="1234" font-size="21" font-weight="400" text-anchor="start">用预测流速积分，逐步生成所有帧。</text>
<rect x="581" y="1164" width="446" height="106" rx="11" fill="#f1eef8" stroke="#b9a8d1" stroke-width="2"/>
<text x="597" y="1199" font-size="25" font-weight="700" text-anchor="start">空间控制 · 仅 XYZ 模型</text>
<text x="597" y="1234" font-size="21" font-weight="400" text-anchor="start">给定帧、关节、坐标轴的掩码 M 和值 y。</text>
<path d="M275 1270 L275 1309" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="53" y="1309" width="444" height="104" rx="11" fill="#e7f3f4" stroke="#85aeb4" stroke-width="2"/>
<text x="69" y="1344" font-size="25" font-weight="700" text-anchor="start">输出所选表示的动作</text>
<text x="69" y="1379" font-size="21" font-weight="400" text-anchor="start">无需学习式动作解码器。</text>
<path d="M804 1270 L804 1309" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="581" y="1309" width="446" height="104" rx="11" fill="#e7f3f4" stroke="#85aeb4" stroke-width="2"/>
<text x="597" y="1344" font-size="25" font-weight="700" text-anchor="start">将 y 写到预测的干净终点</text>
<text x="597" y="1379" font-size="21" font-weight="400" text-anchor="start">重建下一噪声级状态，末步再次投影。</text>
<path d="M581 1361 L551 1361 L551 1215 L581 1215" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<text x="54" y="1444" font-size="20" font-weight="400" text-anchor="start" style="fill:#47626b">回线表示继续采样；虚线表示仅训练使用的监督。</text>
<text x="40" y="1522" font-size="20" font-weight="400" text-anchor="start" style="fill:#47626b">图源：原文图 2、§3 与附录 C 算法 1–3；图中两种表示使用各自训练的权重。</text>
</svg>
