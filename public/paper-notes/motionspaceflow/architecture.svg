<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1154" viewBox="0 0 1020 1154" role="img" aria-labelledby="title desc">
  <title id="title">MotionSpaceFlow 的训练主干与两条推理路径</title>
  <desc id="desc">文本和逐帧带噪动作经联合注意力预测干净动作。训练采用速度监督。生成时选择普通流积分，或在 XYZ 模型中使用稀疏坐标端点投影。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39465b"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",Arial,sans-serif;fill:#16263b}
      .head{font-size:36px;font-weight:700}.deck{font-size:18px;fill:#43546b}.zone{font-size:22px;font-weight:700}
      .k{font-size:20px;font-weight:700}.v{font-size:17px;fill:#314359}.sm{font-size:15px;fill:#45556c}
      .blue{fill:#eef6ff;stroke:#a8c8e7}.pur{fill:#f5f2fc;stroke:#ccbde4}.green{fill:#eef7f3;stroke:#a7d1bf}.orange{fill:#fff6e9;stroke:#e7c597}
      .card{fill:#fff;stroke-width:1.4}.band{stroke-width:1.5}.edge{fill:none;stroke:#39465b;stroke-width:2;marker-end:url(#arrow)}
      .aux{fill:none;stroke:#667286;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1020" height="1154" fill="#fff"/>
  <text x="34" y="57" class="head">MotionSpaceFlow</text>
  <text x="34" y="86" class="deck">一帧对应一个连续动作词元；按动作表示选择时间依赖与控制方式</text>

  <rect x="27" y="110" width="966" height="239" rx="18" class="band blue"/>
  <text x="53" y="148" class="zone">01　训练输入</text>
  <rect x="54" y="163" width="420" height="72" rx="10" class="card blue"/>
  <text x="71" y="191" class="k">真实动作 x₁</text><text x="71" y="217" class="v">每帧 263D 增量特征，或 22 × 3 个全局坐标</text>
  <rect x="530" y="163" width="434" height="72" rx="10" class="card blue"/>
  <text x="548" y="191" class="k">同形高斯噪声 x₀ = sε</text><text x="548" y="217" class="v">每段共用一个流时间 t，HumanML3D 取 s = 5</text>
  <path d="M265 235V251H423V266" class="edge"/><path d="M746 235V251H644V266" class="edge"/>
  <rect x="225" y="267" width="578" height="65" rx="10" class="card blue"/>
  <text x="245" y="295" class="k">带噪动作 xₜ = (1−t)x₀ + tx₁</text><text x="245" y="319" class="v">保留全部 T 帧，线性投影为每帧一个 512 维词元</text>

  <rect x="27" y="365" width="966" height="290" rx="18" class="band pur"/>
  <text x="53" y="404" class="zone">02　文本与动作联合预测</text>
  <path d="M559 333V435" class="edge"/>
  <rect x="53" y="435" width="286" height="99" rx="10" class="card pur"/>
  <text x="70" y="465" class="k">文字提示 → 逐词表示</text><text x="70" y="492" class="v">冻结 DistilBERT 编码文字</text><text x="70" y="516" class="v">两层文本模块接收流时间 t</text>
  <path d="M339 485H410" class="edge"/>
  <rect x="411" y="435" width="266" height="99" rx="10" class="card pur"/>
  <text x="427" y="465" class="k">RA-MMDiT × 8</text><text x="427" y="492" class="v">词与帧共享注意力范围</text><text x="427" y="516" class="v">按表示选择时间掩码</text>
  <path d="M677 485H748" class="edge"/>
  <rect x="749" y="435" width="215" height="99" rx="10" class="card pur"/>
  <text x="765" y="466" class="k">干净终点预测</text><text x="765" y="493" class="v">仍是 T 帧动作</text><text x="765" y="516" class="v">维度与 x₁ 相同</text>
  <rect x="53" y="560" width="605" height="72" rx="10" class="card pur"/>
  <text x="70" y="587" class="v">263D 模型 · 每帧看前缀和全文，文本只看文本</text>
  <text x="70" y="615" class="v">XYZ 模型 · 用双向注意力，看目标帧之前与之后</text>
  <path d="M856 535V560" class="aux"/>
  <rect x="698" y="560" width="266" height="72" rx="10" class="card pur"/>
  <text x="714" y="588" class="k">训练监督</text><text x="714" y="614" class="v">换算速度，与真实目标比对</text>

  <text x="37" y="699" class="zone">03　推理：每一步利用同一种终点预测，按任务选择采样器</text>
  <rect x="27" y="721" width="454" height="366" rx="16" class="band green"/>
  <rect x="499" y="721" width="494" height="366" rx="16" class="band orange"/>
  <text x="52" y="759" class="k">普通文生动作</text><text x="52" y="785" class="v">263D 或 XYZ 模型，均从整段噪声开始</text>
  <rect x="50" y="805" width="409" height="53" rx="9" class="card green"/>
  <text x="66" y="838" class="v">文字条件 + 当前状态 → 干净动作预测</text>
  <path d="M255 859V885" class="edge"/>
  <rect x="50" y="886" width="409" height="67" rx="9" class="card green"/>
  <text x="66" y="913" class="v">由预测换算速度，更新整段动作</text><text x="66" y="938" class="v">多步 Heun 积分，最后一次用 Euler</text>
  <path d="M255 954V981" class="edge"/>
  <rect x="50" y="983" width="409" height="72" rx="9" class="card green"/>
  <text x="66" y="1011" class="k">输出 T 帧连续动作</text><text x="66" y="1038" class="v">增量特征可积累根运动；XYZ 直接读位置</text>

  <text x="522" y="759" class="k">带关节坐标的生成（仅 XYZ）</text>
  <text x="522" y="785" class="v">推理输入：帧 × 关节 × 轴掩码 M 和目标 y</text>
  <path d="M748 792V807" class="aux"/>
  <rect x="522" y="809" width="447" height="50" rx="9" class="card orange"/>
  <text x="539" y="841" class="v">投影干净终点：只把标记的坐标改成 y</text>
  <path d="M745 859V885" class="edge"/>
  <rect x="522" y="886" width="447" height="67" rx="9" class="card orange"/>
  <text x="539" y="913" class="v">恢复并刷新源噪声，与投影终点重新混合</text><text x="539" y="938" class="v">得到下一噪声水平的状态，回到模型继续采样</text>
  <path d="M745 954V981" class="edge"/>
  <rect x="522" y="983" width="447" height="72" rx="9" class="card orange"/>
  <text x="539" y="1011" class="k">末步硬投影 → 整段 XYZ</text><text x="539" y="1038" class="v">掩码选中的最终坐标等于目标值</text>

  <text x="34" y="1125" class="sm">实线：数据流　 ·　 虚线：训练监督或可选控制　 ·　 教学示意，依据论文图 2、公式 2–14 与算法 1–3 重绘</text>
</svg>
