<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1337" viewBox="0 0 1080 1337" role="img" aria-labelledby="title desc">
<title id="title">UniMotion · 一条时间轴，两种噪声步</title><desc id="desc">动作和局部文字按帧对齐并独立加噪，作为一条拼接序列进入 Transformer。全局句子另作条件。不同噪声组合触发不同输出。</desc>
<defs><marker id="end" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#3c6370"/></marker><marker id="sup" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#976120"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#193c47} .title{font-size:36px;font-weight:700} .sub{font-size:21px;fill:#466471} .stage{font-size:28px;font-weight:700} .num{font-size:20px;fill:#fff;font-weight:700} .name{font-size:25px;font-weight:700} .field{font-size:22px} .tag{font-size:20px;fill:#3d5863} .e{fill:none;stroke:#3c6370;stroke-width:3;stroke-linejoin:round;marker-end:url(#end)} .s{fill:none;stroke:#976120;stroke-width:3;stroke-dasharray:7 5;stroke-linejoin:round;marker-end:url(#sup)} </style>
<rect width="1080" height="1337" rx="20" fill="#f4f7f6"/>
<text x="35" y="54" class="title" text-anchor="start">UniMotion · 一条时间轴，两种噪声步</text>
<text x="37" y="94" class="sub" text-anchor="start">对齐局部词组与姿态，用联合扩散在生成和识别之间切换。</text>
<path d="M39 129h55" class="e"/>
<text x="109" y="137" class="tag" text-anchor="start">数据流</text>
<path d="M246 129h55" class="s"/>
<text x="315" y="137" class="tag" text-anchor="start">训练监督</text>
<text x="512" y="137" class="tag" text-anchor="start">蓝：输入　绿：运算　黄：监督　紫：输出</text>
<rect x="18" y="165" width="1044" height="337" rx="15" fill="#fff" stroke="#c4d2d0" stroke-width="1.6"/>
<rect x="40" y="185" width="47" height="37" rx="8" fill="#356e68" stroke="#356e68" stroke-width="1.6"/>
<text x="63" y="211" class="num" text-anchor="middle">01</text>
<text x="103" y="215" class="stage" text-anchor="start">数据对齐　匹配同一个 AMASS 动作区间</text>
<rect x="42" y="246" width="299" height="112" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="191.5" y="279.5" class="name" text-anchor="middle">人体动作</text>
<text x="191.5" y="310.5" class="field" text-anchor="middle">每帧 263 维特征</text>
<text x="191.5" y="341.5" class="field" text-anchor="middle">记为 x₀</text>
<rect x="390" y="246" width="299" height="112" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="539.5" y="279.5" class="name" text-anchor="middle">BABEL 区间短语</text>
<text x="539.5" y="310.5" class="field" text-anchor="middle">映射到对应帧</text>
<text x="539.5" y="341.5" class="field" text-anchor="middle">CLIP + PCA → y₀</text>
<rect x="735" y="246" width="299" height="112" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="884.5" y="279.5" class="name" text-anchor="middle">HumanML3D 描述</text>
<text x="884.5" y="310.5" class="field" text-anchor="middle">整段句子经 CLIP</text>
<text x="884.5" y="341.5" class="field" text-anchor="middle">可选的全局条件 c</text>
<rect x="180" y="399" width="720" height="72" rx="12" fill="#e0efeb" stroke="#88aa9f" stroke-width="1.6"/>
<text x="540.0" y="443.5" class="name" text-anchor="middle">第 i 帧姿态 xᵢ 和局部词向量 yᵢ 同步，c 对整段有效</text>
<path d="M191 358V395" class="e"/>
<path d="M540 358V395" class="e"/>
<path d="M884 358V395" class="e"/>
<rect x="18" y="522" width="1044" height="382" rx="15" fill="#fff" stroke="#c4d2d0" stroke-width="1.6"/>
<rect x="40" y="542" width="47" height="37" rx="8" fill="#356e68" stroke="#356e68" stroke-width="1.6"/>
<text x="63" y="568" class="num" text-anchor="middle">02</text>
<text x="103" y="572" class="stage" text-anchor="start">联合训练　噪声强度不等于帧的先后位置</text>
<rect x="42" y="609" width="272" height="84" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="178.0" y="644.0" class="name" text-anchor="middle">动作加噪</text>
<text x="178.0" y="675.0" class="field" text-anchor="middle">x₀ → x(tₓ)</text>
<rect x="42" y="714" width="272" height="84" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="178.0" y="749.0" class="name" text-anchor="middle">文字加噪</text>
<text x="178.0" y="780.0" class="field" text-anchor="middle">y₀ → y(tᵧ)</text>
<rect x="399" y="634" width="275" height="143" rx="12" fill="#e0efeb" stroke="#88aa9f" stroke-width="1.6"/>
<text x="536.5" y="683.0" class="name" text-anchor="middle">共享 Transformer</text>
<text x="536.5" y="714.0" class="field" text-anchor="middle">同帧拼接动作和文字</text>
<text x="536.5" y="745.0" class="field" text-anchor="middle">另给 tₓ、tᵧ 和条件 c</text>
<rect x="757" y="608" width="277" height="85" rx="12" fill="#fff0d7" stroke="#c3a06c" stroke-width="1.6"/>
<text x="895.5" y="643.5" class="name" text-anchor="middle">动作头 → x̂₀</text>
<text x="895.5" y="674.5" class="field" text-anchor="middle">对齐干净动作 x₀</text>
<rect x="757" y="723" width="277" height="85" rx="12" fill="#fff0d7" stroke="#c3a06c" stroke-width="1.6"/>
<text x="895.5" y="758.5" class="name" text-anchor="middle">文字头 → ŷ₀</text>
<text x="895.5" y="789.5" class="field" text-anchor="middle">对齐局部词向量 y₀</text>
<path d="M314 651H353V672H395" class="e"/>
<path d="M314 756H353V741H395" class="e"/>
<path d="M674 690H710V650H753" class="s"/>
<path d="M674 732H710V766H753" class="s"/>
<text x="43" y="865" class="sub" text-anchor="start">x 与 y 的均方误差相加。冻结的文本编码器提供目标向量。</text>
<rect x="18" y="924" width="1044" height="349" rx="15" fill="#fff" stroke="#c4d2d0" stroke-width="1.6"/>
<rect x="40" y="944" width="47" height="37" rx="8" fill="#356e68" stroke="#356e68" stroke-width="1.6"/>
<text x="63" y="970" class="num" text-anchor="middle">03</text>
<text x="103" y="974" class="stage" text-anchor="start">推理　已知的一路保持干净，另一条由噪声开始</text>
<rect x="42" y="1007" width="299" height="88" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="191.5" y="1044.0" class="name" text-anchor="middle">给定局部脚本 y</text>
<text x="191.5" y="1075.0" class="field" text-anchor="middle">(tₓ,tᵧ) 从 (T,0) 起步</text>
<rect x="42" y="1144" width="299" height="96" rx="12" fill="#edeaf5" stroke="#afa4c5" stroke-width="1.6"/>
<text x="191.5" y="1185.0" class="name" text-anchor="middle">输出骨骼动作</text>
<text x="191.5" y="1216.0" class="field" text-anchor="middle">按脚本生成连续姿态</text>
<path d="M192 1095V1140" class="e"/>
<rect x="390" y="1007" width="299" height="88" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="539.5" y="1044.0" class="name" text-anchor="middle">给定动作 x</text>
<text x="539.5" y="1075.0" class="field" text-anchor="middle">从 (0,T) 起步</text>
<rect x="390" y="1144" width="299" height="96" rx="12" fill="#edeaf5" stroke="#afa4c5" stroke-width="1.6"/>
<text x="539.5" y="1185.0" class="name" text-anchor="middle">输出逐帧短语</text>
<text x="539.5" y="1216.0" class="field" text-anchor="middle">ŷ → 标签库最近邻</text>
<path d="M540 1095V1140" class="e"/>
<rect x="735" y="1007" width="299" height="88" rx="12" fill="#e8f2fb" stroke="#99b7cb" stroke-width="1.6"/>
<text x="884.5" y="1044.0" class="name" text-anchor="middle">仅给全局句 c</text>
<text x="884.5" y="1075.0" class="field" text-anchor="middle">两路从 (T,T) 起步</text>
<rect x="735" y="1144" width="299" height="96" rx="12" fill="#edeaf5" stroke="#afa4c5" stroke-width="1.6"/>
<text x="884.5" y="1185.0" class="name" text-anchor="middle">同时输出动作和脚本</text>
<text x="884.5" y="1216.0" class="field" text-anchor="middle">用户可改脚本再重生成</text>
<path d="M885 1095V1140" class="e"/>
<text x="37" y="1314" class="tag" text-anchor="start">依据正式稿图 1–2、式 3，及补充材料 D 的算法 1–3。</text>
</svg>
