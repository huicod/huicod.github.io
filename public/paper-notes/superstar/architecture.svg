<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1850" viewBox="0 0 1200 1850" role="img" aria-labelledby="title desc"><title id="title">SuperStar：离线学习与在线流式手势生成</title><desc id="desc">四部分动作表示；完整语音离线合成与真实动捕训练；Qwen回复语音分流到播放及因果动作预测；用户偏好离线回流，非在线强化学习。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#526782"/></marker><marker id="trainarr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9163ad"/></marker></defs><rect width="1200" height="1850" fill="#f7f9fc"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#20334c}.title{font-size:30px;font-weight:700}.section{font-size:24px;font-weight:700}.node{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:17px}.note{font-size:18px;fill:#5a6c81}.edge{fill:none;stroke:#526782;stroke-width:2.6;marker-end:url(#arr)}.train{fill:none;stroke:#9163ad;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#trainarr)}</style>
<text x="40" y="48" class="title" text-anchor="start">SuperStar：边生成回复，边产生共语手势</text>
<text x="40" y="82" class="note" text-anchor="start">论文机制教学重绘 · 实线：数据流　虚线：离线训练、参数复用或反馈</text>
<rect x="35" y="110" width="1130" height="270" rx="18" fill="#fff" stroke="#d9e1ec"/>
<text x="57" y="148" class="section" text-anchor="start">A  离线表示学习：动作 token 来自码本，不是语言标签</text>
<rect x="60" y="180" width="285" height="110" rx="13" fill="#eaf2ff" stroke="#bdcadb" stroke-width="1.5"/>
<text x="202.5" y="211" class="node" text-anchor="middle">真实 SMPL-X 动作</text>
<text x="202.5" y="239" class="body" text-anchor="middle">下身 54D · 上身 78D</text>
<text x="202.5" y="264" class="body" text-anchor="middle">双手 180D · 脸部 106D</text>
<rect x="402" y="180" width="335" height="110" rx="13" fill="#e9f6f1" stroke="#bdcadb" stroke-width="1.5"/>
<text x="569.5" y="211" class="node" text-anchor="middle">四组 TCN → 最近邻量化</text>
<text x="569.5" y="239" class="body" text-anchor="middle">每部位独立编码器与码本</text>
<text x="569.5" y="264" class="body" text-anchor="middle">在线单层 VQ · 时间窗口 w=1</text>
<rect x="795" y="180" width="340" height="110" rx="13" fill="#e9f6f1" stroke="#bdcadb" stroke-width="1.5"/>
<text x="965.0" y="211" class="node" text-anchor="middle">四组离散 token ↔ 解码器</text>
<text x="965.0" y="239" class="body" text-anchor="middle">还原各部位连续动作</text>
<text x="965.0" y="264" class="body" text-anchor="middle">重建、速度/加速度、网格监督</text>
<polyline points="345,235 402,235" class="edge"/>
<polyline points="737,235 795,235" class="edge"/>
<text x="65" y="335" class="note" text-anchor="start">离线教师改用 4 层残差量化（每层 512 项）；在线生成器复用已训练的 VQ 解码器。</text>
<rect x="35" y="410" width="1130" height="465" rx="18" fill="#fff" stroke="#d9e1ec"/>
<text x="57" y="448" class="section" text-anchor="start">B  离线造数据与更新：允许完整语音，不进入实时必经路径</text>
<rect x="60" y="480" width="220" height="95" rx="13" fill="#fff3df" stroke="#bdcadb" stroke-width="1.5"/>
<text x="170.0" y="511" class="node" text-anchor="middle">主题 + 情绪</text>
<text x="170.0" y="539" class="body" text-anchor="middle">如：面对失败 / 平静</text>
<rect x="325" y="480" width="245" height="95" rx="13" fill="#f1eaff" stroke="#bdcadb" stroke-width="1.5"/>
<text x="447.5" y="511" class="node" text-anchor="middle">LLM 对话合成</text>
<text x="447.5" y="539" class="body" text-anchor="middle">生成用户与智能体对话</text>
<rect x="615" y="480" width="210" height="95" rx="13" fill="#fff3df" stroke="#bdcadb" stroke-width="1.5"/>
<text x="720.0" y="511" class="node" text-anchor="middle">TTS / 声音克隆</text>
<text x="720.0" y="539" class="body" text-anchor="middle">回复文本 → 完整语音</text>
<rect x="870" y="480" width="265" height="95" rx="13" fill="#e9f6f1" stroke="#bdcadb" stroke-width="1.5"/>
<text x="1002.5" y="511" class="node" text-anchor="middle">非因果动作教师</text>
<text x="1002.5" y="539" class="body" text-anchor="middle">基础层 + 3 层残差细化</text>
<polyline points="280,527 325,527" class="edge"/>
<polyline points="570,527 615,527" class="edge"/>
<polyline points="825,527 870,527" class="edge"/>
