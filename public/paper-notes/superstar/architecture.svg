<text x="525.0" y="709" class="body" text-anchor="middle">真实 + 合成 + 偏好交互</text>
<text x="525.0" y="734" class="body" text-anchor="middle">成对的回复语音 / 动作</text>
<rect x="870" y="650" width="265" height="110" rx="13" fill="#fff3df" stroke="#bdcadb" stroke-width="1.5"/>
<text x="1002.5" y="681" class="node" text-anchor="middle">合成样本质量过滤</text>
<text x="1002.5" y="709" class="body" text-anchor="middle">节拍、关节范围、滑步</text>
<text x="1002.5" y="734" class="body" text-anchor="middle">异常动作 / 速度检查</text>
