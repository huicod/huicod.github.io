<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1152" viewBox="0 0 840 1152" role="img" aria-labelledby="rmg-title rmg-desc">
  <title id="rmg-title">RMG 的动作表示、黎曼流匹配训练与文本条件采样</title>
  <desc id="rmg-desc">每帧由根平移和各关节的单位四元数组成。训练时从静止姿态附近的包裹高斯先验到真实动作逐因子构造测地线，在同一切空间监督文本条件网络的速度。推理时从新先验样本出发，将网络速度投影并用指数映射推进，得到整段平移和旋转。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#233a46}
      .title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#4c6270}
      .section{font-size:21px;font-weight:700}.head{font-size:17px;font-weight:700}
      .body{font-size:16px}.small{font-size:14px;fill:#47606a}.math{font-size:17px;font-weight:600}
      .panel{fill:#f5f8f8;stroke:#cad5d6;stroke-width:1.3}
      .input{fill:#fff;stroke:#9eafb6}.geom{fill:#e7f2ee;stroke:#8ab1a0}
      .net{fill:#ebf0fa;stroke:#9bacce}.output{fill:#fbf3df;stroke:#c1a66c}
      .input,.geom,.net,.output{stroke-width:1.3}
      .arrow,.wire,.condition{fill:none;stroke:#536c79;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
      .arrow{marker-end:url(#arrow)}.condition{stroke:#517ba3;stroke-dasharray:5 4;marker-end:url(#cond)}
    </style>
    <marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#536c79"/></marker>
    <marker id="cond" viewBox="0 0 9 9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#517ba3"/></marker>
  </defs>
  <rect width="840" height="1152" rx="16" fill="#fdfdfb"/>
  <text class="title" x="25" y="42">RMG 怎样在合法旋转的空间里生成整段动作？</text>
  <text class="sub" x="26" y="72">绿色为几何运算，蓝色为条件与网络，虚线传入文本条件。流时间 t 从 0 走到 1。</text>

  <g aria-label="默认动作表示与可选因子">
    <rect class="panel" x="16" y="93" width="808" height="163" rx="14"/>
    <text class="section" x="33" y="125">动作表示　默认每帧只保留平移和旋转</text>
    <rect class="geom" x="34" y="142" width="448" height="94" rx="10"/>
    <text class="head" x="50" y="168">T + R　根平移 ∈ ℝ³，J 个单位四元数 ∈ (S³)ᴶ</text>
    <text class="body" x="50" y="195">首个四元数给出全局朝向，其余描述局部关节旋转。</text>
    <text class="small" x="50" y="219">22 关节时，每帧 3 + 22 × 4 = 91 个坐标。</text>
    <rect class="input" x="495" y="142" width="311" height="94" rx="10"/>
    <text class="head" x="511" y="168">可选表示因子（消融中比较）</text>
    <text class="body" x="511" y="195">中心化并归一化的局部姿态 P，</text>
    <text class="body" x="511" y="219">以及相邻动作帧的差分 dT、dR、dP。</text>
  </g>

  <g aria-label="训练时的先验与目标">
    <rect class="panel" x="16" y="273" width="808" height="536" rx="14"/>
    <text class="section" x="33" y="306">训练　在测地线上学习如何移动整段动作</text>
    <rect class="input" x="34" y="324" width="379" height="101" rx="10"/>
    <text class="head" x="50" y="350">起点 x₀　从流形先验采样</text>
    <text class="body" x="50" y="377">参考点为零平移、单位旋转的静止姿态。</text>
    <text class="body" x="50" y="403">将高斯噪声投影到切空间，经 Exp 映回流形。</text>
    <rect class="input" x="429" y="324" width="377" height="101" rx="10"/>
    <text class="head" x="445" y="350">终点 x₁　来自配对动捕的真实动作</text>
    <text class="body" x="445" y="377">逐帧取根平移和关节旋转，构成目标序列。</text>
    <text class="body" x="445" y="403">配对文本另行编码，作为生成条件。</text>
    <path class="arrow" d="M224 425V449"/><path class="arrow" d="M618 425V449"/>
    <rect class="geom" x="34" y="450" width="772" height="84" rx="10"/>
    <text class="head" x="50" y="476">随机取流时间 t，在两端之间逐帧、逐因子构造中间状态 xₜ</text>
    <text class="body" x="50" y="505">根平移沿直线插值，关节四元数沿球面测地线插值。各帧使用同一个流时间。</text>
    <path class="wire" d="M420 534V550 M213 550H625"/>
    <path class="arrow" d="M213 550V566"/><path class="arrow" d="M625 550V566"/>
    <rect class="geom" x="34" y="567" width="358" height="101" rx="10"/>
    <text class="head" x="50" y="594">监督　由中间点指向真实终点</text>
    <text class="math" x="50" y="623">目标速度 = Log（xₜ → x₁）/ (1 − t)</text>
    <text class="small" x="50" y="649">它描述生成路径上的变化，作用在整段动作上。</text>
    <rect class="net" x="409" y="567" width="397" height="101" rx="10"/>
    <text class="head" x="425" y="594">预测　文本条件 Transformer</text>
    <text class="body" x="425" y="623">网络接收 xₜ、t 和文本特征，输出向量场。</text>
    <text class="body" x="425" y="649">将网络输出投到 xₜ 当前的切空间。</text>
    <path class="arrow" d="M213 668V712"/><path class="arrow" d="M476 668V712"/>
    <rect class="output" x="34" y="713" width="498" height="75" rx="10"/>
    <text class="head" x="50" y="741">损失　在同一个切空间比较两个速度</text>
    <text class="body" x="50" y="768">用速度均方误差更新网络，学习条件向量场。</text>
    <rect class="net" x="552" y="713" width="254" height="75" rx="10"/>
    <text class="head" x="568" y="741">动作描述 → Qwen 编码</text>
    <text class="body" x="568" y="768">训练和采样均使用文本条件。</text>
    <path class="condition" d="M678 713V670"/>
  </g>

  <g aria-label="推理时的流形积分">
    <rect class="panel" x="16" y="826" width="808" height="265" rx="14"/>
    <text class="section" x="33" y="859">生成　从新先验样本出发，反复沿切向速度走一步</text>
    <rect class="input" x="34" y="878" width="216" height="105" rx="10"/>
    <text class="head" x="50" y="906">新文本 + 新起点 x₀</text>
    <text class="body" x="50" y="935">从同一流形先验抽样，</text>
    <text class="body" x="50" y="960">以整段序列为初始状态。</text>
    <path class="arrow" d="M251 931H270"/>
    <rect class="geom" x="271" y="878" width="299" height="105" rx="10"/>
    <text class="head" x="287" y="906">黎曼 Euler　从 t = 0 积分到 1</text>
    <text class="body" x="287" y="935">条件预测 → 切向投影 → 乘步长 h</text>
    <text class="body" x="287" y="960">→ 用当前点的 Exp 更新整个状态。</text>
    <path class="arrow" d="M571 931H590"/>
    <rect class="output" x="591" y="878" width="215" height="105" rx="10"/>
    <text class="head" x="607" y="906">终点　整段 T + R</text>
    <text class="body" x="607" y="935">每帧含根位置与旋转，</text>
    <text class="body" x="607" y="960">可转换为关节表示。</text>
    <path class="arrow" d="M523 983V1004H316V985"/>
    <text class="small" x="34" y="1036">几何保证　沿旋转因子更新可保持四元数单位范数。足部接触、关节活动范围需另外检验。</text>
    <text class="small" x="34" y="1064">文本支路　HumanML3D 将句特征与流时间融合；MotionMillion 将文本和动作 token 拼成单流。</text>
  </g>
  <text class="small" x="26" y="1124">本站据 arXiv v1 图 2、§3.1–3.3、附录 D.1 与 D.3 绘制。Exp 与 Log 为各因子上的指数映射与对数映射。</text>
</svg>
