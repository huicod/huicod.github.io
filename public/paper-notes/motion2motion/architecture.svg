<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1510" viewBox="0 0 1080 1510" role="img" aria-labelledby="title desc">
<title id="title">Motion2Motion · 用目标角色的整段步态补齐源动作</title><desc id="desc">源动作经稀疏对应映到目标特征空间。查询窗口与目标窗口加权匹配，取回全身，平均重叠帧并在多尺度迭代。</desc>
<defs>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#3e6167"/></marker>
<marker id="train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a57134"/></marker>
</defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1e3843} .line{stroke-linejoin:round;stroke-linecap:round;fill:none}</style>
<rect width="1080" height="1510" rx="20" fill="#f3f7f7"/>
<text x="38" y="59" font-size="38" font-weight="700" text-anchor="start">Motion2Motion · 用目标角色的整段步态补齐源动作</text>
<text x="40" y="102" font-size="22" font-weight="400" text-anchor="start" style="fill:#47626b">源动作形成查询，目标动画形成候选库；全程无网络训练。</text>
<rect x="20" y="131" width="1040" height="338" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="173" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">01</text>
<text x="112" y="174" font-size="27" font-weight="700" text-anchor="start">先让查询和候选用同一套目标通道</text>
<rect x="52" y="206" width="282" height="108" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="68" y="241" font-size="25" font-weight="700" text-anchor="start">源动作</text>
<text x="68" y="276" font-size="21" font-weight="400" text-anchor="start">源角色的骨骼与</text>
<text x="68" y="305" font-size="21" font-weight="400" text-anchor="start">连续姿态</text>
<rect x="365" y="206" width="281" height="108" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="381" y="241" font-size="25" font-weight="700" text-anchor="start">稀疏骨骼对应</text>
<text x="381" y="276" font-size="21" font-weight="400" text-anchor="start">配对矩阵 C 与</text>
<text x="381" y="305" font-size="21" font-weight="400" text-anchor="start">已绑定通道掩码 m</text>
<rect x="700" y="206" width="327" height="108" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="716" y="241" font-size="25" font-weight="700" text-anchor="start">目标角色已有动画</text>
<text x="716" y="276" font-size="21" font-weight="400" text-anchor="start">可给一条或多条目标示范</text>
<path d="M194 314 L194 338 L286 338 L286 364" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M506 314 L506 338 L397 338 L397 364" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M863 314 L863 364" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="52" y="364" width="594" height="82" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="349.0" y="413.0" font-size="24" font-weight="700" text-anchor="middle">映射源通道，初始化未绑定部分</text>
<rect x="700" y="364" width="327" height="82" rx="11" fill="#f1eef8" stroke="#b9a8d1" stroke-width="2"/>
<text x="863.5" y="413.0" font-size="24" font-weight="700" text-anchor="middle">建立目标全身窗口库</text>
<rect x="20" y="490" width="1040" height="481" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="532" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">02</text>
<text x="112" y="533" font-size="27" font-weight="700" text-anchor="start">每个时间窗分别检索，再融合成连续动作</text>
<rect x="52" y="563" width="448" height="95" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="68" y="598" font-size="25" font-weight="700" text-anchor="start">查询窗口</text>
<text x="68" y="633" font-size="21" font-weight="400" text-anchor="start">绑定通道携带源动作节奏。</text>
<rect x="572" y="563" width="455" height="95" rx="11" fill="#f1eef8" stroke="#b9a8d1" stroke-width="2"/>
<text x="588" y="598" font-size="25" font-weight="700" text-anchor="start">候选窗口</text>
<text x="588" y="633" font-size="21" font-weight="400" text-anchor="start">来自目标角色，骨骼与输出相同。</text>
<path d="M277 658 L277 685 L428 685 L428 710" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M800 658 L800 685 L657 685 L657 710" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="158" y="710" width="765" height="97" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="174" y="745" font-size="25" font-weight="700" text-anchor="start">匹配距离 = α × 绑定误差 ＋ (1−α) × 未绑定误差</text>
<text x="174" y="780" font-size="21" font-weight="400" text-anchor="start">取距离最小的候选，带回目标角色整个身体的动作片段。</text>
<path d="M541 807 L541 852" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="158" y="852" width="765" height="94" rx="11" fill="#e7f3f4" stroke="#85aeb4" stroke-width="2"/>
<text x="174" y="887" font-size="25" font-weight="700" text-anchor="start">重叠帧取平均 → 形成新的目标序列</text>
<text x="174" y="922" font-size="21" font-weight="400" text-anchor="start">下一轮以融合结果更新查询；代码还在时间尺度之间上采样。</text>
<path d="M158 900 L84 900 L84 680 L190 680 L190 658" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="20" y="996" width="1040" height="436" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="1038" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">03</text>
<text x="112" y="1039" font-size="27" font-weight="700" text-anchor="start">例：火烈鸟步行 → 猴子步态</text>
<rect x="54" y="1070" width="470" height="103" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="70" y="1105" font-size="25" font-weight="700" text-anchor="start">源端：火烈鸟后肢</text>
<text x="70" y="1140" font-size="21" font-weight="400" text-anchor="start">六对绑定给出应跟随的腿部节奏。</text>
<rect x="562" y="1070" width="465" height="103" rx="11" fill="#f1eef8" stroke="#b9a8d1" stroke-width="2"/>
<text x="578" y="1105" font-size="25" font-weight="700" text-anchor="start">目标端：猴子范例</text>
<text x="578" y="1140" font-size="21" font-weight="400" text-anchor="start">前肢、后肢和尾巴在同一候选窗内。</text>
<path d="M288 1173 L288 1201 L410 1201 L410 1226" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M795 1173 L795 1201 L669 1201 L669 1226" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="127" y="1226" width="827" height="104" rx="11" fill="#e7f3f4" stroke="#85aeb4" stroke-width="2"/>
<text x="143" y="1261" font-size="25" font-weight="700" text-anchor="start">输出以猴子的骨架运动，时长跟随源片</text>
<text x="143" y="1296" font-size="21" font-weight="400" text-anchor="start">前肢与尾部从所选候选取回；已绑定通道优先参与选择。</text>
<text x="57" y="1381" font-size="20" font-weight="400" text-anchor="start" style="fill:#47626b">较大的 α 让检索更看重绑定部位；世界空间中的落脚点仍取决于目标骨架与根运动。</text>
<text x="40" y="1482" font-size="20" font-weight="400" text-anchor="start" style="fill:#47626b">图源：论文图 2、图 7、式 1–3 与算法 1；示例绑定来自作者的 flamingo 映射配置。</text>
</svg>
