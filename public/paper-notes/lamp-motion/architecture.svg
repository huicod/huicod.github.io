<path d="M685 1768H735" class="line"/>
<path d="M1075 1768H1125" class="line"/>
<text x="55" y="1893" class="note">生成器、检索与描述器分别使用预训练成果；描述分支不能笼统标为整个LaMP全部冻结。</text>
