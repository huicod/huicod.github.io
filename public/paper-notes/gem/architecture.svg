<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1550" viewBox="0 0 1080 1550" role="img" aria-labelledby="title desc">
<title id="title">GEM · 同一条时间轴上的估计与生成</title><desc id="desc">观测逐帧注入，文字依生效区间交叉注意，双模式训练共享连续动作去噪器。</desc>
<defs>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#3e6167"/></marker>
<marker id="train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a57134"/></marker>
</defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1e3843} .line{stroke-linejoin:round;stroke-linecap:round;fill:none}</style>
<rect width="1080" height="1550" rx="20" fill="#f3f7f7"/>
<text x="38" y="59" font-size="38" font-weight="700" text-anchor="start">GEM · 同一条时间轴上的估计与生成</text>
<text x="40" y="102" font-size="22" font-weight="400" text-anchor="start" style="fill:#47626b">蓝色是可用条件，绿色是共享参数；金色支路只在训练时提供监督。</text>
<rect x="20" y="132" width="1040" height="510" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="174" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">01</text>
<text x="112" y="175" font-size="27" font-weight="700" text-anchor="start">条件进入共享去噪器的位置</text>
<rect x="52" y="201" width="300" height="112" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="68" y="236" font-size="25" font-weight="700" text-anchor="start">帧对齐观测</text>
<text x="68" y="271" font-size="21" font-weight="400" text-anchor="start">视频、2D 关节、相机</text>
<text x="68" y="300" font-size="21" font-weight="400" text-anchor="start">或音乐特征</text>
<rect x="391" y="201" width="294" height="112" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="407" y="236" font-size="25" font-weight="700" text-anchor="start">每帧动作状态</text>
<text x="407" y="271" font-size="21" font-weight="400" text-anchor="start">带噪连续动作 xₜ</text>
<text x="407" y="300" font-size="21" font-weight="400" text-anchor="start">以及当前噪声级别</text>
<rect x="728" y="201" width="301" height="112" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="744" y="236" font-size="25" font-weight="700" text-anchor="start">区间文本</text>
<text x="744" y="271" font-size="21" font-weight="400" text-anchor="start">描述与起止帧</text>
<text x="744" y="300" font-size="21" font-weight="400" text-anchor="start">经 T5 得到词特征</text>
<path d="M202 313 L202 343" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="52" y="343" width="300" height="73" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="202.0" y="387.5" font-size="24" font-weight="700" text-anchor="middle">缺失项置零 → MLP</text>
<path d="M352 380 L415 380" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M539 313 L539 343" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="415" y="343" width="249" height="73" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="539.5" y="387.5" font-size="24" font-weight="700" text-anchor="middle">逐帧相加</text>
<path d="M539 416 L539 449" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="393" y="449" width="295" height="72" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="540.5" y="493.0" font-size="24" font-weight="700" text-anchor="middle">时间自注意力</text>
<path d="M688 486 L729 486" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M879 313 L879 449" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="729" y="449" width="300" height="72" rx="11" fill="#f1eef8" stroke="#b9a8d1" stroke-width="2"/>
<text x="879.0" y="493.0" font-size="24" font-weight="700" text-anchor="middle">区间交叉注意力</text>
<path d="M880 521 L880 548 L793 548 L793 559" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="486" y="559" width="540" height="62" rx="11" fill="#e7f3f4" stroke="#85aeb4" stroke-width="2"/>
<text x="756.0" y="598.0" font-size="24" font-weight="700" text-anchor="middle">重复 16 层 → 连续三维动作预测 x̂₀</text>
<text x="54" y="476" font-size="21" font-weight="400" text-anchor="start" style="fill:#49626b">动作可跨段传播；</text>
<text x="54" y="512" font-size="21" font-weight="400" text-anchor="start" style="fill:#49626b">每帧只直接读取覆盖该帧的文字。</text>
<rect x="20" y="663" width="1040" height="427" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="705" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">02</text>
<text x="112" y="706" font-size="27" font-weight="700" text-anchor="start">同一组参数 → 两种训练模式</text>
<rect x="52" y="734" width="462" height="102" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="68" y="769" font-size="25" font-weight="700" text-anchor="start">估计模式 · 强观测</text>
<text x="68" y="804" font-size="21" font-weight="400" text-anchor="start">视频或二维骨架 + 最大噪声时刻</text>
<rect x="568" y="734" width="460" height="102" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="584" y="769" font-size="25" font-weight="700" text-anchor="start">生成模式 · 强或弱条件</text>
<text x="584" y="804" font-size="21" font-weight="400" text-anchor="start">有三维真值时，对动作随机加噪。</text>
<path d="M281 836 L281 869" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M799 836 L799 869" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="52" y="869" width="462" height="79" rx="11" fill="#fcf2df" stroke="#ceb383" stroke-width="2"/>
<text x="283.0" y="916.5" font-size="24" font-weight="700" text-anchor="middle">直接回归动作／关节／网格</text>
<rect x="568" y="869" width="460" height="79" rx="11" fill="#fcf2df" stroke="#ceb383" stroke-width="2"/>
<text x="798.0" y="916.5" font-size="24" font-weight="700" text-anchor="middle">恢复干净动作，按可用标注监督</text>
<path d="M281 948 L281 978" class="line" stroke="#a57134" stroke-width="2.8" marker-end="url(#train)" stroke-dasharray="8 7"/>
<rect x="51" y="978" width="977" height="87" rx="11" fill="#fcf2df" stroke="#ceb383" stroke-width="2"/>
<text x="67" y="1013" font-size="25" font-weight="700" text-anchor="start">只有二维标注时，估计结果充当扩散起点</text>
<text x="67" y="1048" font-size="21" font-weight="400" text-anchor="start">临时三维估计 → 加噪 → 生成模式重预测 → 投影到图像，与二维标注比对。</text>
<rect x="20" y="1110" width="1040" height="363" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="1152" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">03</text>
<text x="112" y="1153" font-size="27" font-weight="700" text-anchor="start">输入示例 · 两段视频之间插入文字描述</text>
<rect x="52" y="1184" width="300" height="80" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="202.0" y="1232.0" font-size="24" font-weight="700" text-anchor="middle">前段：视频 A</text>
<rect x="390" y="1184" width="299" height="80" rx="11" fill="#f1eef8" stroke="#b9a8d1" stroke-width="2"/>
<text x="539.5" y="1232.0" font-size="24" font-weight="700" text-anchor="middle">中段：文字及长度</text>
<rect x="727" y="1184" width="299" height="80" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="876.5" y="1232.0" font-size="24" font-weight="700" text-anchor="middle">后段：视频 B</text>
<path d="M201 1264 L201 1305" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M540 1264 L540 1305" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M877 1264 L877 1305" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="51" y="1305" width="977" height="106" rx="11" fill="#e7f3f4" stroke="#85aeb4" stroke-width="2"/>
<text x="67" y="1340" font-size="25" font-weight="700" text-anchor="start">整段同时去噪 → 相机坐标及世界坐标中的人物动作</text>
<text x="67" y="1375" font-size="21" font-weight="400" text-anchor="start">两端匹配视频证据；中间按文字采样，窗口注意力跨相邻时间段传递上下文。</text>
<text x="52" y="1444" font-size="20" font-weight="400" text-anchor="start" style="fill:#47626b">时间轴由用户给定；中段的具体姿势由模型生成。</text>
<text x="40" y="1522" font-size="20" font-weight="400" text-anchor="start" style="fill:#47626b">图源：ICCV 2025 正文图 2–4、式 1–6，补充材料 A、D；教学示意。</text>
</svg>
