<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2640" viewBox="0 0 1600 2640" role="img" aria-labelledby="title desc"><title id="title">ScaleMoGen完整架构教学示意</title><desc id="desc">生成沿尺度循环，层内并行预测二进制残差编码；编辑混合源编码和新编码。训练分开学习骨架感知量化器及下一尺度预测器。主实验HumanML3D十层而SnapMoGen七层。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#456175"/></marker></defs><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#193246}.title{font-size:36px;font-weight:700}.head{font-size:26px;font-weight:700}.body{font-size:22px}.small{font-size:21px}.box{stroke:#9db3c3;stroke-width:2}.edge{fill:none;stroke:#456175;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}</style><rect width="1600" height="2640" fill="#fff"/>
<text x="50" y="60" class="title">ScaleMoGen · 先生成粗尺度，再补充动作细节</text>
<text x="50" y="102" class="small">教学重绘｜图1–2、式1–12、附录A–C｜尺度序列 ≠ 时间播放序列；token ≠ 可读事件计划</text>
<rect x="30" y="140" width="1055" height="1510" rx="24" fill="#f4f8fc" stroke="#d5e1ee"/>
<rect x="1100" y="140" width="470" height="1265" rx="24" fill="#fff7eb" stroke="#e6d6ba"/>
<text x="55" y="187" class="head">推理主线：跨尺度串行，单尺度内并行</text>
<text x="1120" y="187" class="head">可选：文字驱动编辑</text>
<g class="node"><rect class="box" x="55" y="225" width="430" height="169" rx="16" fill="#edf4fa"/>
<text x="73" y="264" class="head">文字 → 冻结 T5-base</text>
<text x="73" y="304" class="body">词级特征经交叉注意力</text>
<text x="73" y="335" class="body">进入每一尺度的预测器</text>
<text x="73" y="366" class="body">编辑时使用目标文字</text>
</g>
<g class="node"><rect class="box" x="535" y="225" width="530" height="169" rx="16" fill="#edf4fa"/>
<text x="553" y="264" class="head">长度与层级配置</text>
<text x="553" y="304" class="body">HumanML3D：10层，先时间后骨架</text>
<text x="553" y="335" class="body">SnapMoGen：7层，始终七部位</text>
<text x="553" y="366" class="body">两套主实验配置分别使用</text>
</g>
<g class="node"><rect class="box" x="340" y="450" width="725" height="169" rx="16" fill="#edf4fa"/>
<text x="358" y="489" class="head">当前尺度 k 的结构前缀</text>
<text x="358" y="529" class="body">累积已有 q₀…qₖ₋₁，拓扑对齐到 hₖ×mₖ</text>
<text x="358" y="560" class="body">首尺度由文字初始化；不是当前时间帧</text>
<text x="358" y="591" class="body">全程保留时间位置与身体分组</text>
</g>
<path class="edge" d="M800 394 V450"/>
<g class="node"><rect class="box" x="340" y="675" width="725" height="169" rx="16" fill="#e0edfb"/>
<text x="358" y="714" class="head">下一尺度 Transformer</text>
<text x="358" y="754" class="body">结构前缀自注意力 + 文字交叉注意力 + 2D RoPE</text>
<text x="358" y="785" class="body">跨层因果掩码：不能读取未来尺度的目标编码</text>
<text x="358" y="816" class="body">逐bit分类；单次预测整张当前尺度图</text>
</g>
<path class="edge" d="M700 619 V675"/>
<path class="edge" d="M265 394 V750 H340"/>
<text x="65" y="616" class="small">相同文字条件</text>
<text x="65" y="648" class="small">送往所有尺度</text>
<g class="node"><rect class="box" x="340" y="900" width="725" height="138" rx="16" fill="#e0edfb"/>
<text x="358" y="939" class="head">候选编码 q新：hₖ × mₖ × d</text>
<text x="358" y="979" class="body">尺度自适应 CFG → 采样当前层二进制位</text>
<text x="358" y="1010" class="body">主模型 d=24；不是巨大词表的单次多分类</text>
</g>
<path class="edge" d="M700 840 V900"/>
<g class="node"><rect class="box" x="340" y="1110" width="725" height="138" rx="16" fill="#edf4fa"/>
<text x="358" y="1149" class="head">采用当前层编码 → 更新累积表示</text>
<text x="358" y="1189" class="body">普通生成直接采用 q新；编辑采用混合编码</text>
<text x="358" y="1220" class="body">拓扑上采样到 n×7，再与已有残差相加</text>
</g>
<path class="edge" d="M700 1038 V1110"/>
<text x="715" y="1070" class="small">普通生成</text>
<path class="edge" d="M340 1170 H300 V525 H340"/>
<text x="65" y="1015" class="small">还有下一尺度</text>
<text x="65" y="1047" class="small">k ← k + 1</text>
<g class="node"><rect class="box" x="340" y="1320" width="725" height="138" rx="16" fill="#e7f4ec"/>
<text x="358" y="1359" class="head">全部尺度完成 → 动作解码器 D</text>
<text x="358" y="1399" class="body">最终连续潜表示 = 各尺度残差上采样之和</text>
<text x="358" y="1430" class="body">冻结解码器恢复完整时间与骨架关节</text>
</g>
<path class="edge" d="M700 1248 V1320"/>
<g class="node"><rect class="box" x="340" y="1510" width="725" height="107" rx="16" fill="#e7f4ec"/>
<text x="358" y="1549" class="head">连续动作输出</text>
<text x="358" y="1589" class="body">HumanML3D：22关节；SnapMoGen：24关节</text>
</g>
<path class="edge" d="M700 1458 V1510"/>
<g class="node"><rect class="box" x="1120" y="225" width="430" height="200" rx="16" fill="#fff0d8"/>
<text x="1138" y="264" class="head">源动作／源编码</text>
<text x="1138" y="304" class="body">论文：源动作经 E + 量化</text>
<text x="1138" y="335" class="body">公开演示：先由源文字生成</text>
<text x="1138" y="366" class="body">缓存各尺度源编码 q源</text>
<text x="1138" y="397" class="body">不是推理时额外训练</text>
</g>
<g class="node"><rect class="box" x="1120" y="460" width="430" height="200" rx="16" fill="#fff0d8"/>
<text x="1138" y="499" class="head">决定保留／重采样位置</text>
<text x="1138" y="539" class="body">粗尺度结构、身体／时间范围</text>
<text x="1138" y="570" class="body">以及与目标文字的语义差异</text>
<text x="1138" y="601" class="body">论文采用二值保留掩码 M</text>
<text x="1138" y="632" class="body">具体实现差异见正文</text>
</g>
<path class="edge" d="M1335 425 V460"/>
<g class="node"><rect class="box" x="1120" y="705" width="430" height="200" rx="16" fill="#ffe8c7"/>
<text x="1138" y="744" class="head">当前尺度编码选择</text>
<text x="1138" y="784" class="body">q目标 = M·q源 + (1−M)·q新</text>
<text x="1138" y="815" class="body">混合结果参与下一层预测</text>
<text x="1138" y="846" class="body">保留潜编码不保证关节不动</text>
<text x="1138" y="877" class="body">代码实际采用逐bit布尔选择</text>
</g>
<path class="edge" d="M1335 660 V705"/>
<path class="edge" d="M1065 960 H1090 V795 H1120"/>
<path class="edge" d="M1335 905 V1170 H1065"/>
<text x="1140" y="1035" class="small">编辑后的当前层编码</text>
<text x="1120" y="1280" class="body">控制边界：文本 + 选择范围</text>
<text x="1120" y="1320" class="body">未提供精确接触／轨迹求解器</text>
<text x="1120" y="1360" class="body">编辑入口与论文泛化描述不同</text>
<text x="55" y="1570" class="small">尺度遍历完成</text>
<text x="55" y="1602" class="small">才解码整段动作</text>
<rect x="30" y="1710" width="1540" height="860" rx="24" fill="#f1f8f2" stroke="#c4dbcd"/>
<text x="55" y="1756" class="head">训练 A：学习动作表示；重建监督优化编码器、量化器与解码器</text>
<g class="node"><rect class="box" x="55" y="1810" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="73" y="1849" class="head">真实动作 → 骨架感知编码器 E</text>
<text x="73" y="1889" class="body">22／24关节输入；时间压缩4倍</text>
<text x="73" y="1920" class="body">可学习骨架池化 → 七个原子部位</text>
<text x="73" y="1951" class="body">得到连续网格 f：n × 7 × d</text>
<text x="73" y="1982" class="body">七部位 = 根、脊柱、头、四肢</text>
</g>
<g class="node"><rect class="box" x="565" y="1810" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="583" y="1849" class="head">多尺度二进制残差量化</text>
<text x="583" y="1889" class="body">Down：时间重采样 + 组内平均</text>
<text x="583" y="1920" class="body">按正负号量化 → 当前层 qᵥ</text>
<text x="583" y="1951" class="body">Up：时间插值 + 组内广播</text>
<text x="583" y="1982" class="body">从残差中减去该层贡献并继续</text>
</g>
<g class="node"><rect class="box" x="1075" y="1810" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="1093" y="1849" class="head">累积残差 → D → 重建动作</text>
<text x="1093" y="1889" class="body">与真实动作比较重建误差</text>
<text x="1093" y="1920" class="body">熵正则鼓励编码使用</text>
<text x="1093" y="1951" class="body">得到多尺度目标编码与解码器</text>
<text x="1093" y="1982" class="body">公开训练代码有额外工程损失</text>
</g>
<path class="edge dash" d="M525 1900 H565"/>
<path class="edge dash" d="M1035 1900 H1075"/>
<path class="edge dash" d="M1545 1900 H1560 V1455 H1090 V1380 H1065"/>
<text x="1115" y="1490" class="small">训练后复用解码器</text>
<text x="55" y="2070" class="head">训练 B：冻结动作量化器和 T5，学习文本条件下的下一尺度预测</text>
<g class="node"><rect class="box" x="55" y="2120" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="73" y="2159" class="head">动作目标编码 + 配对文字</text>
<text x="73" y="2199" class="body">来自训练 A 的各尺度真实bit</text>
<text x="73" y="2230" class="body">T5提供词级文本条件</text>
<text x="73" y="2261" class="body">训练时10%概率丢弃文字</text>
<text x="73" y="2292" class="body">模型不需要LLM动作规划</text>
</g>
<g class="node"><rect class="box" x="565" y="2120" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="583" y="2159" class="head">扰动前缀 → 重新量化残差</text>
<text x="583" y="2199" class="body">随机翻转bit，默认 r=0.3</text>
<text x="583" y="2230" class="body">模拟推理时粗尺度预测误差</text>
<text x="583" y="2261" class="body">使后续层学习补偿不完美前缀</text>
<text x="583" y="2292" class="body">不会产生可执行动作事件</text>
</g>
<g class="node"><rect class="box" x="1075" y="2120" width="470" height="200" rx="16" fill="#e5f2e7"/>
<text x="1093" y="2159" class="head">预测器：逐bit交叉熵监督</text>
<text x="1093" y="2199" class="body">同一尺度并行预测全部位置</text>
<text x="1093" y="2230" class="body">约125M参数的主设置</text>
<text x="1093" y="2261" class="body">学习跨尺度条件分布</text>
<text x="1093" y="2292" class="body">不是在线时间自回归</text>
</g>
<path class="edge dash" d="M525 2210 H565"/>
<path class="edge dash" d="M1035 2210 H1075"/>
<path class="edge dash" d="M55 2210 H40 V800 H340"/>
<text x="55" y="2380" class="body">实线：推理数据流。虚线：训练监督／训练后模块复用。橙色支路仅用于编辑。</text>
<text x="55" y="2424" class="body">HumanML3D论文主设置：10层时间优先、再拆骨架；SnapMoGen：7层，每层都保留七部位。</text>
<text x="55" y="2468" class="body">图按论文机制绘制；当前代码的区域选择、语义判据、HumanML3D层级和CFG设置另有差异。</text>
<text x="55" y="2512" class="body">全部数值来自作者材料；本次仅全文与静态代码核查，未运行模型。</text>
</svg>