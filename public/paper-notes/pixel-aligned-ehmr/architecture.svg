<svg xmlns="http://www.w3.org/2000/svg" width="984" height="1066" viewBox="0 0 984 1066" role="img" aria-labelledby="title desc">
  <title id="title">PEAR 如何从一张图恢复全身网格，并用图像细节训练回归器</title>
  <desc id="desc">推理时，单张人物图像经一套 ViT-B 编码与解码，分别回归 SMPL-X 身体和手的参数、FLAME 头部参数、头部尺度及相机。EHM-s 对齐头根、缩放头部并用线性混合蒙皮得到全身网格。训练先用参数和关键点建立粗对齐，再把预测网格、相机和原图交给已冻结的 GUAVA 渲染器，利用重建图和原图的差异更新 PEAR。</desc>
  <defs>
    <marker id="navy" viewBox="0 0 9 9" markerWidth="8" markerHeight="8" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#356774"/></marker>
    <marker id="ochre" viewBox="0 0 9 9" markerWidth="8" markerHeight="8" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#95602e"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#18383d}
      .title{font-size:32px;font-weight:700}.intro{font-size:18px;fill:#405856}
      .section{font-size:23px;font-weight:700}.heading{font-size:20px;font-weight:700}
      .body{font-size:17px}.small{font-size:15px;fill:#445d60}
      .line,.train,.link{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.3}
      .line{stroke:#356774;marker-end:url(#navy)}.link{stroke:#356774}
      .train{stroke:#95602e;marker-end:url(#ochre)}
      .node rect{stroke-width:1.5}.blue{fill:#edf5f7;stroke:#a6c1ca}
      .green{fill:#eaf4ee;stroke:#9cbbae}.light{fill:#f7f8f4;stroke:#bfcbc0}
      .sand{fill:#fff4e8;stroke:#ceb294}.ambertext{fill:#835025}
    </style>
  </defs>
  <rect x="1" y="1" width="982" height="1064" rx="16" fill="#fff" stroke="#cbd8d6"/>
  <text x="32" y="50" class="title">PEAR 怎样让单张图像里的手指和嘴角对得更准？</text>
  <text x="32" y="86" class="intro">上半图展示每帧运行的回归器，下半图展示怎样用像素差异校正它。</text>
  <path d="M32 111H952" stroke="#d8e2df"/>

  <text x="32" y="154" class="section">推理　单次前向恢复几何与相机</text>
  <g class="node">
    <rect x="32" y="179" width="302" height="89" rx="10" class="light"/>
    <text x="51" y="214" class="heading">单张人物图像</text>
    <text x="51" y="243" class="body">可见全身、上身或仅有头部。</text>
  </g>
  <path d="M334 224H394" class="line"/>
  <g class="node">
    <rect x="398" y="179" width="554" height="89" rx="10" class="blue"/>
    <text x="418" y="214" class="heading">共享 ViT-B 编码器与解码器</text>
    <text x="418" y="243" class="body">同一次图像特征提取支撑各个参数预测头。</text>
  </g>
  <path d="M675 268V285H181M675 285H843" class="link"/>
  <path d="M181 285V307M520 285V307M843 285V307" fill="none" stroke="#356774" stroke-width="2.3"/>
  <path d="M181 301V309" class="line"/><path d="M520 301V309" class="line"/><path d="M843 301V309" class="line"/>
  <g class="node">
    <rect x="32" y="311" width="301" height="102" rx="10" class="blue"/>
    <text x="51" y="346" class="heading">SMPL-X 身体参数头</text>
    <text x="51" y="377" class="body">身体与手部姿态、体形。</text>
  </g>
  <g class="node">
    <rect x="353" y="311" width="340" height="102" rx="10" class="blue"/>
    <text x="372" y="346" class="heading">FLAME 头部参数与尺度</text>
    <text x="372" y="375" class="body">头部支路预测姿态、脸形和表情。</text>
    <text x="372" y="398" class="body">独立尺度头预测头部缩放 s。</text>
  </g>
  <g class="node">
    <rect x="713" y="311" width="239" height="102" rx="10" class="light"/>
    <text x="732" y="346" class="heading">相机参数头</text>
    <text x="732" y="377" class="body">预测相机参数 π。</text>
  </g>
  <path d="M181 413V430H520V413" class="link"/>
  <path d="M350 430V450" class="line"/><path d="M842 413V450" class="line"/>
  <g class="node">
    <rect x="32" y="453" width="661" height="99" rx="10" class="green"/>
    <text x="51" y="489" class="heading">EHM-s → 三维人体网格</text>
    <text x="51" y="520" class="body">在共同头根替换、缩放 FLAME 头，再用 SMPL-X 骨架蒙皮摆姿。</text>
  </g>
  <g class="node">
    <rect x="713" y="453" width="239" height="99" rx="10" class="light"/>
    <text x="732" y="489" class="heading">图像投影</text>
    <text x="732" y="520" class="body">用 π 得到二维位置。</text>
  </g>
  <path d="M693 503H710" class="line"/>

  <path d="M32 583H952" stroke="#d8e2df"/>
  <text x="32" y="624" class="section ambertext">训练　先对齐几何，再检查投回原图的细节</text>
  <g class="node">
    <rect x="32" y="649" width="920" height="113" rx="10" class="sand"/>
    <text x="51" y="685" class="heading ambertext">阶段一　部位参数与关键点监督 → 粗网格</text>
    <text x="51" y="716" class="body">构建伪标签时，ProHMR 提供身体姿态，HaMeR 提供手姿，TEASER 提供脸形与表情。</text>
    <text x="51" y="742" class="body">用 DWPose 二维点精修手和脸。回归器据参数和关键点误差学习初始几何。</text>
  </g>
  <path d="M492 762V782H384V836H155V848" class="train"/>
  <text x="32" y="826" class="heading ambertext">阶段二　可微渲染提供稠密监督</text>
  <g class="node">
    <rect x="32" y="850" width="246" height="96" rx="10" class="sand"/>
    <text x="51" y="886" class="heading">PEAR 预测</text>
    <text x="51" y="917" class="body">EHM-s 网格、相机 π</text>
  </g>
  <path d="M278 898H313" class="train"/>
  <g class="node">
    <rect x="316" y="850" width="321" height="96" rx="10" class="sand"/>
    <text x="335" y="886" class="heading">GUAVA 可微渲染器</text>
    <text x="335" y="917" class="body">结合原图外观渲染重建图像。</text>
  </g>
  <path d="M637 898H671" class="train"/>
  <g class="node">
    <rect x="674" y="850" width="278" height="96" rx="10" class="sand"/>
    <text x="693" y="886" class="heading">重建图与原图比对</text>
    <text x="693" y="917" class="body">L1 像素差 + LPIPS 感知差。</text>
  </g>
  <path d="M813 946V969H155V949" class="train" stroke-dasharray="6 5"/>
  <text x="32" y="1006" class="body">虚线表示损失梯度。第二阶段冻结渲染器、更新 PEAR。部署时只运行上半图。</text>
  <text x="32" y="1036" class="small">据论文图 4、图 5、图 17 与附录的 EHM-s 计算流程重绘。</text>
</svg>
