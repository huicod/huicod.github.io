<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1900" role="img" aria-label="PyraMotion动作表示预训练与条件token预测完整架构"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526174"/></marker></defs><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif;fill:#24364b}.title{font-size:32px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:21px}.note{font-size:18px}.a{fill:none;stroke:#526174;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke:#8263a6;stroke-dasharray:8 6}</style><rect width="1280" height="1900" fill="white"/><text x="40" y="48" class="title">PyraMotion｜先学多尺度动作，再由语音预测token</text><rect x="30" y="82" width="1220" height="410" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="121" class="head">A · 第一阶段训练：APVQ-VAE学习动作表示（真实未来动作只在训练侧）</text><rect x="55" y="150" width="330" height="190" rx="12" fill="#f1eafb" stroke="#aab9cc"/><text x="73" y="186" class="head">动作按部位输入</text><text x="73" y="221" class="body">脸 / 上身 / 手 / 下身</text><text x="73" y="251" class="body">同一动作送入多尺度TCN</text><text x="73" y="281" class="body">细尺度：短时变化</text><text x="73" y="311" class="body">粗尺度：较长运动模式</text><rect x="455" y="150" width="350" height="190" rx="12" fill="#eaf6ef" stroke="#aab9cc"/><text x="473" y="186" class="head">金字塔编码与量化</text><text x="473" y="221" class="body">多个时间长度的latent序列</text><text x="473" y="251" class="body">尺度示意：1 / 2 / 4 / 8</text><text x="473" y="281" class="body">各尺度复用对应码本Z</text><text x="473" y="311" class="body">最近邻量化 → 多条token</text><rect x="865" y="150" width="360" height="190" rx="12" fill="#eaf6ef" stroke="#aab9cc"/><text x="883" y="186" class="head">多尺度重建</text><text x="883" y="221" class="body">各层TransTCN恢复帧率</text><text x="883" y="251" class="body">Mean作为Attention query</text><text x="883" y="281" class="body">各层提供key / value</text><text x="883" y="311" class="body">Mean残差 + Attention结果</text><path d="M385 245H455" class="a"/><path d="M805 245H865" class="a"/><rect x="455" y="382" width="770" height="80" rx="12" fill="#f1eafb" stroke="#aab9cc"/><text x="473" y="418" class="head">表示学习损失</text><text x="473" y="453" class="body">geodesic重建 + 速度/加速度 + 码本/commitment</text><path d="M1045 340V382" class="a"/><path d="M630 382V340" class="a dash"/><text x="57" y="397" class="head">训练后复用：</text><text x="57" y="433" class="body">码本与多尺度解码器</text><rect x="30" y="540" width="1220" height="330" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="579" class="head">B · 第二阶段输入：声学、语音转写、人物身份与短起始动作</text><rect x="55" y="607" width="330" height="95" rx="12" fill="#fff2d9" stroke="#aab9cc"/><text x="73" y="643" class="head">语音波形</text><text x="73" y="678" class="body">onset + amplitude → 节奏r</text><rect x="55" y="735" width="330" height="95" rx="12" fill="#fff2d9" stroke="#aab9cc"/><text x="73" y="771" class="head">同一语音的转写</text><text x="73" y="806" class="body">FastText词向量 → 内容c</text><rect x="455" y="630" width="350" height="170" rx="12" fill="#eaf6ef" stroke="#aab9cc"/><text x="473" y="666" class="head">逐元素融合</text><text x="473" y="701" class="body">α = Softmax(MLP(r,c))</text><text x="473" y="731" class="body">f = α⊙r + (1−α)⊙c</text><text x="473" y="761" class="body">脸与身体分别处理特征</text><rect x="865" y="607" width="360" height="223" rx="12" fill="#fff2d9" stroke="#aab9cc"/><text x="883" y="643" class="head">人物 / 起始条件</text><text x="883" y="678" class="body">speaker ID → embedding</text><text x="883" y="708" class="body">body hint：前8帧动作</text><text x="883" y="738" class="body">其余帧掩码 → Self-Attn</text><text x="883" y="768" class="body">不是独立动作导演文字</text><path d="M385 655H425V680H455" class="a"/><path d="M385 780H425V750H455" class="a"/><rect x="30" y="920" width="1220" height="550" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="959" class="head">C · 分部位条件预测</text><rect x="55" y="990" width="330" height="180" rx="12" fill="#eaf6ef" stroke="#aab9cc"/><text x="73" y="1026" class="head">脸 · 独立完整路线</text><text x="73" y="1061" class="body">融合特征 + speaker</text><text x="73" y="1091" class="body">Mean / TCN → Cross-Attn</text><text x="73" y="1121" class="body">独立从粗到细预测token</text><text x="73" y="1151" class="body">不进入身体三分支求和</text><rect x="455" y="990" width="350" height="160" rx="12" fill="#eaf6ef" stroke="#aab9cc"/><text x="473" y="1026" class="head">身体分支</text><text x="473" y="1061" class="body">hint查询声学/文字条件</text><text x="473" y="1091" class="body">Temporal Cross-Attn</text><text x="473" y="1121" class="body">投影为上身 / 手 / 下身</text><rect x="865" y="990" width="360" height="160" rx="12" fill="#eaf6ef" stroke="#aab9cc"/><text x="883" y="1026" class="head">多尺度latent</text><text x="883" y="1061" class="body">每个部位：Mean Pooling</text><text x="883" y="1091" class="body">与TCN金字塔两条路</text><text x="883" y="1121" class="body">Cross-Attn建立两路联系</text><path d="M630 800V898H420V970H220V990" class="a"/><path d="M630 898V990" class="a"/><path d="M1045 830V970H780V990" class="a"/><path d="M805 1070H865" class="a"/><path d="M55 1135H42V1667H55" class="a"/><rect x="55" y="1220" width="330" height="180" rx="12" fill="#eaf6ef" stroke="#aab9cc"/><text x="73" y="1256" class="head">身体跨部位交互</text><text x="73" y="1291" class="body">Hfull = Hupper + Hhands</text><text x="73" y="1321" class="body">                  + Hlower</text><text x="73" y="1351" class="body">各部位Mean查询Hfull</text><text x="73" y="1381" class="body">脸维持独立路线</text><rect x="455" y="1220" width="350" height="180" rx="12" fill="#eaf6ef" stroke="#aab9cc"/><text x="473" y="1256" class="head">从粗到细预测token</text><text x="473" y="1291" class="body">先粗尺度，再细尺度</text><text x="473" y="1321" class="body">细层参考更粗层预测</text><text x="473" y="1351" class="body">每层输出码本索引分布</text><text x="473" y="1381" class="body">尺度递进 ≠ 逐帧LLM</text><rect x="865" y="1220" width="360" height="180" rx="12" fill="#f1eafb" stroke="#aab9cc"/><text x="883" y="1256" class="head">第二阶段训练目标</text><text x="883" y="1291" class="body">真值动作经APVQ编码</text><text x="883" y="1321" class="body">→ 目标token：交叉熵</text><text x="883" y="1351" class="body">→ 目标latent：MSE</text><text x="883" y="1381" class="body">推理不需要真实未来动作</text><path d="M1045 1150V1198H220V1220" class="a"/><path d="M385 1310H455" class="a"/><text x="890" y="1190" class="note">身体三部位</text><path d="M865 1310H805" class="a dash"/><text x="55" y="1442" class="note">多尺度格点与码本仍是预设结构；attention学习融合权重，没有自动输出语义事件边界。</text><rect x="30" y="1520" width="1220" height="285" rx="16" fill="#f7f9fc" stroke="#c9d2df"/><text x="50" y="1559" class="head">D · 查码本与连续动作重建</text><rect x="55" y="1587" width="330" height="160" rx="12" fill="#eaf2ff" stroke="#aab9cc"/><text x="73" y="1623" class="head">码本lookup</text><text x="73" y="1658" class="body">预测索引 → 各尺度向量</text><text x="73" y="1688" class="body">保留各层不同序列长度</text><text x="73" y="1718" class="body">按对应部位送入解码器</text><rect x="455" y="1587" width="350" height="160" rx="12" fill="#eaf2ff" stroke="#aab9cc"/><text x="473" y="1623" class="head">APVQ解码端 · 复用</text><text x="473" y="1658" class="body">TransTCN → 统一帧率</text><text x="473" y="1688" class="body">各尺度均值与注意力融合</text><text x="473" y="1718" class="body">脸 / 身体各部分连续重建</text><rect x="865" y="1587" width="360" height="160" rx="12" fill="#eaf6ef" stroke="#aab9cc"/><text x="883" y="1623" class="head">组合全身表示</text><text x="883" y="1658" class="body">55关节rot6d + 100表情</text><text x="883" y="1688" class="body">4个接触标签 + 3D平移</text><text x="883" y="1718" class="body">437维/帧 → 角色动作</text><path d="M630 1400V1415H42V1667H55" class="a"/><path d="M385 1667H455" class="a"/><path d="M805 1667H865" class="a"/><path d="M55 453H14V1507H630V1587" class="a dash"/><text x="55" y="1782" class="note">输出接触标签不等于物理解算；动作token不是可读动作词，也没有精确目标轨迹保证。</text><text x="40" y="1848" class="note">依据NeurIPS2025论文图2、式2–14重绘；为教学示意，未运行模型。</text><text x="40" y="1880" class="note">橙：输入　绿：学习模块　蓝：复用表示　紫：训练监督；虚线不属于推理必经路径。</text></svg>