<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1570" viewBox="0 0 1280 1570" role="img" aria-labelledby="title desc"><title id="title">MoSAT · 文字意图、空间方向与时间音频</title><desc id="desc">训练VAE与条件流，分别编码文字、DOA和音频，积分解码后可选梯度编辑。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#526477"/></marker><marker id="purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#8559ab"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#203044}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#526477}</style><rect width="1280" height="1570" fill="#f7fafc"/><text x="38" y="48" class="title">MoSAT · 文字意图、空间方向与时间音频</text><text x="39" y="80" class="small">实线：推理数据流   虚线：训练 / 权重复用   紫色：可选几何编辑</text><rect x="25" y="100" width="1230" height="250" rx="20" fill="#fff" stroke="#ccd7e1"/><text x="48" y="138" class="head">A  先学连续动作表示，再训练条件速度场</text><rect x="50" y="165" width="310" height="110" rx="12" fill="#fff0db" stroke="#9eb2c4"/><text x="67" y="196" class="body">STAM：3,340 × 10秒动作</text><text x="67" y="224" class="body">人工描述 + 核验后的扩写</text><text x="67" y="252" class="body">联合 HumanML3D</text><rect x="405" y="165" width="380" height="110" rx="12" fill="#e8f2fa" stroke="#9eb2c4"/><text x="422" y="196" class="body">Motion VAE · 时间下采样4倍</text><text x="422" y="224" class="body">272维运动 → 连续潜变量</text><text x="422" y="252" class="body">重建 / FK关节 / 根轨迹 / KL</text><rect x="830" y="165" width="395" height="110" rx="12" fill="#e6f4ed" stroke="#9eb2c4"/><text x="847" y="196" class="body">冻结编码器与解码器</text><text x="847" y="224" class="body">z₀：高斯噪声；z₁：真实潜变量</text><text x="847" y="252" class="body">监督速度：z₁ − z₀</text><path d="M360 218 H405" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M785 218 H830" fill="none" stroke="#526477" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="51" y="317" class="small">STAM的文字、声音与DOA进入下方条件分支；VAE先独立训练。</text><rect x="25" y="375" width="1230" height="350" rx="20" fill="#fff" stroke="#ccd7e1"/><text x="48" y="413" class="head">B  条件构建：音频先读取语义与方向草图</text><rect x="50" y="438" width="365" height="110" rx="12" fill="#fff0db" stroke="#9eb2c4"/><text x="67" y="469" class="body">动作文字 → 冻结 CLIP</text><text x="67" y="497" class="body">1句向量 + 前30词token</text><text x="67" y="525" class="body">例如：向左转并举手招呼</text><rect x="465" y="438" width="355" height="110" rx="12" fill="#fff0db" stroke="#9eb2c4"/><text x="482" y="469" class="body">初始声源方向 DOA × 1</text><text x="482" y="497" class="body">相对身体的归一化3D方向</text><text x="482" y="525" class="body">中性 genre 占位 × 1</text><rect x="870" y="438" width="355" height="110" rx="12" fill="#e8f2fa" stroke="#9eb2c4"/><text x="887" y="469" class="body">音频 → 冻结 CLAP</text><text x="887" y="497" class="body">7.5 Hz · 75个时间token</text><text x="887" y="525" class="body">投影到宽512</text><rect x="125" y="594" width="550" height="90" rx="12" fill="#ffead5" stroke="#9eb2c4"/><text x="142" y="625" class="body">Global Sketch S · 33个token</text><text x="142" y="653" class="body">DOA + 句向量 + 30词token + genre</text><rect x="755" y="594" width="470" height="90" rx="12" fill="#f1eafa" stroke="#9eb2c4"/><text x="772" y="625" class="body">Audio-Sketch Fuser → A′</text><text x="772" y="653" class="body">Q=音频A，K/V=草图S；保留A残差</text><path d="M232 548 V573 H300 V594" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M642 548 V573 H510 V594" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M1047 548 V594" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M675 638 H755" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="25" y="750" width="1230" height="460" rx="20" fill="#fff" stroke="#ccd7e1"/><text x="48" y="788" class="head">C  条件流Transformer：从噪声潜变量积分到动作潜变量</text><rect x="50" y="818" width="315" height="110" rx="12" fill="#fff0db" stroke="#9eb2c4"/><text x="67" y="849" class="body">zₜ + 已知动作 / hole mask</text><text x="67" y="877" class="body">t：生成积分时间</text><text x="67" y="905" class="body">默认 CFG = 2.0</text><rect x="420" y="818" width="475" height="325" rx="12" fill="#e8f2fa" stroke="#9eb2c4"/><text x="437" y="849" class="body">默认12层 · 宽512</text><text x="437" y="877" class="body">① Motion Self-Attention</text><text x="437" y="905" class="body">② Sketch Cross-Attention ← S</text><text x="437" y="933" class="body">③ Audio Cross-Attention ← A′</text><text x="437" y="961" class="body">④ 时间调制 AdaLN + FFN</text><text x="437" y="989" class="body">预归一化 + 残差连接</text><text x="437" y="1017" class="body">输出：速度 vθ(zₜ,t,c)</text><rect x="950" y="818" width="275" height="140" rx="12" fill="#e6f4ed" stroke="#9eb2c4"/><text x="967" y="849" class="body">连续流积分</text><text x="967" y="877" class="body">z ← z + 速度 × 步长</text><text x="967" y="905" class="body">从 t=0 到 t=1</text><text x="967" y="933" class="body">得到 75×16 潜变量</text><path d="M365 865 H420" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M895 905 H950" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M1088 958 V1155 H185 V928" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M400 684 V735 H720 V818" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M1060 684 V735 H850 V818" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="52" y="1175" class="small">hole mask：1待生成 / 0锚定；与训练有效位置mask不是同一概念。</text><rect x="25" y="1235" width="1230" height="300" rx="20" fill="#fff" stroke="#ccd7e1"/><text x="48" y="1273" class="head">D  解码连续运动；按需加入测试时几何优化</text><rect x="50" y="1305" width="310" height="145" rx="12" fill="#e6f4ed" stroke="#9eb2c4"/><text x="67" y="1336" class="body">冻结 Motion Decoder</text><text x="67" y="1364" class="body">时间上采样4倍</text><text x="67" y="1392" class="body">300帧 × 272维运动</text><text x="67" y="1420" class="body">根速度积分恢复轨迹</text><rect x="405" y="1305" width="370" height="145" rx="12" fill="#f1eafa" stroke="#9eb2c4"/><text x="422" y="1336" class="body">关节目标 / 根轨迹目标</text><text x="422" y="1364" class="body">每个积分步后：解码 / FK</text><text x="422" y="1392" class="body">目标误差反传修正潜变量</text><text x="422" y="1420" class="body">z ← z − λ∇L（可选）</text><rect x="820" y="1305" width="405" height="145" rx="12" fill="#fff0db" stroke="#9eb2c4"/><text x="837" y="1336" class="body">长动作：重叠窗口接续</text><text x="837" y="1364" class="body">上一段尾部 → 下一段已知上下文</text><text x="837" y="1392" class="body">几何优化不是硬约束证明</text><text x="837" y="1420" class="body">因果流式 / 实体机器人未验证</text><path d="M1225 890 H1240 V1294 H205 V1305" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M360 1378 H405" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M775 1378 H795 V1287 H1230 V1000 H1088" fill="none" stroke="#8559ab" stroke-width="2.4"  marker-end="url(#purple)"/><path d="M1225 255 H1265 V1100 H895" fill="none" stroke="#526477" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="950" y="1080" class="small">速度 MSE 监督</text><path d="M820 1430 H790 V1470 H35 V900 H50" fill="none" stroke="#526477" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="49" y="1505" class="small">依据：arXiv:2609.23797v1 图1、式1–6、附录A；教学重绘。</text></svg>