<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1410" width="1080" height="1410" role="img" aria-labelledby="title desc">
<title id="title">MotionCraft：文本动作骨干与两类音频控制器</title>
<desc id="desc">三个数据集统一为 SMPL-X 连续动作，与真实描述或伪描述配对训练文本条件扩散骨干。每层 MC-Attn 融合静态关系、动态关系和时间注意力。第二阶段分别学习语音或音乐条件，复制部分骨干层为控制器，逐层加入零初始化残差。在推理时根据任务启用对应分支，输出全身动作。</desc>
<defs>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426584"/></marker>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#327467"/></marker>
</defs>
<style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#162f48}.hd{font-size:35px;font-weight:700;fill:white}.sub{font-size:20px;fill:#dfeafa}.h{font-size:25px;font-weight:700}.small{font-size:18px}.item{font-size:21px;font-weight:700}.fine{font-size:16px;fill:#51667a}.tag{font-size:16px;font-weight:700;fill:#416383;letter-spacing:1px}.a,.g,.d{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.a{stroke:#426584;marker-end:url(#blue)}.g{stroke:#327467;marker-end:url(#green)}.d{stroke:#327467;stroke-dasharray:7 5;marker-end:url(#green)}.line{fill:none;stroke:#6d849b;stroke-width:2.4;stroke-linejoin:round}.p{fill:white;stroke:#d6e1eb;stroke-width:2}.b{fill:#e9f2fc;stroke:#88abca;stroke-width:1.5}.f{fill:#f0f4f8;stroke:#a7b9c8;stroke-width:1.5}.c{fill:#e1f2e9;stroke:#7ea99b;stroke-width:1.5}.gold{fill:#fff7e9;stroke:#cfae78;stroke-width:1.5}
</style>
<rect width="1080" height="1410" fill="#f3f6f9"/>
<rect x="18" y="18" width="1044" height="98" rx="12" fill="#183b59"/>
<text class="hd" x="42" y="63">MotionCraft｜段级文本与帧级音频怎样合成全身动作</text>
<text class="sub" x="44" y="95">MC-Bench 数据构建  →  文本扩散骨干  →  分任务音频适配  →  连续 SMPL-X</text>

<rect class="p" x="18" y="131" width="1044" height="252" rx="12"/>
<text class="h" x="43" y="172">01｜把三类动作变成同一种可训练样本</text>
<rect class="f" x="43" y="191" width="310" height="81" rx="8"/>
<rect class="f" x="384" y="191" width="310" height="81" rx="8"/>
<rect class="f" x="725" y="191" width="310" height="81" rx="8"/>
<text class="item" x="58" y="222">HumanML3D</text><text class="small" x="58" y="251">AMASS 动作＋人工动作描述</text>
<text class="item" x="399" y="222">BEAT2</text><text class="small" x="399" y="251">共语手势＋转写模板</text>
<text class="item" x="740" y="222">FineDance</text><text class="small" x="740" y="251">编舞动作＋舞种／曲名模板</text>
<path class="line" d="M198 272V287H880V272 M539 272V287"/><path class="a" d="M539 287V309"/>
<rect class="b" x="120" y="311" width="836" height="49" rx="8"/>
<text class="item" text-anchor="middle" x="538" y="343">文本＋连续 SMPL-X 全身动作（322 维／帧，缺失项用默认值）</text>

<rect class="p" x="18" y="397" width="1044" height="330" rx="12"/>
<text class="h" x="43" y="439">02｜第一阶段 · 学文本条件扩散骨干</text>
<text class="fine" x="43" y="470">Basic 只用 HumanML3D；Mix 联合三个数据来源。输入含受噪动作、扩散步与段级文本。</text>
<rect class="b" x="43" y="492" width="247" height="150" rx="9"/>
<text class="item" x="60" y="529">部位编码与文本编码</text>
<text class="small" x="60" y="564">每帧 → 12 个身体槽</text>
<text class="small" x="60" y="591">文本 → CLIP＋编码层</text>
<text class="fine" x="60" y="622">标准槽宽 64 维</text>
<path class="a" d="M291 566H321"/>
<rect class="b" x="325" y="492" width="440" height="150" rx="9"/>
<text class="item" x="343" y="526">MC-Attn · 每层并行建模</text>
<text class="small" x="343" y="559">① 静态空间图  ·  跨样本共享部位关系</text>
<text class="small" x="343" y="586">② 动态空间图  ·  随样本和帧计算关系</text>
<text class="small" x="343" y="613">③ 时间注意力  ·  每个部位读取动作与文本</text>
<path class="a" d="M766 566H792"/>
<rect class="b" x="797" y="492" width="238" height="150" rx="9"/>
<text class="item" x="812" y="529">三路相加</text>
<text class="small" x="812" y="564">后续层与部位解码</text>
<text class="small" x="812" y="591">预测干净连续动作</text>
<text class="fine" x="812" y="622">由真实动作提供监督</text>
<rect x="43" y="662" width="992" height="43" rx="6" fill="#eef4fa"/>
<text class="small" x="61" y="690">所得骨干保留整体动作和文本引导能力，成为下一阶段各控制器的初始化来源。</text>

<rect class="p" x="18" y="741" width="1044" height="335" rx="12"/>
<text class="h" x="43" y="785">03｜第二阶段 · 为语音与音乐分别训练控制器</text>
<text class="fine" x="43" y="815">绿色为可学习控制路径。两个输入对应不同任务和配对数据；按需要选其中一条。</text>
<rect class="c" x="43" y="839" width="284" height="62" rx="8"/>
<text class="small" x="57" y="865">S2G · BEAT2</text><text class="fine" x="57" y="888">语音韵律特征 · 2 维</text>
<rect class="c" x="43" y="918" width="284" height="62" rx="8"/>
<text class="small" x="57" y="944">M2D · FineDance</text><text class="fine" x="57" y="967">音乐时序特征 · 35 维</text>
<path class="g" d="M328 870H347V905H370"/><path class="g" d="M328 949H347V925H370"/>
<rect class="c" x="375" y="852" width="340" height="121" rx="8"/>
<text class="item" x="390" y="882">选中任务的控制分支</text>
<text class="small" x="390" y="915">音频编码 → 掩码对齐动作帧</text>
<text class="small" x="390" y="946">复制的控制层 → 零初始化投影</text>
<path class="g" d="M716 911H766"/>
<rect class="b" x="771" y="852" width="264" height="121" rx="8"/>
<text class="item" x="786" y="882">主分支 · 复用骨干</text>
<text class="small" x="786" y="915">逐层将残差加到主层</text>
<text class="small" x="786" y="946">保留文本与动作路径</text>
<path class="d" d="M908 974V1000H547V975"/>
<text class="fine" x="610" y="1026">虚线：训练开始时从骨干复制部分层</text>
<text class="fine" x="43" y="1054">主干层冻结；附录另比较身体输入／输出编解码层的全量或局部解冻。</text>

<rect class="p" x="18" y="1091" width="1044" height="266" rx="12"/>
<text class="h" x="43" y="1135">04｜推理 · 从动作噪声逐步去噪</text>
<rect class="f" x="43" y="1164" width="297" height="125" rx="8"/>
<text class="item" x="59" y="1198">选择条件</text>
<text class="small" x="59" y="1233">T2M · 仅文本</text>
<text class="small" x="59" y="1264">S2G／M2D · 文本＋相应音频</text>
<path class="a" d="M341 1225H376"/>
<rect class="b" x="381" y="1164" width="316" height="125" rx="8"/>
<text class="item" x="397" y="1198">迭代反向扩散</text>
<text class="small" x="397" y="1233">每步读取文本与动作</text>
<text class="small" x="397" y="1264">音频任务启用对应控制器</text>
<path class="a" d="M698 1225H736"/>
<rect class="gold" x="741" y="1164" width="294" height="125" rx="8"/>
<text class="item" x="756" y="1198">全身动作序列</text>
<text class="small" x="756" y="1233">根位姿、身体、手与脸</text>
<text class="small" x="756" y="1264">可驱动 SMPL-X 角色</text>
<text class="fine" x="44" y="1324">音频向各帧提供学习到的引导；论文对语音报告节拍对齐，对音乐报告手／身体 FID 和多样性。</text>
<text class="fine" x="28" y="1389">教学重绘 · 依据 MotionCraft 图 3、附录与公开实现 · AAAI 2025</text>
</svg>
