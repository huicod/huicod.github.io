<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620" role="img" aria-labelledby="title desc">
<title id="title">MotionCraft · 文本骨干与两条音频控制支路</title><desc id="desc">数据映射到 SMPL-X，三路 MC-Attn 组合空间时间关系。第二阶段复制部分骨干，控制残差注入冻结主干。</desc>
<defs>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#3e6167"/></marker>
<marker id="train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a57134"/></marker>
</defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1e3843} .line{stroke-linejoin:round;stroke-linecap:round;fill:none}</style>
<rect width="1080" height="1620" rx="20" fill="#f3f7f7"/>
<text x="38" y="59" font-size="38" font-weight="700" text-anchor="start">MotionCraft · 文本骨干与两条音频控制支路</text>
<text x="40" y="102" font-size="22" font-weight="400" text-anchor="start" style="fill:#47626b">先学连续全身动作，再按任务选择语音或音乐控制器；虚线表示参数初始化或训练监督。</text>
<rect x="20" y="131" width="1040" height="355" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="173" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">01</text>
<text x="112" y="174" font-size="27" font-weight="700" text-anchor="start">第一阶段 · 把动作映射到共同表征</text>
<rect x="53" y="205" width="304" height="111" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="69" y="240" font-size="25" font-weight="700" text-anchor="start">HumanML3D</text>
<text x="69" y="275" font-size="21" font-weight="400" text-anchor="start">动作＋自然语言</text>
<text x="69" y="304" font-size="21" font-weight="400" text-anchor="start">Basic / Mix 均使用</text>
<rect x="389" y="205" width="303" height="111" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="405" y="240" font-size="25" font-weight="700" text-anchor="start">BEAT2</text>
<text x="405" y="275" font-size="21" font-weight="400" text-anchor="start">共语手势＋模板文本</text>
<text x="405" y="304" font-size="21" font-weight="400" text-anchor="start">Mix 额外加入</text>
<rect x="722" y="205" width="304" height="111" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="738" y="240" font-size="25" font-weight="700" text-anchor="start">FineDance</text>
<text x="738" y="275" font-size="21" font-weight="400" text-anchor="start">舞蹈＋模板文本</text>
<text x="738" y="304" font-size="21" font-weight="400" text-anchor="start">Mix 额外加入</text>
<path d="M205 316 L205 358" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M541 316 L541 358" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M874 316 L874 358" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="52" y="358" width="976" height="99" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="68" y="393" font-size="25" font-weight="700" text-anchor="start">SMPL-X 连续动作 · 每帧 322 维</text>
<text x="68" y="428" font-size="21" font-weight="400" text-anchor="start">配对文本、扩散时刻与带噪姿态 → 训练文本条件骨干预测干净动作。</text>
<rect x="20" y="508" width="1040" height="394" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="550" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">02</text>
<text x="112" y="551" font-size="27" font-weight="700" text-anchor="start">骨干内部 · 一个 MC-Attn 层如何交换身体信息</text>
<rect x="264" y="578" width="551" height="65" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="539.5" y="618.5" font-size="24" font-weight="700" text-anchor="middle">每帧的身体特征 → 12 个部位槽</text>
<path d="M540 643 L540 665 L204 665 L204 684" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M540 665 L540 684" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M540 665 L875 665 L875 684" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="52" y="684" width="304" height="90" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="68" y="719" font-size="25" font-weight="700" text-anchor="start">静态空间图</text>
<text x="68" y="754" font-size="21" font-weight="400" text-anchor="start">跨样本共享的部位权重</text>
<rect x="389" y="684" width="304" height="90" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="405" y="719" font-size="25" font-weight="700" text-anchor="start">动态图</text>
<text x="405" y="754" font-size="21" font-weight="400" text-anchor="start">每一帧重算部位权重</text>
<rect x="723" y="684" width="304" height="90" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="739" y="719" font-size="25" font-weight="700" text-anchor="start">时间注意力</text>
<text x="739" y="754" font-size="21" font-weight="400" text-anchor="start">同部位跨帧读取动作与文字</text>
<path d="M204 774 L204 796 L455 796 L455 816" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M541 774 L541 816" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M875 774 L875 796 L622 796 L622 816" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="258" y="816" width="568" height="64" rx="11" fill="#e7f3f4" stroke="#85aeb4" stroke-width="2"/>
<text x="542.0" y="856.0" font-size="24" font-weight="700" text-anchor="middle">三路特征相加 → 下一层去噪</text>
<rect x="20" y="925" width="1040" height="592" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="967" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">03</text>
<text x="112" y="968" font-size="27" font-weight="700" text-anchor="start">第二阶段与推理 · 音频特征如何影响冻结主干</text>
<rect x="52" y="997" width="306" height="96" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="68" y="1032" font-size="25" font-weight="700" text-anchor="start">语音 → 手势</text>
<text x="68" y="1067" font-size="21" font-weight="400" text-anchor="start">节奏特征；语音控制器</text>
<rect x="52" y="1126" width="306" height="96" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="68" y="1161" font-size="25" font-weight="700" text-anchor="start">音乐 → 舞蹈</text>
<text x="68" y="1196" font-size="21" font-weight="400" text-anchor="start">音乐特征；音乐控制器</text>
<path d="M358 1045 L396 1045 L396 1108 L434 1108" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M358 1174 L396 1174 L396 1108" class="line" stroke="#3e6167" stroke-width="2.8"/>
<rect x="434" y="1059" width="306" height="100" rx="11" fill="#f1eef8" stroke="#b9a8d1" stroke-width="2"/>
<text x="450" y="1094" font-size="25" font-weight="700" text-anchor="start">按任务选择控制层</text>
<text x="450" y="1129" font-size="21" font-weight="400" text-anchor="start">对齐时间后的音频条件</text>
<rect x="782" y="994" width="245" height="100" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="798" y="1029" font-size="25" font-weight="700" text-anchor="start">预训练骨干</text>
<text x="798" y="1064" font-size="21" font-weight="400" text-anchor="start">复制部分层作初始化</text>
<path d="M782 1045 L763 1045 L763 1108 L740 1108" class="line" stroke="#a57134" stroke-width="2.8" marker-end="url(#train)" stroke-dasharray="8 7"/>
<path d="M588 1159 L588 1229" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="433" y="1229" width="315" height="92" rx="11" fill="#f1eef8" stroke="#b9a8d1" stroke-width="2"/>
<text x="449" y="1264" font-size="25" font-weight="700" text-anchor="start">零初始化线性层</text>
<text x="449" y="1299" font-size="21" font-weight="400" text-anchor="start">把残差注入对应主干层</text>
<path d="M748 1275 L773 1275" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="773" y="1229" width="254" height="92" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="789" y="1264" font-size="25" font-weight="700" text-anchor="start">主干去噪层</text>
<text x="789" y="1299" font-size="21" font-weight="400" text-anchor="start">复用主干参数</text>
<path d="M902 1094 L902 1229" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M902 1321 L902 1371" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="433" y="1371" width="594" height="89" rx="11" fill="#e7f3f4" stroke="#85aeb4" stroke-width="2"/>
<text x="449" y="1406" font-size="25" font-weight="700" text-anchor="start">输出 SMPL-X 全身序列</text>
<text x="449" y="1441" font-size="21" font-weight="400" text-anchor="start">文本任务可直接走骨干；两类声音分支分别训练。</text>
<text x="54" y="1489" font-size="20" font-weight="400" text-anchor="start" style="fill:#47626b">来源缺少的脸部数据按方案填充；同一输出尺寸不代表三个数据集具有相同的监督。</text>
<text x="40" y="1592" font-size="20" font-weight="400" text-anchor="start" style="fill:#47626b">图源：AAAI 2025 / arXiv v3 图 3、§4、附录训练细节与作者 ControlNet 实现。</text>
</svg>
