<text x="600.0" y="3214" font-size="24" font-weight="700" text-anchor="middle" style="fill:#19334a">输出：同时包含讲话手势与额外动作意图的全身序列</text>
<text x="600.0" y="3247" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">长语音：取本段末尾 4 个潜位置作为下一窗口种子，重复本流程</text>
<text x="600.0" y="3277" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">约束边界：没有椅面 / 杯柄目标输入，不保证精确接触或解决同部位冲突</text>
<text x="600" y="3405" font-size="20" font-weight="400" text-anchor="middle" style="fill:#526477">实线：表示与预测传递　虚线：训练后冻结 / 复用　所有推理分支共享网络权重</text>
<text x="600" y="3440" font-size="20" font-weight="400" text-anchor="middle" style="fill:#526477">教学重绘，不是作者原图或本次运行结果；主张与代码版本以正文引用为准</text>
