<text x="230.0" y="2437" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">同一 Eθ 读取全身 Zₜ</text>
<text x="230.0" y="2467" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">U ＋ wₐ(S−U) ＋ wₚ(Tᵤ−U)</text>
