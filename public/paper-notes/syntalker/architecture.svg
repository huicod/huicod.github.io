<text x="600.0" y="2704" font-size="24" font-weight="700" text-anchor="middle" style="fill:#19334a">按掩码求和 → 同一个全身干净潜变量预测 Ẑ₀ᵐⁱˣ</text>
<text x="600.0" y="2737" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">Mᵤ ⊙ Ẑ₀ᵘ ＋ Mₕ ⊙ Ẑ₀ʰ ＋ Mₗ ⊙ Ẑ₀ˡ；组合发生在每个去噪步骤</text>
