<text x="600.0" y="3044" font-size="24" font-weight="700" text-anchor="middle" style="fill:#19334a">分开三个潜变量通道 → 冻结 RVQ-VAE 解码器</text>
<text x="600.0" y="3077" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">上身解码器＋手指解码器＋下身解码器 → 全身动作特征</text>
<text x="600.0" y="3107" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">公开 h3d623 分支还需运动恢复 / 人体模型转换，再用于渲染</text>
