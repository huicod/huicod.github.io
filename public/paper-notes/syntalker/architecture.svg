<text x="600.0" y="2404" font-size="24" font-weight="700" text-anchor="middle" style="fill:#19334a">手指条件分支</text>
<text x="600.0" y="2437" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">同一 Eθ 读取全身 Zₜ</text>
<text x="600.0" y="2467" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">各自条件与引导权重</text>
<text x="600.0" y="2497" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">保留手指通道 Mₕ</text>
<rect x="805" y="2370" width="330" height="175" rx="12" fill="#f0eafa" stroke="#b1a0cc" stroke-width="2"/>
<text x="970.0" y="2404" font-size="24" font-weight="700" text-anchor="middle" style="fill:#19334a">下身条件分支</text>
<text x="970.0" y="2437" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">同一 Eθ 读取全身 Zₜ</text>
<text x="970.0" y="2467" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">各自条件与引导权重</text>
<text x="970.0" y="2497" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">保留下身通道 Mₗ</text>
<text x="600" y="3350" font-size="20" font-weight="400" text-anchor="middle" style="fill:#526477">U：无条件全身预测　S：仅语音预测　Tₒ：仅该部位文字条件下的全身预测</text>
<path d="M230 2545 V2620 H600 V2670" class="arrow"/>
<path d="M600 2545 V2670" class="arrow"/>
<path d="M970 2545 V2620 H600 V2670" class="arrow"/>
