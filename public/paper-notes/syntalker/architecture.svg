<text x="600.0" y="2907" font-size="21" font-weight="400" text-anchor="middle" style="fill:#19334a">正文描述 DDPM；当前文本控制代码采用 DDIM</text>
<path d="M1135 2895 H1152 V2237 H1135" class="arrow"/>
<text x="1038" y="2824" font-size="19" font-weight="400" text-anchor="middle" style="fill:#526477">t &gt; 0：再循环</text>
<path d="M600 2950 V3010" class="arrow"/>
<text x="690" y="2988" font-size="19" font-weight="400" text-anchor="middle" style="fill:#526477">去噪结束</text>
