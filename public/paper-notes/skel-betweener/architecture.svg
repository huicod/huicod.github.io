<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1550" viewBox="0 0 1080 1550" role="img" aria-labelledby="title desc">
<title id="title">SKEL-Betweener · 把关节曲线变成下一轮把手</title><desc id="desc">首尾插帧或底片编辑构成两个入口；图注意力读取骨架和相邻帧。解码旋转驱动角色，界面把新把手反馈到下一轮。</desc>
<defs>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#3e6167"/></marker>
<marker id="train" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#a57134"/></marker>
</defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1e3843} .line{stroke-linejoin:round;stroke-linecap:round;fill:none}</style>
<rect width="1080" height="1550" rx="20" fill="#f3f7f7"/>
<text x="38" y="59" font-size="38" font-weight="700" text-anchor="start">SKEL-Betweener · 把关节曲线变成下一轮把手</text>
<text x="40" y="102" font-size="22" font-weight="400" text-anchor="start" style="fill:#47626b">两种单独训练的模型，共用时空骨骼图结构；实线走预测，虚线标训练信号。</text>
<rect x="20" y="132" width="1040" height="317" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="174" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">01</text>
<text x="112" y="175" font-size="27" font-weight="700" text-anchor="start">选择当前任务，再建立 T × J 个节点</text>
<rect x="52" y="206" width="460" height="104" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="68" y="241" font-size="25" font-weight="700" text-anchor="start">插帧版</text>
<text x="68" y="276" font-size="21" font-weight="400" text-anchor="start">首尾姿态＋稀疏把手 → 插值初值</text>
<rect x="568" y="206" width="459" height="104" rx="11" fill="#f1eef8" stroke="#b9a8d1" stroke-width="2"/>
<text x="584" y="241" font-size="25" font-weight="700" text-anchor="start">编辑版 ★</text>
<text x="584" y="276" font-size="21" font-weight="400" text-anchor="start">已有动作作底片＋本轮新把手</text>
<path d="M282 310 L282 331 L417 331 L417 351" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M797 310 L797 331 L667 331 L667 351" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="151" y="351" width="781" height="76" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="541.5" y="397.0" font-size="24" font-weight="700" text-anchor="middle">同一节点分别记录位置、朝向、足接触及各自掩码</text>
<rect x="20" y="473" width="1040" height="478" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="515" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">02</text>
<text x="112" y="516" font-size="27" font-weight="700" text-anchor="start">18 层局部传播 · 看一眼第 t 帧左肘的邻域</text>
<rect x="52" y="552" width="282" height="92" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="68" y="587" font-size="25" font-weight="700" text-anchor="start">节点身份 → Q／K</text>
<text x="68" y="622" font-size="21" font-weight="400" text-anchor="start">关节、时间、约束掩码</text>
<rect x="52" y="679" width="282" height="92" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="68" y="714" font-size="25" font-weight="700" text-anchor="start">节点状态 → V</text>
<text x="68" y="749" font-size="21" font-weight="400" text-anchor="start">位置、朝向、接触</text>
<path d="M334 598 L363 598 L363 672 L386 672" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M334 726 L363 726 L363 672" class="line" stroke="#3e6167" stroke-width="2.8"/>
<rect x="387" y="631" width="178" height="83" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="476.0" y="680.5" font-size="24" font-weight="700" text-anchor="middle">局部注意力</text>
<rect x="714" y="552" width="185" height="61" rx="11" fill="#f7f8fa" stroke="#bbc6ce" stroke-width="2"/>
<text x="806.5" y="590.5" font-size="24" font-weight="700" text-anchor="middle">同帧左肩</text>
<rect x="715" y="640" width="184" height="67" rx="11" fill="#e7f3f4" stroke="#85aeb4" stroke-width="2"/>
<text x="807.0" y="681.5" font-size="24" font-weight="700" text-anchor="middle">t 帧左肘</text>
<rect x="713" y="739" width="185" height="61" rx="11" fill="#f7f8fa" stroke="#bbc6ce" stroke-width="2"/>
<text x="805.5" y="777.5" font-size="24" font-weight="700" text-anchor="middle">同帧左腕</text>
<rect x="588" y="646" width="108" height="55" rx="11" fill="#f7f8fa" stroke="#bbc6ce" stroke-width="2"/>
<text x="642.0" y="681.5" font-size="24" font-weight="700" text-anchor="middle">t−1</text>
<rect x="918" y="646" width="106" height="55" rx="11" fill="#f7f8fa" stroke="#bbc6ce" stroke-width="2"/>
<text x="971.0" y="681.5" font-size="24" font-weight="700" text-anchor="middle">t＋1</text>
<path d="M806 613 L806 640" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M806 739 L806 707" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M696 673 L715 673" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M918 673 L899 673" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<path d="M478 714 L478 780 L563 780 L563 829" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="147" y="829" width="780" height="93" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="163" y="864" font-size="25" font-weight="700" text-anchor="start">逐层传递，生成未知节点状态</text>
<text x="163" y="899" font-size="21" font-weight="400" text-anchor="start">已给定把手继续作为邻居可读，解码得到旋转、位置与接触。</text>
<rect x="20" y="973" width="1040" height="498" rx="16" fill="#fff" stroke="#c5d3d2" stroke-width="2"/>
<text x="48" y="1015" font-size="23" font-weight="700" text-anchor="start" style="fill:#15776d">03</text>
<text x="112" y="1016" font-size="27" font-weight="700" text-anchor="start">网络输出 → 动画师回看 → 新一轮编辑</text>
<rect x="53" y="1053" width="429" height="104" rx="11" fill="#fcf2df" stroke="#ceb383" stroke-width="2"/>
<text x="69" y="1088" font-size="25" font-weight="700" text-anchor="start">训练时的监督</text>
<text x="69" y="1123" font-size="21" font-weight="400" text-anchor="start">重建＋把手误差＋足接触损失</text>
<rect x="560" y="1053" width="466" height="104" rx="11" fill="#e7f3f4" stroke="#85aeb4" stroke-width="2"/>
<text x="576" y="1088" font-size="25" font-weight="700" text-anchor="start">角色输出</text>
<text x="576" y="1123" font-size="21" font-weight="400" text-anchor="start">局部旋转驱动骨架，得到关节轨迹。</text>
<path d="M560 1105 L482 1105" class="line" stroke="#a57134" stroke-width="2.8" marker-end="url(#train)" stroke-dasharray="8 7"/>
<path d="M793 1157 L793 1206" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="560" y="1206" width="466" height="99" rx="11" fill="#edf4fb" stroke="#a8bfd6" stroke-width="2"/>
<text x="576" y="1241" font-size="25" font-weight="700" text-anchor="start">选轨迹上的一点</text>
<text x="576" y="1276" font-size="21" font-weight="400" text-anchor="start">帧 t、关节 j 与新的世界位置</text>
<path d="M560 1256 L488 1256" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="53" y="1206" width="435" height="99" rx="11" fill="#e6f3ee" stroke="#87b4a5" stroke-width="2"/>
<text x="69" y="1241" font-size="25" font-weight="700" text-anchor="start">用新把手再次预测</text>
<text x="69" y="1276" font-size="21" font-weight="400" text-anchor="start">可给 ★ 版提供要保留的原动作。</text>
<path d="M270 1206 L270 1181 L520 1181 L520 1105 L560 1105" class="line" stroke="#3e6167" stroke-width="2.8" marker-end="url(#flow)"/>
<rect x="53" y="1359" width="973" height="79" rx="11" fill="#fcf2df" stroke="#ceb383" stroke-width="2"/>
<text x="539.5" y="1406.5" font-size="24" font-weight="700" text-anchor="middle">★ 训练配对：把手 A 合成底片 → 加入另一组把手 B → 学习重建原动捕</text>
<text x="40" y="1522" font-size="20" font-weight="400" text-anchor="start" style="fill:#47626b">图源：正式论文图 2、3、5、7 与 §3–4；右侧邻域中的 t−1、t＋1 均指同侧左肘。</text>
</svg>
