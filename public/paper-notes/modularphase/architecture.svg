<text x="40" y="72" fill="#173b40" font-size="36" font-weight="700" text-anchor="start">ModularPhase · 分部位相位控制</text>
<text x="40" y="112" fill="#173b40" font-size="23" font-weight="400" text-anchor="start">右手挥得更大时，哪些输入被改动，哪一层得到新的信息？</text>
<text x="40" y="32" fill="#19766f" font-size="18" font-weight="700" text-anchor="start">arXiv 2026   /   文本生成动作</text>
<text x="108" y="154" fill="#173b40" font-size="19" font-weight="400" text-anchor="start">动作、特征或条件</text>
<text x="430" y="154" fill="#87644b" font-size="19" font-weight="400" text-anchor="start">训练目标或真值</text>
<text x="42" y="220" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">01</text>
<text x="94" y="220" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">从参考速度构造可编辑的相位条件</text>
<text x="44" y="254" fill="#476064" font-size="19" font-weight="400" text-anchor="start">每个部位各有一套周期自编码器。先学习速度重建，之后固定提取器。</text>
<rect data-node="ref" x="44" y="286" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="317" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">参考全身动作</text>
<text x="59" y="346" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">取各关节速度</text>
<text x="59" y="371" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">分为五个身体区域</text>
<rect data-node="pae" x="404" y="286" width="272" height="99" rx="12" fill="#e6efe0" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="317" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">分部位周期编码</text>
<text x="419" y="346" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">每区 2 个振荡通道</text>
<text x="419" y="371" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">得到 A、F、S、B</text>
<rect data-node="rec" x="764" y="286" width="272" height="99" rx="12" fill="#f4e6dc" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="317" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">重建速度</text>
<text x="779" y="346" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">周期解码器预测短窗速度</text>
<text x="779" y="371" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">与参考速度求重建误差</text>
<rect data-node="edit" x="404" y="462" width="272" height="99" rx="12" fill="#f6e8ca" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="493" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">用户编辑指定区域</text>
<text x="419" y="522" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">改幅度 A、频率 F 或相移 S</text>
<text x="419" y="547" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">其余部位保留输入参数</text>
<rect data-node="man" x="764" y="462" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="493" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">合并相位向量 P</text>
<text x="779" y="522" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">每通道为二维圆周坐标</text>
<text x="779" y="547" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">每帧 5 × 2 × 2 = 20 维</text>
<text x="360" y="323" text-anchor="middle" class="edge-label" fill="#19766f">速度窗</text>
<text x="720" y="323" text-anchor="middle" class="edge-label" fill="#866044">预训练</text>
<text x="605" y="428" text-anchor="middle" class="edge-label" fill="#19766f">冻结后读取</text>
<text x="720" y="503" text-anchor="middle" class="edge-label" fill="#19766f">A、F、S</text>
<text x="42" y="650" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">02</text>
<text x="94" y="650" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">用九个残差把 P 送进全身生成器</text>
<text x="44" y="684" fill="#476064" font-size="19" font-weight="400" text-anchor="start">相位条件提供局部变化。文本、扩散时刻和当前潜状态仍是生成器的输入。</text>
<rect data-node="cond" x="44" y="721" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="752" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">相位条件 P</text>
<text x="59" y="781" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">时间卷积与投影头</text>
<text x="59" y="806" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">得到对齐动作潜空间的 g</text>
<rect data-node="ctrl" x="404" y="721" width="272" height="99" rx="12" fill="#dceeed" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="752" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">可训练 ControlNet</text>
<text x="419" y="781" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">由主干初始化，读取</text>
<text x="419" y="806" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">zₜ + MLP(g)、t、文本 c</text>
<rect data-node="base" x="764" y="721" width="272" height="99" rx="12" fill="#e6efe0" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="752" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">冻结生成主干</text>
<text x="779" y="781" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">读取 zₜ、t 和文本 c</text>
<text x="779" y="806" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">对应层加上控制残差</text>
<rect data-node="txt" x="44" y="879" width="272" height="99" rx="12" fill="#edf1f2" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="910" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">文本与采样状态</text>
<text x="59" y="939" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">文本编码 c、时刻 t</text>
<text x="59" y="964" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">当前带噪潜状态 zₜ</text>
<rect data-node="dec" x="764" y="879" width="272" height="99" rx="12" fill="#deece7" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="910" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">冻结动作 VAE 解码</text>
<text x="779" y="939" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">从预测的干净潜变量</text>
<text x="779" y="964" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">还原完整的全身动作</text>
<text x="360" y="755" text-anchor="middle" class="edge-label" fill="#19766f">g</text>
<text x="720" y="755" text-anchor="middle" class="edge-label" fill="#19766f">逐层注入</text>
<text x="421" y="918" text-anchor="middle" class="edge-label" fill="#19766f">zₜ、t、c</text>
<text x="969" y="855" text-anchor="middle" class="edge-label" fill="#19766f">干净潜变量</text>
<text x="547" y="988" text-anchor="middle" class="edge-label" fill="#19766f">原主干也接收 zₜ、t、c</text>
<text x="42" y="1068" fill="#19766f" font-size="20" font-weight="700" text-anchor="start">03</text>
<text x="94" y="1068" fill="#173b40" font-size="27" font-weight="700" text-anchor="start">从解码后的动作回读控制效果</text>
<text x="44" y="1102" fill="#476064" font-size="19" font-weight="400" text-anchor="start">训练时对选定时空位置施加相位一致性；编辑完成后也可检查真实骨骼怎样变化。</text>
<rect data-node="pred" x="44" y="1125" width="272" height="99" rx="12" fill="#e6efe0" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="59" y="1156" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">生成动作</text>
<text x="59" y="1185" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">用已固定的部位提取器</text>
<text x="59" y="1210" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">重算输出相位 P̂</text>
<rect data-node="loss" x="404" y="1125" width="272" height="99" rx="12" fill="#f4e6dc" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="419" y="1156" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">掩码内的 L1 距离</text>
<text x="419" y="1185" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">比较输出 P̂ 与参考 P</text>
<text x="419" y="1210" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">与生成目标共同训练</text>
<rect data-node="target" x="764" y="1125" width="272" height="99" rx="12" fill="#f6e8ca" stroke="#c2d1ca" stroke-width="1.3"/>
<text x="779" y="1156" fill="#173b40" font-size="22" font-weight="700" text-anchor="start">参考条件 P</text>
<text x="779" y="1185" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">来自同一条参考动作</text>
<text x="779" y="1210" fill="#344e50" font-size="19" font-weight="400" text-anchor="start">仅选定部位和时段求差</text>
<text x="360" y="1163" text-anchor="middle" class="edge-label" fill="#866044">P̂</text>
<text x="720" y="1163" text-anchor="middle" class="edge-label" fill="#866044">P</text>
<text x="40" y="1275" fill="#4a6263" font-size="18" font-weight="400" text-anchor="start">教学重绘依据 · 原文图 2、4 及式 5–11。推理选用 MotionLCM 或 Flow 主干，最终均解码全身动作。</text>
